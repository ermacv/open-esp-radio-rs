domain = "wifi"
title = "Physical publication preconditions"
source-document = "crates/hardware/esp32s31/driver/ieee80211/FEATURES.md"
overview = "The following contracts are absent or unverified at their production boundary.\nEach corresponding path rejects activation or keeps its capability bit clear:\n\n1. MCS32 and Espressif LR descriptor, PLCP, queue, power and retry images, plus\n   an affine LR gate epoch through completion and RX normalization;\n2. RTS/CTS duration, basic-rate, power, retry and completion ownership after\n   the typed protection-policy frontier;\n3. station WDEVPWR compare/cause binding plus RF/PHY/BB/clock sleep and exact\n   wake/rollback ordering;\n4. HE-TB RU/GI/LTF/MCS/DATA_LENGTH vector and final doorbell publication;\n5. beamforming feedback memory/formatter/publication and FTM timestamp paths;\n6. channel-14 RF/MIC/regulatory setup.\n\nProtocol preparation cannot grant sequence, PN, replay, DMA or capability\npublication when the corresponding physical transaction is unproven."
source-paths = []

[[sections]]
id = "phy-overview"
domain = "phy"
title = "Shared PHY inventory contract"
source-document = "crates/hardware/esp32s31/phy/FEATURES.md"
overview = "See the [whole-radio capability map](../driver/FEATURES.md) for shared ownership,\nclock/power lifecycle and cross-protocol composition limits.\n\nThis document covers RF, analog, calibration and shared-PHY ownership below\nprotocol MAC/LL. Protocol modulation/rate support belongs to the\n[Wi-Fi](../driver/ieee80211/FEATURES.md), [Bluetooth](../driver/bluetooth/FEATURES.md) and\n[IEEE 802.15.4](../driver/ieee802154/FEATURES.md) inventories. CSI capture, CTE IQ\nsample delivery and protocol antenna-selection policy remain there.\n[Coexistence](../driver/coex/FEATURES.md) owns shared-RF arbitration coverage.\n\n`IMPLEMENTED` means the exact PHY primitive has a complete source-owned\nimplementation for the stated scope. It does not imply that every protocol\ncomposes that primitive or that RF performance has been qualified.\n\nStatus definitions:\n\n- `IMPLEMENTED`: The named bounded algorithm/transition and its stated execution boundary are source-owned.\n- `PARTIAL`: A subset or lower mechanism exists without the complete named lifecycle/composition.\n- `FAIL-CLOSED`: A typed boundary deliberately prevents the stated activation or reuse.\n- `ABSENT`: No complete source owner implements the named operation.\n\nPrimitive rows describe the retained S31 calibration graphs and supported\ninputs, not arbitrary RF configurations. Most graphs use explicit actions,\nidentity-bound completions and finite deadlines. The\n[target port](src/target_port.rs) and [target executor](src/target_executor.rs)\ncomplete MMIO, analog-I2C, PBus, measurement and delay edges; a pure transition\ncompletion is not an observation of RF quality or even proof of PLL lock."
source-paths = ["crates/hardware/esp32s31/driver/FEATURES.md","crates/hardware/esp32s31/driver/bluetooth/FEATURES.md","crates/hardware/esp32s31/driver/coex/FEATURES.md","crates/hardware/esp32s31/driver/ieee80211/FEATURES.md","crates/hardware/esp32s31/driver/ieee802154/FEATURES.md","crates/hardware/esp32s31/phy/src/target_executor.rs","crates/hardware/esp32s31/phy/src/target_port.rs"]

