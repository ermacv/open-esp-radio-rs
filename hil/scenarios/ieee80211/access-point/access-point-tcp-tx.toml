schema = 5
id = "access-point-tcp-tx"
description = "Two AP ownership epochs with exact outbound TCP delivery"
role = "investigation"
tags = ["wifi", "access-point", "network", "tcp", "tx", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 90

[wifi.workload.traffic]
kind = "tcp"
duration_seconds = 10
chunk_bytes = 8192
offer = { tx_bps = 5000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 4000000
