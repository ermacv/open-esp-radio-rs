[package]
workspace = "../../../tools/blobray"
name = "oer-vendor-scenario-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Command line of every chip's typed vendor-comparison scenarios and their reviewer commands"

[[bin]]
name = "vendor-scenarios"
path = "src/main.rs"

[dependencies]
oer-esp32c5-vendor-scenarios = { path = "../../esp32c5/scenarios" }
oer-esp32s31-vendor-scenarios = { path = "../../esp32s31/scenarios" }
oer-vendor-scenario-report = { path = "../report" }
clap = { version = "=4.5.48", features = ["derive"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "verification"
evidence = "report"
platform = "host"
host-layer = "entry"
