[package]
name = "oer-esp32s31-bluetooth-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-S31 Bluetooth LE Controller lifecycle, HCI composition and Link Layer roles"
readme = "README.md"

[features]
lifecycle-fault-injection = ["oer-esp32s31-phy/lifecycle-fault-injection"]
dtm-diagnostics = []
rx-fault-injection = []

[dependencies]
critical-section = "1.2.0"
embassy-sync = "0.8.0"
oer-bluetooth-hci = { path = "../../../../protocols/bluetooth/hci" }
oer-bluetooth-ll = { path = "../../../../protocols/bluetooth/le/ll" }
oer-esp32s31-bluetooth = { path = "../../../../hardware/esp32s31/driver/bluetooth" }
oer-esp32s31-bluetooth-memory = { path = "../../../../hardware/esp32s31/driver/bluetooth/memory" }
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../../hardware/esp32s31/phy" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-futures = "0.1.2"
oer-esp32s31-bluetooth = { path = "../../../../hardware/esp32s31/driver/bluetooth", features = ["test-support"] }
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "role"
platform = "chip"
chip = "esp32s31"
