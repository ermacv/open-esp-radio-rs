schema = 5
id = "udp-rx-ht40-core0-probe512-diagnostic"
description = "Same-image HT40 RX with 512-us masked continuation diagnostic"
role = "investigation"
tags = ["diagnostic", "udp", "station", "rx", "ht40", "split-core", "core0", "coarse-cycles", "masked-probe-ab", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.datapath]
rx_continuation = "delayed-probe512-diagnostic"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1472
offer = { rx_bps = 140000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 90000000
maximum_idle_channel_utilization_255 = 64
