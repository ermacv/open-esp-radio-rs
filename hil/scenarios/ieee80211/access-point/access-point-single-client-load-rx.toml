schema = 5
id = "access-point-single-client-load-rx"
description = "Observer-free sustained single-client AP inbound performance baseline"
role = "investigation"
repetitions = 1
tags = ["characterization", "wifi", "access-point", "network", "single-client", "load", "rx", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "performance"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1400
offer = { rx_bps = 16000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 15200000
