schema = 5
id = "access-point-load-tx"
description = "Sustained two-flow AP outbound fairness baseline with exact delivery"
role = "investigation"
tags = ["wifi", "access-point", "network", "load", "tx", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 16
payload_bytes = 1400
offer = { tx_bps = 16000000 }

[wifi.workload.traffic.criteria]
exact_delivery = true
minimum_tx_bps = 30400000
minimum_bps_per_flow = 15200000
maximum_flow_skew_percent = 20
