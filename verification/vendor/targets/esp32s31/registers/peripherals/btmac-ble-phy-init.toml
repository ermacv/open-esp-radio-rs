schema = 2

[[peripherals]]
name = "BTMAC_BLE_PHY_INIT"
description = """
ESP32-S31 BTMAC words initialized by the complete BLE PHY register-init
function. The function identity is supported by the matching ble_phy.c object
layout from the ESP32-C61 ecosystem library, while every address, mask and
value below comes only from the ESP32-S31 artifact. Neutral INIT names retain
the exact operation without promoting the cross-chip hint to hardware truth."""
baseAddress = 0x20101400

[[peripherals.registers]]

[peripherals.registers.register]
name = "INIT_ZERO_0074"
description = "BLE PHY register initialization writes the complete zero image. Inner hardware semantics remain unknown."
addressOffset = 0x74
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "INIT_IMAGE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "INIT_CONTROL_00B4"
description = "BLE PHY register initialization first applies a fresh-read RMW with mask 0x00020000, preserving only bit 17 and clearing every other bit. Its conditional tail later performs a second fresh-read RMW that sets exactly bits 11, 15, 20 and 24 with mask 0x01108800. The five evidenced bit positions have neutral initialization names; all omitted bit ranges retain unknown hardware semantics."
addressOffset = 0xB4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "INIT_SET_11"
description = "The conditional initialization tail sets bit 11. Its hardware meaning remains unknown."
bitOffset = 11
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "INIT_SET_15"
description = "The conditional initialization tail sets bit 15. Its hardware meaning remains unknown."
bitOffset = 15
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "INIT_PRESERVE_17"
description = "The first initialization RMW preserves bit 17 while clearing every other bit. Its hardware meaning remains unknown."
bitOffset = 17
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "INIT_SET_20"
description = "The conditional initialization tail sets bit 20. Its hardware meaning remains unknown."
bitOffset = 20
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "INIT_SET_24"
description = "The conditional initialization tail sets bit 24. Its hardware meaning remains unknown."
bitOffset = 24
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "INIT_ONES_00B8"
description = "BLE PHY register initialization writes the complete all-ones image."
addressOffset = 0xB8
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "INIT_IMAGE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "INIT_CONTROL_00C4"
description = "The conditional tail of complete BLE PHY register initialization sets bit 9 through a fresh-read RMW. All other bits are preserved and their meanings remain unknown."
addressOffset = 0xC4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "INIT_ENABLE_9"
bitOffset = 9
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "INIT_VALUE_0138"
description = "BLE PHY register initialization writes the finite complete image 0x0000065B."
addressOffset = 0x138
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "INIT_IMAGE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "LC_TX_ON_DELAY_CONFIG"
description = "BLE transmit timing configuration. ble_tx_config_check independently prints byte zero as lc_tx_on_delay; BLE PHY initialization writes the same runtime-derived byte image into bytes zero and two."
addressOffset = 0x250
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "LC_TX_ON_DELAY"
description = "Low byte printed as lc_tx_on_delay by complete ble_tx_config_check. BLE PHY initialization stores a configuration byte minus one."
bitOffset = 0
bitWidth = 8

[[peripherals.registers.register.fields]]
name = "INIT_DUPLICATE_BYTE"
description = "BLE PHY initialization receives the same configuration-byte-minus-one image as LC_TX_ON_DELAY. No independent semantic name is claimed."
bitOffset = 16
bitWidth = 8

