schema = 2

[[peripherals]]
name = "SHARED_RADIO_INIT_CONTROL"
description = "One physical radio word independently reached by Wi-Fi MAC initialization and Bluetooth receive setup. The owner is protocol-neutral because the two consumers update disjoint fields through fresh-read RMW operations; the name records the observed setup context without assigning an undocumented electrical meaning."
baseAddress = 0x20104C24

[[peripherals.registers]]

[peripherals.registers.register]
name = "CONTROL"
description = "Complete mac_txrx_init replaces the low twelve bits with 0x0F0. Complete bt_bb_rx_set independently clears bit 31. Bits 30:12 remain unnamed."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "WIFI_INIT_LOW_IMAGE_UNKNOWN"
description = "Complete mac_txrx_init replaces this field with the finite image 0x0F0 while preserving bits 31:12."
bitOffset = 0
bitWidth = 12

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFF

[[peripherals.registers.register.fields]]
name = "BT_RX_SETUP_BIT_31_UNKNOWN"
description = "Complete bt_bb_rx_set clears this bit through a fresh-read RMW while preserving bits 30:0. Its hardware meaning remains unknown."
bitOffset = 31
bitWidth = 1

