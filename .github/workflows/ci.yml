name: CI

# Standard Cargo checks for every push to any branch. Pull requests come from
# branches of this repository, whose pushes already run this workflow.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A branch needs only its newest commit: rapid agent pushes cancel the run
# they supersede. On main, every merged pull request is checked to the end,
# since the session start and the gate report main's verdicts, and GitHub
# keeps only the newest merge pending behind a started run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: '0'
  # A fresh runner has no Cargo cache; the repository configuration keeps
  # Cargo offline for local builds.
  CARGO_NET_OFFLINE: 'false'
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  # Observe records proposed reuse while the complete CI still executes.
  CI_REUSE_MODE: ${{ vars.CI_REUSE_MODE || 'observe' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Few jobs, each a sequence sharing one build cache: a free account runs 20
# jobs at once across every workflow, and every job pays for its checkout and
# cache restore. What each job checks is the check registry's
# (`cargo xtask check tier --list`, tools/xtask/src/registry.rs): a job only
# prepares its runner and runs its checks up to the full tier.
jobs:
  # The registry computes input identities; only successful matching push
  # runs can cover a job. API/retention misses cause execution. A branch
  # push skips the audited checks (`registry::SCOPED_IN_CI`) its change from
  # the merge base with main does not reach, and a job left with none; main
  # and manual runs check everything.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run_host: ${{ steps.plan.outputs.run_host }}
      checks_host: ${{ steps.plan.outputs.checks_host }}
      run_architecture: ${{ steps.plan.outputs.run_architecture }}
      checks_architecture: ${{ steps.plan.outputs.checks_architecture }}
      run_firmware: ${{ steps.plan.outputs.run_firmware }}
      checks_firmware: ${{ steps.plan.outputs.checks_firmware }}
      run_models: ${{ steps.plan.outputs.run_models }}
      checks_models: ${{ steps.plan.outputs.checks_models }}
      run_isa_conformance: ${{ steps.plan.outputs.run_isa_conformance }}
      checks_isa_conformance: ${{ steps.plan.outputs.checks_isa_conformance }}
      run_images: ${{ steps.plan.outputs.run_images }}
      checks_images: ${{ steps.plan.outputs.checks_images }}
      run_verification: ${{ steps.plan.outputs.run_verification }}
      checks_verification: ${{ steps.plan.outputs.checks_verification }}
      run_example_link: ${{ steps.plan.outputs.run_example_link }}
      checks_example_link: ${{ steps.plan.outputs.checks_example_link }}
      run_images_correctness: ${{ steps.plan.outputs.run_images_correctness }}
      checks_images_correctness: ${{ steps.plan.outputs.checks_images_correctness }}
      run_architecture_clippy: ${{ steps.plan.outputs.run_architecture_clippy }}
      checks_architecture_clippy: ${{ steps.plan.outputs.checks_architecture_clippy }}
      run_host_lint: ${{ steps.plan.outputs.run_host_lint }}
      checks_host_lint: ${{ steps.plan.outputs.checks_host_lint }}
      merge_base: ${{ steps.plan.outputs.merge_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-tools-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ci-tools-${{ runner.os }}-
      - name: Install the conformance tools whose versions enter the plan
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - id: plan
        run: cargo xtask ci prepare --workflow ci --output "$RUNNER_TEMP/ci-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  # The tests of the root and tidy workspaces on the host; their lints and
  # policies run in `host-lint`.
  host:
    needs: prepare
    if: needs.prepare.outputs.run_host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job host
      - run: cargo xtask --verbose check tier full --job host --checks "${{ needs.prepare.outputs.checks_host }}"

  # The host lints and policies of the registry's `host-lint` job: tidy,
  # formatting, locks, Clippy, feature sets, metadata and network
  # boundaries; the tests run in `host`.
  host-lint:
    needs: prepare
    if: needs.prepare.outputs.run_host_lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: host-lint-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job host-lint
      - run: cargo xtask --verbose check tier full --job host-lint --checks "${{ needs.prepare.outputs.checks_host_lint }}"

  # The layer, facade, unsafe-code, interrupt, zeroed-section and
  # PAC-access boundaries, and the chip-target doctests; the chip-target
  # Clippy runs in `architecture-clippy`.
  architecture:
    needs: prepare
    if: needs.prepare.outputs.run_architecture == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: architecture-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: architecture-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job architecture
      - run: cargo xtask --verbose check tier full --job architecture --checks "${{ needs.prepare.outputs.checks_architecture }}"

  # Chip-target Clippy of every production feature profile; a branch
  # whose change reaches none skips it.
  architecture-clippy:
    needs: prepare
    if: needs.prepare.outputs.run_architecture_clippy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: architecture-clippy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: architecture-clippy-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job architecture-clippy
      - run: cargo xtask --verbose check tier full --job architecture-clippy --checks "${{ needs.prepare.outputs.checks_architecture_clippy }}"

  # Code built for a chip: the final HIL images' runtimes type-checked
  # exactly as the image builder compiles them, every chip's examples with
  # their image flags, the firmware workspaces, PACs and HALs the chip
  # profiles name, and the
  # compiled PHY library.
  firmware:
    needs: prepare
    if: needs.prepare.outputs.run_firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            hil/targets/*/target
            verification/*/hardware/*/target
          key: firmware-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: firmware-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job firmware
      - run: cargo xtask --verbose check tier full --job firmware --checks "${{ needs.prepare.outputs.checks_firmware }}"

  # Every register publication and every qualification program.
  models:
    needs: prepare
    if: needs.prepare.outputs.run_models == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: models-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: models-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job models
      - run: cargo xtask --verbose check tier full --job models --checks "${{ needs.prepare.outputs.checks_models }}"

  # Blobray's RISC-V executor against the pinned RISC-V architectural tests,
  # with the Sail formal model as the reference. Needs clang and lld.
  isa-conformance:
    needs: prepare
    if: needs.prepare.outputs.run_isa_conformance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/blobray/target
          key: isa-conformance-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', 'tools/blobray/cli/tests/riscv_conformance/inputs.toml') }}
          restore-keys: isa-conformance-${{ runner.os }}-
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job isa-conformance
      - run: cargo xtask --verbose check tier full --job isa-conformance --checks "${{ needs.prepare.outputs.checks_isa_conformance }}"

  # The final performance HIL image, built by the image pipeline with every
  # gate and the Blobray target audit; the correctness image, the boot smoke
  # and the station example have jobs of their own. Needs the toolchain's
  # LLVM tools.
  images:
    needs: prepare
    if: needs.prepare.outputs.run_images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/blobray/target
          key: images-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: images-${{ runner.os }}-
      - name: Put the toolchain's LLVM tools on PATH
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job images
      - run: cargo xtask --verbose check tier full --job images --checks "${{ needs.prepare.outputs.checks_images }}"

  # The final correctness image and the staged boot smoke, on a runner of
  # their own: on one runner the image builds wait for each other.
  images-correctness:
    needs: prepare
    if: needs.prepare.outputs.run_images_correctness == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/blobray/target
          key: images-correctness-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: images-correctness-${{ runner.os }}-
      - name: Put the toolchain's LLVM tools on PATH
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job images-correctness
      - run: cargo xtask --verbose check tier full --job images-correctness --checks "${{ needs.prepare.outputs.checks_images_correctness }}"

  # The station example built, audited and encoded into a bundle.
  example-link:
    needs: prepare
    if: needs.prepare.outputs.run_example_link == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/blobray/target
          key: example-link-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: example-link-${{ runner.os }}-
      - name: Put the toolchain's LLVM tools on PATH
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job example-link
      - run: cargo xtask --verbose check tier full --job example-link --checks "${{ needs.prepare.outputs.checks_example_link }}"

  # The provenance of every cited vendor function against the pinned vendor
  # artifacts, which the check fetches, and the vendor evidence index of every
  # verified chip (`vendor-evidence`): ESP-IDF prepared, the firmware inputs
  # built from their recipes, the probes built and every vendor scenario and
  # host stand run, compared on a branch with the index main computed at its
  # merge base.
  verification:
    needs: prepare
    if: needs.prepare.outputs.run_verification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      reusable: ${{ steps.environment.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/*
            !target/vendor-firmware
            !target/blobray-research
            !target/vendor-evidence-base
          key: verification-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', 'verification/*/artifacts.toml') }}
          restore-keys: verification-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - id: environment
        run: cargo xtask ci check-environment --workflow ci --job verification
      # A branch's `vendor-evidence` compares its index with the one `main`
      # published nearest its merge base (registry::VENDOR_EVIDENCE_BASE):
      # the index of the merge base or, while that run is queued, running or
      # was cancelled, of the latest earlier `main` commit that has one, each
      # of whose changes passed the same comparison. Nothing waits for main.
      # Without an index among the 30 commits up to the merge base the
      # comparison is skipped and says so. The directory never outlives one
      # run, so no other base is compared.
      - name: Fetch the merge base's vendor evidence index
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.prepare.outputs.merge_base }}
          CHECKS: ${{ needs.prepare.outputs.checks_verification }}
        run: |
          rm -rf target/vendor-evidence-base
          [ -n "$BASE" ] || exit 0
          case ",$CHECKS," in
            ,all, | *,vendor-evidence,*) ;;
            *) exit 0 ;;
          esac
          commits=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$BASE&per_page=30" --jq '.[].sha')
          for commit in $commits; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=vendor-evidence-$commit" --jq '
              [.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0]
              | .workflow_run.id // empty')
            [ -n "$run" ] || continue
            gh run download "$run" --name "vendor-evidence-$commit" --dir target/vendor-evidence-base
            echo "the vendor evidence index main published at $commit is the comparison base of $BASE"
            exit 0
          done
          echo "main published no vendor evidence index among the 30 commits up to $BASE: the comparison is skipped"
      - run: cargo xtask --verbose check tier full --job verification --checks "${{ needs.prepare.outputs.checks_verification }}"
      # `main` publishes its index as the comparison base of later branches.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendor-evidence-${{ github.sha }}
          path: target/verification/*/evidence
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # Every planned job passed or has explicit successful input coverage.
  ci-ok:
    if: always()
    needs: [prepare, host, host-lint, architecture, architecture-clippy, firmware, models, isa-conformance, images, images-correctness, example-link, verification]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-tools-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ci-tools-${{ runner.os }}-
      - name: Verify every planned result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: cargo xtask ci verify --workflow ci --output "$RUNNER_TEMP/ci-proof.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-proof
          path: ${{ runner.temp }}/ci-proof.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
