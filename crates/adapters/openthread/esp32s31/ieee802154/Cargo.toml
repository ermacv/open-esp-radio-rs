[package]
name = "oer-esp32s31-ieee802154-openthread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenThread radio for the ESP32-S31 IEEE 802.15.4 runtime"

[dependencies]
embassy-sync = "0.8.0"
heapless = "0.9.3"
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal" }
oer-espressif-ieee802154-runtime = { path = "../../../../runtime/espressif/ieee802154" }
oer-espressif-ieee802154-engine = { path = "../../../../hardware/espressif/ieee802154/engine" }
oer-ieee802154 = { path = "../../../../protocols/ieee802154" }
# The fork's radio trait, without the OpenThread C library.
openthread-radio = { git = "https://github.com/ermacv/openthread", rev = "13538da6b576ed8f1316adbad2196c06e4cf7c99", default-features = false }

[dev-dependencies]
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = ["generic-queue-64", "std"] }
oer-espressif-ieee802154-runtime = { path = "../../../../runtime/espressif/ieee802154", features = ["model"] }
oer-espressif-ieee802154-engine = { path = "../../../../hardware/espressif/ieee802154/engine", features = ["model"] }

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "adapter"
platform = "chip"
chip = "esp32s31"
