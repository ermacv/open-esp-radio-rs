[[sources]]
id = "BLOB_LIBPP_MAC_TXRX_CALLBACKS"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_ctl.o hal_he_set_mac_delay (size 0x180), hal_he_set_ack_rate (size 0x156), and hal_he_set_bbrxhung_time (size 0x1e), reached from complete hal_mac.o mac_txrx_init with zero arguments for the latter two. g_wifi_osi_funcs layout is independently pinned by esp-wifi-sys commit 72b97e6fe55307aa92c8c1edf3fdb3f4df816e80, esp-wifi-sys-esp32s31/src/include.rs sha256 de6ecd8853cc1925389f89e768a8a865ad58db6025f94a63584096eb8ad5f1dc and c/headers/esp32s31/esp_private/wifi_os_adapter.h sha256 08fb73f76da7e6800c42dbff2fb724dff5205e1c8262e969da0f391be21f1eae: offset 0x04 is _env_is_chip and offset 0x144 is _random. esp-hal branch esp32s31-async-platform commit 07de55443721de6fa32e7fb721f0fa7996e604d3, esp-radio/src/wifi/os_adapter/mod.rs sha256 cf8439e907161228875d852eb1e4cfa45628b62532bfbe4bc8adcebd8c6112ed and esp-radio/src/common_adapter.rs sha256 6e9ef6acc2236d29e7b2ef2ed957eaa878c8f5f767a77ecff19b6711e135ab34 prove the real-chip adapter returns true and sources _random from esp_hal::rng::Rng. The on-chip blob path uses that value modulo 11; the previously transcribed fixed values were the FPGA branch. Diagnostic log calls after hardware writes do not alter MMIO and are omitted."

[[sources]]
id = "BLOB_LIBPP_MAC_TXRX_INIT_SUFFIX"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac.o mac_txrx_init body, direct suffix offsets 0xee..0x16e after the hal_he_set_mac_delay, hal_he_set_ack_rate and hal_he_set_bbrxhung_time calls. It proves nine fresh-read RMW edges ending with RX_CONTROL walker-disable bit 31 clear."

[[sources]]
id = "BLOB_LIBPP_HAL_INIT_RX_POLICY"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac.o hal_init offsets 0x56..0x90 and complete hal_mac_rx_set_policy body, size 0xd2. For each of four queues hal_init performs four direct fresh-read RMWs at 0x201040d8 + 4*q, then calls hal_mac_rx_set_policy(q,0,0,0). Queues 0..2 each add five leaf RMWs across filter, BSSID-high and interface-address-high; queue 3 is rejected by the leaf after its four direct RMWs. The complete cold transaction is therefore 31 distinct RMW edges."

[[sources]]
id = "BLOB_LIBPP_HAL_INIT_TAIL"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac.o hal_init offsets 0xcc..0x12a, complete hal_mac_rx.o hal_mac_set_rxbuf_reload_use_hw_beacon_enable size 0x14, and complete hal_tsf.o hal_timer_update_by_rtc size 0x38. This bounded tail stores interrupt mask 0x19a879e0, repeats the bit-28 set at 0x20104c8c, performs two separate byte RMWs at 0x20104098, sets RX_CONTROL bit 27, then enables RTC timer update and publishes an 18-bit slow-clock calibration. g_wifi_osi_funcs offset 0x148 is independently pinned as _slowclk_cal_get by esp-wifi-sys commit 72b97e6fe55307aa92c8c1edf3fdb3f4df816e80, esp-wifi-sys-esp32s31/src/include.rs sha256 de6ecd8853cc1925389f89e768a8a865ad58db6025f94a63584096eb8ad5f1dc and c/headers/esp32s31/esp_private/wifi_os_adapter.h sha256 08fb73f76da7e6800c42dbff2fb724dff5205e1c8262e969da0f391be21f1eae. esp-hal branch esp32s31-async-platform commit 07de55443721de6fa32e7fb721f0fa7996e604d3, esp-radio/src/wifi/internal.rs sha256 252cfe7cfdcdb104a91596fcbc173af6e07432b907480df746d0599463c6cdc7 and esp-radio/src/wifi/os_adapter/mod.rs sha256 cf8439e907161228875d852eb1e4cfa45628b62532bfbe4bc8adcebd8c6112ed prove that S31 installs this callback and currently returns zero with an explicit TODO rather than reading extra peripheral MMIO."

[[sources]]
id = "BLOB_LIBPP_HAL_INIT_COEX"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac.o hal_init offsets 0x12e..0x190; complete hal_coex.o hal_coex_pti_init size 0x12, hal_set_rx_active_pti size 0x14, hal_set_rx_ack_pti size 0x1a, hal_set_wifi_default_pti size 0x14, hal_set_ofdma_sequence_pti size 0x13a, hal_set_tb_pti size 0xb4, hal_set_beamf_pti size 0x34 and hal_set_beamf_mt_pti size 0x32; complete hal_mac_ctl.o hal_coex_enable_default_pti size 0x18. These bodies prove seventeen separate cold RMW edges. The OSI callback at offset 0x1a8 is _coex_pti_get in the independently pinned S31 esp-wifi-sys layout. The esp-hal no-coex stub at commit 07de55443721de6fa32e7fb721f0fa7996e604d3 returns zero without initializing its output pointer. hal_init preinitializes its ordinary RX outputs, but hal_set_ofdma_sequence_pti does not initialize twelve stack outputs before reading them; reproducing that disabled-feature path would therefore publish indeterminate data and is deliberately rejected in favor of an explicit platform PTI source."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_INIT_PREFIX"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_ctl.o hal_he_init offsets 0x00..0x66, complete hal_init_bf size 0xd4, complete hal_he_set_bf_report_rate size 0x7c reached with arguments (1,0x10,0,0), and complete hal_init_tb_tx size 0x1e. This bounded graph stops immediately before the hal_init_tx_pwr call at parent offset 0x6a. It proves twenty-two separate fresh-read RMW edges and a final volatile read at 0x20107128. In particular, parent clears bit 31 and then bits 31:30 at 0x20104c80 separately; hal_init_bf replaces the entire low byte at 0x20104c78 rather than preserving bit zero; and hal_init_tb_tx clears bits 15 and 14 at 0x20104e04 through separate RMWs."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_UL_MU_OMC"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e, complete hal_mac_ctl.o hal_he_set_ul_mu size 0x3a; _oracles/libnet80211.a sha256 92550813de20ed0d51110dbd72b646e891a86a8a2f81fa53714ebf2ebf9c8f40, complete ieee80211_he.o wifi_htc_omc_txcb size 0x108 and its pinned format string. The callback extracts HT-Control bit 11 as ul_mu_disable and bit 17 as ul_mu_data_disable. The HAL leaf independently copies those arguments to 0x20104c80 bits 31 and 30 respectively through two fresh-read RMWs."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_TB_DIAGNOSTICS"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_ctl.o hal_he_get_rx_trigger_cnt size 0x0e, hal_he_get_tb_times_cnt size 0x0e and hal_he_get_tb_qosnull_cnt size 0x0c; complete hal_debug.o get_txtb_sym_num size 0x10, get_txtb_psdu_len size 0x0e, get_txtb_min_subframe size 0x10, get_txtb_time_pe size 0x0c, dbg_read_axtb_diag size 0x102 and esp_test_get_hw_tb_statistics size 0x56. Field semantics and spellings for 0x201044f4..0x20104500 come from the complete debug function's own WDEVAXTBDIAG0..3 format strings and matching instruction-exact shifts/masks."

[[sources]]
id = "BLOB_LIBPP_HAL_BF_CONFIG"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_ctl.o hal_init_bf size 0xd4, hal_he_set_bf_report_rate size 0x7c and hal_he_set_ersu_ack_rate size 0x4e; complete hal_debug.o dbg_read_rx_misc WDEVBEAMFORMCONF decode at offsets 0x3c0..0x418 and dbg_read_bfr_rate size 0x148 with its QAM16/QPSK/BPSK format strings; and complete trc.o trc_set_bf_report_rate size 0x52. The decoder proves 0x20104c78 bits 0 through 22. The report-rate decoder proves three 9-bit profiles at 0x20104464, high to low as QAM16, QPSK and BPSK; the setter and trc policy prove each profile packs normalized rate bits 4:0, signal mode bits 6:5, DCM bit 7 and ER-SU bit 8. The trc leaf then tail-calls hal_he_set_ersu_ack_rate: its four fresh-read byte RMWs publish 0x80 for argument zero or 0xa0 for nonzero at 0x20104404."

[[sources]]
id = "BLOB_LIBPP_TEST_BF_SET_FEEDBACK"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete test_hal.o esp_test_bf_set_feedback size 0x182. The zero-enable branch clears 0x20104e00 bit 23. The enabled path sets bit 23, clears bits 22:20, replaces argument fields 13:7 and 6:0, and applies all bounded selector branches zero through sixteen across bits 22:14 plus 0x2010409c bits two and three. This is an instruction-exact test configuration leaf, not evidence that production sounding calls it or that selector numeric meanings are known."

[[sources]]
id = "BLOB_LIBPP_HAL_BF_DEBUG_CONTROL"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_disable_report_cbf size 0x42. A nonzero disable argument clears 0x20104c78 bit 20; zero sets it. The function then reads back and logs that same bit. Together with dbg_read_rx_misc label HE_BEAM_ENA, this proves the compressed-beamforming-report output polarity without creating a new address."

[[sources]]
id = "BLOB_LIBPP_BFR_AVERAGE_SNR"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o esp_test_get_bfr_avgsnr size 0x86 and its pinned \u201cAverage SNR\u201d format string. It reads 0x20105f94 low byte as stream-zero code, treats 0x7f as the special greater-than-or-equal case, and otherwise computes (code + 88.0) * 0.25 dB using the complete function-local float constants."

[[sources]]
id = "BLOB_LIBPP_DBG_READ_TX_SIG"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_tx_sig size 0x350 and its pinned HT, VHT, HE, HT20-length and HT40-length format strings. The complete body selects interpretation from per-queue PLCP_FORMAT, then proves all documented shifts/masks at 0x201054e8..0x20105510-q*0x7c and the matching reverse-addressed queue-protection word."

[[sources]]
id = "BLOB_LIBPP_DBG_DUMP_RX_PPDU"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_dump_rx_ppdu size 0xa36, extracted object sha256 2d3eb6f1123aba62387d98864ecfe1ececc507e52f7f8b72a3efaf40cc5042e5. In the HE-SU and HE-extended-range-SU branch at offsets 0x1b0..0x280, instructions at 0x1e6..0x1ec shift the captured HE-SIG-A1 word right by 23 and mask three bits. The pinned format string at section offset 0x1b0 names that value nsts_and_midamble_periodicity."

[[sources]]
id = "BLOB_LIBPP_DEBUG_STATISTICS_CONTROL"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_clr_hw_count size 0x08 and reachable esp_test_clr_hw_statistics size 0x30. The wrapper tail-calls the leaf, which sets 0x20104c00 bit 16, pulses 0x20104308 bit 0 high then low, and clears 0x20104c00 bit 16 using fresh reads before every write."

[[sources]]
id = "BLOB_LIBPP_HAL_RX_DEBUG_COUNTERS"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_color_collision size 0x64 and dbg_read_rx_count size 0x21a, including their pinned format strings. The former proves the BSS-color bitmap words at 0x20104040/44 and RX_HE_BSS_COLOR_CONF fields at 0x20104048. The latter proves 39 named RX statistics, their sparse addresses and widths, including signed high-halfword CFO multiplied by 40 and the hang/panic words at 0x20104c64 and 0x20104e18/1c."

[[sources]]
id = "BLOB_LIBPP_HAL_RX_MISC_DEBUG"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_rx_misc size 0x42a and its pinned .rodata.dbg_read_rx_misc.str1.4 strings. The instruction-exact loads, shifts and masks decode WDEVRX_ABORT, WDEVDAHI/DALO, WDEVBSSIDHI/LO, WDEVTXRX_TAB, WDEV_HE_BSSID0_CONF, WDEVAXOPTIONS1/2, WDEVRXCTR_BSSIDLIST, WDEVRX_POWER_SAVE_CONF and WDEVBEAMFORMCONF at their exact 0x20104xxx addresses."

[[sources]]
id = "BLOB_LIBPP_HAL_RESPONSE_RATE_DEBUG"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_ack_rate and dbg_read_cts_rate, each size 0x11e, including their pinned ACK_TAB0/1, ACK_SCCKTAB, CTS_TAB0/1 and CTS_SCCKTAB strings. Their instruction-exact byte extraction proves six consecutive response-rate words at 0x2010444c..0x20104460 and the named byte lanes."

[[sources]]
id = "BLOB_LIBPP_HAL_WDEV_DELAY_DEBUG"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_wdevdelay size 0x5c and its pinned WDEVDELAY/WDEVDELAY1 format strings. It reads 0x20104c58 and 0x20104c54 and extracts bits 20:10 as WDEV_RXCCK_DELAY and WDEV_TXCCK_DELAY respectively."

[[sources]]
id = "BLOB_LIBPP_HAL_TX_POWER_INIT"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_tx.o hal_init_tx_pwr size 0x50 and hal_get_tx_pwr size 0x1a; complete hal_mac_ctl.o hal_init_tb_power size 0x1a0, hal_init_imrsp_power size 0x2f8, hal_mac_set_tb_max_pwr size 0x160 including both complete relocation jump tables, and hal_init_tb_ru_power size 0xba. The parent queries rates 0 through 42 in order into 43 adjacent two-byte entries. Its three children publish 56 separate fresh-read RMW edges at 0x20104408..0x20104448. Migration source is the Git parent of promotion commit f233006, migration/esp32s31-hybrid-runtime/src/lmac.rs: it consumed this same exported 86-byte s_phy_get_max_pwr table for open legacy and HT TX but did not reproduce its builder."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_INIT_SUFFIX"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_ctl.o hal_he_init offsets 0x7a..0x19e and complete reached hal_he_set_ersu, hal_he_set_ersu_ack_rate, hal_he_set_bcast_ru, hal_he_set_uora_parameter, hal_he_enable_dump_complete_hesigb, hal_vht_enable_bwsignaling_rts, hal_he_clr_multi_bssid and hal_he_set_co_hosted_bss leaves, plus complete hal_mac_tx.o hal_set_tx_min_pwr size 0x1a. It proves 163 writes/RMWs and two guard reads after the debug power traversal. In particular ER-SU ACK bytes are four separate RMWs, feature bits 1 and 0 at 0x20104c88 are separate, the 120-word scratch range is 0x201055f0..0x201057cc, and the parent/clear/co-hosted sequence deliberately repeats multi-BSSID fields."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_SET_DEFAULT_PE"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_ctl.o hal_he_set_default_pe body, size 0x14. It replaces only bits 2:0 at 0x20104c80 with its three-bit argument."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_BSR_INIT"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_ctl.o hal_he_bsr_init body, size 0x50, plus complete hal_he_bsr_ctrl and hal_he_get/set_bsr_acihigh_comp_method leaves. It proves eight ordered fresh-read RMW edges: set 0x20104c7c bits 15, 8, 7 and 6; set 0x20104c80 bit 27; clear 0x20104c7c bits 5 and 4; then replace bits 1:0 with one."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_BSR_DEBUG"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_bsr_info size 0x268 and dbg_tb_ignore_cca_enable size 0x3c, including their pinned format strings. The first function decodes WDEVTXQBSR_CTRL, eight interleaved hardware/software BSR values, WDEVAXOPTIONS1 and WDEVAXOPTIONS2. The second proves that 0x20104c7c bit 12 set means TB cares about CCA and NAV, while clear means the debug ignore mode."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_BSR_STATUS"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_ctl.o hal_he_get_hw_txq_bsr size 0x14. It reads 0x20104d74 plus eight times the queue/TID index and returns the low twenty bits."

[[sources]]
id = "BLOB_LIBPP_MAC_TX_SET_TB"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_tx.o mac_tx_set_hesig size 0x324, mac_tx_set_tb size 0x146, mac_tx_set_mplen size 0x2c4 and hal_mac_tx_clr_mplen size 0x1aa; complete if_hecfg.o wifi_he_get_hetb_tid_bitmap size 0x46 and its four-byte table [0x01,0x81,0xa1,0xa3]; complete hal_he_common.o hal_he_get_mplen_addr_start and hal_he_get_mplen_addr_end, each size 0x4a, and their tables. mac_tx_set_hesig calls mac_tx_set_tb unless descriptor-state word offset 0x30 bit 16 is set. The setter gates the QoS TID against the configured bitmap, allocates and writes a linked MPDU-length entry for every DMA frame, writes the terminal link index at 0x201054fc-q*0x7c, enables 0x20104dbc+4*q bit eight, constructs WDEVTXQ_CONF1 at 0x20104d68-0x10*q, replaces the low twenty software-BSR bits at 0x20104d78+8*q with its queued-byte accumulator, and finally ORs 1<<q into 0x20104db8. The default configuration value three returns bitmap 0xa1, selecting TIDs 0, 5 and 7. For that non-single-TID policy the allocator ranges are q0 32..63, q1 64..95, q2 0..31 and q3 96..119. The clear leaf walks and frees the software bitmap chain, while its only hardware-visible cleanup clears queue-control TB_ENA."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_MU_EDCA_DEBUG"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_muedca_timer size 0x70, dbg_read_txq_conf1 size 0x86 and dbg_read_txq_conf2 size 0x80, including their pinned format strings. They decode four WDEVMUEDCA_TIMER words at 0x20104dbc..0x20104dc8, eight reverse-addressed WDEVTXQ_CONF1 words at 0x20104cf8..0x20104d68 and four reverse-addressed WDEVTXQ_CONF2 words at 0x20104d34..0x20104d64. The strings identify TID, TB enable, MU-EDCA timer select, MPDU-length link address, minimum TX power, three channel-width minimum-MPDU lengths, software RTS/CTS, timer/reset/reached and AIFS fields."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_TRIGGER_RX_DIAGNOSTICS"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_ax_diag size 0x466 and its pinned WDEVAXDIAG0..9 format strings. The function reads 0x20104508..0x2010452c and decodes Trigger state, TB APEP length, EOF/pre-FEC padding, matched user RU/MCS/DCM/FEC/AID, common GI/LTF/bandwidth/spatial-reuse fields, TRS and packet counts. Its own warning says the words are not reliable after a following RX frame, so the PAC treats them as a best-effort diagnostic snapshot rather than durable state."

[[sources]]
id = "BLOB_LIBPP_DBG_READ_RX_BA"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_rx_ba size 0x9a and its pinned WDEVTXQBA_BMHI/BMLO/SSC/TID/TAHI/TALO strings. Despite its symbol name, the function walks eight TX BlockAck result banks from 0x20105528 downward with stride 0x7c."

[[sources]]
id = "BLOB_LIBPP_DBG_DUMP_TXQ_TXINFO"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_dump_txq_txinfo size 0x70 and its pinned WDEVTXQ_TXINFO/BA/ACK/ACK_TID/LAST_TX_IS_TB/TB_PACK_SENT string. It reads the queue-information word at 0x20105524-q*0x7c and the upper result fields of 0x20105534-q*0x7c."

[[sources]]
id = "BLOB_LIBPP_DBG_READ_INTERNAL_TXBA"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_internal_txba size 0x66 and its pinned WDEVTXBA bitmap, transmitter-address, fragment, SSN and TID strings. It reads five consecutive words at 0x2010429c..0x201042ac."

[[sources]]
id = "BLOB_LIBPP_DBG_READ_KEY_ENTRY"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_key_entry size 0x1cc and its pinned key-entry strings. The queue selector reads 0x201054d8-q*0x7c bits 22:17 and 24:23, then indexes the ten-word key table at 0x20105800 with stride 0x28 and the validity bitmap at 0x20104814."

[[sources]]
id = "BLOB_LIBPP_DBG_READ_TX_MPLEN"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_tx_mplen size 0x120 and its pinned MPDU_LEN/NEXT strings. It reads 120 consecutive words at 0x201055f0..0x201057cc and extracts bits 13:0 and 20:14."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_OBSS_NARROW_BAND_RU"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_ctl.o hal_he_disable_obss_narrow_bw_ru size 0x3e. A nonzero argument writes 0xfffff to 0x20104e9c, sets 0x20104ea0 bits 8:4 through one fresh-read RMW and bit 0 through another; zero writes zero and clears those two groups in the same order. The aggregate disabled/enabled meaning is symbol-exact, while individual bitmap/class meanings remain approximate."

[[sources]]
id = "BLOB_LIBPP_DBG_READ_TX_POWER"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_debug.o dbg_read_tx_power size 0xcc. The unconditional hal_he_init child queries PHY rates 0 through 25 while skipping rate 4, for 25 discarded two-byte results, then only reads the MAC table and logs. Through ROM_REV0_PHY_GET_MAX_PWR those otherwise diagnostic queries still cause fifty ordered RMWs at 0x20107428."

[[sources]]
id = "BLOB_LIBPP_HAL_ANTENNA_INIT"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_tx.o hal_attenna_init body, size 0x5e. The symbol spelling is preserved from the archive. Its first reverse traversal clears bit 2 at eight words from 0x20105510 down to 0x201051ac with stride 0x7c. Its second reverse traversal clears bit 3, sets bit 5 and clears bit 4 through three separate fresh-read RMWs per word. It finishes with separate bit-2-clear and bit-5-set RMWs at 0x201042b0. Complete hal_mac_rate_autoack_init in the same object is independently verified as a two-byte ret-only no-op."

[[sources]]
id = "BLOB_LIBPP_MAC_CHANNEL_SWITCH"
description = "_oracles/libnet80211.a sha256 92550813de20ed0d51110dbd72b646e891a86a8a2f81fa53714ebf2ebf9c8f40, complete wl_chm.o chm_phy_change_channel.constprop.0; _oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e, complete if_hwctrl.o ic_mac_deinit/ic_mac_init, hal_mac.o hal_mac_deinit/hal_mac_init, hal_pwr.o pwr_hal_select_wifimac_regdma_link and ret-only hal_mac_ctl.o hal_mac_set_csi_cbw. The exact vendor chain is pm_wake_up, ic_mac_deinit, phy_change_channel, hal_mac_set_csi_cbw, ic_mac_init, pm_wake_done. For WIFI_PS_NONE its bounded MMIO tail sets then clears 0x00ff1000 at 0x20104cac and selects REGDMA link four in bits 20:17 of 0x2010d83c."

[[sources]]
id = "BLOB_LIBPP_RX_POLICY"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac.o hal_mac_rx_set_policy and hal_mac_set_rxq_policy bodies plus if_hwctrl.o ic_set_rx_policy and ic_set_rx_policy_ubssid_check wrappers. The reachable queue-zero policy-five transaction was preserved in migration scan code and is HIL-qualified by the connected open STA path."

[[sources]]
id = "BLOB_LIBPP_HAL_MAC_TX"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_tx.o mac_tx_set_plcp0, hal_mac_tx_config_timeout, hal_mac_tx_set_ppdu, hal_mac_tx_config_edca, hal_mac_txq_enable, hal_mac_txq_disable, hal_mac_get_txq_state, hal_mac_clr_txq_state and hal_mac_get_txq_complete bodies; complete lmac.o lmacProcessTxSuccess; complete trc.o rcUpdateTxDone and rcUpdateAckSnr; complete pp.o ppTxProtoProc and mac_tx_set_pti bodies."

[[sources]]
id = "BLOB_LIBPP_HAL_HE_TX"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_tx.o mac_tx_set_hesig size 0x324, hal_mac_tx_set_ppdu HE branch, mac_tx_set_plcp0/mac_tx_set_plcp1 and mac_tx_set_len, plus complete hal_mac_ctl.o hal_he_get_bss_color, hal_he_set_tx_protection and hal_he_set_htc. This graph proves the two reverse-stride HE SU vector stores, repeated descriptor-count and protection fields, length-control store and HE power-pair selection."

[[sources]]
id = "BLOB_LIBPP_HE_DCM"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete trc.o rcGetDCMMaxRate and he_get_min_subframe_len_dcm bodies plus their RU26, RU52, RU106 and RU242 rate tables. rcGetDCMMaxRate maps the peer receive-constellation bound to BCC DCM MCS0, MCS1 or MCS3. For RU242 the 100-kbit/s rate rows for GI 0.8, 1.6 and 3.2 us are respectively [43,86,0,172,258], [40,81,0,163,244] and [36,73,0,146,219]. he_get_min_subframe_len_dcm combines these tables with ROM global s_ht_ampdu_density_us, whose rev0 default at 0x2f07fc5a is eight microseconds: it computes scaled=(rate_100kbps*density_us)>>3 and minimum_bytes=scaled/10+(scaled%10!=0), then stores the u16 result in the GI-by-MCS density table."

[[sources]]
id = "BLOB_LIBPP_HE_DELIMITER_SPACING"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete pp_he.o ppCalDeliNum size 0xac, ppCalSubFrameLength size 0x3e and ppEmptyDelimiterLength size 0x22; complete trc.o rcUpdateAMPDUParam size 0xde and ordinary/DCM HE minimum-subframe builders; complete hal_mac_tx.o mac_tx_set_hesig size 0x324. rcUpdateAMPDUParam maps the eight negotiated density encodings through integer microseconds [0,1,1,1,2,4,8,16]. ppCalDeliNum selects the GI, HE MCS and DCM-specific minimum complete subframe byte count, stores it at descriptor offset 0x28, and writes ceil((minimum-current)/4) to private DMA metadata byte four when round4(PSDU)+delimiter is shorter. ppCalSubFrameLength adds those four-byte empty delimiters to non-final aggregate accounting; ppEmptyDelimiterLength removes final padding and empty delimiters. mac_tx_set_hesig copies the descriptor offset-0x28 halfword into all three ten-bit queue PROTECTION lanes. The length metadata and PROTECTION value are therefore two outputs of the same rate/density policy and must not be configured independently."

[[sources]]
id = "BLOB_LIBPP_HE_AMPDU_LIMIT"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete pp_he.o ppCheckTxHEAMPDUlength size 0x258, pp_he.o get_estimated_batime size 0x1a, and trc.o rx11AXRate2AMPDULimit plus rx11AXRate2AMPDULimit_update size 0x136. The checker calls ppCalSubFrameLength for the candidate and rejects or stops accumulation when it exceeds the u16 limit selected by AC profile, GI/LTF and MCS. It halves that limit when descriptor-state word offset 0x30 bit 15 selects DCM. A zero EDCA TXOP copies ROM_REV0_HE_MAX_APEP into the selected profile. For a nonzero TXOP in 32-us units the producer generates three by ten values using duration_us=txop*32-36, estimated BlockAck times [68,44,44,32,32,32,32,32,32,32] us, preambles [31.2,32,40] us, symbol times [13.6,14.4,16] us, RU242 data bits per symbol [117,234,351,468,702,936,1053,1170,1404,1560], a minus-22 service/tail-bit term and final division by eight. The four AC profiles together occupy 120 u32 entries."

[[sources]]
id = "BLOB_LIBPP_PP_HE_AMPDU_LENGTH"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete pp_he.o ppCalTxHEAMPDULength size 0x3e2 and ppCalSubFrameLength size 0x3e. ppCalSubFrameLength rounds the low fourteen-bit DMA MPDU length, adds delimiter and empty-delimiter terms, then adds four when metadata byte seven bit zero is set. The final assembled A-MPDU byte count is stored at pTxRx[logical_queue]+0x44; complete mac_tx_set_hesig later shifts that exact value by eleven into HE_SU_SIGNAL_A2_LENGTH."

[[sources]]
id = "BLOB_LIBPP_PP_HE_SMPDU_LENGTH"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete pp_he.o ppCalTxHESMPDULength size 0x58 and ppCalSubFrameLength size 0x3e. ppCalTxHESMPDULength rounds the low-twenty-bit DMA metadata payload length to four bytes, calls ppCalDeliNum and ppCalSubFrameLength, sets descriptor byte 0x32 bit two, sets frame byte 0x26 to one and descriptor byte 0x2a to one. ppCalSubFrameLength computes round4(payload_length)+4*(metadata_byte4+1)+4*(metadata_byte7&1). The live vendor raw frame supplies payload_length 28 for the 24-byte MPDU plus hardware FCS, metadata byte4 zero and byte7 zero, yielding the qualified 32-byte HE S-MPDU APEP."

[[sources]]
id = "BLOB_LIBPP_TRC_AMPDU_PARAM"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete trc.o rcUpdateAMPDUParam body, size 0xde. For non-HE HT peer types it maps HT A-MPDU Parameters bits 1:0, the maximum-length exponent, to byte ceilings 0x1fff, 0x3fff, 0x7fff and 0xffff, and maps minimum MPDU start-spacing code 0..4,5,6,7 to finite hardware values 20,40,76,148 stored at peer-state offset 0x82. Complete pp.o ppCheckTxAMPDUlength compares the accumulated aggregate against that peer byte ceiling. Complete hal_mac_tx.o mac_tx_set_htsig, size 0x23c, reads the spacing halfword and copies it into bits 9:0, 19:10 and 29:20 of the ordinary queue PROTECTION word through three fresh-read RMW edges."
