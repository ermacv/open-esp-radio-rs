schema = 2

[[peripherals]]
name = "BLE_SCAN_BACKOFF"
description = """
Scan-backoff state of the Link Layer scanner (Core Specification Vol 6, Part
B, 4.4.3.2). Scanner start publishes the maximum upper limit and initializes
the two hardware-maintained backoff words to one; a vendor test command reads
those two words back as nine-bit values. Which word is the backoff count and
which the upper limit is not established.
"""
baseAddress = 0x20101970

[[peripherals.registers]]
[peripherals.registers.register]
name = "UPPER_LIMIT_MAX"
description = "Maximum scan-backoff upper limit. Scanner start writes the controller option scan_backoff_upperlimitmax masked to nine bits, default 256, or 1 when backoff is disabled."
addressOffset = 0x0
size = 32
access = "write-only"
[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 9

[[peripherals.registers]]
[peripherals.registers.register]
name = "BACKOFF_STATE_0"
description = "One of the two hardware-maintained backoff words (upper limit or backoff count); scanner start writes one."
addressOffset = 0x4
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 9

[[peripherals.registers]]
[peripherals.registers.register]
name = "BACKOFF_STATE_1"
description = "The other hardware-maintained backoff word; scanner start writes one."
addressOffset = 0x8
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 9

