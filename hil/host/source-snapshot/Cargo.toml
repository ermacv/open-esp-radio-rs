[package]
name = "oer-hil-source-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL source snapshots: capture, identity and verified materialization of build inputs"

[features]
# The snapshot fixtures of the runner's cross-package tests.
test-support = []

[dependencies]
oer-durable = { path = "../../../tools/durable" }
oer-hil-schema = { path = "../../schema" }
oer-hil-image-class = { path = "../image-class" }
oer-repo = { path = "../../../tools/repo" }
oer-process = { path = "../../../tools/process" }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"

[dev-dependencies]
oer-toolchain = { path = "../../../tools/toolchain" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "execution"
hil = "observation"
