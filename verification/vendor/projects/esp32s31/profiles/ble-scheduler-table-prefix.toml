# The vendor side stops at the event-construction call following the complete
# sixteen-entry table loop. The Rust side executes only that table transaction
# plus its reviewed device-ordering fence. Neither side is used here to claim
# that the event objects, software lists, scheduler, or controller are ready.
[[profiles]]
name = "ble-scheduler-table-low-twenty-clear-prefix"
claim = "reviewed-domain-equivalence"
precondition = "valid-task-state-pointer-and-reviewed-sixteen-entry-image-domain"
vendor-source = "ble-controller"
vendor-symbol = "r_sym_bt_XPuqTHliEO5V9xpR7aJR"
rust-symbol = "open_ble_scheduler_trace_r_sym_bt_x_puq_thli_eo5_v9xp_r7a_jr"
compare-return = false

# Entry zero is varied; every remaining entry has one fixed nonzero image.
# The resulting reviewed Cartesian domain therefore contains exactly two
# complete table images, not 2^16 guessed combinations.
