[package]
name = "oer-esp32s31-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
esp-bootloader-esp-idf = { workspace = true, features = ["embedded-storage", "esp32s31"] }
esp-hal = { workspace = true, features = ["esp32s31", "rt", "unstable"] }
oer-esp32s31-board = { path = "../board" }
oer-esp32s31-soc.workspace = true
static_cell.workspace = true

[lints.rust]
unexpected_cfgs = "allow"

[package.metadata.open-radio]
scope = "development"
layer = "platform"
platform = "esp32s31"
