    "crates/radio/port/tests/ui/same_kind.rs",
    "crates/radio/port/tests/ui/nested_factory.rs",
    "crates/radio/port/tests/ui/foreign_installation.rs",
    "crates/runtime/radio/permit-pool/tests/ui/foreign_seat.rs",
    "crates/runtime/radio/permit-pool/tests/ui/foreign_return.rs",
    "crates/runtime/radio/permit-pool/tests/ui/split_supply.rs",
    "crates/protocols/ieee80211/lower-mac/tests/ui/foreign_gate.rs",
    "crates/protocols/ieee80211/lower-mac/tests/ui/nested_gate.rs",
    "crates/radio/port/tests/ui/foreign_line.rs",
    "crates/protocols/ieee80211/lower-mac/tests/ui/phase_gate.rs",
    "crates/protocols/ieee80211/sta/tests/ui/epoch_source.rs",
]

[[suite]]
name = "rate-capabilities"
packages = ["oer-ieee80211-lower-mac"]
