[package]
name = "oer-esp32c5-soc-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-C5 SoC services backed by esp-hal"

[features]
default = []
esp32c5 = ["dep:esp-hal"]

[dependencies]
critical-section = "1.2.0"
oer-soc-deadline = { path = "../../../../hardware/soc/deadline" }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "d61af210475ed9268806765d4940565371c75c80", default-features = false, features = ["esp32c5", "unstable"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imac-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "adapter"
platform = "chip"
chip = "esp32c5"
