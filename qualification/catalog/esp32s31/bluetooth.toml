scope-and-limitations = "The [HCI bootstrap](../../../../protocols/bluetooth/hci/src/controller/bootstrap/state.rs) reports the configured capacity; list operation remains absent. The controller core and HCI command service that served the command were removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-controller-scheduler-timebase"
section = "bluetooth-controller-lifetime"
title = "Controller scheduler timebase"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "Event-driven [controller time](../../../esp32s31/driver/bluetooth/src/controller_time.rs) uses two raw ticks per microsecond and retains fractional ticks across epoch updates. Effective counter lifetime, timer-expiration handling, wake behavior and periodic tracking remain incomplete; no runtime samples it since #770 (tag `legacy-radio-2026-10-16`), and #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-controller-interrupt-epoch"
