schema = 4
id = "diagnostic-station-phy-rfpll-check"
description = "Conditional RFPLL evaluation using retained sensor state within a preserved station epoch during UDP delivery"
repetitions = 1
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["phy-maintenance", "diagnostic", "station", "pause", "udp", "ht40"]

[link]
phy = "ht40"

[workload]
kind = "udp"
direction = "tx"
duration_seconds = 12
tx_rate_bps = 65000000
payload_bytes = 1200
station_pause = "rfpll-check"

[criteria]
exact_delivery = false
minimum_tx_bps = 10000000
require_no_beacon_loss = true
