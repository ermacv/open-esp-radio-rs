schema = 5
id = "diagnostic-ap-two-client-rx-core0-coarse"
description = "Two-station AP RX with coarse execution phase accounting"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "access-point", "multi-client", "ht40", "owned-ap-localization"]

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 1
boots = 1
timeout_seconds = 150
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 12
payload_bytes = 1472
offer = { rx_bps = 65000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_bps_per_flow = 1
