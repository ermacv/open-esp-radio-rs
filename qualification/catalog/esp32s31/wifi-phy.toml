[[items]]
id = "wifi-frequency-tx-power-antenna-ftm-and-esp-now-2412-2484-mhz"
section = "wifi-frequency-tx-power-antenna-ftm-and-esp-now"
title = "2412-2484 MHz"
status = "partial"
level = "composed-product"
scope-and-limitations = "Channels 1-13 are implemented. Channel 14 / 2484 MHz is representable in portable types but is rejected by the S31 PHY while the required channel-14 MIC/RF/regulatory behavior is unproven."
