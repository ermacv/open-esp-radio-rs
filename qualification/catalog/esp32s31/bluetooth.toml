[[items]]
id = "bluetooth-internal-wi-fi-bluetooth-coexistence"
section = "bluetooth-coexistence"
title = "Internal Wi-Fi/Bluetooth coexistence"
status = "partial"
level = "composed-product"
scope-and-limitations = "The [coexistence core](../coex/src/lib.rs) and schedule run in the [radio runtime](../../../../runtime/esp32s31/radio/src/system.rs) on the arbiter's timer bank. Each Bluetooth Controller epoch enables coexistence and publishes its advertising, scanning and connection status from the Controller's active roles, as the vendor status hook does; like the vendor BLE Controller it does not react to phases. While another radio shares the antenna, advertising and connection events and passive scan windows carry the vendor's dynamic coexistence priorities and connections its coexistence protection. The joint Wi-Fi/BLE scenario `wifi-udp-rx-ble-echo` passes (run 1790553029016-003b36c4); no joint run is qualified yet."

