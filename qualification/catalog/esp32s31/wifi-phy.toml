[[items]]
id = "wifi-tsf-beacon-monitoring-and-power-saving-hardware-tsf"
section = "wifi-tsf-beacon-monitoring-and-power-saving"
title = "Hardware TSF"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Coherent station TSF reads, AP TSF lifecycle and beacon timestamps are owned."
source-paths = []

[[items]]
id = "wifi-tsf-beacon-monitoring-and-power-saving-automatic-hardware-beacon-monitoring"
section = "wifi-tsf-beacon-monitoring-and-power-saving"
title = "Automatic hardware beacon monitoring"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "Software beacon-loss monitoring, active probe recovery and TIM/DTIM parsing are implemented, but they are not the automatic hardware feature. A one-shot epoch binds BSSID+AID to STA-policy readback and validates the four-bit miss limit, then stops before MMIO; `automatic_monitor_active()` remains false because raw timeout units, automatic-filter lifecycle and the exact WDEVPWR cause are unproven."
source-paths = []

[[items]]
id = "wifi-tsf-beacon-monitoring-and-power-saving-legacy-station-power-save"
section = "wifi-tsf-beacon-monitoring-and-power-saving"
title = "Legacy station power save"
status = "partial"
level = "composed-product"
scope-and-limitations = "PM=1/PM=0 transitions are ACK-gated; TIM/DTIM/listen interval, PS-Poll and doze permits are source-owned. The S31 boundary probes and rolls back only reviewed wake-prefix fields and does not claim RF/PHY/BB/clock sleep. Passive connected ESP-NOW RX is rejected when this policy is enabled, and concurrent STA+AP remains always awake."
source-paths = []

[[items]]
id = "wifi-tsf-beacon-monitoring-and-power-saving-full-modem-sleep"
section = "wifi-tsf-beacon-monitoring-and-power-saving"
title = "Full modem sleep"
status = "absent"
level = "composed-product"
scope-and-limitations = "Legacy station power-save policy does not compose RF/PHY/baseband shutdown, clock gating, retention and restoration into a hardware sleep/wake lifecycle."
source-paths = []

[[items]]
id = "wifi-tsf-beacon-monitoring-and-power-saving-disconnected-state-wi-fi-sleep"
section = "wifi-tsf-beacon-monitoring-and-power-saving"
title = "Disconnected-state Wi-Fi sleep"
status = "absent"
level = "composed-product"
scope-and-limitations = "No disconnected radio sleep/wake owner composes RF/PHY/baseband and clock transitions. Radio teardown alone does not establish resumable sleep."
source-paths = []

[[items]]
id = "wifi-tsf-beacon-monitoring-and-power-saving-connectionless-power-save"
section = "wifi-tsf-beacon-monitoring-and-power-saving"
title = "Connectionless power save"
status = "absent"
level = "composed-product"
scope-and-limitations = "No hardware wake-window/interval owner is composed for ESP-NOW or other connectionless exchanges. Standalone ESP-NOW RX remains awake; FTM itself remains fail-closed."
source-paths = []

[[items]]
id = "wifi-tsf-beacon-monitoring-and-power-saving-twt-requester"
section = "wifi-tsf-beacon-monitoring-and-power-saving"
title = "TWT requester"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "Portable individual-TWT parsing, bounded requester state, deadlines, teardown and TSF wake planning exist. Explicit agreements are not activated: a local explicit proposal reports the missing TWT Information action/update semantics, and a peer-accepted explicit agreement is queued for immediate teardown rather than installed. S31 implicit agreement admit/install/remove also stops before schedule activation because coexistence mapping, wake compare, retention and restore ordering are missing; the capability bit stays clear."
source-paths = []

[[items]]
id = "wifi-tsf-beacon-monitoring-and-power-saving-intra-ppdu-power-save"
section = "wifi-tsf-beacon-monitoring-and-power-saving"
title = "Intra-PPDU power save"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "HE peer setup writes the recovered MAC intra-PPDU and BSS-color-check bits, but no connected owner binds detection to a safe RF/PHY/BB/clock stop/wake transaction. Register setup alone is not a power-saving operation, so no runtime or energy capability is claimed."
source-paths = []

