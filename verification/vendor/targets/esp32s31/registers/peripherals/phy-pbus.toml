schema = 2

[[peripherals]]
name = "PHY_PBUS"
description = """
PBus command, mode, status/clock/force and packed result windows recovered
        from complete rev0 ROM bodies and their address/shift jump tables.
        The blob debug printer independently names selector/path groups:
        RFRX is selector 0 paths 1/2; BB is selector 1 paths 1/2; DCO is
        selectors 2/3 paths 1/2; RFTX is selector 4 paths 1/2 and selector 5
        path 1."""
baseAddress = 0x20100880

[[peripherals.registers]]

[peripherals.registers.register]
name = "COMMAND"
description = """
phy_pbus_force_test command word; phy_pbus_force_mode also uses bit
            0 as the debug/work selector. The complete force-test body at
            0x2f824228 composes selector, test value and path first, then masks
            the combined image with 0x0001fffc. It does not independently
            narrow the signed halfword values supplied by
            phy_pbus_rx_dco_cal at 0x2f828f44, so their retained high bits can
            contribute to the physical PATH field."""
addressOffset = 0x4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "DEBUG_MODE_ENABLE"
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TRANSACTION_START"
bitOffset = 1
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SELECTOR"
description = "Debug group selector: 0 RFRX, 1 BB, 2/3 DCO, 4/5 RFTX for the evidenced paths. Treat other selector/path combinations as undocumented."
bitOffset = 2
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "TEST_VALUE"
description = """
Physical nine-bit value field. The ROM publication expression
                accepts a wider signed halfword before the combined command
                mask; use the PAC ROM encoder when reproducing that behavior."""
bitOffset = 6
bitWidth = 9

[[peripherals.registers.register.fields]]
name = "PATH"
description = """
Physical two-bit path field. High retained bits of a wide
                test-value argument are ORed into this field by the complete
                ROM command encoder. The debug printer exercises paths 1 and
                2 for RFRX, BB, DCO and selector-4 RFTX, and path 1 for
                selector-5 RFTX."""
bitOffset = 15
bitWidth = 2

[[peripherals.registers]]

[peripherals.registers.register]
name = "MODE"
description = "PBus debug/work mode selector used by complete phy_pbus_force_mode."
addressOffset = 0xC
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "WORK_MODE_ENABLE"
bitOffset = 26
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "STATUS_CLOCK_FORCE"
description = "One physical multifunction word independently used for TX/RX forcing, RX/TX clock pairs and PBus busy status."
addressOffset = 0x10
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "FORCE_TXRX_MODE_UNKNOWN"
description = "phy_force_txrx_off replaces bits 11:8 with one of four evidenced encodings; the individual bit meanings remain unknown."
bitOffset = 8
bitWidth = 4

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xF

[[peripherals.registers.register.fields]]
name = "RX_CLOCK_LOW_OR_RXIQ_STATUS_FIRST_UNKNOWN"
description = "phy_set_rxclk_en writes this bit with its neighbor as a pair; complete phy_rxiq_cal_init independently sets it first at root entry. The shared electrical identity remains unknown."
bitOffset = 14
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "RX_CLOCK_HIGH_OR_RXIQ_STATUS_SECOND_UNKNOWN"
description = "phy_set_rxclk_en writes this bit with its neighbor as a pair; complete phy_rxiq_cal_init independently sets it at root entry and clears it during the successful cleanup suffix. The shared electrical identity remains unknown."
bitOffset = 15
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TX_CLOCK_ENABLE_PAIR"
description = "phy_set_txclk_en writes both bits as a pair; individual clock identities are unknown."
bitOffset = 16
bitWidth = 2

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3

[[peripherals.registers.register.fields]]
name = "BUSY"
bitOffset = 31
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "READ_RESULT_0"
description = "Shared PBus/FE word. Selector 1 reads result window 0 for non-path-1 operations, including RX-DCO, and window 1 for path 1. Complete phy_fe_reg_init independently sets bit 20 through a fresh-read RMW."
addressOffset = 0x14
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_0_RX_DCO"
bitOffset = 0
bitWidth = 9
access = "read-only"

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_1_UNKNOWN"
bitOffset = 9
bitWidth = 9
access = "read-only"

[[peripherals.registers.register.fields]]
name = "FE_INIT_ENABLE_UNKNOWN"
description = "First complete phy_fe_reg_init RMW sets bit 20."
bitOffset = 20
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "READ_RESULT_1"
description = "Selector 2 path 1 reads window 0; other bits are not presently evidenced."
addressOffset = 0x18
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_0_UNKNOWN"
bitOffset = 0
bitWidth = 9

[[peripherals.registers]]

[peripherals.registers.register]
name = "READ_RESULT_2"
description = "Selector 3 reads windows 0/1; selector 2 non-path-1 reads window 2."
addressOffset = 0x1C
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_0_UNKNOWN"
bitOffset = 0
bitWidth = 9

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_1_UNKNOWN"
bitOffset = 9
bitWidth = 9

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_2_UNKNOWN"
bitOffset = 18
bitWidth = 9

[[peripherals.registers]]

[peripherals.registers.register]
name = "READ_RESULT_3"
description = "Selector 4 path 1 reads window 0; selector 0 non-path-one reads window 1 and path one reads window 2."
addressOffset = 0x20
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_0_UNKNOWN"
bitOffset = 0
bitWidth = 9

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_1_UNKNOWN"
bitOffset = 9
bitWidth = 9

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_2_UNKNOWN"
bitOffset = 18
bitWidth = 9

[[peripherals.registers]]

[peripherals.registers.register]
name = "READ_RESULT_4"
description = "Selectors above five fall back to window 0, selector 5 reads window 1, and selector 4 non-path-one reads window 2."
addressOffset = 0x24
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_0_UNKNOWN"
bitOffset = 0
bitWidth = 9

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_1_UNKNOWN"
bitOffset = 9
bitWidth = 9

[[peripherals.registers.register.fields]]
name = "RESULT_WINDOW_2_UNKNOWN"
bitOffset = 18
bitWidth = 9

