schema = 5
id = "wifi-udp-rx-ble-echo"
description = "Joint Wi-Fi/Bluetooth LE image on the shared radio: HT20 station UDP receive and a GATT ATT echo load over one Bluetooth connection during the same 12 s interval"
role = "investigation"
tags = ["coexistence", "wifi", "bluetooth", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[coexistence]
phy = "ht20"
duration_seconds = 12
rx_bps = 20000000
payload_bytes = 1472
minimum_rx_bps = 8000000
minimum_echoes = 20
