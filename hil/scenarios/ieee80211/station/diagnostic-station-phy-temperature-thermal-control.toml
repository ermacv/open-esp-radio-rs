schema = 5
id = "diagnostic-station-phy-temperature-thermal-control"
description = "Temperature-only control after a recorded same-epoch thermal preconditioning interval"
repetitions = 1
transfer = "identical-image"
tags = ["phy-maintenance", "diagnostic", "station", "pause", "udp", "ht40", "thermal", "control"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 90
payload_bytes = 1200
offer = { tx_bps = 20000000 }

[wifi.workload.maintenance]
operation = "temperature"
after_millis = 60000

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_tx_bps = 10000000
