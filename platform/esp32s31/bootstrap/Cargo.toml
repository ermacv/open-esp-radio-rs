[package]
name = "oer-esp32s31-platform-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
oer-esp32s31-platform-layout.workspace = true
oer-espressif-staged-bootstrap = { path = "../../espressif/staged-bootstrap", features = ["esp32s31"] }
esp-bootloader-esp-idf = { workspace = true, features = ["embedded-storage", "esp32s31"] }
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
oer-esp32s31-platform-board = { path = "../board" }
oer-esp32s31-soc-esp-hal.workspace = true
static_cell.workspace = true

[build-dependencies]
oer-esp32s31-platform-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "platform"
platform = "chip"
chip = "esp32s31"
