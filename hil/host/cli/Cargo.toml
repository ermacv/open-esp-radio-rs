[package]
name = "oer-hil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The `cargo hil` command line: stand operations, jobs, the run store and the launch of the HIL runner"

[dependencies]
oer-chip-profile = { path = "../../../tools/chip-profile" }
oer-command-tree = { path = "../../../tools/command-tree", features = ["clap"] }
oer-esp32s31-firmware = { path = "../../../tools/firmware" }
oer-hil-arbiter = { path = "../arbiter" }
oer-hil-board = { path = "../board" }
oer-hil-evidence = { path = "../evidence" }
oer-hil-execution = { path = "../execution" }
oer-hil-image = { path = "../image" }
oer-hil-image-class = { path = "../image-class" }
oer-hil-schema = { path = "../../schema", features = ["producer"] }
oer-hil-source-snapshot = { path = "../source-snapshot" }
oer-hil-stand = { path = "../stand" }
oer-hil-stand-schema = { path = "../../stand/schema" }
oer-process = { path = "../../../tools/process" }
oer-vendor-artifacts = { path = "../../../tools/vendor-artifacts" }
clap = { version = "=4.5.48", features = ["derive"] }
fs2 = "0.4"
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serialport = { version = "4.8.1", default-features = false }
sha2 = "0.10"
tempfile = "=3.27.0"
toml = "=1.1.4"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
hil = "operation"
# The tests read the workspace Cargo configuration, the wire lock bisection
# compares and the ESP-IDF firmware catalog.
inputs = [
    ".cargo/config.toml",
    "hil/protocol/messages.lock",
    "hil/peers/*/firmware.toml",
    "hil/bootloaders/*/firmware.toml",
    "verification/*/hil-vendor/*/firmware.toml",
]
