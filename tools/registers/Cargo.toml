[package]
name = "oer-register-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Reviewed register validation and SVD/PAC publication"

[[bin]]
name = "registers"
path = "src/main.rs"

[dependencies]
oer-register-model = { path = "model" }
oer-register-review = { path = "review" }
oer-register-contracts = { path = "contracts" }
oer-process = { path = "../process" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml_edit = { version = "=0.25.13", features = ["serde"] }
svd2rust = { version = "=0.37.1", default-features = false }
tempfile = "=3.27.0"

[dev-dependencies]
cargo_metadata = "=0.23.1"

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "tool"
platform = "host"
