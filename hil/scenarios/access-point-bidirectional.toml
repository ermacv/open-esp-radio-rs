schema = 4
id = "access-point-bidirectional"
description = "Two AP ownership epochs with exact simultaneous UDP delivery"
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["qualification", "wifi", "access-point", "network", "bidirectional"]

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 90

[workload.traffic]
kind = "udp"
direction = "bidirectional"
duration_seconds = 10
rx_rate_bps = 2000000
tx_rate_bps = 2000000
payload_bytes = 1200

[criteria]
exact_delivery = true
minimum_rx_bps = 1500000
minimum_tx_bps = 1500000
