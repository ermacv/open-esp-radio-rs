schema = 5
id = "udp-bidirectional-ht40-rx-delivery-split"
description = "Split-core HT40 full-duplex exact RX delivery with driver observation and both air observers"
role = "qualification"
repetitions = 3
tags = ["udp", "station", "full-duplex", "ht40", "split-core", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 55000000, tx_bps = 55000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
exact_delivery = true
require_no_beacon_loss = true
minimum_rx_bps = 49500000
minimum_tx_bps = 49500000
minimum_combined_bps = 100000000
