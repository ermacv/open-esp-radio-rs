schema = 5
id = "diagnostic-ap-rx44-tx40-threshold"
description = "Temporary AP duplex threshold probe with 44 Mbit/s uplink and 40 Mbit/s downlink"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic-ap-airtime-threshold"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 44000000, tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
