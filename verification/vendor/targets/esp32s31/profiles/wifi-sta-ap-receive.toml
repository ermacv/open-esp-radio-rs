arguments = [6, 0x44332211, 0x00006655, 2]
vendor-ram-symbols = [
    { target-symbol = "g_ic", offset = 0, value = 0x3fce2000, observe = false },
    { target-symbol = "g_ic", offset = 0x10, value = 0x3fce4000, observe = false },
    { target-symbol = "g_ic", offset = 0x74, value = 1, observe = false },
]
