schema = 3
# Qualification manifest for the first libpp vertical slice. The generated
# PAC leaves are composed by the source-owned MAC ISR replacement; the root
# generic comparison checks the selected vendor control path against compiled Rust.
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "libpp"
symbol = "hal_mac_interrupt_get_event"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac_raw::interrupt_snapshot::sample_mac_interrupt"
binding = "v2"
rust-binding = "exact-production-entry"
rust-probe = "open_libpp_trace_hal_mac_interrupt_ret_get_event"
comparison-plan = "direct-effects-v1"
compare-return = true
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x20104c48 }
disposition = { kind = "required" }

[[functions]]
source = "libpp"
symbol = "hal_mac_interrupt_clr_event"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac_raw::interrupt_snapshot::acknowledge_mac_interrupt"
binding = "v2"
rust-binding = "exact-production-entry"
rust-probe = "open_libpp_trace_hal_mac_interrupt_ret_clr_event"
comparison-plan = "direct-effects-v1"
compare-return = true
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x20104c4c }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "fence", fm = 0, predecessor = 15, successor = 15 }
disposition = { kind = "rust-addition", value = "device-ordering" }

[[functions]]
source = "libpp"
symbol = "wDev_ProcessFiq"
disposition = "generation-candidate"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_wifi_mac::irq::handle_mac_irq"
