[package]
name = "oer-hil-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Execution of typed HIL scenarios: one scenario run by the host model or the stand, counted protocol retries, recorded infrastructure retries, and the tier plan with its budget, image segments and lease limits"

[dependencies]
oer-hil-model = { path = "../../model" }
oer-hil-run-bundle-format = { path = "../run-bundle/format" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
embassy-futures = "0.1.2"
postcard = { version = "1.1.3", features = ["use-std"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "execution"
host-app = "hil"
host-boundary = "library"
hil = "orchestration"

[package.metadata.docs.rs]
