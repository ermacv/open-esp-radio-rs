[package]
name = "open-radio-vendor-workbench-esp32s31-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "vendor-binary-workbench"
description = "open-esp-radio-rs host for the ESP32-S31 Vendor Binary Workbench provider"

[[bin]]
name = "vendor-binary-workbench"
path = "src/main.rs"

[dependencies]
open-radio-vendor-binary-workbench = { path = "../../../../../tools/vendor-binary-workbench", default-features = false }
open-radio-vendor-knowledge-esp32s31 = { path = "../workbench-provider/knowledge" }
open-radio-vendor-verification-esp32s31 = { path = "../workbench-provider/verification" }
serde_json = "=1.0.151"

[dev-dependencies]
toml_edit = "=0.25.13"

[lints]
workspace = true
