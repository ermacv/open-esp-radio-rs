id = "BLOB_LIBBTDM_SCHEDULER_OPERATIONAL_GAPS"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48d807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete member 19.o symbols r_sym_bt_DkrQYQcoyzIHdYi0CzWE (origin size 0x138), r_sym_bt_qkNMymdnaJnYUfzpKgEp (0x2b0) and r_sym_bt_VrTmsQfPlkmys4UL0NZp (0x156). Their direct controller-window accesses prove bit-zero set/clear RMWs at 0x20101204, complete reads plus publications of 0x80000000 | dynamic_low_20 at 0x20101218, complete reads at 0x20101324 and complete dynamic publications plus independent low-nibble clears at 0x2010136c. Positional names deliberately retain the unknown operation semantics."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_INSERTION_BRANCH"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete member 19.o symbols r_sym_bt_EabYtUaAIR05LXw3qZSA (0xc6), r_sym_bt_4KfpZh0Hu5NprlqcNu0D (0xde), r_sym_bt_YRnBzKlWCjsIbotqvNyS (0x23e) and r_sym_bt_VrTmsQfPlkmys4UL0NZp (0x156). The complete insert wrapper calls Eab, then YRn, and reaches the lock/modify request only when Eab returned positional outcome four and the environment gate is enabled. The request pointer is loaded from YRn's first output, with a separate manager-current fallback; it is not unconditionally the originally submitted item. Complete Eab returns outcome three on its scheduler-idle edge, four after the command-zero execution-lock edge and five on the current-head path. Complete 4Kfp independently clears command-zero START for outcome four, handles head publication plus command-one clear for outcome five, and owns the remaining conditional head/RUN path. Positional names deliberately retain semantics not established by the current archive alone."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_EMPTY_LIST_MERGE"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099 complete member 19.o symbol r_sym_bt_YRnBzKlWCjsIbotqvNyS, and public same-chip commit 31c30949541a5d3abd4043a1cb66d55aa55577dd complete named r_btdm_sched_merge_list_remove_overlap. With a non-null submitted item, empty manager head/tail/current slots and the DTM item's cleared positional flag at +0x4f.3, the remove-unshareable helper receives a null candidate and returns without mutation. The merge clears item control byte +0x4e, installs the in-flight status at +0x38, clears the software-next word at +0x50, clears only the low-twenty-bit compressed hardware-next link at item +0x00 while preserving its upper allocation image, installs the submitted item as all three source manager references and first selected-item output, and returns positional result seven. The open controller-memory transition owns only the item writes; the source-owned Rust scheduler epoch replaces the vendor manager container rather than reproducing its ABI. This source proves the first insertion into an independently established empty epoch only and grants no non-empty merge, visibility, MMIO publication or completion authority."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_INSERTION_EXECUTION_COMMANDS"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48d807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete current member 19.o symbols r_sym_bt_9H3AnHbaHJ3auzSvPDme (0x120) and r_sym_bt_rPoPGH6BBYjZaunDU5FV (0xf8), called by complete insertion-begin r_sym_bt_EabYtUaAIR05LXw3qZSA. The first publishes SCHEDULER_COMMAND_0 as START, zero-based hardware-list index in bits 23:20 and the four-byte-compressed selected-item address in bits 19:0. While SCHEDULER_STATE.BUSY remains set it observes STATUS_24; once that field is set it retains exactly bits 29:27 as the positional execution-lock result. Result zero keeps the command-zero lock for begin outcome four; positional results one, three and four enter current-head reconciliation, while every other observed result reaches the vendor assertion. The second function's insertion caller supplies a one-hot sixteen-list mask and selector zero; it publishes that mask plus START to SCHEDULER_COMMAND_1, waits only while BUSY is set and STATUS_17 is clear, and requires STATUS_19 clear before current-head reconciliation. Same-chip named r_btdm_sched_execution_lock and r_btdm_sched_execution_modify supply roles only; the current complete bodies establish every current field, branch and order."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_INSERTION_END_BRANCH"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48d807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete current member 19.o symbol r_sym_bt_4KfpZh0Hu5NprlqcNu0D (0xde). Positional begin outcome four first clears SCHEDULER_COMMAND_0.START. Outcome five first publishes the submitted item as hardware-list head and then clears SCHEDULER_COMMAND_1.START. Both then enter the common continuation. The current body next reads SCHEDULER_STATE.BUSY and returns without later publication while busy. Once idle it calls the current instruction-corresponding r_btdm_sleep_is_enabled role. A disabled result publishes the manager software-list head and returns without RUN. An enabled result reads submitted-item status +0x38: a value other than the established in-flight sentinel returns without later MMIO, while the sentinel path publishes the submitted item as head, executes the mapped scheduler-run function and returns. The older named same-chip insertion-end supplies role names only; the reordered BUSY observation and added manager-head and item-status branches come solely from this complete current body."

