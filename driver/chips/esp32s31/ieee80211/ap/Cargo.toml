[package]
name = "open-esp-radio-esp32s31-wifi-ap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 Wi-Fi access-point composition"

[dependencies]
open-esp-radio-dma = { path = "../../../../memory" }
open-esp-radio-esp32s31-hal = { path = "../../hal" }
open-esp-radio-esp32s31-phy = { path = "../../phy" }
open-esp-radio-esp32s31-wifi = { path = ".." }
open-esp-radio-esp32s31-wifi-mac = { path = "../mac" }
open-esp-radio-ieee80211 = { path = "../../../../ieee80211/mac" }
open-esp-radio-wifi-ap = { path = "../../../../ieee80211/ap" }
open-esp-radio-wifi-softmac = { path = "../../../../ieee80211/softmac" }
open-esp-radio-wpa2 = { path = "../../../../ieee80211/security/wpa2" }

[features]
default = []
# Value-only AP protocol/MAC observations. Ordinary builds retain no
# diagnostic counters in the live AP owner graph.
diagnostics = []

[lints]
workspace = true
