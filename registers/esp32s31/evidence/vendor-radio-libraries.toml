id = "BLOB_LIBBLE_SCAN_CONTROL"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete ble_lll_scan.c member ble_6.o symbol r_sym_ble_aQLjUHo25zeoHGKf9dby (r_ble_lll_scan_start) writes complete image 1 to 0x20101978 and 0x20101974, then writes 0x20101970 from the SDK options r_sym_ble_Fh7KRrkOJ0DaZapRKpqP returns: image 1 when byte +0x50 (dis_scan_backoff) is nonzero, otherwise halfword +0x5c (scan_backoff_upperlimitmax) masked to nine bits. ESP-IDF components/bt/include/common/btdm_le.h esp_bt_ctrl_le_config_t places those two fields at +0x50 and +0x5c, and ble_user_cfg.h defaults them to disabled-backoff zero and 256, so the supported standard-backoff profile selects complete image 0x00000100. This assigns the software policy predicate, not undocumented subfield meanings inside the complete hardware command."

[[sources]]
id = "BLOB_LIBBLE_MMGMT_HW_LISTS"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete ble_phy.c member ble_70.o selectors r_sym_ble_jhaN9KOsH0u0RgIu2DI9 and r_sym_ble_95olV4pLl0ue84SnuzXf, identical in body to the r_ble_phy_global_curr_rxptr_set and r_ble_phy_global_next_rxptr_set selectors of the earlier _oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195, and member memMgmt_4.o symbol r_sym_memMgmt_zJpaiu5wcM3sURVaC4Za (r_ble_lll_mmgmt_reset_rxlink). Selector values 1, 2 and 3 choose three register pairs at 0x20101280..0x20101294. Each selector first freshly reads the selected word and writes that image with bits 0..19 cleared, then freshly reads it again and writes the complete second image OR the SRAM pointer shifted right by two. The reset body calls the current setter with its chain and the next setter with zero, then clears CONTROL_20 in the current-pointer word and performs a second fresh read/write preserving that complete observation, for selector two and then selector one; selector 3 is not published after reset. In the earlier archive, complete ble_lll_mmgmt.c member 61.o allocator/free paths read each value twice until stable, reconstruct the pointer with 0x2f000000 | (value[19:0] << 2), and independently consume or clear bit 20; its memory-manager callers route scanner kind 2 to selector 1 and admitted non-scanner kinds to selector 2, and DTM kind 5 enables the precheck bypass and instead copies its private TX head and RX tail into link-state words reached from the scheduler item. Selector 3 purpose and hardware current/next rotation remain unknown."

