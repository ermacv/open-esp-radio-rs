[package]
name = "oer-esp32s31-ieee802154-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP-HAL interrupt-route ownership for the ESP32-S31 IEEE 802.15.4 MAC"

[features]
default = []
esp32s31 = [
    "dep:critical-section",
    "dep:esp-hal",
    "dep:oer-esp32s31-ieee802154-irq",
    "dep:oer-esp32s31-ieee802154-runtime",
    "dep:oer-esp32s31-pac",
]

[dependencies]
critical-section = { version = "1.2.0", optional = true }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "bee3369c35dfc10048b1d524150d99869f8a4352", default-features = false, features = ["esp32s31", "unstable"], optional = true }
oer-esp32s31-ieee802154-irq = { path = "../../../../hardware/esp32s31/driver/ieee802154/irq", optional = true }
oer-esp32s31-ieee802154-runtime = { path = "../../../../hardware/esp32s31/driver/ieee802154/runtime", optional = true }
oer-esp32s31-pac = { path = "../../../../hardware/esp32s31/pac", optional = true }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "adapter"
platform = "chip"
chip = "esp32s31"
