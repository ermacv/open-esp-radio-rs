[package]
workspace = "../../../../../tools/blobray"
name = "oer-esp32s31-vendor-scenarios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Typed ESP32-S31 vendor-comparison scenarios driven through the Blobray CLI"

[[bin]]
name = "esp32s31-vendor-scenarios"
path = "src/main.rs"

[dependencies]
blobray-application = { path = "../../../../../tools/blobray/crates/application" }
blobray-backend-riscv = { path = "../../../../../tools/blobray/crates/riscv" }
blobray-domain = { path = "../../../../../tools/blobray/crates/domain" }
blobray-next = { path = "../../../../../tools/blobray/next" }
oer-probe-codegen = { path = "../../../harness/codegen" }
addr2line = { version = "=0.27.1", default-features = false, features = ["std"] }
clap = { version = "=4.5.48", features = ["derive"] }
gimli = { version = "=0.34.0", default-features = false, features = ["read", "std"] }
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "tool"
platform = "host"
