schema = 5
id = "udp-bidirectional-ht40-task-poll-diagnostic"
description = "Split radio/network HT40 saturated full-duplex executor-residence diagnostic"
role = "investigation"
tags = ["diagnostic", "udp", "station", "full-duplex", "ht40", "split-core", "task-poll", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-task-poll"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 55000000, tx_bps = 55000000 }

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 25000000
minimum_tx_bps = 25000000
minimum_combined_bps = 50000000
