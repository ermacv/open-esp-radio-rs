schema = 5
id = "access-point-two-client-ceiling-tx"
description = "Observer-free two-client AP HT40 saturated UDP transmit fairness ceiling"
role = "investigation"
tags = ["characterization", "wifi", "access-point", "multi-client", "ht40", "split-core", "ceiling", "tx", "fairness", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "performance"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 150
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 65000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 105000000
minimum_bps_per_flow = 48000000
maximum_flow_skew_percent = 15
