[package]
name = "oer-hil-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Chip-independent HIL target logic shared by the firmware runtime and its host tests"

[features]
default = ["wifi", "system"]
# The radio families' modules, each with its protocol family: an image
# compiles only those it serves.
wifi = ["oer-hil-protocol/wifi"]
system = ["oer-hil-protocol/system"]
secure-gatt = [
    "dep:bt-hci",
    "dep:gatt-application",
    "dep:trouble-host",
    "oer-hil-protocol/bluetooth",
]
# The owned Xarxa stack, as in the HIL runtime that selects this crate's
# `embassy_net` alias.
owned-network = ["wifi", "dep:embassy-net-owned", "dep:xarxa-owned"]

[dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }
crc = "3.3.0"
embassy-sync = "0.8.0"
heapless = "0.9.3"
oer-hil-protocol = { path = "../protocol", default-features = false, features = ["async-io"] }
bt-hci = { version = "=0.10.1", optional = true }
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"
log = "0.4"
gatt-application = { package = "oer-example-bluetooth-gatt", path = "../../examples/bluetooth-gatt", optional = true, features = ["secure"] }
trouble-host = { version = "=0.8.0", git = "https://github.com/ermacv/trouble", rev = "a6af435ba1539cead0afce04718ad8a089bcc4b9", optional = true, default-features = false, features = ["default-packet-pool", "gatt", "peripheral"] }
# The same stack pins and features as the HIL target workspace.
embassy-net-owned = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "4868fd9acfd4191173cd6531b537d6009d3ae5d0", optional = true, default-features = false, features = ["icmp-ping-reply", "dhcpv4", "medium-ethernet", "ipv4", "ipv4-fragmentation", "ipv4-reassembly", "tcp", "tcp-listener", "udp"] }
xarxa-owned = { package = "xarxa", git = "https://github.com/ermacv/xarxa.git", rev = "9e0e3293724c30c5892e6af56150c849f5231eb2", optional = true, default-features = false, features = ["udp-rx-queue-count-16"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }
oer-bluetooth-controller = { path = "../../crates/protocols/bluetooth/le/controller" }
oer-bluetooth-hci = { path = "../../crates/protocols/bluetooth/hci" }
oer-bluetooth-hci-transport = { path = "../../crates/services/bluetooth/hci/transport" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "portable"
hil = "observation"
# The protocol and network code behind these features has its own tests.
test-feature-sets = ["secure-gatt", "owned-network"]
