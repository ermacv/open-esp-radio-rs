schema = 5
id = "diagnostic-station-phy-tx-rx"
description = "RX maintenance isolation control: tx"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { rx_bps = 65000000 }

[wifi.workload.maintenance]
operation = "tx-calibration"

[wifi.workload.observation]
openwrt_tx_monitor = true

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 10000000
