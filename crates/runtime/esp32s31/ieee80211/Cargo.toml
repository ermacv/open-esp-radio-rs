[package]
name = "oer-esp32s31-ieee80211-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 Wi-Fi radio execution over embassy-time"

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
oer-embassy-net-owned = { path = "../../../adapters/embassy-net/owned", optional = true }
oer-memory = { path = "../../../memory" }
oer-network-interface = { path = "../../../network/interface" }
oer-esp32s31-hal = { path = "../../../hardware/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../hardware/esp32s31/phy" }
oer-esp32s31-ieee80211 = { path = "../../../hardware/esp32s31/driver/ieee80211" }
oer-esp32s31-ieee80211-dma = { path = "../../../hardware/esp32s31/driver/ieee80211/dma" }
oer-esp32s31-ieee80211-mac = { path = "../../../hardware/esp32s31/driver/ieee80211/mac" }
oer-esp32s31-ieee80211-ap = { path = "../../../roles/esp32s31/ieee80211/ap" }
oer-esp32s31-ieee80211-sta = { path = "../../../roles/esp32s31/ieee80211/sta" }
oer-ieee80211-mac = { path = "../../../protocols/ieee80211/mac" }
oer-ieee80211-softmac = { path = "../../../protocols/ieee80211/softmac" }
oer-ieee80211-datapath = { path = "../../../protocols/ieee80211/datapath" }
oer-ieee80211-sta = { path = "../../../protocols/ieee80211/sta" }
oer-ieee80211-rsn = { path = "../../../protocols/ieee80211/security/rsn" }
oer-ieee80211-runtime = { path = "../../ieee80211" }
static_cell = "2.1.1"
log = { version = "0.4", optional = true }

[dev-dependencies]
oer-network-engine = { path = "../../../../experiments/network-engine" }
critical-section = { version = "1.2.0", features = ["std"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-64", "std"] }
oer-esp32s31-hal = { path = "../../../hardware/esp32s31/hal", features = ["validation-probes"] }
oer-esp32s31-ieee80211-ap = { path = "../../../roles/esp32s31/ieee80211/ap", features = ["diagnostics"] }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "122e97146fc0a174ef3310f4526defc37663bed4", features = ["async"] }

[features]
# Place the direct source-owned RX-gain transaction in internal SRAM for A/B
# measurement. The recovered graph and short ROM settles remain unchanged.
phy-rx-hot-sram = ["oer-esp32s31-phy/rx-gain-hot-sram"]
default = ["owned-network"]
# Optimized Xarxa/Embassy owner glue. The radio-native policy and physical
# materialization boundary compile without this feature for compatibility and
# research integrations.
owned-network = ["dep:oer-embassy-net-owned"]
# Value-only driver observers. Ordinary/performance builds do not retain
# diagnostic counters or invoke observation clocks.
diagnostics = [
    "dep:log",
    "oer-esp32s31-ieee80211-ap/diagnostics",
]
# Intrusive station TX waiting probe; adds timed hardware observations.
tx-wait-probe = ["diagnostics"]
# Low-overhead phase timing for the Core0 RX producer. This is deliberately
# tied to the intrusive task-poll image and is absent from production builds.
task-poll-telemetry = [
    "diagnostics",
    "dep:riscv",
    "oer-esp32s31-ieee80211/task-poll-telemetry",
    "oer-esp32s31-ieee80211-sta/task-poll-telemetry",
]
# Coarse Core0 accounting deliberately excludes `diagnostics` and every
# per-frame phase observer. It samples only radio polls and finite
# runner/DMA/protocol batches, so the result remains close to the production
# owner graph while still pairing elapsed cycles with retired instructions.
core0-rx-coarse-telemetry = ["dep:riscv"]
# Per-transaction TX phase samples used only by the coarse diagnostic image.
# Core1 packet emission is measured at the paired embassy-net boundary.
tx-phase-telemetry = [
    "core0-rx-coarse-telemetry",
    "oer-ieee80211-datapath/ownership-telemetry",
]

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[[test]]
name = "owned_datapath_network"
required-features = ["owned-network"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "runtime"
platform = "chip"
chip = "esp32s31"
