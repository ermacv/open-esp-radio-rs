[package]
name = "oer-hil-flash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL flash operation: a leased board written by the devices layer's one write, receipted, then journaled as history"

[dependencies]
oer-image-bundle = { path = "../../../tools/image-bundle" }
oer-chip-profile = { path = "../../../tools/chip-profile" }
oer-durable = { path = "../../../tools/durable" }
oer-device-image = { path = "../../../tools/device/image" }
oer-device-lock = { path = "../../../tools/device/lock" }
oer-stand-board = { path = "../../../stand/board" }
oer-stand-journal = { path = "../../../stand/journal" }
oer-image = { path = "../../../tools/image" }
oer-process = { path = "../../../tools/process" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "stand"
host-app = "hil"
host-boundary = "application"
hil = "operation"
# The tests read the chip profiles.
inputs = ["platform/*/chip.toml"]
