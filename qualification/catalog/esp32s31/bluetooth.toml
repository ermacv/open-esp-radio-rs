[[items]]
id = "bluetooth-feature-exchange"
section = "bluetooth-le-roles-connections-reliability"
title = "Feature Exchange"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Central `LL_FEATURE_REQ` produces a queued `LL_FEATURE_RSP` with the used-feature octet intersected against the local mask. Host LE Read Remote Features publishes Command Status before `LL_PERIPHERAL_FEATURE_REQ`, retains the request through TX-graph handoff and response, caches a successful page-zero result, reports unsupported peers with `0x1a`, and treats a 40-second response timeout as immediate connection loss with `0x22`. The source-backed peripheral HIL workload requires successful Command Status followed by the exact remote feature mask `19:40:00:00:00:00:00:00`; no recorded hardware run qualifies it."
source-paths = []

[[items]]
id = "bluetooth-version-exchange"
section = "bluetooth-le-roles-connections-reliability"
title = "Version Exchange"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Peer and Host-initiated exchanges share one configured Controller identity and queue at most one `LL_VERSION_IND` per connection. Read Remote Version Information publishes Command Status before LL admission, caches the peer identity, preserves reject and timeout status, and retains its masked completion under backpressure. Its 40-second procedure timer starts at the initiating TX graph update and restarts for each later queued LL Control PDU. A missing local identity is rejected rather than inferred from the chip. The source-backed peripheral HIL workload requires successful Command Status followed by Core version 5.4, company value `0xffff` and subversion 1; no recorded hardware run qualifies it."
source-paths = []

[[items]]
id = "bluetooth-le-ping"
section = "bluetooth-le-roles-connections-reliability"
title = "LE Ping"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The declared LE Ping feature accepts an exact `LL_PING_REQ`, queues one `LL_PING_RSP` through the existing reliable control TX owner and consumes `LL_PING_RSP` without creating a response loop. No Host command is needed for this peer-initiated responder."
source-paths = []

[[items]]
id = "bluetooth-termination"
section = "bluetooth-le-roles-connections-reliability"
title = "Termination"
status = "partial"
level = "composed-product"
scope-and-limitations = "An accepted peer `LL_TERMINATE_IND` or supervision timeout retires the unlinked connection, publishes Disconnection Complete under the Host mask and only then restores idle HCI intake. Host Disconnect for the sole handle publishes Command Status, retains the requested reason in `LL_TERMINATE_IND` through retransmission and peer acknowledgment, and reports local-host termination (`0x16`) without replacing the peer-visible reason. A fresh Controller sample immediately before first TX allocation arms `T_terminate` for the connection supervision timeout; expiry also retires the link. A source-backed HIL scenario checks target reason `0x16`, peer reason `0x13` and reconnect, but recorded hardware evidence remains absent."
source-paths = []

