[package]
name = "oer-register-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Reviewed register validation and SVD/PAC publication"

[[bin]]
name = "registers"
path = "src/main.rs"

[dependencies]
oer-register-model = { path = "model" }
oer-register-review = { path = "review" }
oer-register-contracts = { path = "contracts" }
oer-command-tree = { path = "../command-tree", features = ["clap"] }
oer-process = { path = "../process" }
oer-durable = { path = "../durable" }
oer-elf = { path = "../elf" }
oer-toolchain = { path = "../toolchain" }
oer-vendor-artifacts = { path = "../vendor-artifacts" }
oer-vendor-provenance = { path = "../vendor-provenance" }
clap = { version = "=4.5.48", features = ["derive"] }
roxmltree = "=0.20.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
toml_edit = { version = "=0.25.13", features = ["serde"] }
svd2rust = { version = "=0.37.1", default-features = false }
syn = { version = "=2.0.119", features = ["full"] }
quote = "=1.0.47"
tempfile = "=3.27.0"

[dev-dependencies]
cargo_metadata = "=0.23.1"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
host-layer = "entry"
host-app = "registers"
host-boundary = "application"
