schema = 5
id = "access-point-non-ht-client-ceiling-tx"
description = "Observer-free HT40 AP sustained UDP transmit gate toward one non-HT laptop client"
role = "investigation"
tags = ["characterization", "wifi", "access-point", "network", "single-client", "non-ht", "ht40", "split-core", "ceiling", "tx", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "performance"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "laptop", laptop_phy = "non-ht" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 17000000
