[source-facts.source-contract]
id = "bluetooth-idle-phy-maintenance"
composition = "production"
scope = "Run due shared-PHY tracking while the idle Bluetooth Controller is a PHY client, as the vendor does: a periodic tracking timer runs the tracking transaction under the PHY lock and grant protection without stopping the Controller's HCI, role or interrupt epochs"
limits = "The tracking transaction remains; the radio system whose timer ran it went in #770 (tag `legacy-radio-2026-10-16`), and #771 brings a composer back. Thermal and RF qualification remain separate"
source-paths = [
  "crates/hardware/esp32s31/phy/src/concurrent.rs",
  "crates/hardware/esp32s31/phy/src/bluetooth_client.rs",
]

