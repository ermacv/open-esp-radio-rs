# Optional libpp linked view used by the interrupt/DMA migration pilots. The
# raw archive remains the authoritative function inventory.
schema = 1
source = "libpp"
linker-scripts = [
    "../../../../../../hil/targets/esp32s31/linker/rom/esp32s31-eco0.x",
    "link.x",
]
archives = ["../../../../../../_oracles/libpp.a"]
symbol-providers = [
    # This ROM-owned runtime table is consumed by hal_mac_tx_set_ppdu. Import
    # its authenticated address before relaxation so the linked analysis image
    # retains the real pointer materialization instead of a poisoned zero.
    { path = "../../../../../../_oracles/esp32s31_rev0_rom.elf", symbols = ["esp_wifi_cert_tx_bcc", "g_osi_funcs_p", "pTxRx", "s_mplen_be_high_bitmap", "s_mplen_txq_bitmap", "s_phy_get_max_pwr"] },
]
stub-symbols = [
    "__adddf3",
    "__clzsi2",
    "__ctzsi2",
    "__extendsfdf2",
    "__ffssi2",
    "__fixdfsi",
    "__floatsidf",
    "__floatundisf",
    "__floatunsidf",
    "__muldf3",
    "__popcountsi2",
    "__subdf3",
    "__truncdfsf2",
    "__udivdi3",
    "__umoddi3",
]
# Explicit linked-view fixtures for optional vendor diagnostics/statistics.
# They are not production driver state. The generation contract must classify
# every reachable access before any such behavior may be omitted or replaced.
fixture-data-symbols = [
    { name = "esp_test_rx_statistics", size = 8, alignment = 4 },
    { name = "g_dbg_interp_tsf", size = 4, alignment = 4 },
    { name = "g_dbg_interp_tsf_end", size = 4, alignment = 4 },
    # Platform-owned build configuration is absent from libpp.a and the ROM
    # image. Keep the exact reviewed ABI extent used by the replay image; each
    # concrete scenario still has to seed any value it consumes.
    { name = "g_wifi_menuconfig", size = 104, alignment = 4 },
]
whole-archive = true
emit-relocations = true
gc-sections = false
unresolved-symbols = "ignore-all"
