[package]
name = "open-esp-radio-hybrid-migration-esp32s31"
version = "0.1.0"
edition = "2021"
description = "Non-buildable migration source for the former hybrid ESP32-S31 runtime"
repository = "https://github.com/ermacv/open-esp-radio-rs"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aes = { version = "0.8.4", default-features = false }

[features]
default = []
wpa-async-mic = []
wpa-async-eap = []
wpa-async = ["wpa-async-mic", "wpa-async-eap"]
strict-no-wait = []
# Replace the two audited static pointer-publishing vendor leaves with the
# equivalent 43 direct Rust stores. The final link must additionally pass
# --wrap=net80211_data_ptr_init and --wrap=wdev_data_init.
rust-static-bindings-interpose = []
# Replace the single 0x44-byte PM callback-table allocation and its paired
# deallocation with fixed internal-SRAM ownership.
rust-static-pm-init-interpose = []
# Replace the three 0x98-byte default rate-control contexts created by
# trc_init with exact fixed internal-SRAM owners. The paired deinitializer
# accepts only those three publications and never enters the allocator.
rust-static-trc-init-interpose = []
# Replace the single four-byte adaptive-TBTT data allocation used by the
# qualified one-interface STA/AP cold profile. Attach/deattach accept only the
# exact fixed publication and never enter the allocator.
rust-static-tbtt-adaptive-interpose = []
# Replace the empty 20-byte STA PMKSA cache header with an exact fixed
# internal-SRAM owner. The strict WPA2 path does not populate vendor PMKSA
# entries; deinit therefore accepts only the exact empty static cache.
rust-static-pmksa-cache-interpose = []
# Supply the 27-slot callback table published by esp_supplicant_init from one
# exact 108-byte internal-SRAM owner. Admission is pinned to the direct calloc
# return PC and a second live claim fails closed.
rust-static-supplicant-callback-storage = []
# Supply the four 40-byte PP BAR bookkeeping objects from an exact
# internal-SRAM pool. Admission is pinned to pp_attach's OSI malloc return PC;
# pp_deattach releases and wipes each exact slot.
rust-static-pp-bar-storage = []
# Supply the two 24-byte command envelopes used by esp_wifi_init_internal and
# esp_wifi_start from exact internal-SRAM owners. Both commands execute inline
# under the published logical Wi-Fi identity and release their owner before
# returning; unexpected overlap fails closed.
rust-static-cold-api-envelope-storage = []
# Replace misc_nvs_init/misc_nvs_deinit with a fixed zeroed 0x3c-byte
# internal-SRAM block. This is equivalent to the pinned nvs_enable=0 path and
# avoids its unconditional calloc/free pair.
rust-static-misc-nvs-init-interpose = []
# Replace wifi_init_in_caller_task/wifi_deinit_in_caller_task with a direct
# serialized Rust cold-init sequence and fixed lock publications. The retained
# menuconfig and ioctl leaves are separately audited and finite.
rust-static-wifi-init-interpose = [
    "rust-static-rx-buffer-init",
    "rust-static-misc-nvs-init-interpose",
    "rust-static-pp-task-init-interpose",
]
# Experimental HIL boundary for replacing the three bounded ROM
# `esf_buf_alloc_dynamic` pools with exact internal-SRAM arrays. This remains
# independent from `rust-static-wifi-init-interpose` until reconnect lifetime
# and layout are qualified on hardware.
rust-static-esf-buffer-init = []
# Supply the 89-entry Wi-Fi NVS configuration table and the serialized
# wifi_nvs_load scratch page from exact fixed internal-SRAM buffers. Admission
# is restricted to the pinned allocator source, size and blob return address.
rust-static-wifi-nvs-storage = []
# Supply the persistent WDEV and net80211 callback tables from exact fixed
# internal-SRAM owners. Both tables are populated by finite vendor stores and
# are read from interrupt/radio paths after publication.
rust-static-function-table-storage = []
# Admit the exact `ieee80211_setup_ratetable` 212-byte temporary owner during
# cold init as well as after strict heap lockout.
rust-static-rate-table-storage = []
# Supply one AP-or-STA interface state and its PHY state from exact fixed
# internal-SRAM owners. A simultaneous AP+STA second claim fails closed.
rust-static-interface-storage = []
# Replace the cold pre-start `esp_wifi_stop` API envelope with one bounded
# state check. An active-radio stop is rejected; it must be driven by the Rust
# asynchronous lifecycle state machine instead of the vendor delay loop.
rust-direct-cold-stop = []
# Construct the pinned 24-byte set-mode request on the caller stack and invoke
# its finite process leaf directly, bypassing allocator and ioctl dispatch.
rust-direct-set-mode = []
# Construct the pinned 24-byte power-save request on the caller stack and
# invoke its finite process leaf directly, bypassing allocator and ioctl
# dispatch. Timer state changes remain delegated to the async OSI timer table.
rust-direct-set-ps = []
# Construct the pinned 24-byte RX callback registration request on stack and
# invoke its finite interface dispatcher directly. The three target leaves
# each perform one callback-pointer store.
rust-direct-reg-rxcb = []
# Construct the pinned 24-byte management-frame subscription request on stack
# and invoke its finite process leaf directly. The leaf publishes only the
# frame-subtype mask and callback context in the vendor control block.
rust-direct-reg-mgmt-frame = []
# Construct the pinned 24-byte maximum-TX-power request on stack after
# preserving the public started-state and 8..=84 range checks. The process
# performs finite PHY publication and a fixed 43-entry table rebuild.
rust-direct-set-max-tx-power = []
# Replace the cold pre-start country ioctl with direct regdomain validation
# and fixed-state publication. Vendor NVS and active-radio stop/start branches
# are deliberately unreachable and rejected.
rust-direct-set-country-nvs-free = []
# Copy the exact 184-byte interface configuration into a fixed 208-byte
# caller-stack command owner and invoke the run-to-completion process directly.
# This removes the allocator/ioctl envelope; Rust ownership of the configuration
# globals is a separately audited follow-up boundary.
rust-direct-set-config = []
# Reduce the 2.4 GHz protocol bitmap and publish the selected pre-start
# STA/AP/NAN protocol directly into fixed state. Active-radio changes, NVS,
# stop/start, allocator and ioctl paths are deliberately unreachable.
rust-direct-set-protocols-nvs-free = []
# Replace the strict profile's promiscuous-disable ioctl with an idempotence
# check against the pinned control byte. Any actual hardware-mode transition
# is rejected for an explicit async lifecycle owner.
rust-direct-promiscuous-idempotent = []
# Publish the started STA/AP inactivity timeout directly into the two pinned
# RAM owners. This removes esp_wifi_ipc_internal, ieee80211_ioctl and the
# wifi_nvs_set persistence tail from the strict no-NVS profile.
rust-direct-set-inactive-time-nvs-free = []
# Supply the pinned `wDev_Rxbuf_Init` descriptor arena and 32 internal RX
# payload buffers from fixed internal SRAM. This removes the two allocator
# sites while retaining the vendor's finite descriptor construction.
rust-static-rx-buffer-init = []
# Replace pp_create_task/pp_delete_task with direct publication of the fixed
# Rust queue and logical task identity. No OSI task, semaphore, queue-create,
# delay, or task-delete callback is entered.
rust-static-pp-task-init-interpose = []
# HIL-only fixed trace of allocator source, caller and size during cold init.
# The trace owns no dynamic memory and is read only after initialization.
hil-cold-allocation-trace = []
# HIL-only oracle for separating frame construction from the reconstructed
# strict TX leaf path. Never enable in a production strict image.
hil-vendor-tx = []
# Expensive descriptor flight recorder and per-frame data snapshots. Keep
# these available for failure localization without charging the throughput
# profile dozens of atomic SRAM writes for every completed MPDU.
hil-tx-deep-telemetry = ["hil-vendor-tx"]
# Laboratory bridge: retain fully prepared MPDUs at ppMapTxQueue and feed the
# Rust A-MPDU submit/completion path. The vendor mapper remains in the graph.
hil-ampdu-intercept = ["hil-vendor-tx"]
# Laboratory RX BlockAck bring-up. This accepts one SoftAP or station TID-0
# agreement through Rust-owned fixed state and the recovered finite MAC leaf.
hil-rx-ampdu = []
# Laboratory-only association oracle. This advertises the exact bounded HE20
# MCS0-9 capability element observed from the pinned vendor STA, while the
# qualified strict data-TX policy deliberately remains HT until peer/descriptor
# HE state is reconstructed independently.
hil-he-association-oracle = []
# HIL profile which trades reorder depth for a larger zero-copy network
# ownership budget while keeping the same 32 internal-SRAM ESF objects.
rx-ba-window-8 = []
# Deep kind-7 RX storage for PSRAM-backed application profiles. The ESF
# objects themselves remain in internal SRAM because the Wi-Fi interrupt path
# owns and fills them.
large-rx-pool-48 = []
# Sampled HIL telemetry for locating RX queue and network-consumer latency.
# One frame out of 256 records cycle timestamps; the normal path is unchanged.
rx-pipeline-telemetry = []

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-wifi-sys-esp32s31 = { path = "../esp-wifi-sys-esp32s31" }

[dev-dependencies]
sha1 = "0.10"
