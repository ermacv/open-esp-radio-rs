schema = 3
id = "diagnostic-ap-two-client-udp-tx-saturation"
description = "Two-client AP UDP TX saturation, exact delivery and peer fairness"
repetitions = 1
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "tx", "saturation"]

[link]
phy = "ht40"

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 150
client = "laptop"

[workload.traffic]
kind = "udp-multi-client"
direction = "tx"
duration_seconds = 15
tx_rate_bps_per_flow = 65000000
payload_bytes = 1400

[criteria]
exact_delivery = true
minimum_tx_bps = 100000000
minimum_bps_per_flow = 45000000
maximum_flow_skew_percent = 20
minimum_concurrent_ap_clients = 2
