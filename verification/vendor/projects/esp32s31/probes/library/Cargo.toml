[package]
name = "open-esp-radio-verification-esp32s31-probes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Retained ESP32-S31 Rust entry points for compiled vendor verification"

[dependencies]
embassy-futures.workspace = true
embassy-sync.workspace = true
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "bee3369c35dfc10048b1d524150d99869f8a4352", default-features = false, features = ["esp32s31", "unstable"] }
open-esp-radio-esp32s31-coex.workspace = true
open-esp-radio-dma.workspace = true
open-esp-radio-esp32s31-hal.workspace = true
open-esp-radio-esp32s31-pac.workspace = true
open-esp-radio-esp32s31-phy.workspace = true
open-esp-radio-esp32s31-wifi-mac.workspace = true
open-esp-radio-esp32s31-wifi.workspace = true
open-esp-radio-esp32s31-wifi-dma.workspace = true
open-esp-radio-esp32s31-wifi-embassy.workspace = true
open-esp-radio-wifi-softmac.workspace = true
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../../../../../driver/adapters/esp-hal/esp32s31/ieee80211", features = ["esp32s31"] }

[lib]
crate-type = ["rlib", "staticlib"]

[lints.rust]
unexpected_cfgs = "allow"
