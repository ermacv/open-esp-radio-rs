schema = 5
id = "diagnostic-rx-clock"
description = "Connected-station ICMP on the receive-clock probe image: frame receive timestamps beside their handoff time, and paired MAC local-time and monotonic readings, to establish the MAC counter's unit, drift and frame age"
role = "investigation"
tags = ["icmp", "station", "diagnostic", "clock"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-rx-clock"

[wifi.workload]
kind = "station-icmp"
link = { phy = "he20" }
count = 1000
interval_ms = 20
timeout_ms = 1000
payload_bytes = 56
