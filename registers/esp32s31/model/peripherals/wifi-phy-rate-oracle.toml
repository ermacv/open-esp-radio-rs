schema = 2

[[peripherals]]
name = "WIFI_PHY_RATE_ORACLE"
description = """
Wi-Fi-owned PHY words: the noise-floor measurement read by Wi-Fi link
        policy and the low-rate receive gate of Wi-Fi rate control and 11b
        long-range RX. Only Wi-Fi touches these words: no PHY registration,
        calibration or tracking body and no Bluetooth or IEEE 802.15.4 body
        accesses them, so they belong to the Wi-Fi partition rather than the
        shared radio PHY. They share the radio-core base with the PHY oracles."""
baseAddress = 0x20100000

[[peripherals.registers]]

[peripherals.registers.register]
name = "NOISE_FLOOR_MEASUREMENT"
description = "Complete phy_read_hw_noisefloor reads this word once, sign-extends the low twelve-bit two's-complement value and divides it arithmetically by four to produce its quarter-dB result. Higher bits are not consumed. Open rev0 HIL read a stable -92 dBm whole-unit result through the complete ROM plus wDev transform."
addressOffset = 0x708C
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "SIGNED_SIXTEENTH_DB_CODE"
description = "Signed twelve-bit noise-floor measurement in sixteenth-dB units. The complete ROM arithmetic shift produces quarter-dB and wDev_GetNoiseFloor applies rounded division by four once more before retaining a signed byte; open rev0 HIL observed -92 dBm."
bitOffset = 0
bitWidth = 12
access = "read-only"

[[peripherals.registers]]

[peripherals.registers.register]
name = "LOW_RATE_PRIMARY_CONTROL"
description = "Complete phy_enable_low_rate sets bits 10 and 11 through separate fresh-read RMW edges; complete phy_disable_low_rate clears them in the same order; complete phy_rx11blr_cfg replaces both with its caller low bit."
addressOffset = 0x8060
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "LOW_RATE_ENABLE_FIRST"
description = "First independently updated low-rate enable bit."
bitOffset = 10
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "LOW_RATE_ENABLE_SECOND"
description = "Second independently updated low-rate enable bit."
bitOffset = 11
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "LOW_RATE_SECONDARY_CONTROL"
description = "Third and final fresh-read RMW in the complete low-rate leaves and phy_rx11blr_cfg."
addressOffset = 0x807C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "LOW_RATE_ENABLE"
description = "Set by complete phy_enable_low_rate and cleared by complete phy_disable_low_rate."
bitOffset = 11
bitWidth = 1

