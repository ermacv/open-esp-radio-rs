[workspace]
members = [
    "crates/radio",
    "crates/wifi/embassy-net",
    "crates/wifi/ieee80211",
    "crates/wifi/wpa2",
    "crates/esp32s31/hal",
    "crates/esp32s31/wifi/mac",
    "crates/esp32s31/pac",
    "crates/esp32s31/phy",
    "crates/esp32s31/svd",
    "crates/esp32s31/wifi/esp-hal",
    "tools/hil-runner",
    "tools/pac-gen",
]
exclude = ["hil/esp32s31", "hil/vendor-oracle/esp32s31"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# The ESP32-S31 async-platform branch uses register accessor fixes that are
# still carried by the matching PAC fork.
[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "3df8dc705" }
