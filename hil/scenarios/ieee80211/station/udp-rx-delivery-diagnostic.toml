schema = 5
id = "udp-rx-delivery-diagnostic"
description = "RX reorder, network enqueue and UDP consumer frontier evidence"
role = "investigation"
tags = ["diagnostic", "udp", "station", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "he20" }
duration_seconds = 16
payload_bytes = 1200
offer = { rx_bps = 80000000 }

[wifi.workload.criteria]
exact_delivery = true
minimum_rx_bps = 70000000
