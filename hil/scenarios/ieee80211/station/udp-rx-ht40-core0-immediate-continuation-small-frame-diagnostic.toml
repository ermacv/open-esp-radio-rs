schema = 5
id = "udp-rx-ht40-core0-immediate-continuation-small-frame-diagnostic"
description = "HT40 RX 64-byte packet-rate stress for the immediate continuation control"
transfer = "identical-image"
tags = ["diagnostic", "udp", "station", "rx", "ht40", "split-core", "core0", "coarse-cycles", "masked-probe-ab", "small-frame"]

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 64
offer = { rx_bps = 100000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 20000000
maximum_idle_channel_utilization_255 = 64
