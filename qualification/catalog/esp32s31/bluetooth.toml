[[items]]
id = "bluetooth-le-1m-phy"
section = "bluetooth-le-phy-rf-dtm"
title = "LE 1M PHY"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [radio role](../../../../roles/esp32s31/bluetooth/radio/src/radio.rs) runs Direct Test Mode, legacy advertising, passive and active scanning and the peripheral connection on LE 1M in the production [Bluetooth composition](../../../../composition/esp32s31/embassy/bluetooth/src/lib.rs)."

[[items]]
id = "bluetooth-le-2m-phy"
section = "bluetooth-le-phy-rf-dtm"
title = "LE 2M PHY"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "Direct Test Mode transmits and receives on LE 2M, and a PHY Update moves each direction of the peripheral connection to LE 2M: every connection event writes the PHYs to its scheduler item as the vendor connection events do. Advertising and scanning stay on LE 1M."

[[items]]
id = "bluetooth-le-coded-s-8-125-kbit-s"
section = "bluetooth-le-phy-rf-dtm"
title = "LE Coded S=8 / 125 kbit/s"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The Direct Test Mode receiver accepts LE Coded with either coding. A Coded transmitter test is refused because its packet timing is not implemented, and no advertising, scanning or connection uses LE Coded."

