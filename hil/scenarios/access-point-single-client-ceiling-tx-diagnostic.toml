schema = 3
id = "access-point-single-client-ceiling-tx-diagnostic"
description = "Diagnostic single-client AP HT40 saturated UDP transmit characterization"
repetitions = 1
image = "diagnostic-mac-irq"
isolation = "reset"
data_plane = "single-core"
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "tx"]

[link]
phy = "ht40"

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 120
client = "open-wrt"

[workload.traffic]
kind = "udp"
direction = "tx"
duration_seconds = 16
tx_rate_bps = 130000000
payload_bytes = 1472

[criteria]
exact_delivery = false
minimum_tx_bps = 1
minimum_concurrent_ap_clients = 1
