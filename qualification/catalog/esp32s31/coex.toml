[[items]]
id = "coex-internal-arbitration-hardware-and-models-core-release-disable-status"
section = "coex-internal-arbitration-hardware-and-models"
title = "Core release/disable/status"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "Mapped timer disable and local active-state bookkeeping exist. `uncertain_timers` retains failed programming/publication/withdrawal transactions, including writes followed by errors. New requests return `RecoveryRequired` until release/disable retires the uncertain entries. Software status is not arbiter grant/readback state; disabling tracked timers is not whole-radio shutdown."

[[items]]
id = "coex-coexistence-policy-and-scheduler-scheduler-state"
section = "coex-coexistence-policy-and-scheduler"
title = "Scheduler state"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "[Schedule](src/schedule.rs) holds the `coex_schm_env` state of esp-coex-lib `c758e7b5`: the five status words, the selected scheme, the phase index, the interval and the flexible period. It is executor-neutral state; `CoexScheduleExecutor` adds its phase timer as generation-checked commands, and the radio runtime arms that timer."
packages = ["oer-esp32s31-coex"]

[[items]]
id = "coex-coexistence-policy-and-scheduler-phase-representation"
section = "coex-coexistence-policy-and-scheduler"
title = "Phase representation"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "`CoexPhase` decodes the recovered four-byte phase: its share of the period, the Wi-Fi flags and the two Bluetooth flag bytes, and which radios a phase notifies. The receivers interpret their flag bits; the Bluetooth bytes' meaning belongs to the Bluetooth controller and is not decoded here."

[[items]]
id = "coex-coexistence-policy-and-scheduler-executable-phase-transitions"
section = "coex-coexistence-policy-and-scheduler"
title = "Executable phase transitions"
status = "implemented"
level = "composed-product"
scope-and-limitations = "`CoexSchedule::timeout`, `restart` and `set_status_bits` reproduce `coex_schm_change_phase`: loop gating, the last-phase stop of a connected Wi-Fi, the timer duration of each phase and the Wi-Fi and Bluetooth notifications. The radio runtime's `RadioSystem::run_coex_schedule` delivers these steps on its phase timer and publishes the notified phases. The Wi-Fi station's power agent consumes its phases; the Bluetooth Controller, like the vendor BLE Controller, does not react to phases."

[[items]]
id = "coex-coexistence-policy-and-scheduler-scheme-selection"
section = "coex-coexistence-policy-and-scheduler"
title = "Scheme selection"
status = "implemented"
level = "composed-product"
scope-and-limitations = "`CoexStatusWords::select` reproduces `coex_schm_status_change`; the vendor `coex` scenario compares it, and the status-bit, timeout and restart entries, with the pinned `libcoexist.a` over every combination of the tested status values. Wi-Fi and the Bluetooth Controller publish their status to the running schedule, which selects the scheme from it."

[[items]]
id = "coex-coexistence-policy-and-scheduler-wifi-idle-connected-scan-connecting-schemes"
section = "coex-coexistence-policy-and-scheduler"
title = "Wi-Fi IDLE / CONNECTED / SCAN / CONNECTING schemes"
status = "partial"
level = "composed-product"
scope-and-limitations = "All 107 schemes of `coexist_scheme.o` are recovered, including the Wi-Fi scan, connecting and connected schemes beside BLE, classic Bluetooth, IEEE 802.15.4 and external coexistence. The Wi-Fi station publishes its idle, scan, connecting and connected status, and Wi-Fi publishes its idle status when another radio starts coexistence, as `pm_on_coex_start` does. The SoftAP publishes no coexistence status."

[[items]]
id = "coex-coexistence-policy-and-scheduler-tbtt-anchored-periods"
section = "coex-coexistence-policy-and-scheduler"
title = "TBTT-anchored periods"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The station's [modem-sleep engine](../../../../roles/esp32s31/ieee80211/sta/src/modem_sleep.rs) follows `pm_coex_tbtt_process`: at each TBTT it sets the schedule interval from the beacon interval, restarts the phases and requests the beacon window, and `pm_set_next_tbtt` and `pm_handle_tbtt_interval` keep the TBTT interval at the schedule's overall period in step with the DTIM. The station TSF follows the access point's TSF from the join beacon and each beacon, as `ic_update_sta_tsf` does, so the TBTT fires on the access point's schedule."

[[items]]
id = "coex-coexistence-policy-and-scheduler-wifi-bt-ble-time-slices"
section = "coex-coexistence-policy-and-scheduler"
title = "Wi-Fi / BT / BLE time slices"
status = "partial"
level = "composed-product"
scope-and-limitations = "The schedule model computes each phase's slice as period times interval times share, and the radio runtime times the slices. The Wi-Fi station reacts to its slices: it wakes for a Wi-Fi phase and yields outside it through power save. The Bluetooth Controller publishes its status but, like the vendor BLE Controller, does not react to slices; the SoftAP does not react to them."

