status = "partial"
level = "lower-primitive"
scope-and-limitations = "A [multi-PAN engine](../../../espressif/ieee802154/engine/src/engine.rs) assigns each received frame to the interface it addresses and keeps pending mode, pending table, receive and sleep per interface, as the vendor multi-PAN build does. The portable values address up to the engine's interfaces (`MULTI_PAN`, `RxMetadata::interface`, the owner shape's per-interface client). The removed role kept MAC keys, the nonce address and enhanced-ACK security per interface, as ESP-IDF's multi-instance OpenThread port does, the removed composition parked a multi-PAN engine and the removed OpenThread adapter served one instance on interface zero (#770, tag `legacy-radio-2026-10-16`); #774 brings OpenThread back. On-air multi-PAN filtering is not qualified. #771 brings the shared radio system back, and #774 the OpenThread integration."
packages = ["oer-espressif-ieee802154-engine", "oer-esp32s31-pac", "oer-ieee802154"]

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-automatic-frame-pending"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Automatic Frame Pending"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine selects the pending bit for each acknowledged frame from the PIB pending mode and the [pending table](../../../../protocols/ieee802154/src/mac/pending.rs). The former HIL cell `ieee802154-peer-exchange` had the device's ACK of the vendor peer's data request carry frame pending for an address in its table (tag `legacy-wifi-2026-10-16`). No composition runs it since #770 (tag `legacy-radio-2026-10-16`); #771 brings the shared radio system back."

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-source-matching-table"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Source Matching table"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The protocol pending table owns add, clear and reset of short and extended addresses of each interface, and refuses a source a full half has no room for; the engine applies the table and the pending mode (`SOURCE_MATCH`) of each interface. The removed OpenThread adapter applied OpenThread's table entry by entry, as ESP-IDF's port does (#770, tag `legacy-radio-2026-10-16`). #771 brings the shared radio system back, and #774 the OpenThread integration."

[[items]]
id = "ieee802154-timing-mac-timers-clock-match"
section = "ieee802154-timing"
title = "MAC timers / clock match"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "PAC exposes timer and clock-match primitives, not a complete scheduled-radio epoch or service."

[[items]]
id = "ieee802154-timing-tx-rx-sfd-events"
section = "ieee802154-timing"
title = "TX/RX SFD events"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine reports TX and RX SFD events: the RX SFD stamps the receive timestamp, and at the TX SFD the removed role wrote the CSL and Time IEs of the frame going out (#770, tag `legacy-radio-2026-10-16`). The events are not qualified on air."
packages = ["oer-espressif-ieee802154-engine"]

[[items]]
id = "ieee802154-timing-rx-timestamp"
section = "ieee802154-timing"
title = "RX timestamp"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine stamps each frame at its SFD with the platform microsecond clock; the timestamp is not validated against a radio epoch on hardware. No composition runs it since #770 (tag `legacy-radio-2026-10-16`); #771 brings the shared radio system back."

[[items]]
id = "ieee802154-timing-timed-tx-transmit-at"
section = "ieee802154-timing"
title = "Timed TX (`transmit_at`)"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine programs TIMER0 and modem ETM channel zero to start TX or CCA-then-TX at the requested time; the portable scheduled transmit mode carries the CCA choice (OpenThread's mCsmaCaEnabled) and the removed role and runtime exposed the radio clock scheduled times use (otPlatRadioGetNow) (#770, tag `legacy-radio-2026-10-16`). The single-device air check bounds scheduled transmits against their start; on-air timing seen by a peer is not qualified. #771 brings the shared radio system back."

[[items]]
id = "ieee802154-timing-timed-rx-receive-at"
section = "ieee802154-timing"
title = "Timed RX (`receive_at`)"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine programs TIMER1 and modem ETM channel one to open a receive window and closes it at its end unless a frame is in flight. The portable scheduled receive command (otPlatRadioReceiveAt) ran it through the removed role and runtime (#770, tag `legacy-radio-2026-10-16`): the radio slept outside the window, the first received frame ended it as the vendor receive path does, and an already elapsed window ended at once. The single-device air check bounds the window's end and its first frame against the requested window; reception of a peer's frame inside a window is not qualified. #771 brings the shared radio system back."

[[items]]
id = "ieee802154-timing-coordinated-sampled-listening-csl"
section = "ieee802154-timing"
title = "Coordinated Sampled Listening (CSL)"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "OpenThread owns CSL scheduling and synchronization; the radio serves it as ESP-IDF's OpenThread port does. The [portable CSL module](../../../../protocols/ieee802154/src/mac/csl.rs) ports the CSL IE template, OpenThread's CSL IE write and the port's phase. The removed role put the IE into enhanced ACKs, wrote period and phase into every CSL IE it sent at the frame's SFD through the engine and secured retransmissions anew, and the removed OpenThread adapter mapped CSL windows to scheduled receive windows and delayed frames to scheduled transmissions over the fork's csl feature (#770, tag `legacy-radio-2026-10-16`); #774 brings OpenThread back. No peer has exchanged CSL frames with the device; on-air CSL is not qualified. #771 brings the shared radio system back, and #774 the OpenThread integration."

[[items]]
id = "ieee802154-timing-network-time-sync"
section = "ieee802154-timing"
title = "Thread network time synchronization (Time IE)"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "OpenThread owns time synchronization; the radio fills a transmitted frame's Time IE as ESP-IDF's OpenThread port does at the SFD: the [portable Time IE write](../../../../protocols/ieee802154/src/mac/time_sync.rs) puts the time sync sequence and the radio clock plus the network time offset into it. The removed role wrote it for the request's Time IE (`TIME_SYNC`) and never into an enhanced ACK, and the removed OpenThread adapter passed OpenThread's Time IE over the fork's time-sync feature, whose `otPlatTimeGet` read the same radio clock (#770, tag `legacy-radio-2026-10-16`); #774 brings OpenThread back. No peer has synchronized with the device; on-air time synchronization is not qualified. #771 brings the shared radio system back, and #774 the OpenThread integration."
packages = ["oer-ieee802154"]

[[items]]
id = "ieee802154-security-power-and-coexistence-hardware-tx-security"
section = "ieee802154-security-power-and-coexistence"
title = "Hardware TX security"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine programs address, key and payload offset for one secured transmission and clears security at its end. The [portable frame counter and key](../../../../protocols/ieee802154/src/mac/security.rs) keep the vendor rules. With the radio's MAC keys the removed role secured each attempt as ESP-IDF's OpenThread port does (#770, tag `legacy-radio-2026-10-16`): a request kept the counter of the stack's retransmission or left a frame the stack secured as given, the completion reported the counter and key index written, and while CSL was enabled a retransmission took a new frame counter, as in the port. Key derivation is not composed, and hardware security offload is not qualified on air. #771 brings the shared radio system back."

[[items]]
id = "ieee802154-security-power-and-coexistence-rx-on-when-idle"
section = "ieee802154-security-power-and-coexistence"
title = "RX-on-when-idle"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine rearms receive after each operation when the PIB receive-when-idle flag is set, which the removed role set for `Receive` and cleared for `Sleep` (#770, tag `legacy-radio-2026-10-16`). It is not qualified on air. #771 brings the shared radio system back."

[[items]]
id = "ieee802154-security-power-and-coexistence-radio-sleep-wake"
section = "ieee802154-security-power-and-coexistence"
title = "Radio sleep / wake"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The radio sleeps in the MAC while RF stays open for the client's lifetime, as in ESP-IDF builds without tickless idle and modem retention, where IEEE802154_RF_DISABLE and IEEE802154_RF_ENABLE are empty; RF closes only when the last client stops. Closing RF while asleep, modem retention, light sleep and MAC or baseband power-down are absent. No composition runs it since #770 (tag `legacy-radio-2026-10-16`); #771 brings the shared radio system back."

[[items]]
id = "ieee802154-security-power-and-coexistence-wifi-bluetooth-coexistence"
section = "ieee802154-security-power-and-coexistence"
title = "Wi-Fi/Bluetooth coexistence"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "[Coexistence infrastructure](../coex/src/lib.rs) and MAC PTI access exist. The [scene priorities](../../hal/src/ieee802154/coex.rs) hold the software-coexistence PTIs of the pinned driver: the ACK and TX/RX scene priorities of the arbiter's shared table, which the removed composed client published (#770, tag `legacy-radio-2026-10-16`). The static foundation and MAC policy still prove both PTIs disabled before operation. The former HIL cell `ieee802154-peer-exchange-coex` ran the acknowledged peer exchange with the device in coexistence with Wi-Fi and the coexistence schedule running (tag `legacy-wifi-2026-10-16`). Complete multi-radio request/grant/release operation under Wi-Fi load is not composed, and PTI arbitration is not measured on air. External coexistence is absent: its TX and RX stages do nothing on the pinned ESP32-S31 libcoexist, and the force-RX and arbitration-delay writes its builds make at MAC init and deinit wait for an external-coexistence owner in the coexistence driver. #771 brings the shared radio system back."
packages = ["oer-esp32s31-coex", "oer-esp32s31-hal"]

