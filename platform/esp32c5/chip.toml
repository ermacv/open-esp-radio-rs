# The facts of the ESP32-C5 that host tools cannot derive from the chip id.
# Paths follow the id by convention: verification/<id>, registers/<id>,
# hil/targets/<id>, qualification/targets/<id>, target/hil/<id>.
schema = 1
id = "esp32c5"
rust-target = "riscv32imac-unknown-none-elf"
# The ESP-IDF second-stage bootloader (hil/bootloaders/esp32c5) loads an
# esp-hal application linked with linkall.x.
boot = "esp-idf-bootloader"
espflash-chip = "esp32c5"
revisions = ["rev100"]

# Where the HIL images lie: the ESP-IDF bootloader at the chip's boot offset,
# the partition table and the factory application, as the catalog bootloader
# build's flasher_args.json places them.
[flash]
bootloader = 0x2000
partition-table = 0x8000
application = 0x10000
