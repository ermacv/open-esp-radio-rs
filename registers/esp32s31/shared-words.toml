# Words that a write transaction of the ESP32-S31 radio PAC and pinned esp-hal
# both store to, with how the two writers are kept from racing. `cargo xtask
# check architecture` finds the shared words from policy/api.toml,
# published/radio.svd and the pinned esp-hal and platform PAC sources, and
# fails on a shared word without an entry or an entry for a word no longer
# shared. Reviewed against esp-hal 9fe1c752 by the PHY owner.
#
# coordination:
#   shared-lock           both writers store only under the named lock
#   disjoint-lifecycle    esp-hal stores only where no radio owner exists
#   unreached-esp-hal-path  esp-hal's storing function has no caller here
#   whole-word-stores     both sides store whole words, no read-modify-write
schema = 1

[[word]]
address = 0x20109c04
radio = "MODEM_SYSCON_RADIO.CLK_CONF"
esp_hal = "MODEM_SYSCON.clk_conf in regi2c_enable_block (soc/esp32s31/regi2c.rs)"
coordination = "disjoint-lifecycle"
reason = "esp-hal sets clk_i2c_mst_sel_160m on each of its own regi2c accesses. On the ESP32-S31 those happen only in rtc::init (esp_hal::init) and in the clock tree's PLL enable, whose MPLL 0-to-1 transition happens once at platform bootstrap because Psram::from_existing_mapping holds a permanent reference; the radio's own MPLL request never crosses 0-to-1, and esp-hal has no runtime regi2c user on this chip. The radio partitions exist only after esp_hal::init and the bootstrap return."

[[word]]
address = 0x20109c0c
radio = "MODEM_SYSCON_RADIO.CLK_CONF_POWER_ST"
esp_hal = "MODEM_SYSCON.clk_conf_power_st in modem_clock_domain_power_state_icg_map_init (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only by rtc::init inside esp_hal::init, which ORs in the modem clock-domain ICG maps before any radio owner exists."

[[word]]
address = 0x2010f004
radio = "MODEM_LPCON_SHARED_CLOCK.LP_TIMER_CONF"
esp_hal = "MODEM_LPCON.lp_timer_conf in configure_ble_lp_clk_impl (soc/esp32s31/clocks.rs)"
coordination = "unreached-esp-hal-path"
reason = "The fork sets ble_lp_clk: None in every ESP32-S31 CPU clock preset (esp-hal 9fe1c752, UPSTREAM.md 'Changed in fork: BLE_LP_CLK'), so the BLE_LP_CLK node is never configured and the radio's select_bluetooth_low_power_clock is the only writer."

[[word]]
address = 0x2010f00c
radio = "MODEM_LPCON_SHARED_CLOCK.WIFI_LP_CLK_CONF"
esp_hal = "MODEM_LPCON.wifi_lp_clk_conf in configure_wifi_lp_clock (rtc_cntl/rtc/esp32s31.rs)"
coordination = "unreached-esp-hal-path"
reason = "configure_wifi_lp_clock has no caller in esp-hal 9fe1c752; the radio is the only writer."

[[word]]
address = 0x2010f014
radio = "MODEM_LPCON_SHARED_CLOCK.MODEM_32K_CLK_CONF"
esp_hal = "MODEM_LPCON.modem_32k_clk_conf in configure_wifi_lp_clock and configure_ble_lp_clk_impl"
coordination = "unreached-esp-hal-path"
reason = "Both esp-hal writers run only with use_xtal32k: configure_wifi_lp_clock has no caller and the BLE_LP_CLK node is not configured on the ESP32-S31; images do not enable xtal32k."

[[word]]
address = 0x2010f020
radio = "MODEM_LPCON_SHARED_CLOCK.CLK_CONF_POWER_ST"
esp_hal = "MODEM_LPCON.clk_conf_power_st in modem_clock_domain_power_state_icg_map_init (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only by rtc::init inside esp_hal::init, which ORs in the modem clock-domain ICG maps before any radio owner exists."

[[word]]
address = 0x2070401c
radio = "PMU_RADIO.HP_ACTIVE_HP_CK_POWER"
esp_hal = "PMU.hp_active_hp_ck_power in enable_cpll_clk_impl and the MPLL enable (soc/esp32s31/clocks.rs)"
coordination = "disjoint-lifecycle"
reason = "The CPLL write happens only in the CPU clock configuration of esp_hal::init; the MPLL write happens only when the MPLL reference count crosses zero, which the permanent reference held by Psram::from_existing_mapping confines to platform bootstrap. The radio also holds a PlatformClock::Mpll reference while powered."

[[word]]
address = 0x207040f8
radio = "PMU_RADIO.IMM_SLEEP_SYSCLK"
esp_hal = "PMU.imm_sleep_sysclk in update_hp_system_config (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only through HpSystemInit::init_default in rtc::init (esp_hal::init); the ESP32-S31 sleep code does not touch it. Both sides store whole trigger words."

[[word]]
address = 0x20704104
radio = "PMU_RADIO.IMM_MODEM_ICG"
esp_hal = "PMU.imm_modem_icg in update_hp_system_config (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only through HpSystemInit::init_default in rtc::init (esp_hal::init); the ESP32-S31 sleep code does not touch it. Both sides store whole trigger words."

[[word]]
address = 0x20704208
radio = "PMU_RADIO.ANA_PERI_PWR_CTRL"
esp_hal = "PMU.ana_peri_pwr_ctrl in pmu_init (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only by pmu_init in rtc::init inside esp_hal::init (rstb/xpd_perif_i2c), before any radio owner exists."
