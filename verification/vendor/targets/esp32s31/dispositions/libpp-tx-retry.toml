schema = 3
default-disposition = "not-yet-ported"
default-protocol = "wifi"

# The bounded normal-schedule projection stops before rcGetSMPDURate. The
# compared production entry owns max(mpdu, short) and the four-pair schedule
# selection; PLCP reconstruction remains a separate responsibility.
[[functions]]
source = "libpp"
symbol = "rcGetRate"
disposition = "bounded-feature"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_wifi_mac::tx_runtime::select_ordinary_retry_rate"
binding = "v2"
rust-binding = "reviewed-abi-projection"
rust-probe = "open_libpp_tx_retry_trace_rc_get_rate"
comparison-plan = "direct-effects-v1"
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "state-write", width = 8, field = "ordinary-tx.selected-rate" }
disposition = { kind = "required" }

# Stateful projection through the exact Embassy IRQ handoff and ordinary TX
# owner, including descriptor completion/detach, typed classification,
# Retry-bit mutation and the next DMA publication. Vendor-only platform calls
# and MMIO remain visible in the execution report but are outside this
# explicitly named state contract.
[[functions]]
source = "libpp-replay"
symbol = "lmacProcessAckTimeout"
disposition = "bounded-feature"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_wifi::ordinary_tx::OrdinaryTxOwner::service"
binding = "v2"
rust-binding = "reviewed-abi-projection"
rust-probe = "open_libpp_tx_retry_trace_ack_timeout_state"
comparison-plan = "direct-effects-v1"
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "state-write", width = 8, field = "ordinary-tx.mpdu-retry-count" }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "state-write", width = 8, field = "ordinary-tx.short-retry-count" }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "state-write", width = 8, field = "ordinary-tx.long-retry-count" }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "state-write", width = 8, field = "ordinary-tx.retry-bit-mask" }
disposition = { kind = "required" }

# This bounded claim covers only the status-four, selector-zero dispatcher.
# The selected vendor leaf and validation marker are execution goals, so the
# comparison has no state/MMIO effects to declare before those goals.
[[functions]]
source = "libpp-replay"
symbol = "lmacProcessTxError"
disposition = "bounded-feature"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_wifi_mac::tx::TxCompletion::disposition"
binding = "v2"
rust-binding = "reviewed-abi-projection"
rust-probe = "open_libpp_tx_retry_trace_lmac_process_tx_error"
comparison-plan = "direct-effects-v1"
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "platform-call", operation = "debug-diagnostic" }
disposition = { kind = "allowed-omission", value = "debug-diagnostic" }
