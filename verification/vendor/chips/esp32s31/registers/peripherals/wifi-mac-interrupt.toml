schema = 2

[[peripherals]]
name = "WIFI_MAC_INTERRUPT"
description = """
Wi-Fi MAC interrupt mask, masked status and write-to-clear aperture.
        The two complete hal_mac leaves independently prove the status and
        clear addresses. The recovered common FIQ and cold initializer prove
        the event-bit mapping and mask transaction used by the open ISR."""
baseAddress = 0x20104C40

[[peripherals.registers]]

[peripherals.registers.register]
name = "ENABLE"
description = "Complete hal_init first publishes 0x19a879e0 here before its remaining tail. Complete hal_enable_mac independently publishes its argument after clearing the shared MAC disable gates. The common FIQ samples it with each interrupt status snapshot."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "UNKNOWN_0_4"
description = "Interrupt-enable bits whose event identities remain unknown."
bitOffset = 0
bitWidth = 5

[[peripherals.registers.register.fields]]
name = "RX_ASSOCIATED_AUXILIARY_5"
description = "Enable for the status bit observed together with RX_SUCCESS during sustained receive traffic."
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "COLD_RX_ENABLE_6_UNKNOWN"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 6
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TX_COMPLETE"
description = "Enable for the TX-complete event."
bitOffset = 7
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BSS_COLOR_COLLISION"
description = "Enable for the HE BSS-color collision event."
bitOffset = 8
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "UNKNOWN_9_10"
description = "Interrupt-enable bits whose event identities remain unknown."
bitOffset = 9
bitWidth = 2

[[peripherals.registers.register.fields]]
name = "WATCHDOG"
description = "Enable for the MAC watchdog event."
bitOffset = 11
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "COLD_RX_ENABLE_12_UNKNOWN"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 12
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "COLD_RX_ENABLE_13_UNKNOWN"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 13
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "RX_SUCCESS"
description = "Enable for successful receive completion."
bitOffset = 14
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "STA_BEACON_FILTER"
description = "Enable for the station beacon-filter event; the complete disable leaf clears this bit after disabling the filter hardware."
