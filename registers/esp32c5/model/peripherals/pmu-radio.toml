schema = 2

[[peripherals]]
name = "PMU_RADIO"
description = """
ESP32-C5 PMU fields that the PHY drives: the analog I2C power and reset
controls of the RF blocks and the immediate BB I2C power tie. Other fields
remain absent and are preserved by every field transaction."""
baseAddress = 0x600B0000

[[peripherals.registers]]
[peripherals.registers.register]
name = "IMM_HP_CK_POWER"
description = "Immediate HP clock and analog power ties."
addressOffset = 0xCC
size = 32
access = "read-write"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "TIE_HIGH_XPD_BB_I2C"
description = "Tie the BB analog I2C power high; ESP-IDF declares the field write-trigger."
bitOffset = 28
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "RF_PWC"
description = "Analog I2C power and reset of the RF blocks."
addressOffset = 0x158
size = 32
access = "read-write"
resetValue = 0x08000000

[[peripherals.registers.register.fields]]
name = "XPD_CKGEN5G"
description = "Power the 5 GHz clock generator."
bitOffset = 23
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "XPD_TC5G_I2C"
description = "Power the analog I2C of the 5 GHz transceiver."
bitOffset = 24
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "XPD_RX5G_I2C"
description = "Power the analog I2C of the 5 GHz receiver."
bitOffset = 25
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "PERIF_I2C_RSTB"
description = "Release the peripheral analog I2C from reset when set."
bitOffset = 26
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "XPD_PERIF_I2C"
description = "Power the peripheral analog I2C."
bitOffset = 27
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "XPD_TXRF_I2C"
description = "Power the analog I2C of the RF transmitter."
bitOffset = 28
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "XPD_RFRX_PBUS"
description = "Power the RF receiver PBus."
bitOffset = 29
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "XPD_CKGEN_I2C"
description = "Power the analog I2C of the clock generator."
bitOffset = 30
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "XPD_PLL_I2C"
description = "Power the analog I2C of the PLL."
bitOffset = 31
bitWidth = 1

