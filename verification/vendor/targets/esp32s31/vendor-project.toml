# `phy_reg_check` is a diagnostic register dump: it reads every word in broad
# MMIO windows and prints the values without using them to control hardware.
# Preserve those raw observations, but do not make diagnostic-only addresses
# part of the release register-model review debt.
# `wdev_record_rx_linked_list` snapshots descriptor/MMIO state into the debug
# ring consumed by `wdev_dump_rx_linked_list`; its two otherwise unknown reads
# at 0x20104090/0x20104094 do not control the RX path.
# `r_sym_ble_q4fRanBdVgftXY2ep3Zs` is the complete base_stack.c diagnostic
# snapshot leaf: it formats register values, copies two scratch images and is
# reached only by the BLE log-buffer trigger.  Its 0x201014bc/cc reads and
# 0x201014c8 scratch write are retained as observations but do not define the
# standalone controller's operational register debt.
non-operational-functions = [
    "archive:phy_reg_check",
    "ble-controller:r_sym_ble_q4fRanBdVgftXY2ep3Zs",
    "libpp:wdev_record_rx_linked_list",
    "libpp-replay:wdev_record_rx_linked_list",
    "wifi-key-role:dbg_dump_rx_links",
    "wifi-key-role:wdev_record_rx_linked_list",
    "wifi-sta-ap-receive:dbg_dump_rx_links",
    "wifi-sta-ap-receive:wdev_record_rx_linked_list",
    "wifi-sta-lifecycle:dbg_dump_rx_links",
    "wifi-sta-lifecycle:wdev_record_rx_linked_list",
]

