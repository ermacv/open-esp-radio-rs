name: Nightly

# The checks too heavy for every push, once a night on main:
# - every HIL image class, built and audited as the runner builds it (CI
#   type-checks the two final images on every push), so a stack frame or
#   placement regression in a diagnostic class is found before it blocks a
#   run;
# - every ESP32-S31 example, built and audited (CI type-checks them);
# - Blobray's workspace, Clippy and tests;
# - each chip's vendor verification: its probe images, the vendor host
#   stand, and the provenance of every cited vendor function against the
#   pinned artifacts that `vendor-fetch` downloads.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  # A fresh runner has no Cargo cache; the repository configuration keeps
  # Cargo offline for local builds.
  CARGO_NET_OFFLINE: 'false'
  CARGO_TERM_COLOR: always

jobs:
  classes:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ESPFLASH_VERSION: 4.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/espflash
            target
            tools/blobray/target
          key: firmware-matrix-${{ runner.os }}-${{ env.ESPFLASH_VERSION }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            firmware-matrix-${{ runner.os }}-${{ env.ESPFLASH_VERSION }}-
            images-${{ runner.os }}-${{ env.ESPFLASH_VERSION }}-
      - name: Install espflash
        run: |
          command -v espflash >/dev/null && espflash --version | grep -q "$ESPFLASH_VERSION" || {
            sudo apt-get update && sudo apt-get install -y libudev-dev
            cargo install --locked espflash --version "$ESPFLASH_VERSION"
          }
      - name: Put the toolchain's LLVM tools on PATH
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
      - name: Fetch every workspace
        run: cargo tidy fetch
      # The log lives outside the checkout: the image builder's source
      # snapshot refuses untracked files in the tree.
      - name: Build and audit every image class
        run: |
          set -o pipefail
          cargo xtask --verbose check firmware --all 2>&1 | tee "$RUNNER_TEMP/firmware-matrix.log"
      # Push CI only type-checks the examples; this builds each one as
      # `cargo xtask build firmware` does, with its stack and placement audit.
      - name: Build and audit every ESP32-S31 example
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for example in access-point monitor station thread
          do
            echo "::group::$example"
            cargo xtask --verbose build firmware "$example" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Summarize the classes
        if: always()
        run: |
          {
            echo '## Firmware classes'
            echo
            echo '```'
            grep -E '^(PASS|FAIL) ' "$RUNNER_TEMP/firmware-matrix.log" || echo 'no class result was printed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      chips: ${{ steps.model.outputs.chips }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The chips with a vendor verification project, from oer-tidy's model.
      - id: model
        run: |
          chips=$(cargo tidy chips --json | jq -c '[.[].id]')
          verified=$(for chip in $(echo "$chips" | jq -r '.[]'); do
            [ -f "verification/$chip/artifacts.toml" ] && echo "$chip"; done | jq -R . | jq -cs .)
          echo "chips=$verified" >> "$GITHUB_OUTPUT"

  blobray:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/blobray/target
          key: blobray-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'tools/blobray/Cargo.lock') }}
          restore-keys: blobray-${{ runner.os }}-
      # The linker adapter's tests link real RV32 images with both linkers:
      # LLD, the one the pinned Rust toolchain ships (Ubuntu's LLD 18 fails
      # them), and a GNU ld with the elf32lriscv emulation that accepts
      # --start-lib/--end-lib, new in binutils 2.47 (ld/NEWS). Ubuntu ships
      # 2.42, so the pinned release is built once and cached.
      - name: Use the toolchain's LLD
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "BLOBRAY_TEST_LLD=$(rustc --print sysroot)/lib/rustlib/$host/bin/gcc-ld/ld.lld" >> "$GITHUB_ENV"
      - id: binutils
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/binutils
          key: binutils-2.47-riscv32-${{ runner.os }}
      - name: Build RISC-V GNU ld 2.47
        if: steps.binutils.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO https://ftp.gnu.org/gnu/binutils/binutils-2.47.tar.xz
          echo "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff  binutils-2.47.tar.xz" | sha256sum -c -
          tar -xJf binutils-2.47.tar.xz
          mkdir build-binutils && cd build-binutils
          ../binutils-2.47/configure --target=riscv32-unknown-elf --prefix="$HOME/.local/binutils" \
            --disable-nls --disable-werror --disable-gdb --disable-gdbserver --disable-sim --disable-gprofng
          make -j"$(nproc)" all-ld
          make install-ld
      - name: Put GNU ld on PATH
        run: |
          echo "$HOME/.local/binutils/bin" >> "$GITHUB_PATH"
          "$HOME/.local/binutils/bin/riscv32-unknown-elf-ld" --version | head -1
      - run: cargo clippy --locked --manifest-path tools/blobray/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/blobray/Cargo.toml --workspace --no-fail-fast

  verification:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chip: ${{ fromJSON(needs.plan.outputs.chips) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verification-${{ matrix.chip }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', 'verification/*/artifacts.toml') }}
          restore-keys: verification-${{ matrix.chip }}-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - name: Pinned vendor artifacts
        run: cargo xtask --verbose vendor-fetch ${{ matrix.chip }}
      - name: Provenance of every cited vendor function
        run: cargo xtask --verbose check provenance --chip ${{ matrix.chip }}
      - name: Probe images
        run: cargo xtask --verbose build vendor-probes --chip ${{ matrix.chip }}
      - name: Vendor host stands
        run: |
          for manifest in verification/${{ matrix.chip }}/host/*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --locked --manifest-path "$manifest" --no-fail-fast
          done
