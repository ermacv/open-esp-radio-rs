schema = 2

[[peripherals]]
name = "BT_V3_2_BASEBAND"
description = """
Bluetooth baseband control and status words recovered from complete, named
bt_bb_v2.o accessors in the ESP32-S31 vendor library. Field geometry and
argument-to-field transforms are exact. ARGUMENT_N labels deliberately retain
unknown C signature semantics rather than inventing a hardware meaning."""
baseAddress = 0x20102000

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_SETUP_CONTROL_0"
description = "Complete bt_bb_rx_set sets positional bit 0 through a fresh-read RMW. Its independent hardware meaning remains unknown."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "SET_BY_RX_SETUP_BIT_0"
description = "Complete bt_bb_rx_set sets this positional bit. No enable semantic is proven."
bitOffset = 0
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "CHANNEL_POWER_CONTROL"
description = "The named channel-power set/unset leaves set or clear this aggregate two-bit field through fresh-read RMW operations; individual bit meanings remain unknown."
addressOffset = 0x4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "CHANNEL_POWER_BITS_8_9"
description = "bt_get_channel_pwr_set replaces the field with 3 and bt_get_channel_pwr_unset replaces it with 0."
bitOffset = 8
bitWidth = 2

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_SETUP_IMAGE_0"
description = "The bounded TX setup clears bits 8:11; the subsequent RX setup preserves the low 12 bits and replaces bits 31:12 with the finite image 0x0199A."
addressOffset = 0xC
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "CONFIG_IMAGE"
bitOffset = 12
bitWidth = 20

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFF

[[peripherals.registers.register.fields]]
name = "TX_SETUP_IMAGE"
description = "bt_bb_v2_tx_set replaces this positional field with zero."
bitOffset = 8
bitWidth = 4

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xF

[[peripherals.registers]]

[peripherals.registers.register]
name = "LE_TX_ON_DELAY"
description = "Bluetooth LE transmit-on delay. The public API exposes the decoded value; the register stores value minus 10."
addressOffset = 0x14
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "FORCE_ZERO_BITS_16_18"
description = "bt_bb_set_le_tx_on_delay clears these three low positional bits in the same RMW that writes the encoded delay. Their hardware meaning remains unknown."
bitOffset = 16
bitWidth = 3

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x7

[[peripherals.registers.register.fields]]
name = "ENCODED_VALUE_MINUS_10"
description = "bt_bb_set_le_tx_on_delay stores argument 0 minus 10; bt_bb_get_le_tx_on_delay returns this field plus 10."
bitOffset = 19
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "TX_CONFIG_CHECK_VALUE"
description = "ble_tx_config_check consumes only this high five-bit image in diagnostic arithmetic; its underlying hardware meaning remains unknown."
addressOffset = 0x1C
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "HIGH_5_UNKNOWN"
description = "Exact value produced by shifting the complete register image right by 27."
bitOffset = 27
