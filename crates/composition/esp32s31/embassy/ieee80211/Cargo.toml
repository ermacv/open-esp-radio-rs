[package]
name = "oer-esp32s31-ieee80211-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"
description = "Product-level ESP32-S31 Wi-Fi composition for Embassy and esp-hal"

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "composition"
platform = "chip"
chip = "esp32s31"
# Cargo features are additive, while these integration leaves are
# intentionally alternatives. Repository audits compile every declared
# profile independently instead of constructing an invalid all-feature union.
supported-feature-profiles = [
    "upstream-network,diagnostics",
    "upstream-network,diagnostics,phy-rx-hot-sram",
    "upstream-network,diagnostics,mac-irq-diagnostics,task-poll-telemetry,connected-datapath-cycle-telemetry,core0-rx-coarse-telemetry,tx-psram-dma-probe",
    "owned-network,diagnostics,mac-irq-diagnostics,task-poll-telemetry,connected-datapath-cycle-telemetry,core0-rx-coarse-telemetry,tx-psram-dma-probe",
    "embassy-network,diagnostics,mac-irq-diagnostics,task-poll-telemetry,connected-datapath-cycle-telemetry,core0-rx-coarse-telemetry,tx-psram-dma-probe",
]

[dependencies]
oer-xarxa-upstream = { path = "../../../../adapters/xarxa/upstream", optional = true }
oer-esp32s31-ieee80211-xarxa-upstream = { path = "../../../../adapters/xarxa/esp32s31/ieee80211-upstream", optional = true }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
# Network stacks are mutually exclusive composition leaves. The upstream
# leaf resolves only released crates; the owned leaf contains the maintained
# owner-transfer fork. Neither choice changes radio policy.
embassy-net-owned = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "1fa0957c07398f83c9795b645a5a6ceda1270f91", default-features = false, features = ["medium-ethernet", "proto-ipv4", "raw"], optional = true }
embassy-net-released = { package = "embassy-net", version = "0.9.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "raw"], optional = true }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
log = { version = "0.4.29", optional = true }
riscv = { version = "0.15", optional = true }
oer-radio = { path = "../../../../radio", default-features = false, features = ["wifi"] }
oer-radio-embassy = { path = "../../../../adapters/embassy/radio" }
oer-esp32s31-ieee80211 = { path = "../../../../hardware/esp32s31/driver/ieee80211" }
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../../hardware/esp32s31/phy" }
oer-esp32s31-ieee80211-ap = { path = "../../../../roles/esp32s31/ieee80211/ap" }
oer-esp32s31-ieee80211-dma = { path = "../../../../hardware/esp32s31/driver/ieee80211/dma" }
oer-esp32s31-ieee80211-mac = { path = "../../../../hardware/esp32s31/driver/ieee80211/mac" }
oer-esp32s31-ieee80211-sta = { path = "../../../../roles/esp32s31/ieee80211/sta" }
oer-embassy-net-owned = { path = "../../../../adapters/embassy-net/owned", optional = true }
oer-embassy-net-upstream = { path = "../../../../adapters/embassy-net/upstream", optional = true }
oer-esp32s31-ieee80211-runtime = { path = "../../../../runtime/esp32s31/ieee80211", default-features = false }
oer-esp32s31-ieee80211-embassy-net-upstream = { path = "../../../../adapters/embassy-net/esp32s31/ieee80211-upstream", optional = true }
oer-ieee80211-runtime = { path = "../../../../runtime/ieee80211" }
oer-ieee80211-mac = { path = "../../../../protocols/ieee80211/mac" }
oer-network-interface = { path = "../../../../network/interface" }
oer-ieee80211-ap = { path = "../../../../protocols/ieee80211/ap" }
oer-ieee80211-softmac = { path = "../../../../protocols/ieee80211/softmac" }
oer-ieee80211-sta = { path = "../../../../protocols/ieee80211/sta" }
oer-ieee80211-rsn = { path = "../../../../protocols/ieee80211/security/rsn" }
static_cell = "2.1.1"

# Hardware composition is target-only; the product resource profile and its
# ownership tests also compile on the host without running esp-hal's build script.
[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["esp32s31", "rt", "unstable"] }
oer-esp32s31-soc-esp-hal = { path = "../../../../adapters/esp-hal/esp32s31/soc", features = ["esp32s31"] }
oer-esp32s31-ieee80211-esp-hal = { path = "../../../../adapters/esp-hal/esp32s31/ieee80211", features = ["esp32s31"] }

[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[features]
lifecycle-fault-injection = ["oer-esp32s31-phy/lifecycle-fault-injection"]
rx-ownership-observation = ["oer-esp32s31-ieee80211-dma/rx-ownership-observation"]
# Experimental direct RX-gain transaction SRAM placement for the RXCAL A/B profile.
phy-rx-hot-sram = ["oer-esp32s31-ieee80211-runtime/phy-rx-hot-sram"]
default = ["owned-network"]
upstream-network = [
    "dep:oer-xarxa-upstream",
    "dep:oer-esp32s31-ieee80211-xarxa-upstream",
]
owned-network = [
    "dep:embassy-net-owned",
    "dep:oer-embassy-net-owned",
    "oer-esp32s31-ieee80211-runtime/owned-network",
]
embassy-network = [
    "dep:embassy-net-released",
    "dep:oer-embassy-net-upstream",
    "dep:oer-esp32s31-ieee80211-embassy-net-upstream",
]
diagnostics = [
    "dep:log",
    "oer-esp32s31-ieee80211-runtime/diagnostics",
    "oer-esp32s31-ieee80211-embassy-net-upstream?/diagnostics",
    "oer-esp32s31-ieee80211-xarxa-upstream?/diagnostics",
]
# Hard-IRQ callbacks are a deliberately separate diagnostic boundary. Enabling
# ordinary value observers must not change the SRAM-closed interrupt call graph.
mac-irq-diagnostics = ["diagnostics"]
tx-wait-probe = ["diagnostics", "oer-esp32s31-ieee80211-runtime/tx-wait-probe"]
task-poll-telemetry = [
    "diagnostics",
    "oer-esp32s31-ieee80211-runtime/task-poll-telemetry",
]
connected-datapath-cycle-telemetry = ["dep:riscv"]
core0-rx-coarse-telemetry = [
    "oer-esp32s31-ieee80211-runtime/core0-rx-coarse-telemetry",
    "oer-esp32s31-ieee80211-runtime/tx-phase-telemetry",
    "oer-esp32s31-ieee80211-embassy-net-upstream?/tx-phase-telemetry",
    "oer-esp32s31-ieee80211-xarxa-upstream?/tx-phase-telemetry",
]
tx-psram-dma-probe = [
    "oer-esp32s31-soc-esp-hal/psram-dma-diagnostic",
    "oer-esp32s31-ieee80211-dma/tx-psram-dma-probe",
]

[lints]
workspace = true

[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
debug_assert_with_mut_call = "deny"
# The repository `clippy.toml` lists methods radio code must not call.
disallowed_methods = "deny"

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "507d14dbccfc26128b929b044d76f09cf2d1d2f6" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
