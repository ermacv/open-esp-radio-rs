[package]
name = "open-esp-radio-hil-esp32s31-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["code-psram", "profile-psram-data"]
code-flash = []
code-psram = []
profile-psram-data = []
profile-sram-data = []
psram-task-stack = ["oer-esp32s31-runtime/psram-task-stack"]
boot-smoke = []
open-radio-hil = [
    "oer-esp32s31-runtime/multicore",
    "dep:embassy-futures",
    "dep:embassy-net",
    "dep:embassy-sync",
    "dep:embedded-io-async",
    "dep:log",
    "dep:heapless",
    "dep:open-esp-radio",
    "dep:open-esp-radio-embassy-net",
    "dep:open-esp-radio-esp32s31-embassy-wifi",
    "dep:open-esp-radio-esp32s31-phy",
    "dep:open-esp-radio-esp32s31-wifi-esp-hal",
    "dep:open-esp-radio-hil-protocol",
    "dep:open-esp-radio-hil-esp32s31-telemetry",
    "dep:open-esp-radio-wifi-embassy",
    "dep:postcard",
    "dep:serde",
]
driver-observation = [
    "open-esp-radio-esp32s31-embassy-wifi/diagnostics",
]
# Intrusive hard-IRQ classification. This is never part of correctness or
# performance images because it extends the SRAM-closed MAC ISR call graph.
mac-irq-telemetry = [
    "driver-observation",
    "open-esp-radio-esp32s31-embassy-wifi/mac-irq-diagnostics",
]
# Common low-overhead observer used by both residence and task-poll images.
# Keep it independent from the TX architecture probes: task-poll scenarios do
# not select those probes and must not pay for their DMA-visible owners.
connected-datapath-poll-telemetry = [
    "open-esp-radio-esp32s31-embassy-wifi/connected-datapath-cycle-telemetry",
]
# Minimal diagnostic overlay for measuring continuous Embassy Future::poll
# residence. Keep the rejected/experimental TX backing implementations out of
# this image: their compile-time branches and DMA-visible owners measurably
# change the linked hot-path layout even when runtime-disabled.
task-residence-telemetry = ["connected-datapath-poll-telemetry"]
# Same-image home for hardware-address and memory-transfer probes. It retains
# residence timing, but must never be used as the production CPU budget.
tx-architecture-probes = [
    "task-residence-telemetry",
    "tx-psram-dma-probe",
    "gdma-mem2mem-probe",
]
tx-psram-dma-probe = [
    "open-esp-radio-esp32s31-embassy-wifi/tx-psram-dma-probe",
]
# Diagnostic-only PSRAM-to-SRAM promotion benchmark. It claims AXI-GDMA
# channel 0 before radio startup and releases it before any workload begins.
memory-benchmark = ["open-radio-hil", "open-esp-radio-esp32s31-platform-pac/psram-dma-diagnostic"]
gdma-mem2mem-probe = ["open-esp-radio-esp32s31-platform-pac/psram-dma-diagnostic"]
# General task-poll diagnostic. Driver observation remains available for the
# existing RX/TX/AP diagnostic scenarios, but Core0 per-phase accounting is
# deliberately separate below.
task-poll-telemetry = [
    "connected-datapath-poll-telemetry",
    "driver-observation",
]
# Intrusive Core0 RX phase accounting. This retains the same top-level task
# residence evidence, but is a separate feature because its per-phase cycle
# reads, atomics, and larger linked image measurably perturb the result.
core0-rx-cycle-telemetry = [
    "task-poll-telemetry",
    "open-esp-radio-esp32s31-embassy-wifi/task-poll-telemetry",
]
# Production-like Core0 accounting: no driver observers and no per-frame
# instrumentation, only radio/runner/DMA/protocol batch samples.
core0-rx-coarse-telemetry = [
    "connected-datapath-poll-telemetry",
    "open-esp-radio-esp32s31-embassy-wifi/core0-rx-coarse-telemetry",
]
# Diagnostic overlay proving each UDP RX delivery frontier from software
# reorder output through network admission and application consumption.
rx-delivery-telemetry = ["driver-observation"]
# Diagnostic-only, bounded discriminator for the IEEE 802.15.4 EVENT_STATUS
# timer bits. It reads both source-132 route controls but never writes a route
# or attests that the production IRQ path is ready.
ieee802154-event-status-probe = [
    "dep:open-esp-radio-esp32s31-hal",
    "open-esp-radio-esp32s31-hal/validation-probes",
]
# Diagnostic-only ED-DONE/TIMER0 selective-write discriminator.
# RX-ABORT is retained explicitly when PHY/RF/BTBB readiness is absent.
ieee802154-ed-event-probe = [
    "dep:open-esp-radio-esp32s31-hal",
    "open-esp-radio-esp32s31-hal/validation-probes",
]

[dependencies]
embassy-executor.workspace = true
embassy-futures = { workspace = true, optional = true }
embassy-net = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time.workspace = true
embedded-io-async = { workspace = true, optional = true }
esp-hal = { workspace = true, features = ["esp32s31", "rt", "unstable"] }
log = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
open-esp-radio = { workspace = true, optional = true }
open-esp-radio-embassy-net = { workspace = true, optional = true }
open-esp-radio-esp32s31-embassy-wifi = { workspace = true, optional = true }
open-esp-radio-esp32s31-hal = { workspace = true, optional = true }
open-esp-radio-esp32s31-phy = { workspace = true, optional = true }
open-esp-radio-esp32s31-platform-pac.workspace = true
open-esp-radio-esp32s31-embassy-runtime.workspace = true
open-esp-radio-esp32s31-wifi-esp-hal = { workspace = true, features = ["esp32s31"], optional = true }
open-esp-radio-hil-protocol = { workspace = true, optional = true }
oer-esp32s31-board = { path = "../../../../platform/esp32s31/board" }
oer-esp32s31-runtime = { path = "../../../../platform/esp32s31/runtime" }
open-esp-radio-hil-esp32s31-telemetry = { workspace = true, optional = true }
open-esp-radio-wifi-embassy = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
static_cell.workspace = true

[lints.rust]
unexpected_cfgs = "allow"

[build-dependencies]
oer-firmware = { path = "../../../../tools/firmware", default-features = false }
