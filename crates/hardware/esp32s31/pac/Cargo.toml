[package]
name = "oer-esp32s31-pac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Closed typed ESP32-S31 radio peripheral access crate"

[features]
validation-probes = ["oer-esp32s31-pac-raw/validation-probes", "oer-ieee802154-pac/validation-probes"]

[dependencies]
oer-ieee802154-pac = { path = "../../ieee802154/pac" }
oer-memory = { path = "../../../memory" }
oer-ieee80211-pac = { path = "../../ieee80211/pac" }
oer-esp32s31-pac-raw = { path = "raw", features = ["critical-section"] }

[dev-dependencies]
oer-esp32s31-pac-raw = { path = "raw", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "hardware"
platform = "chip"
chip = "esp32s31"
