schema = 5
id = "diagnostic-ap-airtime-rx45-tx40-observed"
description = "Temporary AP asymmetric duplex control with 45 Mbit/s uplink and 40 Mbit/s downlink"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic-ap-airtime-sweep", "diagnostic-ap-rx-disposition"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 45000000, tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
