[package]
name = "open-esp-radio-embassy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded, owned Ethernet frame boundary between open ESP radio tasks and embassy-net"

[features]
default = []
# Exposes the exact pre-publication edge only to diagnostic compositions.
diagnostics = []
# Intrusive per-datagram Core1 cycle/instruction accounting. Diagnostic HIL
# images enable this explicitly; production adapters do not.
tx-phase-telemetry = ["dep:riscv", "tx-egress-diagnostic-switch"]
# Startup-only same-ELF switch used to measure egress-control overhead without
# compiling the intrusive per-frame/per-burst counter set.
tx-egress-diagnostic-switch = []
# Same-image HIL discriminator for the proposed contended-TX ownership
# boundary. Production images do not compile this branch.
tx-staging-copy-probe = []
# Same-image experiment which moves one already selected PSRAM-to-SRAM burst
# to the network core while retaining the driver-side software-TXQ topology.
tx-core1-materializer-probe = ["tx-staging-copy-probe"]
# Select a bounded stack-side destination queue before the final direct-DMA
# token is requested. Product Wi-Fi compositions enable this unconditionally;
# it remains a feature here because the extended Embassy driver API is
# feature-gated in the maintained fork.
tx-egress-scheduling = ["embassy-net-driver/tx-egress-metadata"]

[dependencies]
embassy-net-driver = { git = "https://github.com/ermacv/embassy.git", rev = "c4d871089d22be1398e2f2d62b23298b900a6d62" }
embassy-sync = "0.8.0"
open-esp-radio-dma = { path = "../../common/dma" }
pin-project-lite = "0.2.17"

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[dev-dependencies]
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-std"] }
embassy-net = { git = "https://github.com/ermacv/embassy.git", rev = "c4d871089d22be1398e2f2d62b23298b900a6d62", features = ["icmp", "iface-neighbor-cache-count-16", "medium-ethernet", "proto-ipv4", "std", "tx-egress-metadata", "udp"] }
embassy-time = { version = "0.5.0", features = ["std"] }

[lints]
workspace = true
