level = "composed-product"
scope-and-limitations = "A [multi-PAN engine](src/engine.rs) assigns each received frame to the interface it addresses and keeps pending mode, pending table, receive and sleep per interface, as the vendor multi-PAN build does. The radio role and runtime serve interface zero; on-air multi-PAN filtering is not qualified."
packages = ["oer-esp32s31-ieee802154", "oer-esp32s31-pac"]

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-automatic-frame-pending"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Automatic Frame Pending"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine selects the pending bit for each acknowledged frame from the PIB pending mode and the [pending table](../../../../protocols/ieee802154/src/mac/pending.rs). On-air behavior is not qualified."

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-source-matching-table"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Source Matching table"
status = "partial"
level = "composed-product"
scope-and-limitations = "The protocol pending table owns add, clear and reset of short and extended addresses for interface zero; multi-PAN tables are absent."

[[items]]
id = "ieee802154-timing-mac-timers-clock-match"
section = "ieee802154-timing"
title = "MAC timers / clock match"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "PAC exposes timer and clock-match primitives, not a complete scheduled-radio epoch or service."

[[items]]
id = "ieee802154-timing-tx-rx-sfd-events"
section = "ieee802154-timing"
title = "TX/RX SFD events"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine reports TX and RX SFD events through the runtime queue. Whole-radio composition remains incomplete."
packages = ["oer-esp32s31-ieee802154"]

[[items]]
id = "ieee802154-timing-rx-timestamp"
section = "ieee802154-timing"
title = "RX timestamp"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine stamps each frame at its SFD with the platform microsecond clock; the timestamp is not validated against a radio epoch on hardware."

[[items]]
id = "ieee802154-timing-timed-tx-transmit-at"
section = "ieee802154-timing"
title = "Timed TX (`transmit_at`)"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine programs TIMER0 and modem ETM channel zero to start TX or CCA-then-TX at the requested time. RF readiness and on-air timing are not qualified."

[[items]]
id = "ieee802154-timing-timed-rx-receive-at"
section = "ieee802154-timing"
title = "Timed RX (`receive_at`)"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine programs TIMER1 and modem ETM channel one to open a receive window and closes it at its end unless a frame is in flight. RF readiness and on-air timing are not qualified."

[[items]]
id = "ieee802154-timing-coordinated-sampled-listening-csl"
section = "ieee802154-timing"
title = "Coordinated Sampled Listening (CSL)"
status = "absent"
level = "composed-product"
scope-and-limitations = "No CSL scheduling, synchronization or protocol owner exists."

[[items]]
id = "ieee802154-security-power-and-coexistence-hardware-tx-security"
section = "ieee802154-security-power-and-coexistence"
title = "Hardware TX security"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine programs address, key and payload offset for one secured transmission and clears security at its end. No key/nonce/counter lifecycle is composed, and hardware security offload is not qualified."

[[items]]
id = "ieee802154-security-power-and-coexistence-rx-on-when-idle"
section = "ieee802154-security-power-and-coexistence"
title = "RX-on-when-idle"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine rearms receive after each operation when the PIB receive-when-idle flag is set. Radio lifetime is not composed."

[[items]]
id = "ieee802154-security-power-and-coexistence-radio-sleep-wake"
section = "ieee802154-security-power-and-coexistence"
title = "Radio sleep / wake"
status = "absent"
level = "composed-product"
scope-and-limitations = "No RF/PHY/baseband stop/wake, retention and restoration owner is composed. A portable sleep state or stopped MAC is not hardware radio sleep."

[[items]]
id = "ieee802154-security-power-and-coexistence-powered-lifecycle"
section = "ieee802154-security-power-and-coexistence"
title = "Powered lifecycle"
status = "partial"
level = "composed-product"
scope-and-limitations = "Clock/reset foundation and masked-policy transitions exist. Shared-PHY maintenance and complete RF-ready start/stop ownership remain incomplete."

[[items]]
id = "ieee802154-security-power-and-coexistence-wifi-bluetooth-coexistence"
section = "ieee802154-security-power-and-coexistence"
title = "Wi-Fi/Bluetooth coexistence"
status = "partial"
level = "composed-product"
scope-and-limitations = "[Coexistence infrastructure](../coex/src/lib.rs) and MAC PTI access exist. Static IEEE 802.15.4 policy requires TX/RX and ACK PTI disabled; complete multi-radio request/grant/release operation is not composed."
packages = ["oer-esp32s31-coex"]

[[items]]
id = "ieee802154-product-stacks-thread"
section = "ieee802154-product-stacks"
title = "Thread"
status = "host-only"
level = "composed-product"
scope-and-limitations = "Network/upper-MAC stack integration requires an adequate radio backend; this matrix does not claim a production Thread integration."

[[items]]
id = "ieee802154-product-stacks-zigbee"
section = "ieee802154-product-stacks"
title = "Zigbee"
status = "host-only"
level = "composed-product"
scope-and-limitations = "Network/application stack capability is separate from the radio/MAC implementation."

[[items]]
id = "ieee802154-product-stacks-matter"
section = "ieee802154-product-stacks"
title = "Matter"
status = "host-only"
level = "composed-product"
scope-and-limitations = "Application-stack capability; Matter over Thread requires Thread and its radio integration. It is not a hardware MAC feature."

