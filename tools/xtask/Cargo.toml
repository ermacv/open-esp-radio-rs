[package]
name = "oer-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
oer-durable = { path = "../durable" }
oer-elf = { path = "../elf" }
oer-hil-image = { path = "../../hil/host/image" }
oer-hil-source-snapshot = { path = "../../hil/host/source-snapshot" }
oer-hil-image-class = { path = "../../hil/host/image-class" }
oer-chip-profile = { path = "../chip-profile" }
oer-command-tree = { path = "../command-tree", features = ["clap"] }
oer-hil-arbiter = { path = "../../hil/host/arbiter" }
oer-hil-observer = { path = "../../hil/observer", features = ["producer"] }
oer-process = { path = "../process" }
oer-toolchain = { path = "../toolchain" }
oer-tidy = { path = "../tidy" }
oer-repo = { path = "../repo" }
oer-esp32s31-platform-layout = { path = "../../platform/esp32s31/layout" }
oer-vendor-artifacts = { path = "../vendor-artifacts" }
oer-vendor-provenance = { path = "../vendor-provenance" }
oer-vendor-evidence = { path = "../../verification/evidence", features = ["producers"] }
oer-register-tool = { path = "../registers" }
fs2 = "0.4"
oer-image = { path = "../image" }
cargo_metadata = "=0.23.1"
clap = { version = "=4.5.48", features = ["derive"] }
pulldown-cmark = { version = "=0.13.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
toml = "=1.1.4"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
host-layer = "entry"
# The tests read the workflows, the hooks and the chip profiles.
inputs = [".github/workflows", ".claude/hooks", "platform/*/chip.toml"]
