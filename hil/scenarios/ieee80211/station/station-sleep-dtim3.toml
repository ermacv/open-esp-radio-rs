schema = 5
id = "station-sleep-dtim3"
description = "Station modem sleep at DTIM 3: RF sleep edges and the MAC counter across sleep"
role = "investigation"
tags = ["icmp", "station", "sleep"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-sleep"
link = { phy = "he20" }
power_save = "min-modem"
access_point_beacon = { interval_tu = 100, dtim_period = 3 }
count = 60
interval_ms = 500
timeout_ms = 2000
payload_bytes = 56
