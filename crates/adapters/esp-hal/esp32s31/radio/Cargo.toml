[package]
name = "oer-esp32s31-radio-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP-HAL ownership coordinator for ESP32-S31 radio platform resources"
readme = "README.md"

[features]
default = []
esp32s31 = ["dep:esp-hal", "dep:oer-esp32s31-soc-esp-hal", "dep:oer-interrupt-table"]

[dependencies]
critical-section = "1.2.0"
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "8930609f2af67e2e296a4d8f900ea3636a0acc6b", default-features = false, features = ["esp32s31", "static-interrupts", "unstable"], optional = true }
oer-bluetooth-hci = { path = "../../../../protocols/bluetooth/hci" }
oer-esp32s31-bluetooth = { path = "../../../../hardware/esp32s31/driver/bluetooth" }
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../../hardware/esp32s31/phy" }
oer-esp32s31-soc-esp-hal = { path = "../soc", features = ["esp32s31"], optional = true }
oer-interrupt-table = { path = "../../../../runtime/interrupt-table", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "adapter"
platform = "chip"
chip = "esp32s31"
