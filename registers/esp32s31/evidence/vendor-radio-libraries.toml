id = "BLOB_LIBBLE_HW_RUNTIME_CONFIG"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member ble_62.o symbols r_sym_ble_69lxyAzOOeBfNkewk2l0, r_sym_ble_uW7fgxQeZKMshYSHpqwh and r_sym_ble_QfTpg5GfTMzPcrTREkE2. They publish complete ESP32-S31 images at 0x20101b88, 0x20101b90 and 0x20101b94 from controller configuration bytes. Exact masks are low five bits, two low-five-bit values separated by fixed bits 5 and 13, and one low byte respectively. Function roles remain intentionally unnamed because the matching source identity is not recovered."

[[sources]]
id = "BLOB_LIBBLE_HW_CTE_RING_CONTROL"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195 complete ble_hw_cte.c member 11.o, plus public same-chip espressif/esp32s31-bt-lib commit 31c30949541a5d3abd4043a1cb66d55aa55577dd libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63 named ble_hw_cte.c.o and ble_lll_df.c.o. Current and named same-chip CTE hardware leaves are instruction-identical. They prove that reset clears thirteen complete words at 0x2010199c..0x201019cc, bit 15 of the first word is independently set, bits 12..14 are replaced with the low three argument bits and read back, and six pairs at 0x201019a0 + index*8 retain a low-twenty-bit compressed sample-descriptor pointer followed by a state word whose bit 31 is cleared, set and queried as software ownership. Named r_ble_lll_df_env_init allocates a 0x20-byte controller-global environment and initializes offsets 8 and 12 to one. Named r_ble_lll_linkstate_cte_config_init is called for ordinary connection, advertising and synchronization link states: it selects six buffers, links the state to environment offset 8, and, while the separate LL direction-finding ring is absent, publishes environment offset 12 as buffer-zero's descriptor and clears buffer-zero ownership. All addresses, field geometry and transforms are proved by ESP32-S31 instructions; the public named revision supplies same-chip identities and the controller-global disabled-CTE lifecycle."

[[sources]]
id = "BLOB_LIBBLE_ISO_SCHEDULER_NOTIFY"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member ble_57.o symbols r_sym_ble_BBHrCLEntlUwRxUQSeoj and r_sym_ble_lSOP0PF29bmKTVrxV8AS. Both publish the complete image 1 at 0x20101424 after manipulating software-owned ISO state; the first does so only when the current object exists and flag bit 0 at object offset 6 is set, while the second does so after its queue/publication path. The evidence proves a shared ISO-path command strobe but does not establish the command's undocumented hardware effect."

[[sources]]
id = "BLOB_LIBBTDM_CONTROLLER_IRQ"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete btdm_hal.c members 7.o and 8.o, plus _oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195 complete nrtIsr_stack.c member 103.o. Primary setup clears exact bank images 0x00008000/0x00001300, ORs those images into IRQ_ENABLE_0/1, writes one to 0x2010100c, then allocates source 0x7c with caller flags zero. Its source-124 handler reads 0x2010105c then 0x20101068 and copies both images to 0x20101058/64. Its complete 190-byte diagnostic prefix then treats bank-zero source 15 and bank-one sources 8, 9 and 12 as assertion paths; source 9 first reads complete detail words 0x201011c8/1cc and source 12 first reads complete state word 0x20101070. The handler then synchronously dispatches callback phases zero and one and has a special path selected by bank-zero bits 21/27/28 and bank-one bit 3. Current source 21, combined sources 27/28 and bank-one source 3 all reach one static recycle event. Public same-chip named bodies map that path to r_btdm_hal_radio_isr, r_btdm_recycle_in_isr and r_btdm_recycle_in_task: every dequeued ordinary or marked event drains scheduler work, while the marker adds only buffer recycling. The handler never reads 0x2010125c, so no raw source is proven to produce a finished-list bit. Complete current helpers r_sym_bt_DOVkQWJHjeuid8jcS9Bq (16 bytes) and r_sym_bt_6lAYUFKOuBLyOZ6Kvsv5 (24 bytes) respectively W1C images 0x18200000/0x00000008 to IRQ_CLEAR_0/1 and OR those same images into IRQ_ENABLE_0/1; the scheduler-run prologue calls them in that order. Primary teardown frees the route, writes one to 0x20101010 then 0x20101014, and clears the baseline enable groups. The NRT initializer allocates distinct source 0x85 with caller flags one; its handler r_sym_ble_ywjh0f9yjTBeI7XgS5da reads raw snapshots 0x20101340/48, copies them to the same clear banks, and synchronously dispatches callback mask 0x80000000 with the two-word snapshot. Independent RMW users prove the remaining recorded source positions. Event names beyond the two CPU source identities remain unknown."

[[sources]]
id = "BLOB_LIBBTDM_MODEM_LP_TIMER_IRQ"
description = "Public espressif/esp32s31-bt-lib commit 7f20740dd66ee774ffce5db0b55507892551aa31, libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099, complete member 9.o symbols r_sym_bt_waDX0omCE7oLuPVSoPOK, r_sym_bt_FYr6kIOvDbNGoOHfaRvK and r_sym_bt_atiitVoBKMplOJVvjTHP. The initializer passes r_sym_bt_FYr6kIOvDbNGoOHfaRvK to wr_btdm_osal_intr_alloc with source 0x7f and caller flags zero. The complete 0x40-byte IRQ handler first reads 0x2010d038 and returns without calling the common timer handler when that word is zero. Otherwise it reads 0x2010d06c; zero joins the common timer-handler call without reading 0x2010d058. A nonzero 0x2010d06c freshly reads 0x2010d058 and tests exactly bit 2; a clear bit joins the timer-handler call, while a set bit causes a second fresh read of 0x2010d058, ORs exactly bit 1 into that second image, writes the result back, and then joins the same call. The complete 0x6c-byte call target r_sym_bt_atiitVoBKMplOJVvjTHP samples the low byte at 0x2010d024; when nonzero it publishes zero there, samples the low byte at 0x2010d02c, conditionally publishes zero there and advances a software environment word by 0x01000000, then invokes the timer-queue dispatcher. When the first low byte is zero it still samples and conditionally clears 0x2010d02c and advances the same software word, but skips queue dispatch. Both return paths end with a fresh read of 0x2010d024. The public same-chip unobfuscated older revision role-maps the pair as r_btdm_hal_rtc_irq_handler and r_btdm_hal_rtc_timer_handler. The evidence proves the exact positional register/branch order and the boundary between hardware acknowledgement and software timer state; it does not assign undocumented hardware meanings to the positional state bytes or make the vendor callback loop suitable for the source-owned no-RTOS runtime."

[[sources]]
id = "BLOB_LIBBTDM_MODEM_LP_TIMER_RUNTIME"
description = "Public espressif/esp32s31-bt-lib commit 7f20740dd66ee774ffce5db0b55507892551aa31, libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099, complete member 9.o symbols r_sym_bt_xPWv1Z87N9d40AR9yCcT, r_sym_bt_86dRVPWrmTMQpChjYeWi and r_sym_bt_VoUEVeWY4EiqyfQlgWT0. The 0x56-byte clock sample reads 0x2010d048 then the low byte at 0x2010d02c; on a nonzero byte it advances the software epoch by 0x01000000, freshly rereads 0x2010d048, clears 0x2010d02c, publishes one to 0x2010d024 and 0x00040000 to 0x2010d010, then returns the bitwise OR of the selected counter and epoch images. The 0x70-byte compare program first publishes 0x00040000 to 0x2010d014, samples the same counter/rollover pair and uses a fresh counter plus a locally advanced epoch when rollover is nonzero. A signed deadline delta at most two publishes one to 0x2010d024; a later delta below 0x01000000 publishes the deadline low 24 bits to 0x2010d06c; every other later delta publishes the selected counter plus 0x00800000 there. Every branch finishes by publishing 0x00040000 to 0x2010d010. The 0x96-byte queue dispatcher repeatedly removes due intrusive-list heads and calls function pointers, programs the first future deadline through the compare function, or publishes 0x00040000 to 0x2010d014 when empty. The evidence proves the finite hardware clock/compare transactions and separately identifies the vendor callback loop; it does not justify executing that loop in the source-owned hard handler."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_REGISTERS"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete btdm_sched.c member 18.o scheduler list and command transactions. They reconstruct list pointers as 0x2f000000 | (compressed_20_bit_value << 2), read the 20-bit compressed pointers at 0x201010c8/cc, publish pointer/list-index/START to 0x201010ec, and separately publish payload plus START bit 31 to 0x20101254 or 0x20101258. Wait paths take scheduler BUSY from a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC), inspect recorded command status bits and clear START. Complete 12-byte leaf r_sym_bt_iFvwGI2tL5M1WM3fIkHq reads 0x2010107c once and returns exactly bits 23:20 with every other result bit zero. The worker pop path r_sym_bt_WHYoiw8ufY0AEM2KSRK1 (0x7a) is the exclusive reviewed controller accessor for this transfer: it copies the low 16 bits of 0x2010125c into a zero-high image at 0x20101260 and, when the combined hardware/software image is nonzero, synchronously dispatches it through entry five of the linker-assembled _btdm_sched_linear_broker_flash table, whose BLE subscriber is libble_app brk_sym_sched_MzeSZzbQ4ZKhWW6Wu5jV (the r_sched_txn_onSchedHwListDone role; the unobfuscated BR/EDR subscriber of the same entry is btdm_common_sched_bredr_on_sched_hw_list_done). The raw ISR does not read 0x2010125c, and no reviewed body proves an IRQ-source-to-finished-mask relation or the clear/re-arm effect of the report write. Command opcodes and other status meanings remain unknown."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8). Every scheduler BUSY sample in the command paths samples the MAC diagnostic pair instead of SCHEDULER_STATE: complete member 18.o symbols r_sym_bt_EabYtUaAIR05LXw3qZSA (0x10e), r_sym_bt_4KfpZh0Hu5NprlqcNu0D (0xf4), r_sym_bt_9H3AnHbaHJ3auzSvPDme (0x11a), r_sym_bt_B8fDByebTHuwRe8FZuRt (0x88), r_sym_bt_DkrQYQcoyzIHdYi0CzWE (0x140), r_sym_bt_FCfM3hAXphsk1qERleGZ (0x88), r_sym_bt_KmzLfKJ5UUi7zkqz1Nwn (0xc4), r_sym_bt_VrTmsQfPlkmys4UL0NZp (0x1d8), r_sym_bt_qkNMymdnaJnYUfzpKgEp (0x2e0), r_sym_bt_vibwBXogwGafrHSYUbon (0x1be) and r_sym_bt_74l62ZLsZuXg67pPHSd7 (0xce), member 19.o r_sym_bt_zwu3w1OKSOTGoGdV7TSf (0x76), member 8.o r_sym_bt_t4aeyhcVrKTNMSlq45XR (0x5e) and the source-124 reference gate in member 7.o r_sym_bt_R9GZfnUbtn7k6mHtoZbv (0xba). Each sample writes the complete image 0x38 to 0x201011e8, reads 0x201011ec until two consecutive complete reads are equal, and tests bit 7 of the accepted image; a set bit takes the path the 7f20740 bodies took for a set SCHEDULER_STATE.BUSY (bit 31 of 0x2010107c), and no body inserts a fence between the selector write and the reads. The reference gate publishes the zero SCHEDULER_REFERENCE image only for a clear bit 7 and no longer reads 0x2010107c. The deferred-work predicate r_sym_bt_37HcX0qW6j1XVtKakUIG (member 8.o, 0x50) still reads bits 31 and 29 of 0x2010107c, and the current-link-index leaf r_sym_bt_iFvwGI2tL5M1WM3fIkHq still returns its bits 23:20. FCfM keeps its 7f20740 predicate order: a set bit 7 skips both command reads, then SCHEDULER_COMMAND_0.STATUS_26 gates SCHEDULER_COMMAND_1.STATUS_18, with an assertion after 10,000 attempts. The bodies prove the selector image, the stable double read and the BUSY bit position; they do not name the diagnostic signal."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_EXECUTION_MODIFY"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) complete member 18.o symbol r_sym_bt_rPoPGH6BBYjZaunDU5FV (0x16a, the r_btdm_sched_execution_modify role of commit 31c3094). Inside the hardware critical section it repeats one attempt: it calls r_sym_bt_B8fDByebTHuwRe8FZuRt (return once a diagnostic BUSY sample is clear or, while busy, once SCHEDULER_COMMAND_0.STATUS_26 and SCHEDULER_COMMAND_1.STATUS_18 are both set), writes the complete selector image 0xc01 to 0x201011e8 and publishes the list mask, the mode bit 16 when requested and START bit 31 to 0x20101258. It then reads 0x201011ec until two consecutive complete reads are equal; while bits 2:0 hold 2, or hold 3 with bits 13:12 equal to 1, it marks the attempt for repetition and samples again. It next waits while a diagnostic BUSY sample (image 0x38) is set and SCHEDULER_COMMAND_1 bit 17 is clear, asserting after 9999 iterations, writes the complete image 7 to 0x201011e8 and waits until a stable complete value differs from 9. A marked attempt clears START and starts over; otherwise it leaves the critical section and asserts that bit 19 is clear. The body proves the selector images, lane positions, compared values and ordering; it does not name the selected signals."

[[sources]]
id = "BLOB_LIBBLE_DIAGNOSTIC_STATUS_DUMP"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) unobfuscated member base_3.o symbol api_base_ll_dumpDebugStatus (0x10e) and member ble_74.o symbol r_esp_ble_diag_select (0x20). The dump writes 0x55 to 0x201011f0 and 0xfff to 0x20101248, then for i = 0..142 writes to 0x201011e8 the OR of 4i, (4i+1) << 8, (4i+2) << 16 and (4i+3) << 24, reads 0x201011ec until two consecutive complete reads are equal and logs the accepted word. For i below 64 each byte lane carries one signal number, which indicates four eight-bit selector lanes; later iterations overlap adjacent lanes. The body names the pair as the MAC diagnostic selector and value and proves the stable double read; it does not name individual signals. r_esp_ble_diag_select writes the same enable images and routes its three arguments to 0x201011e0, 0x201011d8 and 0x201011dc, the diagnostic GPIO outputs."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_SOFTWARE_LIST_REMOVAL"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) complete member 18.o symbol r_sym_bt_FCfM3hAXphsk1qERleGZ (0x88), and libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) complete member sched_3.o symbol r_sym_sched_4yOHdQa50AXnZAom3x3f (0x12a), which oer-symbol-lineage carries from the named r_sched_txn_removeSwList of commit 31c3094. The caller mutates its software-list links before conditionally tail-calling the helper; neither body accepts a primary-event argument, acknowledges an interrupt or proves that command readiness raises source 124. Each helper attempt first takes a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC); a set value skips both command reads. An idle sample reads SCHEDULER_COMMAND_0.STATUS_26; a clear value skips the second command. Only a set STATUS_26 causes a read of SCHEDULER_COMMAND_1.STATUS_18, and only a set STATUS_18 returns. After 10,000 non-ready attempts the vendor body asserts with fresh complete command-word images and resumes waiting. The open implementation retains the proven short-circuit predicate and read order as one finite event-driven observation. Its opaque pairing with an already captured, acknowledged and durably published post-unlink primary carrier has no public constructor until a session owner proves temporal order; this is a conservative ownership split, not vendor evidence of source-124 causality or a guaranteed Pending retry wake; it does not reproduce the diagnostic loop or assign undocumented meanings to the two positional status fields."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_LIFECYCLE"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete btdm_sched.c member 18.o symbols r_sym_bt_74l62ZLsZuXg67pPHSd7 (0xce), r_sym_bt_B8fDByebTHuwRe8FZuRt (0x88), r_sym_bt_HGbPEa9oUCsYybIAWjE0 (0xe) and r_sym_bt_XPuqTHliEO5V9xpR7aJR (0x94). The first is reached from both r_btdm_task_disable and r_btdm_task_shutdown. It first takes a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC) and returns without a lifecycle write when BUSY is clear. On the busy path it masks dynamic IRQ bank-zero sources 21/27/28 and bank-one source 3, synchronously dispatches entry two of the linker-assembled _btdm_sched_linear_broker_ram table with argument zero, whose only subscriber is libble_app brk_sym_scan_fd4yzdFac8vdFTlQ4BPA clearing bit 14 of 0x201014b4 (BTMAC scheduler-run source 14), and invokes B8f before publishing the finite complete image 1 to 0x20101004. B8f returns once a fresh BUSY sample is clear; while BUSY remains set it requires SCHEDULER_COMMAND_0.STATUS_26 followed by SCHEDULER_COMMAND_1.STATUS_18 before returning. Only after that preamble does 74l publish the request and wait for BUSY to clear. This proves the whole-word image and complete ordering, but not a hardware STOP command semantic or a source-owned async wake for either wait. The open finite lifecycle transaction preserves that preamble and ordering, uses caller-owned absolute-deadline rechecks instead of vendor polling, and keeps stopped-item head retirement and software/memory ownership as separate proofs. This is source coverage, not hardware qualification or whole-function semantic equivalence. The 14-byte config builder publishes complete integer images 40 and 46. The init body zeroes its software list heads and finished mask, clears bits 0..19 of exactly sixteen stride-0x10 words at 0x2010b000..0x2010b0f0 while preserving their upper twelve bits, copies the two config values and initializes one recycle event; unlike 7f20740 it attaches no broker source, because the linear broker tables are assembled at link time. oer-symbol-lineage carries the helper names r_btdm_sched_dft_cfg_build and r_btdm_sched_init from commit 31c3094. The open implementation retains the policy in a typed software value and replaces the event, task and broker containers with one pristine static runtime epoch; it does not make the numeric broker entries an open ABI. The observations establish lifecycle transactions and array geometry; the hardware meaning of the lifecycle request and entry payload remains unknown."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_HEAD_PUBLICATION"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete btdm_sched.c member 18.o symbols r_sym_bt_EabYtUaAIR05LXw3qZSA (0x10e), r_sym_bt_4KfpZh0Hu5NprlqcNu0D (0xf4), r_sym_bt_DPWY0umixzmXEaFuUyCI (0x1c) and r_sym_bt_PVKilXLQPu1BjRkm4C6O (0x30). The first reads bits 0..19 from 0x2010b000 + list_index * 0x10 and reconstructs zero or 0x2f000000 | (image << 2). The second replaces those same low twenty bits with an SRAM item address shifted right by two while preserving bits 20..31; its result-four and result-five paths independently clear START in SCHEDULER_COMMAND_0 and SCHEDULER_COMMAND_1. Its successful publication path calls the 28-byte leaf. That leaf first calls the run prologue and writes complete image 1 to SCHEDULER_CONTROL when the prologue returns zero. The complete prologue always returns zero after calling the exact dynamic IRQ clear and enable helpers and synchronously dispatching entry one of the linker-assembled _btdm_sched_linear_broker_ram table with argument zero. Thus the branch is not a runtime predicate, and the hardware command is the final action of the larger scheduler-run operation. oer-symbol-lineage carries the roles r_btdm_sched_insertion_begin, r_btdm_sched_insertion_end, r_btdm_sched_run and the hardware-list-header leaves from commit 31c3094; these current bodies establish the physical field, table geometry and ordering."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_RUN_EVENT"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) complete member 18.o r_sym_bt_PVKilXLQPu1BjRkm4C6O synchronously dispatches entry one of the linker-assembled _btdm_sched_linear_broker_ram table with argument zero after dynamic interrupt preparation and before RUN. In libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) the only subscriber of that entry, recorded by the entry-index byte of its .subinfo descriptor, is complete member scan_2.o brk_sym_scan_b8ogEC3hTjGmqL5oRuyw: it writes only bit 14 to 0x201014b8 and then sets bit 14 at 0x201014b4 through a fresh-read RMW. The subscriber of entry two, brk_sym_scan_fd4yzdFac8vdFTlQ4BPA, clears bit 14 at 0x201014b4. The complete base-stack ISR hook brk_sym_base_QIE6fqExGJrsGUIGYNSf (r_base_stack_on_hal_enter_isr in commit 31c3094) writes its sampled pending-source image to 0x201014b8, while the BLE PHY register initializer writes all ones there, establishing the write-one-to-clear interrupt-bank role. The open implementation replaces the generic broker dispatch with this exact synchronous clear-then-enable transaction; it does not turn the entry into an asynchronous worker event."

[[sources]]
id = "BLOB_LIBBTDM_HAL_CONTROLLER_INIT"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete btdm_hal.c member 7.o symbol r_sym_bt_aGdrujd2MUAzWYH75baR, its complete config setter r_sym_bt_BOhffsuJp3HZRA44ZYRn, its byte-scaling helper and caller r_btdm_task_init in member 20.o. The caller constructs positional bytes 16, 11 and 33, complete image 2000 and SRAM base 0x2f000000. The setter accepts first byte 8 or 16 and complete image 500, 1000 or 2000, maps the latter to selector 2, 1 or 0 in the same config object, and copies the remaining inputs. The helper uses that selector: byte values are shifted right one, retained, or shifted left one respectively. Therefore the reviewed caller produces sleep-control shift 3 and HAL bytes 22 and 66; no vendor structure layout is required by the production API. The HAL body performs exactly 49 ordered writes/RMWs across 0x20101074/84/90/dc/e0, 0x201011c0/c4, 0x20101250/7c and 0x2010134c/50. Its sixteen-iteration loop covers two adjacent words with eight four-bit lanes each: for every lane it first clears nibble mask 0xc through a fresh-read RMW, then through another fresh read ORs 1 | ((global_index & 3) << 1). Thus bit zero is set, bit one is preserved-or-set, bit two is replaced and bit three is cleared; the transaction is not a complete lane assignment on arbitrary input. Unlike the fa22a8a2 body it no longer follows the 0x201010dc update with a second 0x20101090 RMW that set bit 24 for the eight-scale and cleared bits 25..31; the pinned sleep-timer paths leave those bits to their own transactions. Every address, mask, constant and ordering claim comes from these complete bodies. HAL_INIT and positional names intentionally do not assign undocumented controller semantics."

[[sources]]
id = "BLOB_LIBBTDM_RUNTIME_CONTROL"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete direct MMIO users in the low-level member 9.o and btdm_sleep.c member 20.o. They prove the sparse 0x20108800/08/2c..48 and 0x2010d000..78 register set, all recorded access directions, finite complete images, dynamic low-24-bit publications and independent bit RMWs. The source establishes BTDM runtime/sleep ownership but not the undocumented meaning of positional words; no field name below is inferred from address adjacency."

[[sources]]
id = "PUBLIC_ESP32S31_BT_RUNTIME_TIMER_ROLE"
description = "Current public espressif/esp32s31-bt-lib libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099 complete member 9.o symbol r_sym_bt_ymLPVGRY14FVW494j9ZD is a ten-byte leaf that writes complete image 1 to 0x2010d000 and returns. Public same-chip commit 31c30949541a5d3abd4043a1cb66d55aa55577dd complete unobfuscated btdm_hal_rtc.c.o symbol r_btdm_hal_rtc_start is instruction-identical. Its sole caller r_btdm_hal_enable invokes it after controller hardware initialization and controller-output preparation and before primary CPU-route allocation. The same historical object names the complete timer-initialization role r_btdm_hal_rtc_init; current complete member 9.o symbol r_sym_bt_waDX0omCE7oLuPVSoPOK is the exact geometry and order authority for the changed seven-write plus fresh-read/RMW initialization body. The historical name is role evidence only where the bodies differ."

[[sources]]
id = "BLOB_LIBBLE_CONTROLLER_OPERATIONAL_GAPS"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member ble_51.o symbols r_sym_ble_izRwciSMhvv39tBPsJHF (size 0x240) and r_sym_ble_7jv3TlgP4OsXtyxLLgrv (size 0x122). The first performs two complete zero writes each to 0x2010108c and 0x201010b8. The second publishes complete dynamic images to 0x20108804. Function roles remain unnamed; the evidence proves only physical ownership, direction, values and complete-word geometry."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_OPERATIONAL_GAPS"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member 18.o symbols r_sym_bt_DkrQYQcoyzIHdYi0CzWE (0x140), r_sym_bt_qkNMymdnaJnYUfzpKgEp (0x2e0) and r_sym_bt_VrTmsQfPlkmys4UL0NZp (0x1d8). Their direct controller-window accesses prove bit-zero set/clear RMWs at 0x20101204, complete reads plus publications of 0x80000000 | dynamic_low_20 at 0x20101218, complete reads at 0x20101324 and complete dynamic publications plus independent low-nibble clears at 0x2010136c. Positional names deliberately retain the unknown operation semantics."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_INSERTION_BRANCH"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member 18.o symbols r_sym_bt_EabYtUaAIR05LXw3qZSA (0x10e), r_sym_bt_4KfpZh0Hu5NprlqcNu0D (0xf4), r_sym_bt_YRnBzKlWCjsIbotqvNyS (0x232) and r_sym_bt_VrTmsQfPlkmys4UL0NZp (0x1d8). The complete insert wrapper calls Eab, then YRn, and reaches the lock/modify request only when Eab returned positional outcome four and the environment gate is enabled. The request pointer is loaded from YRn's first output, with a separate manager-current fallback; it is not unconditionally the originally submitted item. Complete Eab returns outcome three on its scheduler-idle edge, taken from a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC), four after the command-zero execution-lock edge and five on the current-head path. Complete 4Kfp independently clears command-zero START for outcome four, handles head publication plus command-one clear for outcome five, and owns the remaining conditional head/RUN path. Positional names deliberately retain semantics not established by the current archive alone."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_EMPTY_LIST_MERGE"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) complete member 18.o symbol r_sym_bt_YRnBzKlWCjsIbotqvNyS (0x232), which oer-symbol-lineage carries from the named r_btdm_sched_merge_list_remove_overlap of public same-chip commit 31c30949541a5d3abd4043a1cb66d55aa55577dd. With a non-null submitted item, empty manager head/tail/current slots and the DTM item's cleared positional flag at +0x4f.3, the remove-unshareable helper r_sym_bt_E8c5Eimm0z6kYe9v4wHr receives a null candidate and returns without mutation. The merge clears item control byte +0x4e, installs the in-flight status at +0x38, clears the software-next word at +0x50, clears only the low-twenty-bit compressed hardware-next link at item +0x00 while preserving its upper allocation image, installs the submitted item as all three source manager references and first selected-item output, and returns positional result seven. The open controller-memory transition owns only the item writes; the source-owned Rust scheduler epoch replaces the vendor manager container rather than reproducing its ABI. This source proves the first insertion into an independently established empty epoch only and grants no non-empty merge, visibility, MMIO publication or completion authority."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_INSERTION_EXECUTION_COMMANDS"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member 18.o symbols r_sym_bt_9H3AnHbaHJ3auzSvPDme (0x11a), called by complete insertion-begin r_sym_bt_EabYtUaAIR05LXw3qZSA (0x10e). The first waits for the command drain of r_sym_bt_B8fDByebTHuwRe8FZuRt, enters the hardware critical section and publishes SCHEDULER_COMMAND_0 as START, zero-based hardware-list index in bits 23:20 and the four-byte-compressed selected-item address in bits 19:0. While a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC) stays set it observes STATUS_24; once that field is set it retains exactly bits 29:27 as the positional execution-lock result, and an idle sample returns failure. Result zero keeps the command-zero lock for begin outcome four. The body asserts for positional results one, three and four; every nonzero result then returns failure, so results two, five, six and seven enter current-head reconciliation as an ordinary failed lock. After 10,000 busy attempts without STATUS_24 it asserts with both complete command words and resumes waiting. Insertion-begin then passes a one-hot sixteen-list mask and selector zero to r_sym_bt_rPoPGH6BBYjZaunDU5FV before current-head reconciliation. In libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099 of espressif/esp32s31-bt-lib 7f20740dd66ee774ffce5db0b55507892551aa31 member 19.o, that second function published the mask plus START to SCHEDULER_COMMAND_1, waited only while SCHEDULER_STATE.BUSY was set and STATUS_17 clear, and required STATUS_19 clear; the pinned body replaces this with a different diagnostic-selector protocol, which this source does not yet review. oer-symbol-lineage carries the named roles r_btdm_sched_execution_lock and r_btdm_sched_execution_modify from commit 31c3094."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_INSERTION_END_BRANCH"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member 18.o symbol r_sym_bt_4KfpZh0Hu5NprlqcNu0D (0xf4). Positional begin outcome four first clears SCHEDULER_COMMAND_0.START. Outcome five first publishes the submitted item as hardware-list head and then clears SCHEDULER_COMMAND_1.START. Both then enter the common continuation. The body next takes a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC) and returns without later publication while busy. Once idle it calls the current instruction-corresponding r_btdm_sleep_is_enabled role. A disabled result publishes the manager software-list head and returns without RUN. An enabled result reads submitted-item status +0x38: a value other than the established in-flight sentinel returns without later MMIO, while the sentinel path publishes the submitted item as head, executes the mapped scheduler-run function and returns. The older named same-chip insertion-end supplies role names only; the BUSY observation order and the manager-head and item-status branches come solely from this complete current body."

[[sources]]
id = "PUBLIC_ESP32S31_BT_SCHEDULER_ROLES"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c, contains unobfuscated btdm_sched.c.o, btdm_hal_link.c.o and btdm_broker.c.o. oer-symbol-lineage carries its names to the pinned libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8). Named r_btdm_sched_insert_with_lock_modify (0x154) has the control flow and call sequence of current r_sym_bt_VrTmsQfPlkmys4UL0NZp (0x1d8). The current body waits while a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC) and 0x20101218 bit 31 are both set, replaces the low nibble of 0x2010136c, publishes START plus the compressed pointer, repeats the same wait and reports positional diagnostic result zero when the scheduler is idle or bits 30:27 of the request word read before that BUSY sample otherwise. Named 12-byte r_btdm_sched_get_current_link_index is instruction-identical to current 12-byte r_sym_bt_iFvwGI2tL5M1WM3fIkHq; both return exactly 0x2010107c bits 23:20. The same historical object supplies the roles r_btdm_sched_skip_specified_sch (current r_sym_bt_DkrQYQcoyzIHdYi0CzWE), r_btdm_sched_delete_specified_items (r_sym_bt_qkNMymdnaJnYUfzpKgEp), r_btdm_sched_insertion_begin, r_btdm_sched_insertion_end, r_btdm_sched_get_hw_list_header, r_btdm_sched_set_hw_list_header and r_btdm_sched_run for the current call graph. The named header leaves use the same sixteen-entry stride-0x10 table, preserve its upper twelve bits and encode zero or a four-byte-aligned 0x2f-prefixed SRAM address in bits 0..19. The named insertion-end has the same result-four/result-five command START clears, head publication and run call structure as current r_sym_bt_4KfpZh0Hu5NprlqcNu0D. The named run body calls r_btdm_hal_link_basic_irq_clear, r_btdm_hal_link_basic_irq_enable and r_btdm_broker_publish with selector two and argument zero before writing complete image 1 to SCHEDULER_CONTROL; the named IRQ helpers are instruction-identical to current r_sym_bt_DOVkQWJHjeuid8jcS9Bq and r_sym_bt_6lAYUFKOuBLyOZ6Kvsv5, and the current run prologue dispatches the linker-assembled linear broker entry one instead of the attached broker selector. This earlier same-chip revision is role-only evidence; all current addresses, masks, ordering and result extraction come independently from the current ESP32-S31 archive pinned by the BLOB sources."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_CANCELLATION"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member 8.o symbol r_sym_bt_t4aeyhcVrKTNMSlq45XR (0x5e) and member 18.o symbols r_sym_bt_qkNMymdnaJnYUfzpKgEp (0x2e0) and r_sym_bt_DkrQYQcoyzIHdYi0CzWE (0x140). The first publishes 0x201010ec as bit 31 START, the zero-based hardware-list index in bits 23:20 and the four-byte-compressed item pointer in bits 19:0, waits while both a diagnostic BUSY sample and START are set, returns bits 29:28 or four when BUSY cleared first, and writes zero to the complete word. The two callers set item word bit 25 on every item they pass to it. qkNM enters its skip sequence only after a set BUSY sample; DkrQ has no BUSY precondition. When the scheduler environment enables lock/modify, both wait while 0x20101218 bit 31 is set, clear and then publish the list index in 0x2010136c bits 7:4 through fresh-read updates, write complete image 0x80 to 0x20101058, set 0x20101204 bit 0, wait while BUSY is set and 0x20101324 bit 0 is clear, wait while BUSY is set and 0x20101208 bit 0 is set, and finally clear 0x20101204 bit 0. Every BUSY test in these bodies is a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC). qkNM brackets its per-item skip requests with this sequence and ends the loop on skip result two or four; DkrQ performs its skip requests first and the sequence afterwards. Result zero reaches the vendor assertion in both callers. The hardware effect of the skip request and of 0x20101204 bit 0 is not established."

[[sources]]
id = "PUBLIC_ESP32S31_BT_SCHEDULER_CANCELLATION_ROLES"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c. Named btdm_hal_link.c.o r_btdm_hal_link_skip_specified_tl (0x4a), btdm_sched.c.o r_btdm_sched_delete_specified_items (0x2b0) and r_btdm_sched_skip_specified_sch (0x138) are the roles oer-symbol-lineage carries to current r_sym_bt_t4aeyhcVrKTNMSlq45XR, r_sym_bt_qkNMymdnaJnYUfzpKgEp and r_sym_bt_DkrQYQcoyzIHdYi0CzWE. The current bodies keep the named control flow and replace each scheduler-state BUSY read with a diagnostic BUSY sample. This earlier revision supplies role names only; current register behavior comes from the pinned current archive."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_LIST_DELETION"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member 18.o symbol r_sym_bt_KmzLfKJ5UUi7zkqz1Nwn (0xc4). After calling a sleep-path function it forwards a non-null item chain to r_sym_bt_qkNMymdnaJnYUfzpKgEp. Without a chain it clears the software list's current, head and tail words and, for a non-negative hardware-list index, takes a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC): a clear sample clears the head pointer field of that list directly; a set sample calls r_sym_bt_rPoPGH6BBYjZaunDU5FV with the one-hot list mask and mode argument one, clears the head pointer field and clears SCHEDULER_COMMAND_1.START. In libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099 of espressif/esp32s31-bt-lib 7f20740dd66ee774ffce5db0b55507892551aa31 member 19.o, the called function published the mask plus START with mode bit 16 to SCHEDULER_COMMAND_1; its pinned diagnostic-selector protocol is not yet reviewed here. The effect of the mode bit is not established."

[[sources]]
id = "PUBLIC_ESP32S31_BT_SCHEDULER_LIST_DELETION_ROLE"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c. Named btdm_sched.c.o r_btdm_sched_delete_from_list (0x80) has the same chain forwarding and whole-list deletion branches as current r_sym_bt_KmzLfKJ5UUi7zkqz1Nwn, which adds the leading sleep-path call and takes BUSY from the diagnostic pair; named r_btdm_sched_execution_modify is the role of current r_sym_bt_rPoPGH6BBYjZaunDU5FV. This earlier revision supplies role names only; current register behavior comes from the pinned current archive."

[[sources]]
id = "PUBLIC_ESP32S31_BT_SCHEDULER_LIST_INDEX"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c and initial libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63 retain unobfuscated scheduler list roles. Named r_sched_txn_insertIntoList loads the signed zero-based hardware-list index from scheduler-manager byte +0x18 and passes it as the third argument to r_btdm_sched_insert_with_lock_modify. That body uses the same value for insertion begin/end, the sixteen-entry hardware-list table and the 0x2010136c low nibble. Its current counterpart r_sym_bt_VrTmsQfPlkmys4UL0NZp in libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) independently establishes the register geometry and ordering. Current DTM allocation and event bodies match the named path: their separately allocated 0x48-byte zeroed scheduler context embeds the manager at +0x2c, so the manager's list-index byte at context +0x44 is zero and DTM is assigned hardware list zero."

[[sources]]
id = "PUBLIC_ESP32S31_BT_TIME_ROLES"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c and initial libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63 retain unobfuscated controller-time roles. Exact body and size comparison maps named r_btdm_sleep_timer_ticks_get (0xb2) to pinned r_sym_bt_KrvfcwDw4eZoaTPVdFj5 (0xd8, whose always-awake path keeps the named body and whose added low-power branch estimates time from the RTC), named r_sched_timer_convertTimeToUs (0x4e) to current r_sym_ble_3ISuZaEAZjklAjtGLFxW (0x4e), named r_sched_timer_convertTimeToTicks (0x42) to current r_sym_ble_197uJiP5A7SWsg1IGw84 (0x42), and named r_btdm_hal_util_ticks_to_us (0x34) to current r_sym_bt_RJ9vWjyuZJabuhkGCaRp (0x34). The same complete-body comparison maps named r_sched_timer_init (0x3c), r_sched_timer_on_task_enable (0x4), r_sched_timer_on_task_run (0x4c) and r_sched_timer_updateRefTime (0x6c) to current member 109.o symbols r_sym_ble_QmoRYfZm8A0eydn3pYMd, r_sym_ble_W6fa587j7hPodGAGqqjq, r_sym_ble_7b5BVoRbciXjlNJCpcqu and r_sym_ble_I7hG9nRpY0HKGB9EK0hX respectively. Init zeroes both reference images; task-enable is a no-op; task-run tail-calls the reference update. The update samples raw time, converts the wrapping delta from the prior raw reference while retaining the helper remainder, then stores sampled raw time minus that remainder and advances the scheduler reference by the converted quotient. The complete config setter r_sym_bt_BOhffsuJp3HZRA44ZYRn stores the period-dependent software selector 2/1/0 for period images 500/1000/2000 in the byte read by the conversion helper. This selector is distinct from the hardware sleep-timer divider. For standalone selector zero, the first update from zero references retains sample modulo two as a raw-tick remainder: raw_anchor=sample-(sample modulo two), scheduler_anchor=sample/2. The current libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099 and libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195 independently prove the always-awake register order and arithmetic. This earlier same-chip revision supplies role names only; it does not establish a public physical time unit, effective counter width or low-power RTC-path contract."

[[sources]]
id = "PUBLIC_ESP32S31_BT_TIME_MICROSECOND_DOMAIN"
description = "The current pinned ESP32-S31 bodies and the named same-chip roles jointly establish the always-awake software time unit without importing a vendor ABI. Current r_sym_ble_4QeP6vZAoSzLLHdFgwD0 obtains r_btdm_sleep_timer_ticks_get and immediately feeds it to r_sched_timer_convertTimeToUs. Current DTM r_sym_ble_G4zC4UNjJYmyjOsZ3vNq combines that converted value with independently recovered microsecond literals 500 and 1000, the microsecond LLL preparation lead, and microsecond packet airtime, then calls r_sched_timer_convertTimeToTicks on both descriptor boundaries. The named r_btdm_hal_util_ticks_to_us body implements the selected scale, and the inverse helper implements the reverse projection with an explicit remainder. The complete config setter r_sym_bt_BOhffsuJp3HZRA44ZYRn (member 7.o, 0x10e) writes software selector zero for standalone period image 2000; the conversion helper reads that selector and takes its right-shift-by-one branch with the discarded raw tick as remainder. One standalone raw tick therefore equals half a microsecond. The sleep-timer hardware divider image three is a separate configuration value and is not the software conversion selector. This establishes the unit and conversion used by the open always-awake DTM scheduler; it does not establish effective counter width, sleep-enabled wake causality, or the independent source-127 low-power RTC frequency."

[[sources]]
id = "PUBLIC_ESP32S31_BLE_COMPLETION_ROLES"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63 and initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c, retain unobfuscated scheduler and DTM roles. oer-symbol-lineage carries r_sched_txn_onSchedHwListDone (0x1ca) to current libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) brk_sym_sched_MzeSZzbQ4ZKhWW6Wu5jV (0x1ca) and r_ble_lll_dtm_recycle_sch_item (0x144) to current sym_dtm_ifYtgHeQ0rvhqeqBbpl1 (0x172), and in libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) r_btdm_sched_pick_finished_items to r_sym_bt_M9nG353V0svWrv1l1zGw (0x144), r_btdm_recycle_in_task to r_sym_bt_uNi9OHmE7XdXfGqTelU5 (0x6a), r_btdm_sched_pop_executed_sch to r_sym_bt_WHYoiw8ufY0AEM2KSRK1 (0x7a) and r_btdm_recycle_process_dequeued_sch to r_sym_bt_QsLKLOCC2pct4rL8uFBN (0x6c). The pinned pick-finished body waits for the command drain of r_sym_bt_B8fDByebTHuwRe8FZuRt before asserting that the hardware-list head no longer names each picked item. Current complete bodies independently establish the finished-list, software completed-queue and item callback behavior; the earlier archive supplies role names only and no current MMIO or ABI claims."

[[sources]]
id = "BLOB_LIBBLE_DTM_PACKET_HEADER_BINDING"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member memMgmt_3.o r_sym_memMgmt_2LOgKQI4pa8z243VUnLR and member dtm_4.o sym_dtm_25YOj8pPkiCiy504xJbR establish the DTM TX allocation graph. The former stores the compressed packet base at header +0x04, compressed packet+0x10 at header +0x08, and the DTM-supplied full-capacity profile at header +0x10; the latter writes the standard no-CTE LE Test PDU header at packet +0x10, length at +0x11 and declared payload at +0x12. Public same-chip commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63, retains the named r_ble_lll_mmgmt_alloc_tx_buffer_and_hdr and r_ble_lll_dtm_tx_create_ctx roles those bodies correspond to. Complete member memMgmt_3.o r_sym_memMgmt_vqXcstfse8788iyCxlJf and r_sym_memMgmt_wH5HONweyQB0WZipVFDn allocate the RX packet and place its compressed base in the bound RX header. This proves exact CPU producer bindings in the controller-visible graph, not a field-specific packet-engine reader or physical meaning for the opaque high header lanes."

[[sources]]
id = "BLOB_LIBBLE_DTM_LINK_STATE_RESET_PROFILE"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member dtm_4.o symbol sym_dtm_7gOGApwmDG1TxZOfQhrh is 0x120 bytes, and oer-symbol-lineage pairs it with r_ble_lll_dtm_reset_link_state of public same-chip commit 31c30949541a5d3abd4043a1cb66d55aa55577dd (initial libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63), whose complete named body independently ORs bit 27 followed by bit 26. The pinned body likewise ORs bit 27 and then bit 26 into link-state word +0x14 on every path, the aggregate (old & 0xf3ffffff) | 0x0c000000. This proves the aggregate DTM reset profile at +0x14[27:26]. It does not establish separate names or field-specific hardware consumers for the two selected bits."

[[sources]]
id = "BLOB_LIBBLE_DTM_RX_RSSI"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); member esp_1.o symbol esp_ble_get_dtm_rx_rssi (0x8) tail-calls member dtm_2.o sym_dtm_ydFzYkQJZ1ArZKhfWxJ5 (0x8), which tail-calls complete member dtm_4.o sym_dtm_JMPstxdIRcEVY1YJeXkA (0x1c). The target follows the DTM environment and returns byte +0xb9 with signed lb, or 127 without an environment; environment resets also store 127. Complete member dtm_4.o sym_dtm_ikQ7xyHA5qBHWlaqAjZu copies returned RX packet result byte +0x0f into the same environment byte only after accepting a zero low-24 result image. This proves the copied high byte is a signed DTM RSSI value. It does not establish a physical unit, calibration, or meanings for the rejected low 24 bits."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_WAIT_TAIL"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member 18.o symbols r_sym_bt_DkrQYQcoyzIHdYi0CzWE (0x140) and r_sym_bt_qkNMymdnaJnYUfzpKgEp (0x2e0). Both complete functions share the same controller wait tail. After setting 0x20101204 bit zero, software first observes 0x20101324 bit zero against a diagnostic BUSY sample (BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC), then observes 0x20101208 bit zero against a fresh sample of the same BUSY bit, and finally clears 0x20101204 bit zero. The second predicate continues while 0x20101208 bit zero is one. The evidence assigns no meaning to that bit or to the unconsumed bits."

[[sources]]
id = "BLOB_LIBBTDM_RUNTIME_OPERATIONAL_GAPS"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member 19.o symbols r_sym_bt_aOsjkDNQyOII2OseK6av (0x372), r_sym_bt_1Gbu522bM6JExNgRaco7 and r_sym_bt_32zs9B7Gv9vHIVpsl2A7 (0x1cc). aOsjk publishes the finite complete image 0x10 to 0x20108804, reads 0x2010d064, clears the complete word at 0x2010d01c and reads it twice, and later publishes a dynamic complete image to 0x2010d064. 1Gbu publishes the finite complete images 0x80, 0x40 and 0x800 to 0x20108804. The fa22a8a2 revision issued the 0x80 and 0x40 images from aOsjk; the pinned 32zs no longer touches these words. No undocumented operation meaning is assigned."

[[sources]]
id = "BLOB_LIBBTDM_SLEEP_TIMER_REGISTERS"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete btdm_sleep.c paths. The timer-programming paths r_sym_bt_Om3oeseqyzxJTVgbw4Wp (member 18.o), r_sym_bt_HkSB5rY0aoJLnHldAOO9 and r_sym_bt_zwu3w1OKSOTGoGdV7TSf (member 19.o) write the first computed word to 0x20101094 and, in the latter two, words to 0x20101098 and 0x2010109c, then set bit 31 in 0x20101090. The time-read paths r_sym_bt_KrvfcwDw4eZoaTPVdFj5, r_sym_bt_32zs9B7Gv9vHIVpsl2A7, r_sym_bt_aOsjkDNQyOII2OseK6av (member 19.o) and r_sym_bt_1oCMtmOT1H9hQJgJtlO1 (member 15.o) set bit 26, wait for hardware to clear it, and then consume the latched controller time from 0x201010ac. The controller HAL initialization (BLOB_LIBBTDM_HAL_CONTROLLER_INIT) publishes control bits 0..2 and, unlike fa22a8a2, no longer rewrites bits 24..31. The evidence establishes a sleep-timer transaction but does not assign inner counter/window semantics to the three data words."

[[sources]]
id = "BLOB_LIBBTDM_SLEEP_TIMER_SNAPSHOT"
description = "libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete btdm_sleep.c member 19.o symbol r_sym_bt_32zs9B7Gv9vHIVpsl2A7 and member 15.o symbol r_sym_bt_1oCMtmOT1H9hQJgJtlO1. Each sets 0x20101090 bit 26, waits for hardware to clear it, then reads the ordered snapshot words at 0x201010ac, 0x201010b0 and 0x201010b4; 32zs stores them into software-state offsets 0x2c, 0x30 and 0x34. The order and whole-word widths are proven; inner counter or window meanings remain unknown."

[[sources]]
id = "BLOB_LIBBLE_CONTROLLER_TRANSACTION_WORDS"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); direct instruction evidence from member ble_59.o symbols r_sym_ble_8UF9MdmrIB3xzJL37y69 and r_sym_ble_ayzkbWXdt7oT4JBQ2fZa and member ble_60.o symbol r_sym_ble_y2VPPii0Dg0SROjRpV07 proves the low-twenty-bit compressed SRAM-pointer reads at 0x20101080. Member memMgmt_2.o symbol r_sym_memMgmt_rys45AxT1geyo5W0TUT5 proves the transaction at 0x201010c4, and member sched_3.o symbol r_sym_sched_hG0vjzWD9iloJ7W5NaCG the same positional transaction shape at 0x201010d8. The sequences publish bit 31 with a dynamic low-twenty-bit value while bits 20..29 are zero, poll bit 30, and republish while bit 31 is clear. Source identities are software-context hints and do not establish RX, TX or link-layer hardware meaning."

[[sources]]
id = "BLOB_LIBBLE_HW_POSITIONAL_WORD_1874"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); ble_hw.c member ble_68.o symbols r_sym_ble_Zl3qiGNWbkk3Jppj4Wzu, r_sym_ble_CX4quJm6H0AYnGOQmQIm, r_sym_ble_s3mGfL8pOw7v42rf3Uq9, r_sym_ble_tOCGaLxKLDEp3XSu87ee, r_sym_ble_HO8wcaVJ18N9VyWDUEAi and r_sym_ble_MYLyveve8Kxs7BxPBxOK. Six complete writes to 0x20101874 publish a dynamic low-twenty-bit image and zero in bits 20..31. No read is observed, and the software source context does not establish pointer, index, queue or event semantics."

