[workspace]
resolver = "3"
members = [
    "runtime",
    "telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
# Original network stack; HIL exercises the public upstream driver contract.
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "c0fdd08e94138105fba8be3133c4ced91afc30fc", features = ["icmp-ping-reply", "dhcpv4", "medium-ethernet", "tcp-listener", "udp"] }
# One network poll drains up to 16 driver RX owners before sockets can run.
xarxa = { git = "https://github.com/embassy-rs/xarxa", rev = "14c369bbcbe8ee7167488ac9c9e18be059d83555", default-features = false, features = ["udp-rx-queue-count-16"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "0.3"
embedded-io-async = "0.7.0"
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "bee3369c35dfc10048b1d524150d99869f8a4352", default-features = false }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "bee3369c35dfc10048b1d524150d99869f8a4352", default-features = false }
esp-sync = { git = "https://github.com/ermacv/esp-hal", rev = "bee3369c35dfc10048b1d524150d99869f8a4352" }
log = { version = "0.4.27", features = ["max_level_trace", "release_max_level_info"] }
heapless = "0.9.3"
open-esp-radio = { path = "../../../driver/radio", default-features = false, features = ["wifi"] }
open-esp-radio-network = { path = "../../../driver/network/interface" }
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../../driver/adapters/esp-hal/esp32s31/ieee80211" }
open-esp-radio-esp32s31-hal = { path = "../../../driver/chips/esp32s31/hal" }
open-esp-radio-esp32s31-embassy-runtime = { path = "../../../driver/adapters/embassy/esp32s31/runtime", features = ["esp32s31"] }
open-esp-radio-esp32s31-embassy-wifi = { path = "../../../driver/integration/esp32s31/embassy/ieee80211", default-features = false, features = ["upstream-network"] }
open-esp-radio-esp32s31-pac = { path = "../../../driver/chips/esp32s31/pac", features = ["validation-probes"] }
open-esp-radio-esp32s31-platform-pac = { path = "../../../driver/adapters/esp-hal/esp32s31/soc", features = ["esp32s31"] }
open-esp-radio-esp32s31-phy = { path = "../../../driver/chips/esp32s31/phy" }
open-esp-radio-esp32s31-wifi-mac = { path = "../../../driver/chips/esp32s31/ieee80211/mac" }
open-esp-radio-esp32s31-wifi-embassy = { path = "../../../driver/runtime/embassy/esp32s31/ieee80211", default-features = false }
open-esp-radio-ieee80211 = { path = "../../../driver/ieee80211/mac" }
open-esp-radio-wifi-sta = { path = "../../../driver/ieee80211/sta" }
open-esp-radio-wifi-embassy = { path = "../../../driver/adapters/embassy/ieee80211" }
open-esp-radio-hil-protocol = { path = "../../protocol" }
open-esp-radio-hil-esp32s31-telemetry = { path = "telemetry" }
portable-atomic = { version = "1.11", default-features = false }
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
static_cell = "2.1.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = true
panic = "abort"
strip = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "507d14dbccfc26128b929b044d76f09cf2d1d2f6" }

# Share the unmodified official timer ABI with the registry platform backend.
[patch."https://github.com/embassy-rs/embassy"]
embassy-time-driver = { version = "=0.2.2", registry = "crates-io" }
