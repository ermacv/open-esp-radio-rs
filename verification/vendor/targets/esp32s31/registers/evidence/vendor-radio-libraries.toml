id = "PUBLIC_ESP32S31_BT_SCHEDULER_ROLES"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c, contains unobfuscated btdm_sched.c.o, btdm_hal_link.c.o and btdm_broker.c.o. Its named r_btdm_sched_insert_with_lock_modify body (size 0x154) has the same control flow, call sequence and controller-window transaction as current pinned r_sym_bt_VrTmsQfPlkmys4UL0NZp (size 0x156). The current body waits while both 0x2010107c bit 31 and 0x20101218 bit 31 are set, replaces the low nibble of 0x2010136c, publishes START plus the compressed pointer, repeats the same wait and reports positional diagnostic result zero when scheduler state is idle or bits 30:27 from the request word otherwise. Named 12-byte r_btdm_sched_get_current_link_index is instruction-identical to current 12-byte r_sym_bt_iFvwGI2tL5M1WM3fIkHq; both return exactly 0x2010107c bits 23:20. The same historical object maps r_btdm_sched_skip_specified_sch (0x138) to current r_sym_bt_DkrQYQcoyzIHdYi0CzWE (0x138), r_btdm_sched_delete_specified_items (0x2b0) to current r_sym_bt_qkNMymdnaJnYUfzpKgEp (0x2b0), and supplies named r_btdm_sched_insertion_begin, r_btdm_sched_insertion_end, r_btdm_sched_get_hw_list_header, r_btdm_sched_set_hw_list_header and r_btdm_sched_run roles for the current call graph. The named header leaves use the same sixteen-entry stride-0x10 table, preserve its upper twelve bits and encode zero or a four-byte-aligned 0x2f-prefixed SRAM address in bits 0..19. The named insertion-end has the same result-four/result-five command START clears, head publication and run call structure as current r_sym_bt_4KfpZh0Hu5NprlqcNu0D. The named run body calls r_btdm_hal_link_basic_irq_clear, r_btdm_hal_link_basic_irq_enable and r_btdm_broker_publish with selector two and argument zero before writing complete image 1 to SCHEDULER_CONTROL; the named IRQ helpers are instruction-identical to current r_sym_bt_DOVkQWJHjeuid8jcS9Bq and r_sym_bt_6lAYUFKOuBLyOZ6Kvsv5, and named r_btdm_broker_publish is instruction-identical to current r_sym_bt_3DcjgYC1ikQrP7jNyXGR. This earlier same-chip revision is role-only evidence; all current addresses, masks, ordering and result extraction come independently from the current ESP32-S31 archive pinned by the BLOB sources."

[[sources]]
id = "PUBLIC_ESP32S31_BT_SCHEDULER_LIST_INDEX"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c and initial libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63 retain unobfuscated scheduler list roles. Named r_sched_txn_insertIntoList loads the signed zero-based hardware-list index from scheduler-manager byte +0x18 and passes it as the third argument to r_btdm_sched_insert_with_lock_modify. That body uses the same value for insertion begin/end, the sixteen-entry hardware-list table and the 0x2010136c low nibble. Its current instruction-equivalent r_sym_bt_VrTmsQfPlkmys4UL0NZp independently establishes the register geometry and ordering. Current DTM allocation and event bodies match the named path: their separately allocated 0x48-byte zeroed scheduler context embeds the manager at +0x2c, so the manager's list-index byte at context +0x44 is zero and DTM is assigned hardware list zero."

[[sources]]
id = "PUBLIC_ESP32S31_BT_TIME_ROLES"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c and initial libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63 retain unobfuscated controller-time roles. Exact body and size comparison maps named r_btdm_sleep_timer_ticks_get (0xb2) to current pinned r_sym_bt_KrvfcwDw4eZoaTPVdFj5 (0xb2), named r_sched_timer_convertTimeToUs (0x4e) to current r_sym_ble_3ISuZaEAZjklAjtGLFxW (0x4e), named r_sched_timer_convertTimeToTicks (0x42) to current r_sym_ble_197uJiP5A7SWsg1IGw84 (0x42), and named r_btdm_hal_util_ticks_to_us (0x34) to current r_sym_bt_RJ9vWjyuZJabuhkGCaRp (0x34). The same complete-body comparison maps named r_sched_timer_init (0x3c), r_sched_timer_on_task_enable (0x4), r_sched_timer_on_task_run (0x4c) and r_sched_timer_updateRefTime (0x6c) to current member 109.o symbols r_sym_ble_QmoRYfZm8A0eydn3pYMd, r_sym_ble_W6fa587j7hPodGAGqqjq, r_sym_ble_7b5BVoRbciXjlNJCpcqu and r_sym_ble_I7hG9nRpY0HKGB9EK0hX respectively. Init zeroes both reference images; task-enable is a no-op; task-run tail-calls the reference update. The update samples raw time, converts the wrapping delta from the prior raw reference while retaining the helper remainder, then stores sampled raw time minus that remainder and advances the scheduler reference by the converted quotient. Every accepted ESP32-S31 scale image is positive, so the first update from zero references has zero remainder and produces raw_anchor=sample and scheduler_anchor=sample<<(shift_image-1), with 32-bit wrapping. The current libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099 and libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195 independently prove the always-awake register order and arithmetic. This earlier same-chip revision supplies role names only; it does not establish a public physical time unit, effective counter width or low-power RTC-path contract."

