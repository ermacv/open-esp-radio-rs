# Focused IEEE 802.15.4 discovery surfaces over the authenticated BTBB and
# coexistence artifacts. Keep the public esp_ieee802154_ controller family out
# of executable analysis until its matching linked ESP-IDF image exists. The
# existing artifact-wide profiles remain the function/register inventory
# authority; these focused profiles only bound human-sized review scopes.
[[analysis.public-symbol-families]]
id = "ble-public-controller"
protocols = ["ble"]
source = "ble-controller"
symbol-prefix = "r_ble_controller_"
disposition = "required"
profile = "ble-controller-all"

