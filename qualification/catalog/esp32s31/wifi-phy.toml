section = "wifi-802-11ax-he"
title = "Triggered response scheduling"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "Basic Trigger parsing, association/AID validation, bounded response deadlines and queue/MPLEN/BSR preparation exist. Production configuration disables the path, and the final HE-TB PHY vector/doorbell transition is explicitly unverified."
