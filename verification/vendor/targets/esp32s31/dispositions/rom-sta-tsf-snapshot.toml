schema = 3
# Finite coherent STA TSF snapshot. The four-case profile closes both optional
# output-pointer branches and compares the scratch writes and ordered MMIO.
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "rom"
symbol = "hal_get_sta_tsf"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac::wifi::mac::tsf::snapshot_station_tsf"
binding = "v2"
rust-binding = "exact-production-entry"
rust-probe = "open_rom_power_tsf_trace_hal_get_sta_tsf"
comparison-plan = "direct-effects-v1"
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010d814 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x2010d814 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010d820 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010d824 }
disposition = { kind = "required" }
