[package]
name = "oer-hil-esp32c5-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The minimal image that proves the esp32c5 boot path: the ESP-IDF
# bootloader loads the application, which starts Embassy and wakes once on
# its timer.
boot-smoke = []

[dependencies]
embassy-executor.workspace = true
embassy-time.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-hal.workspace = true
esp-rtos.workspace = true

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "chip"
chip = "esp32c5"
default-configuration = false
supported-feature-profiles = [
    "boot-smoke",
]
