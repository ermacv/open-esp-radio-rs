[package]
name = "oer-esp32s31-ieee80211"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Role-neutral ESP32-S31 Wi-Fi device composition"

[dependencies]
oer-esp32s31-coex = { path = "../coex" }
oer-esp32s31-hal = { path = "../../hal" }
oer-esp32s31-phy = { path = "../../phy" }
oer-esp32s31-ieee80211-dma = { path = "dma" }
oer-esp32s31-ieee80211-mac = { path = "mac" }
oer-ieee80211-lower-mac = { path = "../../../../protocols/ieee80211/lower-mac" }
oer-memory = { path = "../../../../memory" }
oer-radio-port = { path = "../../../../radio/port" }
oer-ieee80211-mac = { path = "../../../../protocols/ieee80211/mac" }
oer-ieee80211-softmac = { path = "../../../../protocols/ieee80211/softmac" }
oer-time = { path = "../../../../time" }

[features]
default = []
test-support = ["oer-esp32s31-ieee80211-mac/test-support"]
task-poll-telemetry = [
    "dep:riscv",
    "oer-esp32s31-ieee80211-mac/task-poll-telemetry",
]

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[dev-dependencies]
oer-time-virtual = { path = "../../../../adapters/virtual/time" }

# Host unit tests use the allocating MAC model. RV32 API doctests exercise
# the production API without introducing an allocator into their binaries.
[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
oer-esp32s31-ieee80211-mac = { path = "mac", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "hardware"
platform = "chip"
chip = "esp32s31"
