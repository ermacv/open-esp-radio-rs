schema = 5
id = "udp-rx-ht40-core0-rx-cycles-diagnostic"
description = "Intrusive Core0 RX phase, service-batch, credit-floor and task-residence diagnostic"
role = "investigation"
tags = ["diagnostic", "udp", "station", "rx", "ht40", "mcs7", "core0", "cycles", "credits", "admission-ab", "cache-ab", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-core0-rx-cycles"

[wifi.datapath]
rx_continuation = "adaptive-probe-diagnostic"
l1_cache_counters = true

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40", minimum_mcs = 7 }
duration_seconds = 12
payload_bytes = 1472
offer = { rx_bps = 140000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 60000000
maximum_idle_channel_utilization_255 = 64
