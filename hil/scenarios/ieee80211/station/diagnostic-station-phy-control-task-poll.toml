schema = 5
id = "diagnostic-station-phy-control-task-poll"
description = "PHY access control with task residence under saturated UDP TX"
repetitions = 1
transfer = "identical-image"
tags = ["phy-maintenance", "diagnostic", "station", "pause", "udp", "ht40"]

[wifi]
image = "diagnostic-task-poll"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { tx_bps = 130000000 }

[wifi.workload.maintenance]
operation = "access"

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_tx_bps = 10000000
