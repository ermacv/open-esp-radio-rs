[package]
name = "oer-espressif-staged-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The chip-neutral steps of the Espressif staged-boot bootstrap: stage-two validation, relocation into PSRAM and handoff"

[features]
# The chip of esp-hal; a bootstrap selects exactly one.
esp32s31 = ["esp-hal/esp32s31"]
esp32c5 = ["esp-hal/esp32c5"]

[dependencies]
oer-espressif-staged-layout.workspace = true
esp-hal = { workspace = true, features = ["static-interrupts", "rt", "unstable"] }

[package.metadata.open-radio]
layer = "platform"
platform = "family"
family = "espressif"

[lints]
workspace = true
