id = "BLOB_LIBBLE_SYNC_PUBLICATION"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); ble_lll_sync.c member ble_8.o symbol r_sym_ble_vNVoB3u8sNalnntugADe (r_ble_lll_sync_set_scan_link_state) writes one runtime-derived complete image to 0x20101878 and one runtime-derived low-24-bit image with a zero high byte to 0x2010187c. The source identity records sync-path ownership only; the hardware-field meanings remain unknown."

