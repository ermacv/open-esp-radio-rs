name: CI

# Standard Cargo checks for every push to any branch. Pull requests come from
# branches of this repository, whose pushes already run this workflow.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A branch needs only its newest commit: rapid agent pushes cancel the run
# they supersede. On main, every merged pull request is checked to the end,
# since the session start and the gate report main's verdicts, and GitHub
# keeps only the newest merge pending behind a started run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: '0'
  # A fresh runner has no Cargo cache; the repository configuration keeps
  # Cargo offline for local builds.
  CARGO_NET_OFFLINE: 'false'
  CARGO_TERM_COLOR: always

# Few jobs, each a sequence sharing one build cache: a free account runs 20
# jobs at once across every workflow, and every job pays for its checkout and
# cache restore. Each step is one command of the xtask reference.
jobs:
  # The root workspace on the host: the integrity tier, formatting of every
  # workspace, Clippy, tests with their feature sets, locks, locked metadata
  # and network dependency boundaries.
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-
      - run: cargo tidy check
      - name: Format every workspace
        run: |
          # Every Cargo workspace, as oer-tidy discovers them.
          for manifest in $(cargo tidy workspaces)
          do
            echo "::group::$manifest"
            cargo fmt --all --manifest-path "$manifest" -- --check
            echo "::endgroup::"
          done
      # The evaluator resolves HIL image sources with offline `cargo tree` in
      # the firmware workspaces, and xtask reads metadata offline.
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Report every failing test binary in one run instead of the first.
      - run: cargo test --workspace --locked --no-fail-fast
      # The GATT application's `secure` module is off by default; test it too.
      - run: cargo test --locked --no-fail-fast -p oer-example-bluetooth-gatt --all-features
      - name: Declared test feature sets
        run: cargo xtask --verbose check feature-sets
      - run: cargo xtask --verbose lock --check
      - run: cargo xtask --verbose check metadata
      - run: cargo xtask --verbose check network
      # The MIR fact driver links the compiler (`rustc-dev`, about 1.6 GB
      # installed): only this job installs it, for the driver's own checks.
      - name: MIR fact driver
        working-directory: tools/mir-facts
        run: |
          rustup component add rustc-dev
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked --no-fail-fast

  # Clippy for every production feature profile on the chip target, plus the
  # layer, facade, unsafe-code and PAC-access boundaries.
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: architecture-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: architecture-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose check architecture
      # A compile_fail doctest proves that publishing borrowed DMA memory
      # needs `unsafe`; the API exists only on the chip target.
      - name: Chip-target doctest
        run: |
          target=$(cargo tidy chips --json | jq -r '.[] | select(.id == "esp32s31") | .["rust-target"]')
          cargo test --doc --locked -p oer-esp32s31-soc-esp-hal --features axi-gdma-mem2mem --target "$target"

  # Code built for a chip: the final HIL images' runtimes type-checked
  # exactly as the image builder compiles them (every class nightly), the
  # ESP32-S31 examples with their image flags, the ESP32-C5 workspaces, the
  # ESP32-C5 PAC and HAL, and the compiled PHY library.
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            hil/targets/esp32c5/target
            verification/esp32c5/hardware/register-probe/target
          key: firmware-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: firmware-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose check firmware --class performance --class correctness --type-check
      - name: ESP32-S31 examples
        run: |
          for example in access-point monitor station thread
          do
            echo "::group::$example"
            cargo xtask --verbose build firmware "$example" --type-check
            echo "::endgroup::"
          done
      - name: Access-point example host tests
        working-directory: examples/esp32s31/access-point
        run: cargo test --lib --locked --target x86_64-unknown-linux-gnu
      - name: ESP32-C5 HIL agent
        working-directory: hil/targets/esp32c5
        run: |
          for features in boot-smoke system-watchdog; do
            cargo clippy --locked --release -p oer-esp32c5-hil-agent --no-default-features --features "$features" -- -D warnings
          done
      - name: ESP32-C5 register probe
        working-directory: verification/esp32c5/hardware/register-probe
        run: cargo build --locked --release
      - name: ESP32-C5 PAC and HAL
        run: |
          target=$(cargo tidy chips --json | jq -r '.[] | select(.id == "esp32c5") | .["rust-target"]')
          cargo build --locked -p oer-esp32c5-pac -p oer-esp32c5-hal --target "$target"
      - run: cargo xtask --verbose check phy --chip esp32s31

  # Every register publication (the model validates and the generated SVD,
  # bindings and PAC are what it yields) and every qualification program
  # (its catalogs and selection validate, and the evaluator assesses its
  # committed evidence).
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: models-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: models-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - name: Register publications
        run: |
          for manifest in registers/*/publication/registers.toml
          do
            echo "::group::$manifest"
            cargo registers validate --manifest "$manifest"
            cargo registers generate --manifest "$manifest" --check
            echo "::endgroup::"
          done
      - name: Qualification programs
        run: |
          for program in qualification/targets/*/*.toml
          do
            echo "::group::$program"
            cargo qualification validate --manifest "$program"
            cargo qualification evaluate --manifest "$program"
            echo "::endgroup::"
          done

  # Blobray's RISC-V executor against the pinned RISC-V architectural tests,
  # with the Sail formal model as the reference. Needs clang and lld.
  isa-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/blobray/target
          key: isa-conformance-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', 'tools/blobray/cli/tests/riscv_conformance/inputs.toml') }}
          restore-keys: isa-conformance-${{ runner.os }}-
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose check isa-conformance

  # Both final HIL application images, their placement/stack audits and the
  # Blobray target audit. Needs espflash and the toolchain's LLVM tools.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ESPFLASH_VERSION: 4.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/espflash
            target
            tools/blobray/target
          key: images-${{ runner.os }}-${{ env.ESPFLASH_VERSION }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: images-${{ runner.os }}-${{ env.ESPFLASH_VERSION }}-
      - name: Install espflash
        run: |
          command -v espflash >/dev/null && espflash --version | grep -q "$ESPFLASH_VERSION" || {
            sudo apt-get update && sudo apt-get install -y libudev-dev
            cargo install --locked espflash --version "$ESPFLASH_VERSION"
          }
      - name: Put the toolchain's LLVM tools on PATH
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
      - name: Fetch every workspace
        run: cargo tidy fetch
      # The interrupt-stack gate bounds every image with the pinned ROM ELF.
      - name: Pinned ESP32-S31 ROM ELF
        run: cargo xtask --verbose vendor-fetch esp32s31 --artifact rom
      - run: cargo xtask --verbose check images

  # The one check branch protection requires: every job above passed.
  ci-ok:
    if: always()
    needs: [host, architecture, firmware, models, isa-conformance, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
