schema = 5
id = "access-point-single-client-ceiling-rx-core0-coarse"
description = "Single-client AP HT40 UDP receive ceiling with coarse Core0 phase accounting"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "split-core", "ceiling", "rx", "core0"]

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.datapath]
rx_continuation = "adaptive-probe-diagnostic"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 12
payload_bytes = 1472
offer = { rx_bps = 130000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 90000000
