[package]
name = "oer-stand-journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The board journal: what each board of the stand carries and what happened to it"

[dependencies]
oer-device-mac = { path = "../../tools/device/mac" }
oer-device-reset = { path = "../../tools/device/reset" }
oer-durable = { path = "../../tools/durable" }
oer-process = { path = "../../tools/process" }
oer-stand-file = { path = "../file" }
oer-stand-owners = { path = "../owners" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "stand"
hil = "operation"
