schema = 5
id = "diagnostic-ap-airtime-rx40-tx40-observed"
description = "Temporary observed AP balanced duplex ceiling sweep with driver RX disposition"
role = "investigation"
repetitions = 1
tags = ["diagnostic-ap-airtime-sweep", "diagnostic-ap-rx-disposition", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 45000000, tx_bps = 45000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
