description = "Canonical RX_HE_BSS_COLOR_CONF word. Complete dbg_read_color_collision names the fields; the HE init parent replaces TIMEOUT_SECONDS bits 8:3 with 0x3c. HE Operation programming sets BITMAP_CONTROL bit zero to clear the accumulated BSS-color collision bitmap, so the clear action is a semantic view of the existing two-bit field rather than a second register identity."
