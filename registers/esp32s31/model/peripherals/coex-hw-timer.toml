schema = 2

[[peripherals]]
name = "COEX_HW_TIMER"
description = "Five-entry coexistence timer bank. Complete libcoexist leaves address entry index as 0x2010f400 + index*0x10. The independent 46-event coex_core_timer_idx_get table returns only timer indices zero through four or 0xff for an invalid event."
baseAddress = 0x2010F400

[[peripherals.registers]]

[peripherals.registers.register]
dim = 5
dimIncrement = 0x10
dimIndex = "0,1,2,3,4"
name = "CONFIGURATION%s"
description = "Primary timer word. coex_hw_timer_set replaces both high nibbles and the low 24-bit tick image through separate fresh-read RMW operations. coex_hw_timer_force clears the low 24 bits; coex_hw_timer_unforce replaces them with 1000."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "PRIMARY_TICK_IMAGE"
description = "Low 24 bits returned by coex_hw_timer_tick_get for the first timer value. The exact counter epoch and units remain part of the reviewed timer conversion rather than the register geometry."
bitOffset = 0
bitWidth = 24
[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0x00ffffff

[[peripherals.registers.register.fields]]
name = "PARAMETER_2"
description = "Low nibble of the third coex_hw_timer_set argument."
bitOffset = 24
bitWidth = 4
[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0x0f

[[peripherals.registers.register.fields]]
name = "PARAMETER_1"
description = "Low two bits of the second coex_hw_timer_set argument. Bits 31:30 are preserved by the complete vendor RMW."
bitOffset = 28
bitWidth = 2
[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0x03

[[peripherals.registers.register.fields]]
name = "HIGH_UNKNOWN"
description = "Bits preserved by coex_hw_timer_set while PARAMETER_1 is replaced."
bitOffset = 30
bitWidth = 2

[[peripherals.registers]]

[peripherals.registers.register]
dim = 5
dimIncrement = 0x10
dimIndex = "0,1,2,3,4"
name = "SECONDARY_TARGET%s"
description = "Secondary timer word. coex_hw_timer_set preserves the high byte and replaces the low 24 bits with the converted fourth timer-value argument."
addressOffset = 0x4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "SECONDARY_TICK_IMAGE"
bitOffset = 0
bitWidth = 24
[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0x00ffffff

[[peripherals.registers.register.fields]]
name = "HIGH_UNKNOWN"
bitOffset = 24
bitWidth = 8

[[peripherals.registers]]

[peripherals.registers.register]
dim = 5
dimIncrement = 0x10
dimIndex = "0,1,2,3,4"
name = "ENABLE_CONTROL%s"
description = "coex_hw_timer_enable sets bit zero here after clearing bit zero in the paired disable-control word. coex_hw_timer_disable performs the inverse transaction."
addressOffset = 0x8
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ENABLE"
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "UNKNOWN"
bitOffset = 1
bitWidth = 31

[[peripherals.registers]]

[peripherals.registers.register]
dim = 5
dimIncrement = 0x10
dimIndex = "0,1,2,3,4"
name = "DISABLE_CONTROL%s"
description = "coex_hw_timer_disable sets bit zero here after clearing bit zero in the paired enable-control word. coex_hw_timer_enable performs the inverse transaction."
addressOffset = 0xC
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "DISABLE"
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "UNKNOWN"
bitOffset = 1
bitWidth = 31

