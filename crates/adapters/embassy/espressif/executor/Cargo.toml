[package]
name = "oer-espressif-executor-embassy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"
description = "Scheduler-free Embassy executor and time driver for Espressif staged-boot applications"

[features]
default = []
timer-observation = ["chip"]
# The chip of esp-hal; an image selects exactly one.
esp32s31 = [
    "chip",
    "esp-hal/esp32s31",
    "esp-sync/esp32s31",
    "oer-espressif-interrupt-table-esp-hal/esp32s31",
]
esp32c5 = [
    "chip",
    "esp-hal/esp32c5",
    "esp-sync/esp32c5",
    "oer-espressif-interrupt-table-esp-hal/esp32c5",
]
# The executor and time driver, which a chip feature selects.
chip = [
    "dep:embassy-executor",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:esp-hal",
    "dep:esp-sync",
    "dep:portable-atomic",
    "dep:riscv",
    "dep:oer-espressif-interrupt-table-esp-hal",
    "dep:oer-interrupt-table",
]

[dependencies]
bytemuck = { version = "1.25.2", default-features = false }
oer-memory = { path = "../../../../memory" }
embassy-executor = { version = "0.10.0", default-features = false, optional = true }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"], optional = true }
embassy-time-queue-utils = { version = "0.3", optional = true }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "46a45a813177122cc7485723c07d54751b3ef921", default-features = false, features = ["static-interrupts", "rt", "unstable"], optional = true }
esp-sync = { git = "https://github.com/ermacv/esp-hal", rev = "46a45a813177122cc7485723c07d54751b3ef921", optional = true }
portable-atomic = { version = "1.11", default-features = false, optional = true }
oer-interrupt-table = { path = "../../../../runtime/interrupt-table", optional = true }
oer-espressif-interrupt-table-esp-hal = { path = "../../../esp-hal/espressif/interrupt-table", optional = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[dev-dependencies]
embassy-executor = { version = "0.10.0", default-features = false }
embassy-time-queue-utils = "0.3"

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "adapter"
platform = "family"
family = "espressif"
# An image selects exactly one chip of esp-hal; each profile builds for its
# chip's target only.
supported-feature-profiles = ["esp32s31,timer-observation", "esp32c5,timer-observation"]
