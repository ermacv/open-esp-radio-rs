[package]
name = "oer-hil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The `cargo hil` command line: argument parsing and calls into the stand, run store, analysis and experiment packages"

[dependencies]
oer-esp-idf = { path = "../../../tools/esp-idf" }
oer-hil-run-bundle-format = { path = "../run-bundle/format" }
oer-chip-profile = { path = "../../../tools/chip-profile" }
oer-command-tree = { path = "../../../tools/command-tree", features = ["clap"] }
oer-stand-arbiter = { path = "../../../stand/arbiter" }
oer-stand-board = { path = "../../../stand/board" }
oer-hil-run-bundle = { path = "../run-bundle" }
oer-hil-analysis = { path = "../analysis" }
oer-hil-experiment = { path = "../experiment" }
oer-image = { path = "../../../tools/image" }
oer-image-check-interrupts = { path = "../../../tools/image-check/interrupts" }
oer-image-compare = { path = "../../../tools/image-compare" }
oer-hil-image = { path = "../image" }
oer-hil-image-class = { path = "../image-class" }
oer-hil-source-snapshot = { path = "../source-snapshot" }
oer-toolchain = { path = "../../../tools/toolchain" }
oer-hil-schema = { path = "../../schema" }
oer-hil-observer = { path = "../../observer" }
oer-hil-lab = { path = "../lab" }
oer-stand-fixtures = { path = "../../../stand/fixtures" }
oer-durable = { path = "../../../tools/durable" }
oer-process = { path = "../../../tools/process" }
clap = { version = "=4.5.48", features = ["derive"] }
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
toml = "=1.1.4"

oer-device-peer-line = { path = "../../../tools/device/peer-line" }
oer-stand-claims = { path = "../../../stand/claims" }
oer-stand-owners = { path = "../../../stand/owners" }
[dev-dependencies]
oer-hil-run-bundle = { path = "../run-bundle", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "entry"
host-app = "hil"
host-boundary = "application"
hil = "operation"
# The tests read the workspace Cargo configuration and the ESP-IDF firmware
# catalog.
inputs = [
    ".cargo/config.toml",
    "hil/peers/*/firmware.toml",
    "verification/*/hil-vendor/*/firmware.toml",
]
