[package]
name = "oer-qualification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Fail-closed qualification evaluator for the open radio driver"

[dependencies]
oer-hil-run-bundle-format = { path = "../../hil/host/run-bundle/format" }
oer-hil-scenario-catalog = { path = "../../hil/host/scenario/catalog" }
oer-command-tree = { path = "../../tools/command-tree" }
oer-hil-schema = { path = "../../hil/schema" }
oer-markers = { path = "../../tools/markers" }
oer-repo = { path = "../../tools/repo" }
oer-vendor-evidence-shard = { path = "../../verification/evidence-shard" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
oer-durable = { path = "../../tools/durable" }
oer-process = { path = "../../tools/process" }
toml = "=1.1.4"
toml_edit = { version = "=0.25.13", features = ["serde"] }
tar = { version = "0.4", default-features = false }

[dev-dependencies]
oer-hil-run-bundle = { path = "../../hil/host/run-bundle", features = ["test-support"] }
oer-hil-observer = { path = "../../hil/observer" }
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "qualification"
platform = "host"
host-layer = "entry"
host-app = "qualification"
host-boundary = "application"
# The tests read every catalog, program and review, and resolve image
# sources through the repository model of this checkout.
inputs = ["qualification", "**/Cargo.toml", "platform/*/chip.toml"]
