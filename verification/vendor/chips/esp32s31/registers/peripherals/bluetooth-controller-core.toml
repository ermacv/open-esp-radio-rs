schema = 2

[[peripherals]]
name = "BLUETOOTH_CONTROLLER_CORE"
description = """
Bluetooth controller-core register view grouped by runtime responsibility rather
than vendor object boundaries. It owns scheduler, sleep-timer, controller
initialization, memory-list, scan-snapshot and ISO-coexistence state reached
through the 0x20101000 physical block. Interrupt programming, enable/status,
acknowledgement and ISR diagnostics belong exclusively to
BLUETOOTH_INTERRUPT_BANK.
"""
baseAddress = 0x20101000

