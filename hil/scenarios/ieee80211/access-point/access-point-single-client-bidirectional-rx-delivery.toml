schema = 5
id = "access-point-single-client-bidirectional-rx-delivery"
description = "Single-client AP full-duplex RX delivery-frontier diagnostic"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "load", "bidirectional", "rx-delivery", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 120

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1400
offer = { rx_bps = 8000000, tx_bps = 8000000 }

[wifi.workload.traffic.criteria]
exact_delivery = true
minimum_rx_bps = 7600000
minimum_tx_bps = 7600000
