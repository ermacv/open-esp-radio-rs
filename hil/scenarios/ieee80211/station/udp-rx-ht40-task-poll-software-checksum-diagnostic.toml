schema = 5
id = "udp-rx-ht40-task-poll-software-checksum-diagnostic"
description = "Split-core HT40 saturated RX software-checksum control"
transfer = "identical-image"
tags = ["diagnostic", "udp", "station", "rx", "ht40", "split-core", "task-poll", "checksum", "checksum-ab"]

[wifi]
image = "diagnostic-task-poll"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 120000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 90000000
maximum_idle_channel_utilization_255 = 64
