name: "Implementation or refactoring"
description: "Deliver a feature, structural invariant or documentation change."
labels: ["triage:incomplete"]
body:
  - type: markdown
    attributes:
      value: "Name one accepted result. Follow [issue management](https://github.com/ermacv/open-esp-radio-rs/blob/main/docs/issues.md). Choose classification before submitting. The issue-label guard applies your explicit selections; triage reviews them. Research and implementation do not establish hardware readiness."
  - type: dropdown
    id: kind
    attributes:
      label: "Kind of result"
      description: "The guard applies this explicit kind selection when the issue opens."
      options: ["kind:feature","kind:refactor","kind:docs"]
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: "Result and motivation"
      description: "Name the behavior or ownership/structural invariant and its consumer."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Primary area"
      description: "The owner of the result; the guard applies this explicit area selection."
      options: ["area:wifi","area:bluetooth","area:ieee802154","area:radio","area:registers","area:platform","area:tooling","area:hil","area:qualification"]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "Choose explicitly: P0 interrupts, P1 blocks the selected result, P2 is useful backlog, P3 needs an activation trigger."
      options: ["priority:P0","priority:P1","priority:P2","priority:P3"]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Owner and scope"
      description: "Name defining paths, canonical package.metadata.open-radio.layer, target/revision/profile and exclusions."
      placeholder: "Owner paths:\nLayer (package.metadata.open-radio.layer):\nTarget / revision / profile:\nOut of scope:"
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: "Inputs and accepted decisions"
      description: "Link required research or owner decisions. Describe lifecycle, failures and cancellation when the boundary changes."
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance and checks"
      description: "Observable conditions, migrated callers and removed paths for a refactor; separate host, target and hardware evidence."
    validations:
      required: true
  - type: textarea
    id: relations
    attributes:
      label: "Relations and activation"
      description: "Parent, blockers with the exact required artifact, related work, and any future activation trigger."
      placeholder: "Part of:\nBlocked by (artifact and consuming step):\nRelated:\nActivation trigger:"
    validations:
      required: false
