[[peripherals.registers]]

[peripherals.registers.register]
name = "STATUS"
description = "Masked MAC event snapshot read by the complete hal_mac_interrupt_get_event leaf. Its bit geometry matches the complete ENABLE event bank; only independently recovered event identities are named semantically."
addressOffset = 0x8
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "UNKNOWN_0_4"
description = "Masked event bits whose identities remain unknown."
bitOffset = 0
bitWidth = 5

[[peripherals.registers.register.fields]]
name = "RX_ASSOCIATED_AUXILIARY_5"
description = "Enabled by the cold MAC mask 0x19a879e0 and observed asserted with RX_SUCCESS throughout sustained HE20 receive traffic. Complete wDev_ProcessFiq acknowledges this bit as part of the full STATUS image but does not dispatch independent work for it. Its hardware meaning and independent transition rules remain unknown; software must not treat it as RX ownership or work multiplicity."
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "COLD_RX_ENABLE_6_UNKNOWN"
description = "Masked event bit enabled by the complete cold receive mask; its event identity remains unknown."
bitOffset = 6
bitWidth = 1

