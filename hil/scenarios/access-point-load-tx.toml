schema = 4
id = "access-point-load-tx"
description = "Sustained two-flow AP outbound fairness baseline with exact delivery"
repetitions = 5
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["qualification", "wifi", "access-point", "network", "load", "tx"]

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180

[workload.traffic]
kind = "udp-multi-client"
direction = "tx"
duration_seconds = 60
tx_rate_bps_per_flow = 16000000
payload_bytes = 1400

[criteria]
exact_delivery = true
minimum_tx_bps = 30400000
minimum_bps_per_flow = 15200000
maximum_flow_skew_percent = 20
minimum_concurrent_ap_clients = 2
