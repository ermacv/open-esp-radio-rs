[package]
name = "open-esp-radio-esp32s31-embassy-wifi"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"
description = "Product-level ESP32-S31 Wi-Fi composition for Embassy and esp-hal"

[dependencies]
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
# Keep this composition independently buildable. smoltcp requires one socket
# backend whenever its socket set is enabled; applications may add UDP/TCP.
embassy-net = { git = "https://github.com/ermacv/embassy", rev = "97da28a77e15a55c412da8b51710fecf5b7a8979", default-features = false, features = ["medium-ethernet", "proto-ipv4", "raw"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "7f914782f5c689a74f37df83b89a0827d3800323", default-features = false, features = ["esp32s31", "rt", "unstable"] }
log = { version = "0.4.29", optional = true }
open-esp-radio = { path = "../../../radio", default-features = false, features = ["wifi-embassy"] }
open-esp-radio-esp32s31-wifi = { path = "../../../chips/esp32s31/wifi" }
open-esp-radio-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
open-esp-radio-esp32s31-phy = { path = "../../../chips/esp32s31/phy" }
open-esp-radio-esp32s31-wifi-ap = { path = "../../../chips/esp32s31/wifi/ap" }
open-esp-radio-esp32s31-wifi-dma = { path = "../../../chips/esp32s31/wifi/dma" }
open-esp-radio-esp32s31-wifi-mac = { path = "../../../chips/esp32s31/wifi/mac" }
open-esp-radio-esp32s31-wifi-sta = { path = "../../../chips/esp32s31/wifi/sta" }
open-esp-radio-embassy-net = { path = "../../../adapters/embassy-net" }
open-esp-radio-esp32s31-wifi-embassy = { path = "../../../adapters/embassy/esp32s31-wifi" }
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../../adapters/esp-hal/esp32s31-wifi", features = ["esp32s31"] }
open-esp-radio-wifi-embassy = { path = "../../../adapters/embassy/wifi" }
open-esp-radio-ieee80211 = { path = "../../../wifi/ieee80211" }
open-esp-radio-wifi-ap = { path = "../../../wifi/ap" }
open-esp-radio-wifi-softmac = { path = "../../../wifi/softmac" }
open-esp-radio-wifi-sta = { path = "../../../wifi/sta" }
open-esp-radio-wpa2 = { path = "../../../wifi/wpa2" }
static_cell = "2.1.1"

[features]
default = []
diagnostics = [
    "dep:log",
    "open-esp-radio-esp32s31-wifi-embassy/diagnostics",
]
# Hard-IRQ callbacks are a deliberately separate diagnostic boundary. Enabling
# ordinary value observers must not change the SRAM-closed interrupt call graph.
mac-irq-diagnostics = ["diagnostics"]
task-poll-telemetry = ["diagnostics"]
network-scheduler-observation = ["embassy-net/cooperative-scheduler-telemetry"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace]
resolver = "3"

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "d0fb94ef3" }
