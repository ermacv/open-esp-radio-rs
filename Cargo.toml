    "tools/process",
    "tools/firmware",
    "platform/esp32s31/layout",
    "hil/protocol",
    "hil/schema",
    "hil/target-core",
    "crates/memory",
    "crates/network/interface",
    "crates/radio",
    "crates/adapters/embassy-net/owned",
    "crates/adapters/embassy-net/upstream",
    "crates/adapters/xarxa/upstream",
    "crates/adapters/xarxa/esp32s31/ieee80211-upstream",
    "experiments/network-engine",
    "crates/runtime/ieee80211",
    "crates/adapters/embassy/radio",
    "crates/runtime/esp32s31/bluetooth",
    "crates/adapters/embassy/esp32s31/coex",
    "crates/adapters/embassy/esp32s31/ieee802154",
    "crates/adapters/embassy/esp32s31/executor",
    "crates/runtime/esp32s31/ieee80211",
    "crates/adapters/embassy-net/esp32s31/ieee80211-upstream",
    "crates/adapters/esp-hal/esp32s31/radio",
    "crates/adapters/esp-hal/esp32s31/ieee802154",
    "crates/adapters/esp-hal/esp32s31/ieee80211",
    "crates/protocols/bluetooth/hci",
    "examples/bluetooth-gatt",
    "crates/protocols/bluetooth/le/ll",
    "crates/protocols/ieee802154",
    "crates/protocols/ieee80211/ap",
    "crates/protocols/ieee80211/sta",
    "crates/protocols/ieee80211/mac",
    "crates/protocols/ieee80211/softmac",
    "crates/protocols/ieee80211/datapath",
    "crates/protocols/ieee80211/security/rsn",
    "crates/hardware/esp32s31/hal",
    "crates/hardware/esp32s31/driver/bluetooth",
    "crates/hardware/esp32s31/driver/bluetooth/memory",
    "crates/hardware/esp32s31/driver/coex",
    "crates/hardware/esp32s31/driver/ieee80211",
    "crates/hardware/esp32s31/driver/ieee80211/dma",
    "crates/hardware/esp32s31/driver/ieee802154/dma",
    "crates/hardware/esp32s31/driver/ieee802154/irq",
    "crates/hardware/esp32s31/driver/ieee802154/mac",
    "crates/hardware/esp32s31/driver/ieee802154",
    "crates/hardware/esp32s31/driver/ieee80211/mac",
    "crates/roles/esp32s31/bluetooth/controller",
    "crates/roles/esp32s31/ieee80211/ap",
    "crates/roles/esp32s31/ieee80211/sta",
    "crates/hardware/esp32s31/phy",
    "crates/hardware/esp32s31/pac/raw",
    "crates/hardware/esp32s31/pac",
    "crates/adapters/esp-hal/esp32s31/soc",
    "crates/composition/esp32s31/embassy/bluetooth",
    "hil/host/fixture",
    "hil/host/fixture-install",
    "hil/host/runner",
    "hil/host/runner-bluetooth",
    "hil/host/runner-core",
    "hil/host/runner-ieee802154",
    "hil/host/runner-system",
    "hil/host/runner-ieee80211",
    "qualification/evaluator",
    "tools/memory-report",
    "tools/registers",
    "tools/registers/contracts",
    "tools/registers/model",
    "tools/registers/review",
]
exclude = [
    "platform/esp32s31",
    "crates/composition/esp32s31/embassy/ieee80211",
    "examples/esp32s31-access-point",
    "examples/esp32s31-bluetooth-controller",
    "examples/esp32s31-monitor",
    "examples/esp32s31-station",
    "hil/targets/esp32s31",
    "verification/vendor/projects/esp32s31/probes",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
# Driver protocol state must advance identically in debug and release builds.
debug_assert_with_mut_call = "deny"
# `clippy.toml` lists methods radio code must not call, such as busy waiting
# instead of yielding; an intentional use carries a local `allow` with a reason.
disallowed_methods = "deny"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# Host-side binary analysis is prohibitively slow at dev opt-level 0. Keep a
# separate incremental profile for the normal blobray aliases so firmware
# development and unit tests retain their ordinary dev/release behavior.
[profile.blobray]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

# Qualification authenticates complete HIL bundles, which can include large
# packet captures. Keep its SHA-256 and JSON traversal optimized without
# changing firmware build profiles.
[profile.qualification]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

# The ESP32-S31 async-platform branch uses register accessor fixes that are
# still carried by the matching PAC fork.
[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "507d14dbccfc26128b929b044d76f09cf2d1d2f6" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }

# Share the official timer ABI between registry platform crates and upstream
# Git Embassy in integration tests. No network implementation is substituted.
[patch."https://github.com/embassy-rs/embassy"]
embassy-time-driver = { version = "=0.2.2", registry = "crates-io" }
