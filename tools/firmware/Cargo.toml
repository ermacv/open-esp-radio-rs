[package]
name = "oer-esp32s31-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["image", "device"]
device = ["dep:espflash", "dep:fs2", "dep:serialport", "dep:sha2"]
image = [
    "dep:toml",
    "dep:fs2",
    "dep:oer-chip-profile",
    "dep:oer-esp32s31-platform-layout",
    "dep:oer-memory-report",
    "dep:oer-process",
    "dep:oer-riscv-model",
    "dep:oer-riscv-stack",
    "dep:object",
    "dep:rustc-demangle",
    "dep:sha2",
]

[dependencies]
# The library of the same espflash the images are encoded with: one connection
# writes every flash segment.
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"], optional = true }
toml = { version = "1.1", optional = true }
fs2 = { version = "0.4", optional = true }
serialport = { version = "4.8.1", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
oer-chip-profile = { path = "../chip-profile", optional = true }
oer-esp32s31-platform-layout = { path = "../../platform/esp32s31/layout", optional = true }
oer-memory-report = { path = "../memory-report", optional = true }
oer-process = { path = "../process", optional = true }
oer-riscv-model = { path = "../riscv/model", optional = true }
oer-riscv-stack = { path = "../riscv/stack", optional = true }
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std"], optional = true }
rustc-demangle = { version = "=0.1.28", optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"

[package.metadata.open-radio]
layer = "tool"
platform = "host"
