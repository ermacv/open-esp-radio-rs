schema = 5
id = "diagnostic-station-phy-rfpll"
description = "Fresh temperature acquisition followed by measured RFPLL correction within one station epoch during UDP delivery"
repetitions = 1
transfer = "identical-image"
tags = ["phy-maintenance", "diagnostic", "station", "pause", "udp", "ht40"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { tx_bps = 65000000 }

[wifi.workload.maintenance]
operation = "rfpll"

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_tx_bps = 10000000
