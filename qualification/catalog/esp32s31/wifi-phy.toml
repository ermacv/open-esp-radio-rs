composition = "production"
scope = "Capture the registered shared domain's final post-tracking calibration state, with RF open or closed, as the cache for the next cold registration under a platform-derived identity"
limits = "The domain stays registered across RF close and wake, so a radio restart wakes RF without registering; the captured cache feeds the first registration of a later radio composition, which no code builds since #770. Broad RF behavior remains outside this source contract"
source-paths = [
  "crates/hardware/esp32s31/phy/src/calibration/registration.rs",
