id = "C5_ROM_REV100_PHY_CCA_CONTROL"
description = "ESP32-C5 rev 1.0 ROM esp32c5_rev100_rom.elf of espressif/esp-rom-elfs 20260528, sha256 49693d745eb4b4e6e6c77be4f5213765d545d8c7a1d9742a8a619bf596c4e27a. Cross-chip derivation of the reviewed ESP32-S31 source ROM_REV0_PHY_CCA_CONTROL: comparing full function bodies, ROM phy_disable_cca (size 0x32) is identical modulo the modem address map; ROM phy_enable_cca (size 0x26) is identical modulo the modem address map to its ESP32-S31 counterpart. Modem addresses follow the reviewed map from 0x2010_xxxx to 0x600A_xxxx: equal offsets except the segments 0x2014, 0x4CA0..0x4D3C and 0x4D4C..0x4EB8 (-4), 0x44E0..0x452C, 0x4990..0x49A0 and 0x4D40 (-8), 0xD8B4..0xD8D0 (-4), and the eight reverse-stride TX queue banks, which move from 0x54D8 - 0x7C * i to 0x54B0 - 0x78 * i with bank offsets 0x74 and above lowered by 4."

