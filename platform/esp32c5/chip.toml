# The facts of the ESP32-C5 that host tools cannot derive from the chip id.
# Paths follow the id by convention: verification/<id>, registers/<id>,
# hil/targets/<id>, qualification/targets/<id>, target/hil/<id>.
schema = 1
id = "esp32c5"
# The family whose shared code the chip uses (`platform = "family"` packages).
family = "espressif"
rust-target = "riscv32imac-unknown-none-elf"
# The ROM loads the ESP-IDF bootloader, which loads platform/esp32c5/bootstrap;
# the bootstrap stages the runtime into PSRAM.
boot = "staged"
espflash-chip = "esp32c5"
revisions = ["rev100"]

# What the chip has: its radio bands, Bluetooth modes, IEEE 802.15.4 and
# cores. Differences of address or layout belong in the register model.
[properties]
# Dual-band: 2.4 GHz and 5 GHz.
wifi-bands = ["2g4", "5g"]
# LE-only controller in the vendor Bluetooth library.
bluetooth = ["le"]
ieee802154 = true
cores = 1

# Where every image lies in flash. The image pipeline encodes the ESP-IDF
# bootloader, the partition table and the OTA selection for these offsets at
# build time; a flash writes the bundle there. `application` and `otadata`
# are the partitions of `partitions` (the image pipeline holds them to it).
[flash]
# SOURCE(esp32c5): ESP-IDF 4d59230d `components/esp_rom/esp32c5/esp_rom_caps.h:40`
# (the ROM loads the second-stage bootloader from flash offset 0x2000).
bootloader = 0x2000
partition-table = 0x8000
application = 0x10000
otadata = 0xd000
partitions = "platform/esp32c5/partitions/applications.csv"
# The application image's header: the fastest settings an ESP image header
# holds for the N16R8 module's 16-MiB quad flash, QIO at 80 MHz (ESP-IDF's
# 120-MHz option also writes 80m and tunes at run time); the ROM reads the
# bootloader in DIO.
# SOURCE(esp32c5): ESP-IDF 4d59230d `components/spi_flash/esp32c5/Kconfig.flash_freq`
# and `components/esptool_py/Kconfig.projbuild:47-60,75-82,104-109`.
application-encoding = { mode = "qio", frequency-mhz = 80, size-mib = 16 }
bootloader-mode = "dio"
# How a written image starts: the writer leaves the ROM in download mode,
# and a power-on reset (RTS without power control) starts the image; an RTS
# reset out of download mode leaves the esp32c5's USB console silent.
start = "power-on"

# The staged-boot address map as host tools check images against it: the
# firmware's own copy is platform/esp32c5/layout (LAYOUT), which the linker
# scripts read. One MMU window (0x42000000..0x44000000) serves flash and
# PSRAM: the bootstrap's flash pages in its lower half, the module's 8-MiB
# PSRAM at the fixed start of its upper half.
[memory]
# Application-owned internal SRAM (ESP-IDF's SRAM_START..SRAM_SEG_END).
sram = { origin = 0x40800000, length = 0x0004e5a0 }
# The flash half of the shared cache window.
flash-xip = { origin = 0x42000000, length = 0x01000000 }
# The module's PSRAM where the bootstrap maps it.
psram = { origin = 0x43000000, length = 0x00800000 }
# Stage-two code relocated to PSRAM, after the bootstrap's 64-KiB probe page.
runtime-psram = { origin = 0x43010000, length = 0x007f0000 }
# The runtime's task stacks lie in PSRAM.
task-stacks = "psram"

# The interrupt contract the interrupt-stack check reads: the staged runtime
# (platform/espressif/staged-runtime) installs these vectors and the stack;
# the chip-neutral symbols are platform/espressif/staged-layout
# (interrupts.rs). One hart, no inter-processor call.
[interrupts]
table-symbol = "__OER_INTERRUPT_TABLE"
# `Binding<Interrupt, Priority, Cpu>`: source u16 at 0, level u8 at 2, core
# u32 at 4, handler word at 8; fields as [offset, bytes].
table-entry-bytes = 12
table-source = [0, 2]
table-level = [2, 1]
table-core = [4, 4]
table-handler = 8
vector-table-symbol = "_runtime_psram_mtvt_source"
exception-entry-symbol = "_start_trap"
source-table-symbol = "__EXTERNAL_INTERRUPTS"
harts = [0]
always-levels = []
# The hart's dedicated SRAM interrupt stack.
irq-stack-bytes = 0x8000
irq-stack-guard-bytes = 1024
irq-stack-margin-percent = 10

# esp-hal sets a CPU line's CLIC level only while it initializes vectoring
# (the line's level from its constant priority map), and routes a source
# only at start-up and through the table's routing capability.
[[interrupts.level-writers]]
writer = "esp_hal::interrupt::arch::cpu_int::set_priority_raw"
contexts = ["esp_hal::interrupt::arch::init_vectoring"]

[[interrupts.level-writers]]
writer = "esp_hal::interrupt::map_raw"
contexts = [
    "esp_hal::interrupt::setup_interrupts",
    "<esp_hal::interrupt::InterruptRoutes>::enable",
    "<esp_hal::interrupt::InterruptRoutes>::disable",
]

# The mask ROM the stack analyses read: the pinned ROM ELF of the revision
# the profile describes (verification/esp32c5/artifacts.toml) and the
# reviewed function summaries of the ROM the images link
# (platform/esp32c5/linker/rom/esp32c5-eco2.x).
[rom]
elf = "rom-rev100"
summaries = "platform/esp32c5/linker/rom/functions.toml"

# The staged runtime's placement contract (platform/espressif/linker/runtime):
# code, data and the CPU0 task stack in PSRAM; interrupt entries, vector
# tables, the interrupt stack, critical and DMA data in SRAM.
[placement]
name = "psram-code-psram-data-psram-stack"
image = { start = "__runtime_image_start", end = "__runtime_payload_end", origin = "runtime-psram" }
entry = { symbol = "_runtime_start", text = ["__runtime_text_start", "__runtime_text_end"] }
range = [
    { range = ["__runtime_data_start", "__runtime_data_bss_end"], region = "psram" },
    { range = ["__runtime_isr_start", "__runtime_isr_end"], region = "sram" },
    { range = ["__runtime_critical_data_start", "__runtime_critical_bss_end"], region = "sram" },
    { range = ["__runtime_dma_data_start", "__runtime_dma_bss_end"], region = "sram" },
    { range = ["_stack_end", "_stack_start"], region = "psram", bytes = 0x30000 },
    { range = ["__runtime_cpu0_irq_stack_bottom", "__runtime_cpu0_irq_stack_top"], region = "sram", bytes = 0x8000 },
]
symbol = [
    { name = "_start_trap", bytes = 4, region = "sram" },
    { name = "_runtime_psram_irq_entry_{n}", numbers = [1, 47], bytes = 4, region = "sram" },
    { name = "_runtime_psram_mtvt_source", bytes = 192, region = "sram" },
    { name = "_mtvt_table", bytes = 192, region = "sram" },
]
stack-swap = [
    { name = "_start_trap" },
    { name = "_runtime_psram_irq_entry_{n}", numbers = [1, 47] },
]

# The staged boot's host contract: the stage-two header the image pipeline
# packs (platform/espressif/staged-layout stage_two.rs) and the input sections
# the runtime linker script zeroes (zeroed.rs), which the image linker refuses
# initialized bytes in.
[staged]
zeroed-inputs = [
    ".dram2_uninit.bss", ".dram2_uninit.bss.*", ".dram2_uninit", ".dram2_uninit.*",
    ".rtc_fast.bss", ".rtc_fast.bss.*",
    ".critical.bss", ".critical.bss.*", ".flash.critical.bss", ".flash.critical.bss.*",
    ".dma.bss", ".dma.bss.*",
    ".psram.bss", ".psram.bss.*", ".sbss", ".sbss.*", ".bss", ".bss.*", "COMMON",
]

# The stage-two header: little-endian words; "STG2" magic, the handoff ABI
# version, the header's own size and the payload CRC-32 (computed with its
# field read as zero) at these byte offsets.
[staged.stage-two]
magic = 0x32475453
abi-version = 1
header-bytes = 44
magic-offset = 0
abi-version-offset = 4
header-size-offset = 28
crc-offset = 40

# The HIL agent's graph is the source-only stack: the root lock and
# hil/targets/esp32c5 must not pull in esp-rtos, whose scheduler and
# interrupt bindings the staged runtime's static table replaces.
[hil]
forbidden-packages = ["esp-rtos"]

# The chip's packages by the role the repository policies give them.
[packages]
generated = ["oer-esp32c5-pac-raw"]
audited-unsafe = ["oer-esp32c5-pac"]
closed-pac = ["oer-esp32c5-pac"]
pac-consumers = ["oer-esp32c5-pac-raw", "oer-esp32c5-pac", "oer-esp32c5-hal"]

# What the repository gate builds and audits for the chip (`cargo xtask`).
[gate]
release-builds = ["verification/esp32c5/hardware/register-probe"]
target-builds = ["oer-esp32c5-pac", "oer-esp32c5-hal"]
agent-clippy = true

# The Rust probe images of the vendor comparison (verification/esp32c5/probes).
[[probe]]
role = "rust-artifact"
package = "oer-esp32c5-probe-radio-elf"

# Why the core last reset, which the stand reads through JTAG after a power
# cycle: the board lost power only if it reads a power-on reset. The field is
# the platform publication's (registers/esp32c5/publication/platform.toml), with
# its evidence; cause 1 is the power-on reset of ESP-IDF 4d59230d's
# `components/soc/esp32c5/register/soc/lp_clkrst_reg.h`.
[reset-cause]
field = "LP_CLKRST.RESET_CAUSE.RESET_CAUSE"
power-on = 1
