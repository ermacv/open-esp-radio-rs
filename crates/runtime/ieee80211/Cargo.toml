[package]
name = "oer-ieee80211-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable Wi-Fi execution primitives: monitor handoffs, task shutdown, station network ownership and poll boundaries"

[features]
default = []
# The in-memory lower-MAC backend on the owner shape (`lower_mac_owner::model`),
# for host tests of the code that drives it.
test-support = ["dep:oer-ieee80211-rsn"]

[dependencies]
atomic-waker = "1.1.2"
heapless = "0.9.3"
oer-ieee80211-port = { path = "../../protocols/ieee80211/port" }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
oer-memory = { path = "../../memory" }
oer-ieee80211-lower-mac = { path = "../../protocols/ieee80211/lower-mac" }
oer-ieee80211-mac = { path = "../../protocols/ieee80211/mac" }
oer-radio-port = { path = "../../radio/port" }
oer-ieee80211-softmac = { path = "../../protocols/ieee80211/softmac" }
oer-time = { path = "../../time" }
oer-ieee80211-arbiter = { path = "../../protocols/ieee80211/arbiter" }
oer-ieee80211-sta = { path = "../../protocols/ieee80211/sta" }
oer-ieee80211-upper-mac = { path = "../../protocols/ieee80211/upper-mac" }

oer-ieee80211-rsn = { path = "../../protocols/ieee80211/security/rsn", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
oer-time-virtual = { path = "../../adapters/virtual/time" }
# The model of `lower_mac_owner` and its tests.
oer-ieee80211-lower-mac = { path = "../../protocols/ieee80211/lower-mac" }
oer-radio-port = { path = "../../radio/port", features = ["test-support"] }
oer-espressif-ieee80211-policy = { path = "../../protocols/espressif/ieee80211/policy" }
oer-ieee80211-rsn = { path = "../../protocols/ieee80211/security/rsn" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "runtime"
platform = "portable"
