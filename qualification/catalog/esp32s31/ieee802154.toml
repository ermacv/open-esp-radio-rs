[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-coordinator-filtering-mode"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Coordinator filtering mode"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "Static policy owns the coordinator control bit and readback; this is not a coordinator protocol stack."

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-promiscuous-receive-mode"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Promiscuous receive mode"
status = "partial"
level = "composed-product"
scope-and-limitations = "Static control and readback exist, and the portable contract switches it on the composed runtime (`Configuration::Promiscuous`). On-air promiscuous reception is not qualified."

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-four-multi-pan-contexts"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Four Multi-PAN contexts"
status = "partial"
level = "composed-product"
scope-and-limitations = "A [multi-PAN engine](../../../ieee802154/engine/src/engine.rs) assigns each received frame to the interface it addresses and keeps pending mode, pending table, receive and sleep per interface, as the vendor multi-PAN build does. The portable contract addresses up to the engine's interfaces (`MULTI_PAN`, `Configuration::Interface`, `TxRequest::interface`, `RxMetadata::interface`); the role keeps MAC keys, the nonce address and enhanced-ACK security per interface, as ESP-IDF's multi-instance OpenThread port does, and the composition parks a multi-PAN engine. The OpenThread adapter serves one instance on interface zero; on-air multi-PAN filtering is not qualified."
packages = [
    "oer-ieee802154-engine",
    "oer-esp32s31-pac",
    "oer-ieee802154",
    "oer-esp32s31-ieee802154-radio",
    "oer-esp32s31-ieee802154-runtime",
    "oer-esp32s31-ieee802154-system",
]

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-automatic-frame-pending"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Automatic Frame Pending"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine selects the pending bit for each acknowledged frame from the PIB pending mode and the [pending table](../../../../protocols/ieee802154/src/mac/pending.rs). On-air behavior is not qualified."

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-source-matching-table"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Source Matching table"
status = "partial"
level = "composed-product"
scope-and-limitations = "The protocol pending table owns add, clear and reset of short and extended addresses of each interface, and the portable contract configures it and the pending mode (`SOURCE_MATCH`), refusing a source a full half has no room for. The OpenThread adapter applies OpenThread's table entry by entry, as ESP-IDF's port does. A multi-PAN radio configures the table and pending mode of each interface through `Configuration::Interface`."

[[items]]
id = "ieee802154-timing-mac-timers-clock-match"
section = "ieee802154-timing"
title = "MAC timers / clock match"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "PAC exposes timer and clock-match primitives, not a complete scheduled-radio epoch or service."

[[items]]
id = "ieee802154-timing-tx-rx-sfd-events"
section = "ieee802154-timing"
title = "TX/RX SFD events"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine reports TX and RX SFD events: the RX SFD stamps the receive timestamp, and at the TX SFD the role writes the CSL and Time IEs of the frame going out. The events are not qualified on air."
packages = ["oer-ieee802154-engine"]

[[items]]
id = "ieee802154-timing-rx-timestamp"
section = "ieee802154-timing"
title = "RX timestamp"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine stamps each frame at its SFD with the platform microsecond clock; the timestamp is not validated against a radio epoch on hardware."

[[items]]
id = "ieee802154-timing-timed-tx-transmit-at"
section = "ieee802154-timing"
title = "Timed TX (`transmit_at`)"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine programs TIMER0 and modem ETM channel zero to start TX or CCA-then-TX at the requested time; the portable scheduled transmit mode carries the CCA choice (OpenThread's mCsmaCaEnabled) and the role and runtime expose the radio clock scheduled times use (otPlatRadioGetNow). The single-device air check bounds scheduled transmits against their start; on-air timing seen by a peer is not qualified."

[[items]]
id = "ieee802154-timing-timed-rx-receive-at"
section = "ieee802154-timing"
title = "Timed RX (`receive_at`)"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine programs TIMER1 and modem ETM channel one to open a receive window and closes it at its end unless a frame is in flight. The portable scheduled receive command (otPlatRadioReceiveAt) runs it through the role and runtime: the radio sleeps outside the window, the first received frame ends it as the vendor receive path does, and an already elapsed window ends at once. The single-device air check bounds the window's end and its first frame against the requested window; reception of a peer's frame inside a window is not qualified."

[[items]]
id = "ieee802154-timing-coordinated-sampled-listening-csl"
section = "ieee802154-timing"
title = "Coordinated Sampled Listening (CSL)"
status = "partial"
level = "composed-product"
scope-and-limitations = "OpenThread owns CSL scheduling and synchronization; the radio serves it as ESP-IDF's OpenThread port does. The [portable CSL module](../../../../protocols/ieee802154/src/mac/csl.rs) ports the CSL IE template, OpenThread's CSL IE write and the port's phase; the role puts the IE into enhanced ACKs, writes period and phase into every CSL IE it sends at the frame's SFD through the engine, and secures retransmissions anew. The [OpenThread adapter](../../../../adapters/openthread/esp32s31/ieee802154/src/radio.rs) maps CSL windows to scheduled receive windows and delayed frames to scheduled transmissions over the fork's csl feature. No peer has exchanged CSL frames with the device; on-air CSL is not qualified."

[[items]]
id = "ieee802154-timing-network-time-sync"
section = "ieee802154-timing"
title = "Thread network time synchronization (Time IE)"
status = "partial"
level = "composed-product"
scope-and-limitations = "OpenThread owns time synchronization; the radio fills a transmitted frame's Time IE as ESP-IDF's OpenThread port does at the SFD: the [portable Time IE write](../../../../protocols/ieee802154/src/mac/time_sync.rs) puts the time sync sequence and the radio clock plus the network time offset into it, and the role writes it for the request's Time IE (`TIME_SYNC`) and never into an enhanced ACK. The [OpenThread adapter](../../../../adapters/openthread/esp32s31/ieee802154/src/radio.rs) passes OpenThread's Time IE over the fork's time-sync feature, whose `otPlatTimeGet` reads the same radio clock. No peer has synchronized with the device; on-air time synchronization is not qualified."
packages = ["oer-ieee802154", "oer-esp32s31-ieee802154-radio", "oer-esp32s31-ieee802154-openthread"]

[[items]]
id = "ieee802154-security-power-and-coexistence-hardware-tx-security"
section = "ieee802154-security-power-and-coexistence"
title = "Hardware TX security"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine programs address, key and payload offset for one secured transmission and clears security at its end. With the radio's MAC keys the role secures each attempt as ESP-IDF's OpenThread port does, taking the [frame counter and key](../../../../protocols/ieee802154/src/mac/security.rs) itself; a request keeps the counter of the stack's retransmission or leaves a frame the stack secured as given, and the completion reports the counter and key index written. While CSL is enabled a retransmission takes a new frame counter, as in the port. Key derivation is not composed, and hardware security offload is not qualified on air."

[[items]]
id = "ieee802154-security-power-and-coexistence-rx-on-when-idle"
section = "ieee802154-security-power-and-coexistence"
title = "RX-on-when-idle"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine rearms receive after each operation when the PIB receive-when-idle flag is set, which the role sets for `Receive` and clears for `Sleep`. It is not qualified on air."

[[items]]
id = "ieee802154-security-power-and-coexistence-radio-sleep-wake"
section = "ieee802154-security-power-and-coexistence"
title = "Radio sleep / wake"
status = "partial"
level = "composed-product"
scope-and-limitations = "The radio sleeps in the MAC while RF stays open for the client's lifetime, as in ESP-IDF builds without tickless idle and modem retention, where IEEE802154_RF_DISABLE and IEEE802154_RF_ENABLE are empty; RF closes only when the last client stops. Closing RF while asleep, modem retention, light sleep and MAC or baseband power-down are absent."

[[items]]
id = "ieee802154-security-power-and-coexistence-powered-lifecycle"
section = "ieee802154-security-power-and-coexistence"
title = "Powered lifecycle"
status = "partial"
level = "composed-product"
scope-and-limitations = "The composition's `start` and `stop` bring the client up and down on the shared radio arbiter: common radio power, module clocks, the PHY join and leave, BTBB, the MAC foundation and the interrupt route; its maintenance entry runs the shared PHY's tracking. Modem retention and light sleep are absent, and the lifecycle is not qualified on air."

[[items]]
id = "ieee802154-security-power-and-coexistence-wifi-bluetooth-coexistence"
section = "ieee802154-security-power-and-coexistence"
title = "Wi-Fi/Bluetooth coexistence"
status = "partial"
level = "composed-product"
scope-and-limitations = "[Coexistence infrastructure](../coex/src/lib.rs) and MAC PTI access exist. The composed client publishes the software-coexistence PTIs of the pinned driver: the ACK and TX/RX scene priorities read from the arbiter's shared table ([scene priorities](../../hal/src/ieee802154/coex.rs)). The static foundation and MAC policy still prove both PTIs disabled before operation. Complete multi-radio request/grant/release operation is not composed, and PTI arbitration is not qualified on air."
packages = ["oer-esp32s31-coex"]

[[items]]
id = "ieee802154-product-stacks-thread"
section = "ieee802154-product-stacks"
title = "Thread"
status = "host-only"
level = "composed-product"
scope-and-limitations = "The [OpenThread radio adapter](../../../../adapters/openthread/esp32s31/ieee802154/src/radio.rs) implements the Radio trait of the repository's fork of the openthread crate over the runtime: OpenThread's SubMac runs CSMA/CA and retries and the radio secures frames and enhanced ACKs with OpenThread's keys, as ESP-IDF's OpenThread port does. OpenThread is built with CSL, and the radio serves its scheduled windows, delayed frames and CSL IEs. The [Thread example](../../../../../examples/esp32s31/thread/README.md) runs an OpenThread minimal or synchronized sleepy end device, and the `oer` facade's `openthread` feature exposes the adapter. The HIL cell `ieee802154-thread-exchange` attaches a minimal end device to a network ESP-IDF's OpenThread leads and exchanges UDP both ways; it has not run on air yet, and this matrix does not claim a production Thread integration."

[[items]]
id = "ieee802154-product-stacks-zigbee"
section = "ieee802154-product-stacks"
title = "Zigbee"
status = "host-only"
level = "composed-product"
scope-and-limitations = "Network/application stack capability is separate from the radio/MAC implementation."

[[items]]
id = "ieee802154-product-stacks-matter"
section = "ieee802154-product-stacks"
title = "Matter"
status = "host-only"
level = "composed-product"
scope-and-limitations = "Application-stack capability; Matter over Thread requires Thread and its radio integration. It is not a hardware MAC feature."

