[[items]]
id = "bluetooth-llcp-framework"
section = "bluetooth-le-roles-connections-reliability"
title = "LLCP framework"
status = "partial"
level = "composed-product"
scope-and-limitations = "A bounded peripheral responder queues feature, version, LE Ping and unknown responses. Central Connection Update and Channel Map Update share a single pending instant-procedure boundary. Same-procedure and incompatible-procedure collisions are distinguished. Local termination has its dedicated supervision-duration timer; Peripheral-initiated Feature and Version Exchange share the 40-second `connProcedureTimeout`, which restarts whenever another LL Control PDU enters the TX graph. Other procedure response timers and LLCP procedures remain absent."
source-paths = []

[[items]]
id = "bluetooth-connection-update-channel-map-update"
section = "bluetooth-le-roles-connections-reliability"
title = "Connection Update / Channel Map Update"
status = "partial"
level = "composed-product"
scope-and-limitations = "Validated Central `LL_CONNECTION_UPDATE_IND` and `LL_CHANNEL_MAP_IND` values survive scheduler cancellation and apply at their exact wrapping instants. Connection Update uses the old interval plus the new offset for the instant window, then the new interval; it resets supervision and emits LE Connection Update Complete only when interval, latency or timeout changes. Channel Map Update preserves CSA#1 state and updates CSA#1 or CSA#2 selection. Passed instants and procedure collisions request protocol termination; executor recovery crossing either instant retires with `0x28`. The peripheral recovery HIL source requests an exact 120-ms interval, requires matching successful completion from both Hosts, applies an exact two-channel map and completes a second fragmented ACL round trip afterward, but no recorded hardware run qualifies it."
source-paths = []

