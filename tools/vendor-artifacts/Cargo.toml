[package]
name = "oer-vendor-artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The pinned vendor artifacts of a chip: artifacts.toml, the host-wide store and fetching into it"

[dependencies]
oer-chip-profile = { path = "../chip-profile" }
oer-esp32s31-firmware = { path = "../firmware", default-features = false, features = ["image"] }
sha2 = "0.10"
toml = "=1.1.4"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
# The tests parse the tracked pins with the chip profiles.
inputs = ["verification/*/artifacts.toml", "platform/*/chip.toml"]
