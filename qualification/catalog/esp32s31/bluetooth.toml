id = "bluetooth-static-default-tx-power-selection"
section = "bluetooth-le-phy-rf-dtm"
title = "Static/default TX power selection"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "Every event carries its transmit power through the recovered [power encoding](memory/src/le_tx_power.rs); the Controller requests 0 dBm for every role. No HCI power-selection command or radiated-power qualification exists."

[[items]]
id = "bluetooth-le-receiver-test-transmitter-test"
section = "bluetooth-le-phy-rf-dtm"
title = "LE Receiver Test / Transmitter Test"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [test role](../../../../protocols/bluetooth/le/controller/src/dtm.rs) serves Receiver and Transmitter Test and Test End through the radio role while no other role runs. Test End drains the event in progress, releases the test role and reports the received packet count; Reset ends a test the same way."

[[items]]
id = "bluetooth-enhanced-dtm-phy-selection"
section = "bluetooth-le-phy-rf-dtm"
title = "Enhanced DTM PHY selection"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "Receiver and Transmitter Test v2 select LE 1M, 2M and Coded for the receiver and LE 1M and 2M for the transmitter; a Coded transmitter test is refused. Later CTE test-command versions are not supported."

[[items]]
id = "bluetooth-dtm-test-patterns"
section = "bluetooth-le-phy-rf-dtm"
title = "DTM test patterns"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [test session](../../../../protocols/bluetooth/le/ll/src/dtm.rs) generates the payload of every HCI test pattern for the transmitter."

[[items]]
id = "bluetooth-long-running-rf-phy-maintenance-including-dtm"
section = "bluetooth-le-phy-rf-dtm"
title = "Long-running RF/PHY maintenance and non-preemptible DTM deferral"
source-fact = "bluetooth-periodic-phy-maintenance"

[[items]]
id = "bluetooth-legacy-non-connectable-advertising-adv-nonconn-ind"
section = "bluetooth-legacy-advertising-scanning"
title = "Legacy non-connectable advertising (`ADV_NONCONN_IND`)"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The [advertising role](../../../../protocols/bluetooth/le/controller/src/advertising.rs) schedules `ADV_NONCONN_IND` events on the selected primary channels at the advertising interval plus the pseudo-random delay, updates the data while advertising and removes the set on Disable; the radio role transmits them."

[[items]]
id = "bluetooth-legacy-connectable-advertising-adv-ind"
section = "bluetooth-legacy-advertising-scanning"
title = "Legacy connectable advertising (`ADV_IND`)"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The [advertising role](../../../../protocols/bluetooth/le/controller/src/advertising.rs) schedules `ADV_IND` events that answer a scan request with the scan response and hand a valid `CONNECT_IND` to the peripheral connection, ending advertising. Its channel reservations follow the vendor item geometry."

[[items]]
id = "bluetooth-advertiser-scan-response-scan-rsp"
section = "bluetooth-legacy-advertising-scanning"
title = "Advertiser Scan Response (`SCAN_RSP`)"
status = "implemented"
level = "composed-product"
scope-and-limitations = "A connectable `ADV_IND` set answers `SCAN_REQ` with its `SCAN_RSP`. Scannable non-connectable advertising has its own row."

[[items]]
id = "bluetooth-scannable-non-connectable-advertising-adv-scan-ind"
section = "bluetooth-legacy-advertising-scanning"
title = "Scannable non-connectable advertising (`ADV_SCAN_IND`)"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The [advertising role](../../../../protocols/bluetooth/le/controller/src/advertising.rs) schedules `ADV_SCAN_IND` events whose `SCAN_REQ` the S31 response-capable graph answers with the scan response; connection indications are ignored. The `bluetooth-scannable-advertising` HIL scenario checks the scan response through an active Linux scanner."

[[items]]
id = "bluetooth-low-duty-high-duty-directed-advertising-adv-direct-ind"
section = "bluetooth-legacy-advertising-scanning"
title = "Low-duty / high-duty directed advertising (`ADV_DIRECT_IND`)"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The [advertising role](../../../../protocols/bluetooth/le/controller/src/advertising.rs) schedules `ADV_DIRECT_IND` to one target and accepts a connection indication only from it. High duty cycle events follow each other 3.75 ms apart for 1.28 s and end with LE Connection Complete status Advertising Timeout; low duty cycle uses the advertising interval and delay. The S31 set keeps one TX node and receives on the non-scanning chain. The `bluetooth-directed-advertising` HIL scenario checks both duty cycles."

[[items]]
id = "bluetooth-high-duty-cycle-non-connectable-advertising"
section = "bluetooth-legacy-advertising-scanning"
title = "High-duty-cycle non-connectable advertising"
status = "absent"
level = "composed-product"
scope-and-limitations = "No production scheduling policy implements the named feature."

[[items]]
id = "bluetooth-static-random-advertiser-address"
section = "bluetooth-legacy-advertising-scanning"
title = "Static random advertiser address"
status = "implemented"
level = "composed-product"
scope-and-limitations = "LE Set Random Address stores the address, and an advertising set whose own-address type is random advertises with it. Private-address rotation is absent."

[[items]]
id = "bluetooth-legacy-passive-scanning"
section = "bluetooth-legacy-advertising-scanning"
title = "Legacy passive scanning"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The [scanning role](../../../../protocols/bluetooth/le/controller/src/scanning.rs) listens once per scan interval for up to one scan window, rotating channels 37, 38 and 39 and yielding to advertising and connection events. Received PDUs become LE Advertising Reports, optionally through the duplicate filter; Disable waits for the window in progress. The own address is public; the filter policy accepts all advertisers or only the [filter accept list](../../../../protocols/bluetooth/le/controller/src/accept_list.rs)."

[[items]]
id = "bluetooth-active-scanning"
section = "bluetooth-legacy-advertising-scanning"
title = "Active scanning"
status = "implemented"
level = "composed-product"
scope-and-limitations = "With scan type 1 the [scanning role](../../../../protocols/bluetooth/le/controller/src/scanning.rs) runs the passive scanner's windows over an [active scanner graph](../../../../hardware/esp32s31/driver/bluetooth/memory/src/legacy_scanning.rs): its items carry the active kind and its link state names one `SCAN_REQ` buffer, so hardware requests the scan response of scannable advertising and SCAN_RSP PDUs become LE Advertising Reports. Scan-response backoff is the hardware's under the S31 upper limit of 32. The own address is public, the filter policy is the passive scanner's, and the scanner requests the passive coexistence lanes."

[[items]]
id = "bluetooth-extended-secondary-channel-scanning"
section = "bluetooth-legacy-advertising-scanning"
title = "Extended / secondary-channel scanning"
status = "absent"
level = "composed-product"
scope-and-limitations = "No AUX scanner, secondary 2M scanner or ordinary Coded scanner is composed. DTM RX is separate."

[[items]]
id = "bluetooth-extended-scanner-filter-policies"
section = "bluetooth-legacy-advertising-scanning"
title = "Extended scanner filter policies"
status = "absent"
level = "composed-product"
scope-and-limitations = "Scan filter policies 2 and 3, which also admit directed advertising with a resolvable target, are refused as unsupported; policies 0 and 1 are the legacy scanner's."

[[items]]
id = "bluetooth-filter-accept-list-operation"
section = "bluetooth-legacy-advertising-scanning"
title = "Filter Accept List operation"
status = "partial"
level = "composed-product"
scope-and-limitations = "LE Clear, Add Device To and Remove Device From Filter Accept List reach the [device table](../../../../hardware/esp32s31/driver/bluetooth/memory/src/le_device_table.rs) in Controller SRAM, whose first entry and count the Controller publishes after every change; LE Read Filter Accept List Size reports its 12 entries and a full list answers Memory Capacity Exceeded. A legacy scanner with scan filter policy 1 has hardware report only listed advertisers, and the list stays fixed while it runs. As on the vendor Controller, adding a listed device again succeeds, removing an absent one answers Invalid HCI Command Parameters and the anonymous entry succeeds without a table entry, since no scanner here receives extended advertising. HCI Reset clears the list, and advertising filter policies other than 0 are refused as unsupported."

[[items]]
id = "bluetooth-broadcaster-observer"
section = "bluetooth-le-roles-connections-reliability"
title = "Broadcaster / Observer"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Legacy advertising and passive scanning run concurrently with each other and with the peripheral connection. Extended and periodic roles and multiple advertising sets are absent."

[[items]]
id = "bluetooth-peripheral"
section = "bluetooth-le-roles-connections-reliability"
title = "Peripheral"
status = "partial"
level = "composed-product"
scope-and-limitations = "The [peripheral connection](../../../../protocols/bluetooth/le/controller/src/peripheral.rs) serves one connection created by `CONNECT_IND` with ACL data, control procedures, encryption and Host flow control on LE 1M or, after a PHY Update, LE 2M. Peripheral latency, LE Coded and a second connection are absent."

[[items]]
id = "bluetooth-central-initiator"
section = "bluetooth-le-roles-connections-reliability"
title = "Central / Initiator"
status = "absent"
level = "composed-product"
scope-and-limitations = "No Create Connection/initiator scheduling or Central connection owner exists."

[[items]]
id = "bluetooth-simultaneous-broadcaster-observer-central-peripheral"
section = "bluetooth-le-roles-connections-reliability"
title = "Simultaneous Broadcaster + Observer + Central + Peripheral"
status = "absent"
level = "composed-product"
scope-and-limitations = "Individual role subsets do not form a simultaneous multi-role runtime."

[[items]]
id = "bluetooth-multiple-connections-multi-connection-optimization"
section = "bluetooth-le-roles-connections-reliability"
title = "Multiple connections / multi-connection optimization"
status = "absent"
level = "composed-product"
scope-and-limitations = "No multi-handle connection scheduler, ACL ownership or connection-table lifecycle exists."

[[items]]
id = "bluetooth-connect-ind-decoding-and-admission"
section = "bluetooth-le-roles-connections-reliability"
title = "`CONNECT_IND` decoding and admission"
status = "implemented"
level = "composed-product"
scope-and-limitations = "[Portable connection policy](../../../../protocols/bluetooth/le/ll/src/connection.rs) validates addresses, Access Address, timing, channel map, hop and other request fields; advertiser admission checks the local address and allowed channel-selection algorithm. This row covers admission only."

[[items]]
id = "bluetooth-first-peripheral-connection-window"
section = "bluetooth-le-roles-connections-reliability"
title = "First peripheral connection window"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The first event listens across the whole transmit window of the connection indication, widened by the 16-microsecond first-event guard, and reserves the vendor's minimum LE 1M event duration after it."

[[items]]
id = "bluetooth-recurring-peripheral-events"
section = "bluetooth-le-roles-connections-reliability"
title = "Recurring peripheral events"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Each later event is planned when the previous one ends, at the anchor the last received packet fixed, with clock-drift widening; the connection interval bounds how long the hardware may continue the event."

[[items]]
id = "bluetooth-channel-selection-algorithm-1"
section = "bluetooth-le-roles-connections-reliability"
title = "Channel Selection Algorithm #1"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Connection events select their data channel by CSA#1 unless both devices negotiated CSA#2."

[[items]]
id = "bluetooth-channel-selection-algorithm-2"
section = "bluetooth-le-roles-connections-reliability"
title = "Channel Selection Algorithm #2"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Connectable advertising sets ChSel, `CONNECT_IND` admission selects CSA#2 when both devices set it, and connection events select their data channel by it."

[[items]]
id = "bluetooth-peripheral-latency"
section = "bluetooth-le-roles-connections-reliability"
title = "Peripheral latency"
status = "partial"
level = "composed-product"
scope-and-limitations = "The connection accepts and reports the peripheral latency but listens at every event; it never skips events for latency."

[[items]]
id = "bluetooth-sleep-clock-accuracy-window-widening"
section = "bluetooth-le-roles-connections-reliability"
title = "Sleep Clock Accuracy / window widening"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Window widening adds the peer's sleep-clock accuracy and the backend's local bound over the time since the last received anchor, plus the backend's 16-microsecond jitter."

[[items]]
id = "bluetooth-establishment-supervision-timeout"
section = "bluetooth-le-roles-connections-reliability"
title = "Establishment / supervision timeout"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Six events without a packet from the central fail the connection with LE Connection Complete status `0x3e`; an established connection without a received packet for the supervision timeout ends with Disconnection Complete reason `0x08`."

[[items]]
id = "bluetooth-missed-event-recovery"
section = "bluetooth-le-roles-connections-reliability"
title = "Missed-event recovery"
status = "implemented"
level = "composed-product"
scope-and-limitations = "An event that can no longer be admitted in time, or would find no room in the Host output, is skipped and counted as missed; the next event widens over the whole elapsed time, and the supervision timeout bounds recovery."

[[items]]
id = "bluetooth-ll-data-pdu-rx"
section = "bluetooth-le-roles-connections-reliability"
title = "LL Data PDU RX"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Received data PDUs are authenticated first when encrypted, then dispatched to the control procedures or delivered to the Host as ACL data that keeps the L2CAP start and continuation boundaries."

[[items]]
id = "bluetooth-ll-data-pdu-tx"
section = "bluetooth-le-roles-connections-reliability"
title = "LL Data PDU TX"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Host ACL packets are fragmented by the effective transmit length of the Data Length Update, leaving room for the MIC when encrypted; the fragment stays queued until the peer acknowledges it."

[[items]]
id = "bluetooth-sn-nesn-retransmission-duplicate-suppression-and-empty-pdu-acknowledgments"
section = "bluetooth-le-roles-connections-reliability"
title = "SN/NESN, retransmission, duplicate suppression and empty-PDU acknowledgments"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The Controller hardware keeps SN and NESN, retransmits the queued PDU until the peer acknowledges it and answers with empty PDUs; at most one PDU waits for acknowledgement, and empty PDUs never reach the Host."

[[items]]
id = "bluetooth-llcp-framework"
section = "bluetooth-le-roles-connections-reliability"
title = "LLCP framework"
status = "partial"
level = "composed-product"
scope-and-limitations = "The [control procedures](../../../../protocols/bluetooth/le/ll/src/control.rs) answer feature, version, LE Ping and Data Length requests, apply Connection Update, Channel Map Update and PHY Update at their instants and answer other procedures with `LL_UNKNOWN_RSP`. Connection Parameters Request and later procedures are absent."

[[items]]
id = "bluetooth-connection-update-channel-map-update"
section = "bluetooth-le-roles-connections-reliability"
title = "Connection Update / Channel Map Update"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Central Connection Update and Channel Map Update wait for the event to end and apply at their exact instants; a passed instant ends the connection, and LE Connection Update Complete reports changed parameters."

[[items]]
id = "bluetooth-phy-update"
section = "bluetooth-le-roles-connections-reliability"
title = "PHY Update"
status = "partial"
level = "composed-product"
scope-and-limitations = "The [peripheral](../../../../protocols/bluetooth/le/ll/src/control.rs) answers `LL_PHY_REQ` with the Host's LE Set Default PHY preference, sends its own for LE Set PHY and applies `LL_PHY_UPDATE_IND` at its instant, which collides with a pending Connection Update or Channel Map Update as they do with each other. LE Read PHY reports the PHYs, and LE PHY Update Complete ends a Host request and reports a change; a rejected, unsupported or unanswered request reports its status. LE Coded is neither offered nor accepted, and the Data Length times are not recomputed for LE 2M."

[[items]]
id = "bluetooth-data-length-extension-data-length-update"
section = "bluetooth-le-roles-connections-reliability"
title = "Data Length Extension / Data Length Update"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The [Link Layer](../../../../protocols/bluetooth/le/ll/src/data_length.rs) answers and starts the Data Length Update on LE 1M up to 251 octets and 2120 us; the [Controller](../../../../protocols/bluetooth/le/controller/src/peripheral.rs) fragments Host data by the effective transmit length, serves HCI LE Set Data Length, Read and Write Suggested Default Data Length and Read Maximum Data Length, and reports LE Data Length Change."

[[items]]
id = "bluetooth-feature-exchange"
section = "bluetooth-le-roles-connections-reliability"
title = "Feature Exchange"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The peripheral answers `LL_FEATURE_REQ` and serves LE Read Remote Features with its own request and LE Read Remote Features Complete."

[[items]]
id = "bluetooth-version-exchange"
section = "bluetooth-le-roles-connections-reliability"
title = "Version Exchange"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The peripheral answers `LL_VERSION_IND` once and serves Read Remote Version Information with the configured local identity."

[[items]]
id = "bluetooth-le-ping"
section = "bluetooth-le-roles-connections-reliability"
title = "LE Ping"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The peripheral answers `LL_PING_REQ` with `LL_PING_RSP`."

[[items]]
id = "bluetooth-termination"
section = "bluetooth-le-roles-connections-reliability"
title = "Termination"
status = "implemented"
level = "composed-product"
scope-and-limitations = "A peer `LL_TERMINATE_IND`, an acknowledged local `LL_TERMINATE_IND` from HCI Disconnect, the supervision timeout or Reset ends the connection; Disconnection Complete follows except after Reset."

[[items]]
id = "bluetooth-adaptive-frequency-hopping-channel-assessment"
section = "bluetooth-le-roles-connections-reliability"
title = "Adaptive Frequency Hopping / channel assessment"
status = "partial"
level = "composed-product"
scope-and-limitations = "Channel maps from the connection indication and Channel Map Updates select the hopping channels. Local channel assessment and Controller-initiated map generation are absent."

[[items]]
id = "bluetooth-le-channel-classification"
section = "bluetooth-le-roles-connections-reliability"
title = "LE Channel Classification"
status = "absent"
level = "composed-product"
scope-and-limitations = "No connected classification generation/report/update procedure exists."

[[items]]
id = "bluetooth-ble-encryption-accelerator-surface"
section = "bluetooth-security-privacy"
title = "BLE encryption accelerator surface"
status = "absent"
level = "composed-product"
scope-and-limitations = "[Reviewed hardware registers](../../../../../registers/esp32s31/model/peripherals/ble-hw-accelerator.toml) describe encryption operations, but no Rust owner drives them; the Link Layer uses software AES-CCM."

[[items]]
id = "bluetooth-link-layer-encryption"
section = "bluetooth-security-privacy"
title = "Link Layer Encryption"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The [Link Layer security](../../../../protocols/bluetooth/le/ll/src/security.rs) owns the Long Term Key, the peripheral start, pause and restart handshakes, independent packet counters, nonce construction and MIC authentication in software AES-CCM. The Controller serves LE Long Term Key Request Reply and Negative Reply, reports Encryption Change and Encryption Key Refresh Complete, and terminates the connection when authentication fails. The accelerator surface stays unused."

[[items]]
id = "bluetooth-le-privacy-1-2"
section = "bluetooth-security-privacy"
title = "LE Privacy 1.2"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "The production [scanner image](memory/src/legacy_scanning_event_image.rs) fixes privacy disabled. Resolving-list hardware does not provide an RPA/IRK lifecycle."

[[items]]
id = "bluetooth-resolving-list"
section = "bluetooth-security-privacy"
title = "Resolving List"
status = "partial"
level = "composed-product"
scope-and-limitations = "[PHY engine storage](memory/src/ble_phy_engine.rs) owns allocation and base publication. HCI list commands, IRKs and live resolution policy are not composed."

[[items]]
id = "bluetooth-le-secure-connections-integration"
section = "bluetooth-security-privacy"
title = "LE Secure Connections integration"
status = "host-only"
level = "composed-product"
scope-and-limitations = "Pairing and SMP belong to the Host: the [secure GATT application](../../../../../examples/bluetooth-gatt/src/security.rs) pairs with LE Secure Connections Numeric Comparison through the Trouble Host. The Controller side of the resulting encryption is the Link Layer encryption row."

[[items]]
id = "bluetooth-encrypted-advertising-data"
section = "bluetooth-security-privacy"
title = "Encrypted Advertising Data"
status = "absent"
level = "composed-product"
scope-and-limitations = "No key/material lifecycle and advertiser/scanner formatter or consumer exists."

[[items]]
id = "bluetooth-advertising-extensions-multiple-advertising-sets"
section = "bluetooth-extended-periodic-direction-finding"
title = "Advertising Extensions / multiple advertising sets"
status = "absent"
level = "composed-product"
scope-and-limitations = "No `ADV_EXT_IND` or `AUX_ADV_IND` production role or set lifecycle exists. Allocation counts do not create roles."

[[items]]
id = "bluetooth-secondary-channel-advertising-2m-coded-advertising-and-advertising-coding-selection"
section = "bluetooth-extended-periodic-direction-finding"
title = "Secondary-channel advertising, 2M / Coded advertising and Advertising Coding Selection"
status = "absent"
level = "composed-product"
scope-and-limitations = "No AUX scheduling and PHY-selection owner exists. DTM coverage does not extend to advertising."

[[items]]
id = "bluetooth-periodic-advertising-synchronization"
section = "bluetooth-extended-periodic-direction-finding"
title = "Periodic Advertising / synchronization"
status = "absent"
level = "composed-product"
scope-and-limitations = "No periodic advertiser or sync role exists; reserved sync capacity is only geometry."

[[items]]
id = "bluetooth-periodic-advertising-sync-transfer-past"
section = "bluetooth-extended-periodic-direction-finding"
title = "Periodic Advertising Sync Transfer (PAST)"
status = "absent"
level = "composed-product"
scope-and-limitations = "Neither the ACL procedure nor periodic-sync owner is composed."

[[items]]
id = "bluetooth-periodic-advertising-with-responses-pawr"
section = "bluetooth-extended-periodic-direction-finding"
title = "Periodic Advertising with Responses (PAwR)"
status = "absent"
level = "composed-product"
scope-and-limitations = "No subevent/response-slot scheduling or advertiser/scanner runtime exists."

[[items]]
id = "bluetooth-advdatainfo-periodic-advertising-enhancements"
section = "bluetooth-extended-periodic-direction-finding"
title = "AdvDataInfo / Periodic Advertising Enhancements"
status = "absent"
level = "composed-product"
scope-and-limitations = "No production periodic-advertising foundation exists."

[[items]]
id = "bluetooth-advertising-channel-index"
section = "bluetooth-extended-periodic-direction-finding"
title = "Advertising Channel Index"
status = "absent"
level = "composed-product"
scope-and-limitations = "No production owner implements the named feature."

[[items]]
id = "bluetooth-constant-tone-extension-activation"
section = "bluetooth-extended-periodic-direction-finding"
title = "Constant Tone Extension activation"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "Normal initialization publishes a [disabled CTE workspace](memory/src/direction_finding_workspace.rs). Recovered CTE controls do not activate Direction Finding."

[[items]]
id = "bluetooth-aoa-aod"
section = "bluetooth-extended-periodic-direction-finding"
title = "AoA / AoD"
status = "absent"
level = "composed-product"
scope-and-limitations = "No antenna pattern, IQ sampling, CTE TX/RX protocol or report lifecycle exists; the CTE activation boundary remains disabled."

[[items]]
id = "bluetooth-connected-connectionless-cte-procedures"
section = "bluetooth-extended-periodic-direction-finding"
title = "Connected / connectionless CTE procedures"
status = "absent"
level = "composed-product"
scope-and-limitations = "Neither connected LLCP nor periodic-advertising CTE ownership exists."

[[items]]
id = "bluetooth-iq-sample-delivery-over-hci"
section = "bluetooth-extended-periodic-direction-finding"
title = "IQ sample delivery over HCI"
status = "absent"
level = "composed-product"
scope-and-limitations = "No sampling-to-HCI producer or reporting lifecycle exists."

[[items]]
id = "bluetooth-le-power-control-path-loss-monitoring"
section = "bluetooth-power-subrating-iso"
title = "LE Power Control / Path Loss Monitoring"
status = "absent"
level = "composed-product"
scope-and-limitations = "No connected procedure, threshold state or HCI event producer exists. Default power encoding is separate."

[[items]]
id = "bluetooth-le-connection-subrating"
section = "bluetooth-power-subrating-iso"
title = "LE Connection Subrating"
status = "absent"
level = "composed-product"
scope-and-limitations = "No LLCP, subrate anchor or scheduling lifecycle exists."

[[items]]
id = "bluetooth-le-isochronous-channels-isoal"
section = "bluetooth-power-subrating-iso"
title = "LE Isochronous Channels / ISOAL"
status = "absent"
level = "composed-product"
scope-and-limitations = "No ISO adaptation, stream scheduling or Controller data-path owner exists."

[[items]]
id = "bluetooth-connected-isochronous-groups-streams-cig-cis"
section = "bluetooth-power-subrating-iso"
title = "Connected Isochronous Groups / Streams (CIG/CIS)"
status = "absent"
level = "composed-product"
scope-and-limitations = "No connected group/stream control and scheduling lifecycle exists."

[[items]]
id = "bluetooth-broadcast-isochronous-groups-streams-big-bis"
section = "bluetooth-power-subrating-iso"
title = "Broadcast Isochronous Groups / Streams (BIG/BIS)"
status = "absent"
level = "composed-product"
scope-and-limitations = "No BIG control, periodic-advertising integration or broadcast ISO scheduler exists."

