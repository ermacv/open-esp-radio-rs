schema = 5
id = "station-access-point-load"
description = "Simultaneous same-channel STA+AP UDP bidirectional load with per-interface fairness, beacon timing, and RX hardware health"
role = "investigation"
tags = ["wifi", "sta-ap", "udp", "fairness", "beacon", "psram-stack", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-access-point"
link = { phy = "ht40", minimum_mcs = 7 }
timeout_seconds = 30
duration_seconds = 15
direction = "bidirectional"
rate_bps_per_flow = 10000000
minimum_bps_per_flow = 5000000
maximum_fairness_skew_percent = 50
payload_bytes = 1472
