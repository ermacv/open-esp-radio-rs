[package]
name = "oer-esp32s31-hil-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# Two RTC-retained trace snapshot slots of 1024 words, for images that
# capture register windows.
trace-snapshots = []
# Record the PHY trace points and capture its poison snapshot.
phy-trace = ["oer-esp32s31-phy?/trace", "trace-snapshots"]
# Experimental direct RX-gain transaction SRAM placement for an otherwise
# identical diagnostic image.
phy-rx-hot-sram = ["oer-esp32s31-phy?/rx-gain-hot-sram", "oer-esp32s31-ieee80211-system?/phy-rx-hot-sram"]
boot-smoke = []
system-watchdog = [
    "dep:oer-hil-protocol",
    "oer-hil-protocol?/system",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:log",
    "dep:oer-hil-agent",
    "dep:oer-hil-image-keys",
    "dep:heapless",
    "dep:critical-section",
]
phy-fault-injection = [
    "oer-esp32s31-phy/lifecycle-fault-injection",
]
owned-network = ["dep:embassy-net-owned", "dep:oer-embassy-net-owned", "dep:xarxa-owned", "oer-esp32s31-ieee80211-system/owned-network", "oer-hil-agent?/owned-network"]
# Bluetooth LE over the production composition and its HCI Controller. The
# Direct Test Mode image serves the `bluetooth-dtm-*` scenarios; the GATT
# images run the Trouble Host and the GATT application.
bluetooth-radio = [
    "oer-hil-protocol?/bluetooth",
    "dep:oer-bluetooth-controller",
    "dep:oer-bluetooth-hci",
    "dep:oer-esp32s31-bluetooth-system",
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-phy",
    "dep:oer-esp32s31-radio-esp-hal",
    "dep:oer-esp32s31-radio-runtime",
    "dep:oer-esp32s31-radio-system",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embedded-io",
    "dep:embedded-io-async",
    "dep:log",
    "dep:oer-hil-protocol",
    "dep:oer-hil-agent",
    "dep:oer-hil-image-keys",
    "dep:heapless",
    "dep:critical-section",
]
bluetooth-hil = ["bluetooth-radio"]
bluetooth-gatt = ["bluetooth-radio", "dep:gatt-application", "dep:trouble-host"]
# The secure GATT image restarts the Controller epoch around one retained bond
# store and serves the `bluetooth-secure-gatt` scenario.
bluetooth-secure-gatt = [
    "bluetooth-radio",
    "dep:gatt-application",
    "gatt-application/secure",
    "dep:trouble-host",
    "dep:oer-hil-agent",
    "dep:oer-hil-image-keys",
    "oer-hil-agent/secure-gatt",
]
open-radio-hil = [
    "oer-hil-protocol?/wifi",
    "oer-hil-agent?/wifi",
    "dep:oer-ieee80211-softmac",
    "dep:oer-esp32s31-ieee80211-mac",
    "dep:oer-esp32s31-ieee80211-runtime",
    "oer-esp32s31-platform-runtime/multicore",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embedded-io-async",
    "dep:log",
    "dep:heapless",
    "dep:oer",
    "dep:oer-network-interface",
    "dep:oer-esp32s31-ieee80211-system",
    "dep:oer-esp32s31-radio-system",
    "dep:oer-esp32s31-phy",
    "dep:oer-esp32s31-ieee80211-esp-hal",
    "dep:oer-hil-protocol",
    "dep:oer-hil-agent",
    "dep:oer-hil-image-keys",
    "dep:critical-section",
    "dep:oer-hil-esp32s31-telemetry",
    "dep:oer-ieee80211-runtime",
    "dep:oer-esp32s31-hil-calibration-artifact",
]
# The Wi-Fi image with a concurrent Bluetooth LE client on the same shared
# radio: the Trouble GATT application runs beside Wi-Fi traffic and serves the
# joint Wi-Fi/Bluetooth coexistence scenarios through the Wi-Fi console.
wifi-ble-coex = [
    "oer-hil-protocol?/bluetooth",
    "open-radio-hil",
    "driver-observation",
    "dep:oer-esp32s31-hal",
    "dep:oer-bluetooth-controller",
    "dep:oer-bluetooth-hci",
    "dep:oer-esp32s31-bluetooth-system",
    "dep:gatt-application",
    "dep:trouble-host",
]
driver-observation = [
    "station-exit-evidence",
    "oer-esp32s31-executor-embassy/timer-observation",
    "oer-esp32s31-phy/registration-diagnostics",
]
# The Wi-Fi system's diagnostics alone: the station's exit evidence and
# observers, without the executor timer and PHY registration observers.
station-exit-evidence = ["oer-esp32s31-ieee80211-system/diagnostics", "wifi-trace"]
# Record the Wi-Fi trace points: station control, power state, link events
# and RX slot ownership.
wifi-trace = ["oer-esp32s31-ieee80211-runtime?/trace"]
# Intrusive hard-IRQ classification. This is never part of correctness or
# performance images because it extends the SRAM-closed MAC ISR call graph.
mac-irq-telemetry = [
    "driver-observation",
    "oer-esp32s31-ieee80211-system/mac-irq-diagnostics",
]
tx-wait-probe = [
    "mac-irq-telemetry",
    "oer-esp32s31-ieee80211-system/tx-wait-probe",
    "oer-hil-esp32s31-telemetry/tx-wait-probe",
]
# Common low-overhead observer used by both residence and task-poll images.
# Keep it independent from the TX architecture probes: task-poll scenarios do
# not select those probes and must not pay for their DMA-visible owners.
connected-datapath-poll-telemetry = [
    "oer-esp32s31-ieee80211-system/connected-datapath-cycle-telemetry",
]
# Minimal diagnostic overlay for measuring continuous Embassy Future::poll
# residence. Keep the rejected/experimental TX backing implementations out of
# this image: their compile-time branches and DMA-visible owners measurably
# change the linked hot-path layout even when runtime-disabled.
task-residence-telemetry = ["connected-datapath-poll-telemetry", "pc-profile"]
# Statistical PC profile of both harts over each UDP RX window.
pc-profile = []
# Same-image home for hardware-address and memory-transfer probes. It retains
# residence timing, but must never be used as the production CPU budget.
tx-architecture-probes = [
    "task-residence-telemetry",
    "tx-psram-dma-probe",
    "gdma-mem2mem-probe",
]
tx-psram-dma-probe = [
    "oer-esp32s31-ieee80211-system/tx-psram-dma-probe",
]
# Diagnostic-only PSRAM-to-SRAM promotion benchmark. It claims AXI-GDMA
# channel 0 before radio startup and releases it before any workload begins.
memory-benchmark = [
    "open-radio-hil",
    "oer-hil-protocol?/system",
    "oer-hil-agent?/system",
    "oer-esp32s31-soc-esp-hal/psram-dma-diagnostic",
]
gdma-mem2mem-probe = ["oer-esp32s31-soc-esp-hal/psram-dma-diagnostic"]
# General task-poll diagnostic. Driver observation remains available for the
# existing RX/TX/AP diagnostic scenarios, but Core0 per-phase accounting is
# deliberately separate below.
task-poll-telemetry = [
    "connected-datapath-poll-telemetry",
    "driver-observation",
]
# Intrusive Core0 RX phase accounting. This retains the same top-level task
# residence evidence, but is a separate feature because its per-phase cycle
# reads, atomics, and larger linked image measurably perturb the result.
core0-rx-cycle-telemetry = [
    "task-poll-telemetry",
    "oer-esp32s31-ieee80211-system/task-poll-telemetry",
]
# Production-like Core0 accounting: no driver observers and no per-frame
# instrumentation, only radio/runner/DMA/protocol batch samples.
core0-rx-coarse-telemetry = [
    "connected-datapath-poll-telemetry",
    "oer-esp32s31-ieee80211-system/core0-rx-coarse-telemetry",
]
# Diagnostic overlay proving each UDP RX delivery frontier from software
# reorder output through network admission and application consumption.
rx-delivery-telemetry = ["driver-observation"]
rx-ownership-telemetry = [
    "oer-esp32s31-ieee80211-system/rx-ownership-observation",
    "oer-hil-esp32s31-telemetry/rx-ownership-observation",
    "dep:oer-esp32s31-ieee80211-dma",
]
# Internal marker of every IEEE 802.15.4 image that consumes the radio before
# initialization; the images are mutually exclusive.
ieee802154-diagnostic = ["oer-hil-protocol?/ieee802154"]
# Diagnostic-only, bounded discriminator for the IEEE 802.15.4 EVENT_STATUS
# timer bits. It reads both source-132 route controls but never writes a route
# or attests that the production IRQ path is ready.
ieee802154-event-status-probe = [
    "ieee802154-diagnostic",
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-radio-esp-hal",
    "oer-esp32s31-hal/validation-probes",
]
# Diagnostic-only ED-DONE/TIMER0 selective-write discriminator.
# RX-ABORT is retained explicitly when PHY/RF/BTBB readiness is absent.
ieee802154-ed-event-probe = [
    "ieee802154-diagnostic",
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-radio-esp-hal",
    "oer-esp32s31-hal/validation-probes",
]
# Diagnostic-only same-bit arrival and level-retrigger probe of the
# IEEE 802.15.4 source-132 route over the production MAC owners and route
# adapter, with the MAC timers as its only stimulus.
ieee802154-route-probe = [
    "ieee802154-diagnostic",
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-radio-esp-hal",
    "dep:oer-esp32s31-ieee802154-esp-hal",
    "dep:oer-espressif-ieee802154-engine",
    "oer-esp32s31-hal/validation-probes",
]
# The composed IEEE 802.15.4 client on the shared radio arbiter: the
# single-device on-air check and host-driven peer sessions.
ieee802154-radio = [
    "ieee802154-diagnostic",
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-phy",
    "dep:oer-esp32s31-radio-esp-hal",
    "dep:oer-espressif-ieee802154-engine",
    "dep:oer-espressif-ieee802154-runtime",
    "dep:oer-esp32s31-ieee802154-system",
    "dep:oer-esp32s31-radio-runtime",
    "dep:oer-ieee802154",
]
# Record the IEEE 802.15.4 engine and runtime trace points and the MAC power
# sequence at each transmission start.
ieee802154-trace = [
    "oer-espressif-ieee802154-runtime?/trace",
    "oer-esp32s31-hal?/ieee802154-trace",
]
# OpenThread over the composed client: host-driven Thread sessions.
ieee802154-thread = [
    "ieee802154-radio",
    "dep:oer-esp32s31-ieee802154-openthread",
    "dep:openthread",
    "dep:tinyrlibc",
]

[dependencies]
oer-esp32s31-ieee80211-dma = { path = "../../../../crates/hardware/esp32s31/driver/ieee80211/dma", optional = true, features = ["rx-ownership-observation"] }
oer-ieee80211-softmac = { workspace = true, optional = true }
oer-esp32s31-ieee80211-mac = { workspace = true, optional = true }
oer-esp32s31-ieee80211-runtime = { workspace = true, optional = true }
oer-embassy-net-owned = { workspace = true, optional = true }
xarxa-owned = { workspace = true, optional = true }
embassy-executor.workspace = true
embassy-futures = { workspace = true, optional = true }
embassy-net-owned = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time.workspace = true
embedded-io-async = { workspace = true, optional = true }
esp-hal = { workspace = true, features = ["esp32s31", "rt", "unstable"] }
log = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
critical-section = { version = "1.2.0", optional = true }
oer = { workspace = true, optional = true }
oer-network-interface = { workspace = true, optional = true }
oer-esp32s31-ieee80211-system = { workspace = true, optional = true }
oer-esp32s31-radio-system = { workspace = true, optional = true }
oer-esp32s31-hal = { workspace = true, optional = true }
oer-esp32s31-phy = { workspace = true, optional = true }
embedded-io = { version = "0.7.1", optional = true }
gatt-application = { package = "oer-example-bluetooth-gatt", path = "../../../../examples/bluetooth-gatt", optional = true }
oer-bluetooth-controller = { path = "../../../../crates/protocols/bluetooth/le/controller", optional = true }
oer-bluetooth-hci = { path = "../../../../crates/protocols/bluetooth/hci", optional = true }
trouble-host = { version = "=0.8.0", git = "https://github.com/ermacv/trouble", rev = "a6af435ba1539cead0afce04718ad8a089bcc4b9", optional = true, default-features = false, features = ["default-packet-pool", "gatt", "peripheral"] }
oer-esp32s31-bluetooth = { workspace = true, optional = true }
oer-esp32s31-bluetooth-system = { workspace = true, optional = true }
oer-esp32s31-radio-esp-hal = { workspace = true, features = ["esp32s31"], optional = true }
oer-espressif-ieee802154-engine = { workspace = true, optional = true }
oer-esp32s31-ieee802154-esp-hal = { workspace = true, optional = true }
oer-espressif-ieee802154-runtime = { workspace = true, optional = true }
oer-esp32s31-ieee802154-system = { workspace = true, optional = true }
oer-esp32s31-ieee802154-openthread = { workspace = true, optional = true }
openthread = { workspace = true, optional = true }
tinyrlibc = { workspace = true, optional = true }
oer-esp32s31-radio-runtime = { workspace = true, optional = true }
oer-ieee802154 = { workspace = true, optional = true }
oer-esp32s31-soc-esp-hal.workspace = true
# Recording is on in every image; only freeze triggers record unless a
# domain feature adds its trace points.
oer-trace = { path = "../../../../crates/trace", features = ["record"] }
oer-time-embassy = { path = "../../../../crates/adapters/embassy/time" }
oer-esp32s31-executor-embassy.workspace = true
oer-esp32s31-ieee80211-esp-hal = { workspace = true, features = ["esp32s31"], optional = true }
oer-hil-protocol = { workspace = true, optional = true, features = ["async-io"] }
oer-hil-agent = { path = "../../../agent", optional = true, default-features = false }
oer-hil-image-keys = { workspace = true, optional = true }
oer-hil-trace.workspace = true
oer-esp32s31-platform-board = { path = "../../../../platform/esp32s31/board" }
oer-esp32s31-platform-runtime = { path = "../../../../platform/esp32s31/runtime" }
oer-hil-esp32s31-telemetry = { workspace = true, optional = true }
oer-ieee80211-runtime = { workspace = true, optional = true }
oer-esp32s31-hil-calibration-artifact = { path = "../calibration-artifact", optional = true }
static_cell.workspace = true

[lints]
workspace = true

[build-dependencies]
oer-esp32s31-platform-layout = { path = "../../../../platform/esp32s31/layout", features = ["build"] }

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "chip"
chip = "esp32s31"
hil = "observation"
default-configuration = false
supported-feature-profiles = [
    "open-radio-hil,owned-network",
]
