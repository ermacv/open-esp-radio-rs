schema = 5
id = "diagnostic-station-pause"
description = "Same-connection MAC/RX/IRQ pause after measured UDP delivery, followed by continued traffic"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { tx_bps = 65000000 }

[wifi.workload.maintenance]
operation = "access"

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_tx_bps = 10000000
