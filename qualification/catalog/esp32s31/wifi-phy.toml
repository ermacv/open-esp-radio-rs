[[items]]
id = "phy-calibration-state-and-tracking-periodic-tracking-service"
section = "phy-calibration-state-and-tracking"
title = "Periodic tracking service"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "[Client state](src/state/client.rs) evaluates tracking deadlines and target runners can execute requests. Wi-Fi exposes due-only `WifiStopped::maintain_phy` with an owned HAL `WifiAccess` retaining registers and inactive IRQ setup across execution; admission and release check stopped MAC and RX walker; the supervisor invokes it at elapsed deadlines between logical roles after bounded MAC stop, RX-ring halt and IRQ quiescence. Maintenance restores the prior live RX/IRQ handoff without resuming MAC; the following role applies its policy and resumes MAC. The connected-station service starts from `RadioConfig` on every connected epoch and restores the live MAC/RX/IRQ boundary after each operation. Complete scheduling and teardown are not composed for every protocol."
source-paths = ["crates/hardware/esp32s31/phy/src/state/client.rs"]

