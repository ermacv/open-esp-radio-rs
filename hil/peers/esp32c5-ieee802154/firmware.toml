# Firmware catalog entry: `cargo hil firmware flash ieee802154-peer --board esp32c5`.
# The runner requires this image on the IEEE 802.15.4 peer board.
image = "ieee802154-peer"
chip = "esp32c5"
# The one ESP-IDF pin every catalog image builds against.
pins = "esp32s31"
# Built against ESP-IDF 4d59230d the running image stops the esp32c5's USB
# Serial/JTAG from answering, and only the board's RST button recovers it.
# Remove this line once ieee802154-peer-enable-bisect has found the cause.
hold = "on ESP-IDF 4d59230d it stops the esp32c5's USB Serial/JTAG; see ieee802154-peer-enable-bisect"
