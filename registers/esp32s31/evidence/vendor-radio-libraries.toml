id = "BLOB_LIBPHY_CALIBRATION_20260907"
description = "espressif/esp-phy-lib commit 20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/libphy.a, sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2; Complete phy_txgain_comp_pacfg_new, phy_start_tx_tone_step_new, phy_force_dig_gain, phy_reg_update_new and their caller sequencing in phy_bb_init/phy_rf_init. Gain compensation bytes are 00 fb 03 00. Tone start clears stop before disabling compensation; only disabling both paths sets stop and restores compensation. Post-init AGC preserves FTM. Forced digital gain updates enable bit 16 before bytes 0 and 1 in 0x20100408. phy_rf_init applies phy_fe_reg_update before phy_xtal_duty_cal_init."

[[sources]]
id = "BLOB_LIBPHY_PHY_CLOSE_RF_20260907"
description = "espressif/esp-phy-lib commit 20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/libphy.a, sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2; complete phy_init.o phy_close_rf body, size 0x8c. After its retained-state guards it enters the PHY critical section, disables hardware frequency control, calls phy_xpd_rf_new without forcing TX/RX off, enables BBPLL calibration, writes 0x77 to PHY-I2C block 0x6a registers zero and one, publishes the retained closed flag, and exits the critical section."

[[sources]]
id = "BLOB_LIBPHY_PHY_WAKEUP_INIT_20260907"
description = "espressif/esp-phy-lib commit b88e4b76e090ae59c51cb00b916d38def895b396, esp32s31/libphy.a, sha256 d4218e359b9716c616cbf116172f44d9195d4f2e020fad73279067e92d08e580; complete phy_init.o phy_wakeup_init body, size 0x188. The retained-wake parent enters baseband mode two, forces TX/RX off, disables hardware frequency control, restores PHY-I2C/front-end/BBPLL/bias/temperature/PBUS/frequency/register/AGC/channel/TX-capacitance state in the recorded call order, waits for frequency readiness, resets CKGEN, restores hardware frequency control, BBPLL and TX/RX force state, and returns to baseband mode zero. Its phy_freq_i2c_data_write argument is zero, so command memory is preserved while the number-address table is republished. The conditional Wi-Fi-enable tail is guarded by vendor client state; source-owned retained wake starts from an explicitly empty client set."

[[sources]]
id = "BLOB_LIBPHY_PHY_I2C_INIT2_20260907"
description = "espressif/esp-phy-lib commit 20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/libphy.a, sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2; complete phy_i2c.o phy_i2c_init2 body, size 0x2b8. The leaf constructs six 22-byte source arrays from fixed values and retained phy_param inputs, applies three saturated derived values, selects the combined I2C master-zero block mask, performs one six-bank phy_i2c_paral_write_num transaction inside the vendor PHY-I2C critical boundary, and restores the master mask afterward. Binary origin does not exclude these required constants or derived inputs from source-owned retained wake."

[[sources]]
id = "BLOB_LIBPHY_PHY_XPD_RF_NEW_20260907"
description = "espressif/esp-phy-lib commit b88e4b76e090ae59c51cb00b916d38def895b396, esp32s31/libphy.a, sha256 d4218e359b9716c616cbf116172f44d9195d4f2e020fad73279067e92d08e580; complete phy_init.o phy_xpd_rf_new body, size 0x62. The leaf disables AGC, clears MODEM_SYSCON_RADIO.WIFI_BB_CFG bits zero and one in one fresh-read RMW, delays one microsecond, writes 0x07 to PHY-I2C block 0x67 register two, clears PMU_RADIO.RF_PWC bits 31:16, clears PMU_RADIO.IMM_HP_CK_POWER_0 bits 31:28, and tail-calls phy_close_fe_bb_clk."

[[sources]]
id = "HIL_S31_SOFTWARE_CCM_OPCODE_ABORT"
description = "ESP32-S31 rev0 software-CCM controlled comparison, 2026-09-19. Sealed HIL run 1789809143418-000c485b, application sha256 6cb8829320c2804bee55afc48a51a036ead6e598d8c693ea1fa5b92303b201ed, and run 1789809316911-000c4b1d, application sha256 86e8653faf0f7ab60fa52cfc342a5cefee74e5756717f00bf4dbd86baada49c9. Both select valid IVp values for the public fixture LTK so the authenticated Central START_ENC_RSP ciphertext begins with 0x02. The baseline leaves the reviewed initialization image and yields three connection timeouts. The comparison adds only the reviewed LINK_STATE_CONTROL clear after initialization and completes six forced-prefix connections, refreshes and exact ACL echoes. This establishes the software-CCM opcode-inspection requirement on this chip, not Bluetooth qualification or the meaning of other register bits. Complete firmware/source/input hashes and observations are retained in the sealed HIL bundles."
