schema = 5
case-execution = "independent"
transaction-comparison = "observables"

# Concrete execution coverage for the finite RX-DMA register leaves used by
# the descriptor-ring owner. The composed list transaction remains a separate
# production contract; these cases must not be presented as equivalence of
# wDev_AppendRxBlocks itself.

[[profiles]]
name = "libpp-rx-disable"
claim = "whole-function-equivalence"
vendor-source = "libpp"
vendor-symbol = "hal_mac_rx_disable"
rust-symbol = "open_libpp_rx_trace_hal_mac_rx_disable"
compare-return = false
[[profiles.cases]]
name = "enabled-with-unrelated-bits"
[[profiles.cases.mmio-initial]]
address = 0x20104080
value = 0xd5a5a5a5

