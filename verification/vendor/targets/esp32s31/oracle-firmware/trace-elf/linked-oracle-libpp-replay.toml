source = "libpp-replay"
linker-scripts = [
    "../../../../../../hil/targets/esp32s31/linker/rom/esp32s31-eco0.x",
    "link.x",
]
archives = ["../../../../../../_oracles/libpp.a"]
stub-symbols = [
    "__adddf3",
    "__clzsi2",
    "__ctzsi2",
    "__extendsfdf2",
    "__ffssi2",
    "__fixdfsi",
    "__floatsidf",
    "__floatundisf",
    "__floatunsidf",
    "__muldf3",
    "__popcountsi2",
    "__subdf3",
    "__truncdfsf2",
    "__udivdi3",
    "__umoddi3",
    "offchan_tx_progress_in",
    "send_wake_null_timer",
]
