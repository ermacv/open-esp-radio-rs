status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [Link Layer security](../../../../protocols/bluetooth/le/ll/src/security.rs) owns the Long Term Key, the peripheral start, pause and restart handshakes, independent packet counters, nonce construction and MIC authentication in software AES-CCM. The controller core that served LE Long Term Key Request Reply and Negative Reply, reported Encryption Change and Encryption Key Refresh Complete and terminated the connection on an authentication failure was removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration. The accelerator surface stays unused."

