symbol = "hal_mac_rx_enable"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac::mac_rx_dma::set_walker_enabled"
binding = "v2"
rust-binding = "exact-production-entry"
