# Focused link truth for the ESP32-S31 Bluetooth Classic controller boundary.
# The authenticated archives remain the provenance authority; this derived ELF
# restores controller, HCI, shared BTDM and baseband call identity without
# claiming that unresolved platform callbacks have executable behavior.
schema = 1
source = "bredr-controller"
linker-scripts = [
    "../../../../../../hil/targets/esp32s31/linker/rom/esp32s31-eco0.x",
    "link.x",
]
archives = [
    "../../../../../../_oracles/libbredr_app.a",
    "../../../../../../_oracles/libbtdm_common.a",
    "../../../../../../_oracles/libbtbb.a",
    "../../../../../../_oracles/libphy.a",
]
entry-symbols = [
    "bredr_controller_init",
    "bredr_controller_deinit",
    "bredr_controller_state_get",
    "r_bredr_controller_enable",
    "r_bredr_controller_disable",
    "r_bredr_controller_reset",
    "bredr_hci_trans_register_tx",
    "bredr_hci_trans_acl_rx",
    "bredr_hci_trans_sync_rx",
    "r_btdm_task_init",
    "r_btdm_task_enable",
    "r_btdm_task_disable",
    "r_btdm_task_shutdown",
    "r_btdm_task_deinit",
    "bt_bb_v2_init_cmplx",
]
# These are known C runtime boundaries, not controller behavior to infer.
stub-symbols = [
    "__assert_func",
    "__ctzsi2",
    "__divdf3",
    "__extendsfdf2",
    "__muldf3",
    "__popcountsi2",
    "__truncdfsf2",
    "__umoddi3",
    "memcmp",
    "memcpy",
    "memmove",
    "memset",
    "printf",
    "puts",
    "strlen",
]
exact-builtins = ["__udivdi3"]
emit-relocations = true
gc-sections = true
unresolved-symbols = "ignore-all"
