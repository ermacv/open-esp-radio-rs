[package]
name = "oer-probe-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Verification probe declaration compiler and ELF catalog validator"

[dependencies]
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "parsing"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std"] }

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["write"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "tool"
platform = "host"
