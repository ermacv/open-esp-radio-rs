schema = 4
id = "diagnostic-ap-two-client-udp-tx-promotion-phases"
description = "Same-image two-client AP UDP TX staged-promotion phase accounting"
repetitions = 1
image = "diagnostic-core0-rx-coarse"
isolation = "reset"
data_plane = "split-radio-network"
tx_buffer = "psram-staging-copy-diagnostic"
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "tx", "psram", "copy", "core0", "promotion"]

[link]
phy = "ht40"

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 150
client = "laptop"

[workload.traffic]
kind = "udp-multi-client"
direction = "tx"
duration_seconds = 12
tx_rate_bps_per_flow = 65000000
payload_bytes = 1472

[criteria]
exact_delivery = false
minimum_tx_bps = 1
minimum_bps_per_flow = 1
maximum_flow_skew_percent = 100
minimum_concurrent_ap_clients = 2
