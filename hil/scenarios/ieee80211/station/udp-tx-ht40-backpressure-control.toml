schema = 5
id = "udp-tx-ht40-backpressure-control"
description = "Paced HT40 TX control for comparison with saturated task-poll diagnostics"
transfer = "identical-image"
tags = ["diagnostic", "udp", "station", "tx", "ht40", "split-core", "task-poll", "backpressure"]

[wifi]
image = "diagnostic-task-poll"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 16000000 }

[wifi.workload.criteria]
exact_delivery = true
require_no_beacon_loss = true
minimum_tx_bps = 15000000
