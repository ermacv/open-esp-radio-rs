[package]
name = "oer-espressif-ieee802154-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IEEE 802.15.4 MAC driver engine of the Espressif chips, ported from the public ESP-IDF driver"

[features]
# The register model of the low-level interface, for host tests of crates
# that drive the engine.
model = []
# Record the engine's trace points into `oer-trace`.
trace = ["oer-trace/record"]

[dependencies]
bytemuck = { version = "1.25.2", default-features = false }
oer-espressif-coex = { path = "../../coex" }
oer-ieee802154 = { path = "../../../../protocols/ieee802154" }
oer-ieee802154-trace = { path = "../../../ieee802154/trace" }
oer-trace = { path = "../../../../trace" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hardware"
platform = "family"
family = "espressif"
