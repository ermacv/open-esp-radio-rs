schema = 5
id = "udp-tx-he20-ceiling"
description = "HE20 UDP station-to-host transmit ceiling with exact delivery"
role = "investigation"
tags = ["udp", "station", "ceiling", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "he20" }
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 110000000 }

[wifi.workload.criteria]
exact_delivery = true
require_no_beacon_loss = true
minimum_tx_bps = 90000000
