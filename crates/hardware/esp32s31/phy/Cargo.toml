[package]
name = "oer-esp32s31-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free Rust ESP32-S31 PHY state machines"

[features]
default = []
validation-probes = []
# Destructive, one-shot lifecycle fault injection. Never enabled by default.
lifecycle-fault-injection = []
# Experimental placement discriminator for the direct RX-gain transaction.
# It changes code placement only; the recovered algorithm and waits are shared.
rx-gain-hot-sram = []
# Retain value-only RF measurements in registration and role start reports.
registration-diagnostics = []

[dependencies]
oer-esp32s31-hal = { path = "../hal" }

[dev-dependencies]
pin-project-lite = "0.2.17"
oer-esp32s31-hal = { path = "../hal", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "chip"
chip = "esp32s31"
