[[items]]
id = "bluetooth-establishment-supervision-timeout"
section = "bluetooth-le-roles-connections-reliability"
title = "Establishment / supervision timeout"
status = "partial"
level = "composed-product"
scope-and-limitations = "Before establishment, contiguous events preserve the full transmit window plus clock widening. The first peer activity publishes successful LE Connection Complete. Six unanswered events publish failed LE Connection Complete with status `0x3e` and no allocated handle before restoring idle. Established supervision uses the independent hardware valid-RX timestamp and a fresh controller-time gate before recurrence, retiring with `0x08` and publishing Disconnection Complete. A source-backed HIL scenario rfkill-blocks the Linux peer for at least 2500 ms and requires timeout recovery. Closing the Linux user channel can terminate the connection before rfkill, so adapter blocking alone does not establish abrupt RF loss; CRC-error behavior remains unqualified."
source-paths = []

[[items]]
id = "bluetooth-missed-event-recovery"
section = "bluetooth-le-roles-connections-reliability"
title = "Missed-event recovery"
status = "partial"
level = "composed-product"
scope-and-limitations = "Fresh Controller time detects an established event whose guarded start closed before RUN. The active owner cancels its unpublished reservation and rebuilds directly at a later event counter, preserving LL/TX ownership and accumulating widening across the full delta. Supervision and `T_terminate` bound recovery. Crossing a Connection Update or Channel Map Update instant retires with `0x28`. Initial establishment-window treatment and on-air qualification remain open."
source-paths = []

[[items]]
id = "bluetooth-ll-data-pdu-rx"
section = "bluetooth-le-roles-connections-reliability"
title = "LL Data PDU RX"
status = "partial"
level = "composed-product"
scope-and-limitations = "Accepted nonempty LLID 1/2 payloads retain their L2CAP boundary in a bounded Controller-to-Host HCI ACL FIFO and split at the Host-declared ACL buffer length. Empty acknowledgements consume no slot. Each RUN reserves the worst-case hardware RX batch before an on-air ACK is possible, so a mixed data/control completion remains wholly processable under Host backpressure. Host-managed credits are enforced; exhausted credits stop further RUN admission while Controller-time deadline checks and command intake continue. Disconnect closes new handle use while retaining the old handle solely for outstanding credit returns; idle/reconnect waits for the count to reach zero. The peripheral recovery HIL workload declares one 27-byte Host credit, holds it for 300 ms after the first fragment, returns twenty exact credits and requires two distinct complete ten-fragment 251-byte packets per connection, separated by live channel-map application, but no recorded hardware run qualifies it; DLE remains absent."
source-paths = []

[[items]]
id = "bluetooth-ll-data-pdu-tx"
section = "bluetooth-le-roles-connections-reliability"
title = "LL Data PDU TX"
status = "partial"
level = "composed-product"
scope-and-limitations = "The single TX allocation retains control or Host ACL bytes through publication and peer acknowledgement. One 251-byte HCI ACL credit is fragmented into 27-byte legacy Data PDUs when plaintext or 23-byte plaintext fragments plus a four-octet MIC when encrypted; the HCI queue retains later credited packets. The peripheral recovery HIL workload reassembles each ten-fragment unencrypted input and queues two distinct exact 251-byte Host echoes, with the second following live channel-map application. Qualifying hardware evidence is evaluated independently of this source contract. Multiple radio-resident packets and DLE remain absent."
source-paths = []

[[items]]
id = "bluetooth-sn-nesn-retransmission-duplicate-suppression-and-empty-pdu-acknowledgments"
section = "bluetooth-le-roles-connections-reliability"
title = "SN/NESN, retransmission, duplicate suppression and empty-PDU acknowledgments"
status = "partial"
level = "composed-product"
scope-and-limitations = "The bounded control path preserves hardware sequence state and uncompleted TX packets; connection RX applies the reviewed acceptance gate. General ACL reliability is not qualified."
