[package]
name = "oer-hil-arbiter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL stand arbiter: claims, the queue and its job tickets, balances, preemption, maintenance, the lock files and the board journal"

[dependencies]
oer-durable = { path = "../../../tools/durable" }
fs2 = "0.4"
oer-hil-board = { path = "../board" }
oer-hil-stand-model = { path = "../../stand/model" }
oer-process = { path = "../../../tools/process" }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "stand"
hil = "orchestration"
