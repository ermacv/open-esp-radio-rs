schema = 4
id = "diagnostic-ap-single-client-udp-tx-correctness-control"
description = "Correctness-image control for saturated single-client AP UDP TX"
repetitions = 1
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "wifi", "access-point", "single-client", "udp", "tx", "saturation", "control"]

[link]
phy = "ht40"

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 120
client = "open-wrt"

[workload.traffic]
kind = "udp"
direction = "tx"
duration_seconds = 15
tx_rate_bps = 130000000
payload_bytes = 1400

[criteria]
exact_delivery = false
minimum_tx_bps = 1
minimum_concurrent_ap_clients = 1
