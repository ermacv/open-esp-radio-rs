schema = 5
id = "udp-rx-ht40-delivery-diagnostic"
description = "Split-core HT40 host-to-station delivery-frontier diagnostic"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "udp", "station", "ht40", "split-core", "air-strict"]

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 120000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 72000000
