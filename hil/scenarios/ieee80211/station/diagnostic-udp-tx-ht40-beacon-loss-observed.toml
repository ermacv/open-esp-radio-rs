schema = 5
id = "diagnostic-udp-tx-ht40-beacon-loss-observed"
description = "Saturated HT40 UDP station TX beside a light RX flow on the station-exit image observed on air to see the access point's beacons around the loss"
repetitions = 1
tags = ["diagnostic", "udp", "station", "bidirectional", "ht40", "split-core", "beacon-loss", "air-strict"]

[wifi]
image = "diagnostic-station-exit"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 2000000, tx_bps = 130000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true
