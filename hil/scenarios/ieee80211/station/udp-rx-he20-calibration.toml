schema = 5
id = "udp-rx-he20-calibration"
description = "HE20 UDP RX with combined PHY calibration, controlled against the same-image receive baseline"
transfer = "identical-image"
tags = ["integration", "phy-maintenance", "udp", "station", "he20"]
control = "udp-rx-he20-ceiling"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "he20" }
duration_seconds = 16
payload_bytes = 1200
offer = { rx_bps = 100000000 }

[wifi.workload.maintenance]
operation = "calibration"

[wifi.workload.criteria]
exact_delivery = true
require_no_beacon_loss = true
minimum_rx_bps = 90000000
