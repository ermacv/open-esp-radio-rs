schema = 2

[[peripherals]]
name = "I2C_ANA_MST"
description = """
ESP32-C5 analog register I2C master at MODEM_BASE + 0xF800: the two command
hosts, the read-mask word and the host-selection field that the libphy
analog-register leaves drive. Other fields remain absent and are preserved by
every field transaction."""
baseAddress = 0x600AF800

[[peripherals.registers]]
[peripherals.registers.register]
name = "I2C0_CTRL"
description = "Host-0 analog-register command word."
addressOffset = 0x00
size = 32
access = "read-write"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "SLAVE_ADDR"
description = "Analog block code."
bitOffset = 0
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "SLAVE_REG_ADDR"
description = "Register address inside the analog block."
bitOffset = 8
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "DATA"
description = "Byte written, or the byte read once the command completes."
bitOffset = 16
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "READ_WRITE"
description = "Set for a write command, clear for a read command."
bitOffset = 24
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BUSY"
description = "Set while the host executes a command."
bitOffset = 25
bitWidth = 1
access = "read-only"

[[peripherals.registers.register.fields]]
name = "START_OR_RESET"
description = "Set by every libphy command publication, above the public 25-bit control field."
bitOffset = 26
bitWidth = 1

