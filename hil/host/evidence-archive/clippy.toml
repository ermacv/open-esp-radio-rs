# copies: hil-scenario
# Every new HIL scenario crate (hil/model, hil/host/executor, the future
# hil/scenarios/<block>) holds this same file; `cargo tidy check` keeps the
# copies identical. After #761 step 10 removes the old runner, the copies
# become one hil/clippy.toml.
#
# The nearest clippy.toml wins, so this repeats the workspace's rule. HIL
# scenario code holds no duration literal and never sleeps: every wait is an
# `oer_hil_model::Wait` derived from a contract bound, a typed protocol
# interval or the measured stand profile (#761, principle 4).
disallowed-methods = [
    { path = "core::hint::spin_loop", reason = "production radio code must yield through its executor or platform" },
    { path = "core::time::Duration::from_secs", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::from_millis", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::from_micros", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::from_nanos", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::from_nanos_u128", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::from_mins", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::from_hours", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::from_secs_f32", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::from_secs_f64", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::new", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::try_from_secs_f32", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "core::time::Duration::try_from_secs_f64", reason = "derive the wait: oer_hil_model::Wait" },
    { path = "oer_time::Duration::from_micros", reason = "derive the wait: oer_hil_model::Wait from a port's CEILINGS" },
    { path = "oer_time::Duration::from_millis", reason = "derive the wait: oer_hil_model::Wait from a port's CEILINGS" },
    { path = "oer_time::Duration::from_secs", reason = "derive the wait: oer_hil_model::Wait from a port's CEILINGS" },
    { path = "std::thread::sleep", reason = "wait for a typed event or a derived oer_hil_model::Wait" },
    { path = "std::thread::sleep_ms", reason = "wait for a typed event or a derived oer_hil_model::Wait" },
]
