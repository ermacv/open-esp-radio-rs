[package]
name = "oer-hil-flash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL flash operation: lease, write, journal, start; the only way the host writes a board's flash"

[dependencies]
oer-chip-profile = { path = "../../../tools/chip-profile" }
oer-durable = { path = "../../../tools/durable" }
oer-hil-arbiter = { path = "../arbiter" }
oer-hil-board = { path = "../board" }
oer-image = { path = "../../../tools/image" }
oer-process = { path = "../../../tools/process" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "stand"
hil = "operation"
# The tests read the chip profiles.
inputs = ["platform/*/chip.toml"]
