[package]
name = "oer-esp32s31-ieee802154"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-neutral ESP32-S31 IEEE 802.15.4 driver: affine MAC operation owner over DMA, IRQ and MAC leaves"

[features]
validation-probes = []

[dependencies]
oer-esp32s31-ieee802154-dma = { path = "dma" }
oer-esp32s31-ieee802154-irq = { path = "irq" }
oer-esp32s31-ieee802154-mac = { path = "mac" }
oer-esp32s31-hal = { path = "../../hal" }

[dev-dependencies]
oer-esp32s31-ieee802154-irq = { path = "irq", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "chip"
chip = "esp32s31"
