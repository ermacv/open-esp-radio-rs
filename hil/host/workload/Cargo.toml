[package]
name = "oer-hil-workload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL workloads: the repetition context, fixtures, per-boot loops, typed results, image-key gates, measurements, failure classification, cleanup evidence and the family registry"

[features]
# Test helpers for the runner's cross-package end-to-end tests.
test-support = [
    "oer-hil-scenario/test-support",
    "oer-hil-link/test-support",
    "oer-hil-lab/test-support",
]

[dependencies]
oer-hil-lab = { path = "../lab" }
oer-hil-link = { path = "../link" }
oer-hil-run-bundle = { path = "../run-bundle" }
oer-hil-scenario = { path = "../scenario" }
oer-durable = { path = "../../../tools/durable" }
oer-image = { path = "../../../tools/image" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
oer-process = { path = "../../../tools/process" }
oer-hil-protocol = { path = "../../protocol", features = ["registry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
oer-hil-image-class = { path = "../image-class" }
oer-hil-lab = { path = "../lab", features = ["test-support"] }
oer-hil-link = { path = "../link", features = ["test-support"] }
oer-hil-run-bundle = { path = "../run-bundle", features = ["test-support"] }
oer-hil-scenario = { path = "../scenario", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "execution"
hil = "orchestration"
