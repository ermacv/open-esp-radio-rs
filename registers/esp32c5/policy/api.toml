# Reviewed ESP32-C5 closed-PAC domains and safe transactions; no discovery facts or hardware metadata.
schema = 5

[options]
device-access = true
allow-clippy-empty-docs = true

[[ownership-partitions]]
name = "Ieee802154Peripherals"
member = "ieee802154"
description = "IEEE 802.15.4 MAC and source-specific interrupt-route registers owned by the IEEE 802.15.4 hardware lifecycle."
peripherals = ["IEEE802154_MAC", "IEEE802154_INTERRUPT_ROUTE"]

[[ownership-partitions]]
name = "ModemEtmPeripherals"
member = "modem_etm"
description = "Modem event-task matrix channels zero and one, programmed by the IEEE 802.15.4 driver."
peripherals = ["MODEM_ETM"]

[[ownership-partitions]]
name = "ModemClockPeripherals"
member = "modem_clock"
description = "Modem clock gates and MAC resets driven by the vendor modem clock devices; owned by the modem clock owner."
peripherals = ["MODEM_SYSCON_RADIO", "MODEM_LPCON_SHARED_CLOCK"]

[[ownership-partitions]]
name = "PhyI2cPeripherals"
member = "phy_i2c"
description = "Analog register I2C master hosts, read mask and host selection driven by the PHY."
peripherals = ["I2C_ANA_MST"]

[[ownership-partitions]]
name = "PhyRadioPeripherals"
member = "phy_radio"
description = "PMU analog I2C power controls and PHY baseband configuration words driven by the PHY."
peripherals = ["PMU_RADIO", "PHY_BASEBAND_CONFIG", "LP_AON_RADIO", "APB_SARADC_RADIO", "PCR_RADIO"]

