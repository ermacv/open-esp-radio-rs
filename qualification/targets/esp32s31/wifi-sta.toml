]

[[capabilities]]
id = "timeout-error-recovery"
title = "Finite failure and owner disposition"
scope = "Typed cleanup returns the reusable owner only after proven quiescence; otherwise a terminal fault retains the exact hardware frontier"
implementation = "complete"
host = "covered"
async = "bounded"
depends-on = ["rx-tx-dma", "radio-cold-start"]
vendor-anchors = [
  "registers/esp32s31/evidence/vendor-libpp.toml",
]
hil-requirements = [
  { scenario = "station-ap-loss", minimum-repetitions = 1 },
  { scenario = "station-ap-absence", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "failure-cleanup-contracts-incomplete" },
  { axis = "hil", id = "faulted-quiescence-cell-missing" },
]
