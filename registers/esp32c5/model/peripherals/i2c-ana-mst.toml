[peripherals.registers.register]
name = "I2C1_CTRL"
description = "Host-1 analog-register command word."
addressOffset = 0x04
size = 32
access = "read-write"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "SLAVE_ADDR"
description = "Analog block code."
bitOffset = 0
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "SLAVE_REG_ADDR"
description = "Register address inside the analog block."
bitOffset = 8
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "DATA"
description = "Byte written, or the byte read once the command completes."
bitOffset = 16
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0xFF

[[peripherals.registers.register.fields]]
