[package]
name = "oer-esp32s31-ieee802154-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Affine executor-neutral runtime owner for the ESP32-S31 IEEE 802.15.4 MAC"

[features]
validation-probes = []

[dependencies]
oer-esp32s31-ieee802154-dma = { path = "../dma" }
oer-esp32s31-ieee802154-irq = { path = "../irq" }
oer-esp32s31-ieee802154-mac = { path = "../mac" }
oer-esp32s31-pac = { path = "../../../pac" }

[dev-dependencies]
oer-esp32s31-ieee802154-irq = { path = "../irq", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "chip"
chip = "esp32s31"
