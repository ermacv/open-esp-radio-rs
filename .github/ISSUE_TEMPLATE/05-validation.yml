name: "Validation or qualification"
description: "Evaluate a named subject against declared criteria."
labels: ["kind:validation"]
body:
  - type: markdown
    attributes:
      value: "Name one accepted result. Follow [issue management](https://github.com/ermacv/open-esp-radio-rs/blob/main/docs/issues.md). Triage assigns area and priority; dropdowns do not apply labels. Research and implementation do not establish hardware readiness."
  - type: textarea
    id: claim
    attributes:
      label: "Claim and subject"
      description: "The property under evaluation, exact implementation/image/source identity and scope of the claim."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Primary area"
      description: "The owner of the result; triage applies its area label."
      options: ["Wi-Fi","Bluetooth","IEEE 802.15.4","Shared radio","Registers / PAC","Platform","Tooling","HIL","Qualification"]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Owner and scope"
      description: "Name defining paths, layer, target/revision/profile and exclusions."
      placeholder: "Owner paths:\nLayer:\nTarget / revision / profile:\nOut of scope:"
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: "Method, apparatus and criteria"
      description: "Measurements, predeclared tolerances, repetitions, fixture/board/profile and required inputs. Distinguish HIL observations from the qualification verdict."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "Required evidence and evaluator"
      description: "Where reproducible evidence is retained and who evaluates it; name failure/inconclusive outcomes and their next step."
    validations:
      required: true
  - type: textarea
    id: relations
    attributes:
      label: "Relations and activation"
      description: "Parent, blockers with the exact required artifact, related work, and any future activation trigger."
      placeholder: "Part of:\nBlocked by (artifact and consuming step):\nRelated:\nActivation trigger:"
    validations:
      required: false
