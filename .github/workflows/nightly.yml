name: Nightly

# The checks too heavy for every push, once a night on main: the registry's
# nightly tier (`cargo xtask check tier --list`, tools/xtask/src/registry.rs).
# Each job prepares its runner and runs its checks up to the nightly tier:
# - classes: every HIL image class, built and audited as the runner builds
#   it (CI builds the two final images on every push), so a stack frame or
#   placement regression in a diagnostic class is found before it blocks a
#   run;
# - examples: every example built and audited (CI type-checks
#   them), and the RV32 decoder's accepted encodings against the toolchain's
#   llvm-objdump;
# - blobray: Blobray's workspace, Clippy and tests, and its standalone
#   extraction;
# - verification: each verified chip's provenance, probe images, vendor
#   scenarios (their ESP-IDF firmware inputs built from the tracked recipes)
#   and vendor host stands, with the pinned artifacts the checks fetch; then
#   every program's readiness against the previous night's, filing a drop as
#   an issue (`cargo qualification readiness`).
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  # A fresh runner has no Cargo cache; the repository configuration keeps
  # Cargo offline for local builds.
  CARGO_NET_OFFLINE: 'false'
  CARGO_TERM_COLOR: always

jobs:
  classes:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/blobray/target
          key: firmware-matrix-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            firmware-matrix-${{ runner.os }}-
            images-${{ runner.os }}-
      - name: Put the toolchain's LLVM tools on PATH
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
      - name: Fetch every workspace
        run: cargo tidy fetch
      # The log lives outside the checkout: the image builder's source
      # snapshot refuses untracked files in the tree. The classes build in a
      # root of their own on the runner's disk.
      - name: Build and audit every image class
        env:
          OER_BUILD_ROOT: ${{ runner.temp }}/oer-build
        run: |
          set -o pipefail
          cargo xtask --verbose check tier nightly --job classes 2>&1 | tee "$RUNNER_TEMP/firmware-matrix.log"
      - name: Summarize the classes
        if: always()
        run: |
          {
            echo '## Firmware classes'
            echo
            echo '```'
            grep -E '^(PASS|FAIL) ' "$RUNNER_TEMP/firmware-matrix.log" || echo 'no class result was printed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: examples-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: examples-${{ runner.os }}-
      - name: Put the toolchain's LLVM tools on PATH
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose check tier nightly --job examples

  blobray:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/blobray/target
          key: blobray-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: blobray-${{ runner.os }}-
      # The linker adapter's tests link real RV32 images with both linkers:
      # LLD, the one the pinned Rust toolchain ships (Ubuntu's LLD 18 fails
      # them), and a GNU ld with the elf32lriscv emulation that accepts
      # --start-lib/--end-lib, new in binutils 2.47 (ld/NEWS). Ubuntu ships
      # 2.42, so the pinned release is built once and cached.
      - name: Use the toolchain's LLD
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "BLOBRAY_TEST_LLD=$(rustc --print sysroot)/lib/rustlib/$host/bin/gcc-ld/ld.lld" >> "$GITHUB_ENV"
      - id: binutils
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/binutils
          key: binutils-2.47-riscv32-${{ runner.os }}
      - name: Build RISC-V GNU ld 2.47
        if: steps.binutils.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO https://ftp.gnu.org/gnu/binutils/binutils-2.47.tar.xz
          echo "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff  binutils-2.47.tar.xz" | sha256sum -c -
          tar -xJf binutils-2.47.tar.xz
          mkdir build-binutils && cd build-binutils
          ../binutils-2.47/configure --target=riscv32-unknown-elf --prefix="$HOME/.local/binutils" \
            --disable-nls --disable-werror --disable-gdb --disable-gdbserver --disable-sim --disable-gprofng
          make -j"$(nproc)" all-ld
          make install-ld
      - name: Put GNU ld on PATH
        run: |
          echo "$HOME/.local/binutils/bin" >> "$GITHUB_PATH"
          "$HOME/.local/binutils/bin/riscv32-unknown-elf-ld" --version | head -1
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose check tier nightly --job blobray

  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Reading the previous night's readiness reports and filing a drop.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/*
            !target/vendor-firmware
            !target/blobray-research
            !target/verification/*/evidence
            !target/qualification
          key: verification-nightly-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', 'verification/*/artifacts.toml') }}
          restore-keys: verification-nightly-${{ runner.os }}-
      # The ESP-IDF tree and tools the vendor scenarios' firmware inputs are
      # built with (~/.cache/open-esp-radio), those builds and the scenario
      # runs (target/vendor-firmware, target/blobray-research) are prepared
      # afresh each night: their gigabytes would evict the CI caches of
      # every other job. The vendor evidence index is too, so readiness
      # after a failed computation sees no index rather than an earlier
      # night's.
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: rm -rf target/verification/*/evidence
      - run: cargo xtask --verbose check tier nightly --job verification
      # Every program's readiness against the evidence the night computed,
      # also after a failed check: a scenario that stopped matching leaves
      # its shard out and lowers readiness. The base is the last good
      # reports: while a readiness issue is open, those of the run its marker
      # names, the last before the drop; otherwise the previous night's on
      # main. A drop opens the issue; each later night updates its table,
      # comments on a further drop and closes it once readiness is back.
      # Closing it by hand accepts the drop: the next night's base is the
      # previous night again.
      - name: Fetch the readiness base
        id: base
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf target/qualification/previous
          issue=$(gh issue list --state open --label area:qualification --limit 100 --json number,body --jq '
            [.[] | select(.body | contains("<!-- nightly-readiness-drop base-run="))][0]
            | if . then "\(.number) \(.body | capture("base-run=(?<run>[0-9]+)").run)" else "" end')
          number=${issue%% *}
          run=${issue#* }
          if [ -n "$issue" ]; then
            expired=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '
              [.artifacts[] | select(.name == "qualification-readiness")][0] | if . then .expired else true end')
            if [ "$expired" != true ]; then
              # A transient failure fails the step rather than replace the base.
              gh run download "$run" --name qualification-readiness --dir target/qualification/previous
              echo "issue #$number keeps the readiness reports of run $run, the last before its drop, as the base"
              echo "issue=$number" >>"$GITHUB_OUTPUT"
              echo "run=$run" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            # The base expired: the issue stays open, no longer compared.
            gh issue view "$number" --json body --jq .body >"$RUNNER_TEMP/body.md"
            sed 's/<!-- nightly-readiness-drop base-run=/<!-- nightly-readiness-drop expired-base-run=/' \
              "$RUNNER_TEMP/body.md" >"$RUNNER_TEMP/expired.md"
            gh issue edit "$number" --body-file "$RUNNER_TEMP/expired.md"
            gh issue comment "$number" --body "The readiness reports of run $run, this issue's base, expired. Nightly no longer compares with them: it compares with the previous night's and files a further drop as a new issue. This one stays open until its drop is fixed or accepted."
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=qualification-readiness" --jq "
            [.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"main\")
              | select(.workflow_run.id != $GITHUB_RUN_ID)][0] | .workflow_run.id // empty")
          if [ -n "$run" ]; then
            gh run download "$run" --name qualification-readiness --dir target/qualification/previous
            echo "the readiness reports of run $run, the previous night's, are the base"
          else
            echo "no earlier readiness reports: nothing to compare with"
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"
      - name: Evaluate every program's readiness
        id: readiness
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: >-
          cargo qualification readiness --out target/qualification/readiness
          --base target/qualification/previous --drops target/qualification/drops.md
      # Only a complete evaluation is published or reported: without one, no
      # drop file does not mean that nothing dropped.
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.readiness.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-readiness
          path: target/qualification/readiness
          if-no-files-found: error
          # An open readiness issue keeps its base run's reports as the base.
          retention-days: 90
          overwrite: true
      - name: Report the readiness against its base
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.readiness.outcome == 'success' && steps.base.outputs.run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.base.outputs.issue }}
          BASE: ${{ steps.base.outputs.run }}
          RUNS: ${{ github.server_url }}/${{ github.repository }}/actions/runs
        run: |
          drops=target/qualification/drops.md
          rows() { grep '^| `' || true; }
          if [ ! -f "$drops" ]; then
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "Nightly at \`$GITHUB_SHA\` ([run]($RUNS/$GITHUB_RUN_ID)) evaluates the readiness of [run $BASE]($RUNS/$BASE) again: the drop is restored."
              gh issue close "$ISSUE" --reason completed
            fi
            exit 0
          fi
          {
            printf 'Nightly at `%s` ([run](%s/%s)) evaluates a lower readiness than [run %s](%s/%s), the last on `main` before the drop:\n\n' \
              "$GITHUB_SHA" "$RUNS" "$GITHUB_RUN_ID" "$BASE" "$RUNS" "$BASE"
            cat "$drops"
            printf '\nEach run'"'"'s `qualification-readiness` artifact holds every program'"'"'s report. Nightly updates this table every night and closes this issue once readiness is back; closing it by hand accepts the drop.\n\n'
            printf '<!-- nightly-readiness-drop base-run=%s -->\n' "$BASE"
          } >"$RUNNER_TEMP/drop.md"
          if [ -z "$ISSUE" ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/issue_labels.py create \
              --title "qualification: readiness dropped in Nightly" \
              --body-file "$RUNNER_TEMP/drop.md" \
              --label kind:bug --label area:qualification --label priority:P1
            exit 0
          fi
          gh issue view "$ISSUE" --json body --jq .body >"$RUNNER_TEMP/body.md"
          rows <"$RUNNER_TEMP/body.md" | sort >"$RUNNER_TEMP/known"
          rows <"$drops" | sort >"$RUNNER_TEMP/now"
          gh issue edit "$ISSUE" --body-file "$RUNNER_TEMP/drop.md"
          comm -13 "$RUNNER_TEMP/known" "$RUNNER_TEMP/now" >"$RUNNER_TEMP/added"
          if [ -s "$RUNNER_TEMP/added" ]; then
            {
              printf 'Nightly at `%s` ([run](%s/%s)) finds a further drop:\n\n| Program | Capability | Axis | Before | Now |\n| --- | --- | --- | --- | --- |\n' \
                "$GITHUB_SHA" "$RUNS" "$GITHUB_RUN_ID"
              cat "$RUNNER_TEMP/added"
            } >"$RUNNER_TEMP/further.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/further.md"
          fi
