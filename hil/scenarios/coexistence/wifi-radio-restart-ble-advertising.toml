schema = 5
id = "wifi-radio-restart-ble-advertising"
description = "Joint Wi-Fi/Bluetooth LE image on the shared radio: connected HT40/WPA2 STA to stopped link, then Wi-Fi leaves coexistence, the PHY and common power and joins again while the Bluetooth LE GATT application advertises, so RF stays open for the other client"
role = "investigation"
repetitions = 3
tags = ["coexistence", "wifi", "bluetooth", "lifecycle", "phy"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "wifi-ble-coex"

[wifi.workload]
kind = "role"
link = { phy = "ht40" }
timeout_seconds = 90
operation = { kind = "restart", cycles = 3, rf = "kept-open" }
