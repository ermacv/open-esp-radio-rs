schema = 5
id = "diagnostic-station-rx-baseline-delivery"
description = "RX diagnostic isolation: no maintenance"
repetitions = 3
transfer = "identical-image"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { rx_bps = 65000000 }

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 60000000
maximum_rx_silence_ms = 50
