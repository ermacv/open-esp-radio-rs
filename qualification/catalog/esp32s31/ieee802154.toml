[[sections]]
id = "ieee802154-overview"
domain = "ieee802154"
title = "ESP32-S31 IEEE 802.15.4 source capabilities"
source-document = "crates/hardware/esp32s31/driver/ieee802154/FEATURES.md"
overview = "See the [whole-radio capability map](../FEATURES.md) for shared ownership,\nclock/power lifecycle and cross-protocol composition limits.\n\nThis inventory describes silicon features, source-owned operations and their\ncomposition limits. It does not claim a complete IEEE 802.15.4-2015 stack,\ncalibrated RF operation or on-air qualification.\n\n| Status | Meaning |\n| --- | --- |\n| IMPLEMENTED | A bounded source path owns the complete operation in the exact scope named by the row, including static policy or a polled MAC primitive. This is not an RF qualification result. |\n| PARTIAL | A source subset exists, but the named feature lacks a complete operational composition. |\n| FAIL-CLOSED | A typed boundary deliberately prevents the stated activation/publication. Known registers alone do not establish this status. |\n| ABSENT | No production protocol/runtime owner exists for the operation. |\n| HOST-ONLY | An upper-stack function, not a radio/MAC implementation claim. This label does not claim that a stack integration exists. |\n\nThe [qualification specification](../../../../../qualification/targets/esp32s31/ieee802154.toml)\nowns readiness and hardware-evidence requirements independently. It marks\nRF/channel readiness, active IRQ runtime and RX/TX dataplane composition\nincomplete. Complete static MAC policy or raw ED/CCA does not supply those\nmissing boundaries."
documents = [
    "crates/hardware/esp32s31/driver/FEATURES.md",
    "qualification/targets/esp32s31/ieee802154.toml",
]

[[sections]]
id = "ieee802154-qualification-scope-mapping"
domain = "ieee802154"
title = "Qualification scope mapping"
source-document = "crates/hardware/esp32s31/driver/ieee802154/FEATURES.md"
overview = "The [program](../../../../../qualification/targets/esp32s31/ieee802154.toml) retains\nthese scopes and source contracts. It does not qualify absent features such as\nCSMA/CA or CSL, and upper stacks remain outside the radio/MAC target."
documents = ["qualification/targets/esp32s31/ieee802154.toml"]

[[sections]]
id = "ieee802154-capability-sources-and-publication-scope"
domain = "ieee802154"
title = "Capability sources and publication scope"
source-document = "crates/hardware/esp32s31/driver/ieee802154/FEATURES.md"
overview = "The [ESP32-S31 datasheet v0.5, section 4.3.5](https://www.espressif.com/sites/default/files/documentation/esp32-s31_datasheet_en.pdf)\ndefines the hardware inventory. The [ESP-IDF IEEE 802.15.4 API](https://github.com/espressif/esp-idf/blob/master/components/ieee802154/include/esp_ieee802154.h)\nalso describes vendor operations such as timed RX/TX, source matching and\nsecurity; a vendor API is not evidence of an open S31 implementation.\n\n[Portable `RadioCapabilities`](../../../../protocols/ieee802154/src/radio/capabilities.rs)\nis a vocabulary. The [radio role](../../../../roles/esp32s31/ieee802154/radio/src/lib.rs)\nadvertises the subset it implements, including `CSMA_CA`, `TRANSMIT_RETRIES` and\n`SECURITY_OFFLOAD`; `SOURCE_MATCH` is not advertised. An advertised capability is source coverage,\nnot RF qualification.\n\nThe [runtime](../../../../runtime/esp32s31/ieee802154/src/lib.rs) admits portable\ncommands through the role, which starts the operations of the [MAC engine](../../../ieee802154/engine/src/engine.rs)\nported from the public ESP-IDF driver. These are runtime entry points, not a\ncomplete public RF-ready service; CSMA/CA backoffs run in the runtime's event\nwait."
packages = [
    "oer-ieee802154",
    "oer-esp32s31-ieee802154-runtime",
    "oer-esp32s31-ieee802154-radio",
    "oer-ieee802154-engine",
]

