[package]
name = "oer-radio-port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The base trait and vocabulary every radio port shares: refusals and poisoning, event loss, lifecycle, cancellation, correlation identities and clock relation"
readme = "README.md"

[features]
# The shared conformance suite (`conformance`), which each backend's tests
# run over a harness of the backend.
test-support = []

[dependencies]
atomic-waker = { version = "1.1.2", default-features = false }
scopeguard = { version = "1.2.0", default-features = false }
oer-time = { path = "../../time" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "contract"
platform = "portable"
