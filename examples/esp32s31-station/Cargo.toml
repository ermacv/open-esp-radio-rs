[package]
name = "open-esp-radio-esp32s31-station"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
esp-backtrace = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform", default-features = false, features = ["esp32s31", "panic-handler", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform", default-features = false, features = ["esp32s31"] }
esp-hal = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform", default-features = false, features = ["esp32s31", "rt", "unstable"] }
esp-println = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform", default-features = false, features = ["auto", "esp32s31", "log-04"] }
open-esp-radio = { path = "../../driver/radio", default-features = false, features = ["esp32s31-wifi-embassy"] }
open-esp-radio-esp32s31-wifi-embassy = { path = "../../driver/adapters/embassy/esp32s31-wifi" }
open-esp-radio-esp32s31-embassy-runtime = { path = "../../driver/adapters/embassy/esp32s31-platform", features = ["esp32s31"] }
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../driver/adapters/esp-hal/esp32s31-wifi", features = ["esp32s31"] }
static_cell = "2.1.1"

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = 3
panic = "abort"
strip = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "d0fb94ef3" }

[workspace]
resolver = "3"
