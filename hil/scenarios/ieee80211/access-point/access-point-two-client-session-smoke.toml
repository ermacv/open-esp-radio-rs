schema = 5
id = "access-point-two-client-session-smoke"
description = "Bound-socket readiness, bidirectional sessions and evidence across two AP epochs"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "access-point", "multi-client", "session-smoke", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-task-residence"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 45
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 5
payload_bytes = 1200
offer = { rx_bps = 1000000, tx_bps = 1000000 }

[wifi.workload.traffic.criteria]
minimum_bps_per_flow = 900000
minimum_host_offer_percent = 95
