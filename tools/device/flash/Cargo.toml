[package]
name = "oer-device-flash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The one flash writer: an image bundle's segments through one espflash connection"

[dependencies]
# The library of the same espflash the images are encoded with.
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"] }
oer-chip-profile = { path = "../../chip-profile" }
oer-device-port = { path = "../port" }
oer-image-bundle = { path = "../../image-bundle" }
serialport = { version = "4.8.1", default-features = false }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
host-layer = "foundation"
