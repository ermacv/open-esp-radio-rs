schema = 5
id = "tcp-rx"
description = "Sustained TCP host-to-station receive"
role = "investigation"
tags = ["tcp", "station", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-tcp"
link = { phy = "he20" }
duration_seconds = 16
chunk_bytes = 32768
offer = { rx_bps = 80000000 }

[wifi.workload.criteria]
minimum_rx_bps = 60000000
require_no_beacon_loss = true
