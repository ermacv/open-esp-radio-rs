schema = 3
# First finite TX/DMA register slice. Indexed ordinary-queue leaves must cover
# all four logical queue selectors and their reversed physical PAC bank.
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "libpp"
symbol = "hal_mac_tx_set_cca"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac::mac_tx_queue::set_cca_force"
binding = "v2"
rust-binding = "exact-production-entry"
rust-probe = "open_libpp_tx_trace_hal_mac_tx_set_cca"
comparison-plan = "direct-effects-v1"
compare-return = true
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x20104c5c }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x20104c5c }
disposition = { kind = "required" }

