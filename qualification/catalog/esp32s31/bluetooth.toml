details = "`host-eatt-and-gatt`, `mesh-host`, `blufi-host`. EATT, GATT caching/security levels, Mesh 1.1 and BluFi require their own production Host integrations."

[[sections]]
id = "bluetooth-capability-advertisement"
domain = "bluetooth"
title = "Capability advertisement"
source-document = "crates/hardware/esp32s31/driver/bluetooth/FEATURES.md"
overview = "The portable bootstrap `LE Read Local Supported Features` result sets bit 0 (LE Encryption),\nbit 3 (Peripheral-initiated Feature Exchange), bit 4 (LE Ping) and bit 14\n(Channel Selection Algorithm #2). Each optional bit requires the complete\nproduction Controller operation named by that feature; no LE Controller\ncomposition currently exists to serve them. A recovered register, SRAM layout,\nportable parser, DTM-only PHY or vendor capability cannot grant advertisement."

[[sections]]
id = "bluetooth-ownership"
domain = "bluetooth"
title = "Ownership"
source-document = "crates/hardware/esp32s31/driver/bluetooth/FEATURES.md"
overview = "| Owner | Authority |\n| --- | --- |\n| PAC | MMIO representation and restricted access |\n| HAL | Semantic accessors, register transactions and hardware ownership proofs |\n| [Memory crate](memory/) | Controller-SRAM layouts, private codecs and DMA-visible storage |\n| Engine | Clocks, Controller time, BLE PHY, interrupts, modem timer and scheduler primitives |\n| Portable HCI and LE LL | Host boundary, protocol policy and PDU codecs |\n\nNo LE Controller, executor runtime or integration currently composes these\nowners. `single_item_completion` is the engine's lower completion primitive;\nit does not compose a role."

[[sections]]
id = "bluetooth-peripheral-timing-limits"
domain = "bluetooth"
title = "Peripheral timing limits"
source-document = "crates/hardware/esp32s31/driver/bluetooth/FEATURES.md"
overview = "No LE Controller composition currently implements peripheral timing. A\ncomposition must supply a local clock accuracy bound for window widening;\nsoftware widening does not establish arbitrary missed-event anchor recovery or\naccumulated timing uncertainty. The\n[memory codec](memory/src/peripheral_connection_memory/codec.rs) stores\nlink-state event span and scheduler captured anchor in distinct objects;\nequal offsets within those objects do not make them the same field. A raw\ncaptured anchor is not a normalized packet-start timestamp. Hardware timing\nqualification must cover that interpretation independently of the ownership\nand layout types."

