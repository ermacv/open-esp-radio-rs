[package]
name = "oer-hil-observer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL observer's build identity: input projection, content store, receipts and their preparation"

[features]
# Cargo-running operations of the observer's producers: building the runner,
# resolving its graph and preparing its receipt.
producer = ["dep:oer-process", "dep:oer-toolchain", "dep:toml_edit"]

[dependencies]
oer-durable = { path = "../../tools/durable" }
oer-process = { path = "../../tools/process", optional = true }
oer-toolchain = { path = "../../tools/toolchain", optional = true }
serde_json = "1.0"
toml_edit = { version = "=0.25.13", optional = true, features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "execution"
hil = "observation"
