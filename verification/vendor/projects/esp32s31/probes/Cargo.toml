[workspace]
resolver = "3"
members = [
    "library",
    "elf",
    "register-library",
    "register-elf",
    "bluetooth-library",
    "bluetooth-elf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "bee3369c35dfc10048b1d524150d99869f8a4352", default-features = false, features = ["esp32s31", "unstable"] }
oer-esp32s31-wifi-embassy = { path = "../../../../../crates/runtime/embassy/esp32s31/ieee80211" }
oer-esp32s31-radio-platform-esp-hal = { path = "../../../../../crates/adapters/esp-hal/esp32s31/radio", features = ["esp32s31"] }
oer-memory = { path = "../../../../../crates/memory" }
oer-esp32s31-hal = { path = "../../../../../crates/hardware/esp32s31/hal", features = ["validation-probes"] }
oer-esp32s31-bluetooth = { path = "../../../../../crates/hardware/esp32s31/driver/bluetooth", features = ["validation-probes"] }
oer-esp32s31-coex = { path = "../../../../../crates/hardware/esp32s31/driver/coex" }
oer-esp32s31-pac = { path = "../../../../../crates/hardware/esp32s31/pac", features = ["validation-probes"] }
oer-esp32s31-phy = { path = "../../../../../crates/hardware/esp32s31/phy" }
oer-esp32s31-wifi-mac = { path = "../../../../../crates/hardware/esp32s31/driver/ieee80211/mac", features = ["validation-probes", "validation-raw-dma"] }
oer-esp32s31-wifi = { path = "../../../../../crates/hardware/esp32s31/driver/ieee80211" }
oer-esp32s31-wifi-dma = { path = "../../../../../crates/hardware/esp32s31/driver/ieee80211/dma" }
oer-wifi-softmac = { path = "../../../../../crates/protocols/ieee80211/softmac" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = true
panic = "abort"
strip = false

# Keep production probes on the same PAC revision as the repository workspace.
# This workspace is intentionally excluded from the root workspace, so Cargo
# does not inherit the root patch table automatically.
[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "507d14dbccfc26128b929b044d76f09cf2d1d2f6" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
