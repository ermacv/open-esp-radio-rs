schema = 5
id = "diagnostic-sta-rx42-tx40-current-ap-control"
description = "Same diagnostic image station control for the AP 42/40 duplex failure"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "station", "udp", "bidirectional", "ap-control"]

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 42000000, tx_bps = 40000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 1000000
minimum_tx_bps = 1000000
