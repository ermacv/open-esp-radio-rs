schema = 5
case-execution = "independent"
transaction-comparison = "observables-under-effect-contract"

# This bounded claim covers every ESP32-S31 PHY-I2C block accepted by the
# reviewed production address type. Two complementary ANA_CONF2 images prove
# both values of every preserved bit without claiming the vendor fallback for
# blocks outside the accredited 0x61..=0x6d domain.
[[profiles]]
name = "phy-i2c-host-map-accredited-domain"
claim = "reviewed-domain-equivalence"
precondition = "accredited-blocks-61-through-6d-and-two-complementary-ana-conf2-images"
vendor-source = "archive"
vendor-symbol = "phy_get_i2c_hostid_new"
rust-symbol = "open_phy_i2c_host_trace_phy_get_i2c_hostid_new"
compare-return = true

[[profiles.argument-ranges]]
index = 0
min = 0x61
max = 0x6d

[[profiles.mmio-domains]]
address = 0x2010f820
values = [0xa5a55a5a, 0x5a5aa5a5]

