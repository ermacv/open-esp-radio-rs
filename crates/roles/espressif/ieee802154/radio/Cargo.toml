[package]
name = "oer-espressif-ieee802154-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-free Espressif IEEE 802.15.4 radio role: the portable radio contract over the ported MAC engine"

[dependencies]
oer-espressif-ieee802154-engine = { path = "../../../../hardware/espressif/ieee802154/engine" }
oer-ieee802154 = { path = "../../../../protocols/ieee802154" }

[dev-dependencies]
oer-espressif-ieee802154-engine = { path = "../../../../hardware/espressif/ieee802154/engine", features = ["model"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "role"
platform = "family"
family = "espressif"
