[package]
name = "oer-esp32s31-phy-vendor-calibration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The vendor-versus-production ESP32-S31 PHY calibration comparison: register images, vendor console protocol, production projection and the reviewed relation; the HIL phy family captures it"

[dependencies]
oer-esp32s31-hil-calibration-artifact = { path = "../../../../hil/targets/esp32s31/calibration-artifact" }
oer-esp32s31-phy = { path = "../../../../crates/hardware/esp32s31/phy", features = ["validation-probes"] }
oer-esp32s31-phy-relation = { path = "../../phy-relation", features = ["projection"] }
oer-register-model = { path = "../../../../tools/registers/model" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
oer-process = { path = "../../../../tools/process" }
serde_json = "1.0"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "verification"
evidence = "verdict"
platform = "host"
host-layer = "verification"
