schema = 5
id = "udp-rx-ht40-core0-coarse-diagnostic"
description = "Production-like HT40 RX Core0 batch-cycle and instruction diagnostic"
transfer = "identical-image"
tags = ["diagnostic", "udp", "station", "rx", "ht40", "split-core", "core0", "coarse-cycles"]

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1472
offer = { rx_bps = 140000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 90000000
maximum_idle_channel_utilization_255 = 64
