schema = 3
id = "access-point-single-client-load-tx"
description = "Observer-free sustained single-client AP outbound performance baseline"
repetitions = 1
image = "performance"
isolation = "reset"
tags = ["characterization", "wifi", "access-point", "network", "single-client", "load", "tx"]

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180
client = "open-wrt"

[workload.traffic]
kind = "udp"
direction = "tx"
duration_seconds = 60
tx_rate_bps = 16000000
payload_bytes = 1400

[criteria]
exact_delivery = false
minimum_tx_bps = 15200000
minimum_concurrent_ap_clients = 1
