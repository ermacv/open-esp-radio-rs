oer-ieee80211-upper-mac-service = { path = "../upper-mac" }

[dev-dependencies]
oer-time-virtual = { path = "../../../adapters/virtual/time" }
oer-ieee80211-datapath = { path = "../../../protocols/ieee80211/datapath", features = ["model"] }
oer-network-interface = { path = "../../../network/interface" }
oer-ieee80211-lower-mac = { path = "../../../protocols/ieee80211/lower-mac", features = ["model"] }
oer-ieee80211-softmac = { path = "../../../protocols/ieee80211/softmac" }

