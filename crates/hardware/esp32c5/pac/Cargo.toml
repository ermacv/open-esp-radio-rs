[package]
name = "oer-esp32c5-pac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Closed typed ESP32-C5 radio peripheral access crate"

[features]
validation-probes = ["oer-esp32c5-pac-raw/validation-probes"]

[dependencies]
oer-esp32c5-pac-raw = { path = "raw", features = ["critical-section"] }

[dev-dependencies]
oer-esp32c5-pac-raw = { path = "raw", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imac-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "chip"
chip = "esp32c5"
