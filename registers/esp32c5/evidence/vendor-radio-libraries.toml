id = "C5_BLOB_LIBPHY_PHY_I2C_INIT1"
description = "ESP32-C5 libphy.a of espressif/esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, sha256 dbf33c418c8d408d4005c849d12a1432deea82e2e5e57de3c8ddf914d104fffb, member phy_i2c.o sha256 1ee0c045732cbeeeac156f350b8c2c0fd8138cabb169c549427e449104774dbb. phy_i2c_init1 builds six 44-byte stack arrays (host-0 blocks, registers and data; host-1 blocks, registers and data) from immediates and from phy_param bytes 0xF5 to 0xFC, the low bytes of halfwords 0x410 and 0x412, halfword 0x416 (bits 9:2 with bit 6 set, and bits 1:0 shifted to 5:4) and phy_get_data_sat(param[0xF7], 50, 10) and phy_get_data_sat(param[0xF8], 60, 10); phy_basic.o phy_get_data_sat(x, high, low) returns high when high < x, low when x < low and x otherwise. Between phy_i2c_enter_critical and phy_i2c_exit_critical it replaces 0x600AF820 bits 16:4 with 0x206, calls phy_i2c_paral_write_num over the 44 pairs with a zero flag, and replaces the field with 0x19C1 again. phy_i2c_paral_write writes block | register << 8 | data << 16 | 1 << 24 | flag << 26 to the host-0 word 0x600AF800 and then the host-1 word 0x600AF804 without waiting, then polls bit 25 of the host-0 word and then of the host-1 word until clear."

[[sources]]
id = "C5_BLOB_LIBPHY_RF_INIT_LEAVES"
description = "ESP32-C5 libphy.a of espressif/esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, sha256 dbf33c418c8d408d4005c849d12a1432deea82e2e5e57de3c8ddf914d104fffb. phy_reg.o (sha256 8c759a24f4b471220174b0920eec21ace8e27e3cac2654794a2f51b26b7968c9) phy_open_i2c_xpd ORs 0xF3000000 into PMU_RF_PWC 0x600B0158, ORs bit 28 into PMU_IMM_HP_CK_POWER 0x600B00CC, then, when RF_PWC bit 27 reads clear, sets bit 27, clears bit 26 and sets bit 26 by three fresh RMWs, and finally sets bit 26 when it reads clear. phy_i2c.o (sha256 1ee0c045732cbeeeac156f350b8c2c0fd8138cabb169c549427e449104774dbb) phy_i2c_clk_sel(n) replaces bits 10:6 with n and then bits 5:0 with (n == 0 ? 1 : 2n) mod 256 by two fresh RMWs of 0x600AF824, 0x600AF828 and 0x600AF82C in that order; phy_xtal_reg_set writes the masked fields (block 0x61, register 8, bit 4) = 0 and (0x61, 7, bit 5) = 1; phy_bias_reg_set writes (0x6A, 0, bits 3:0) = 0xF, (0x6A, 1, bits 7:4) = 7, (0x6A, 0, bits 7:4) = 9 and (0x6A, 1, bits 3:0) = 0xF; phy_dac_rate_set writes (0x66, 4, bit 4) = 0 and clears bit 3 and then bit 2 of 0x600A0448; phy_adc_rate_set(rate) writes (0x66, 4, bit 2) = (rate == 0) and replaces bit 1 and then bit 0 of 0x600A0448 with rate bit 0; phy_i2c_bbpll_set calls phy_dac_rate_set(0) and phy_adc_rate_set(0). phy_init.o (sha256 637090888aa0e2629878ddf09e3a81dbcad5fb1cae07be9011e71c24839c2dd9) phy_band_i2c_set writes 0x7F to register 1 of block 0x6A."

[[sources]]
id = "C5_BLOB_LIBPHY_RF_INIT_LEAVES_2"
description = "ESP32-C5 libphy.a of espressif/esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, sha256 dbf33c418c8d408d4005c849d12a1432deea82e2e5e57de3c8ddf914d104fffb. phy_init.o (sha256 637090888aa0e2629878ddf09e3a81dbcad5fb1cae07be9011e71c24839c2dd9) phy_open_fe_bb_clk writes 0x1E7 to 0x600A0400, ORs 3 into 0x600A0800 and writes 0xFFFFFFFF to 0x600A7C80. phy_reg.o (sha256 8c759a24f4b471220174b0920eec21ace8e27e3cac2654794a2f51b26b7968c9): phy_i2cmst_reg_init replaces 0x600AF818 bits 10:9 with 2 and then ORs bit 6; phy_iq_swap_set clears bit 25 of 0x600A0C08 when phy_param byte 0x2A is set and ORs bits 26:25 otherwise, then clears bits 23:22 of 0x600A0434; phy_fe_reg_init ORs bit 22 into 0x600A0894, clears bit 8 of 0x600A0444, replaces bits 31:24 of 0x600A0408 with 0xB4, ORs bit 2 into 0x600A040C, ORs bits 31:29 into 0x600A0438, ORs bits 14:13 into 0x600A0C0C, clears bits 15:8 and then 7:0 of 0x600A043C, sets bit 29 of 0x600A0888 when phy_param byte 0x2A is set and clears it otherwise, replaces bits 7:0 of 0x600A0C20 with 0x57 and bits 15:8 of 0x600A0870 with 0x96, and calls phy_pwdet_reg_init, phy_dac_scale_set(1) and phy_rxiq_scale_set; phy_dac_scale_set(x) replaces bits 23:16 and then 15:8 of 0x600A0C04 with 0xFF when x is nonzero and 0 otherwise; phy_rxiq_scale_set replaces bits 15:8 and then 7:0 of 0x600A043C with (0xFA, 0) when phy_param byte 0x28A is 1, (0, 0xFA) when it is 2 and (0, 0) otherwise. phy_pwdet.o (sha256 d628c238348346ffcf4f1a2c132118532514e017f847cf7ee4eee383de175911): phy_pwdet_reg_init writes 0x0F0F0FFF to 0x600A0810 and 0x00FF0F64 to 0x600A0814, replaces bits 11:4 of 0x600A0808 with 0x50, writes 0xAAAA to 0x600A0818, replaces bits 22:20 of 0x600A0808 with 2, ORs bit 29 into 0x6000E000 and replaces bits 31:29 of 0x600B1054 with 4; phy_pwdet_sar2_init ORs bits 13:12 into 0x600A080C, clears its bit 9, writes 0xAAAA to 0x600A0818, replaces bits 22:20 of 0x600A0808 with 6 and bits 31:29 of 0x600B1054 with 4 when phy_param byte 0x2A is set and 2 otherwise."

