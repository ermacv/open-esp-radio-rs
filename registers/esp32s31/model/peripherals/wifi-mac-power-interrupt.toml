bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TSF_TIMER_0"
description = "Enable the guarded TSF timer-zero event."
bitOffset = 7
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "UNKNOWN_8_31"
description = "Enable bits whose event identities remain unknown."
bitOffset = 8
bitWidth = 24

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFF

