# All omitted generated observations remain part of the computed unreviewed backlog.

# Reviewed scheduler route. The generic IR proves the constant signal post and
# the reviewed OSI catalog identifies the pp-task receiver. This route names
# the task entry only; the signal-specific branch inside ppTask remains a
# separate path-analysis obligation.
[[event-routes]]
id = "rx-success-to-pp-task"
profile = "wifi-sta-lifecycle"
source = "wifi-sta-lifecycle"
dispatcher = "wifi-sta-lifecycle::lmacProcessRxSucData@0x10069416"
mechanism = "internal-signal"
selector-role = "selector"
selector-value = 0x19
receiver = "esp32s31::pp-task"
execution-context = "unspecified"
consumer-profile = "wifi-sta-lifecycle"
consumer-source = "wifi-sta-lifecycle"
consumer-entry = "wifi-sta-lifecycle::ppTask@0x10067fa0"
delivery-operation = "rtos.queue.receive"
delivery-output-role = "item-out"
delivery-selector-offset = 0
delivery-selector-width = 32
delivery-encoding = "little-endian"
case-handler-profile = "wifi-sta-lifecycle"
case-handler-source = "wifi-sta-lifecycle"
case-handler-function = "wifi-sta-lifecycle::wdevProcessRxSucDataAll@0x10062e74"
terminal-profile = "wifi-sta-lifecycle"
terminal-source = "wifi-sta-lifecycle"
terminal-function = "wifi-sta-lifecycle::wDev_AppendRxBlocks@0x10063c80"
replay-evidence = "../generated/findings/replays/pp-signal-25.json"
replay-manifest = "../replays/pp-signal-25.toml"
replay-source = "libpp-replay"
replay-producer-phase = "post-signal-25"
replay-consumer-phase = "dispatch-signal-25"
replay-state-observation = "signal-25-count"
replay-state-model = "counted-latch"
rationale = "Signal 0x19 is posted by lmacProcessRxSucData, received by ppTask into its stack event word, and the reviewed ppTask dispatch table maps selector 0x19 to wdevProcessRxSucDataAll."

# RX completion first crosses the interrupt-to-task boundary through signal
# 0x11. The later 0x19 route above is a distinct stage after lmac processing;
# keeping both edges avoids flattening two ownership transitions into one
# invented direct call.
[[event-routes]]
id = "rx-done-to-pp-task"
profile = "wifi-sta-lifecycle"
source = "wifi-sta-lifecycle"
dispatcher = "wifi-sta-lifecycle::lmacRxDone@0x1004d9ba"
mechanism = "internal-signal"
selector-role = "selector"
