schema = 5
id = "diagnostic-ap-single-client-udp-tx-correctness-control"
description = "Correctness-image control for saturated single-client AP UDP TX"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "single-client", "udp", "tx", "saturation", "control"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 15
payload_bytes = 1400
offer = { tx_bps = 130000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
