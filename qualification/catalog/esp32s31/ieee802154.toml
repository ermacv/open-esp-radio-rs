status = "implemented"
level = "lower-primitive"

[source-facts.source-contract]
id = "ieee802154-registered-timing-entry"
composition = "production"
scope = "The IEEE 802.15.4 arbiter client enters common power and its planner-held module clocks, joins the registered shared PHY domain and the BTBB baseband with the registration's gain byte, applies the transmit-on delay, and hands the MAC foundation to the operational owners, which return through a foundation readback"
limits = "This lower entry is not a public RF-ready service; tracking scheduling, RF retune and the IRQ/DMA operational lifetime remain incomplete as stated in the PHY consumer matrix"
source-paths = [
  "crates/hardware/esp32s31/hal/src/ieee802154/role.rs",
  "crates/hardware/esp32s31/phy/src/ieee802154_client.rs",
]

[[source-facts]]
id = "ieee802154-mac-operation-subset"
status = "implemented"
level = "lower-primitive"

[source-facts.source-contract]
id = "ieee802154-mac-operation-subset"
composition = "production"
scope = "The MAC engine ported from the public ESP-IDF driver owns RX with hardware and enhanced ACK, direct and CCA-gated TX with ACK reception, ED/CCA, timed TX/RX, the receive ring and the pending decision; the runtime serializes it with the MAC owners and queues its notifications"
limits = "Host differential comparison with the compiled vendor driver covers the software sequence only; the arbiter-client composition is qualified on hardware only by HIL runs, and CSMA/CA, peer exchange and calibrated RF behavior are not implied"
source-paths = [
  "crates/hardware/ieee802154/engine/src/engine.rs",
  "crates/runtime/esp32s31/ieee802154/src/lib.rs",
  "crates/composition/esp32s31/embassy/ieee802154/src/system.rs",
]

