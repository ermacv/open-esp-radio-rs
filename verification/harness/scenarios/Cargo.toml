[package]
name = "oer-vendor-scenario-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Chip-neutral engine of the typed vendor-comparison scenarios: Blobray sessions, comparison harness, coverage, observation, state and evidence shards"

[dependencies]
oer-elf = { path = "../../../tools/elf" }
oer-process = { path = "../../../tools/process" }
oer-vendor-evidence = { path = "../../../verification/evidence" }
oer-vendor-evidence-shard = { path = "../../../hil/evidence-shard" }
oer-register-contracts = { path = "../../../tools/registers/contracts" }
oer-durable = { path = "../../../tools/durable" }
oer-repo = { path = "../../../tools/repo" }
oer-vendor-pins = { path = "../../../tools/vendor-pins" }
oer-riscv-model = { path = "../../../tools/riscv/model" }
oer-riscv-lift = { path = "../../../tools/riscv/lift" }
blobray-application = { path = "../../../tools/blobray/crates/application" }
blobray-backend-riscv = { path = "../../../tools/blobray/crates/riscv" }
blobray-domain = { path = "../../../tools/blobray/crates/domain" }
blobray-linker = { path = "../../../tools/blobray/crates/linker" }
blobray-verification = { path = "../../../tools/blobray/crates/verification" }
oer-probe-codegen = { path = "../codegen" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
toml = "=1.1.4"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "verification"
evidence = "verdict"
platform = "host"
host-layer = "verification"
host-app = "verification"
host-boundary = "application"
