[package]
name = "oer-esp32s31-wifi-ap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 Wi-Fi access-point composition"

[dependencies]
oer-memory = { path = "../../../../../memory" }
oer-esp32s31-hal = { path = "../../../hal" }
oer-esp32s31-phy = { path = "../../../phy" }
oer-esp32s31-wifi = { path = ".." }
oer-esp32s31-wifi-mac = { path = "../mac" }
oer-ieee80211 = { path = "../../../../../protocols/ieee80211/mac" }
oer-wifi-ap = { path = "../../../../../protocols/ieee80211/ap" }
oer-wifi-softmac = { path = "../../../../../protocols/ieee80211/softmac" }
oer-wpa2 = { path = "../../../../../protocols/ieee80211/security/wpa2" }

[features]
default = []
# Value-only AP protocol/MAC observations. Ordinary builds retain no
# diagnostic counters in the live AP owner graph.
diagnostics = []

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "chip"
chip = "esp32s31"
