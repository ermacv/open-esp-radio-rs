status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [HCI bootstrap](../../../../protocols/bluetooth/hci/src/controller/bootstrap/state.rs) reports the configured address and bounded buffer information; buffer reporting does not establish ACL support. The controller core and HCI command service that answered with it were removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-le-set-random-address"
section = "bluetooth-hci-host-boundary"
title = "LE Set Random Address"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [HCI bootstrap](../../../../protocols/bluetooth/hci/src/controller/bootstrap/state.rs) stores the address for advertising sets whose own-address type is random. It does not establish privacy. The controller core and HCI command service that served the command were removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-le-read-local-supported-features-command"
section = "bluetooth-hci-host-boundary"
title = "LE Read Local Supported Features command"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "[Bootstrap](../../../../protocols/bluetooth/hci/src/controller/bootstrap/state.rs) returns bit 0 for LE Encryption, bit 3 for Peripheral-initiated Feature Exchange, bit 4 for the LE Ping responder, bit 5 for LE Data Packet Length Extension and bit 14 for Channel Selection Algorithm #2. Every other optional feature bit remains clear. The controller core and HCI command service that served the command were removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-optional-le-capability-advertisement"
section = "bluetooth-hci-host-boundary"
title = "Optional LE capability advertisement"
status = "fail-closed"
level = "lower-primitive"
scope-and-limitations = "The HCI bootstrap state keeps unsupported optional LE feature bits clear until the corresponding production path is complete. DTM-only PHY support does not change this advertisement. The HCI command service that answered with it went in #770 (tag `legacy-radio-2026-10-16`); #773 brings it back."

[[items]]
