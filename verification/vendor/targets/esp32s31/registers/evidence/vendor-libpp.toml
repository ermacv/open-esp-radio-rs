id = "BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_ampdu.o hal_agreement_add_rx_ba size 0x12e, hal_agreement_clr_rx_ba size 0xbe, hal_agreement_del_rx_ba size 0x72, hal_ba_session_store size 0x4e, hal_ba_session_restore size 0x66 and hal_ba_session_restore_by_hw_index size 0x6c. These leaves prove eight reverse-addressed ordinary banks at 0x20104178..0x20104294 with stride 0x24, live-state/load-word pairs, and update bits zero through seven. Complete extra-SoftAP leaves independently prove the shared staging window at 0x20104ea4..0x20104eb8 plus commit/readback bits eight and nine."

