# Reviewed exceptions of `cargo xtask check tidy`. Every entry states why the
# check cannot see what it excuses; an entry that no longer applies fails the
# check.

# Rust files rustc compiles directly by path, outside every crate root.

[[uncompiled]]
path = "tools/firmware/tests/fixtures/image_tool.rs"
reason = "the image tests compile this stand-in image tool with rustc"

[[uncompiled]]
path = "tools/process/tests/fixtures/process_tree.rs"
reason = "the process tests compile this child-process tree with rustc"

[[uncompiled]]
path = "tools/xtask/tests/fixtures/malformed_cargo.rs"
reason = "the network check tests compile this failing cargo stand-in with rustc"

