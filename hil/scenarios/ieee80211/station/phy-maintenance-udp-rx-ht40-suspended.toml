schema = 5
id = "phy-maintenance-udp-rx-ht40-suspended"
description = "HT40 UDP host-to-station throughput with the shared PHY's periodic tracking suspended for the session: one arm of the PHY maintenance experiment on one firmware"
role = "investigation"
repetitions = 3
tags = ["diagnostic", "udp", "station", "rx", "ht40", "split-core", "phy-maintenance", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 115000000 }
suspend_phy_tracking = true
