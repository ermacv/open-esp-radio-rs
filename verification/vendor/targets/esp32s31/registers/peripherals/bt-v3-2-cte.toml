[peripherals.registers.register]
name = "LC_8M_CONTROL"
description = "Bluetooth CTE LC 8-Mbit enable control."
addressOffset = 0x94
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "LC_8M_ENABLE"
description = "The matched getter/setter pair reads and replaces bit 0."
bitOffset = 0
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "CONTROL"
description = "CTE antenna selection, receive-delay, IQ-selection and enable control. Bit 0 remains unassigned."
