[package]
name = "oer-riscv-stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Worst-case stack bounds of a static RV32 image from its machine code"

[dependencies]
addr2line = { version = "=0.27.1", default-features = false, features = ["rustc-demangle"] }
# addr2line's `gimli`, with the reference-counted reader `Dwarf` owns.
gimli = { version = "=0.34.0", default-features = false, features = ["endian-reader", "std"] }
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std"] }
oer-riscv-analysis = { path = "../analysis" }
oer-riscv-decode = { path = "../decode" }
oer-riscv-lift = { path = "../lift" }
oer-riscv-model = { path = "../model" }
oer-riscv-program = { path = "../program" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
inputs = ["platform/esp32s31/linker/rom/functions.toml"]
