[package]
name = "oer-espressif-interrupt-table-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The image's interrupt table on an Espressif chip's interrupt matrix, through esp-hal"

[features]
default = []
# The chip of esp-hal; an image selects exactly one.
esp32s31 = ["dep:esp-hal", "esp-hal/esp32s31"]
esp32c5 = ["dep:esp-hal", "esp-hal/esp32c5"]

[dependencies]
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "e7739ccfb4288ac9547d3fa9adeb69221709268d", default-features = false, features = ["static-interrupts", "unstable"], optional = true }
oer-interrupt-table = { path = "../../../../runtime/interrupt-table" }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
features = ["esp32s31"]
targets = []

[package.metadata.open-radio]
layer = "adapter"
platform = "family"
family = "espressif"
# An image selects exactly one chip of esp-hal; each profile builds for its
# chip's target only.
supported-feature-profiles = ["esp32s31", "esp32c5"]
