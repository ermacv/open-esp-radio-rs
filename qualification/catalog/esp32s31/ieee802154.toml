[[sections]]
id = "ieee802154-overview"
domain = "ieee802154"
title = "ESP32-S31 IEEE 802.15.4 source capabilities"
source-document = "crates/hardware/esp32s31/driver/ieee802154/FEATURES.md"
overview = "See the [whole-radio capability map](../FEATURES.md) for shared ownership,\nclock/power lifecycle and cross-protocol composition limits.\n\nThis inventory describes silicon features, source-owned operations and their\ncomposition limits. It does not claim a complete IEEE 802.15.4-2015 stack,\ncalibrated RF operation or on-air qualification.\n\n| Status | Meaning |\n| --- | --- |\n| IMPLEMENTED | A bounded source path owns the complete operation in the exact scope named by the row, including static policy or a polled MAC primitive. This is not an RF qualification result. |\n| PARTIAL | A source subset exists, but the named feature lacks a complete operational composition. |\n| FAIL-CLOSED | A typed boundary deliberately prevents the stated activation/publication. Known registers alone do not establish this status. |\n| ABSENT | No production protocol/runtime owner exists for the operation. |\n| HOST-ONLY | An upper-stack function, not a radio/MAC implementation claim. This label does not claim that a stack integration exists. |\n\nNo qualification program selects these capabilities: the program went with\nthe orchestration in #770 (tag `legacy-radio-2026-10-16`). Readiness and\nhardware-evidence requirements stay independent of this inventory; complete\nstatic MAC policy or raw ED/CCA does not supply RF/channel readiness or an\nasynchronous dataplane."
documents = ["crates/hardware/esp32s31/driver/FEATURES.md"]

[[sections]]
id = "ieee802154-capability-sources-and-publication-scope"
domain = "ieee802154"
title = "Capability sources and publication scope"
source-document = "crates/hardware/esp32s31/driver/ieee802154/FEATURES.md"
overview = "The [ESP32-S31 datasheet v0.5, section 4.3.5](https://www.espressif.com/sites/default/files/documentation/esp32-s31_datasheet_en.pdf)\ndefines the hardware inventory. The [ESP-IDF IEEE 802.15.4 API](https://github.com/espressif/esp-idf/blob/master/components/ieee802154/include/esp_ieee802154.h)\nalso describes vendor operations such as timed RX/TX, source matching and\nsecurity; a vendor API is not evidence of an open S31 implementation.\n\n[Portable `RadioCapabilities`](../../../../protocols/ieee802154/src/radio/capabilities.rs)\nis a vocabulary. The engine's [capabilities table](../../../espressif/ieee802154/engine/src/capabilities.rs)\n(`RADIO_CAPABILITIES`) declares what the engine itself implements, such as\n`SECURITY_OFFLOAD` and `SOURCE_MATCH`. It omits `CSMA_CA` and `TRANSMIT_RETRIES`:\nthe engine transmits each frame once, and the backoffs and retries the former\nradio role ran (tag `legacy-radio-2026-10-16`) belong above the port (#563\ndecision 8). A declared\ncapability is source coverage, not RF qualification.\n\nThe [MAC engine](../../../espressif/ieee802154/engine/src/engine.rs) ported from\nthe public ESP-IDF driver starts the operations. The radio role and runtime that\nadmitted portable commands into it, and the port driver that ran CSMA/CA backoffs\nand retry delays, were removed in #770 (tag `legacy-radio-2026-10-16`): nothing\ndrives the engine on hardware now."
packages = ["oer-ieee802154", "oer-espressif-ieee802154-engine"]

