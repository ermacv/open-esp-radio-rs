[[sections]]
id = "bluetooth-capability-advertisement"
domain = "bluetooth"
title = "Capability advertisement"
source-document = "crates/hardware/esp32s31/driver/bluetooth/FEATURES.md"
overview = "`LE Read Local Supported Features` sets bit 0 (LE Encryption), bit 3\n(Peripheral-initiated Feature Exchange), bit 4 (LE Ping), bit 5 (LE Data\nPacket Length Extension) and bit 14 (Channel Selection Algorithm #2), each\nserved by the production peripheral connection. Each optional bit requires the\ncomplete production Controller operation named by that feature. A recovered\nregister, SRAM layout, portable parser, DTM-only PHY or vendor capability\ncannot grant advertisement."

[[sections]]
id = "bluetooth-ownership"
domain = "bluetooth"
title = "Ownership"
source-document = "crates/hardware/esp32s31/driver/bluetooth/FEATURES.md"
overview = "| Owner | Authority |\n| --- | --- |\n| PAC | MMIO representation and restricted access |\n| HAL | Semantic accessors, register transactions and hardware ownership proofs |\n| [Memory crate](memory/) | Controller-SRAM layouts, private codecs and DMA-visible storage |\n| Engine | Clocks, Controller time, BLE PHY, interrupts, modem timer and scheduler primitives |\n| [Radio role](../../../../roles/esp32s31/bluetooth/radio/src/radio.rs) | The portable radio event contract over the hardware scheduler |\n| [Radio runtime](../../../../runtime/esp32s31/bluetooth/src/lib.rs) | Executor-independent scheduler driving, interrupts and outcomes |\n| [Composition](../../../../composition/esp32s31/embassy/bluetooth/src/lib.rs) | Controller epochs on the shared radio and the HCI service |\n| Portable HCI, LE LL and [Controller core](../../../../protocols/bluetooth/le/controller/src/lib.rs) | Host boundary, protocol policy, PDU codecs and role planning |\n\nThe Controller core plans every event through one arbiter so that no two\nreservations overlap; the radio role owns only the chip's event geometry."

[[sections]]
id = "bluetooth-peripheral-timing-limits"
domain = "bluetooth"
title = "Peripheral timing limits"
source-document = "crates/hardware/esp32s31/driver/bluetooth/FEATURES.md"
overview = "The Controller core plans every connection event from the last received\nanchor with window widening over the peer's and the backend's sleep-clock\naccuracy; the backend supplies its local bound, jitter and guards. The radio\nrole reserves the vendor's minimum event duration and lets the hardware\ncontinue the event within the connection interval. The\n[memory codec](memory/src/peripheral_connection.rs) stores\nlink-state event span and scheduler captured anchor in distinct objects;\nequal offsets within those objects do not make them the same field. A raw\ncaptured anchor is not a normalized packet-start timestamp. Hardware timing\nqualification must cover that interpretation independently of the ownership\nand layout types."

