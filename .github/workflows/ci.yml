name: CI

# Standard Cargo checks for every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format every workspace
        run: |
          # Each manifest is an independent Cargo workspace.
          for manifest in \
            Cargo.toml \
            tools/blobray/Cargo.toml \
            crates/composition/esp32s31/embassy/ieee80211/Cargo.toml \
            platform/esp32s31/Cargo.toml \
            hil/targets/esp32s31/Cargo.toml \
            examples/*/Cargo.toml \
            verification/vendor/projects/esp32s31/probes/Cargo.toml
          do
            echo "::group::$manifest"
            cargo fmt --all --manifest-path "$manifest" -- --check
            echo "::endgroup::"
          done

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      # Report every failing test binary in one run instead of the first.
      - run: cargo test --workspace --locked --no-fail-fast
      # The GATT application's `secure` module is off by default; test it too.
      - run: cargo test --locked --no-fail-fast -p oer-example-bluetooth-gatt --all-features
      # The HIL target core compiles its network modules against exactly one
      # stack, so each configuration is a separate test run.
      - name: HIL target core configurations
        run: |
          for features in secure-gatt upstream-network embassy-network owned-network; do
            cargo test --locked --no-fail-fast -p oer-hil-target-core --features "$features"
          done

  # Repository policy gates: locked metadata and network dependency boundaries.
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: policy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: policy-${{ runner.os }}-
      - name: Fetch every workspace
        run: for manifest in $(git ls-files '*Cargo.lock' | sed 's/Cargo.lock$/Cargo.toml/'); do cargo fetch --locked --manifest-path "$manifest"; done
      - run: cargo xtask check metadata
      - run: cargo xtask check network

  # Clippy for every production feature profile on the chip target, plus the
  # layer, facade, unsafe-code and PAC-access boundaries.
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/composition/esp32s31/embassy/ieee80211/target
          key: architecture-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: architecture-${{ runner.os }}-
      - name: Fetch every workspace
        run: for manifest in $(git ls-files '*Cargo.lock' | sed 's/Cargo.lock$/Cargo.toml/'); do cargo fetch --locked --manifest-path "$manifest"; done
      - run: cargo xtask check architecture
      # A compile_fail doctest proves that publishing borrowed DMA memory
      # needs `unsafe`; the API exists only on the chip target.
      - run: cargo test --doc --locked -p oer-esp32s31-soc-esp-hal --features axi-gdma-mem2mem --target riscv32imafc-unknown-none-elf

  # Network profiles that no other job compiles: the HIL runtime with each
  # network stack, and the Wi-Fi composition with a single network feature.
  network-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET: riscv32imafc-unknown-none-elf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hil/targets/esp32s31/target
            crates/composition/esp32s31/embassy/ieee80211/target
          key: network-profiles-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: network-profiles-${{ runner.os }}-
      - name: HIL runtime
        run: |
          for network in embassy-network owned-network upstream-network; do
            echo "::group::$network"
            cargo check --locked --manifest-path hil/targets/esp32s31/runtime/Cargo.toml --target "$TARGET" \
              --no-default-features --features "open-radio-hil,$network,code-psram,profile-psram-data,psram-task-stack"
            echo "::endgroup::"
          done
      - name: Wi-Fi composition
        run: |
          for network in upstream-network embassy-network; do
            echo "::group::$network"
            cargo check --locked --manifest-path crates/composition/esp32s31/embassy/ieee80211/Cargo.toml --target "$TARGET" \
              --no-default-features --features "$network"
            echo "::endgroup::"
          done

  # Each example is its own workspace; run Cargo from its directory so its
  # `.cargo/config.toml` selects the chip target. Every feature profile an
  # example supports is checked, and host tests cover application libraries.
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: esp32s31/access-point
            profiles: default owned-network embassy-network
            host-tests: true
          - example: esp32s31/bluetooth-controller
            profiles: default advertising-smoke trouble-gatt trouble-secure-gatt gatt-application secure-gatt-application
            host-tests: true
          - example: esp32s31/monitor
            profiles: default
          - example: esp32s31/station
            profiles: default embassy-network owned-network
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/${{ matrix.example }}/target
          key: ${{ matrix.example }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', format('examples/{0}/Cargo.lock', matrix.example)) }}
          restore-keys: ${{ matrix.example }}-${{ runner.os }}-
      - name: Check feature profiles
        env:
          PROFILES: ${{ matrix.profiles }}
        run: |
          for profile in $PROFILES; do
            echo "::group::$profile"
            if [ "$profile" = default ]; then
              cargo check --release --locked
            else
              cargo check --release --locked --no-default-features --features "$profile"
            fi
            echo "::endgroup::"
          done
      - name: Host tests
        if: matrix.host-tests
        run: cargo test --lib --locked --target x86_64-unknown-linux-gnu

  # Register models, generated SVD/PAC outputs and the compiled PHY library.
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publication-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: publication-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: cargo registers validate --manifest registers/esp32s31/publication/registers.toml
      - run: cargo registers generate --manifest registers/esp32s31/publication/registers.toml --check
      - run: cargo xtask check phy

  # Both final HIL application images, their placement/stack audits and the
  # Blobray target audit. Needs espflash and the toolchain's LLVM tools.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ESPFLASH_VERSION: 4.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/espflash
            target
            tools/blobray/target
          key: images-${{ runner.os }}-${{ env.ESPFLASH_VERSION }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: images-${{ runner.os }}-${{ env.ESPFLASH_VERSION }}-
      - name: Install espflash
        run: |
          command -v espflash >/dev/null && espflash --version | grep -q "$ESPFLASH_VERSION" || {
            sudo apt-get update && sudo apt-get install -y libudev-dev
            cargo install --locked espflash --version "$ESPFLASH_VERSION"
          }
      - name: Put the toolchain's LLVM tools on PATH
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
      - name: Fetch every workspace
        run: for manifest in $(git ls-files '*Cargo.lock' | sed 's/Cargo.lock$/Cargo.toml/'); do cargo fetch --locked --manifest-path "$manifest"; done
      - run: cargo xtask check images
