[[items]]
id = "phy-lifecycle-boundaries-client-acquire-release-bookkeeping"
section = "phy-lifecycle-boundaries"
title = "Client acquire/release bookkeeping"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "Client state rejects duplicate acquisition/invalid release and retains pending tracking. Releasing a non-final client returns the ordinary registered owner; `release_client` reports whether the released client was the last; `close_concurrent_rf` rejects a domain that still has a client, so only the empty domain can close RF, and the radio stays powered until it does."

[[items]]
id = "phy-lifecycle-boundaries-target-bound-registration-client-proof"
section = "phy-lifecycle-boundaries"
title = "Target-bound registration/client proof"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "Registered wrappers couple state/proof to the hardware epoch; target runners produce the completion authority. A model-only result is insufficient."

[[items]]
id = "phy-lifecycle-boundaries-cold-rf-activation"
section = "phy-lifecycle-boundaries"
title = "Cold RF activation"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "Registration and the Wi-Fi cold-power path compose initialization; protocol-wide reusable wake semantics are not supplied by that cold path."

[[items]]
id = "phy-lifecycle-boundaries-rf-wake-from-retained-sleep"
section = "phy-lifecycle-boundaries"
title = "RF wake from retained sleep"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "`wake_concurrent_rf` executes the finite current-vendor wake parent against retained semantic calibration state when a client joins a closed domain, and admits the client only after terminal restoration. The Wi-Fi owner actor composes an immediate idle cycle through client reacquisition and RX restoration; the HIL scenario verifies repeated data-path recovery and registration-generation retention. Hardware evidence is still required for qualification."

[[items]]
id = "phy-lifecycle-boundaries-rf-sleep-power-down"
section = "phy-lifecycle-boundaries"
title = "RF sleep/power-down"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The last-client owner performs a default-profile pre-close temperature sample and exact finite current-vendor RF close. The production Wi-Fi supervisor can either wake immediately while retaining the registration epoch or continue through captured route-owned clock/reset restoration for a cold restart. Scheduled modem sleep and protocol power-save composition remain absent."

[[items]]
id = "phy-lifecycle-boundaries-stop-tracking-release-last-client"
section = "phy-lifecycle-boundaries"
title = "Stop tracking / release last client"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "Model release disarms tracking state and produces a distinct powered-idle hardware owner on the last client. Non-final release cannot enter RF close. Runtime timer cancellation remains a composition responsibility before stopped-owner reunion."

[[items]]
id = "phy-lifecycle-boundaries-rf-and-analog-shutdown"
section = "phy-lifecycle-boundaries"
title = "RF and analog shutdown"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "`close_concurrent_rf` closes RF after the last client leaves: it poisons failures after physical close begins and powers down the temperature sensor; leaving common power then restores the captured clock baseline. This is source coverage rather than broad silicon qualification."

[[items]]
id = "phy-lifecycle-boundaries-re-registration-after-owned-shutdown"
section = "phy-lifecycle-boundaries"
title = "Re-registration after owned shutdown"
status = "absent"
level = "lower-primitive"
scope-and-limitations = "The radio system registers the shared PHY domain once per boot, optionally from a calibration cache supplied before the first registration; no cold release re-registers it from a final-state cache. A restart that keeps the registration closes and wakes RF instead (RF sleep/power-down and RF wake from retained sleep)."

[[items]]
id = "phy-lifecycle-boundaries-tracking-failure-containment"
section = "phy-lifecycle-boundaries"
title = "Tracking failure containment"
status = "fail-closed"
level = "lower-primitive"
scope-and-limitations = "Failed target tracking consumes the unique request into a poisoned epoch. Target futures must reach a terminal result; cancellation requires out-of-band hardware reset rather than reuse of partial state."

