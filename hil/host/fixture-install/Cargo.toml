[package]
name = "open-esp-radio-hil-fixture-install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Privileged Linux fixture installer and fixed launchers for open ESP radio HIL"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs", "process"] }
oer-process = { path = "../../../tools/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "host"
