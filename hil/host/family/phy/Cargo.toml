[package]
name = "oer-hil-family-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "PHY HIL workloads: the vendor-versus-production calibration cross-check on the board under test"
readme = "README.md"

[dependencies]
oer-durable = { path = "../../../../tools/durable" }
oer-esp32s31-phy-vendor-calibration = { path = "../../../../verification/esp32s31/hardware/calibration" }
oer-hil-board = { path = "../../board" }
oer-hil-image-class = { path = "../../image-class" }
oer-hil-lab = { path = "../../lab" }
oer-hil-link = { path = "../../link" }
oer-hil-protocol = { path = "../../../protocol", features = ["registry"] }
oer-hil-scenario = { path = "../../scenario" }
oer-hil-workload = { path = "../../workload" }
oer-image = { path = "../../../../tools/image" }
oer-process = { path = "../../../../tools/process" }
serde = { version = "1.0", features = ["derive"] }
serialport = { version = "4.8.1", default-features = false }

[dev-dependencies]
serde_json = "1.0"
toml = "1.1"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "execution"
hil = "orchestration"
