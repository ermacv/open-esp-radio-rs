schema = 4
id = "diagnostic-station-phy-tracking"
description = "Due PHY tracking within a preserved station epoch during UDP delivery"
repetitions = 1
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[link]
phy = "ht40"

[workload]
kind = "udp"
direction = "tx"
