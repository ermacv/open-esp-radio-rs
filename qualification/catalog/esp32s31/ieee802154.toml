[[items]]
id = "ieee802154-cca-and-channel-access-cca-before-tx"
section = "ieee802154-cca-and-channel-access"
title = "CCA-before-TX"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine issues the CCA-then-TX command and reports CCA busy or failure. The engine takes the CCA energy threshold and mode; the removed OpenThread adapter applied OpenThread's threshold as the port does (#770, tag `legacy-radio-2026-10-16`). The former HIL cell `ieee802154-channel-energy` ran assessed transmissions on a channel the peer kept busy and on a clear one (tag `legacy-wifi-2026-10-16`). #771 brings the shared radio system back, and #774 the OpenThread integration."

[[items]]
id = "ieee802154-cca-and-channel-access-csma-ca"
section = "ieee802154-cca-and-channel-access"
title = "CSMA/CA"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "Unslotted CSMA/CA as ESP-IDF's OpenThread SubMac runs it over the one-CCA radio: the [portable backoff](../../../../protocols/ieee802154/src/mac/csma.rs), and the engine's CCA attempts; the radio role that received on the transmit channel during backoffs and the runtime runner that held the backoff timers were removed (#770, tag `legacy-radio-2026-10-16`), and #563 decision 8 moves CSMA and retries above the port. Frames are [retransmitted](../../../../protocols/ieee802154/src/mac/retransmission.rs) as SubMac retries them with ESP-IDF's OpenThread defaults, a random growing delay before each retry after a missing acknowledgement, each attempt arming its transmit security again. The former HIL cell `ieee802154-peer-exchange` transmitted by CSMA/CA with retries to the vendor peer, including a frame that ended unacknowledged after its retries (tag `legacy-wifi-2026-10-16`). Slotted CSMA/CA and re-securing retransmitted frames that carry header IEs are absent. #771 brings the shared radio system back."

[[items]]
id = "ieee802154-cca-and-channel-access-active-scan"
section = "ieee802154-cca-and-channel-access"
title = "Active Scan"
status = "host-only"
level = "composed-product"
scope-and-limitations = "The upper MAC owns the beacon-request and beacon-collection procedure, as with ESP-IDF, whose IEEE 802.15.4 driver has no scan: OpenThread's Mac runs it over the radio's transmit, receive and channel switching, and the openthread fork that the removed OpenThread adapter used (#770, tag `legacy-radio-2026-10-16`; #774 brings the integration back) exposes it as `OpenThread::scan` (`otLinkActiveScan`). The radio itself only serves energy scans. Active scan is not exercised by a host test or on air."

[[items]]
id = "ieee802154-rx-tx-dataplane-and-acknowledgments-rx"
section = "ieee802154-rx-tx-dataplane-and-acknowledgments"
title = "RX"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The [engine](../../../espressif/ieee802154/engine/src/engine.rs) owns the twenty-buffer receive ring with its stub buffer and receive-when-idle rearm; the runtime that handed frames to the consumer was removed (#770, tag `legacy-radio-2026-10-16`). The former HIL cell `ieee802154-peer-exchange` received the vendor peer's frames intact on air (tag `legacy-wifi-2026-10-16`). #771 brings the shared radio system back."
packages = ["oer-espressif-ieee802154-engine"]

[[items]]
id = "ieee802154-rx-tx-dataplane-and-acknowledgments-direct-tx"
section = "ieee802154-rx-tx-dataplane-and-acknowledgments"
title = "Direct TX"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine copies the frame into its DMA buffer and starts the transmission and reports completion and failures; the runtime queue of the composed client that received them was removed (#770, tag `legacy-radio-2026-10-16`). The former HIL cell `ieee802154-peer-exchange` delivered the device's frames to the vendor peer intact (tag `legacy-wifi-2026-10-16`). #771 brings the shared radio system back."
packages = ["oer-espressif-ieee802154-engine"]

[[items]]
id = "ieee802154-rx-tx-dataplane-and-acknowledgments-hardware-fcs-generation-check"
section = "ieee802154-rx-tx-dataplane-and-acknowledgments"
title = "Hardware FCS generation/check"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "TX reserves FCS for hardware; the RX format replaces its two bytes with RSSI/LQI. Parsing that layout alone does not qualify on-air FCS behavior. No composition runs it since #770 (tag `legacy-radio-2026-10-16`); #771 brings the shared radio system back."

[[items]]
id = "ieee802154-rx-tx-dataplane-and-acknowledgments-tx-ack-request-and-ack-reception"
section = "ieee802154-rx-tx-dataplane-and-acknowledgments"
title = "TX ACK request and ACK reception"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine enters RX_ACK, runs the 200 ms ACK timer and reports the ACK frame or its absence. The former HIL cell `ieee802154-peer-exchange` received the vendor peer's ACK of each device frame with its sequence number, and its absence for an unacknowledged address (tag `legacy-wifi-2026-10-16`). No composition runs it since #770 (tag `legacy-radio-2026-10-16`); #771 brings the shared radio system back."

[[items]]
id = "ieee802154-rx-tx-dataplane-and-acknowledgments-ack-timeout-configuration"
section = "ieee802154-rx-tx-dataplane-and-acknowledgments"
title = "ACK timeout configuration"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "Static policy and the engine's public setter convert microseconds to 16-microsecond hardware units. This does not establish a working ACK exchange."

[[items]]
id = "ieee802154-rx-tx-dataplane-and-acknowledgments-hardware-auto-ack-generation"
section = "ieee802154-rx-tx-dataplane-and-acknowledgments"
title = "Hardware Auto ACK generation"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The [engine](../../../espressif/ieee802154/engine/src/engine.rs) lets the hardware acknowledge 2003/2006 frames, selecting the pending bit before the ACK leaves. The former HIL cell `ieee802154-peer-exchange` had the vendor peer receive the device's ACKs (tag `legacy-wifi-2026-10-16`); on-air ACK timing is not measured. No composition runs it since #770 (tag `legacy-radio-2026-10-16`); #771 brings the shared radio system back."
packages = ["oer-espressif-ieee802154-engine"]

[[items]]
id = "ieee802154-rx-tx-dataplane-and-acknowledgments-enhanced-ack-tx"
section = "ieee802154-rx-tx-dataplane-and-acknowledgments"
title = "Enhanced ACK TX"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The engine publishes an enhanced ACK for 2015 frames from a generator (the removed role's, a port of ESP-IDF's OpenThread generator (#770, tag `legacy-radio-2026-10-16`)): the [portable formatter](../../../../protocols/ieee802154/src/mac/enhanced_ack.rs) ports OpenThread GenerateEnhAck, and secured ACKs take the frame counter and the key-index-mode key from the radio's MAC keys with engine-armed transmit security. Received frames report the frame-pending bit and the counter and key index of the secured ACK they were sent. With CSL the ACK carries the port's CSL IE, filled with period and phase at its SFD. For a Link Metrics probing initiator the ACK carries the Thread enhanced-ACK probing IE with the frame's LQI, link margin and RSSI, from the [portable probing table](../../../../protocols/ieee802154/src/mac/link_metrics.rs) the removed OpenThread adapter filled from `otPlatRadioConfigureEnhAckProbing`; link margins are measured from the reported receive sensitivity, where ESP-IDF's port leaves the noise floor at zero. Other header IEs are fixed caller bytes. The former HIL cell `ieee802154-peer-exchange` had the vendor peer receive the device's enhanced ACK of a 2015 frame (tag `legacy-wifi-2026-10-16`); secured, CSL and probing enhanced ACKs are not exercised on air. #771 brings the shared radio system back, and #774 the OpenThread integration."

