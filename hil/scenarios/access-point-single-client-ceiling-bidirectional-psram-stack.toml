schema = 3
id = "access-point-single-client-ceiling-bidirectional-psram-stack"
description = "Experimental AP HT40 MCS7 saturated bidirectional run with CPU task stacks in PSRAM"
repetitions = 3
image = "diagnostic-psram-stack"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "split-core", "ceiling", "bidirectional", "psram-stack"]

[link]
phy = "ht40"
minimum_mcs = 7

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 120
client = "open-wrt"

[workload.traffic]
kind = "udp"
direction = "bidirectional"
duration_seconds = 16
rx_rate_bps = 100000000
tx_rate_bps = 100000000
payload_bytes = 1472

[criteria]
exact_delivery = false
minimum_rx_bps = 40000000
minimum_tx_bps = 40000000
minimum_combined_bps = 80000000
require_no_beacon_loss = true
minimum_concurrent_ap_clients = 1
