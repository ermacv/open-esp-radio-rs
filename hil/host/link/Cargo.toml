[package]
name = "oer-hil-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL host/target link: UART capture, protocol exchange, readiness, host traffic transports and measurements"

[features]
# The capture fixtures of the runner's cross-package tests.
test-support = []

[dependencies]
oer-hil-durable = { path = "../durable" }
oer-hil-evidence = { path = "../evidence" }
oer-hil-fixture = { path = "../fixture" }
oer-hil-image-class = { path = "../image-class" }
oer-hil-protocol = { path = "../../protocol", features = ["registry"] }
oer-hil-scenario = { path = "../scenario" }
oer-process = { path = "../../../tools/process" }
mio = { version = "=1.2.2", features = ["os-poll", "os-ext"] }
postcard = { version = "1.1.3", default-features = false }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.8.1", default-features = false }
zeroize = "1.8.1"

[dev-dependencies]
postcard-schema = { version = "0.2.5", features = ["derive"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "host"
hil = "observation"
