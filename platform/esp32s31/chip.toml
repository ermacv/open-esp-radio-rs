# The facts of the ESP32-S31 that host tools cannot derive from the chip id.
# Paths follow the id by convention: verification/<id>, registers/<id>,
# hil/targets/<id>, qualification/targets/<id>, target/hil/<id>.
schema = 1
id = "esp32s31"
# The family whose shared code the chip uses (`platform = "family"` packages).
family = "espressif"
rust-target = "riscv32imafc-unknown-none-elf"
# The ROM loads platform/esp32s31/bootstrap, which stages the runtime into PSRAM.
boot = "staged"
espflash-chip = "esp32s31"
revisions = ["rev0"]

# What the chip has, as compile-time properties (`oer-chip-cfg` turns them
# into cfgs and constants for the code above the PAC). Differences of
# address or layout belong in the register model, not here.
[properties]
wifi-bands = ["2g4"]
# BTDM controller (BR/EDR and LE) in the vendor Bluetooth library.
bluetooth = ["le", "br-edr"]
ieee802154 = true
cores = 2
