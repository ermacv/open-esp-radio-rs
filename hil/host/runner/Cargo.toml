[package]
name = "open-esp-radio-hil-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Host build, placement-audit and HIL runner for open ESP radio"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
open-esp-radio-hil-protocol = { path = "../../protocol" }
open-esp-radio-ieee80211 = { path = "../../../driver/wifi/ieee80211" }
open-esp-radio-memory-report = { path = "../../../tools/memory-report" }
serialport = { version = "4.8.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"
zeroize = "1.8.1"

[dev-dependencies]
roxmltree = "0.20"

[lints]
workspace = true
