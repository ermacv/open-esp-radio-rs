schema = 2
# Finite WDEVPWR leaves used by the source-owned Embassy station wake policy.
# The vendor PM state machine, RF callbacks, timers, locks, mesh and statistics
# remain explicit architectural replacements rather than part of this slice.
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "libpp"
symbol = "pwr_hal_set_mac_modem_beacon_miss_timeout"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac::mac_modem_wakeup::set_beacon_miss_timeout"
binding = "v1"
rust-binding = "exact-production-entry"
rust-probe = "open_libpp_power_trace_pwr_hal_set_mac_modem_beacon_miss_timeout"
effect-contract = "exact-effects-v1"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010d854 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x2010d854 }
disposition = { kind = "required" }

