schema = 5
id = "access-point-single-client-ceiling-bidirectional-task-poll"
description = "Split-core AP HT40 saturated bidirectional UDP executor-residence diagnostic"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "bidirectional", "task-poll", "split-core"]

[wifi]
image = "diagnostic-task-residence"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 65000000, tx_bps = 65000000 }
