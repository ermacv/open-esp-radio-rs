name: "Implementation or refactoring"
description: "Deliver a feature, structural invariant or documentation change."
body:
  - type: markdown
    attributes:
      value: "Name one accepted result. Follow [issue management](https://github.com/ermacv/open-esp-radio-rs/blob/main/docs/issues.md). Triage assigns area and priority; dropdowns do not apply labels. Research and implementation do not establish hardware readiness."
  - type: dropdown
    id: kind
    attributes:
      label: "Kind of result"
      description: "Triage applies the selected kind label."
      options: ["Feature","Refactor","Docs"]
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: "Result and motivation"
      description: "Name the behavior or ownership/structural invariant and its consumer."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Primary area"
      description: "The owner of the result; triage applies its area label."
      options: ["Wi-Fi","Bluetooth","IEEE 802.15.4","Shared radio","Registers / PAC","Platform","Tooling","HIL","Qualification"]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Owner and scope"
      description: "Name defining paths, layer, target/revision/profile and exclusions."
      placeholder: "Owner paths:\nLayer:\nTarget / revision / profile:\nOut of scope:"
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: "Inputs and accepted decisions"
      description: "Link required research or owner decisions. Describe lifecycle, failures and cancellation when the boundary changes."
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance and checks"
      description: "Observable conditions, migrated callers and removed paths for a refactor; separate host, target and hardware evidence."
    validations:
      required: true
  - type: textarea
    id: relations
    attributes:
      label: "Relations and activation"
      description: "Parent, blockers with the exact required artifact, related work, and any future activation trigger."
      placeholder: "Part of:\nBlocked by (artifact and consuming step):\nRelated:\nActivation trigger:"
    validations:
      required: false
