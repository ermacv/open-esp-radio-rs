schema = 3

# The first and last reviewed timer entries exercise the complete indexed
# address domain. Distinct initial images make preservation of unrelated bits
# observable instead of accepting write-only constants by accident.

[[profiles]]
name = "coex-hw-timer-enable"
claim = "whole-function-equivalence"
vendor-source = "coex"
vendor-symbol = "coex_hw_timer_enable"
rust-symbol = "open_coex_trace_coex_hw_timer_enable"
compare-return = false
[[profiles.argument-ranges]]
index = 0
min = 0
max = 4

