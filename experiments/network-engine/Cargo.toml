[package]
name = "oer-network-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hardware-first synchronous network datapath for radio research"

[dependencies]
oer-memory = { path = "../../crates/memory" }
oer-network-interface = { path = "../../crates/network/interface" }
oer-ieee80211-datapath = { path = "../../crates/protocols/ieee80211/datapath" }

[dev-dependencies]
# Host tests compose the engine with the production station TX owner.
oer-esp32s31-ieee80211-mac = { path = "../../crates/hardware/esp32s31/driver/ieee80211/mac" }
oer-esp32s31-ieee80211-runtime = { path = "../../crates/runtime/esp32s31/ieee80211", features = ["test-support"] }
oer-ieee80211-softmac = { path = "../../crates/protocols/ieee80211/softmac" }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "experimental"
layer = "experiment"
platform = "portable"
