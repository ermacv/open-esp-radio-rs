schema = 3
chip = "esp32c5"
address-space = "cpu"
fragments = [
    "peripherals/ieee802154-mac.toml",
    "peripherals/ieee802154-interrupt-route.toml",
    "peripherals/modem-etm.toml",
    "peripherals/modem-syscon-radio.toml",
    "peripherals/modem-lpcon-shared-clock.toml",
    "peripherals/i2c-ana-mst.toml",
    "peripherals/pmu-radio.toml",
    "peripherals/phy-baseband-config.toml",
    "peripherals/lp-aon-radio.toml",
    "peripherals/apb-saradc-radio.toml",
    "peripherals/pcr-radio.toml",
    "peripherals/wifi-mac-aux-tsf-control.toml",
    "peripherals/wifi-mac-bssid-policy.toml",
    "peripherals/wifi-mac-interrupt.toml",
    "peripherals/wifi-mac-power-interrupt.toml",
    "peripherals/wifi-mac-rtc-timer-update.toml",
    "peripherals/wifi-mac-sta-beacon-filter.toml",
    "peripherals/wifi-mac-sta-tsf-load.toml",
    "peripherals/wifi-mac-tx-common.toml",
]

[[shared-fragments]]
library = "../../ieee80211/model/library.toml"
fragment = "peripherals/wifi-mac-interface-address.toml"
review = "peripherals/wifi-mac-interface-address.review.toml"
placement = { WIFI_MAC_INTERFACE_ADDRESS = 0x600A405C }

[device]
name = "ESP32C5_RADIO"
version = "0.1"
description = """
ESP32-C5 modem/radio registers owned by the radio drivers. This first stage
    publishes the IEEE 802.15.4 MAC aperture, its interrupt route and
    the modem ETM channels it programs, and the modem clock gates and
    resets of its vendor clock devices, the analog register I2C master
    the PHY drives, and Wi-Fi MAC register views derived from the reviewed
    ESP32-S31 model. Unknown fields are omitted."""
vendor = "Espressif"
vendor-id = "ESP"
series = "ESP32-C5"
license-text = "MIT OR Apache-2.0"
address-unit-bits = 8
width = 32
svd-schema = "1.3"
svd-schema-location = "CMSIS-SVD.xsd"

[device.register-defaults]
