[peripherals.registers.register]
name = "INIT_CONFIG"
description = "BLE PHY initialization writes the complete finite image 0x000002F0. Inner semantics remain unknown."
addressOffset = 0x0
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "IMAGE"
bitOffset = 0
bitWidth = 32

