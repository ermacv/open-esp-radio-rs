[book]
title = "Open ESP Radio"
description = "From binary evidence to an open radio implementation"
language = "en"
src = "target/docs/portal/src"

[build]
build-dir = "target/docs/portal/site"
create-missing = false

[rust]
edition = "2024"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
site-url = "/open-esp-radio-rs/"
git-repository-url = "https://github.com/ermacv/open-esp-radio-rs"
no-section-label = true
additional-js = ["target/docs/portal/mermaid.min.js", "target/docs/portal/mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false

[output.html.print]
enable = false
