maximum = 0xFFF

[[peripherals.registers.register.fields]]
name = "CONTENTION_WINDOW"
bitOffset = 12
bitWidth = 10

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3FF

[[peripherals.registers.register.fields]]
name = "INTERFACE"
bitOffset = 22
bitWidth = 2

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3

[[peripherals.registers.register.fields]]
name = "AIFSN"
bitOffset = 24
bitWidth = 4

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xF

[[peripherals.registers.register.fields]]
name = "SCHEDULER_PRIORITY"
description = "Complete mac_tx_set_pti writes the unsigned minimum of packet PTI and coexistence event-one PTI here. This scheduler value is independent of the four original packet-PTI lanes in the vector bank; for Authentication and Association both values resolve to one. Open HIL read scheduler one in five reset-to-connect repetitions."
bitOffset = 28
bitWidth = 4

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xF

[[peripherals.registers]]

[peripherals.registers.register]
dim = 4
dimIncrement = 0x10
dimIndex = "0,1,2,3"
name = "CONTROL%s"
description = "Descriptor address and PLCP0 format image in low 30 bits; VALID bit 30 and ENABLE bit 31 publish hardware ownership."
addressOffset = 0xC
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "DESCRIPTOR_ADDRESS_LOW"
description = "Low twenty bits of the owned TX descriptor address; the DMA window supplies the high address bits."
bitOffset = 0
bitWidth = 20

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFF

[[peripherals.registers.register.fields]]
name = "CONTROL_21_20_UNKNOWN"
description = "Recovered PLCP0 control image; mac_tx_set_plcp0 initializes these two bits to binary 10 for the ordinary direct legacy path."
bitOffset = 20
bitWidth = 2

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3

[[peripherals.registers.register.fields]]
name = "TXOP_DESCRIPTOR_CLASS_UNKNOWN"
description = "Complete pp.o ppTxFragmentProc reaches its common legacy setup at offsets 0x8e..0xa8 from the CCMP selector-three branch at 0x22a and sets descriptor bit seven. Complete hal_mac_tx.o mac_tx_set_txop_q offsets 0x86..0xaa then sets this queue-control bit exactly when descriptor flag bits 7:6 equal binary 10 and clears it otherwise. Thus the bounded ordinary individual/group CCMP path sets this bit after mac_tx_set_plcp0. A 2026-07-29 open HIL A/B clearing the bit increased raw ACK timeouts from the prior roughly 28 percent to 1395/2325 attempts (60 percent), so the exact set mapping is retained while the electrical meaning remains unknown."
bitOffset = 22
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CONTROL_23_UNKNOWN"
description = "Recovered PLCP0 control image; mac_tx_set_plcp0 initializes this bit to zero for the ordinary direct legacy path."
bitOffset = 23
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "PLCP_FORMAT"
description = "Three-bit format selector derived by complete mac_tx_set_plcp0 from vendor descriptor flags. For the bounded plain legacy roots, ppTxProtoProc maps the address-one I/G bit to descriptor flag 0x2: group traffic retains format zero, while an ordinary individual-address descriptor with zero flags selects format one. Exact vendor callback images select format one for both non-A-MPDU HT20 MCS0 and HE20 MCS0 DCM S-MPDU frames; the owned open paths receive ACK at the same format. Independently captured HT and HE A-MPDU images select aggregate format two or five respectively. Format three has an instruction-exact descriptor branch but its higher-level meaning remains open. A legacy-only single-variable A/B temporarily correlated format one with status five and format zero with one authentication response, but format-zero repetitions failed; that experiment is retained as evidence that completion status alone is not a protocol-success oracle, not as an override of the complete blob mapping."
bitOffset = 24
bitWidth = 3

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x7

[[peripherals.registers.register.fields]]
name = "CONTROL_29_27_UNKNOWN"
description = "Remaining low control bits before ownership publication."
bitOffset = 27
bitWidth = 3

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x7

[[peripherals.registers.register.fields]]
name = "VALID"
bitOffset = 30
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "ENABLE"
bitOffset = 31
bitWidth = 1

