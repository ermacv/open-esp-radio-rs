# Shareable project entry point. Local artifact paths belong in an untracked
# run spec passed with --run-spec, or in a private copy referenced here.
schema = 1
id = "esp32s31-radio-rev0"
target-spec = "target.toml"
platform-pack = "platform.toml"
memory-map = "memory.toml"
svd = ["../../../../svd/esp32s31-platform-radio-deps.svd"]

[analysis.symbols]
output = "generated/findings/symbols.json"

[analysis.navigation]
output = "generated/findings/navigation.json"

[code]
pack = "code/boundaries.toml"

[code.review]
output = "generated/reports/code-boundaries.md"

[[analysis.ir]]
id = "rom-all"
sources = ["rom"]
roots = "all"
include-reachable = true
entry-contract = "esp32s31-phy-registered"
output = "generated/findings/rom-all.ir"
pseudo-rust = "generated/reports/rom-all.pseudo.rs"

[[analysis.ir]]
id = "archive-all"
sources = ["archive"]
roots = "all"
include-reachable = true
entry-contract = "esp32s31-phy-registered"
output = "generated/findings/archive-all.ir"
pseudo-rust = "generated/reports/archive-all.pseudo.rs"

[[analysis.ir]]
id = "libpp-all"
sources = ["libpp"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/libpp-all.ir"
pseudo-rust = "generated/reports/libpp-all.pseudo.rs"

[[analysis.ir]]
id = "libnet80211-all"
sources = ["libnet80211"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/libnet80211-all.ir"
pseudo-rust = "generated/reports/libnet80211-all.pseudo.rs"

[[analysis.ir]]
id = "wifi-sta-lifecycle"
sources = ["wifi-sta-lifecycle"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/wifi-sta-lifecycle.ir"
pseudo-rust = "generated/reports/wifi-sta-lifecycle.pseudo.rs"

[[analysis.ir]]
id = "coex-all"
sources = ["coex"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/coex-all.ir"
pseudo-rust = "generated/reports/coex-all.pseudo.rs"

[[analysis.ir]]
id = "btbb-all"
sources = ["btbb"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/btbb-all.ir"
pseudo-rust = "generated/reports/btbb-all.pseudo.rs"

[registers]
facts = "generated/findings/mmio.json"
model = "registers/device.toml"
owned-ranges = [
    "modem-radio-core-low",
    "modem-radio-core-mid",
    "coex-hw-timer",
    "modem-radio-core-high",
]

[registers.review]
output = "generated/reports/register-review.md"
linked-ir = [
    "generated/findings/rom-all.ir",
    "generated/findings/archive-all.ir",
    "generated/findings/libpp-all.ir",
    "generated/findings/libnet80211-all.ir",
    "generated/findings/wifi-sta-lifecycle.ir",
    "generated/findings/coex-all.ir",
    "generated/findings/btbb-all.ir",
]
# `phy_reg_check` is a diagnostic register dump: it reads every word in broad
# MMIO windows and prints the values without using them to control hardware.
# Preserve those raw observations, but do not make diagnostic-only addresses
# part of the release register-model review debt.
# `wdev_record_rx_linked_list` snapshots descriptor/MMIO state into the debug
# ring consumed by `wdev_dump_rx_linked_list`; its two otherwise unknown reads
# at 0x20104090/0x20104094 do not control the RX path.
non-operational-functions = [
    "archive:phy_reg_check",
    "libpp:wdev_record_rx_linked_list",
    "wifi-sta-lifecycle:dbg_dump_rx_links",
    "wifi-sta-lifecycle:wdev_record_rx_linked_list",
]

[registers.svd]
output = "../../../../svd/esp32s31-radio.svd"

[registers.pac]
output = "../../../../driver/chips/esp32s31/pac/src/lib.rs"
target = "none"
edition = "2024"

[registers.bindings]
output = "../../../../svd/esp32s31-radio.bindings.toml"
crate-name = "open_esp_radio_esp32s31_pac"

[registers.api]
pack = "registers/api.toml"

[registers.lints]
pack = "registers/lints.toml"

[registers.toml]
catalogs = [
    "registers/evidence/policy.toml",
    "registers/evidence/platform.toml",
    "registers/evidence/vendor-rom.toml",
    "registers/evidence/vendor-radio-libraries.toml",
    "registers/evidence/vendor-libpp.toml",
    "registers/evidence/vendor-net80211.toml",
    "registers/evidence/hil-open.toml",
    "registers/evidence/hil-vendor.toml",
    "registers/evidence/migration.toml",
]

[interfaces]
facts = "generated/findings/interfaces.json"
pack = "interfaces/reviewed.toml"

[functions]
pack = "functions/reviewed.toml"
profiles = [
    "rom-all",
    "archive-all",
    "libpp-all",
    "libnet80211-all",
    "wifi-sta-lifecycle",
    "coex-all",
    "btbb-all",
]

[functions.review]
output = "generated/reports/function-review.md"

# Human-sized review surfaces over artifact-wide IR. Roots may use the stable
# SOURCE:SYMBOL shorthand; the workbench resolves the concrete archive identity
# and follows only calls present in the selected profiles.
[review]
output = "generated/findings/review-scopes.json"
publication-scopes = [
    "phy-init",
    "wifi-rx",
    "wifi-tx",
    "wifi-interrupts",
    "station-state",
]

[[review.scopes]]
id = "phy-init"
profiles = ["archive-all"]
roots = ["archive:phy_bb_init", "archive:register_chipv7_phy"]
include-reachable = true

[[review.scopes]]
id = "wifi-rx"
profiles = ["libpp-all"]
roots = [
    "libpp:hal_mac_rx_disable",
    "libpp:hal_mac_rx_enable",
    "libpp:wDev_AppendRxBlocks",
]
include-reachable = true

[[review.scopes]]
id = "wifi-tx"
profiles = ["libpp-all"]
roots = [
    "libpp:hal_mac_txq_enable",
    "libpp:hal_mac_txq_disable",
    "libpp:hal_mac_tx_config_edca",
    "libpp:hal_mac_tx_get_blockack",
]
include-reachable = true

[[review.scopes]]
id = "wifi-interrupts"
profiles = ["libpp-all"]
roots = ["libpp:wDev_ProcessFiq"]
include-reachable = true

[[review.scopes]]
id = "station-state"
profiles = ["libnet80211-all", "libpp-all"]
roots = ["libnet80211:ieee80211_sta_new_state"]
include-reachable = true

[[review.scopes]]
id = "wifi-sta-connected"
profiles = ["wifi-sta-lifecycle"]
roots = [
    "wifi-sta-lifecycle:ieee80211_sta_new_state",
    "wifi-sta-lifecycle:cnx_sta_pm",
    "wifi-sta-lifecycle:pm_start",
    "wifi-sta-lifecycle:pm_set_beacon_filter",
    "wifi-sta-lifecycle:hal_set_sta_beacon_filter",
    "wifi-sta-lifecycle:hal_enable_sta_beacon_filter",
    "wifi-sta-lifecycle:hal_disable_sta_beacon_filter",
]
include-reachable = true

[[review.scopes]]
id = "wifi-sta-beacon-filter-policy"
profiles = ["wifi-sta-lifecycle"]
roots = [
    "wifi-sta-lifecycle:hal_set_sta_beacon_filter",
    "wifi-sta-lifecycle:hal_enable_sta_beacon_filter",
    "wifi-sta-lifecycle:hal_disable_sta_beacon_filter",
]
include-reachable = true

[[review.scopes]]
id = "coex-core"
profiles = ["coex-all"]
roots = [
    "coex:coex_pre_init",
    "coex:coex_init",
    "coex:coex_enable",
    "coex:coex_disable",
    "coex:coex_core_status_get",
    "coex:coex_core_request",
    "coex:coex_core_release",
    "coex:coex_core_pti_get",
]
include-reachable = true

[[review.scopes]]
id = "coex-timer"
profiles = ["coex-all"]
roots = [
    "coex:coex_hw_timer_set",
    "coex:coex_hw_timer_enable",
    "coex:coex_hw_timer_disable",
    "coex:coex_hw_timer_force",
    "coex:coex_hw_timer_unforce",
]
include-reachable = true

[[review.scopes]]
id = "coex-scheduler"
profiles = ["coex-all"]
roots = [
    "coex:coex_schm_interval_set",
    "coex:coex_schm_interval_get",
    "coex:coex_schm_curr_period_get",
    "coex:coex_schm_curr_phase_get",
]
include-reachable = true

[[review.scopes]]
id = "ble-advertising"
profiles = ["btbb-all"]
roots = [
    "btbb:bt_bb_v2_init_cmplx",
    "btbb:bt_bb_v2_tx_set",
    "btbb:bt_set_chn",
    "btbb:coex_pti_v2",
]
include-reachable = true

[qualification]
pack = "features/reviewed.toml"
required-features = ["wifi-sta-connected-no-power-save"]

[verification]
report = "generated/reports/verification.json"

[[verification.suites]]
id = "phy"
sources = ["archive", "rom"]
source-prefixes = ["rom=phy_"]
rust-artifact-role = "rust-artifact"
rust-prefix = "open_phy_trace_"
profiles = ["profiles/compiled-equivalence.toml"]
dispositions = ["dispositions/phy.toml"]
baselines = ["baselines/phy.toml"]
gate = "regression"
match-floor = 104

