schema = 5
id = "station-phy-maintenance-continuity"
description = "HT20 connected station retains its link through combined calibration during UDP RX and then completes fresh ICMP exchange"
repetitions = 3
transfer = "identical-image"
tags = ["functional", "phy-maintenance", "station", "ht20"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht20" }
duration_seconds = 12
payload_bytes = 1200
offer = { rx_bps = 2000000 }

[wifi.workload.maintenance]
operation = "calibration"
after_millis = 1000
require_post_maintenance_echo = true

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 100000
