schema = 2
# Time conversion and timer-value programming are isolated from the four
# instruction-exact control leaves so their incomplete clock projection cannot
# hide the independently qualified control surface.
default-disposition = "not-yet-ported"
default-protocol = "coex"

[[functions]]
source = "coex"
symbol = "coex_hw_timer_set"
disposition = "bounded-feature"
protocol = "coex"
rust-component = "open_esp_radio_esp32s31_coex::program_timer"
binding = "v1"
rust-binding = "exact-production-entry"
rust-probe = "open_coex_set_trace_coex_hw_timer_set"
effect-contract = "exact-effects-v1"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010f008 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010f400 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x2010f400 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010f404 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x2010f404 }
disposition = { kind = "required" }
