[source-facts.source-contract]
id = "coex-timer-validation-bridge"
composition = "diagnostic"
scope = "Execute the recovered coexistence core timer operations through the validation-probes HAL bridge"
limits = "Core tables clock conversion and an Embassy mailbox exist; production Wi-Fi and Bluetooth runtimes do not compose this concrete timer owner"
source-paths = [
  "crates/hardware/esp32s31/hal/src/coex.rs",
  "crates/hardware/esp32s31/driver/coex/src/lib.rs",
  "crates/adapters/embassy/esp32s31/coex/src/lib.rs",
]

[[sections]]
id = "coex-overview"
domain = "coexistence"
title = "ESP32-S31 coexistence source capabilities"
source-document = "crates/hardware/esp32s31/driver/coex/FEATURES.md"
overview = "See the [whole-radio capability map](../FEATURES.md) for shared ownership,\nclock/power lifecycle and cross-protocol composition limits.\n\nThis inventory distinguishes recovered models, validation hardware access and\nproduction radio integration. The current code is not a working end-to-end\ncoexistence layer. A timer write, mailbox reply or matching vendor leaf does\nnot establish an RF grant, concurrent connectivity or hardware qualification.\n\n| Status | Meaning |\n| --- | --- |\n| IMPLEMENTED | The exact named source operation is complete at the stated boundary. A model-only row claims only that model operation. |\n| PARTIAL | Recovered hardware or source machinery exists without complete operational composition. |\n| FAIL-CLOSED | A typed boundary deliberately prevents activation/publication. Missing code or known register addresses alone do not establish this status. |\n| ABSENT | No production policy/runtime owner implements the operation. |\n\nThe [official S31 coexistence guide](https://docs.espressif.com/projects/esp-idf/en/latest/esp32s31/api-guides/coexist.html)\ndescribes priority arbitration over a shared 2.4 GHz RF path. Wi-Fi, BT and BLE\nuse state-dependent time slices; IEEE 802.15.4 uses operation-dependent\npriorities rather than a fourth fixed slice. These are vendor capabilities,\nnot open-driver implementation claims.\n\n[S31 SoC declarations](https://github.com/espressif/esp-idf/blob/master/components/soc/esp32s31/include/soc/soc_caps.h)\ninclude hardware PTI and advanced external coexistence. The source boundaries\nbelow determine how much of that hardware the open driver can use."
documents = ["crates/hardware/esp32s31/driver/FEATURES.md"]

[[sections]]
id = "coex-internal-arbitration-hardware-and-models"
domain = "coexistence"
title = "Internal arbitration hardware and models"
source-document = "crates/hardware/esp32s31/driver/coex/FEATURES.md"
overview = "Compiled PTI and timer-map source mappings cover only their named leaves,\nnot the scheme scheduler or end-to-end coexistence. They have no native\nvendor comparison."

[[sections]]
id = "coex-coexistence-policy-and-scheduler"
domain = "coexistence"
title = "Coexistence policy and scheduler"
source-document = "crates/hardware/esp32s31/driver/coex/FEATURES.md"
overview = "`CoexClient` represents the reviewed Bluetooth/Wi-Fi request domain only.\nIEEE 802.15.4 must not be added as an inferred third numeric client. The vendor\n`esp_coex_ieee802154_*` operations are a separate surface; MAC TX/RX/ACK PTI controls\nalso have their own ownership boundary. Neither surface is a fourth time slice."

[[sections]]
id = "coex-protocol-integration-and-lifetime"
domain = "coexistence"
title = "Protocol integration and lifetime"
source-document = "crates/hardware/esp32s31/driver/coex/FEATURES.md"
overview = "The reviewed `libcoexist.a` SHA-256\n`9b8f55b1a1670ac8da1323595c817eca7340f073e783c162d3a2dfde7bbd19c8`\ndoes not provide an RF-release acknowledgement through its IEEE 802.15.4\nbreak/stage callbacks. `esp_coex_ieee802154_coex_break_notify` delegates to\n`hal_ieee802154_coex_break_notify`, whose complete body returns without effects;\n`esp_coex_ieee802154_extcoex_rx_stage` and `esp_coex_ieee802154_extcoex_tx_stage`\nalso return without effects. This is artifact-specific evidence, not absence\nof hardware coexistence. PTI setters and force-RX/delay setters are separate\nhardware-writing operations. Their completion does not certify an RF grant.\n\nTimer `force`/`unforce` are not save/restore operations: the reviewed PAC\nclears the timer tick image on force and replaces it with the vendor constant\non unforce. A generic guard which merely calls unforce cannot promise to\nrestore a previous duration or create a non-preemptible maintenance interval.\nSee the [reviewed source boundaries](../../../../../registers/esp32s31/evidence/vendor-radio-libraries.toml)\nand [timer PAC](../../pac/src/modem/coex.rs)."
packages = ["oer-esp32s31-pac"]
documents = ["registers/esp32s31/evidence/vendor-radio-libraries.toml"]

[[sections]]
id = "coex-external-coexistence"
domain = "coexistence"
title = "External coexistence"
source-document = "crates/hardware/esp32s31/driver/coex/FEATURES.md"
overview = "[ESP-IDF Kconfig](https://github.com/espressif/esp-idf/blob/master/components/esp_coex/Kconfig)\ndocuments GPIO-based one-, two- and three-wire configurations. The public\n[external coexistence API](https://github.com/espressif/esp-idf/blob/master/components/esp_coex/include/esp_coexist.h)\nalso defines signals and control options. An enum value alone does not establish\nS31 support for an additional wire mode; four-wire operation is not claimed here."

[[sections]]
id = "coex-official-coexistence-scenario-scope"
domain = "coexistence"
title = "Official coexistence scenario scope"
source-document = "crates/hardware/esp32s31/driver/coex/FEATURES.md"
overview = "The [vendor scenario matrix](https://docs.espressif.com/projects/esp-idf/en/latest/esp32s31/api-guides/coexist.html#supported-coexistence-scenario-for-esp32-s31)\nis an external compatibility reference, not open-driver evidence. Selected\nentries retain its distinctions: Y means stable support, C1 unstable support,\nX unsupported and S stable only in STA mode. All corresponding open production\ncompositions remain ABSENT as listed above."

[[sections]]
id = "coex-readiness-authority"
domain = "coexistence"
title = "Readiness authority"
source-document = "crates/hardware/esp32s31/driver/coex/FEATURES.md"
overview = "There is no standalone coex qualification target. Existing requirements live in\n[Bluetooth qualification](../../../../../qualification/targets/esp32s31/bluetooth-le.toml)\nand the radio compositions described by the [Wi-Fi](../ieee80211/FEATURES.md)\nand [IEEE 802.15.4](../ieee802154/FEATURES.md) inventories. The Bluetooth\n`coexistence` capability remains incomplete. Recovered tables and validation\nMMIO cannot satisfy missing protocol hooks, scheduler semantics or joint-radio\nHIL evidence. This inventory does not introduce qualification scenarios or\npromote readiness."
packages = ["oer-esp32s31-ieee802154", "oer-esp32s31-ieee80211"]
documents = ["qualification/targets/esp32s31/bluetooth-le.toml"]

