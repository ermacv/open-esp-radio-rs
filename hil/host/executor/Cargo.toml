[package]
name = "oer-hil-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Execution of typed HIL scenarios: one scenario run by the host model or, under a granted stand lease, the stand; what a run measures; and the tier plan with its budget, image segments and lease limits"

[features]
# `StandSession::for_tests`: a stand session without a lease, for the tests
# of stand drivers. No runner enables it.
test-support = []

[dependencies]
oer-hil-model = { path = "../../model" }
oer-stand-arbiter = { path = "../../../stand/arbiter" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
embassy-futures = "0.1.2"
oer-hil-trace-header = { path = "../../trace-header" }
oer-time = { path = "../../../crates/time", features = ["serde"] }
# The executor's own tests and doctests use `StandSession::for_tests`.
oer-hil-executor = { path = ".", features = ["test-support"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "execution"
host-app = "hil"
host-boundary = "library"
hil = "orchestration"

[package.metadata.docs.rs]
