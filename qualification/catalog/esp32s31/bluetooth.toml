status = "partial"
level = "lower-primitive"
scope-and-limitations = "Bounded hard-handler [classification](../../../esp32s31/driver/bluetooth/src/interrupt/classifier.rs) exists; the esp-hal IRQ routes and the task wake were removed (#770, tag `legacy-radio-2026-10-16`), and #773 rebuilds the Bluetooth orchestration. Unrelated finished-list and complete role dispatch remain incomplete."

[[items]]
id = "bluetooth-controller-sram-ownership"
section = "bluetooth-controller-lifetime"
