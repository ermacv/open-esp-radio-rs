schema = 5
id = "diagnostic-station-rx-baseline-air-delivery"
description = "RX baseline with independent air evidence before maintenance comparison"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { rx_bps = 65000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 10000000
