[peripherals.registers.register]
name = "RX_SETUP_CONTROL"
description = "bt_bb_rx_set clears bit 8 and the low two-bit field through separate fresh-read RMW operations; the complete shared receive initializer independently replaces bits 10:20."
addressOffset = 0xC
size = 32
access = "read-write"

