schema = 5
id = "access-point-icmp"
description = "AP HT40 MCS7 latency and loss over 100 ICMP requests per WPA2 epoch"
role = "investigation"
tags = ["wifi", "access-point", "network", "single-client", "ht40", "icmp", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 90
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "icmp"
count = 100
interval_ms = 20
timeout_ms = 1000
payload_bytes = 56
maximum_p95_ms = 20
