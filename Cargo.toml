[workspace]
members = [
    "tools/repo",
    "hil/protocol",
    "driver/memory",
    "driver/network/interface",
    "driver/radio",
    "driver/network/adapters/embassy/owned",
    "driver/network/adapters/embassy/compat",
    "driver/network/research",
    "driver/adapters/embassy/ieee80211",
    "driver/runtime/embassy/esp32s31/bluetooth",
    "driver/adapters/embassy/esp32s31/coex",
    "driver/adapters/embassy/esp32s31/ieee802154",
    "driver/adapters/embassy/esp32s31/runtime",
    "driver/runtime/embassy/esp32s31/ieee80211",
    "driver/adapters/embassy/esp32s31/ieee80211-compat",
    "driver/adapters/esp-hal/esp32s31/radio",
    "driver/adapters/esp-hal/esp32s31/ieee802154",
    "driver/adapters/esp-hal/esp32s31/ieee80211",
    "driver/bluetooth/hci",
    "driver/bluetooth/le/ll",
    "driver/ieee802154",
    "driver/ieee80211/ap",
    "driver/ieee80211/sta",
    "driver/ieee80211/mac",
    "driver/ieee80211/softmac",
    "driver/ieee80211/datapath",
    "driver/ieee80211/security/wpa2",
    "driver/chips/esp32s31/hal",
    "driver/chips/esp32s31/bluetooth",
    "driver/chips/esp32s31/bluetooth/memory",
    "driver/chips/esp32s31/coex",
    "driver/chips/esp32s31/ieee80211",
    "driver/chips/esp32s31/ieee80211/dma",
    "driver/chips/esp32s31/ieee802154/dma",
    "driver/chips/esp32s31/ieee802154/irq",
    "driver/chips/esp32s31/ieee802154/mac",
    "driver/chips/esp32s31/ieee802154/runtime",
    "driver/chips/esp32s31/ieee80211/mac",
    "driver/chips/esp32s31/ieee80211/ap",
    "driver/chips/esp32s31/ieee80211/sta",
    "driver/chips/esp32s31/phy",
    "driver/chips/esp32s31/pac/raw",
    "driver/chips/esp32s31/pac",
    "driver/adapters/esp-hal/esp32s31/soc",
    "driver/integration/esp32s31/embassy/bluetooth",
    "hil/host/runner",
    "qualification/evaluator",
    "tools/memory-report",
    "tools/blobray/crates/register-model",
    "tools/blobray",
    "tools/blobray/crates/backend-riscv",
    "tools/blobray/crates/contracts",
    "tools/blobray/crates/review-model",
    "tools/blobray/crates/execution-model",
    "verification/vendor/chips/esp32s31/blobray-provider/contracts",
    "verification/vendor/chips/esp32s31/blobray-provider/knowledge",
    "verification/vendor/chips/esp32s31/blobray-provider/models",
    "verification/vendor/projects/esp32s31/blobray-provider/contracts",
    "verification/vendor/projects/esp32s31/blobray-provider/knowledge",
    "verification/vendor/projects/esp32s31/blobray-provider/models",
    "tools/blobray/crates/analysis-model",
    "tools/blobray/crates/semantics",
    "tools/blobray/addons/c",
    "tools/blobray/addons/esp-idf",
    "verification/vendor/projects/esp32s31/blobray-host",
]
exclude = [
    "driver/integration/esp32s31/embassy/ieee80211",
    "examples/esp32s31-station",
    "hil/targets/esp32s31",
    "verification/vendor/projects/esp32s31/probes",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
# Driver protocol state must advance identically in debug and release builds.
debug_assert_with_mut_call = "deny"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# Host-side binary analysis is prohibitively slow at dev opt-level 0. Keep a
# separate incremental profile for the normal blobray aliases so firmware
# development and unit tests retain their ordinary dev/release behavior.
[profile.blobray]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

# The ESP32-S31 async-platform branch uses register accessor fixes that are
# still carried by the matching PAC fork.
[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "507d14dbccfc26128b929b044d76f09cf2d1d2f6" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
