[package]
name = "open-esp-radio-esp32s31-embassy-wifi"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"
description = "Product-level ESP32-S31 Wi-Fi composition for Embassy and esp-hal"

[package.metadata.open-radio]
# Cargo features are additive, while these integration leaves are
# intentionally alternatives. Repository audits compile every declared
# profile independently instead of constructing an invalid all-feature union.
supported-feature-profiles = [
    "upstream-network,diagnostics,mac-irq-diagnostics,task-poll-telemetry,connected-datapath-cycle-telemetry,core0-rx-coarse-telemetry,tx-psram-dma-probe",
    "owned-network,diagnostics,mac-irq-diagnostics,task-poll-telemetry,connected-datapath-cycle-telemetry,core0-rx-coarse-telemetry,tx-psram-dma-probe",
    "compat-network,diagnostics,mac-irq-diagnostics,task-poll-telemetry,connected-datapath-cycle-telemetry,core0-rx-coarse-telemetry,tx-psram-dma-probe",
]

[dependencies]
open-esp-radio-xarxa-upstream = { path = "../../../../network/adapters/xarxa/upstream", optional = true }
open-esp-radio-esp32s31-wifi-xarxa-upstream = { path = "../../../../adapters/embassy/esp32s31/ieee80211-upstream", optional = true }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
# Network stacks are mutually exclusive composition leaves. The compatibility
# leaf resolves only released crates; the owned leaf contains the maintained
# owner-transfer fork. Neither choice changes radio policy.
embassy-net-owned = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "1fa0957c07398f83c9795b645a5a6ceda1270f91", default-features = false, features = ["medium-ethernet", "proto-ipv4", "raw"], optional = true }
embassy-net-compat = { package = "embassy-net", version = "0.9.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "raw"], optional = true }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
log = { version = "0.4.29", optional = true }
riscv = { version = "0.15", optional = true }
open-esp-radio = { path = "../../../../radio", default-features = false, features = ["wifi-embassy"] }
open-esp-radio-esp32s31-wifi = { path = "../../../../chips/esp32s31/ieee80211" }
open-esp-radio-esp32s31-hal = { path = "../../../../chips/esp32s31/hal" }
open-esp-radio-esp32s31-phy = { path = "../../../../chips/esp32s31/phy" }
open-esp-radio-esp32s31-wifi-ap = { path = "../../../../chips/esp32s31/ieee80211/ap" }
open-esp-radio-esp32s31-wifi-dma = { path = "../../../../chips/esp32s31/ieee80211/dma" }
open-esp-radio-esp32s31-wifi-mac = { path = "../../../../chips/esp32s31/ieee80211/mac" }
open-esp-radio-esp32s31-wifi-sta = { path = "../../../../chips/esp32s31/ieee80211/sta" }
open-esp-radio-embassy-net = { path = "../../../../network/adapters/embassy/owned", optional = true }
open-esp-radio-embassy-net-compat = { path = "../../../../network/adapters/embassy/compat", optional = true }
open-esp-radio-esp32s31-wifi-embassy = { path = "../../../../runtime/embassy/esp32s31/ieee80211", default-features = false }
open-esp-radio-esp32s31-wifi-embassy-compat = { path = "../../../../adapters/embassy/esp32s31/ieee80211-compat", optional = true }
open-esp-radio-wifi-embassy = { path = "../../../../adapters/embassy/ieee80211" }
open-esp-radio-ieee80211 = { path = "../../../../ieee80211/mac" }
open-esp-radio-network = { path = "../../../../network/interface" }
open-esp-radio-wifi-ap = { path = "../../../../ieee80211/ap" }
open-esp-radio-wifi-softmac = { path = "../../../../ieee80211/softmac" }
open-esp-radio-wifi-sta = { path = "../../../../ieee80211/sta" }
open-esp-radio-wpa2 = { path = "../../../../ieee80211/security/wpa2" }
static_cell = "2.1.1"

# Hardware composition is target-only; the product resource profile and its
# ownership tests also compile on the host without running esp-hal's build script.
[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "bee3369c35dfc10048b1d524150d99869f8a4352", default-features = false, features = ["esp32s31", "rt", "unstable"] }
open-esp-radio-esp32s31-platform-pac = { path = "../../../../adapters/esp-hal/esp32s31/soc", optional = true, features = ["psram-dma-diagnostic"] }
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../../../adapters/esp-hal/esp32s31/ieee80211", features = ["esp32s31"] }

[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[features]
default = ["owned-network"]
upstream-network = [
    "dep:open-esp-radio-xarxa-upstream",
    "dep:open-esp-radio-esp32s31-wifi-xarxa-upstream",
]
owned-network = [
    "dep:embassy-net-owned",
    "dep:open-esp-radio-embassy-net",
    "open-esp-radio-esp32s31-wifi-embassy/owned-network",
]
compat-network = [
    "dep:embassy-net-compat",
    "dep:open-esp-radio-embassy-net-compat",
    "dep:open-esp-radio-esp32s31-wifi-embassy-compat",
]
diagnostics = [
    "dep:log",
    "open-esp-radio-esp32s31-wifi-embassy/diagnostics",
    "open-esp-radio-esp32s31-wifi-embassy-compat?/diagnostics",
    "open-esp-radio-esp32s31-wifi-xarxa-upstream?/diagnostics",
]
# Hard-IRQ callbacks are a deliberately separate diagnostic boundary. Enabling
# ordinary value observers must not change the SRAM-closed interrupt call graph.
mac-irq-diagnostics = ["diagnostics"]
tx-wait-probe = ["diagnostics", "open-esp-radio-esp32s31-wifi-embassy/tx-wait-probe"]
task-poll-telemetry = [
    "diagnostics",
    "open-esp-radio-esp32s31-wifi-embassy/task-poll-telemetry",
]
connected-datapath-cycle-telemetry = ["dep:riscv"]
core0-rx-coarse-telemetry = [
    "open-esp-radio-esp32s31-wifi-embassy/core0-rx-coarse-telemetry",
    "open-esp-radio-esp32s31-wifi-embassy/tx-phase-telemetry",
    "open-esp-radio-esp32s31-wifi-embassy-compat?/tx-phase-telemetry",
    "open-esp-radio-esp32s31-wifi-xarxa-upstream?/tx-phase-telemetry",
]
tx-psram-dma-probe = [
    "dep:open-esp-radio-esp32s31-platform-pac",
    "open-esp-radio-esp32s31-wifi-dma/tx-psram-dma-probe",
]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace]
resolver = "3"

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "507d14dbccfc26128b929b044d76f09cf2d1d2f6" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
