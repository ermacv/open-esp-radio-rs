[package]
name = "oer-image-encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Image encoding with the espflash library: application, bootloader, partition tables, OTA selection and the staged runtime's packing"

[dependencies]
espflash = { version = "=4.5.0", default-features = false }
esp-idf-part = "=0.6.0"
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std"] }
oer-chip-profile = { path = "../chip-profile" }
sha2 = "0.10"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
host-layer = "foundation"
inputs = ["platform/*/chip.toml", "platform/espressif/staged-layout/fixtures/stage-two.txt"]
