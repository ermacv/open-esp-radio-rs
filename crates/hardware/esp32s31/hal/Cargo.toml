[package]
name = "oer-esp32s31-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ownership and async HAL boundaries for the ESP32-S31 radio"

[features]
validation-probes = ["oer-esp32s31-pac/validation-probes"]

[dependencies]
oer-memory = { path = "../../../memory" }
oer-esp32s31-coex = { path = "../driver/coex" }
oer-esp32s31-ieee802154-irq = { path = "../driver/ieee802154/irq" }
oer-esp32s31-pac = { path = "../pac" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
oer-esp32s31-ieee802154-irq = { path = "../driver/ieee802154/irq" }
oer-esp32s31-pac = { path = "../pac", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "esp32s31"
