[[sources]]
id = "ESP_IDF_ESP32S31_MODEM_REG_BASE"
description = "Official ESP-IDF master commit 873d612fdeebf5dadc068670d320dbf4bcd742bc, components/soc/esp32s31/include/modem/reg_base.h, sha256 86a9909938d4db06b3d11c4c386a2c3dbdcd9657b6d194a216202b796ada13b9. It defines MODEM_BASE 0x20100000, MODEM_PWR_BASE 0x2010d000 and the FE, WIFI_MAC, WIFI_BB, WIFI_BB_BRX, MODEM_TIMER, MODEM_ETM, MODEM_DATADUMP, MODEM_WIDGETS, MODEM_SYSCON, MODEM_LPCON, I2C_ANA_MST and I2C_ANA_MST_MEM sub-block bases."

[[sources]]
id = "IEEE80211_HT_SIG"
description = "IEEE Std 802.11 HT-SIG field layout: HT-SIG1 bit 7 is CBW, with zero selecting 20 MHz and one selecting 40 MHz. This standard semantic is joined only to the instruction-exact descriptor-word1-bit-15 mapping proved by BLOB_LIBPP_HAL_MAC_TX."

[[sources]]
id = "IEEE80211_HE_PHY_CAP_DCM"
description = "IEEE 802.11 HE PHY Capabilities byte three field semantics as exposed by Linux include/linux/ieee80211-he.h: bits 1:0 encode DCM maximum TX constellation and bits 4:3 encode DCM maximum RX constellation, with encodings NotSupported, BPSK, QPSK and 16-QAM."

[[sources]]
id = "ESP_WIFI_SYS_S31_HE_SU_SIG"
description = "Sibling esp-wifi-sys commit 72b97e6fe55307aa92c8c1edf3fdb3f4df816e80, c/headers/esp32s31/esp_private/esp_wifi_he_types_private.h complete esp_wifi_su_siga1_t and packed esp_wifi_su_siga2_t layouts. These standard field names are joined only to bit positions independently exercised by the complete S31 blob formatter."
