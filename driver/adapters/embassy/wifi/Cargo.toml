[package]
name = "open-esp-radio-wifi-embassy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Chip-independent Embassy ownership adapters for open ESP Wi-Fi"

[dependencies]
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
open-esp-radio-dma = { path = "../../../common/dma" }
open-esp-radio-embassy-net = { path = "../../embassy-net" }
open-esp-radio-wifi-softmac = { path = "../../../wifi/softmac" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = ["generic-queue-64", "std"] }

[lints]
workspace = true
