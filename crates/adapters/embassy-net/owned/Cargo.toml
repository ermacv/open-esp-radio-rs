[package]
name = "oer-embassy-net-owned"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned-packet boundary for the optimized open ESP radio Embassy/Xarxa integration"

[dependencies]
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
oer-memory = { path = "../../../memory" }
oer-network-interface = { path = "../../../network/interface" }
oer-ieee80211-datapath = { path = "../../../protocols/ieee80211/datapath" }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "9e0e3293724c30c5892e6af56150c849f5231eb2", features = ["async"] }

[dev-dependencies]
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }
critical-section = { version = "1.2.0", features = ["std"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "4868fd9acfd4191173cd6531b537d6009d3ae5d0", features = ["medium-ethernet", "ipv4", "ipv4-fragmentation", "ipv4-reassembly", "udp"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "adapter"
platform = "portable"
