[package]
name = "oer-esp32s31-bluetooth-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Production ESP32-S31 Bluetooth controller composition"

[features]
lifecycle-fault-injection = ["oer-esp32s31-bluetooth/lifecycle-fault-injection"]

[dependencies]
oer-esp32s31-phy = { path = "../../../../hardware/esp32s31/phy" }
bt-hci = "=0.10.1"
embassy-sync = "0.8.0"
oer-esp32s31-bluetooth = { path = "../../../../hardware/esp32s31/driver/bluetooth" }
oer-esp32s31-bluetooth-memory = { path = "../../../../hardware/esp32s31/driver/bluetooth/memory" }
static_cell = "2.1.1"
trouble-host = { version = "=0.8.0", git = "https://github.com/ermacv/trouble", rev = "8d77d5c347f27a45314e297ac9376373d4f84ea3", default-features = false, features = ["gatt", "peripheral"] }

[dev-dependencies]
embedded-io = "0.7.1"
oer-esp32s31-bluetooth-embassy = { path = "../../../../runtime/embassy/esp32s31/bluetooth" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
embassy-futures = "0.1.2"
embassy-time = "0.5.1"
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["esp32s31", "unstable"] }
oer-bluetooth-hci = { path = "../../../../protocols/bluetooth/hci" }
oer-bluetooth-ll = { path = "../../../../protocols/bluetooth/le/ll" }
oer-esp32s31-bluetooth-embassy = { path = "../../../../runtime/embassy/esp32s31/bluetooth" }
oer-esp32s31-radio-platform-esp-hal = { path = "../../../../adapters/esp-hal/esp32s31/radio", features = ["esp32s31"] }
oer-esp32s31-soc = { path = "../../../../adapters/esp-hal/esp32s31/soc", features = ["esp32s31"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "composition"
platform = "chip"
chip = "esp32s31"
