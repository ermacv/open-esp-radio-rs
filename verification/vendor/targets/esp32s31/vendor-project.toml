# Shareable project entry point. Local artifact paths belong in an untracked
# run spec passed with --run-spec, or in a private copy referenced here.
schema = 1
id = "esp32s31-radio-rev0"
target-spec = "target.toml"
platform-pack = "platform.toml"
memory-map = "memory.toml"
svd = ["../../../../svd/esp32s31-platform-radio-deps.svd"]

[analysis.symbols]
output = "generated/findings/symbols.json"

[analysis.navigation]
output = "generated/findings/navigation.json"

[code]
pack = "code/boundaries.toml"

[code.review]
output = "generated/reports/code-boundaries.md"

[[analysis.ir]]
id = "rom-all"
sources = ["rom"]
roots = "all"
include-reachable = true
entry-contract = "esp32s31-phy-registered"
output = "generated/findings/rom-all.ir.json"
pseudo-rust = "generated/reports/rom-all.pseudo.rs"

[[analysis.ir]]
id = "archive-all"
sources = ["archive"]
roots = "all"
include-reachable = true
entry-contract = "esp32s31-phy-registered"
output = "generated/findings/archive-all.ir.json"
pseudo-rust = "generated/reports/archive-all.pseudo.rs"

[registers]
facts = "generated/findings/mmio.json"
model = "registers/device.toml"
owned-ranges = [
    "modem-radio-core-low",
    "modem-radio-core-mid",
    "modem-radio-core-high",
]

[registers.review]
output = "generated/reports/register-review.md"
linked-ir = [
    "generated/findings/rom-all.ir.json",
    "generated/findings/archive-all.ir.json",
]
# `phy_reg_check` is a diagnostic register dump: it reads every word in broad
# MMIO windows and prints the values without using them to control hardware.
# Preserve those raw observations, but do not make diagnostic-only addresses
# part of the release register-model review debt.
non-operational-functions = ["archive:phy_reg_check"]

[registers.svd]
output = "../../../../svd/esp32s31-radio.svd"

[registers.pac]
output = "../../../../driver/chips/esp32s31/pac/src/lib.rs"
target = "none"
edition = "2024"

[registers.bindings]
output = "../../../../svd/esp32s31-radio.bindings.toml"
crate-name = "open_esp_radio_esp32s31_pac"

[registers.api]
pack = "registers/api.toml"

[registers.lints]
pack = "registers/lints.toml"

[registers.toml]
catalogs = [
    "registers/evidence/policy.toml",
    "registers/evidence/platform.toml",
    "registers/evidence/vendor-rom.toml",
    "registers/evidence/vendor-radio-libraries.toml",
    "registers/evidence/vendor-libpp.toml",
    "registers/evidence/vendor-net80211.toml",
    "registers/evidence/hil-open.toml",
    "registers/evidence/hil-vendor.toml",
    "registers/evidence/migration.toml",
]

[interfaces]
facts = "generated/findings/interfaces.json"
pack = "interfaces/reviewed.toml"

[functions]
pack = "functions/reviewed.toml"
profiles = ["rom-all", "archive-all"]

[functions.review]
output = "generated/reports/function-review.md"

[verification]
rust-prefix = "open_phy_trace_"
profiles = [
    "profiles/compiled-equivalence.toml",
    "profiles/libpp-sta-tsf-wakeup.toml",
    "profiles/libpp-tx-dma.toml",
    "profiles/rom-sta-tsf-snapshot.toml",
]
