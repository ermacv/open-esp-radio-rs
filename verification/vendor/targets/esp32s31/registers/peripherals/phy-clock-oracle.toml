schema = 2

[[peripherals]]
name = "PHY_CLOCK_ORACLE"
description = """
OPAQUE PHY clock-gate
        registers recovered from complete no-call ROM/blob leaves."""
baseAddress = 0x20100000

[[peripherals.registers]]

[peripherals.registers.register]
name = "FE_CLOCK_GATE_OPAQUE"
description = "ROM writes 0x1e7 to open and the blob writes zero to close."
addressOffset = 0x400
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "STATE"
description = "Complete observed front-end clock-gate images; constituent gate meanings remain unknown."
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint]
useEnumeratedValues = true

[[peripherals.registers.register.fields.enumeratedValues]]
usage = "write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "CLOSED"
value = 0

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "OPEN"
value = 487

[[peripherals.registers]]

[peripherals.registers.register]
name = "TABLE_MEMORY_INDEX_SOURCE"
description = "Shared word contains the table-memory base index and the complete phy_force_pwr_index controls."
addressOffset = 0x408
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "FORCED_POWER_INDEX"
description = "Complete phy_force_pwr_index replaces bits 22:17 with the low six bits of its second argument."
bitOffset = 17
bitWidth = 6

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3F

[[peripherals.registers.register.fields]]
name = "FORCE_POWER_ENABLE"
description = "Complete phy_force_pwr_index replaces bit 23 with the low bit of its first argument."
bitOffset = 23
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BASE_INDEX"
description = "Eight-bit table-memory base index; the complete front-end initializer writes 0xa0."
bitOffset = 24
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "FE_BB_CLOCK_CONTROL_OPAQUE"
description = "ROM sets bits 1:0 and the blob clears them."
addressOffset = 0x800
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ROM_FE_BB_ENABLE_UNKNOWN"
description = "Two-bit open/close mask; individual meanings are unknown."
bitOffset = 0
bitWidth = 2

[peripherals.registers.register.fields.writeConstraint]
useEnumeratedValues = true

[[peripherals.registers.register.fields.enumeratedValues]]
usage = "write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "CLOSED"
value = 0

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "OPEN"
value = 3

[[peripherals.registers.register.fields]]
name = "PHY_CALIBRATION_CLOCK_UNKNOWN"
description = "The phy_bb_init parent sets bit 2 before calibration; the individual hardware meaning remains unknown."
bitOffset = 2
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "BB_CLOCK_GATE_OPAQUE"
description = "ROM writes all ones to open and the blob writes zero to close."
addressOffset = 0x7C80
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "STATE"
description = "Complete observed baseband clock-gate images; constituent gate meanings remain unknown."
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint]
useEnumeratedValues = true

[[peripherals.registers.register.fields.enumeratedValues]]
usage = "write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "CLOSED"
value = 0

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "OPEN"
value = 4294967295

