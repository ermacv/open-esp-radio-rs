schema = 5
id = "access-point-single-client-load-rx"
description = "Observer-free sustained single-client AP inbound performance baseline"
repetitions = 1
transfer = "identical-image"
tags = ["characterization", "wifi", "access-point", "network", "single-client", "load", "rx"]

[wifi]
image = "performance"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1400
offer = { rx_bps = 16000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 15200000
