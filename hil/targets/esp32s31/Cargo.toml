[workspace]
resolver = "3"
members = [
    "board",
    "bootstrap",
    "runtime",
    "telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
# Pin the reviewed current-upstream xarxa base while the published embassy-net
# still uses smoltcp. The patch below unifies support crates with crates.io.
# Upstream Runner::run() drains ingress in one executor poll. The minimal
# fork adds the bounded work-conserving runner required to keep socket tasks
# schedulable under sustained packet-rate load.
embassy-net = { git = "https://github.com/ermacv/embassy.git", rev = "ab8d91a5ddd2d9a4596a74f4ea89acda66cace1d", features = ["auto-icmp-echo-reply", "dhcpv4", "dns", "icmp", "iface-egress-key-count-16", "medium-ethernet", "slaac", "tcp", "udp"] }
embassy-net-driver = { git = "https://github.com/ermacv/embassy.git", rev = "ab8d91a5ddd2d9a4596a74f4ea89acda66cace1d" }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "0.3"
embedded-io-async = "0.7.0"
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "81cd5c341f71f9d070b5d2b115d3ab2c7595a4df", default-features = false }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "81cd5c341f71f9d070b5d2b115d3ab2c7595a4df", default-features = false }
esp-sync = { git = "https://github.com/ermacv/esp-hal", rev = "81cd5c341f71f9d070b5d2b115d3ab2c7595a4df" }
log = { version = "0.4.27", features = ["max_level_trace", "release_max_level_info"] }
heapless = "0.9.3"
open-esp-radio = { path = "../../../driver/radio", default-features = false, features = ["wifi"] }
open-esp-radio-embassy-net = { path = "../../../driver/adapters/embassy-net" }
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../../driver/adapters/esp-hal/esp32s31-wifi" }
open-esp-radio-esp32s31-hal = { path = "../../../driver/chips/esp32s31/hal" }
open-esp-radio-esp32s31-embassy-runtime = { path = "../../../driver/adapters/embassy/esp32s31-platform", features = ["esp32s31"] }
open-esp-radio-esp32s31-embassy-wifi = { path = "../../../driver/integration/esp32s31/embassy-wifi" }
open-esp-radio-esp32s31-pac = { path = "../../../driver/chips/esp32s31/pac", features = ["validation-probes"] }
open-esp-radio-esp32s31-platform-pac = { path = "../../../driver/chips/esp32s31/platform-pac", features = ["esp32s31"] }
open-esp-radio-esp32s31-phy = { path = "../../../driver/chips/esp32s31/phy" }
open-esp-radio-esp32s31-wifi-mac = { path = "../../../driver/chips/esp32s31/wifi/mac" }
open-esp-radio-esp32s31-wifi-embassy = { path = "../../../driver/adapters/embassy/esp32s31-wifi" }
open-esp-radio-ieee80211 = { path = "../../../driver/wifi/ieee80211" }
open-esp-radio-wifi-sta = { path = "../../../driver/wifi/sta" }
open-esp-radio-wifi-embassy = { path = "../../../driver/adapters/embassy/wifi" }
open-esp-radio-hil-protocol = { path = "../../protocol" }
open-esp-radio-hil-esp32s31-telemetry = { path = "telemetry" }
portable-atomic = { version = "1.11", default-features = false }
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
static_cell = "2.1.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = true
panic = "abort"
strip = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "5b8b56036abd5f4646505b15988cc9da51cec826" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
