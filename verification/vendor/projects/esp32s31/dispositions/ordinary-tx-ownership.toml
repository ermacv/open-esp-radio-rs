schema = 3
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "libpp"
symbol = "hal_mac_txq_enable"
disposition = "bounded-feature"
protocol = "wifi"
rust-component = "oer_esp32s31_pac::WifiRadioRegisters::start_prepared_mac_tx"
binding = "v2"
rust-binding = "exact-production-entry"
rust-probe = "open_ordinary_tx_ownership_publish"
comparison-plan = "direct-effects-v1"
compare-return = false
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x20104d70 }
disposition = { kind = "required-when-observed" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x20104d70 }
