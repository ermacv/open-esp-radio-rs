schema = 2

[[peripherals]]
name = "BLUETOOTH_SCHEDULER_INTERRUPT_RUNTIME"
description = """
Scheduler words and the MAC diagnostic-signal pair transferred with
BLUETOOTH_INTERRUPT_BANK to the primary hard handler. The source-124 reference
gate samples scheduler BUSY through the diagnostic pair and can write a
complete zero image to SCHEDULER_REFERENCE; the later deferred-work
observation reads SCHEDULER_STATE. Task-side scheduler transactions borrow this
owner for their own BUSY samples, which serializes every selector write with
its value reads. Keeping this sparse physical view outside the task-side
controller partition prevents either owner from manufacturing an MMIO alias.
"""
baseAddress = 0x20101000

[[peripherals.registers]]
[peripherals.registers.register]
name = "SCHEDULER_REFERENCE"
description = "The source-124 handler can publish the complete zero image when bank-one source 3 observes an idle scheduler through the diagnostic BUSY sample. Other scheduler users compare bits 0..19 or publish complete images; upper encoding remains unknown."
addressOffset = 0x78
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "VALUE_LOW_20"
bitOffset = 0
bitWidth = 20
[[peripherals.registers.register.fields]]
name = "OPAQUE_HIGH_12"
bitOffset = 20
bitWidth = 12

[[peripherals.registers]]
[peripherals.registers.register]
name = "SCHEDULER_STATE"
description = "The source-124 handler reads this shared scheduler state before publishing deferred work. Its deferred-work predicate requires both STATE_29 and BUSY. The complete current-link-index leaf returns bits 23:20. Command transactions and the reference gate sample BUSY through DIAGNOSTIC_VALUE instead; other complete users consume or publish the low 20 and low 30 bits."
addressOffset = 0x7C
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "VALUE_LOW_20"
bitOffset = 0
bitWidth = 20
[[peripherals.registers.register.fields]]
name = "CURRENT_LINK_INDEX"
description = "Zero-based current scheduler hardware-list index returned by the complete current-link-index leaf."
bitOffset = 20
bitWidth = 4
[[peripherals.registers.register.fields]]
name = "OPAQUE_STATE_24_28"
bitOffset = 24
bitWidth = 5
[[peripherals.registers.register.fields]]
name = "STATE_29"
description = "Positional state sampled together with BUSY by the complete source-124 deferred-work predicate. Its independent hardware meaning remains unqualified."
bitOffset = 29
bitWidth = 1
[[peripherals.registers.register.fields]]
name = "OPAQUE_STATE_30"
bitOffset = 30
bitWidth = 1
[[peripherals.registers.register.fields]]
name = "BUSY"
bitOffset = 31
bitWidth = 1


[[peripherals.registers]]
[peripherals.registers.register]
name = "DIAGNOSTIC_SELECT"
description = "Bluetooth MAC diagnostic-signal selector. Each byte lane selects one eight-bit diagnostic signal returned in the same lane of DIAGNOSTIC_VALUE. Scheduler command paths and the source-124 reference gate publish the complete SCHEDULER_STATUS image before sampling scheduler BUSY."
addressOffset = 0x1E8
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "SELECTION"
description = "Complete observed selector images; only the images used by reviewed scheduler transactions are named."
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint]
useEnumeratedValues = true

[[peripherals.registers.register.fields.enumeratedValues]]
usage = "write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "SCHEDULER_STATUS"
description = "Lane zero selects the scheduler status signal; lanes one to three select signal zero."
value = 0x38

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "EXECUTION_MODIFY_PROGRESS"
description = "Lane zero selects signal 1 and lane one signal 12. Execution modify repeats its request while lane-zero bits 2:0 hold 2, or hold 3 with lane-one bits 5:4 equal to 1."
value = 0xC01

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "EXECUTION_MODIFY_SETTLE"
description = "Lane zero selects signal 7; lanes one to three select signal zero. Execution modify completes once the complete value differs from 9."
value = 0x7

[[peripherals.registers]]
[peripherals.registers.register]
name = "DIAGNOSTIC_VALUE"
description = "Diagnostic-signal values for the four DIAGNOSTIC_SELECT lanes. The value crosses from the MAC clock domain: readers accept a sample only when two consecutive complete reads are equal."
addressOffset = 0x1EC
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "VALUE_0_LOW_7"
bitOffset = 0
bitWidth = 7

[[peripherals.registers.register.fields]]
name = "VALUE_0_BIT_7"
description = "Bit 7 of the lane-zero signal. With SCHEDULER_STATUS selected it is scheduler BUSY, with the polarity of SCHEDULER_STATE.BUSY."
bitOffset = 7
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "VALUE_1"
bitOffset = 8
bitWidth = 8

[[peripherals.registers.register.fields]]
name = "VALUE_2"
bitOffset = 16
bitWidth = 8

[[peripherals.registers.register.fields]]
name = "VALUE_3"
bitOffset = 24
bitWidth = 8

