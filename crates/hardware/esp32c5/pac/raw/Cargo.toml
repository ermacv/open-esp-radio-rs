[package]
name = "oer-esp32c5-pac-raw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal svd2rust backend for the closed ESP32-C5 radio PAC"
publish = false

[features]
critical-section = ["dep:critical-section"]
validation-probes = []

[dependencies]
critical-section = { version = "1.2.0", optional = true }
oer-ieee80211-pac-raw = { path = "../../../ieee80211/pac/raw" }
vcell = "0.1.3"

[lints.rust]
# Generated svd2rust 0.37.1 code keeps operations inside `unsafe fn steal`
# without redundant inner blocks. This package contains generated code only.
unsafe_op_in_unsafe_fn = "allow"

[lints.clippy]
disallowed_methods = "deny"

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imac-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "hardware"
platform = "chip"
chip = "esp32c5"
