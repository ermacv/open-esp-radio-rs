[package]
name = "oer-ieee80211-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable Wi-Fi execution primitives: monitor handoffs, task shutdown, station network ownership and poll boundaries"

[features]
default = []

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
oer-memory = { path = "../../memory" }
oer-ieee80211-softmac = { path = "../../protocols/ieee80211/softmac" }
oer-time = { path = "../../time" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
oer-time-virtual = { path = "../../adapters/virtual/time" }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "runtime"
platform = "portable"
