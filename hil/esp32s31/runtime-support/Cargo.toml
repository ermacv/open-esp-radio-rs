[package]
name = "open-esp-radio-hil-esp32s31-runtime-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Scheduler-free Embassy executor used by ESP32-S31 radio HIL"

[dependencies]
embassy-executor.workspace = true
embassy-time-driver.workspace = true
embassy-time-queue-utils.workspace = true
esp-hal = { workspace = true, features = ["esp32s31", "rt", "unstable"] }
esp-sync = { workspace = true, features = ["esp32s31"] }
portable-atomic.workspace = true

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = "0.15"

[lints.rust]
unexpected_cfgs = "allow"
