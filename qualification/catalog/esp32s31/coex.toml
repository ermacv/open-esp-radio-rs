[[items]]
id = "coex-coexistence-policy-and-scheduler-ieee-802-15-4-operation-priorities"
section = "coex-coexistence-policy-and-scheduler"
title = "IEEE 802.15.4 operation priorities"
status = "partial"
level = "composed-product"
scope-and-limitations = "The [radio arbiter](../../hal/src/coex.rs) resolves the four IEEE 802.15.4 coexistence levels to priorities from the shared table, as `coex_ieee802154_pti_get` does. The [MAC scenes](../../hal/src/ieee802154/coex.rs) follow `ieee802154_set_txrx_pti` of ESP-IDF `7b9cc1ac`: the ACK PTI takes the middle level at MAC initialization, the TX/RX PTI the idle level, and each transmission, reception, energy detection and CCA switches it to its scene's level. The composition publishes the vendor default levels resolved from the table at start or at `update_coexistence`; a later change of the shared table is not re-read at each scene, and the OpenThread role-dependent TX/RX level is not applied."
packages = ["oer-esp32s31-hal"]

