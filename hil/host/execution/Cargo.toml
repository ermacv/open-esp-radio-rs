[package]
name = "oer-hil-execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL workload execution: the repetition context, failure classification, fixture cleanup evidence and profile reports"

[features]
# Test helpers for the runner's cross-package end-to-end tests.
test-support = [
    "oer-hil-scenario/test-support",
    "oer-hil-link/test-support",
    "oer-hil-stand/test-support",
]

[dependencies]
oer-hil-stand = { path = "../stand" }
oer-hil-link = { path = "../link" }
oer-hil-evidence = { path = "../evidence" }
oer-hil-scenario = { path = "../scenario" }
oer-hil-durable = { path = "../durable" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
oer-process = { path = "../../../tools/process" }
addr2line = { version = "=0.27.1", default-features = false, features = ["loader", "rustc-demangle"] }
tempfile = "3"
oer-hil-protocol = { path = "../../protocol", features = ["registry"] }
serialport = { version = "4.8.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
oer-hil-stand = { path = "../stand", features = ["test-support"] }
oer-hil-link = { path = "../link", features = ["test-support"] }
oer-hil-evidence = { path = "../evidence", features = ["test-support"] }
oer-hil-scenario = { path = "../scenario", features = ["test-support"] }
oer-ieee80211-trace = { path = "../../../crates/protocols/ieee80211/trace" }
oer-phy-trace = { path = "../../../crates/hardware/radio/trace" }
oer-ieee802154-trace = { path = "../../../crates/hardware/ieee802154/trace" }
postcard-schema = { version = "0.2.5", features = ["derive"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "host"
hil = "operation"
