[[peripherals]]
name = "SHARED_BASEBAND_TX_TIMING"
description = """
One physical baseband timing word reached by the common BTBB initializer.
The named vendor leaf carries a historical Zigbee prefix, but the current
evidence proves only the exact shared initialization transaction and does not
grant protocol-exclusive ownership."""
baseAddress = 0x20102010

[[peripherals.registers]]

[peripherals.registers.register]
name = "AUXILIARY_TX_ON_DELAY"
description = "The complete named setter replaces bits 16:26 with an encoded argument image and preserves every other bit."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ENCODED_IMAGE"
description = "The setter stores ((argument - 10) << 3) in this eleven-bit field; its low three bits therefore become zero."
bitOffset = 16
bitWidth = 11

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x7FF

