schema = 5
id = "access-point-single-client-load-bidirectional"
description = "Observer-free station-level balanced single-client AP performance baseline"
repetitions = 1
transfer = "identical-image"
tags = ["characterization", "wifi", "access-point", "network", "single-client", "load", "bidirectional"]

[wifi]
image = "performance"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 60
payload_bytes = 1472
offer = { rx_bps = 40000000, tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 35000000
minimum_tx_bps = 35000000
minimum_combined_bps = 72000000
