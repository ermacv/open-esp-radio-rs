[[enum-domains]]
name = "Ieee802154TxOnDelay"
description = "The sole transmit-on delay image accepted by the pinned ESP32-C5 IEEE 802.15.4 MAC initialization (ieee802154_txon_delay_set)."

[[enum-domains.values]]
name = "Delay40"
value = 40
description = "Literal ten-bit TXON_DELAY image written by ieee802154_txon_delay_set."
sources = ["C5_BLOB_LIBBTBB_IEEE802154_TXON_DELAY_SET"]

[[enum-domains]]
name = "Ieee802154TxOffDelay"
description = "The sole transmit-off delay image accepted by the pinned ESP32-C5 IEEE 802.15.4 MAC initialization (ieee802154_txon_delay_set)."

[[enum-domains.values]]
name = "Delay0"
value = 0
description = "Six-bit TXOFF_DELAY image cleared to zero by ieee802154_txon_delay_set."
sources = ["C5_BLOB_LIBBTBB_IEEE802154_TXON_DELAY_SET"]

[[enum-domains]]
name = "Ieee802154RxOnDelay"
description = "The sole receive-on delay image accepted by the pinned ESP32-C5 IEEE 802.15.4 MAC initialization (ieee802154_txon_delay_set)."

[[enum-domains.values]]
name = "Delay50"
value = 50
description = "Literal eleven-bit RXON_DELAY image written by ieee802154_txon_delay_set."
sources = ["C5_BLOB_LIBBTBB_IEEE802154_TXON_DELAY_SET"]

[[enum-domains]]
name = "Ieee802154TxRxSwitchDelay"
description = "The sole transmit/receive turnaround delay image accepted by the pinned ESP32-C5 IEEE 802.15.4 MAC initialization (ieee802154_txon_delay_set)."

[[enum-domains.values]]
name = "Delay122"
value = 122
description = "Literal ten-bit TXRX_SWITCH_DELAY image written by ieee802154_txon_delay_set."
sources = ["C5_BLOB_LIBBTBB_IEEE802154_TXON_DELAY_SET"]

