[[items]]
id = "wifi-802-11ax-he-mu-rts-mu-bar-multi-sta-ba"
section = "wifi-802-11ax-he"
title = "MU-RTS, MU-BAR, Multi-STA BA"
status = "absent"
level = "composed-product"
scope-and-limitations = "Trigger-type parsing alone is present. There is no complete scheduling, response, bitmap, timeout or retry owner for these exchanges."
