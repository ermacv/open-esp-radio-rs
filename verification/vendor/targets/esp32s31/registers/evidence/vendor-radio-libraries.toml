[[sources]]
id = "BLOB_LIBPHY_PHY_DEBUG_REG_CHECK"
description = "_oracles/libphy.a sha256 51497819736295c9b33d6775495dade4c6fb39db887edfe095608c670d9ae223; complete phy_debug.o phy_reg_check body, size 0x3d2. Its fixed loop bounds and block-name strings prove the half-open hardware dump ranges recorded in openEspRadioEvidenceRanges; they do not name individual registers."

[[sources]]
id = "BLOB_LIBPHY_PHY_DEBUG_I2C"
description = "_oracles/libphy.a sha256 51497819736295c9b33d6775495dade4c6fb39db887edfe095608c670d9ae223; complete phy_debug.o phy_i2c_check body, size 0x1f6. Its ten calls prove each logical bank name, block ID, selected host and half-open register-index range."

[[sources]]
id = "BLOB_LIBPHY_PHY_DEBUG_PBUS"
description = "_oracles/libphy.a sha256 51497819736295c9b33d6775495dade4c6fb39db887edfe095608c670d9ae223; complete phy_debug.o phy_pbus_print body, size 0xf4. Its finite calls and strings associate selector/path pairs with RFRX, RFTX, BB and DCO groups."

[[sources]]
id = "BLOB_LIBBTBB_BLE_TX_CONFIG_CHECK"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o ble_tx_config_check body, size 0x1c0. Its loads, masks and pinned field-name strings prove the BLE TX timing fields, including RF_ON_BT_DELAY and PA_ON_BT_DELAY in the canonical FECTRL word at 0x20100870."

[[sources]]
id = "BLOB_LIBBTBB_BT_CTE_ACCESSORS"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; bt_cte.o public getter/setter pairs. Matching independent masks provide instruction-exact CTE and BTAGC field geometry; these BT-only registers remain evidence for a separate canonical BT-radio SVD rather than duplicate singleton peripherals in this Wi-Fi-oriented map."

