# Operational lifecycle coverage is intentionally separate from the cheap
# navigation slices above.  The canonical linked profile follows every direct
# cross-archive edge rooted at the public controller, base-stack and BTDM task
# transactions.  This scope is not a publication gate until every reached
# MMIO fact has a reviewed owner and optional feature callbacks have been
# classified explicitly.
[[review.scopes]]
id = "ble-standalone-runtime-hardware"
protocols = ["ble"]
profiles = ["ble-controller-all"]
roots = [
    # Reached by the pinned public S31 outer enable glue through
    # btdm_lp_reset(true) -> esp_phy_enable/esp_btbb_enable. The wrapper source
    # proves reachability; this linked vendor body remains the effect authority.
    "ble-controller:bt_bb_v2_init_cmplx",
    # Complete S31 body corresponding to the ecosystem BLE PHY register-init
    # role. Keep it explicit until the reviewed indirect interface edge from
    # the public lifecycle is resolved by the canonical linked image.
    "ble-controller:r_sym_ble_3472b6bNiQdnWkYo6Ggv",
    # Complete positional address-slot writer. Named public- and random-address
    # callers prove two uses, while selector two remains intentionally unnamed.
    "ble-controller:r_sym_ble_ylitQQeG9NPtG1fXz4Tk",
    "ble-controller:r_ble_controller_init",
    "ble-controller:r_ble_controller_deinit",
    "ble-controller:r_base_stack_initEnv",
    "ble-controller:r_base_stack_enable",
    "ble-controller:r_base_stack_disable",
    "ble-controller:r_base_stack_deinitEnv",
    "ble-controller:r_btdm_task_init",
    "ble-controller:r_btdm_task_enable",
    "ble-controller:r_btdm_task_disable",
    "ble-controller:r_btdm_task_shutdown",
    "ble-controller:r_btdm_task_deinit",
]
include-reachable = true

[[review.scopes]]
id = "ble-direct-test-mode"
protocols = ["ble"]
profiles = ["ble-controller-all", "ble-dtm-rssi"]
roots = [
    # Complete transmitter and receiver command bodies reach allocation,
    # packet construction, event preparation and common scheduler insertion.
    "ble-controller:r_sym_ble_odiPxxFv9QenApESv5qy",
    "ble-controller:r_sym_ble_ssKOV2juzhIVJk3r8x6R",
    # Test End owns synchronous stop and teardown. The recycle callback is an
    # explicit root because the scheduler invokes it through a stored pointer,
    # so an ordinary direct-call traversal cannot prove that edge.
    "ble-controller:r_sym_ble_9DFKLYZzjaztWMiPU4NR",
    "ble-controller:r_sym_ble_kdHGLPeGDJlAvxmbjQ6e",
    # Archive-only public getter closes packet-result high byte -> signed RSSI
    # without retaining diagnostic/application glue in the controller image.
    "ble-diagnostics:esp_ble_get_dtm_rx_rssi",
    # The common worker publishes the finished-list mask through the broker,
    # and the BLE scheduler consumes it through another stored callback. Both
    # asynchronous ingress edges must be explicit or the scope loses the
    # hardware-completion half of the DTM lifecycle.
    "ble-controller:r_sym_bt_WHYoiw8ufY0AEM2KSRK1",
    "ble-controller:r_sym_ble_rmNuzAO8kQQQXQIpTzGZ",
]
include-reachable = true

# Legacy advertising has a different packet-engine and SRAM contract from
# Direct Test Mode.  Keep its builders, event scheduler and completion path in
# one independent research frontier so DTM's access address, channel lowering,
# timing and descriptor interpretations cannot leak into the advertising
# driver.  Same-chip public source establishes the role of these current
# symbols through object-section correspondence; the linked current artifact,
# not the old source, remains the authority for their behavior.
#
# esp_ble_adv_aa_setting is intentionally absent: the canonical linked image
# dead-strips that public setter.  Inspect it directly in libble_app.a member
# 94.o as inventory evidence; its environment write is not yet evidence of the
# hardware-consumed access-address layout or byte order.
[[review.scopes]]
id = "ble-legacy-nonconnectable-advertising"
protocols = ["ble"]
profiles = ["ble-controller-all"]
roots = [
    # Primary-channel PDU construction and role reset/start lifecycle.
    "ble-controller:r_sym_ble_MrW1ZaJZqsHzi3wwRhsn",
    "ble-controller:r_sym_ble_c9Zmr2aWmPOsZoITHDe9",
    "ble-controller:r_sym_ble_fxKAT8in6cXLv0gLB2W5",
    "ble-controller:r_sym_ble_fiiv8hEPVagnOAVa7EM2",
    "ble-controller:r_sym_ble_cfILxLFIWftw22I0zQab",
    "ble-controller:r_sym_ble_8UzoZYkzYu9MXbM1vyWN",
    # First/next primary event scheduling plus callback-owned recycling.
    "ble-controller:r_sym_ble_mqh4OXzoN59kvnkKFMA1",
    "ble-controller:r_sym_ble_77zgK6v8rbStzf0ReBjv",
    "ble-controller:r_sym_ble_pfcv0QVYrNS6KoQetydw",
    # Asynchronous hardware-finished ingress and BLE scheduler consumption.
    "ble-controller:r_sym_bt_WHYoiw8ufY0AEM2KSRK1",
    "ble-controller:r_sym_ble_rmNuzAO8kQQQXQIpTzGZ",
]
include-reachable = true

# Minimum hardware-admission slice for the first open Link Layer role. Root the
# actual packet producer, link-state producer and first-event producer instead
# of the broad all-feature start routine. Recycling is callback-owned, and the
# two common roots close the asynchronous hardware-finished edge, so all six
# must remain explicit. Broad allocation/start/reset and next-event policy stay
# in the larger investigation scope above; this slice answers only whether one
# prepared ADV_NONCONN_IND can cross CPU -> hardware -> CPU ownership without
# importing scan/connection policy.
[[review.scopes]]
id = "ble-legacy-nonconnectable-admission"
