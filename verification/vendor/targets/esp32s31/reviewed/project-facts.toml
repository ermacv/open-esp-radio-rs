[[assertions]]
id = "ieee802154.event-status.write-semantics"
subject = "register:esp32s31/cpu/0x20103064/32"
kind = "hardware-write-semantics"
value = "w1c"
note = "The pinned public LL reads the fourteen-bit event image and clears a requested mask by writing back the intersection of current status and that mask; its ISR samples the complete image and immediately clears that same image. This is the source-level W1C contract ported by the generated affine snapshot transaction. Reset-isolated timer and ED records independently observed selective one-bit clearing while retaining another latched bit. Concurrent same-bit arrival remains a hardware limitation of W1C acknowledgement, not a distinct software access model."

[[assertions.evidence]]
source = "esp-idf-7b9cc1ac-ieee802154-common-ll"
locator = "ieee802154_ll_clear_events"

