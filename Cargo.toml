[workspace]
members = [
    "hil/protocol",
    "driver/dma",
    "driver/radio",
    "driver/integration/network/embassy-net",
    "driver/integration/esp32s31/wifi-embassy",
    "driver/integration/esp32s31/wifi-esp-hal",
    "driver/wifi/sta",
    "driver/wifi/ieee80211",
    "driver/wifi/lmac",
    "driver/wifi/wpa2",
    "driver/esp32s31/hal",
    "driver/esp32s31/wifi/dma",
    "driver/esp32s31/wifi/lmac",
    "driver/esp32s31/wifi/sta",
    "driver/esp32s31/registers",
    "driver/esp32s31/phy",
    "driver/esp32s31/pac",
    "tools/hil-runner",
    "tools/capability-ledger",
    "tools/pac-gen",
    "tools/vendor-code-validator",
    "tools/vendor-code-validator/crates/backend-riscv",
    "tools/vendor-code-validator/crates/core",
    "tools/vendor-code-validator/crates/harness-esp32s31",
    "tools/vendor-code-validator/crates/harness-esp32s31-semantic",
    "tools/vendor-code-validator/crates/model",
    "tools/vendor-code-validator/crates/semantic",
]
exclude = [
    "driver/integration/esp32s31/embassy-runtime",
    "examples/esp32s31-station",
    "hil/esp32s31",
    "hil/vendor-oracle/esp32s31",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# The ESP32-S31 async-platform branch uses register accessor fixes that are
# still carried by the matching PAC fork.
[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "d0fb94ef3" }
