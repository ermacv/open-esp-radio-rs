[workspace]
members = [
    "hil/protocol",
    "driver/common/dma",
    "driver/radio",
    "driver/adapters/embassy-net",
    "driver/adapters/embassy/wifi",
    "driver/adapters/embassy/esp32s31-coex",
    "driver/adapters/embassy/esp32s31-wifi",
    "driver/adapters/esp-hal/esp32s31-wifi",
    "driver/wifi/ap",
    "driver/wifi/sta",
    "driver/wifi/ieee80211",
    "driver/wifi/softmac",
    "driver/wifi/wpa2",
    "driver/chips/esp32s31/hal",
    "driver/chips/esp32s31/coex",
    "driver/chips/esp32s31/wifi",
    "driver/chips/esp32s31/wifi/dma",
    "driver/chips/esp32s31/wifi/mac",
    "driver/chips/esp32s31/wifi/ap",
    "driver/chips/esp32s31/wifi/sta",
    "driver/chips/esp32s31/phy",
    "driver/chips/esp32s31/pac-raw",
    "driver/chips/esp32s31/pac",
    "hil/host/runner",
    "tools/qualification-check",
    "tools/memory-report",
    "tools/register-model",
    "tools/vendor-binary-workbench",
    "tools/vendor-binary-workbench/crates/backend-riscv",
    "tools/vendor-binary-workbench/crates/contracts",
    "tools/vendor-binary-workbench/crates/execution-model",
    "tools/vendor-binary-workbench/crates/harness-esp32s31",
    "tools/vendor-binary-workbench/crates/harness-esp32s31-semantic",
    "tools/vendor-binary-workbench/crates/analysis-model",
    "tools/vendor-binary-workbench/crates/semantics",
]
exclude = [
    "driver/adapters/embassy/esp32s31-platform",
    "driver/integration/esp32s31/embassy-wifi",
    "examples/esp32s31-station",
    "hil/targets/esp32s31",
    "verification/vendor/targets/esp32s31/oracle-firmware",
    "verification/vendor/targets/esp32s31/probes",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# Host-side binary analysis is prohibitively slow at dev opt-level 0. Keep a
# separate incremental profile for the normal workbench aliases so firmware
# development and unit tests retain their ordinary dev/release behavior.
[profile.workbench]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

# The ESP32-S31 async-platform branch uses register accessor fixes that are
# still carried by the matching PAC fork.
[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "d0fb94ef3" }
