[package]
name = "oer-devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Board discovery, serial consoles, resets, OpenOCD and receipted image writes under a device lock"

[features]
default = []
# Console and reset consumers do not need the espflash image writer.
image = ["dep:espflash", "dep:oer-chip-profile", "dep:oer-image-bundle", "dep:serde_json", "dep:tempfile"]

[dependencies]
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"], optional = true }
oer-chip-profile = { path = "../../chip-profile", optional = true }
oer-device-mac = { path = "../mac" }
oer-device-lock = { path = "../lock" }
oer-durable = { path = "../../durable" }
oer-image-bundle = { path = "../../image/bundle", optional = true }
oer-process = { path = "../../process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serialport = { version = "4.8.1", default-features = false }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
host-layer = "foundation"
test-feature-sets = ["image"]
host-app = "devices"
host-boundary = "library"
