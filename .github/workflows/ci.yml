name: CI

# Standard Cargo checks for every push to any branch. Pull requests come from
# branches of this repository, whose pushes already run this workflow.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A branch needs only its newest commit: rapid agent pushes cancel the run
# they supersede. On main, several sessions push every few minutes and
# `cargo xtask push` reads main's verdicts, so a started run completes and
# GitHub keeps only the newest push pending behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: '0'
  # A fresh runner has no Cargo cache; the repository configuration keeps
  # Cargo offline for local builds.
  CARGO_NET_OFFLINE: 'false'
  CARGO_TERM_COLOR: always

jobs:
  # The repository model every matrix below comes from: oer-tidy's chips
  # and workspaces, read from the tree as text.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      chips: ${{ steps.model.outputs.chips }}
      registers: ${{ steps.model.outputs.registers }}
      programs: ${{ steps.model.outputs.programs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: model
        run: |
          echo "chips=$(cargo tidy chips --json)" >> "$GITHUB_OUTPUT"
          # Register publications and qualification programs, by path.
          echo "registers=$(ls registers/*/publication/registers.toml | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "programs=$(ls qualification/targets/*/*.toml | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # The fast integrity tier: seconds of text checks over the whole tree.
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo tidy check

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format every workspace
        run: |
          # Every Cargo workspace, as oer-tidy discovers them.
          for manifest in $(cargo tidy workspaces)
          do
            echo "::group::$manifest"
            cargo fmt --all --manifest-path "$manifest" -- --check
            echo "::endgroup::"
          done

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      # The evaluator resolves HIL image sources with offline `cargo tree` in
      # the firmware workspaces, so their dependencies must be present.
      - name: Fetch every workspace
        run: cargo tidy fetch
      # Report every failing test binary in one run instead of the first.
      - run: cargo test --workspace --locked --no-fail-fast
      # The GATT application's `secure` module is off by default; test it too.
      - run: cargo test --locked --no-fail-fast -p oer-example-bluetooth-gatt --all-features
      - name: Declared test feature sets
        run: cargo xtask --verbose check feature-sets

  # Repository policy gates: locks, locked metadata and network dependency
  # boundaries.
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: policy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: policy-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose lock --check
      - run: cargo xtask --verbose check metadata
      - run: cargo xtask --verbose check network

  # Clippy for every production feature profile on the chip target, plus the
  # layer, facade, unsafe-code and PAC-access boundaries.
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: architecture-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: architecture-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose check architecture
      # A compile_fail doctest proves that publishing borrowed DMA memory
      # needs `unsafe`; the API exists only on the chip target.
      - name: Chip-target doctest
        run: |
          target=$(cargo tidy chips --json | jq -r '.[] | select(.id == "esp32s31") | .["rust-target"]')
          cargo test --doc --locked -p oer-esp32s31-soc-esp-hal --features axi-gdma-mem2mem --target "$target"

  # The final HIL images' runtimes type-checked exactly as the image builder
  # compiles them: target, features and the image compiler flags
  # (`-D large-assignments`, shared generics). Every class is type-checked
  # nightly.
  hil-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hil-images-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: hil-images-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose check firmware --class performance --class correctness --type-check

  # The ESP32-S31 examples, type-checked with the image compiler flags their
  # build uses; host tests cover application libraries.
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: access-point
            host-tests: true
          - example: monitor
          - example: station
          - example: thread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: example-${{ matrix.example }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: example-${{ matrix.example }}-${{ runner.os }}-
      - run: cargo xtask --verbose build firmware ${{ matrix.example }} --type-check
      - name: Host tests
        if: matrix.host-tests
        working-directory: examples/esp32s31/${{ matrix.example }}
        run: cargo test --lib --locked --target x86_64-unknown-linux-gnu

  # The ESP32-C5 workspaces: the HIL agent with each image's features and
  # the register probe. Cargo runs in each workspace for its target.
  esp32c5:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hil/targets/esp32c5/target
            verification/esp32c5/hardware/register-probe/target
          key: esp32c5-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: esp32c5-${{ runner.os }}-
      - name: HIL agent
        working-directory: hil/targets/esp32c5
        run: |
          for features in boot-smoke system-watchdog; do
            cargo clippy --locked --release -p oer-esp32c5-hil-agent --no-default-features --features "$features" -- -D warnings
          done
      - name: Register probe
        working-directory: verification/esp32c5/hardware/register-probe
        run: cargo build --locked --release

  # Every register publication: the model validates and the generated SVD,
  # bindings and PAC are what it yields.
  registers:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.plan.outputs.registers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: registers-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: registers-${{ runner.os }}-
      - run: cargo registers validate --manifest ${{ matrix.manifest }}
      - run: cargo registers generate --manifest ${{ matrix.manifest }} --check

  # The compiled PHY library and the ESP32-C5 PAC and HAL on their target.
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publication-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: publication-${{ runner.os }}-
      # `check phy` reads Cargo metadata offline, as every xtask check does.
      - name: Fetch every workspace
        run: cargo tidy fetch
      - name: ESP32-C5 PAC and HAL
        run: |
          target=$(cargo tidy chips --json | jq -r '.[] | select(.id == "esp32c5") | .["rust-target"]')
          cargo build --locked -p oer-esp32c5-pac -p oer-esp32c5-hal --target "$target"
      - run: cargo xtask --verbose check phy --chip esp32s31

  # Every qualification program: its catalogs and selection validate, and
  # the evaluator assesses its committed evidence.
  qualification:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        program: ${{ fromJSON(needs.plan.outputs.programs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: qualification-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: qualification-${{ runner.os }}-
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo qualification validate --manifest ${{ matrix.program }}
      - run: cargo qualification evaluate --manifest ${{ matrix.program }}

  # Blobray's RISC-V executor against the pinned RISC-V architectural tests,
  # with the Sail formal model as the reference. Needs clang and lld.
  isa-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/blobray/target
          key: isa-conformance-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', 'tools/blobray/cli/tests/riscv_conformance/inputs.toml') }}
          restore-keys: isa-conformance-${{ runner.os }}-
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose check isa-conformance

  # Both final HIL application images, their placement/stack audits and the
  # Blobray target audit. Needs espflash and the toolchain's LLVM tools.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ESPFLASH_VERSION: 4.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/espflash
            target
            tools/blobray/target
          key: images-${{ runner.os }}-${{ env.ESPFLASH_VERSION }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: images-${{ runner.os }}-${{ env.ESPFLASH_VERSION }}-
      - name: Install espflash
        run: |
          command -v espflash >/dev/null && espflash --version | grep -q "$ESPFLASH_VERSION" || {
            sudo apt-get update && sudo apt-get install -y libudev-dev
            cargo install --locked espflash --version "$ESPFLASH_VERSION"
          }
      - name: Put the toolchain's LLVM tools on PATH
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
      - name: Fetch every workspace
        run: cargo tidy fetch
      - run: cargo xtask --verbose check images
