[package]
name = "oer-esp32s31-bluetooth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-S31 Bluetooth hardware engine: controller HAL and time, BLE PHY, interrupts and scheduler primitives"

[features]
# Validation constructors that role crates' host tests build hardware from.
test-support = ["oer-esp32s31-hal/validation-probes"]
validation-probes = [
    "oer-esp32s31-hal/validation-probes",
    "oer-esp32s31-pac/validation-probes",
    "oer-esp32s31-phy/validation-probes",
]

[dependencies]
critical-section = "1.2.0"
embassy-sync = "0.8.0"
oer-bluetooth-hci = { path = "../../../../protocols/bluetooth/hci" }
oer-esp32s31-hal = { path = "../../hal" }
oer-esp32s31-bluetooth-memory = { path = "memory" }
oer-esp32s31-pac = { path = "../../pac" }
oer-esp32s31-phy = { path = "../../phy" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-futures = "0.1.2"
oer-esp32s31-hal = { path = "../../hal", features = ["validation-probes"] }
oer-esp32s31-pac = { path = "../../pac", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "chip"
chip = "esp32s31"
