description = "_oracles/esp32s31_rev0_rom.elf sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87; complete 120-byte he_max_apep_length object at 0x2f84fd40. Its three GI rows by ten MCS columns are [3700,7400,11100,14800,22500,30000,33600,37600,45000,50000], [3500,7000,10500,14000,21000,28200,31500,35200,42300,47000], and [3200,6400,9600,12800,19000,25200,28700,32000,37800,42000]. Complete BLOB_LIBPP_HE_AMPDU_LIMIT maps both 0.8-us GI selectors to row zero and consumes these values as u16 APEP byte ceilings."
