schema = 1
# Finite WDEVPWR hard-ISR boundary. Cause meanings and task-side policy remain
# opaque until independently qualified; this slice proves only STATUS/CLEAR.
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "libpp"
symbol = "hal_pwr_interrupt_get_event"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac::interrupt_snapshot::sample_mac_power_interrupt"
binding = "v1"
rust-probe = "open_libpp_power_irq_trace_hal_pwr_interrupt_get_event"
compare-return = true
effect-contract = "exact-effects-v1"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010d8bc }
disposition = { kind = "required" }

[[functions]]
source = "libpp"
symbol = "hal_pwr_interrupt_clr_event"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac::interrupt_snapshot::acknowledge_mac_power_interrupt"
binding = "v1"
rust-probe = "open_libpp_power_irq_trace_hal_pwr_interrupt_clr_event"
effect-contract = "exact-effects-v1"
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x2010d8c0 }
disposition = { kind = "required" }
