[package]
name = "oer-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable radio control, requests and role lifecycle"
readme = "README.md"

[features]
default = ["wifi"]
wifi = [
    "dep:oer-ieee80211",
    "dep:oer-wifi-ap",
    "dep:oer-wifi-softmac",
    "dep:oer-wifi-sta",
    "dep:oer-wpa2",
]
wifi-embassy = [
    "wifi",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:oer-wifi-embassy",
]

[dependencies]
embassy-futures = { version = "0.1.2", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
oer-ieee80211 = { path = "../protocols/ieee80211/mac", optional = true }
oer-wifi-ap = { path = "../protocols/ieee80211/ap", optional = true }
oer-wifi-softmac = { path = "../protocols/ieee80211/softmac", optional = true }
oer-wifi-sta = { path = "../protocols/ieee80211/sta", optional = true }
oer-wpa2 = { path = "../protocols/ieee80211/security/wpa2", optional = true }
oer-wifi-embassy = { path = "../adapters/embassy/ieee80211", optional = true }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "service"
platform = "portable"
