[workspace]
resolver = "3"
members = ["agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
debug_assert_with_mut_call = "deny"
# The repository `clippy.toml` lists methods radio code must not call.
disallowed_methods = "deny"

[workspace.dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
critical-section = "1.2.0"
embedded-io-async = "0.7.0"
heapless = "0.9.3"
oer-esp32c5-soc-esp-hal = { path = "../../../crates/adapters/esp-hal/esp32c5/soc", features = ["esp32c5"] }
oer-hil-protocol = { path = "../../protocol", default-features = false, features = ["async-io"] }
oer-hil-agent = { path = "../../agent", default-features = false }
oer-hil-image-keys = { path = "../../image-keys" }
static_cell = "2.1.1"
embassy-executor = { version = "0.10.0", default-features = false }
embassy-time = "0.5.1"
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "c771deb0fe584ddc9a1522eb2cf05abe955c2053", default-features = false, features = ["esp32c5"] }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "c771deb0fe584ddc9a1522eb2cf05abe955c2053", default-features = false, features = ["esp32c5", "unstable"] }
esp-rtos = { git = "https://github.com/ermacv/esp-hal", rev = "c771deb0fe584ddc9a1522eb2cf05abe955c2053", default-features = false, features = ["esp32c5", "embassy"] }

[profile.release]
debug = 2
opt-level = "s"
codegen-units = 1
lto = "fat"
