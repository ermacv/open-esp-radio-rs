schema = 5
id = "diagnostic-ap-single-client-udp-tx-psram-dma"
description = "Bounded single-client Wi-Fi TX DMA source-address proof with descriptors in SRAM and packet buffers in PSRAM"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "udp", "tx", "psram", "dma", "address-proof"]

[wifi]
image = "diagnostic-tx-architecture"

[wifi.datapath]
tx_buffer = "psram-direct-dma-diagnostic"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 8
payload_bytes = 1472
offer = { tx_bps = 10000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
