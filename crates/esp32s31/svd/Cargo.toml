[package]
name = "open-esp-radio-esp32s31-svd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "svd2rust-generated ESP32-S31 radio peripheral access crate"

[features]
critical-section = ["dep:critical-section"]

[dependencies]
critical-section = { version = "1.2.0", optional = true }
vcell = "0.1.3"

[lints.rust]
# Generated svd2rust 0.37.1 code keeps operations inside `unsafe fn steal`
# without redundant inner blocks. Driver-owned code retains the workspace
# warning.
unsafe_op_in_unsafe_fn = "allow"
