# Reviewed register evidence: vendor radio libraries.
schema = 1

[[sources]]
id = "C5_BLOB_LIBBTBB_IEEE802154_TXON_DELAY_SET"
description = "ESP32-C5 libbtbb.a of espressif/esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, sha256 9cbaf5bce18e6190dfab3213d2ecc65e2a5dd8bbde48bf5218dbbf47cc23da11; complete bt_bb_v2.o ieee802154_txon_delay_set body, size 0x42. It performs four ordered fresh-read RMW operations on the IEEE 802.15.4 MAC block and no other access: 0x600A3104 bits 9:0 become 40, 0x600A3114 bits 9:0 become 122, 0x600A3110 bits 10:0 become 50 and 0x600A310c bits 5:0 are cleared, each preserving every other bit."

[[sources]]
id = "C5_BLOB_LIBPHY_PHY_I2C"
description = "ESP32-C5 libphy.a of espressif/esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, sha256 dbf33c418c8d408d4005c849d12a1432deea82e2e5e57de3c8ddf914d104fffb, member phy_i2c.o sha256 1ee0c045732cbeeeac156f350b8c2c0fd8138cabb169c549427e449104774dbb. phy_chip_i2c_readReg and phy_chip_i2c_writeReg call phy_get_i2c_read_mask_ (read only) and phy_get_i2c_hostid_ between phy_i2c_enter_critical and phy_i2c_exit_critical. phy_get_i2c_hostid_ replaces 0x600AF820 bits 16:4 with 0x19C1 on every call, preserving the other bits, and returns host 1 for blocks 0x63, 0x65, 0x66, 0x68, 0x6A, 0x6B and 0x6E and host 0 otherwise. phy_get_i2c_read_mask_ returns, for blocks 0x61 to 0x6F, four times the halfword of CSWTCH.81 (0x40, 0, 0x4, 0, 0x400, 0x20, 0x1, 0x8, 0x80, 0x10, 0x2, 0x800, 0x100, 0x200, 0x1000) and zero outside that range. Both leaves then address block 0x65 when called with block 0x62. phy_chip_i2c_readReg_org writes the complement of the mask to 0x600AF81C, writes block | register << 8 | 1 << 26 to the host command word 0x600AF800 + 4 * host without waiting for idle, polls bit 25 until clear and returns bits 23:16. phy_chip_i2c_writeReg polls bit 25 of the host word until clear, writes block | register << 8 | data << 16 | 1 << 24 | 1 << 26 and polls bit 25 until clear. The ESP32-C5 rev 1.0 ROM (esp32c5_rev100_rom.elf of esp-rom-elfs 20260528) carries a phy_chip_i2c_readReg_org leaf identical to the archive one but a different phy_get_i2c_hostid_ (host 1 for blocks 0x62, 0x63, 0x6A, 0x6B and 0x6E, host map 0x1DE1); the archive definitions are the ones libphy links, so the archive values are the reviewed ones."

