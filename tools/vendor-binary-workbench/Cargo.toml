[package]
name = "open-radio-vendor-binary-workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "vendor-binary-workbench"
description = "Project-oriented analysis, reconstruction, publication and Rust conformance verification for compiled vendor binaries"

[[bin]]
name = "vendor-binary-workbench"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.48", features = ["derive"] }
clap_complete = "=4.5.58"
clap_mangen = "=0.2.30"
miette = { version = "=7.6.0", features = ["fancy"] }
open-radio-vendor-backend-riscv = { path = "crates/backend-riscv" }
open-radio-vendor-harness-esp32s31 = { path = "crates/harness-esp32s31" }
open-radio-vendor-harness-esp32s31-semantic = { path = "crates/harness-esp32s31-semantic" }
open-esp-radio-register-model = { path = "../register-model" }
open-radio-vendor-analysis-model = { path = "crates/analysis-model" }
open-radio-vendor-semantics = { path = "crates/semantics" }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
svd-parser = "=0.14.9"
svd-rs = { version = "=0.14.12", features = ["serde"] }
svd2rust = { version = "=0.37.1", default-features = false }
tabled = { version = "=0.21.0", default-features = false, features = ["std"] }
toml_edit = { version = "=0.25.13", features = ["serde"] }
thiserror = "=2.0.19"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[lints]
workspace = true
