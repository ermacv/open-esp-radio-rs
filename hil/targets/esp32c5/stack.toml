# The esp32c5's images are compiled with every image flag: frame records
# (`-Z emit-stack-sizes`, `-fstack-size-section`), the image linker and the
# move limit below with `-D large-assignments`.
#
# 8192 bytes: the esp32s31's 4096 rejects the system-watchdog agent, whose
# `#[esp_hal::main]` task moves its console future (4800 bytes: the HIL
# console's frame buffers inside the serving future) into the task once. The
# limit still refuses any move larger than two such futures; lowering it
# means keeping the console future in place (a static task) first.
#
# No stack is gated yet: the analysis needs the chip's ROM ELF, which
# `verification/esp32c5/artifacts.toml` does not pin, and esp-rtos runs the
# Embassy executor on its own task stacks, which no policy names.
max_move_bytes = 8192
