[workspace]
resolver = "3"
members = [
    "library",
    "elf",
    "register-library",
    "register-elf",
    "bluetooth-library",
    "bluetooth-elf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "7f914782f5c689a74f37df83b89a0827d3800323", default-features = false, features = ["esp32s31", "unstable"] }
open-esp-radio-esp32s31-wifi-embassy = { path = "../../../../../driver/adapters/embassy/esp32s31-wifi" }
open-esp-radio-esp32s31-radio-platform-esp-hal = { path = "../../../../../driver/adapters/esp-hal/esp32s31-radio-platform", features = ["esp32s31"] }
open-esp-radio-esp32s31-hal = { path = "../../../../../driver/chips/esp32s31/hal", features = ["validation-probes"] }
open-esp-radio-esp32s31-bluetooth = { path = "../../../../../driver/chips/esp32s31/bluetooth", features = ["validation-probes"] }
open-esp-radio-esp32s31-coex = { path = "../../../../../driver/chips/esp32s31/coex" }
open-esp-radio-esp32s31-pac = { path = "../../../../../driver/chips/esp32s31/pac", features = ["validation-probes"] }
open-esp-radio-esp32s31-phy = { path = "../../../../../driver/chips/esp32s31/phy" }
open-esp-radio-esp32s31-wifi-mac = { path = "../../../../../driver/chips/esp32s31/wifi/mac", features = ["validation-raw-dma"] }
open-esp-radio-esp32s31-wifi = { path = "../../../../../driver/chips/esp32s31/wifi" }
open-esp-radio-esp32s31-wifi-dma = { path = "../../../../../driver/chips/esp32s31/wifi/dma" }
open-esp-radio-wifi-softmac = { path = "../../../../../driver/wifi/softmac" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = true
panic = "abort"
strip = false

# Keep production probes on the same PAC revision as the repository workspace.
# This workspace is intentionally excluded from the root workspace, so Cargo
# does not inherit the root patch table automatically.
[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "d0fb94ef3" }
