[package]
name = "oer-hil-esp32c5-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The minimal image that proves the esp32c5 boot path: the ESP-IDF
# bootloader loads the application, which starts Embassy and wakes once on
# its timer.
boot-smoke = []
# The radio-free SoC image: the HIL protocol console, the SoC deadline
# watchdog and the reset-retained post-mortem, for the `system-watchdog`
# scenarios.
system-watchdog = [
    "dep:critical-section",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:heapless",
    "dep:oer-esp32c5-soc-esp-hal",
    "dep:oer-hil-protocol",
    "oer-hil-protocol?/system",
    "dep:oer-hil-target-core",
    "dep:oer-hil-image-keys",
    "dep:static_cell",
]

[dependencies]
embassy-executor.workspace = true
embassy-time.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-hal.workspace = true
esp-rtos.workspace = true
critical-section = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
oer-esp32c5-soc-esp-hal = { workspace = true, optional = true }
oer-hil-protocol = { workspace = true, optional = true }
oer-hil-target-core = { workspace = true, optional = true }
oer-hil-image-keys = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "chip"
chip = "esp32c5"
default-configuration = false
supported-feature-profiles = [
    "boot-smoke",
    "system-watchdog",
]
