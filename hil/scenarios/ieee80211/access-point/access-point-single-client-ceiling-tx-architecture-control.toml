schema = 5
id = "access-point-single-client-ceiling-tx-architecture-control"
description = "Direct-SRAM same-image control for invasive single-client TX architecture probes"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "single-client", "ht40", "split-core", "tx", "architecture", "control", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-tx-architecture"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 130000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
