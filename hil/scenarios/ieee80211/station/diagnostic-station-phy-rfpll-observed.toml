schema = 4
id = "diagnostic-station-phy-rfpll-observed"
description = "Fresh sensor acquisition followed by age-checked RFPLL evaluation within one station epoch during UDP delivery"
repetitions = 3
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["phy-maintenance", "diagnostic", "station", "pause", "udp", "ht40"]

[link]
