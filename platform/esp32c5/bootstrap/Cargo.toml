[package]
name = "oer-esp32c5-platform-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
oer-esp32c5-platform-layout.workspace = true
oer-espressif-staged-bootstrap = { path = "../../espressif/staged-bootstrap", features = ["esp32c5"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32c5"] }
esp-hal = { workspace = true, features = ["esp32c5", "static-interrupts", "rt", "unstable"] }
oer-esp32c5-platform-board = { path = "../board" }

[build-dependencies]
oer-esp32c5-platform-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "platform"
platform = "chip"
chip = "esp32c5"
