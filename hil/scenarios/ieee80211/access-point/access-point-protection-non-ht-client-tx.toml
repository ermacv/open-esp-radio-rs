schema = 5
id = "access-point-protection-non-ht-client-tx"
description = "HT40 AP UDP TX to the OpenWrt client while an associated non-HT laptop obliges the AP to protect HT PPDUs"
role = "investigation"
tags = ["wifi", "access-point", "protection", "udp", "tx", "ht40", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 1
boots = 1
timeout_seconds = 120
clients = { kind = "laptop-and-openwrt", laptop_phy = "non-ht" }

[wifi.workload.protection]
minimum_protected_ppdu_percent = 95

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 8000000 }

[wifi.workload.traffic.criteria]
exact_delivery = true
minimum_tx_bps = 15000000
minimum_bps_per_flow = 7500000
