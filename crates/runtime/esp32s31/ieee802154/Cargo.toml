[package]
name = "oer-esp32s31-ieee802154-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 IEEE 802.15.4 radio runtime over the ported MAC engine"

[dependencies]
embassy-sync = "0.8.0"
oer-esp32s31-hal = { path = "../../../hardware/esp32s31/hal" }
oer-esp32s31-ieee802154 = { path = "../../../hardware/esp32s31/driver/ieee802154" }
oer-esp32s31-ieee802154-radio = { path = "../../../roles/esp32s31/ieee802154/radio" }
oer-ieee802154 = { path = "../../../protocols/ieee802154" }

[dev-dependencies]
embassy-futures = "0.1.2"
oer-esp32s31-hal = { path = "../../../hardware/esp32s31/hal", features = ["ll-model"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "runtime"
platform = "chip"
chip = "esp32s31"
