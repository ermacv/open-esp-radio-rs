schema = 5
id = "diagnostic-ap-mixed-tx-work"
description = "Saturated AP aggregates plus isolated sparse-peer MPDUs with separate transmission-work evidence"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "access-point", "multi-client", "ht40", "aggregation"]

[wifi]
image = "diagnostic-task-poll"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 1
boots = 1
timeout_seconds = 150
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 12
payload_bytes = 1472
offer = { tx_bps = 130000000 }

[wifi.workload.traffic.secondary]
tx_bps = 235520
tx_pacing_group_datagrams = 1

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
minimum_bps_per_flow = 1
maximum_secondary_tx_interarrival_ms = 250
minimum_secondary_tx_datagrams = 200
