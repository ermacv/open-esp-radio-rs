[package]
name = "oer-hil-target-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Chip-independent HIL target logic shared by the firmware runtime and its host tests"

[features]
default = []
bluetooth = ["dep:bt-hci", "dep:embassy-futures", "dep:embedded-io-async"]
secure-gatt = ["bluetooth", "dep:gatt-application", "dep:trouble-host"]
# Exactly one network stack, as in the HIL runtime that selects this crate's
# `embassy_net` alias.
upstream-network = ["dep:embassy-net-upstream", "dep:xarxa"]
embassy-network = ["dep:embassy-net-released"]
owned-network = ["dep:embassy-net-owned", "dep:xarxa-owned"]

[dependencies]
embassy-sync = "0.8.0"
oer-hil-protocol = { path = "../protocol", features = ["async-io"] }
bt-hci = { version = "=0.10.1", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
gatt-application = { package = "oer-example-bluetooth-gatt", path = "../../examples/bluetooth-gatt", optional = true, features = ["secure"] }
trouble-host = { version = "=0.8.0", git = "https://github.com/ermacv/trouble", rev = "a6af435ba1539cead0afce04718ad8a089bcc4b9", optional = true, default-features = false, features = ["default-packet-pool", "gatt", "peripheral"] }
# The same stack pins and features as the HIL target workspace.
embassy-net-upstream = { package = "embassy-net", git = "https://github.com/embassy-rs/embassy", rev = "c0fdd08e94138105fba8be3133c4ced91afc30fc", optional = true, features = ["icmp-ping-reply", "dhcpv4", "medium-ethernet", "tcp-listener", "udp"] }
embassy-net-released = { package = "embassy-net", version = "0.9.1", optional = true, default-features = false, features = ["auto-icmp-echo-reply", "dhcpv4", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
embassy-net-owned = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "1fa0957c07398f83c9795b645a5a6ceda1270f91", optional = true, default-features = false, features = ["auto-icmp-echo-reply", "dhcpv4", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
xarxa-owned = { package = "xarxa", git = "https://github.com/ermacv/xarxa.git", rev = "0d41d8e80cb617d355cf6981b6ff76635c44cadc", optional = true, default-features = false, features = ["udp-rx-queue-count-16"] }
# One network poll drains up to 16 driver RX owners before sockets can run.
xarxa = { git = "https://github.com/embassy-rs/xarxa", rev = "14c369bbcbe8ee7167488ac9c9e18be059d83555", optional = true, default-features = false, features = ["udp-rx-queue-count-16"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }
embedded-io = "0.7.1"
oer-bluetooth-hci = { path = "../../crates/protocols/bluetooth/hci" }
oer-embassy-net-upstream = { path = "../../crates/adapters/embassy-net/upstream" }
oer-xarxa-upstream = { path = "../../crates/adapters/xarxa/upstream" }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "portable"
