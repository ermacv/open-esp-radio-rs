[package]
name = "oer-example-bluetooth-gatt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Portable Trouble GATT application shared by the Bluetooth example and HIL firmware"
readme = "README.md"

[features]
default = []
# LE Secure Connections numeric comparison, bonding and encrypted access.
secure = [
    "trouble-host/security",
    "dep:embassy-futures",
    "dep:embedded-io-async",
    "dep:heapless",
]

[dependencies]
bt-hci = "=0.10.1"
embassy-sync = "0.8.0"
embassy-futures = { version = "0.1.2", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
heapless = { version = "0.9", optional = true }
trouble-host = { version = "=0.8.0", git = "https://github.com/ermacv/trouble", rev = "a6af435ba1539cead0afce04718ad8a089bcc4b9", default-features = false, features = ["default-packet-pool", "gatt", "peripheral"] }

[dev-dependencies]
oer-bluetooth-hci = { path = "../../crates/protocols/bluetooth/hci" }
embassy-futures = "0.1.2"
critical-section = { version = "1.2.0", features = ["std"] }
# Trouble links against the embassy-time driver; host tests use the std one.
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "application"
platform = "portable"
