[package]
name = "oer-esp32s31-wifi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Role-neutral ESP32-S31 Wi-Fi device composition"

[dependencies]
oer-esp32s31-hal = { path = "../../hal" }
oer-esp32s31-phy = { path = "../../phy" }
oer-esp32s31-wifi-dma = { path = "dma" }
oer-esp32s31-wifi-mac = { path = "mac" }
oer-ieee80211 = { path = "../../../../protocols/ieee80211/mac" }
oer-wifi-softmac = { path = "../../../../protocols/ieee80211/softmac" }

[features]
default = []
task-poll-telemetry = [
    "dep:riscv",
    "oer-esp32s31-wifi-mac/task-poll-telemetry",
]

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "chip"
chip = "esp32s31"
