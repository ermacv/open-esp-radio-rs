schema = 3
# Finite WDEVPWR hard-ISR boundary. Cause meanings and task-side policy remain
# opaque until independently qualified; this slice proves only STATUS/CLEAR.
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "libpp"
symbol = "hal_pwr_interrupt_get_event"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac_raw::interrupt_snapshot::sample_mac_power_interrupt"
binding = "v2"
rust-binding = "exact-production-entry"
rust-probe = "open_libpp_power_irq_trace_hal_pwr_interrupt_get_event"
comparison-plan = "direct-effects-v1"
compare-return = true
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010d8bc }
disposition = { kind = "required" }

[[functions]]
source = "libpp"
symbol = "hal_pwr_interrupt_clr_event"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac_raw::interrupt_snapshot::acknowledge_mac_power_interrupt"
binding = "v2"
rust-binding = "exact-production-entry"
rust-probe = "open_libpp_power_irq_trace_hal_pwr_interrupt_clr_event"
comparison-plan = "direct-effects-v1"
effect-contract = "exact-effects-v2"
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x2010d8c0 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "fence", fm = 0, predecessor = 15, successor = 15 }
disposition = { kind = "rust-addition", value = "device-ordering" }
