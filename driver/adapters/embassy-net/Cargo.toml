[package]
name = "open-esp-radio-embassy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded, owned Ethernet frame boundary between open ESP radio tasks and embassy-net"

[features]
default = []
# Exposes the exact pre-publication edge only to diagnostic compositions.
diagnostics = []
# Intrusive per-datagram Core1 cycle/instruction accounting. Diagnostic HIL
# images enable this explicitly; production adapters do not.
tx-phase-telemetry = ["dep:riscv"]
# Same-image HIL discriminator for the proposed contended-TX ownership
# boundary. Production images do not compile this branch.
tx-staging-copy-probe = []

[dependencies]
embassy-net-driver = { git = "https://github.com/ermacv/embassy.git", rev = "51c3eb0b7e64921246007af1357f3d9f44bfe466" }
embassy-sync = "0.8.0"
open-esp-radio-dma = { path = "../../common/dma" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[dev-dependencies]
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-std"] }
embassy-net = { git = "https://github.com/ermacv/embassy.git", rev = "51c3eb0b7e64921246007af1357f3d9f44bfe466", features = ["icmp", "medium-ethernet", "proto-ipv4", "std"] }
embassy-time = { version = "0.5.0", features = ["std"] }

[lints]
workspace = true
