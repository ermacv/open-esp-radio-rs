schema = 4
id = "diagnostic-station-absence-unannounced-delivery-rx"
description = "10 ms synthetic physical absence with unannounced AP notification during RX UDP delivery"
repetitions = 1
image = "diagnostic-rx-delivery"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[link]
phy = "ht40"

[workload]
kind = "udp"
direction = "rx"
duration_seconds = 12
rx_rate_bps = 65000000
payload_bytes = 1200
station_pause = { synthetic = { duration_micros = 10000, notify_ap = false } }

[criteria]
exact_delivery = false
minimum_rx_bps = 10000000
require_no_beacon_loss = true
