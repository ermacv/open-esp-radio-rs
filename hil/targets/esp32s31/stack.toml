schema = 5
# The production policy applies to the HIL images too. They alone start the
# second core.
extends = "../../../platform/esp32s31/stack.toml"

# `_runtime_enter_cpu1_psram` switches CPU1 to the top of this stack and
# tail-calls `runtime_cpu1_psram_main`, which runs CPU1's executor for good.
# Only images with the Wi-Fi harness (the platform runtime's `multicore`
# feature) link the stack; a single-core HIL image reports it as not linked.
[cpu1_task_stack]
root = "runtime_cpu1_psram_main"
storage_symbol = "__open_radio_cpu1_task_stack"
minimum_free_bytes = 4096
optional = true
