[package]
name = "open-esp-radio-hil-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared HIL evidence contract: observer build identity and canonical scenarios"

[features]
# Cargo-running operations used by the evidence producer and repository tools.
producer = ["dep:oer-process", "dep:toml_edit"]

[dependencies]
oer-process = { path = "../../tools/process", optional = true }
serde_json = "1.0"
toml_edit = { version = "=0.25.13", optional = true, features = ["serde"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "host"
