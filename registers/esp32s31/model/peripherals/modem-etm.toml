schema = 2

[[peripherals]]
name = "MODEM_ETM"
description = """
ESP32-S31 modem event-task matrix at MODEM_BASE + 0x8800, shared by the
IEEE 802.15.4 and Bluetooth lifecycles. The public IEEE 802.15.4 driver names
the channel-enable, set and clear words and the per-channel event/task pair
at an eight-byte stride, and programs channels zero and one; the BTDM runtime
programs channels four through seven through the same words. Channel bits and
identifiers without a reviewed user remain absent and no reset values are
claimed."""
baseAddress = 0x20108800

[[peripherals.registers]]

[peripherals.registers.register]
name = "CHANNEL_ENABLE"
description = "Channel-enable status word. The IEEE 802.15.4 driver reads it to decide whether a channel must be disabled; the BTDM runtime reads the complete word."
addressOffset = 0x000
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "CH0"
description = "Channel 0 is enabled."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH1"
description = "Channel 1 is enabled."
bitOffset = 1
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH4"
description = "Channel 4 is enabled."
bitOffset = 4
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH5"
description = "Channel 5 is enabled."
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH6"
description = "Channel 6 is enabled."
bitOffset = 6
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH7"
description = "Channel 7 is enabled."
bitOffset = 7
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "CHANNEL_ENABLE_SET"
description = "Channel-enable set word. The IEEE 802.15.4 driver writes it back with the selected channel bit added; the BTDM runtime writes complete channel images."
addressOffset = 0x004
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "CH0"
description = "Enable channel 0."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH1"
description = "Enable channel 1."
bitOffset = 1
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH4"
description = "Enable channel 4."
bitOffset = 4
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH5"
description = "Enable channel 5."
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH6"
description = "Enable channel 6."
bitOffset = 6
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH7"
description = "Enable channel 7."
bitOffset = 7
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "CHANNEL_ENABLE_CLEAR"
description = "Channel-enable clear word. The IEEE 802.15.4 driver writes it back with the selected channel bit added; the BTDM runtime writes complete single-channel images."
addressOffset = 0x008
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "CH0"
description = "Disable channel 0."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH1"
description = "Disable channel 1."
bitOffset = 1
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH4"
description = "Disable channel 4."
bitOffset = 4
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH5"
description = "Disable channel 5."
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH6"
description = "Disable channel 6."
bitOffset = 6
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CH7"
description = "Disable channel 7."
bitOffset = 7
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
dim = 8
dimIncrement = 0x8
dimIndex = "0,1,2,3,4,5,6,7"
name = "CH%s_EVENT"
description = "Complete event identifier monitored by the selected channel."
addressOffset = 0x00c
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ID"
description = "Event identifier written as a complete word."
bitOffset = 0
bitWidth = 32

[[peripherals.registers.register.fields.enumeratedValues]]
usage = "read-write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "IEEE802154_TIMER1_OVERFLOW"
value = 79

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "IEEE802154_TIMER0_OVERFLOW"
value = 80

[[peripherals.registers]]

[peripherals.registers.register]
dim = 8
dimIncrement = 0x8
dimIndex = "0,1,2,3,4,5,6,7"
name = "CH%s_TASK"
description = "Complete task identifier triggered when the selected channel's event occurs."
addressOffset = 0x010
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ID"
description = "Task identifier written as a complete word."
bitOffset = 0
bitWidth = 32

[[peripherals.registers.register.fields.enumeratedValues]]
usage = "read-write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
