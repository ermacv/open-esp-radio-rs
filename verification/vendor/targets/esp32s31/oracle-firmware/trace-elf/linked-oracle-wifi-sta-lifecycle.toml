# Focused link truth for the connected-STA lifecycle. Unlike the independent
# archive inventories this unit lets normal archive extraction resolve
# libnet80211 -> libpp calls in the order used by the product link.
schema = 1
source = "wifi-sta-lifecycle"
linker-scripts = [
    "../../../../../../hil/targets/esp32s31/linker/rom/esp32s31-eco0.x",
    "link.x",
]
archives = [
    "../../../../../../_oracles/libnet80211.a",
    "../../../../../../_oracles/libpp.a",
]
entry-symbols = [
    "ieee80211_sta_new_state",
    "cnx_sta_pm",
    "pm_start",
    "pm_set_beacon_filter",
    "hal_set_sta_beacon_filter",
    "hal_enable_sta_beacon_filter",
    "hal_disable_sta_beacon_filter",
]
stub-symbols = [
    "__adddf3",
    "__clzsi2",
    "__ctzsi2",
    "__extendsfdf2",
    "__ffssi2",
    "__fixdfsi",
    "__floatsidf",
    "__floatundisf",
    "__floatunsidf",
    "__muldf3",
    "__popcountsi2",
    "__popcountdi2",
    "__bswapsi2",
    "__subdf3",
    "__truncdfsf2",
    "__udivdi3",
    "__umoddi3",
]
emit-relocations = true
gc-sections = false
unresolved-symbols = "ignore-all"
