[package]
name = "oer-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["image", "device"]
device = ["dep:fs2", "dep:serialport", "dep:sha2"]
image = ["dep:open-esp-radio-memory-report", "dep:oer-process", "dep:sha2"]

[dependencies]
fs2 = { version = "0.4", optional = true }
serialport = { version = "4.8.1", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
open-esp-radio-memory-report = { path = "../memory-report", optional = true }
oer-process = { path = "../process", optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
