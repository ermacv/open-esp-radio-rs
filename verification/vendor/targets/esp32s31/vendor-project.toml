# Shareable project entry point. Local artifact paths belong in an untracked
# run spec passed with --run-spec, or in a private copy referenced here.
schema = 3
id = "esp32s31-radio-rev0"
target-spec = "target.toml"
ecosystem-packs = ["../../knowledge/espressif/radio.toml"]
chip-pack = "chip.toml"
verification-addon = "verification-addon.toml"

[reviewed-knowledge]
packs = ["reviewed/ieee802154.toml"]

[analysis.symbols]
output = "generated/findings/symbols.json"

[analysis.navigation]
output = "generated/findings/navigation.json"

[code]
pack = "code/boundaries.toml"

[code.review]
output = "generated/reports/code-boundaries.md"

[[analysis.ir]]
id = "rom-all"
sources = ["rom"]
roots = "all"
include-reachable = true
entry-contract = "esp32s31-phy-registered"
output = "generated/findings/rom-all.ir"

[[analysis.ir]]
id = "archive-all"
sources = ["archive"]
roots = "all"
include-reachable = true
entry-contract = "esp32s31-phy-registered"
output = "generated/findings/archive-all.ir"

[[analysis.ir]]
id = "libpp-all"
sources = ["libpp"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/libpp-all.ir"

[[analysis.ir]]
id = "libnet80211-all"
sources = ["libnet80211"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/libnet80211-all.ir"

# Canonical cross-library image for the AP data path.  The separate libpp and
# libnet80211 images remain useful for archive-local provenance, but cannot
# resolve calls that cross their link boundary.  This existing combined image
# contains both sides and therefore owns call-order analysis for AP RX/TX.
[[analysis.ir]]
id = "wifi-ap-data-path"
sources = ["wifi-sta-ap-receive"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/wifi-ap-data-path.ir"

[[analysis.ir]]
id = "wifi-sta-lifecycle"
sources = ["wifi-sta-lifecycle"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/wifi-sta-lifecycle.ir"

[[analysis.ir]]
id = "wifi-key-role"
sources = ["wifi-key-role"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/wifi-key-role.ir"

[[analysis.ir]]
id = "coex-all"
sources = ["coex"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/coex-all.ir"

[[analysis.ir]]
id = "btbb-all"
sources = ["btbb"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/btbb-all.ir"

# Canonical derived view of the standalone BLE controller boundary.  The
# authenticated archives remain the observed source; this linked unit exists
# to preserve cross-archive call identity and ordering for semantic analysis.
[[analysis.ir]]
id = "ble-controller-all"
sources = ["ble-controller"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/ble-controller-all.ir"

# Small lifecycle and interface views remain cheap navigation slices.  They do
# not claim register coverage; ble-controller-all owns the complete lazy pass
# used to derive controller MMIO shapes and candidate field partitions.
[[analysis.ir]]
id = "ble-controller-lifecycle"
sources = ["ble-controller"]
roots = "symbol-prefix"
symbol-prefix = "r_ble_controller_"
include-reachable = false
entry-contract = "none"
output = "generated/findings/ble-controller-lifecycle.ir"

[[analysis.ir]]
id = "ble-hci-transport"
sources = ["ble-controller"]
roots = "symbol-prefix"
symbol-prefix = "r_ble_hci_trans_"
include-reachable = false
entry-contract = "none"
output = "generated/findings/ble-hci-transport.ir"

[[analysis.ir]]
id = "ble-npl-boundary"
sources = ["ble-controller"]
roots = "symbol-prefix"
symbol-prefix = "r_ble_get_npl_"
include-reachable = false
entry-contract = "none"
output = "generated/findings/ble-npl-boundary.ir"

[[analysis.ir]]
id = "ble-npl-layout"
sources = ["ble-controller"]
roots = "symbol-prefix"
symbol-prefix = "r_ble_ll_get_npl_"
include-reachable = false
entry-contract = "none"
output = "generated/findings/ble-npl-layout.ir"

[[analysis.ir]]
id = "ble-stack-lifecycle"
sources = ["ble-controller"]
roots = "symbol-prefix"
symbol-prefix = "r_base_stack_"
include-reachable = false
entry-contract = "none"
output = "generated/findings/ble-stack-lifecycle.ir"

[[analysis.ir]]
id = "ble-task-lifecycle"
sources = ["ble-controller"]
roots = "symbol-prefix"
symbol-prefix = "r_btdm_task_"
include-reachable = false
entry-contract = "none"
output = "generated/findings/ble-task-lifecycle.ir"

# Focused IEEE 802.15.4 discovery surfaces over the authenticated BTBB and
# coexistence artifacts. Keep the public esp_ieee802154_ controller family out
# of executable analysis until its matching linked ESP-IDF image exists. The
# existing artifact-wide profiles remain the function/register inventory
# authority; these focused profiles only bound human-sized review scopes.
[[analysis.ir]]
id = "ieee802154-btbb"
sources = ["btbb"]
roots = "symbol-prefix"
symbol-prefix = "ieee802154_"
include-reachable = true
entry-contract = "none"
output = "generated/findings/ieee802154-btbb.ir"

[[analysis.ir]]
id = "ieee802154-zb"
sources = ["btbb"]
roots = "symbol-prefix"
symbol-prefix = "zb_"
include-reachable = true
entry-contract = "none"
output = "generated/findings/ieee802154-zb.ir"

[[analysis.ir]]
id = "ieee802154-coex"
sources = ["coex"]
roots = "symbol-prefix"
symbol-prefix = "esp_coex_ieee802154_"
include-reachable = true
entry-contract = "none"
output = "generated/findings/ieee802154-coex.ir"

[registers]
