title = "Wi-Fi inventory contract"
source-document = "crates/hardware/esp32s31/driver/ieee80211/FEATURES.md"
overview = "See the [whole-radio capability map](../FEATURES.md) for shared ownership,\nclock/power lifecycle and cross-protocol composition limits.\n\nThis document describes the source-owned production boundary. It is not a\ncopy of the chip data sheet and it is not a hardware-qualification claim.\nRegister setters, frame parsers, diagnostics, and host-only state machines do\nnot establish an implemented feature unless the production owner graph carries the operation to, or from, the physical MAC boundary.\n\nImplementation status applies only to the exact feature named by each row.\n`IMPLEMENTED` is a source-composition claim, not a hardware test result.\nA software substitute, a cold register default, or a parser for one input does\nnot raise the status of the hardware/protocol feature itself. Role, security,\nchannel, and PHY scopes are explicit and are not inherited between rows.\n\nThe status terms are:\n\n- **IMPLEMENTED**: a bounded production path owns the complete operation for the\n  scope stated in that row;\n- **PARTIAL**: a source subset exists, but the named feature lacks a complete\n  production owner or covers only the stated role/security/PHY subset;\n- **FAIL-CLOSED**: a typed production path intentionally stops before\n  activation or publication because required evidence is missing;\n- **ABSENT**: there is no production protocol owner for the operation.\n\nThe [qualification specification](../../../../../qualification/targets/esp32s31/wifi-sta.toml)\ncontrols readiness and required hardware evidence independently.\nIts `rx-tx-dma` capability also carries the machine-readable\n[source contracts](../../../../../qualification/README.md#source-contracts) for\nSRAM/PSRAM DMA, descriptor chaining, scatter/gather and cache handoff. Those\nentries distinguish production, diagnostic and unimplemented compositions.\n\nSource ownership follows the [chip STA composition](sta/README.md),\n[AP engine](ap/src/engine.rs), [MAC TX](mac/src/tx.rs) and\n[MAC RX](mac/src/rx.rs). [Local STA](sta/src/profile.rs) and\n[AP](ap/src/profile.rs) profiles select advertisements. Portable codecs and\nrole policy remain in [`crates/protocols/ieee80211`](../../../../protocols/ieee80211/README.md);\nconcrete execution belongs to the [Embassy runtime](../../../../runtime/README.md).\n\nThe hardware scope follows the [ESP32-S31 datasheet v0.5, section 4.3.2](https://www.espressif.com/sites/default/files/documentation/esp32-s31_datasheet_en.pdf).\nThe [S31 ESP-IDF Wi-Fi API](https://docs.espressif.com/projects/esp-idf/en/latest/esp32s31/api-reference/network/esp_wifi.html)\nalso describes vendor protocol/API surfaces such as NAN/USD, CSI and LR;\nthese are inventory inputs, not evidence of open-driver support. Hardware\ncrypto engines and software authentication protocols are separate boundaries.\nHE40 and HE SoftAP are outside the documented silicon scope: HE is 20 MHz-only\nnon-AP. Their absence is not an unfinished supported hardware mode."
source-paths = ["crates/hardware/esp32s31/driver/FEATURES.md","crates/hardware/esp32s31/driver/ieee80211/ap/src/engine.rs","crates/hardware/esp32s31/driver/ieee80211/ap/src/profile.rs","crates/hardware/esp32s31/driver/ieee80211/mac/src/rx.rs","crates/hardware/esp32s31/driver/ieee80211/mac/src/tx.rs","crates/hardware/esp32s31/driver/ieee80211/sta/README.md","crates/hardware/esp32s31/driver/ieee80211/sta/src/profile.rs","crates/protocols/ieee80211/README.md","crates/runtime/README.md","qualification/README.md","qualification/targets/esp32s31/wifi-sta.toml"]

[[sections]]
id = "wifi-qualification-scope"
domain = "wifi"
title = "Qualification scope"
source-document = "crates/hardware/esp32s31/driver/ieee80211/FEATURES.md"
overview = "The [STA program](../../../../../qualification/targets/esp32s31/wifi-sta.toml)\nqualifies the connected STA composition, not every AP, ESP-NOW or silicon row\nin this inventory. Its `channel-selection-switch` scope and shared\n`rf-bb-initialization` dependency are owned by the\n[canonical Wi-Fi/PHY declarations](../../../../../qualification/catalog/esp32s31/wifi-phy.toml);\nthe program selects them by ID and the qualification evaluator resolves the\ndependency. Its `cold-registration` source contracts distinguish full\ncold calibration from rejected cache-backed hardware replay. `rx-tx-dma`\nseparates production SRAM operation from diagnostic PSRAM paths and absent\ncompositions. An implementation-complete root still needs its vendor/HIL and\nother required axes; those evidence gaps do not negate its source coverage.\nFor identical scopes, implementation claims must follow the\n[inventory agreement contract](../../../../../docs/verification-and-qualification.md#agreement-with-feature-inventories).\nThe full resolved program view is generated under ignored output with\n`cargo qualification catalog render --manifest qualification/targets/esp32s31/wifi-sta.toml --out target/qualification/catalog/wifi-sta`."
source-paths = ["docs/verification-and-qualification.md","qualification/catalog/esp32s31/wifi-phy.toml","qualification/targets/esp32s31/wifi-sta.toml"]

