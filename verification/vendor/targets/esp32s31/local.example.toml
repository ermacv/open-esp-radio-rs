# Role reference for manual setups. Prefer `project inputs init`; keep local.toml untracked.
# Paths are resolved relative to the copied run spec.
schema = 1

[[inputs]]
role = "source-artifact:rom"
path = "/path/to/esp32s31_rev0_rom.elf"

[[inputs]]
role = "source-artifact:archive"
path = "/path/to/linked-libphy.elf"

[[inputs]]
role = "source-inventory:archive"
path = "/path/to/libphy.a"

[[inputs]]
role = "source-companion:rom"
path = "/path/to/linked-libphy.elf"

[[inputs]]
role = "source-companion:archive"
path = "/path/to/esp32s31_rev0_rom.elf"

[[inputs]]
role = "rust-artifact"
path = "/path/to/rust-trace-probes.elf"

[[inputs]]
role = "rust-artifact:bluetooth"
path = "/path/to/rust-bluetooth-trace-probes.elf"

[[inputs]]
role = "source-artifact:libpp"
path = "/path/to/linked-libpp.elf"

[[inputs]]
role = "source-artifact:libpp-replay"
path = "/path/to/linked-libpp-replay.elf"

[[inputs]]
role = "source-companion:libpp-replay"
path = "/path/to/esp32s31_rev0_rom.elf"

[[inputs]]
role = "source-inventory:libpp"
path = "/path/to/libpp.a"

[[inputs]]
role = "source-companion:libpp"
path = "/path/to/esp32s31_rev0_rom.elf"

[[inputs]]
role = "source-artifact:libnet80211"
path = "/path/to/linked-libnet80211.elf"

[[inputs]]
role = "source-inventory:libnet80211"
path = "/path/to/libnet80211.a"

[[inputs]]
role = "source-companion:libnet80211"
path = "/path/to/esp32s31_rev0_rom.elf"

[[inputs]]
role = "source-artifact:wifi-sta-lifecycle"
path = "/path/to/linked-wifi-sta-lifecycle.elf"

[[inputs]]
role = "source-inventory:wifi-sta-lifecycle"
path = "/path/to/libpp.a"

[[inputs]]
role = "source-companion:wifi-sta-lifecycle"
path = "/path/to/esp32s31_rev0_rom.elf"

# Cross-archive link truth for AP/STA key-role propagation.
[[inputs]]
role = "source-artifact:wifi-key-role"
path = "/path/to/linked-wifi-key-role.elf"

[[inputs]]
role = "source-inventory:wifi-key-role"
path = "/path/to/libpp.a"

[[inputs]]
role = "source-companion:wifi-key-role"
path = "/path/to/esp32s31_rev0_rom.elf"

# COEX uses the focused linked oracle as execution/link truth while the raw
# archive remains the authoritative inventory and initializer source.
[[inputs]]
role = "source-artifact:coex"
path = "/path/to/linked-libcoexist.elf"

[[inputs]]
role = "source-inventory:coex"
path = "/path/to/libcoexist.a"

[[inputs]]
role = "source-companion:coex"
path = "/path/to/esp32s31_rev0_rom.elf"

[[inputs]]
role = "source-artifact:btbb"
path = "/path/to/linked-btbb.elf"

[[inputs]]
role = "source-inventory:btbb"
path = "/path/to/libbtbb.a"

# libbtbb reads the real `phy_param` object owned by libphy. The canonical
# linked unit contains that provider, so its raw origin inventory must be part
# of the same source instead of being represented by fixture bytes.
[[inputs]]
role = "source-inventory:btbb"
path = "/path/to/libphy.a"

# The focused linked unit composes controller, BTDM/NPL and baseband archives
# for lifecycle/HCI call-order analysis.  Independent inventories remain the
# archive-level provenance and navigation authorities.
[[inputs]]
role = "source-artifact:ble-controller"
path = "/path/to/linked-ble-controller.elf"

[[inputs]]
role = "source-inventory:ble-controller"
path = "/path/to/libble_app.a"

[[inputs]]
role = "source-inventory:ble-controller"
path = "/path/to/libbtdm_common.a"

[[inputs]]
role = "source-inventory:ble-controller"
path = "/path/to/libbtbb.a"

[[inputs]]
role = "source-inventory:ble-controller"
path = "/path/to/libphy.a"

[[inputs]]
role = "source-companion:ble-controller"
path = "/path/to/esp32s31_rev0_rom.elf"

# Bluetooth Classic uses an independent controller archive with the shared
# BTDM/baseband/PHY closure. The linked ELF is disposable; these raw archive
# bindings retain origin and navigation provenance.
[[inputs]]
role = "source-artifact:bredr-controller"
path = "/path/to/linked-bredr-controller.elf"

[[inputs]]
role = "source-inventory:bredr-controller"
path = "/path/to/libbredr_app.a"

[[inputs]]
role = "source-inventory:bredr-controller"
path = "/path/to/libbtdm_common.a"

[[inputs]]
role = "source-inventory:bredr-controller"
path = "/path/to/libbtbb.a"

[[inputs]]
role = "source-inventory:bredr-controller"
path = "/path/to/libphy.a"

[[inputs]]
role = "source-companion:bredr-controller"
path = "/path/to/esp32s31_rev0_rom.elf"

# Exact archive inventories also remain independently addressable for source
# classification and navigation outside the linked lifecycle unit.
[[inputs]]
role = "source-inventory:ble"
path = "/path/to/libble_app.a"

# Archive-backed diagnostic profiles keep dead-stripped dump helpers out of
# the operational linked controller while preserving member provenance.
[[inputs]]
role = "source-artifact:ble-diagnostics"
path = "/path/to/libble_app.a"

[[inputs]]
role = "source-inventory:btdm"
path = "/path/to/libbtdm_common.a"

[[inputs]]
role = "source-artifact:btdm-diagnostics"
path = "/path/to/libbtdm_common.a"

[[inputs]]
role = "source-inventory:bredr"
path = "/path/to/libbredr_app.a"
