[package]
name = "oer-esp32s31-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ownership and async HAL boundaries for the ESP32-S31 radio"

[features]
validation-probes = ["oer-esp32s31-pac/validation-probes"]
# A register model of the LL backend for host tests of the engine's users.
ll-model = []
# Record the IEEE 802.15.4 MAC power sequence at each transmission start
# into `oer-trace`.
ieee802154-trace = ["dep:oer-ieee802154-trace", "dep:oer-trace", "oer-trace/record"]

[dependencies]
oer-ieee802154-trace = { path = "../../ieee802154/trace", optional = true }
oer-trace = { path = "../../../trace", optional = true }
oer-radio-analog = { path = "../../radio/analog" }
oer-memory = { path = "../../../memory" }
oer-esp32s31-pac = { path = "../pac" }
oer-espressif-coex = { path = "../../espressif/coex" }
oer-espressif-ieee802154-engine = { path = "../../espressif/ieee802154/engine" }
oer-radio-clock = { path = "../../radio/clock" }
oer-radio-coex = { path = "../../../radio/coex" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
oer-esp32s31-pac = { path = "../pac", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "chip"
chip = "esp32s31"
