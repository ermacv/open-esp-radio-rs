schema = 2

[[peripherals]]
name = "WIFI_MAC_INTERFACE_ADDRESS"
description = "Four interface-address pairs consumed by MAC receive filtering."

[[peripherals.registers]]

[peripherals.registers.register]
dim = 4
dimIncrement = 0x8
dimIndex = "0,1,2,3"
name = "ADDRESS_LOW%s"
description = "Interface MAC bytes 0..3 in little-endian order, published by the first full-word store."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BYTES_0_3"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
dim = 4
dimIncrement = 0x8
dimIndex = "0,1,2,3"
name = "ADDRESS_HIGH%s"
description = "Interface MAC bytes 4..5 are published as a full-word store before a separate fresh-read RMW sets receive-policy enable bit 16."
addressOffset = 0x4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BYTES_4_5"
bitOffset = 0
bitWidth = 16

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFF

[[peripherals.registers.register.fields]]
name = "RX_POLICY_ENABLE"
description = "Set by a separate fresh-read RMW in hal_mac_set_addr and by the reachable associated-STA policy branch."
bitOffset = 16
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "POLICY_HIGH_UNKNOWN"
bitOffset = 17
bitWidth = 15
