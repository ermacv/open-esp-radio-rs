[package]
name = "oer-esp32s31-ieee80211-form"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-S31 Wi-Fi backend ownership and scoped execution form"

[dependencies]
atomic-waker = "1.1.2"
critical-section = "1.2.0"
oer-esp32s31-hal = { path = "../../../hardware/esp32s31/hal" }
oer-esp32s31-ieee80211 = { path = "../../../hardware/esp32s31/driver/ieee80211" }
oer-esp32s31-ieee80211-mac = { path = "../../../hardware/esp32s31/driver/ieee80211/mac" }
oer-ieee80211-lower-mac = { path = "../../../protocols/ieee80211/lower-mac" }
oer-radio-port = { path = "../../../radio/port" }
oer-memory = { path = "../../../memory" }
oer-time = { path = "../../../time" }

[dev-dependencies]
oer-ieee80211-mac = { path = "../../../protocols/ieee80211/mac" }

[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
oer-time-virtual = { path = "../../../adapters/virtual/time" }
oer-chip-profile = { path = "../../../../tools/chip-profile" }
oer-elf = { path = "../../../../tools/elf" }
oer-riscv-model = { path = "../../../../tools/riscv/model" }
oer-riscv-program = { path = "../../../../tools/riscv/program" }
oer-riscv-stack = { path = "../../../../tools/riscv/stack" }
oer-toolchain = { path = "../../../../tools/toolchain" }

[target.'cfg(target_arch = "riscv32")'.dev-dependencies]
oer-esp32s31-hal = { path = "../../../hardware/esp32s31/hal", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "runtime"
platform = "chip"
chip = "esp32s31"
inputs = ["platform/esp32s31/chip.toml"]
