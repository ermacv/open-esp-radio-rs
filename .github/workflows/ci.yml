name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --target riscv32imafc-unknown-none-elf
          --component rustfmt,clippy,rust-src
      - run: rustup default 1.97.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Check capability progress ledger
        run: >-
          cargo capability-ledger check
          --manifest capabilities/esp32s31-wifi-sta.ledger
      - name: Lint capability progress ledger
        run: >-
          cargo clippy -p open-esp-radio-capability-ledger
          --all-targets --no-deps --locked -- -D warnings
      - name: Lint the validator
        run: >-
          cargo clippy --manifest-path tools/vendor-code-validator/Cargo.toml
          --all-targets --no-deps --locked -- -D warnings
      - name: Check generated PAC files
        run: cargo pac-gen --check
      - name: Audit source-only policy
        run: tools/audit-source-only.sh
