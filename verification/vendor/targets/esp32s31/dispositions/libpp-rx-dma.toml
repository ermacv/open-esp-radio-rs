schema = 2
# Finite register leaves used by the production RX descriptor-ring owner.
# Descriptor memory ownership, recycle policy and the bounded async reload
# transaction remain Rust composition responsibilities.
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "libpp"
symbol = "hal_mac_rx_disable"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac::mac_rx_dma::set_walker_enabled"
binding = "v1"
rust-binding = "exact-production-entry"
rust-probe = "open_libpp_rx_trace_hal_mac_rx_disable"
effect-contract = "exact-effects-v1"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x20104080 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x20104080 }
disposition = { kind = "required" }

