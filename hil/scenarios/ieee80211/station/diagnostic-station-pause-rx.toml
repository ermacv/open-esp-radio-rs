schema = 5
id = "diagnostic-station-pause-rx"
description = "Access-only PHY maintenance control within a preserved station epoch during rx UDP delivery"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { rx_bps = 65000000 }

[wifi.workload.maintenance]
operation = "access"

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 10000000
