[package]
name = "open-esp-radio-verification-esp32s31-probes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Retained ESP32-S31 Rust entry points for compiled vendor verification"

[dependencies]
embassy-futures.workspace = true
open-esp-radio-esp32s31-coex.workspace = true
open-esp-radio-esp32s31-hal.workspace = true
open-esp-radio-esp32s31-pac.workspace = true
open-esp-radio-esp32s31-phy.workspace = true
open-esp-radio-esp32s31-wifi-embassy.workspace = true
open-esp-radio-esp32s31-wifi-dma.workspace = true
open-esp-radio-esp32s31-wifi-mac = { workspace = true, features = ["validation-raw-dma"] }
open-esp-radio-ieee80211.workspace = true
open-esp-radio-wifi-sta.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[lints.rust]
unexpected_cfgs = "allow"
