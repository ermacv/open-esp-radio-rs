schema = 5
id = "access-point-single-client-ceiling-tx-task-poll"
description = "Diagnostic single-client AP HT40 saturated UDP transmit executor-residence characterization"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "split-core", "tx", "task-poll"]

[wifi]
image = "diagnostic-task-poll"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 130000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
