schema = 4
id = "diagnostic-ap-two-client-udp-tx"
description = "Two-client AP UDP TX endpoint and per-flow accounting smoke"
repetitions = 1
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "tx"]

[link]
phy = "ht40"

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 120
client = "laptop"

[workload.traffic]
kind = "udp-multi-client"
direction = "tx"
duration_seconds = 10
tx_rate_bps_per_flow = 16000000
payload_bytes = 1400

[criteria]
exact_delivery = false
minimum_tx_bps = 2000000
minimum_bps_per_flow = 1000000
maximum_flow_skew_percent = 50
minimum_concurrent_ap_clients = 2
