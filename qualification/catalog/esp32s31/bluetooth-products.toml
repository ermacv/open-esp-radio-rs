schema = 4
id = "esp32s31-bluetooth-products"
imports = ["qualification/catalog/esp32s31/bluetooth.toml"]

[validation]
hil-catalog = "hil/scenarios"

[[capabilities]]
id = "peripheral-acl"
title = "One LE 1M peripheral with a complete ACL lifecycle"
scope = "One standalone always-awake LE 1M peripheral: legacy connectable advertising, one connection, bidirectional HCI ACL fragmentation and credits, retransmission and duplicate suppression, bounded control procedures, resource admission, reconnect, periodic PHY maintenance and terminal powered release back to the cold radio owner"
implementation = "incomplete"
host = "incomplete"
async = "incomplete"
depends-on = [
  "cold-ownership",
  "controller-timebase",
  "ble-phy-engine",
  "hci-controller-endpoints",
  "portable-legacy-advertising",
  "portable-connectable-advertising",
  "portable-peripheral-connection",
]
vendor-anchors = ["docs/vendor/esp32s31/bluetooth-controller-boundary.md"]
gaps = [
  { axis = "implementation", id = "peripheral-first-advertising-rejection-and-terminal-event-disposition-incomplete" },
  { axis = "host", id = "peripheral-virtual-time-delayed-irq-control-maintenance-collision-coverage-incomplete" },
  { axis = "hil", id = "peripheral-qualified-phy-execution-restoration-and-observer-free-timing-bounds-missing" },
  { axis = "vendor", id = "peripheral-hardware-scheduler-packet-list-irq-and-rf-stop-traces-missing" },
  { axis = "hil", id = "peripheral-abrupt-rf-loss-stimulus-not-established-by-soft-rfkill" },
  { axis = "async", id = "peripheral-active-maintenance-blocking-poll-and-terminal-lifecycle-coverage-incomplete" },
]

source-fact-refs = [
  "bluetooth-idle-phy-maintenance",
  "bluetooth-periodic-phy-maintenance",
  "bluetooth-idle-powered-release",
  "bluetooth-same-storage-powered-restart",
]

[capabilities.development]
knowledge = ["docs/vendor/esp32s31/bluetooth-peripheral-connection.md", "crates/hardware/esp32s31/phy/src/tracking/README.md"]
host-tests = [
  { manifest = "crates/protocols/bluetooth/le/ll/Cargo.toml", filter = "connection::maintenance::tests", source = "crates/protocols/bluetooth/le/ll/src/connection/maintenance/tests.rs" },
]
gap-work = [
  { gap = "peripheral-qualified-phy-execution-restoration-and-observer-free-timing-bounds-missing", kind = "measurement-method", reason = "Functional ACL continuity does not measure worst-case PHY execution/restoration; identify the observation method and its perturbation before claiming those bounds." },
  { gap = "peripheral-abrupt-rf-loss-stimulus-not-established-by-soft-rfkill", kind = "experiment", reason = "Define a reproducible RF-loss stimulus and peer observation for the available fixture; soft-rfkill alone does not establish that stimulus." },
]

[capabilities.catalog-scope]
chip = "esp32s31"
role = "peripheral"
phy = "le-1m"
security = ["plaintext-acl"]
composition = "standalone-peripheral-acl"
level = "composed-product"
activation-boundary = "Cold radio acquisition through one HCI/Controller epoch to physical quiescence and cold-owner return"
limitations = "One connection and one legacy advertising role. Vendor proof covers hardware scheduler descriptors/triggers, packet-list publication and completion, IRQ acknowledgement and RF stop before powered release. LL scheduling/retry policy, HCI credits and Rust lifecycle composition use their own host and HIL contracts. Wider multi-role IRQ/list, DTM, Central, extended PHY, EATT and concurrent-radio capabilities remain independent; all required single-peripheral obligations are stated here. Source coverage alone is not readiness"

[[capabilities]]
id = "peripheral-link-security"
title = "Encrypted LE 1M peripheral ACL lifecycle"
scope = "Encryption start, pause and restart on the selected peripheral connection; typed HCI key delivery and rejection, fresh session inputs, packet-counter and nonce ownership, authenticated decryption, retransmission without nonce reuse and terminal MIC failure with key retirement"
implementation = "incomplete"
host = "incomplete"
async = "incomplete"
depends-on = ["peripheral-acl"]
vendor-anchors = ["docs/vendor/esp32s31/bluetooth-controller-boundary.md"]
gaps = [
  { axis = "implementation", id = "encrypted-peripheral-controller-host-lifecycle-integration-incomplete" },
  { axis = "host", id = "encrypted-peripheral-key-counter-backpressure-and-retransmission-boundary-tests-missing" },
  { axis = "vendor", id = "peripheral-encrypted-packet-sram-length-completion-and-retirement-traces-missing" },
  { axis = "hil", id = "encrypted-peripheral-missing-key-mic-failure-and-counter-evidence-incomplete" },
  { axis = "async", id = "encrypted-peripheral-cancellation-and-key-retirement-lifecycle-incomplete" },
]

[[capabilities.source-contracts]]
id = "peripheral-security-current-primitives"
composition = "production"
scope = "Portable LL security and HCI security procedures supply the existing key, encryption and packet-authentication primitives"
limits = "The Controller core composes them for the peripheral connection: HCI key delivery and rejection, encryption start, pause and restart, authenticated reception and termination on authentication failure. The listed HIL scenarios define the required acceptance evidence; the broader link-layer-encryption declaration and an advertised Encryption feature bit do not establish this lifecycle or SMP/GATT interoperability"
source-paths = [
  "crates/protocols/bluetooth/le/ll/src/security.rs",
  "crates/protocols/bluetooth/hci/src/lib.rs",
  "crates/protocols/bluetooth/le/controller/src/peripheral.rs",
  "crates/protocols/bluetooth/le/controller/src/peripheral/receive.rs",
]

[capabilities.development]
knowledge = ["crates/protocols/bluetooth/le/ll/src/security.rs", "docs/vendor/esp32s31/bluetooth-controller-boundary.md"]
host-tests = [
  { manifest = "crates/protocols/bluetooth/le/ll/Cargo.toml", filter = "security::tests", source = "crates/protocols/bluetooth/le/ll/src/security.rs" },
]

[capabilities.catalog-scope]
chip = "esp32s31"
role = "peripheral"
phy = "le-1m"
security = ["encrypted-acl"]
composition = "standalone-encrypted-peripheral"
level = "composed-product"
activation-boundary = "Key admission for the live peripheral epoch through encrypted traffic, errors and complete key retirement"
limitations = "One peripheral connection. Vendor proof covers hardware-consumed packet SRAM and length fields for ciphertext/MIC, packet completion and physical retirement before buffer reuse. AES-CCM, authentication, key/nonce/counter ownership, LL encryption procedures and HCI error/cancellation handling are software contracts covered by host tests and HIL; this composition does not publish keys to a Controller crypto engine. No Central role, PHY update or data-length extension is required. Pairing, bonding and ATT access control belong to secure-peripheral-gatt"

[[capabilities]]
id = "secure-peripheral-gatt"
title = "Secure peripheral GATT server over the open Controller"
scope = "Pinned Trouble Host with the selected encrypted peripheral Controller: LE Secure Connections Numeric Comparison only, mandatory authenticated encryption and key-size checks before protected ATT access, caller-owned RAM bond storage and key restoration for encrypted reconnect within the retained application lifetime, characteristic reads/writes/notifications, security failures and coordinated Host/Controller shutdown"
implementation = "incomplete"
host = "incomplete"
async = "incomplete"
depends-on = ["peripheral-link-security"]
vendor-not-applicable = "host-security-and-oer-bluetooth-gatt-trouble-policy-over-independently-qualified-controller"
hil-requirements = [
  { scenario = "bluetooth-trouble-secure-gatt", minimum-repetitions = 3 },
  { scenario = "bluetooth-trouble-secure-gatt-hci-read-failure", minimum-repetitions = 3 },
]
gaps = [
  { axis = "implementation", id = "secure-gatt-terminal-host-controller-fault-disposition-incomplete" },
  { axis = "host", id = "smp-att-permissions-bond-restore-and-security-downgrade-regressions-missing" },
  { axis = "hil", id = "secure-gatt-pairing-access-control-bonded-reconnect-and-failure-evidence-incomplete" },
  { axis = "hil", id = "secure-gatt-coordinated-host-controller-retirement-qualified-evidence-missing" },
  { axis = "hil", id = "secure-gatt-connection-establishment-loss-bound-unqualified" },
  { axis = "async", id = "trouble-host-controller-coordinated-shutdown-and-cancellation-incomplete" },
]

[[capabilities.source-contracts]]
id = "secure-gatt-current-host-boundary"
composition = "production"
scope = "The portable GATT application owns Numeric Comparison policy with console confirmation, authenticated ATT access, caller-owned asynchronous bond storage with a bounded RAM backend and the Host epoch runner"
limits = "The HIL secure GATT image composes the Host with the production Controller and restarts the Controller epoch on request; coordinated terminal fault disposition remains open. Bond insertion must succeed before application authorization; restored encryption must match the retained record. RAM bonds do not survive SoC reset; imported metadata does not prove pairing-method provenance. Repeated eligible evidence is required; source coverage does not qualify the product"
source-paths = ["crates/adapters/trouble/bluetooth/gatt/src/security/gatt.rs", "crates/adapters/trouble/bluetooth/gatt/src/security/epoch.rs", "crates/adapters/trouble/bluetooth/gatt/src/security/bonds.rs", "crates/adapters/trouble/bluetooth/gatt/src/security/comparison.rs", "crates/adapters/trouble/bluetooth/gatt/src/security/console.rs", "hil/targets/esp32s31/agent/src/bluetooth/secure.rs"]

[capabilities.development]
knowledge = ["crates/adapters/trouble/bluetooth/gatt/src/security/gatt.rs"]
gap-work = [
  { gap = "secure-gatt-connection-establishment-loss-bound-unqualified", kind = "measurement-method", reason = "The GATT workloads retry a connection the DUT never received and publish connections-not-established; no accepted bound on that loss exists yet, and evaluating one over measurements is not supported (#357, #363)." },
]

[capabilities.catalog-scope]
chip = "esp32s31"
role = "peripheral-gatt-server"
phy = "le-1m"
security = ["le-secure-connections", "numeric-comparison-only", "authenticated-att", "ram-bond"]
composition = "standalone-secure-peripheral-gatt"
level = "composed-product"
activation-boundary = "Host and Controller construction through pairing, protected ATT traffic, bonded reconnect and coordinated shutdown"
limitations = "One GATT server/peripheral connection using ordinary ATT and one RAM bond slot. No Just Works or unauthenticated fallback; persistence across reset and human-presence verification are outside this profile. EATT, GATT client/caching, privacy role combinations, Central, legacy pairing, Audio and concurrent Wi-Fi/BLE remain separate scopes. A failed or unavailable secure path is incomplete, not a plaintext fallback"
