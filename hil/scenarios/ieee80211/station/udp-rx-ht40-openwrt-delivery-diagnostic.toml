schema = 5
id = "udp-rx-ht40-openwrt-delivery-diagnostic"
description = "Split-core HT40 AP TX-monitor to station delivery-frontier diagnostic"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "udp", "station", "rx", "ht40", "split-core", "openwrt-monitor"]

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 120000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 72000000
