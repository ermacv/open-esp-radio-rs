  "dtm-tx-payload",
  "dtm-tx-timing",
  "scheduler-head-transaction",
  "scheduler-finished-list-drain",
  "hci-handoff-storage",
  "hci-bootstrap",
  "hci-bootstrap-worker",
  "packet-dataplane",
  "le-link-layer",
  "typed-hci-controller",
  "async-controller-runtime",
  "trouble-host-integration",
  "coexistence",
  "powered-teardown",
]

[verification]
project = "verification/vendor/targets/esp32s31/vendor-project.toml"
evidence-index = "verification/vendor/targets/esp32s31/evidence/vendor-evidence.json"

[hil]
target = "esp32s31"
catalog = "hil/scenarios"
runs = "target/hil/esp32s31/runs"

