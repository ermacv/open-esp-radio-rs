schema = 4
id = "station-access-point-tx-egress-identity-core0"
description = "Per-VIF shadow-policy identity and modeled-airtime accounting during simultaneous STA and AP UDP egress"
image = "diagnostic-core0-rx-coarse"
repetitions = 3
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "wifi", "sta-ap", "udp", "tx", "egress-policy", "fairness", "core0", "coarse", "psram-stack"]

[link]
phy = "ht40"

[workload]
kind = "station-access-point"
timeout_seconds = 30
duration_seconds = 12
direction = "tx"
rate_bps_per_flow = 32500000
minimum_bps_per_flow = 5000000
maximum_fairness_skew_percent = 50
payload_bytes = 1472

[criteria]
require_egress_policy_evidence = true
# Shadow grants do not gate the stack-selected path. A short queue may drain
# before its observational grant crosses cores; bound that race as a fraction
# so the gate remains stable across duration and offered rate.
maximum_egress_unused_grant_percent = 2
maximum_egress_progress_without_grant = 0
