[[peripherals]]
name = "BTDM_LOW_POWER_CONFIG"
description = """
Sparse low-power configuration/status words reached by complete BTDM runtime
and btdm_sleep.c functions. Positional names preserve exact access direction
and complete images without inventing clock, calibration or RTC semantics.
"""
baseAddress = 0x20108800

[[peripherals.registers]]
[peripherals.registers.register]
name = "STATUS_0000"
description = "Complete word read by two BTDM sleep/runtime functions. Inner encoding remains unknown."
addressOffset = 0x0
size = 32
access = "read-only"
[[peripherals.registers.register.fields]]
name = "IMAGE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]
[peripherals.registers.register]
name = "COMMAND_0004"
description = "Complete functions publish dynamic complete images and the independently observed finite complete images 0x10, 0x20, 0x40 and 0x80. Whole-word authority remains a register-level fact."
addressOffset = 0x4
size = 32
access = "write-only"

[[peripherals.registers]]
[peripherals.registers.register]
name = "COMMAND_0008"
description = "Complete word receives runtime-derived images and the independently observed finite images 0x10, 0x20, 0x40 and 0x80."
addressOffset = 0x8
size = 32
access = "write-only"
[[peripherals.registers.register.fields]]
name = "IMAGE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]
[peripherals.registers.register]
dim = 8
dimIncrement = 0x4
dimIndex = "0,1,2,3,4,5,6,7"
name = "CONFIG%s"
description = "Eight complete configuration words initialized to the finite sequence 69, 17, 67, 18, 70, 17, 70, 15 and later consumed by BTDM runtime functions."
addressOffset = 0x2C
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "IMAGE"
bitOffset = 0
bitWidth = 32

