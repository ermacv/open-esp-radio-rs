[[sources]]
id = "BLOB_LIBPP_HAL_TX_TRIGGER_FLOW"
description = "_oracles/libpp.a sha256 f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e; complete hal_mac_tx.o hal_mac_get_txq_in_trig_flow_state size 0x0c and complete lmac.o lmacProcessTxComplete size 0x25c, lmacProcessShortRetryFail size 0x318, lmacProcessLongRetryFail size 0x266 and lmacProcessTBSuccess size 0x52. The HAL getter reads 0x20104cb4 and returns its complete high byte. The completion dispatcher right-shifts that byte by the completed queue index, masks bit zero and retains the resulting per-queue trigger-flow flag. On a zero-retry-count ACK/retry failure, both retry-failure paths use that flag to terminate through lmacProcessTBSuccess instead of scheduling an ordinary contention retry; the success completion path remains lmacProcessTxSuccess."

