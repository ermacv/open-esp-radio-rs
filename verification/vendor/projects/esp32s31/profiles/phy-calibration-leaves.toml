# Production calibration leaves reviewed against esp-phy-lib
# b88e4b76e090ae59c51cb00b916d38def895b396 (BLOB_LIBPHY_CALIBRATION_20260907).
# Supply libphy.a as vendor-artifact and the authentic ROM as vendor-companion.
# These finite profiles do not qualify complete calibration or coexistence.

[[profiles]]
