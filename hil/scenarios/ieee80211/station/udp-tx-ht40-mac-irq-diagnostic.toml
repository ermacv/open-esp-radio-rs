schema = 5
id = "udp-tx-ht40-mac-irq-diagnostic"
description = "HT40 saturated TX publication-to-IRQ and IRQ-to-service latency"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "udp", "station", "tx", "ht40", "split-core", "mac-irq", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-mac-irq"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 130000000 }

[wifi.workload.criteria]
minimum_tx_bps = 90000000
maximum_idle_channel_utilization_255 = 64
