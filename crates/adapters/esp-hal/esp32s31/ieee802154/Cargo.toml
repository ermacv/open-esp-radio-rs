[package]
name = "oer-esp32s31-ieee802154-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP-HAL interrupt-route ownership and time for the ESP32-S31 IEEE 802.15.4 MAC"

[features]
default = []
esp32s31 = [
    "dep:critical-section",
    "dep:esp-hal",
    "dep:oer-interrupt-table",
    "dep:oer-espressif-interrupt-table-esp-hal",
]

[dependencies]
critical-section = { version = "1.2.0", optional = true }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "de9bd926207d7d182f74b2add7eab3ec433f23a4", default-features = false, features = ["esp32s31", "static-interrupts", "unstable"], optional = true }
oer-interrupt-table = { path = "../../../../runtime/interrupt-table", optional = true }
oer-espressif-interrupt-table-esp-hal = { path = "../../espressif/interrupt-table", features = ["esp32s31"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "adapter"
platform = "chip"
chip = "esp32s31"
