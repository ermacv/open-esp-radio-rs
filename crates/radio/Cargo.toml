[package]
name = "oer-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable radio control, requests and role lifecycle"
readme = "README.md"

[features]
default = ["wifi"]
wifi = [
    "dep:oer-ieee80211",
    "dep:oer-wifi-ap",
    "dep:oer-wifi-softmac",
    "dep:oer-wifi-sta",
    "dep:oer-wpa2",
]
# Synthetic portable service profiles for adapter tests.
test-support = ["wifi"]

[dependencies]
oer-ieee80211 = { path = "../protocols/ieee80211/mac", optional = true }
oer-wifi-ap = { path = "../protocols/ieee80211/ap", optional = true }
oer-wifi-softmac = { path = "../protocols/ieee80211/softmac", optional = true }
oer-wifi-sta = { path = "../protocols/ieee80211/sta", optional = true }
oer-wpa2 = { path = "../protocols/ieee80211/security/wpa2", optional = true }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "service"
platform = "portable"
