[package]
name = "oer-hil-image-class"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL image classes: build feature recipes and the keys each class reports"

[dependencies]
oer-chip-profile = { path = "../../../tools/chip-profile" }
oer-durable = { path = "../../../tools/durable" }
oer-hil-image-keys = { path = "../../image-keys" }
oer-hil-protocol = { path = "../../protocol", features = ["registry"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "execution"
hil = "observation"
# The agent tests read every chip profile and HIL target workspace.
inputs = ["platform/*/chip.toml", "platform/*/Cargo.toml", "hil/targets/**/Cargo.toml"]
