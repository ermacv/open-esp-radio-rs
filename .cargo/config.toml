[alias]
registers = "run --profile blobray -p oer-register-tool --"
xtask = "run -p oer-xtask --"
hil = "run --quiet -p oer-xtask -- hil"
memory = "run --quiet -p oer-memory-report --"
qualification = "run --quiet --profile qualification -p oer-qualification --"
# Keep Cargo's preparation phase visible. In particular, do not hide a
# compiler rebuild or `Blocking waiting for file lock` behind a silent pause;
# the Blobray UI can only start after Cargo launches the binary.
blobray = "run --manifest-path tools/blobray/Cargo.toml --profile blobray -p blobray-next --bin blobray --"

[net]
# GitHub access in the lab uses HTTPS credentials managed by Git. Delegate git
# dependencies to the CLI so Cargo shares the configured credential helper.
git-fetch-with-cli = true

[env]
# Cargo reads this file for every workspace below the repository root.
# ESP32-S31 images keep esp-hal's PMP region setup off: its single
# "read/write, no execute" TOR region from `_data_start` to `_noinit_end`
# would span stage two's PSRAM code between SRAM data and PSRAM noinit.
ESP_HAL_CONFIG_ENABLE_PMP = "false"
