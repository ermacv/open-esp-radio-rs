schema = 2

[[peripherals]]
name = "BLE_HW_CTE_RING_CONTROL"
description = """
Direction-finding ring state recovered from complete ESP32-S31 ble_hw_cte.c
leaves. Ordinary advertising, scanning and connection link states retain a
controller-global disabled-CTE descriptor even when IQ sampling is not
requested, so the baseline pointer and ownership fields are part of the
minimum standalone BLE controller.
"""
baseAddress = 0x2010199C

[[peripherals.registers]]
[peripherals.registers.register]
name = "RING_CONTROL"
description = "Reset writes the complete word as zero; independent accessors update the ring index and maximum-buffer fields through halfword RMW operations."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "MAX_BUFFER_NUMBER"
description = "The setter truncates its argument to three bits and replaces bits 12..14; the getter returns the same field."
bitOffset = 12
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "RING_BUFFER_INDEX_CLEAR"
description = "The named clear accessor sets bit 15. The active level and any hardware self-clear behavior remain unproven."
bitOffset = 15
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
dim = 6
dimIncrement = 0x8
dimIndex = "0,1,2,3,4,5"
name = "BUFFER_POINTER%s"
description = "Compressed controller-SRAM address of one CTE sample-ring descriptor. The setter replaces bits 0..19 and preserves the upper twelve bits."
addressOffset = 0x4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "COMPRESSED_DESCRIPTOR_POINTER"
description = "Low-twenty-bit controller-SRAM pointer reconstructed with the fixed 0x2f prefix and four-byte alignment."
bitOffset = 0
bitWidth = 20

[[peripherals.registers]]
[peripherals.registers.register]
dim = 6
dimIncrement = 0x8
dimIndex = "0,1,2,3,4,5"
name = "BUFFER_STATE%s"
description = "Hardware state paired with one CTE sample-ring descriptor. Only the software-ownership flag is currently assigned."
addressOffset = 0x8
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "SOFTWARE_OWNED"
description = "The named owner-clear/set leaves respectively clear and set bit 31; the paired query returns that bit."
bitOffset = 31
bitWidth = 1

