[package]
name = "oer-ieee80211-sta-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent Wi-Fi station join, scan, attempt and lifecycle drivers, and the station over the lower-MAC port"
readme = "README.md"

[dependencies]
oer-time = { path = "../../../time" }
oer-ieee80211-lower-mac = { path = "../../../protocols/ieee80211/lower-mac" }
oer-ieee80211-datapath = { path = "../../../protocols/ieee80211/datapath" }
oer-ieee80211-mac = { path = "../../../protocols/ieee80211/mac" }
oer-ieee80211-rsn = { path = "../../../protocols/ieee80211/security/rsn" }
oer-ieee80211-rsn-service = { path = "../rsn" }
oer-ieee80211-softmac = { path = "../../../protocols/ieee80211/softmac" }
oer-ieee80211-sta = { path = "../../../protocols/ieee80211/sta" }
oer-ieee80211-upper-mac = { path = "../../../protocols/ieee80211/upper-mac" }
oer-ieee80211-upper-mac-service = { path = "../upper-mac" }

[dev-dependencies]
oer-time-virtual = { path = "../../../adapters/virtual/time" }
oer-ieee80211-datapath = { path = "../../../protocols/ieee80211/datapath", features = ["model"] }
oer-network-interface = { path = "../../../network/interface" }
critical-section = { version = "1.2.0", features = ["std"] }
oer-ieee80211-lower-mac = { path = "../../../protocols/ieee80211/lower-mac", features = ["model"] }
oer-espressif-ieee80211-policy = { path = "../../../protocols/espressif/ieee80211/policy" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "service"
platform = "portable"
