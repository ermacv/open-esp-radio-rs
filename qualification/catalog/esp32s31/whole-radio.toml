[validation]
verification-project = "verification/vendor/projects/esp32s31/vendor-project.toml"
hil-catalog = "hil/scenarios"

[[sections]]
id = "whole-radio-overview"
domain = "whole-radio"
title = "ESP32-S31 radio subsystem source capabilities"
source-document = "crates/hardware/esp32s31/driver/FEATURES.md"
overview = "This is the entry point for radio coverage and the shared ownership, clock and\npower lifecycle. Detailed PHY algorithms and protocol capabilities have one\ncanonical inventory each, linked below. HAL and PAC are implementation and\nownership layers, not additional feature inventories.\n\nThe current source supports bounded single-protocol operation and substantial\nshared primitives. It does not compose a complete multi-protocol lifetime:\nconcurrent owners, arbitration, sleep/wake, final shutdown and reconstruction\nremain incomplete. Cold initialization alone does not establish those stages."

[[sections]]
id = "whole-radio-coverage-index"
domain = "whole-radio"
title = "Coverage index"
source-document = "crates/hardware/esp32s31/driver/FEATURES.md"
overview = "`IMPLEMENTED` denotes a complete source path only for the exact row scope.\n`PARTIAL` denotes a lower or narrower implementation with missing composition.\n`FAIL-CLOSED` denotes an explicit guard against activation/reuse; `ABSENT`\ndenotes no production owner for the named operation. None is a hardware\nqualification result. A register setter, host test or successful cold-start\ntransition cannot grant readiness to a different protocol or lifecycle stage."

[[sections]]
id = "whole-radio-exclusive-ownership-and-client-handoff"
domain = "whole-radio"
title = "Exclusive ownership and client handoff"
source-document = "crates/hardware/esp32s31/driver/FEATURES.md"

[[sections]]
id = "whole-radio-cold-power-and-clocks"
domain = "whole-radio"
title = "Cold power and clocks"
source-document = "crates/hardware/esp32s31/driver/FEATURES.md"
overview = "`power::execute_owned` performs its ordered writes, then samples platform,\nmodem and shared semantic observations and checks the required postconditions.\nIt does not read back every intermediate write. Failure retains the owner for\nits supported retry path; a powered type is issued only after successful checks.\nProtocol-specific MAC clocks, RF calibration and IRQ/DMA activation retain their\nown owners and prerequisites."

[[sections]]
id = "whole-radio-active-operation-power-saving-and-shutdown"
domain = "whole-radio"
title = "Active operation, power saving and shutdown"
source-document = "crates/hardware/esp32s31/driver/FEATURES.md"
overview = "Power saving has both shared and protocol-specific requirements. The shared\nsleep/wake transaction cannot substitute for TIM/TWT, Bluetooth link timing,\nIEEE receive windows or coexistence deadline policy. Conversely, implementing\nthose protocol policies does not establish shared RF shutdown or retention.\nChildren retain their precise statuses and link here for this common boundary."

[[sections]]
id = "whole-radio-concurrent-ownership-and-arbitration"
domain = "whole-radio"
title = "Concurrent ownership and arbitration"
source-document = "crates/hardware/esp32s31/driver/FEATURES.md"

[[sections]]
id = "whole-radio-evidence-and-implementation-ownership"
domain = "whole-radio"
title = "Evidence and implementation ownership"
source-document = "crates/hardware/esp32s31/driver/FEATURES.md"
overview = "[HAL](../hal/src/owner.rs) defines semantic access and transitions. The\n[PAC ownership contract](../pac/README.md) and\n[reviewed register model](../../../../registers/esp32s31/model/device.toml) define\nwhich hardware words those transitions may access. DMA, IRQ and Embassy\nadapters provide implementation evidence for the capabilities above rather\nthan independent capability inventories.\n\n[Qualification](../../../../qualification/README.md) is the readiness authority.\nIts existing protocol manifests retain their current proof states; this map\ncreates no PHY, coex or whole-radio qualification target and makes no new HIL\nclaim. Complete concurrency and restart readiness require composed ownership\nand hardware evidence, not the union of individually implemented primitives."
source-paths = [
  "crates/hardware/esp32s31/hal/src/owner.rs",
  "crates/hardware/esp32s31/pac/README.md",
  "registers/esp32s31/model/device.toml",
  "qualification/README.md",
]

