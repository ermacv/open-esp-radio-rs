schema = 5
id = "icmp-latency-legacy"
description = "Connected-station ICMP latency and loss with a non-HT access point"
role = "investigation"
tags = ["icmp", "station", "legacy", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-icmp"
link = { phy = "legacy" }
count = 100
interval_ms = 20
timeout_ms = 1000
payload_bytes = 56

[wifi.workload.criteria]
maximum_p95_ms = 20
require_no_beacon_loss = true
