[workspace]
resolver = "3"
members = ["runtime", "trace-elf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "7f914782f5c689a74f37df83b89a0827d3800323", default-features = false }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "7f914782f5c689a74f37df83b89a0827d3800323", default-features = false }
esp-phy = { git = "https://github.com/ermacv/esp-hal", rev = "7f914782f5c689a74f37df83b89a0827d3800323" }
esp-rtos = { git = "https://github.com/ermacv/esp-hal", rev = "7f914782f5c689a74f37df83b89a0827d3800323" }
open-esp-radio-esp32s31-hal = { path = "../../../../../driver/chips/esp32s31/hal" }
open-esp-radio-esp32s31-phy = { path = "../../../../../driver/chips/esp32s31/phy" }
open-esp-radio-esp32s31-wifi-dma = { path = "../../../../../driver/chips/esp32s31/wifi/dma", features = ["validation-raw-dma"] }
open-esp-radio-esp32s31-wifi-mac = { path = "../../../../../driver/chips/esp32s31/wifi/mac", features = ["validation-raw-dma"] }
open-esp-radio-ieee80211 = { path = "../../../../../driver/wifi/ieee80211" }
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../../../../driver/adapters/esp-hal/esp32s31-wifi" }
static_cell = "2.1.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "d0fb94ef3" }
