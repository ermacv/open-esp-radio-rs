schema = 5
id = "diagnostic-udp-tx-ht40-performance-phy-tracking-suspended"
description = "Saturated HT40 UDP station TX on the performance image with PHY tracking suspended, to test whether tracking during saturated transmission makes the station miss beacons"
role = "investigation"
repetitions = 3
tags = ["diagnostic", "udp", "station", "tx", "ht40", "split-core", "beacon-loss", "air-strict"]

[wifi]
image = "performance"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 130000000 }
suspend_phy_tracking = true
