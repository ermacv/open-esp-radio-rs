dimIndex = "0,1,2,3,4,5,6,7"
name = "SOFTWARE_BSR%s"
description = "WDEVTXQBSR_SW[0-7]. The debug decoder reads all eight low-twenty-bit values. Complete blob and ROM mac_tx_set_tb independently prove write semantics for logical queues zero through three: preserve bits 31:20 and replace VALUE with the sum of linked frame-state +0x22 halfwords before publishing the queue-ready bit. Complete dbg_read_tx_ppdu names that halfword msdu_len. Rev0 open HIL programmed 47104 for logical queue two with the exact ROM sequence, then observed VALUE zero immediately after validity became visible. Treat reads as live hardware state rather than durable software-write readback until a Trigger HIL resolves whether the value was consumed or rejected."
addressOffset = 0x4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "VALUE"
description = "Software BSR value. On the recovered Trigger-based TX path this is the low-twenty-bit sum of the original MSDU lengths from linked frame-state +0x22, not the encoded MPDU/PSDU lengths."
bitOffset = 0
bitWidth = 20

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFF

