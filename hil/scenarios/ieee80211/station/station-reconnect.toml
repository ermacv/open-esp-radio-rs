schema = 5
id = "station-reconnect"
description = "Repeated safe station teardown and reassociation"
role = "qualification"
tags = ["station", "lifecycle"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-reconnect"
link = { phy = "he20" }
cycles = 3
boots = 2
timeout_seconds = 90

[wifi.workload.criteria]
require_no_beacon_loss = true
