name: "Bug"
description: "Restore expected behavior in a reachable scenario."
labels: ["kind:bug"]
body:
  - type: markdown
    attributes:
      value: "Name one accepted result. Follow [issue management](https://github.com/ermacv/open-esp-radio-rs/blob/main/docs/issues.md). Triage assigns area and priority; dropdowns do not apply labels. Research and implementation do not establish hardware readiness."
  - type: textarea
    id: behavior
    attributes:
      label: "Expected and observed behavior"
      description: "State the violated contract and its concrete effect."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Primary area"
      description: "The owner of the result; triage applies its area label."
      options: ["Wi-Fi","Bluetooth","IEEE 802.15.4","Shared radio","Registers / PAC","Platform","Tooling","HIL","Qualification"]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Owner and scope"
      description: "Name defining paths, canonical package.metadata.open-radio.layer, target/revision/profile and exclusions."
      placeholder: "Owner paths:\nLayer (package.metadata.open-radio.layer):\nTarget / revision / profile:\nOut of scope:"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Reproducer and evidence"
      description: "Steps, image/commit, configuration and applicable logs/run references. Separate observations from hypotheses."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance and regression check"
      description: "What must hold after the fix, including failure and ownership paths."
    validations:
      required: true
  - type: textarea
    id: relations
    attributes:
      label: "Relations and activation"
      description: "Parent, blockers with the exact required artifact, related work, and any future activation trigger."
      placeholder: "Part of:\nBlocked by (artifact and consuming step):\nRelated:\nActivation trigger:"
    validations:
      required: false
