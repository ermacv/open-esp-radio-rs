[[items]]
id = "bluetooth-hci-acl-routing-and-bidirectional-flow-control"
section = "bluetooth-hci-host-boundary"
title = "HCI ACL routing and bidirectional flow control"
status = "partial"
level = "composed-product"
scope-and-limitations = "Host packets for live handle `0x0001` enter one owned ACL slot, preserve HCI packet boundaries across 27-byte unencrypted or 23-byte encrypted plaintext LL fragmentation, and return Number Of Completed Packets only after final acknowledgement or teardown cancellation. Foreign, invalid-boundary or profile-rejected data returns its consumed credit. Accepted Controller packets preserve LL start/continuation boundaries in a two-packet FIFO, cannot precede Connection Complete, fragment to Host Buffer Size and consume one Host credit per emitted HCI packet. Host Number Of Completed Packets restores bounded credits without a success event; the composition exposes a restricted write-only Host credit authority alongside the standard `ExternalController` facade. Flow-controlled output keeps command intake live even when the Host ACL owner is occupied, while an older pending normal response retains causal order. Disconnect removes the handle from data/command admission but retains it for old Controller-credit returns; idle admission prevents handle reuse until all such credits settle. The peripheral recovery HIL workload correlates two distinct exact 251-byte, ten-fragment unencrypted exchanges between a Linux central and a target Host that declares one 27-byte credit and deliberately delays its first return, but no recorded hardware run qualifies it."
source-paths = []

