[[items]]
id = "wifi-802-11ax-he-rx-stbc-one-spatial-stream"
section = "wifi-802-11ax-he"
title = "RX STBC, one spatial stream"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The HE20 SU STA profile retains RX STBC and [RX normalization](mac/src/rx.rs) distinguishes two space-time streams from one spatial stream. Reviewed [HIL provenance](../../../../../registers/esp32s31/evidence/hil-open.toml) includes `HIL_OPEN_HE20_STBC_NSTS_2026_07_30` observations on the open RX path. This bounded RX claim does not imply TX STBC, two spatial streams or qualification of every STBC mode."
source-paths = ["crates/hardware/esp32s31/driver/ieee80211/mac/src/rx.rs","registers/esp32s31/evidence/hil-open.toml"]

