schema = 2

[[peripherals]]
name = "COEX_EXTERNAL"
description = "External coexistence control beside the coexistence timer bank. The complete hal_external_coexist.o leaves of the pinned libcoexist address these words at 0x2010f49c, 0x2010f4a0, 0x2010f4a4, 0x2010f4d0 and 0x2010f4d8 through fresh-read RMW operations; the GPIO matrix routing of the request, priority, grant and TX-line signals belongs to the platform, not to this block."
baseAddress = 0x2010F49C

[[peripherals.registers]]

[peripherals.registers.register]
name = "PTI"
description = "External priority word. hal_set_extern_pti publishes three priorities in bits 11:0 in the basic modes, or a fixed advanced image in the follower mode; hal_clr_extern_pti clears them. hal_set_extern_coex_mode replaces bits 29:28 with the work mode, and hal_set_extern_pti_mode sets bits 31:30 in the one-wire leader mode and the advanced grant fields in the follower mode."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "PRIORITY_0"
description = "Low nibble of the third hal_set_extern_pti argument in the basic modes; zero in the advanced mode."
bitOffset = 0
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "PRIORITY_1"
description = "Low nibble of the second hal_set_extern_pti argument in the basic modes; 0xf in the advanced mode."
bitOffset = 4
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "PRIORITY_2"
description = "Low nibble of the first hal_set_extern_pti argument in the basic modes; zero in the advanced mode."
bitOffset = 8
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "ADVANCED_PRIORITY"
description = "0xf in the advanced mode with two or three wires, zero otherwise."
bitOffset = 12
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "ADVANCED_GRANT_0_UNKNOWN"
description = "Advanced follower field: 1 with one wire, 0xc otherwise; hal_clr_extern_pti sets 0xf in the advanced mode."
bitOffset = 16
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "ADVANCED_GRANT_1_UNKNOWN"
description = "Advanced follower field: 1 with one wire, 8 otherwise; hal_clr_extern_pti sets 0xf in the advanced mode."
bitOffset = 20
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "ADVANCED_GRANT_2_UNKNOWN"
description = "Advanced follower field: 1; hal_clr_extern_pti sets 0xf in the advanced mode."
bitOffset = 24
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "WORK_MODE"
description = "Low two bits of the hal_set_extern_coex_mode argument: the external work mode (0 leader, 1 one-wire leader variant, 2 follower)."
bitOffset = 28
bitWidth = 2

[[peripherals.registers.register.fields]]
name = "MODE_FLAGS_UNKNOWN"
description = "Set to 0b11 by hal_set_extern_pti_mode in mode 1 and in the follower mode; the leader mode leaves them unchanged."
bitOffset = 30
bitWidth = 2

[[peripherals.registers]]

[peripherals.registers.register]
name = "CONTROL"
description = "External control word written by hal_set_extern_coex_validity, hal_set_extern_coex_delay, hal_set_extern_coex_sync and the enable pair."
addressOffset = 0x4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "VALIDATE_HIGH"
description = "hal_set_extern_coex_validity: set when the external grant is valid high."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "GRANT_DELAY"
description = "hal_set_extern_coex_delay replaces bits 8:1 with its argument; ic_set_extern_coex_params passes the grant delay in microseconds shifted left by four and masked to 0xf0."
bitOffset = 1
bitWidth = 8

[[peripherals.registers.register.fields]]
name = "ENABLE"
description = "Set by hal_enable_extern_coex and cleared by hal_disable_extern_coex, after the other enable fields."
bitOffset = 9
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SYNC"
description = "hal_set_extern_coex_sync replaces bits 19:10 with the low ten bits of its argument; hal_set_extern_pti_mode writes zero and then 0x14 in the leader mode."
bitOffset = 10
bitWidth = 10

[[peripherals.registers.register.fields]]
name = "UNKNOWN"
description = "Bits no external-coexistence leaf writes."
bitOffset = 20
bitWidth = 12

[[peripherals.registers]]

[peripherals.registers.register]
name = "ENABLE_1"
description = "hal_enable_extern_coex sets bit 14 and hal_disable_extern_coex clears it."
addressOffset = 0x8
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "LOW_UNKNOWN"
description = "Bits no external-coexistence leaf writes."
bitOffset = 0
bitWidth = 14

[[peripherals.registers.register.fields]]
name = "ENABLE"
bitOffset = 14
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "HIGH_UNKNOWN"
description = "Bits no external-coexistence leaf writes."
bitOffset = 15
bitWidth = 17

[[peripherals.registers]]

[peripherals.registers.register]
name = "ENABLE_MASK_0"
description = "hal_enable_extern_coex sets bits 3:0 and hal_disable_extern_coex clears them."
addressOffset = 0x34
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "MASK"
bitOffset = 0
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "UNKNOWN"
description = "Bits no external-coexistence leaf writes."
bitOffset = 4
bitWidth = 28

[[peripherals.registers]]

[peripherals.registers.register]
name = "ENABLE_MASK_1"
description = "hal_enable_extern_coex sets bits 3:0 and hal_disable_extern_coex clears them. The same field is the IEEE 802.15.4 PTI offset that hal_set_IEEE802154_pti_offset replaces and hal_get_IEEE802154_pti_offset reads."
addressOffset = 0x3C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "MASK"
bitOffset = 0
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "UNKNOWN"
description = "Bits no external-coexistence leaf writes."
bitOffset = 4
bitWidth = 28

