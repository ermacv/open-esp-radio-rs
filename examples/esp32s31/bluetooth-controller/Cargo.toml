[package]
name = "oer-esp32s31-example-bluetooth-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["firmware"]
firmware = [
    "dep:oer-esp32s31-platform-runtime", "dep:embassy-time", "dep:static_cell",
    "dep:embassy-executor", "dep:embassy-futures", "dep:esp-backtrace", "dep:esp-hal",
    "dep:esp-println", "dep:oer", "dep:oer-esp32s31-executor-embassy", "dep:oer-esp32s31-platform-layout",
]
advertising-smoke = ["firmware"]
trouble-gatt = ["gatt-application", "firmware"]
trouble-secure-gatt = ["trouble-gatt", "secure-gatt-application"]
gatt-application = ["dep:gatt-application", "dep:trouble-host"]
secure-gatt-application = ["gatt-application", "gatt-application/secure", "trouble-host/security", "dep:embassy-futures"]

[[bin]]
name = "oer-esp32s31-example-bluetooth-controller"
path = "src/main.rs"
required-features = ["firmware"]

[dependencies]
bt-hci = "=0.10.1"
embassy-sync = "0.8.0"
embassy-futures = { version = "0.1.2", optional = true }
gatt-application = { package = "oer-example-bluetooth-gatt", path = "../../bluetooth-gatt", optional = true }
trouble-host = { version = "=0.8.0", git = "https://github.com/ermacv/trouble", rev = "a6af435ba1539cead0afce04718ad8a089bcc4b9", optional = true, default-features = false, features = ["default-packet-pool", "gatt", "peripheral"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-esp32s31-platform-runtime = { optional = true, path = "../../../platform/esp32s31/runtime", features = ["psram-task-stack"] }
embassy-time = { version = "0.5.1", optional = true }
static_cell = { version = "2.1.1", optional = true }
embassy-executor = { optional = true, version = "0.10.0", default-features = false }
esp-backtrace = { optional = true, git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["esp32s31", "panic-handler", "println"] }
esp-hal = { optional = true, git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["esp32s31", "rt", "unstable"] }
esp-println = { optional = true, git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["auto", "esp32s31", "log-04"] }
oer = { package = "open-esp-radio", optional = true, path = "../../../crates/oer", default-features = false, features = ["embassy-esp32s31-bluetooth"] }
oer-esp32s31-executor-embassy = { optional = true, path = "../../../crates/adapters/embassy/esp32s31/executor", features = ["esp32s31"] }

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = 3
panic = "abort"
strip = false

[dev-dependencies]
oer-bluetooth-hci = { path = "../../../crates/protocols/bluetooth/hci" }
embassy-futures = "0.1.2"
critical-section = { version = "1.2.0", features = ["std"] }

[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
embassy-time = { version = "0.5.1", features = ["mock-driver", "generic-queue-8"] }

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "507d14dbccfc26128b929b044d76f09cf2d1d2f6" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }

[workspace]
resolver = "3"

[build-dependencies]
oer-esp32s31-platform-layout = { path = "../../../platform/esp32s31/layout", features = ["build"], optional = true }

[package.metadata.open-radio]
scope = "development"
layer = "application"
platform = "chip"
chip = "esp32s31"
