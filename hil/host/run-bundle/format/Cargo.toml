[package]
name = "oer-hil-run-bundle-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL run bundle format: its typed documents, their validation, the integrity and scenario seals, the observer identity, the fixture records and the one reader"

[dependencies]
oer-durable = { path = "../../../../tools/durable" }
flate2 = "1.1.9"
sha2 = "0.10"
oer-hil-scenario-catalog = { path = "../../scenario/catalog" }
oer-hil-schema = { path = "../../../schema" }
oer-process = { path = "../../../../tools/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "foundation"
host-app = "formats"
host-boundary = "format"
hil = "observation"
