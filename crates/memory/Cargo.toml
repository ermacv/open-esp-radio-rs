[package]
name = "oer-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Audited buffer ownership boundaries for open ESP radio drivers"

[dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }

[features]
default = []
# Diagnostic-only geometry for proving external-memory DMA on ESP32-S31.
# It isolates each candidate buffer on 64-byte cache lines; production pools
# retain their compact layout when the probe is absent.
tx-psram-dma-probe = []

[lints]
workspace = true

[package.metadata.open-radio]
layer = "contract"
platform = "portable"
