[package]
name = "open-esp-radio-esp32s31-station"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
embassy-net-owned = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "244b4a3b80cb2f8a02f17b698f0ef4614e5fc01d", features = ["dhcpv4", "medium-ethernet"], optional = true }
embassy-net-compat = { package = "embassy-net", version = "0.9.1", features = ["dhcpv4", "medium-ethernet"], optional = true }
esp-backtrace = { git = "https://github.com/ermacv/esp-hal", rev = "81cd5c341f71f9d070b5d2b115d3ab2c7595a4df", default-features = false, features = ["esp32s31", "panic-handler", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "81cd5c341f71f9d070b5d2b115d3ab2c7595a4df", default-features = false, features = ["esp32s31"] }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "81cd5c341f71f9d070b5d2b115d3ab2c7595a4df", default-features = false, features = ["esp32s31", "rt", "unstable"] }
esp-println = { git = "https://github.com/ermacv/esp-hal", rev = "81cd5c341f71f9d070b5d2b115d3ab2c7595a4df", default-features = false, features = ["auto", "esp32s31", "log-04"] }
open-esp-radio = { path = "../../driver/radio", default-features = false, features = ["wifi"] }
open-esp-radio-esp32s31-embassy-runtime = { path = "../../driver/adapters/embassy/esp32s31/runtime", features = ["esp32s31"] }
open-esp-radio-esp32s31-phy = { path = "../../driver/chips/esp32s31/phy" }
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../driver/adapters/esp-hal/esp32s31/ieee80211", features = ["esp32s31"] }
open-esp-radio-esp32s31-embassy-wifi = { path = "../../driver/integration/esp32s31/embassy/ieee80211", default-features = false }
static_cell = "2.1.1"

[features]
default = ["owned-network"]
owned-network = [
    "dep:embassy-net-owned",
    "open-esp-radio-esp32s31-embassy-wifi/owned-network",
]
compat-network = [
    "dep:embassy-net-compat",
    "open-esp-radio-esp32s31-embassy-wifi/compat-network",
]

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = 3
panic = "abort"
strip = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "5b8b56036abd5f4646505b15988cc9da51cec826" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }

[workspace]
resolver = "3"
