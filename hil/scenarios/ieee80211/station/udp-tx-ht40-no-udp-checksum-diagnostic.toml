schema = 5
id = "udp-tx-ht40-no-udp-checksum-diagnostic"
description = "Split-core HT40 saturated TX software UDP checksum-cost diagnostic"
repetitions = 3
transfer = "identical-image"
tags = ["diagnostic", "udp", "station", "tx", "ht40", "split-core", "core0", "coarse-cycles", "checksum", "checksum-ab"]

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.datapath]
tx_udp_checksum = "omit-ipv4-diagnostic"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1472
offer = { tx_bps = 130000000 }

[wifi.workload.criteria]
minimum_tx_bps = 90000000
maximum_idle_channel_utilization_255 = 64
