schema = 5
id = "bluetooth-trouble-gatt-trace"
description = "The plaintext Trouble GATT cycles on the image that records the Bluetooth LE trace: each connection's drained trace holds its accepted indication, opening, admitted connection events with anchored ends and closing"
role = "investigation"
# The sample of #364's investigation: 30 traced connections per run, whose
# failed cycle keeps its trace in the post-mortem. The product GATT
# scenarios count the loss in `connections-lost-before-att`.
repetitions = 10
tags = ["bluetooth", "peripheral", "gatt", "trouble", "trace", "diagnostic", "air-exclusive"]

[bluetooth]
kind = "gatt"
trace = true
