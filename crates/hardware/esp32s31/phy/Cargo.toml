[package]
name = "oer-esp32s31-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free Rust ESP32-S31 PHY state machines"

[features]
default = []
validation-probes = []
# Destructive, one-shot lifecycle fault injection. Never enabled by default.
lifecycle-fault-injection = []
# Retain value-only RF measurements in registration and role start reports.
registration-diagnostics = []
# Let a diagnostic image set the vendor's temperature-tracking debug policy,
# which forces the RFPLL and calibration tracking branches.
tracking-diagnostics = []

[dependencies]
oer-radio-analog = { path = "../../radio/analog" }
oer-time = { path = "../../../time" }
oer-esp32s31-hal = { path = "../hal" }

[dev-dependencies]
oer-time-virtual = { path = "../../../adapters/virtual/time" }
pin-project-lite = "0.2.17"
oer-esp32s31-hal = { path = "../hal", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "hardware"
platform = "chip"
chip = "esp32s31"
