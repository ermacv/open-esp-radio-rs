# The single pin of every ESP32-S31 vendor artifact this repository compares
# against.
#
# Each artifact names its upstream source and SHA-256. `cargo xtask
# vendor-fetch esp32s31` downloads every fetchable artifact into
# `target/vendor/<source>/<revision>/<path>` and verifies it; the vendor
# scenarios default to those paths and authenticate every input against this
# file. Changing a pin means changing this file, and production follows the
# pinned behaviour. Historical hashes in reviewed register evidence and
# reference notes record the artifact a fact was observed in; they are not
# pins.
schema = 1

