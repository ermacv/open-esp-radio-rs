receiver = "esp32s31::pp-task"
execution-context = "unspecified"
consumer-profile = "wifi-sta-lifecycle"
consumer-source = "wifi-sta-lifecycle"
consumer-entry = "wifi-sta-lifecycle::ppTask@0x10067fa0"
delivery-operation = "rtos.queue.receive"
delivery-output-role = "item-out"
delivery-selector-offset = 0
delivery-selector-width = 32
