[package]
name = "oer-hil-stand-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL stand file: its hubs, boards and fixture sections, and their validation"

[dependencies]
oer-chip-profile = { path = "../../../tools/chip-profile" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
hil = "operation"
inputs = ["hil/stand/stand.example.toml", "platform/*/chip.toml"]
