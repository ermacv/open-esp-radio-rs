schema = 5
id = "access-point-tcp-rx"
description = "Two AP ownership epochs with exact inbound TCP delivery"
transfer = "identical-image"
tags = ["qualification", "wifi", "access-point", "network", "tcp", "rx"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 90

[wifi.workload.traffic]
