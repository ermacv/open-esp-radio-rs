[package]
name = "oer-device-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "What a board's flash holds: the one write of an image bundle into a board and the receipts it publishes"

[dependencies]
oer-chip-profile = { path = "../../chip-profile" }
oer-device-flash = { path = "../flash" }
oer-device-lock = { path = "../lock" }
oer-device-openocd = { path = "../openocd" }
oer-durable = { path = "../../durable" }
oer-image-bundle = { path = "../../image-bundle" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
host-layer = "foundation"
host-app = "devices"
host-boundary = "library"
