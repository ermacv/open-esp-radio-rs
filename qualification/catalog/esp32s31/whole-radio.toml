[[items]]
id = "whole-radio-active-operation-power-saving-and-shutdown-calibration-state-cache"
section = "whole-radio-active-operation-power-saving-and-shutdown"
title = "Calibration state/cache"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "PHY owns schema- and identity-validated snapshots, cache export and cold partial replay. Cold release regenerates the cache from the final post-tracking state instead of returning the potentially stale cold-start snapshot. The cold graph restores semantic calibration products, rebuilds hardware-resident frequency/RX gain state and falls back to full calibration for invalid input. Retained RF wake keeps the same registered calibration epoch."
source-paths = []

[[items]]
id = "whole-radio-active-operation-power-saving-and-shutdown-shared-rf-powered-idle-frontier"
section = "whole-radio-active-operation-power-saving-and-shutdown"
title = "Shared RF powered-idle frontier"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "Final client release produces an affine owner proving an empty client set while retaining the physically powered radio and calibration state. Only this owner can enter the source-owned RF close transaction."
source-paths = []

[[items]]
id = "whole-radio-active-operation-power-saving-and-shutdown-rf-sleep-modem-power-down"
section = "whole-radio-active-operation-power-saving-and-shutdown"
title = "RF sleep / modem power-down"
status = "partial"
level = "composed-product"
scope-and-limitations = "PHY exposes exact RF close. The production Wi-Fi supervisor can either wake that closed RF domain while retaining registration, or continue through temperature-sensor shutdown, route-clock release, captured Wi-Fi clock/reset restoration and cold-owner reconstruction. These explicit idle transactions do not implement timed modem sleep or protocol power-save signaling."
source-paths = []

[[items]]
id = "whole-radio-active-operation-power-saving-and-shutdown-rf-wake-resume"
section = "whole-radio-active-operation-power-saving-and-shutdown"
title = "RF wake / resume"
status = "partial"
level = "composed-product"
scope-and-limitations = "PHY implements a fail-stop retained RF wake transaction and the production Wi-Fi supervisor composes it from a fully stopped, final-client frontier through Wi-Fi client reacquisition and RX restoration. Bluetooth and IEEE 802.15.4 resume, scheduled sleep, cancellation policy above the owner actor and hardware qualification remain incomplete."
source-paths = []

[[items]]
id = "whole-radio-active-operation-power-saving-and-shutdown-full-powered-shutdown"
section = "whole-radio-active-operation-power-saving-and-shutdown"
title = "Full powered shutdown"
status = "partial"
level = "composed-product"
scope-and-limitations = "The Wi-Fi production supervisor composes idle quiescence and cold-owner return. The projected Bluetooth idle powered-release fact defines its standalone boundary. IEEE 802.15.4 and joint-protocol shutdown remain uncomposed; these idle paths do not establish arbitrary active/faulted-role teardown."
source-paths = []

[[items]]
