id = "C5_BLOB_LIBPP_WDEV_PROCESS_FIQ"
description = "ESP32-C5 libpp.a of espressif/esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21, sha256 9d6192d056021523ce567a5de3a9e7b1fe2e9f6da23349c68a4e2cee0c8c3046. Cross-chip derivation of the reviewed ESP32-S31 source BLOB_LIBPP_WDEV_PROCESS_FIQ: C5 libpp.a[wdev.o] wDev_ProcessFiq differs structurally from the ESP32-S31 body only by additional calls: it also samples and clears a separate RX-EVM interrupt (hal_mac_interrupt_get_rx_evm after pwr_hal_get_intr_raw_signal and hal_mac_interrupt_clr_rx_evm after hal_mac_interrupt_clr_bsscolor) and posts one more event before lmacProcessRxSucData. Its status dispatch masks (0x80, 0x100, 0x4000, 0x8000, 0x80000, 0x600000, 0x2000000, 0x18000000, 0xF0 and 0xF) and the order of the handlers they select (lmacPostTxComplete, lmacProcessAllTxTimeout, lmacProcessCollisions, lmacProcessRxSucData, the TSF-timer, TBTT, beacon-miss and beacon-filter handlers) equal the ESP32-S31 body, so the status bits these handlers identify are the same bits."

