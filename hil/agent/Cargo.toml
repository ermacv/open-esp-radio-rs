[package]
name = "oer-hil-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Chip-independent HIL target logic shared by the firmware runtime and its host tests"

[features]
# The secure-GATT evidence, with the protocol's Bluetooth LE family.
secure-gatt = [
    "dep:bt-hci",
    "dep:oer-bluetooth-gatt-trouble",
    "dep:trouble-host",
    "oer-hil-protocol/bluetooth",
]

[dependencies]
crc = "3.3.0"
embassy-sync = "0.8.0"
heapless = "0.9.3"
oer-hil-protocol = { path = "../protocol", default-features = false, features = ["async-io"] }
bt-hci = { version = "=0.10.1", optional = true }
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"
log = "0.4"
oer-bluetooth-gatt-trouble = { path = "../../crates/adapters/trouble/bluetooth/gatt", optional = true, features = ["secure"] }
trouble-host = { version = "=0.8.0", git = "https://github.com/ermacv/trouble", rev = "a6af435ba1539cead0afce04718ad8a089bcc4b9", optional = true, default-features = false, features = ["default-packet-pool", "gatt", "peripheral"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }
oer-bluetooth-controller = { path = "../../crates/protocols/bluetooth/le/controller" }
oer-bluetooth-hci = { path = "../../crates/protocols/bluetooth/hci" }
oer-bluetooth-hci-transport = { path = "../../crates/services/bluetooth/hci/transport" }
oer-bluetooth-radio = { path = "../../crates/protocols/bluetooth/le/radio" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "portable"
host-layer = "execution"
host-app = "hil"
host-boundary = "application"
hil = "observation"
# The protocol code behind this feature has its own tests.
test-feature-sets = ["secure-gatt"]
