[package]
name = "oer-esp32s31-pac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Closed typed ESP32-S31 radio peripheral access crate"

[features]
validation-probes = ["oer-esp32s31-pac-raw/validation-probes"]

[dependencies]
oer-memory = { path = "../../../memory" }
oer-esp32s31-pac-raw = { path = "raw", features = ["critical-section"] }

[dev-dependencies]
oer-esp32s31-pac-raw = { path = "raw", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "esp32s31"
