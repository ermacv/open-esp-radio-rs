[package]
name = "oer-xarxa-upstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unmodified upstream Xarxa driver boundary with bounded packet-owner queues"

[dependencies]
embassy-sync = "0.8.0"
oer-network = { path = "../../../network/interface" }
oer-wifi-datapath = { path = "../../../protocols/ieee80211/datapath" }
xarxa-driver = { git = "https://github.com/embassy-rs/xarxa", rev = "14c369bbcbe8ee7167488ac9c9e18be059d83555", features = ["async"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-net-upstream = { package = "embassy-net", git = "https://github.com/embassy-rs/embassy", rev = "c0fdd08e94138105fba8be3133c4ced91afc30fc", default-features = false, features = ["medium-ethernet", "ipv4", "udp", "icmp-ping-reply"] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "adapter"
platform = "portable"
