schema = 5
id = "diagnostic-ap-airtime-rx40-observed"
description = "Temporary AP uplink-only control for terminal MAC RX error correlation"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic-ap-airtime", "diagnostic-ap-rx-hardware"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
