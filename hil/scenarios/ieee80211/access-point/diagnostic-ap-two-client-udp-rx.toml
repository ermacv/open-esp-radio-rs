schema = 5
id = "diagnostic-ap-two-client-udp-rx"
description = "Two-client AP UDP RX endpoint and per-flow accounting smoke"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "rx"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 10
payload_bytes = 1400
offer = { rx_bps = 16000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 2000000
minimum_bps_per_flow = 1000000
maximum_flow_skew_percent = 50
