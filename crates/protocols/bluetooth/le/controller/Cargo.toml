[package]
name = "oer-bluetooth-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Bluetooth LE Controller pieces: event geometry, authenticated PDU receive and vendor coexistence priorities"

[dependencies]
bt-hci = "=0.10.1"
oer-bluetooth-ll = { path = "../ll" }
oer-bluetooth-radio = { path = "../radio" }

[features]
# Diagnostic images only: vendor HCI command 0xFC01 arms one corruption of a
# received MIC. Product images never enable it.
diagnostic-mic-fault = []

[lints]
workspace = true

[package.metadata.open-radio]
layer = "protocol"
platform = "portable"
