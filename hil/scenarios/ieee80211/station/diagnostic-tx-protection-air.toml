schema = 5
id = "diagnostic-tx-protection-air"
description = "Bounded HT40 transmit workload with independent capture for RTS/CTS investigation; delivery alone does not qualify protection"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "station", "tx-protection", "ht40", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 512
offer = { rx_bps = 4000000, tx_bps = 4000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 100000
minimum_tx_bps = 100000
minimum_combined_bps = 200000
