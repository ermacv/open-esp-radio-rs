schema = 5
id = "diagnostic-ap-balanced-airtime"
description = "Two AP downlink streams offered 130 Mbit/s each with task-poll and optional per-peer service-budget accounting"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "access-point", "multi-client", "ht40", "airtime"]

[wifi]
image = "diagnostic-task-poll"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 1
boots = 1
timeout_seconds = 150
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 12
payload_bytes = 1472
offer = { tx_bps = 130000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
minimum_bps_per_flow = 1
