id = "C5_ROM_REV100_WIFI_RUNTIME_MMIO_GAPS"
description = "ESP32-C5 rev 1.0 ROM esp32c5_rev100_rom.elf of espressif/esp-rom-elfs 20260528, sha256 49693d745eb4b4e6e6c77be4f5213765d545d8c7a1d9742a8a619bf596c4e27a. Cross-chip derivation of the reviewed ESP32-S31 source ROM_REV0_WIFI_RUNTIME_MMIO_GAPS: comparing full function bodies, libpp.a[hal_mac_ctl.o] hal_he_get_bss_color (member sha256 ea541222d62c1b9733bb676d27207c409d8333a23b76081c50f65095a85a385e, size 0x2a), the definition the C5 libraries link, is identical modulo the modem address map to the ESP32-S31 libpp.a definition, whose body equals the reviewed S31 ROM body modulo branch targets; ROM hal_wdev_timer_set_target (size 0x1c) is identical modulo the modem address map and software structure offsets; libpp.a[hal_tsf.o] hal_wdev_timer_target_enable (member sha256 f3deb57ff1eebbeac8b5a1601935476bb05c2d0d05373c57a3ce2608ca7d0fb0, size 0x2a), the definition the C5 libraries link, is identical modulo the modem address map to the ESP32-S31 libpp.a definition, whose body equals the reviewed S31 ROM body modulo branch targets; libpp.a[hal_tsf.o] tsf_hal_set_rx_beacon_abort_tsf_time_deviation_sync_enable (member sha256 f3deb57ff1eebbeac8b5a1601935476bb05c2d0d05373c57a3ce2608ca7d0fb0, size 0x12), the definition the C5 libraries link, is identical modulo the modem address map to the ESP32-S31 libpp.a definition, whose body equals the reviewed S31 ROM body modulo branch targets; libpp.a[hal_tsf.o] tsf_hal_set_tbtt_rf_ctrl_wait_cycles (member sha256 f3deb57ff1eebbeac8b5a1601935476bb05c2d0d05373c57a3ce2608ca7d0fb0, size 0x1a), the definition the C5 libraries link, is identical modulo the modem address map to the ESP32-S31 libpp.a definition, whose body equals the reviewed S31 ROM body modulo branch targets; libpp.a[hal_tsf.o] tsf_hal_set_tsf_time_deviation (member sha256 f3deb57ff1eebbeac8b5a1601935476bb05c2d0d05373c57a3ce2608ca7d0fb0, size 0x18), the definition the C5 libraries link, is identical modulo the modem address map to the ESP32-S31 libpp.a definition, whose body equals the reviewed S31 ROM body modulo branch targets; libpp.a[hal_tsf.o] tsf_hal_set_tsf_time_deviation_sync_enable (member sha256 f3deb57ff1eebbeac8b5a1601935476bb05c2d0d05373c57a3ce2608ca7d0fb0, size 0x14), the definition the C5 libraries link, is identical modulo the modem address map to the ESP32-S31 libpp.a definition, whose body equals the reviewed S31 ROM body modulo branch targets to its ESP32-S31 counterpart. Modem addresses follow the reviewed map from 0x2010_xxxx to 0x600A_xxxx: equal offsets except the segments 0x2014, 0x4CA0..0x4D3C and 0x4D4C..0x4EB8 (-4), 0x44E0..0x452C, 0x4990..0x49A0 and 0x4D40 (-8), 0xD8B4..0xD8D0 (-4), and the eight reverse-stride TX queue banks, which move from 0x54D8 - 0x7C * i to 0x54B0 - 0x78 * i with bank offsets 0x74 and above lowered by 4. Functions of the S31 source whose C5 bodies differ structurally or are absent (pm_clear_wakeup_signal) are not evidence for the C5 facts."
