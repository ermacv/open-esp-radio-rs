owner = "hil.tcp.tx-pattern"
scope = "hil"
reason = "qualification-window"
placement = "required-psram"
region = "external-psram"
count = 1
element_capacity = 32768

[[rules]]
symbol = "*task4POOL"
owner = "runtime.embassy-task-state"
scope = "runtime"
reason = "generated-task-state"
placement = "preferred-psram"
region = "external-psram"
optimization = "Large futures should be inspected when local arrays or owners unexpectedly enter task state."
