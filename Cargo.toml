[workspace]
members = [
    "crates/open-esp-radio",
    "crates/open-esp-radio-embassy-net",
    "crates/open-esp-radio-esp-hal-esp32s31",
    "crates/open-esp-radio-hal-esp32s31",
    "crates/open-esp-radio-ieee80211",
    "crates/open-esp-radio-mac-esp32s31",
    "crates/open-esp-radio-pac-esp32s31",
    "crates/open-esp-radio-phy-esp32s31",
    "crates/open-esp-radio-svd-esp32s31",
    "crates/open-esp-radio-wpa2",
    "tools/pac-gen",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# The ESP32-S31 async-platform branch uses register accessor fixes that are
# still carried by the matching PAC fork.
[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "3df8dc705" }
