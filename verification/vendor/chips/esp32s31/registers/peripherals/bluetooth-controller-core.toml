name = "INIT_ZERO_00B8"
description = "One complete controller function writes the finite zero image twice. Its operation meaning remains unknown."
addressOffset = 0xB8
size = 32
access = "write-only"
[[peripherals.registers.register.fields]]
name = "IMAGE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]
[peripherals.registers.register]
name = "OPERATIONAL_CONTROL_0204"
description = "Complete operational functions independently set and clear bit zero through fresh-read RMW operations."
addressOffset = 0x204
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "CONTROL_0"
bitOffset = 0
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "OPERATIONAL_STATUS_0208"
description = "Two complete operational functions consume bit zero as the second wait predicate after setting OPERATIONAL_CONTROL_0204 bit zero. They continue waiting while this bit is one and SCHEDULER_STATE.BUSY is set, then clear the control bit. The remaining bits and the hardware meaning of bit zero are unknown."
addressOffset = 0x208
size = 32
access = "read-only"
[[peripherals.registers.register.fields]]
name = "STATUS_0"
bitOffset = 0
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "OPERATIONAL_VALUE_0218"
description = "Operational functions read the complete word. A complete writer publishes bit 31 set, bits 30:20 clear and a dynamic low-20-bit image."
addressOffset = 0x218
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "DYNAMIC_LOW_20"
bitOffset = 0
bitWidth = 20
[[peripherals.registers.register.fields]]
name = "ZERO_IMAGE_20_30"
bitOffset = 20
bitWidth = 11
[[peripherals.registers.register.fields]]
name = "ONE_IMAGE_31"
bitOffset = 31
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "OPERATIONAL_STATUS_0324"
description = "Two complete operational functions read the complete word; its inner encoding remains unknown."
addressOffset = 0x324
size = 32
access = "read-only"
[[peripherals.registers.register.fields]]
name = "IMAGE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]
[peripherals.registers.register]
name = "OPERATIONAL_WORD_036C"
description = "Complete operational functions read and publish dynamic complete images. Independent paths also clear bits 3:0 or 7:4; overlapping whole-word authority remains a register-level fact rather than overlapping SVD fields."
addressOffset = 0x36C
size = 32
access = "read-write"

