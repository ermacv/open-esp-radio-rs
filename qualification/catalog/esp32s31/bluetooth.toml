status = "partial"
level = "lower-primitive"
scope-and-limitations = "Static DTM, advertising, scanning and peripheral graphs have CPU/hardware handoff contracts in [controller memory](../../../esp32s31/driver/bluetooth/memory/src/scheduler_pool.rs). Missing role graphs and packet-engine contracts are not implied; no radio role builds the graphs since #770 (tag `legacy-radio-2026-10-16`), and #773 rebuilds the Bluetooth orchestration."

