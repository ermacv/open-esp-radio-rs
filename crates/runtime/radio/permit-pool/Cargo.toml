[package]
name = "oer-radio-permit-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free first-in, first-out pool of a radio port install's permits"
readme = "README.md"

[dependencies]
oer-radio-port = { path = "../../../radio/port" }

[dev-dependencies]
# The crate's own tests run the shared pool rule.
oer-radio-port = { path = "../../../radio/port", features = ["test-support"] }
oer-time = { path = "../../../time" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "runtime"
platform = "portable"
