[package]
name = "oer-example-esp32s31-station"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-net-upstream = { package = "embassy-net", git = "https://github.com/embassy-rs/embassy", rev = "c0fdd08e94138105fba8be3133c4ced91afc30fc", default-features = false, features = ["dhcpv4", "medium-ethernet", "udp", "icmp-ping-reply"], optional = true }
oer-esp32s31-runtime = { path = "../../platform/esp32s31/runtime", features = ["psram-task-stack"] }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
embassy-net-owned = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "1fa0957c07398f83c9795b645a5a6ceda1270f91", features = ["dhcpv4", "medium-ethernet", "udp"], optional = true }
embassy-net-released = { package = "embassy-net", version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "udp"], optional = true }
esp-backtrace = { git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["esp32s31", "panic-handler", "println"] }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["esp32s31", "rt", "unstable"] }
esp-println = { git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["auto", "esp32s31", "log-04"] }
oer = { package = "open-esp-radio", path = "../../crates/oer", default-features = false, features = ["wifi"] }
oer-esp32s31-executor-embassy = { path = "../../crates/adapters/embassy/esp32s31/executor", features = ["esp32s31"] }
static_cell = "2.1.1"

[features]
default = ["upstream-network"]
upstream-network = [
    "dep:embassy-net-upstream",
    "oer/upstream-xarxa",
]
owned-network = [
    "dep:embassy-net-owned",
    "oer/owned-xarxa",
]
embassy-network = [
    "dep:embassy-net-released",
    "oer/embassy-smoltcp",
]

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = 3
panic = "abort"
strip = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "507d14dbccfc26128b929b044d76f09cf2d1d2f6" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }

[workspace]
resolver = "3"

[build-dependencies]
oer-firmware = { path = "../../tools/firmware", default-features = false }

# One official timer ABI for the registry platform and Git network stack.
# This selects an unmodified published crate; no upstream sources are patched.
[patch."https://github.com/embassy-rs/embassy"]
embassy-time-driver = { version = "=0.2.2", registry = "crates-io" }

[package.metadata.open-radio]
scope = "development"
layer = "application"
platform = "chip"
chip = "esp32s31"
