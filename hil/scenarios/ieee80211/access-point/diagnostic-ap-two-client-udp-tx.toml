schema = 5
id = "diagnostic-ap-two-client-udp-tx"
description = "Two-client AP UDP TX endpoint and per-flow accounting smoke"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "tx", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 10
payload_bytes = 1400
offer = { tx_bps = 16000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 2000000
minimum_bps_per_flow = 1000000
maximum_flow_skew_percent = 50
