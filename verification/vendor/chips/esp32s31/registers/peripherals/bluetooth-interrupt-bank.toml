[[peripherals]]
name = "BLUETOOTH_INTERRUPT_BANK"
description = """
Bluetooth controller interrupt programming, enable, status, acknowledgement,
snapshot and diagnostic registers. This physical view is independent from the
controller task lifecycle so ownership can transfer to the hard ISR without
also exposing scheduler, sleep or memory-management state.
"""
baseAddress = 0x20101000

