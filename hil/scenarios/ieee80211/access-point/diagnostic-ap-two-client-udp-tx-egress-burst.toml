schema = 5
id = "diagnostic-ap-two-client-udp-tx-egress-burst"
description = "Same-image two-client AP UDP TX pre-DMA destination-burst discriminator"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "tx", "txq", "egress", "task-residence"]

[wifi]
image = "diagnostic-task-residence"

[wifi.datapath]
tx_buffer = "owned-sram-promotion-burst-diagnostic"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 150
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 65000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
minimum_bps_per_flow = 1
maximum_flow_skew_percent = 100
