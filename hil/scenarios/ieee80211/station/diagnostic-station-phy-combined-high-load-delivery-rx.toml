schema = 5
id = "diagnostic-station-phy-combined-high-load-delivery-rx"
description = "Combined PHY calibration during high-load HT40 RX delivery with recovery headroom"
repetitions = 3
transfer = "identical-image"
tags = ["phy-maintenance", "diagnostic", "station", "pause", "udp", "ht40", "high-load"]
control = "diagnostic-station-phy-baseline-high-load-delivery-rx"

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 100000000 }

[wifi.workload.maintenance]
operation = "calibration"

[wifi.workload.observation]
openwrt_tx_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 95000000
maximum_rx_silence_ms = 50
