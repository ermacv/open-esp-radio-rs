[package]
name = "oer-vendor-artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The pinned vendor artifacts of a chip: the one reader of artifacts.toml, the host-wide store and fetching into it"

[dependencies]
oer-durable = { path = "../durable" }
oer-chip-profile = { path = "../chip-profile" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
host-layer = "foundation"
# The tests parse the tracked pins with the chip profiles.
inputs = ["verification/*/artifacts.toml", "platform/*/chip.toml"]
