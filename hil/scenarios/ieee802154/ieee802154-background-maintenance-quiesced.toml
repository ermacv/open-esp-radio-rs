schema = 5
id = "ieee802154-background-maintenance-quiesced"
description = "Shared PHY tracking once per tracking period while an IEEE 802.15.4 session receives, under the quiesced admission: the device pauses its MAC and proves quiescence before each tracking; the device still transmits afterwards"
tags = ["ieee802154", "arbiter-client", "on-air", "phy-maintenance", "receive", "transmit"]

[ieee802154]
kind = "background-maintenance"
boots = 2
channel = 15
periods = 10
policy = "quiesced"
