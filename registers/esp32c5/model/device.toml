schema = 3
chip = "esp32c5"
address-space = "cpu"
fragments = [
    "peripherals/ieee802154-mac.toml",
    "peripherals/ieee802154-interrupt-route.toml",
    "peripherals/modem-etm.toml",
    "peripherals/modem-syscon-radio.toml",
    "peripherals/modem-lpcon-shared-clock.toml",
]

[device]
name = "ESP32C5_RADIO"
version = "0.1"
description = """
ESP32-C5 modem/radio registers owned by the radio drivers. This first stage
    publishes the IEEE 802.15.4 MAC aperture, its interrupt route and
    the modem ETM channels it programs, and the modem clock gates and
    resets of its vendor clock devices. Unknown fields are omitted."""
vendor = "Espressif"
vendor-id = "ESP"
series = "ESP32-C5"
license-text = "MIT OR Apache-2.0"
address-unit-bits = 8
width = 32
svd-schema = "1.3"
svd-schema-location = "CMSIS-SVD.xsd"

[device.register-defaults]
