[[enum-domains]]
name = "MacInterface"
description = "Reviewed ESP32-S31 Wi-Fi MAC interface selector shared by address, BSSID, crypto, TX and ordinary receive-BlockAck transactions."

[[enum-domains.values]]
name = "Station"
value = 0
description = "Infrastructure-station hardware context; traced from STA callers into interface and key-control fields."
sources = ["BLOB_LIBPP_HAL_MAC_SET_ADDR", "BLOB_LIBPP_HAL_MAC_SET_BSSID", "BLOB_LIBPP_HAL_CRYPTO", "BLOB_LIBPP_HAL_MAC_TX", "BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[enum-domains.values]]
name = "AccessPoint"
value = 1
description = "SoftAP hardware context; traced from AP callers into interface and key-control fields."
sources = ["BLOB_LIBPP_HAL_MAC_SET_ADDR", "BLOB_LIBPP_HAL_MAC_SET_BSSID", "BLOB_LIBPP_HAL_CRYPTO", "BLOB_LIBPP_HAL_MAC_TX", "BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[enum-domains.values]]
name = "Context2"
value = 2
description = "Reviewed third hardware selector accepted by the complete EDCA and RX BlockAck leaves; its protocol-role semantics are not assigned."
sources = ["BLOB_LIBPP_HAL_MAC_TX", "BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[enum-domains.values]]
name = "Context3"
value = 3
description = "Reviewed fourth hardware selector accepted by the complete EDCA and RX BlockAck leaves; its protocol-role semantics are not assigned."
sources = ["BLOB_LIBPP_HAL_MAC_TX", "BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[enum-domains]]
name = "Ieee802154SharedTxOnDelayOverride"
description = "The sole aligned shared-baseband field image accepted after the common BTBB initializer when entering the pinned IEEE 802.15.4 lifecycle."

[[enum-domains.values]]
name = "Delay50"
value = 0x01400000
description = "Argument 50 encoded by the complete shared setter as ((50 - 10) << 3) = 0x140, then aligned to AUXILIARY_TX_ON_DELAY bits 16:26."
sources = ["BLOB_LIBBTBB_SHARED_TX_TIMING_INIT", "ESP_RADIO_7F914782_S31_IEEE802154_INIT"]

[[enum-domains]]
name = "ModemPowerTickTarget"
description = "The sole fixed-crystal modem-power tick target accepted by the ESP32-S31 common-PHY prelude."

[[enum-domains.values]]
name = "Xtal40Mhz"
value = 39
description = "The fixed 40 MHz ESP32-S31 crystal encoded by complete phy_get_xtal_freq as frequency_mhz minus one."
sources = ["BLOB_LIBPHY_PHY_GET_XTAL_FREQ"]

[[enum-domains]]
name = "LpPowerDetectorCircuitMode"
