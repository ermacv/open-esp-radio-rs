# Optional ESP32-S31 production comparison add-on. Generic analysis and PAC
# publication do not require this file.
schema = 3
id = "esp32s31-radio-verification-v2"
report = "generated/reports/verification.json"
evidence-index = "evidence/vendor-evidence.json"
policy = "verification-policy.toml"

[[suites]]
id = "phy"
rust-artifact-role = "rust-artifact"
rust-prefix = "open_phy_trace_"
profiles = ["profiles/compiled-equivalence.toml"]
dispositions = ["dispositions/phy.toml"]
baselines = ["baselines/phy.toml"]
gate = "regression"
# Only production-bound whole-function and bounded-feature matches count.
# The 51 implemented-but-unqualified PHY entries remain visible research
# evidence and must not inflate this regression floor.
match-floor = 56
[[suites.vendor]]
source = "archive"
all = true
[[suites.vendor]]
source = "rom"
prefix = "phy_"

# Each prefix has its own suite because one suite may select a source only
# once. This keeps BT/BLE neighbors in libbtbb and generic coexistence symbols
# outside the IEEE 802.15.4 inventory without enumerating a brittle symbol list.
