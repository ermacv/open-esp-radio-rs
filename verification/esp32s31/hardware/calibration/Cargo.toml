[package]
name = "oer-esp32s31-phy-vendor-calibration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Hardware cross-check of the vendor and production ESP32-S31 PHY calibration on one board"

[dependencies]
oer-esp32s31-firmware = { path = "../../../../tools/firmware", features = ["device"] }
oer-esp32s31-hil-calibration-artifact = { path = "../../../../hil/targets/esp32s31/calibration-artifact" }
oer-esp32s31-phy = { path = "../../../../crates/hardware/esp32s31/phy", features = ["validation-probes"] }
oer-hil-runner-core = { path = "../../../../hil/host/runner-core" }
oer-hil-protocol = { path = "../../../../hil/protocol" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.8.1", default-features = false }
toml = "1.1"

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "verification"
platform = "host"
