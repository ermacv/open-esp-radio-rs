[package]
name = "oer-symbol-lineage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Recover vendor function names across obfuscated archive revisions"
readme = "README.md"

[dependencies]
clap = { version = "=4.5.48", features = ["derive"] }
object = { version = "=0.39.1", default-features = false, features = ["archive", "elf", "read_core", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["archive", "elf", "read_core", "std", "write"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "tool"
platform = "host"
