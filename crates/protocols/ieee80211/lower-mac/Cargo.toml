[package]
name = "oer-ieee80211-lower-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable IEEE 802.11 lower-MAC radio port: one hardware transmission attempt, receive events and controls"
readme = "README.md"

[features]
# Lets a host test's dropped owner skip its debug assertion while a panic
# unwinds.
test-support = ["oer-radio-port/test-support", "oer-ieee80211-port/test-support"]

[dependencies]
heapless = "0.9.3"
oer-ieee80211-port = { path = "../port" }
oer-ieee80211-mac = { path = "../mac" }
oer-radio-coex = { path = "../../../radio/coex" }
oer-radio-port = { path = "../../../radio/port" }
oer-time = { path = "../../../time" }

[dev-dependencies]
# The crate's own tests run the shared conformance suite on the model.
oer-radio-port = { path = "../../../radio/port", features = ["test-support"] }
oer-ieee80211-port = { path = "../port", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "protocol"
platform = "portable"
