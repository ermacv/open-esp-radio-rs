[package]
name = "oer-esp32s31-ieee80211-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP-HAL whole-radio singleton and platform adapter for ESP32-S31"

[features]
default = []
esp32s31 = [
    "dep:esp-hal",
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-phy",
    "dep:oer-esp32s31-ieee80211",
    "dep:oer-esp32s31-ieee80211-mac",
    "dep:critical-section",
]

[dependencies]
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "a228e85823b40e79c3a4e93fe006bed6c99dd2b8", default-features = false, features = ["esp32s31", "unstable"], optional = true }
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal", optional = true }
oer-esp32s31-phy = { path = "../../../../hardware/esp32s31/phy", optional = true }
oer-esp32s31-ieee80211 = { path = "../../../../hardware/esp32s31/driver/ieee80211", optional = true }
oer-esp32s31-ieee80211-mac = { path = "../../../../hardware/esp32s31/driver/ieee80211/mac", optional = true }
critical-section = { version = "1.2.0", optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "adapter"
platform = "chip"
chip = "esp32s31"
