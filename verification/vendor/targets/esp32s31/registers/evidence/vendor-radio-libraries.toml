id = "PUBLIC_ESP32S31_BLE_COMPLETION_ROLES"
description = "Public espressif/esp32s31-bt-lib Git commit 31c30949541a5d3abd4043a1cb66d55aa55577dd, initial libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63 and initial libbtdm_common.a sha256 bd9007072c6ab94df5f29d8b96dc65a69cb4406568c75a64022c8121e242b96c, retain unobfuscated scheduler and DTM roles. Complete-body and call-extent comparison maps r_sched_txn_onSchedHwListDone (0x1ca) to current r_sym_ble_rmNuzAO8kQQQXQIpTzGZ (0x1ce), r_btdm_sched_pick_finished_items (0x142) to current r_sym_bt_M9nG353V0svWrv1l1zGw (0x142), r_btdm_recycle_in_task (0x64) to current r_sym_bt_uNi9OHmE7XdXfGqTelU5 (0x70), r_btdm_sched_pop_executed_sch (0x78) to current r_sym_bt_WHYoiw8ufY0AEM2KSRK1 (0x78), r_btdm_recycle_process_dequeued_sch (0x82) to current r_sym_bt_QsLKLOCC2pct4rL8uFBN (0x82), and r_ble_lll_dtm_recycle_sch_item (0x144) to current r_sym_ble_kdHGLPeGDJlAvxmbjQ6e (0x150). Current complete bodies independently establish the finished-list, software completed-queue and item callback behavior; the earlier archive supplies role names only and no current MMIO or ABI claims."

[[sources]]
id = "BLOB_LIBBLE_DTM_RX_RSSI"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete member 94.o symbol esp_ble_get_dtm_rx_rssi (0x8) is a direct tail call to complete member 55.o symbol r_sym_ble_CLEB51J8jgSOcX50XteR (0x14). The target loads the active DTM environment and returns byte +0x24 with signed lb. The current linked recycle body independently copies returned RX packet result byte +0x0f into the same environment byte only after accepting a zero low-24 result image. This proves the copied high byte is a signed DTM RSSI value. It does not establish a physical unit, calibration, or meanings for the rejected low 24 bits."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_WAIT_TAIL"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete member 19.o symbols r_sym_bt_DkrQYQcoyzIHdYi0CzWE (origin size 0x138) and r_sym_bt_qkNMymdnaJnYUfzpKgEp (0x2b0). Both complete functions share the same controller wait tail. After setting 0x20101204 bit zero, software first observes 0x20101324 bit zero against 0x2010107c bit 31, then observes 0x20101208 bit zero against the same scheduler-state bit, and finally clears 0x20101204 bit zero. The second predicate continues while 0x20101208 bit zero is one. The evidence assigns no meaning to that bit or to the unconsumed bits."

[[sources]]
id = "BLOB_LIBBTDM_RUNTIME_OPERATIONAL_GAPS"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48d807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete member 20.o symbols r_sym_bt_32zs9B7Gv9vHIVpsl2A7 (origin size 0x2e0) and r_sym_bt_aOsjkDNQyOII2OseK6av (0x34e). Their direct accesses publish finite complete images 0x10, 0x20, 0x40 and 0x80 as well as dynamic complete images to 0x20108804, read and clear the complete word at 0x2010d01c, and read or publish complete dynamic images at 0x2010d064. No undocumented operation meaning is assigned."

[[sources]]
id = "BLOB_LIBBTDM_SLEEP_TIMER_REGISTERS"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete btdm_sleep.c member 20.o functions. The timer-programming path writes three computed words to 0x20101094..0x2010109c and sets bit 31 in 0x20101090. Independent sleep/wakeup paths set bit 26, wait for hardware to clear it, and then consume the latched controller time from 0x201010ac. Initialization also proves control bits 0..2 and bit 24. The evidence establishes a sleep-timer transaction but does not assign inner counter/window semantics to the three data words."

[[sources]]
id = "BLOB_LIBBTDM_SLEEP_TIMER_SNAPSHOT"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48d807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete btdm_sleep.c member 20.o symbol r_sym_bt_32zs9B7Gv9vHIVpsl2A7. Two exact paths set 0x20101090 bit 26, wait for hardware to clear it, then read the ordered snapshot words at 0x201010ac, 0x201010b0 and 0x201010b4 into software-state offsets 0x2c, 0x30 and 0x34. The order and whole-word widths are proven; inner counter or window meanings remain unknown."

[[sources]]
id = "BLOB_LIBBLE_CONTROLLER_TRANSACTION_WORDS"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; direct instruction evidence from r_sym_ble_FtKLgw2CvtskaTYKEjHw, r_sym_ble_VliZtGKQHLuJN6iEJcxJ and r_sym_ble_cRMRj3P6QraQCjLZCJ9N proves the low-twenty-bit compressed SRAM-pointer reads at 0x20101080. Member 49.o ble_lll.c symbol r_sym_ble_beY9ajK3XnTlD7qU4ak9 proves the transaction at 0x201010c4; member 51.o ble_lll_conn.c symbol r_sym_ble_csMWMy8qH8yQ1PZ1HO3d and member 110.o sched_txn.c symbol r_sym_ble_veM5fsFGVyT0v4mGAXih prove the same positional transaction shape at 0x201010d8. The sequences publish bit 31 with a dynamic low-twenty-bit value while bits 20..29 are zero, poll bit 30, and republish while bit 31 is clear. Source identities are software-context hints and do not establish RX, TX or link-layer hardware meaning."

[[sources]]
id = "BLOB_LIBBLE_HW_POSITIONAL_WORD_1874"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; ble_hw.c member 10.o symbols r_sym_ble_52DuDTZGakdd8pNHYCm8, r_sym_ble_RV610iFt1NkeRlVmzMkQ, r_sym_ble_eq7bn6H1xP3Hf5SqkVxP, r_sym_ble_kiTzyuhqnTx7vwHCv16z, r_sym_ble_uhDTeBlUtjrD8IesgO3k and r_sym_ble_y9OEiJA3s0FmWDEDCd24. Six complete writes to 0x20101874 publish a dynamic low-twenty-bit image and zero in bits 20..31. No read is observed, and the software source context does not establish pointer, index, queue or event semantics."

[[sources]]
id = "BLOB_LIBBLE_SYNC_PUBLICATION"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; ble_lll_sync.c member 68.o symbol r_sym_ble_dl9vMD1HWWBGsoxcgw12 writes one runtime-derived complete image to 0x20101878 and one runtime-derived low-24-bit image with a zero high byte to 0x2010187c. The source identity records sync-path ownership only; the hardware-field meanings remain unknown."

[[sources]]
id = "BLOB_LIBBLE_SCAN_CONTROL"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; ble_lll_scan.c member 65.o symbol r_sym_ble_znMr0TnKK4lkFEsrathq writes complete images 0x00000100 and 0x00000001 to 0x20101970 and complete image 1 to 0x20101974 and 0x20101978 in two observed paths. The source identity establishes scan-path ownership without assigning undocumented hardware actions to the positional words."

[[sources]]
id = "BLOB_LIBBLE_MMGMT_HW_LISTS"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete ble_phy.c member 72.o selectors r_sym_ble_LboRu27EaU8MV8Q7UUfZ and r_sym_ble_ZzrExMrn8EDiTFI7PENK plus their complete ble_lll_mmgmt.c member 61.o users. Selector values 1, 2 and 3 choose three register pairs at 0x20101280..0x20101294. Each selector first freshly reads the selected word and writes that image with bits 0..19 cleared, then freshly reads it again and writes the complete second image OR the SRAM pointer shifted right by two. Allocator/free paths read each value twice until stable, reconstruct the pointer with 0x2f000000 | (value[19:0] << 2), and independently consume or clear bit 20. Complete reset callers establish the first word as current and the second as next for selectors 1 and 2, while selector 3 is not published after reset. Complete memory-manager callers route scanner kind 2 to selector 1 and admitted non-scanner kinds to selector 2. DTM kind 5 enables the precheck bypass and instead copies its private TX head and RX tail into link-state words reached from the scheduler item; selector 3 purpose and hardware current/next rotation remain unknown."

[[sources]]
id = "BLOB_LIBBLE_ISO_COEX_REGISTERS"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete ble_lll_iso_coex.c member 58.o initialization and deinitialization symbols r_sym_ble_KufRRLcH0grts5OsqfbT and r_sym_ble_DeW6gnXXMwIjWEmDQH8m. Their finite operations and pinned diagnostic strings prove the ISO coexistence ownership of the recorded enable, timing and control registers. Unknown individual interrupt-source and timing semantics retain positional names."

[[sources]]
id = "BLOB_LIBBLE_SCAN_HW_SNAPSHOT"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete ble_lll_scan.c member 65.o symbol r_sym_ble_dVzA86K657ki9LwtVCkc. It reads 0x201012a0 twice until stable, passes the stable complete image to one converter and stores the result into scan environment offset 0x70. The scan ownership and atomic-snapshot access are exact; the hardware encoding and converter semantics remain unknown."

[[sources]]
id = "BLOB_LIBBTBB_COEX_PTI_V2"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete 0x20-byte bt_bb_v2.o coex_pti_v2 body. Two fresh-read RMW operations preserve the opposite halfword while publishing the fixed low image 0x0010 and high image 0x0640 at 0x20100010. The instruction evidence does not assign individual bit semantics."

