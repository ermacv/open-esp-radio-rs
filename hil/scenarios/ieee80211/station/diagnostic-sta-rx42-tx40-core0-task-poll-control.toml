schema = 5
id = "diagnostic-sta-rx42-tx40-core0-task-poll-control"
description = "Same diagnostic ELF station control for AP 42/40 Core0 task-poll localization"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "station", "udp", "bidirectional", "ht40", "task-poll", "ap-control", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-core0-rx-cycles"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 42000000, tx_bps = 40000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 1000000
minimum_tx_bps = 1000000
