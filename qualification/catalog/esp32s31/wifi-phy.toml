[source-facts.source-contract]
id = "bluetooth-periodic-phy-maintenance"
composition = "production"
scope = "Periodic shared-PHY tracking throughout the Bluetooth Controller lifetime as ESP-IDF's phy_track_pll timer does, without pausing advertising, scanning, connection or Direct Test Mode events"
limits = "The tracking transaction remains; the radio system whose timer ran it went in #770 (tag `legacy-radio-2026-10-16`), and #771 brings a composer back. Tracking does not wait for a gap between Bluetooth events; the vendor admission relies on the PHY lock and grant protection. Qualified worst-case execution, thermal and RF bounds remain separate"
source-paths = [
  "crates/hardware/esp32s31/phy/src/concurrent.rs",
]

