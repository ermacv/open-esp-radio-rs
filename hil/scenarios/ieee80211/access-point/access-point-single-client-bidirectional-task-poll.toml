schema = 5
id = "access-point-single-client-bidirectional-task-poll"
description = "Single-client AP full-duplex executor-residence diagnostic"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "load", "bidirectional", "task-poll"]

[wifi]
image = "diagnostic-task-poll"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 120

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1400
offer = { rx_bps = 8000000, tx_bps = 8000000 }
