[workspace]
resolver = "3"
members = [
    "board",
    "bootstrap",
    "runtime",
    "runtime-support",
    "telemetry",
    "trace-probes",
    "trace-probes-elf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.0", features = ["auto-icmp-echo-reply", "dhcpv4", "dns", "icmp", "medium-ethernet", "slaac", "tcp", "udp"] }
embassy-net-driver = "0.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "0.3"
embedded-io-async = "0.7.0"
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform", default-features = false }
esp-hal = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform", default-features = false }
esp-sync = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform" }
log = { version = "0.4.27", features = ["max_level_trace", "release_max_level_info"] }
open-esp-radio = { path = "../../driver/radio", default-features = false, features = ["esp32s31-wifi-embassy"] }
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../driver/integration/esp32s31/wifi-esp-hal" }
open-esp-radio-esp32s31-hal = { path = "../../driver/esp32s31/hal" }
open-esp-radio-esp32s31-embassy-runtime = { path = "../../driver/integration/esp32s31/embassy-runtime", features = ["esp32s31"] }
open-esp-radio-esp32s31-registers = { path = "../../driver/esp32s31/registers", features = ["validation-probes"] }
open-esp-radio-esp32s31-phy = { path = "../../driver/esp32s31/phy" }
open-esp-radio-esp32s31-wifi-lmac = { path = "../../driver/esp32s31/wifi/lmac" }
open-esp-radio-esp32s31-wifi-embassy = { path = "../../driver/integration/esp32s31/wifi-embassy" }
open-esp-radio-ieee80211 = { path = "../../driver/wifi/ieee80211" }
open-esp-radio-wifi-sta = { path = "../../driver/wifi/sta" }
open-esp-radio-hil-protocol = { path = "../../hil/protocol" }
open-esp-radio-hil-esp32s31-telemetry = { path = "telemetry" }
portable-atomic = { version = "1.11", default-features = false }
static_cell = "2.1.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = true
panic = "abort"
strip = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "3df8dc705" }
