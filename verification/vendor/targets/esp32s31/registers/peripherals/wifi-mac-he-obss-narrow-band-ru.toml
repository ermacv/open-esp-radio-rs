[[peripherals]]
name = "WIFI_MAC_HE_OBSS_NARROW_BAND_RU"
description = "Complete hal_he_disable_obss_narrow_bw_ru writes either all ones or zero into the twenty-bit bitmap and independently sets or clears a five-bit class group and the global disable bit. The leaf name proves the aggregate disable function; individual bitmap/class identities remain approximate."
baseAddress = 0x20104E9C

[[peripherals.registers]]

[peripherals.registers.register]
name = "DISABLE_BITMAP"
description = "Twenty-bit OBSS narrow-band RU disable bitmap written as 0xfffff when disabled and zero when enabled."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 20

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "CONTROL"
description = "The complete leaf updates CLASS_DISABLE bits first and GLOBAL_DISABLE second through independent fresh-read RMWs."
addressOffset = 0x4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "GLOBAL_DISABLE"
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CLASS_DISABLE"
description = "Approximate functional name for the five bits toggled together by hal_he_disable_obss_narrow_bw_ru."
bitOffset = 4
bitWidth = 5

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x1F

