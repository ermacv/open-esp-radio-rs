scope-and-limitations = "[Measured correction](src/tracking/rfpll/README.md) owns the thermal gate, bounded search, signed frequency-memory update and typed frequency-control restoration. The outer RFPLL action and read-only inspection use this child; the connected service selects it ahead of other due work and rechecks sample freshness after admission. Compiled comparisons cover child effects and the RFPLL-enabled parent. A bounded HIL scenario covers the first nonzero heating correction and same-epoch traffic restoration; the opposite thermal direction, repeated cycles and radiated RF quality remain unqualified. Exclusive caller admission does not qualify joint coexistence grants."
