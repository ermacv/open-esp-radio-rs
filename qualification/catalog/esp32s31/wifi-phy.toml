[[items]]
id = "wifi-frequency-tx-power-antenna-ftm-and-esp-now-adjustable-tx-power-ceiling"
section = "wifi-frequency-tx-power-antenna-ftm-and-esp-now"
title = "Adjustable TX power ceiling"
status = "implemented"
level = "composed-product"
scope-and-limitations = "[Cold-start configuration](src/cold_start.rs) carries a quarter-dBm ceiling into the [PHY per-rate power profile](../../phy/src/tx/power.rs), bounded by the init-data maximum before MAC power-code publication. This is a configured ceiling, not a live power-control API or proof of absolute radiated power/vendor gain-table equivalence."
source-paths = ["crates/hardware/esp32s31/driver/ieee80211/src/cold_start.rs","crates/hardware/esp32s31/phy/src/tx/power.rs"]

[[items]]
id = "wifi-frequency-tx-power-antenna-ftm-and-esp-now-antenna-diversity"
section = "wifi-frequency-tx-power-antenna-ftm-and-esp-now"
title = "Antenna diversity"
status = "partial"
level = "composed-product"
scope-and-limitations = "[PAC/HAL](../../hal/src/phy/agc.rs) expose a reviewed enable setter and cold antenna initialization. No public RF/GPIO antenna-selection owner, runtime policy or board contract composes them; the setter itself does not reject activation, so this is not a typed fail-closed mode. No HIL claim is made."
source-paths = ["crates/hardware/esp32s31/hal/src/phy/agc.rs"]

[[items]]
id = "wifi-frequency-tx-power-antenna-ftm-and-esp-now-802-11mc-ftm"
section = "wifi-frequency-tx-power-antenna-ftm-and-esp-now"
title = "802.11mc FTM"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "Allocation-free Public Action codecs and a bounded single-burst ASAP requester own peer/token identity, retries, deadlines and raw four-timestamp exchanges. The S31 frontier validates a prepared request and can reversibly probe the recovered PHY-enable leaf, then rejects before connected Action publication. RX/TX antenna-point timestamps, clock and calibration contracts, capability advertisement, distance results and on-air operation remain unclaimed."
source-paths = []

[[items]]
id = "wifi-frequency-tx-power-antenna-ftm-and-esp-now-esp-now-v1-v2-plaintext"
section = "wifi-frequency-tx-power-antenna-ftm-and-esp-now"
title = "ESP-NOW v1/v2 plaintext"
status = "implemented"
level = "composed-product"
scope-and-limitations = "Bounded peer/channel ownership, v1/v2 encode/decode, standard DSSS1M, OFDM and HT20 MCS0-MCS7 LGI/SGI TX/RX paths and retry publication are present on the STA VIF. Standalone RX is always awake; connected passive RX is admitted only when legacy station power save is disabled because it has no independent wake owner."
source-paths = []

[[items]]
id = "wifi-frequency-tx-power-antenna-ftm-and-esp-now-esp-now-encrypted-peers"
section = "wifi-frequency-tx-power-antenna-ftm-and-esp-now"
title = "ESP-NOW encrypted peers"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "Portable LMK/peer ownership exists, but S31 key-selector and Action-frame AAD/CCMP contract are unproven, so encrypted publication is rejected."
source-paths = []

[[items]]
id = "wifi-frequency-tx-power-antenna-ftm-and-esp-now-espressif-long-range-wi-fi-phy"
section = "wifi-frequency-tx-power-antenna-ftm-and-esp-now"
title = "Espressif Long Range Wi-Fi PHY"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "Exact low-rate identities, retry records and a reversible low-rate-gate probe are retained. Physical TX requires an affine gate epoch spanning enable, doorbell, completion/retries and exact restore; RX needs matching gate ownership and descriptor-rate normalization. Those contracts plus the LR PLCP/queue vector are missing, so LR never publishes or masquerades as a standard observed PHY. The recovered frontier is exercised through ESP-NOW; STA/AP have no LR association/service integration. LR is a separate proprietary PHY, not an ESP-NOW-only feature."
source-paths = []

