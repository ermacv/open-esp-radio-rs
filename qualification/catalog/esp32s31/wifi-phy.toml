level = "lower-primitive"
scope-and-limitations = "[Calibration tracking](src/tracking/calibration.rs) evaluates RX and shared TX temperature references; Wi-Fi then BT/154 run inside one TX envelope. The parent calls it once after both power branches. Compiled combined-parent comparison covers ordered child effects, thermal decisions and semantic RX/TX publication on channel 13/HT40 with synthetic measurements. The full outer comparison additionally covers power/I2C state and final temperature, including a validation-only RFPLL-enabled profile with signed capacitor corrections. Joint grants, physical RFPLL behavior and elapsed timing remain unqualified. This is not cold-cache replay."
source-paths = ["crates/hardware/esp32s31/phy/src/tracking/calibration.rs"]

