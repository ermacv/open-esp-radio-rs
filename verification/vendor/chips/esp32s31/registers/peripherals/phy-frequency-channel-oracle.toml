[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3F

[[peripherals.registers.register.fields]]
name = "FREQUENCY_READY"
description = "The complete channel parent samples bit 8 after the frequency-switch delay and branches on its asserted edge."
bitOffset = 8
