schema = 2
default-disposition = "not-yet-ported"
default-protocol = "bluetooth"

[[functions]]
source = "btbb"
symbol = "coex_pti_v2"
disposition = "direct"
protocol = "bluetooth"
rust-component = "open_esp_radio_esp32s31_hal::coex::configure_bluetooth_pti"
binding = "v1"
rust-binding = "exact-production-entry"
rust-probe = "open_btbb_coex_trace_coex_pti_v2"
effect-contract = "exact-effects-v1"

[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x20100010 }
disposition = { kind = "required" }

[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x20100010 }
disposition = { kind = "required" }
