[package]
name = "oer-hil-runner-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared HIL runner core: scenarios, laboratory, session, context, images and run evidence"

[features]
# Test helpers for the runner's cross-package end-to-end tests.
test-support = ["oer-hil-scenario/test-support"]

[dependencies]
oer-hil-evidence = { path = "../evidence" }
oer-hil-scenario = { path = "../scenario" }
oer-hil-source-snapshot = { path = "../source-snapshot" }
oer-hil-durable = { path = "../durable" }
oer-hil-image-class = { path = "../image-class" }
oer-hil-board = { path = "../board" }
postcard = { version = "1.1.3", default-features = false }
oer-hil-image-keys = { path = "../../image-keys" }
oer-hil-trace = { path = "../../trace", features = ["describe"] }
oer-trace = { path = "../../../crates/trace" }
oer-hil-arbiter = { path = "../arbiter" }
oer-hil-schema = { path = "../../schema" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
mio = { version = "=1.2.2", features = ["os-poll", "os-ext"] }
oer-process = { path = "../../../tools/process" }
oer-hil-fixture = { path = "../fixture" }
oer-hil-fixture-install = { path = "../fixture-install" }
addr2line = { version = "=0.27.1", default-features = false, features = ["loader", "rustc-demangle"] }
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std"] }
oer-esp32s31-firmware = { path = "../../../tools/firmware" }
# The layout seed a runtime image build is linked with.
oer-esp32s31-platform-layout = { path = "../../../platform/esp32s31/layout", features = ["build"] }
oer-chip-profile = { path = "../../../tools/chip-profile" }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
tar = { version = "0.4", default-features = false }
tempfile = "3"
libc = "0.2"
oer-hil-protocol = { path = "../../protocol", features = ["registry"] }
oer-memory-report = { path = "../../../tools/memory-report" }
serialport = { version = "4.8.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"
zeroize = "1.8.1"

[dev-dependencies]
oer-hil-evidence = { path = "../evidence", features = ["test-support"] }
oer-hil-scenario = { path = "../scenario", features = ["test-support"] }
oer-hil-source-snapshot = { path = "../source-snapshot", features = ["test-support"] }
oer-ieee80211-trace = { path = "../../../crates/protocols/ieee80211/trace" }
oer-phy-trace = { path = "../../../crates/hardware/radio/trace" }
oer-ieee802154-trace = { path = "../../../crates/hardware/ieee802154/trace" }
postcard-schema = { version = "0.2.5", features = ["derive"] }
oer-hil-schema = { path = "../../schema", features = ["producer"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "host"
