name: "Research"
description: "Answer a scoped hardware, vendor or software question."
labels: ["triage:incomplete","kind:research"]
body:
  - type: markdown
    attributes:
      value: "Name one accepted result. Follow [issue management](https://github.com/ermacv/open-esp-radio-rs/blob/main/docs/issues.md). Choose classification before submitting. The issue-label guard applies your explicit selections; triage reviews them. Research and implementation do not establish hardware readiness."
  - type: textarea
    id: question
    attributes:
      label: "Question and consumer"
      description: "One unknown and which concrete decision or implementation needs the answer."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Primary area"
      description: "The owner of the result; the guard applies this explicit area selection."
      options: ["area:wifi","area:bluetooth","area:ieee802154","area:radio","area:registers","area:platform","area:tooling","area:hil","area:qualification"]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "Choose explicitly: P0 interrupts, P1 blocks the selected result, P2 is useful backlog, P3 needs an activation trigger."
      options: ["priority:P0","priority:P1","priority:P2","priority:P3"]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Owner and scope"
      description: "Name defining paths, canonical package.metadata.open-radio.layer, target/revision/profile and exclusions."
      placeholder: "Owner paths:\nLayer (package.metadata.open-radio.layer):\nTarget / revision / profile:\nOut of scope:"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Known evidence and uncertainty"
      description: "Reviewed sources/pins, observed behavior and unresolved semantics; label inferences."
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: "Method and accepted output"
      description: "Bound the investigation; name evidence and applicability. Negative, partial or inconclusive outcomes are valid if limits and the consumer's next decision are explicit."
    validations:
      required: true
  - type: textarea
    id: relations
    attributes:
      label: "Relations and activation"
      description: "Parent, blockers with the exact required artifact, related work, and any future activation trigger."
      placeholder: "Part of:\nBlocked by (artifact and consuming step):\nRelated:\nActivation trigger:"
    validations:
      required: false
