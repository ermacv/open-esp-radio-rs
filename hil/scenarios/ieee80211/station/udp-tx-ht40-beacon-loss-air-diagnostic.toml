schema = 5
id = "udp-tx-ht40-beacon-loss-air-diagnostic"
description = "HT40 UDP station-to-host saturation at 130 Mbit/s with a 1 Mbit/s reverse flow that admits the access point's own TX monitor and an independent air monitor, to show whether the access point still transmits beacons and probe responses while the station saturates the air"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "udp", "station", "tx", "ht40", "split-core", "beacon-loss", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 130000000, rx_bps = 1000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true
