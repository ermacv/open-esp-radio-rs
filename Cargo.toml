# Independent verification and firmware workspaces own their subtrees.
exclude = ["examples", "platform", "hil/targets", "verification", "tools/tidy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
# Driver protocol state must advance identically in debug and release builds.
debug_assert_with_mut_call = "deny"
# `clippy.toml` lists methods radio code must not call, such as busy waiting
# instead of yielding; an intentional use carries a local `allow` with a reason.
disallowed_methods = "deny"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# Full debug info was most of each checkout's target/debug, tens of GB in
# millions of files, and a large share of host link time. Line tables keep
# panics and backtraces readable.
[profile.dev]
debug = "line-tables-only"

# Host-side binary analysis is prohibitively slow at dev opt-level 0. Keep a
# separate incremental profile for the normal blobray aliases so firmware
# development and unit tests retain their ordinary dev/release behavior.
# HIL source snapshots hash every input file several times per build; an
# unoptimized SHA-256 dominates a current-source run.
[profile.dev.package.sha2]
opt-level = 3

[profile.blobray]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

# Qualification authenticates complete HIL bundles, which can include large
# packet captures. Keep its SHA-256 and JSON traversal optimized without
# changing firmware build profiles.
[profile.qualification]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

# The async-platform branch uses register accessor fixes that are
# still carried by the matching PAC fork.
[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
