[[peripherals]]
name = "WIFI_MAC_TX_QUEUE_CONTROL"
description = "Four ascending physical banks represent logical EDCA queues 3,2,1,0."
baseAddress = 0x20104D34

[[peripherals.registers]]

[peripherals.registers.register]
dim = 4
dimIncrement = 0x10
dimIndex = "0,1,2,3"
name = "PROTECTION%s"
description = "Canonical WDEVTXQ_CONF2. Complete dbg_read_txq_conf2 names the three ten-bit lanes TXQ_MIN_MPDU_LEN for CBW20, CBW40 and CBW80, followed by SW_RTS and SW_CTS. For HT, complete mac_tx_set_htsig copies peer state offset 0x82 into all three lanes; complete rcUpdateAMPDUParam derives that value from the HT A-MPDU minimum MPDU start-spacing code. For HE, complete ppCalDeliNum stores the rate/GI/DCM/density-specific minimum subframe byte count at descriptor offset 0x28 and complete mac_tx_set_hesig copies that halfword into all three lanes. The HE init suffix clears the same SW_RTS/SW_CTS pair, not an independent register. A coherent hardware-owned vendor HT queue contained 0x0280a028, exactly three copies of negotiated value 40. Open HE20 MCS9 HIL with 16-us density proved value 230: fixed snapshot 0x31 lost all 32 MPDUs, while three copies of 230 received a full first-attempt BlockAck with 43 empty delimiters per non-final subframe. The descriptor-count RMWs target the separate queue-vector word at 0x20105504-q*0x7c."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "MINIMUM_MPDU_LENGTH_CBW20"
description = "First copy of the HT peer-derived or HE rate/density-derived minimum MPDU/subframe value."
bitOffset = 0
bitWidth = 10

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3FF

[[peripherals.registers.register.fields]]
name = "MINIMUM_MPDU_LENGTH_CBW40"
description = "Second copy of the HT peer-derived or HE rate/density-derived minimum MPDU/subframe value."
bitOffset = 10
bitWidth = 10

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3FF

[[peripherals.registers.register.fields]]
name = "MINIMUM_MPDU_LENGTH_CBW80"
description = "Third copy of the HT peer-derived or HE rate/density-derived minimum MPDU/subframe value."
bitOffset = 20
bitWidth = 10

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3FF

[[peripherals.registers.register.fields]]
name = "SOFTWARE_RTS"
description = "Complete dbg_read_txq_conf2 names bit 30 SW_RTS."
bitOffset = 30
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SOFTWARE_CTS"
description = "Complete dbg_read_txq_conf2 names bit 31 SW_CTS."
bitOffset = 31
bitWidth = 1

