# Wi-Fi MAC register layouts shared by chips that place them at their own
# base addresses. Chips review each layout in their own review files.
schema = 1
name = "ieee80211"
crate-name = "oer_ieee80211_pac_raw"
fragments = [
    "peripherals/wifi-mac-interface-address.toml",
]

[device]
name = "IEEE80211_MAC_LAYOUTS"
version = "0.1"
description = "Wi-Fi MAC register layouts shared between chips, without placement."
vendor = "Espressif"
vendor-id = "ESP"
license-text = "MIT OR Apache-2.0"
address-unit-bits = 8
width = 32
svd-schema = "1.3"
svd-schema-location = "CMSIS-SVD.xsd"
