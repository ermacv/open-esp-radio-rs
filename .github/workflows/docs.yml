name: Documentation

# The guides and API documentation checks. CI calls them for every push, so
# the required `ci-ok` covers them; Pages calls them with `publish` to build
# the site it deploys.
on:
  workflow_call:
    inputs:
      publish:
        description: Assemble and package the site for GitHub Pages.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  # A fresh runner has no Cargo cache; the repository configuration keeps
  # Cargo offline for local builds.
  CARGO_NET_OFFLINE: 'false'
  MDBOOK_VERSION: 0.5.4
  MDBOOK_MERMAID_VERSION: 0.17.1
  MDBOOK_PERMALINKS_VERSION: 3.0.2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require main for publication
        if: inputs.publish
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Cache Cargo downloads and mdBook tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
            ~/.cargo/bin/mdbook-permalinks
          key: docs-${{ runner.os }}-${{ env.MDBOOK_VERSION }}-${{ env.MDBOOK_MERMAID_VERSION }}-${{ env.MDBOOK_PERMALINKS_VERSION }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: docs-${{ runner.os }}-${{ env.MDBOOK_VERSION }}-${{ env.MDBOOK_MERMAID_VERSION }}-${{ env.MDBOOK_PERMALINKS_VERSION }}-
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
      # API documentation and doctests, Markdown links and documented
      # commands, qualification catalogs and capability anchors: the
      # registry's `docs` job.
      - run: cargo xtask --verbose check tier full --job docs
      - name: Install mdBook
        run: |
          mdbook --version | grep -q "v$MDBOOK_VERSION" || cargo install --locked mdbook --version "$MDBOOK_VERSION"
          mdbook-mermaid --version | grep -q "$MDBOOK_MERMAID_VERSION" || cargo install --locked mdbook-mermaid --version "$MDBOOK_MERMAID_VERSION"
          # mdbook-permalinks has no --version; the cache key carries its version.
          command -v mdbook-permalinks >/dev/null || cargo install --locked mdbook-permalinks --version "$MDBOOK_PERMALINKS_VERSION"
      - name: Guides
        run: |
          mdbook-mermaid install docs
          mdbook build docs
          mdbook test docs
      - name: Assemble site
        if: inputs.publish
        run: |
          site=target/pages
          rm -rf "$site"
          cp -r target/book "$site"
          mkdir -p "$site/api"
          cp -r target/doc "$site/api/host"
          cp -r target/riscv32imafc-unknown-none-elf/doc "$site/api/esp32s31"
      - name: Package site
        if: inputs.publish
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/pages
