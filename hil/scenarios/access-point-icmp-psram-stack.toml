schema = 3
id = "access-point-icmp-psram-stack"
description = "Experimental AP HT40 MCS7 latency run with 100 ICMP requests and CPU task stacks in PSRAM"
repetitions = 3
image = "diagnostic-psram-stack"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "split-core", "icmp", "psram-stack"]

[link]
phy = "ht40"

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 90
client = "open-wrt"

[workload.traffic]
kind = "icmp"
count = 100
interval_ms = 20
timeout_ms = 1000
payload_bytes = 56

[criteria]
maximum_lost = 0
maximum_p95_ms = 20
require_no_beacon_loss = true
minimum_concurrent_ap_clients = 1
