schema = 5
id = "access-point-single-client-ceiling-tx-core0-coarse"
description = "Single-client AP HT40 saturated UDP transmit with coarse Core0 phase accounting"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "split-core", "tx", "core0", "coarse-cycles", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 130000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
