schema = 2

[[peripherals]]
name = "WIFI_MAC_CONTROL"
description = "Shared MAC run/stop control. The cold open-RX frontier publishes zero; the complete vendor channel-switch chain requests quiescence here and later restarts the no-power-save profile."
baseAddress = 0x20104CAC

[[peripherals.registers]]

[peripherals.registers.register]
name = "CONTROL"
description = "Cold promiscuous initialization writes zero. hal_mac_deinit records bits 13 and 14 as TX/RX activity and sets bit 12 plus bits 23:16; hal_mac_init with WIFI_PS_NONE clears that same stop-request mask."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "LOW_CONTROL_OPAQUE"
bitOffset = 0
bitWidth = 12

[[peripherals.registers.register.fields]]
name = "NO_RETENTION_STOP_REQUEST"
description = "Included in the MAC stop request and cleared by hal_mac_init for the WIFI_PS_NONE all-ones retention mask."
bitOffset = 12
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "ACTIVE_STATE"
description = "Three-bit activity state polled until zero before PHY retuning. hal_mac_deinit independently records bit 13 as TX active and bit 14 as RX active; bit 15 remains unnamed."
bitOffset = 13
bitWidth = 3
access = "read-only"

[[peripherals.registers.register.fields]]
name = "TX_BLOCK_STOP_REQUEST_LOW"
description = "Bit 16 of the eight stop-request bits hal_mac_deinit sets and hal_mac_init clears with the WIFI_PS_NONE retention mask."
bitOffset = 16
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "POWER_SAVE_TX_BLOCK"
description = "Bits 19:17 of the stop-request bits. The vendor power manager sets all three to block the TX queues when its coexistence slice ends and clears them to unblock; its retention mask keeps them out of the MAC deinit and init requests while an associated station runs power management."
bitOffset = 17
bitWidth = 3

[peripherals.registers.register.fields.writeConstraint]
useEnumeratedValues = true

[[peripherals.registers.register.fields.enumeratedValues]]
name = "PowerSaveTxBlock"
usage = "read-write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "RUN"
description = "The TX queues run."
value = 0

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "BLOCKED"
description = "The TX queues are blocked."
value = 7

[[peripherals.registers.register.fields]]
name = "TX_BLOCK_STOP_REQUEST_HIGH"
description = "Bits 23:20 of the eight stop-request bits hal_mac_deinit sets and hal_mac_init clears with the WIFI_PS_NONE retention mask."
bitOffset = 20
bitWidth = 4

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xF

[[peripherals.registers.register.fields]]
name = "HIGH_CONTROL_OPAQUE"
bitOffset = 24
bitWidth = 8

