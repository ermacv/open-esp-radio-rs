# Shareable project entry point. Local artifact paths belong in an untracked
# run spec passed with --run-spec, or in a private copy referenced here.
schema = 4
id = "esp32s31-radio-rev0"
target-spec = "target.toml"
ecosystem-packs = ["../../knowledge/espressif/radio.toml"]
chip-pack = "../../chips/esp32s31/chip.toml"
# The project provider explicitly extends the rev0 chip provider selected by
# chip.toml. Exact ABI contracts and body/address-guarded summaries remain in
# this investigation overlay; generic C/ESP-IDF and reusable chip behavior are
# composed by the compiled descriptor, never by manifest precedence.
analysis-provider = "esp32s31-radio-knowledge-v1"
verification-addon = "verification-addon.toml"

[applicability]
artifact-lineages = ["esp32s31-radio"]

[reviewed-knowledge]
packs = ["reviewed/project-facts.toml"]
default-pack = "reviewed/project-facts.toml"

[analysis.symbols]
output = "generated/findings/symbols.json"

[analysis.navigation]
output = "generated/findings/navigation.json"

[code]
pack = "code/boundaries.toml"

[code.review]
output = "generated/reports/code-boundaries.md"

[[analysis.ir]]
id = "rom-all"
sources = ["rom"]
roots = "all"
include-reachable = true
entry-contract = "esp32s31-phy-registered"
output = "generated/findings/rom-all.ir"

[[analysis.ir]]
id = "archive-all"
sources = ["archive"]
roots = "all"
include-reachable = true
entry-contract = "esp32s31-phy-registered"
output = "generated/findings/archive-all.ir"

[[analysis.ir]]
id = "libpp-all"
sources = ["libpp"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/libpp-all.ir"

[[analysis.ir]]
id = "libnet80211-all"
sources = ["libnet80211"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/libnet80211-all.ir"

# Canonical cross-library image for the AP data path.  The separate libpp and
# libnet80211 images remain useful for archive-local provenance, but cannot
# resolve calls that cross their link boundary.  This existing combined image
# contains both sides and therefore owns call-order analysis for AP RX/TX.
[[analysis.ir]]
id = "wifi-ap-data-path"
sources = ["wifi-sta-ap-receive"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/wifi-ap-data-path.ir"

[[analysis.ir]]
id = "wifi-sta-lifecycle"
