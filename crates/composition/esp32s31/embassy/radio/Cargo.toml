[package]
name = "oer-esp32s31-radio-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Product-level ESP32-S31 shared radio: the arbiter, the shared PHY domain and its periodic tracking for Embassy"

[dependencies]
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../../hardware/esp32s31/phy" }
oer-esp32s31-phy-runtime = { path = "../../../../runtime/esp32s31/phy" }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "composition"
platform = "chip"
chip = "esp32s31"
