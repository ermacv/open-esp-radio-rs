[package]
name = "oer-esp32s31-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ownership and async HAL boundaries for the ESP32-S31 radio"

[features]
validation-probes = ["oer-esp32s31-pac/validation-probes"]
# A register model of the LL backend for host tests of the engine's users.
ll-model = []

[dependencies]
oer-memory = { path = "../../../memory" }
oer-esp32s31-pac = { path = "../pac" }
oer-ieee802154 = { path = "../../../protocols/ieee802154" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
oer-esp32s31-pac = { path = "../pac", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "chip"
chip = "esp32s31"
