schema = 2

[[peripherals]]
name = "BLUETOOTH_SCHEDULER_INTERRUPT_RUNTIME"
description = """
Two scheduler words transferred with BLUETOOTH_INTERRUPT_BANK to the primary
hard handler. The complete source-124 suffix can read SCHEDULER_STATE at two
distinct temporal points and can write a complete zero image to
SCHEDULER_REFERENCE. Keeping this sparse physical view outside the task-side
controller partition prevents either owner from manufacturing an MMIO alias.
"""
baseAddress = 0x20101000

[[peripherals.registers]]
[peripherals.registers.register]
name = "SCHEDULER_REFERENCE"
description = "The source-124 handler can publish the complete zero image when bank-one source 3 observes an idle scheduler. Other scheduler users compare bits 0..19 or publish complete images; upper encoding remains unknown."
addressOffset = 0x78
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "VALUE_LOW_20"
bitOffset = 0
bitWidth = 20
[[peripherals.registers.register.fields]]
name = "OPAQUE_HIGH_12"
bitOffset = 20
bitWidth = 12

[[peripherals.registers]]
[peripherals.registers.register]
name = "SCHEDULER_STATE"
description = "The source-124 handler reads this shared scheduler state at a bank-one reference gate and again before publishing deferred work. Its deferred-work predicate requires both REFERENCE_PATH_STATE and BUSY. The complete current-link-index leaf returns bits 23:20. Command transactions also wait while BUSY is set; other complete users consume or publish the low 20 and low 30 bits."
addressOffset = 0x7C
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "VALUE_LOW_20"
bitOffset = 0
bitWidth = 20
[[peripherals.registers.register.fields]]
name = "CURRENT_LINK_INDEX"
description = "Zero-based current scheduler hardware-list index returned by the complete current-link-index leaf."
bitOffset = 20
bitWidth = 4
[[peripherals.registers.register.fields]]
name = "OPAQUE_STATE_24_28"
bitOffset = 24
bitWidth = 5
[[peripherals.registers.register.fields]]
name = "REFERENCE_PATH_STATE"
description = "State sampled together with BUSY by the complete source-124 deferred-work predicate. The underlying scheduler-state meaning remains unqualified."
bitOffset = 29
bitWidth = 1
[[peripherals.registers.register.fields]]
name = "OPAQUE_STATE_30"
bitOffset = 30
bitWidth = 1
[[peripherals.registers.register.fields]]
name = "BUSY"
bitOffset = 31
bitWidth = 1

