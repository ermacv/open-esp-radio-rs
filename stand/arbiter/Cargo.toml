[package]
name = "oer-stand-arbiter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The stand arbiter: the queue and its job tickets, balances, preemption, maintenance and the device locks of every leased board"

[dependencies]
oer-device-discovery = { path = "../../tools/device/discovery" }
oer-device-lock = { path = "../../tools/device/lock" }
oer-device-reset = { path = "../../tools/device/reset" }
oer-durable = { path = "../../tools/durable" }
oer-process = { path = "../../tools/process" }
oer-stand-claims = { path = "../claims" }
oer-stand-file = { path = "../file" }
oer-stand-journal = { path = "../journal" }
oer-stand-owners = { path = "../owners" }
oer-stand-power = { path = "../power" }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "stand"
hil = "orchestration"
