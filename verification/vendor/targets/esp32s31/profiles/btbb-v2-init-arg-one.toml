# This profile owns only the exact finite MMIO trace taken by
# bt_bb_v2_init_cmplx(1). The vendor diagnostic call is not hardware state,
# and return/software behavior is deliberately outside the claim. Two
# complementary complete MMIO images exercise every preserved bit as both
# zero and one without pretending that their Cartesian product was tested.
[[profiles]]
name = "btbb-v2-init-arg-one-ordered-mmio"
claim = "reviewed-domain-equivalence"
precondition = "arg-one-two-complementary-reviewed-mmio-images-and-linked-gain-byte-domain"
vendor-source = "btbb"
vendor-symbol = "bt_bb_v2_init_cmplx"
rust-symbol = "open_btbb_v2_init_trace_r_sym_bt_bb_v2_init_cmplx_x1"
compare-return = false

mmio-image-cases = [
    "complement-a-gain-zero",
    "complement-b-gain-max",
]

