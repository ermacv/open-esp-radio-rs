[package]
name = "oer-esp32s31-probe-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Retained ESP32-S31 Rust entry points for compiled vendor verification"

[dependencies]
oer-probe-macros = { path = "../../../../../harness/macros" }
embassy-futures.workspace = true
embassy-sync.workspace = true
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["esp32s31", "unstable"] }
oer-esp32s31-coex.workspace = true
oer-memory.workspace = true
oer-esp32s31-hal.workspace = true
oer-esp32s31-pac.workspace = true
oer-esp32s31-phy = { workspace = true, features = ["validation-probes"] }
oer-esp32s31-ieee80211-mac.workspace = true
oer-esp32s31-ieee80211.workspace = true
oer-esp32s31-ieee80211-dma.workspace = true
oer-esp32s31-ieee80211-runtime.workspace = true
oer-ieee80211-softmac.workspace = true
oer-esp32s31-ieee80211-esp-hal = { path = "../../../../../../../crates/adapters/esp-hal/esp32s31/ieee80211", features = ["esp32s31"] }

[lib]
crate-type = ["rlib", "staticlib"]

[lints.rust]
unexpected_cfgs = "allow"

[package.metadata.open-radio]
scope = "development"
layer = "verification"
platform = "chip"
chip = "esp32s31"
