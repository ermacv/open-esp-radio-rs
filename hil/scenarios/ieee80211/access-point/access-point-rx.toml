schema = 5
id = "access-point-rx"
description = "Two AP ownership epochs with exact inbound UDP delivery"
transfer = "identical-image"
tags = ["qualification", "wifi", "access-point", "network", "rx"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 90

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1200
offer = { rx_bps = 2000000 }

[wifi.workload.traffic.criteria]
exact_delivery = true
minimum_rx_bps = 1500000
