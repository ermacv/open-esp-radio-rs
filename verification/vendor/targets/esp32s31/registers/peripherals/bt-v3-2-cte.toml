schema = 2

[[peripherals]]
name = "BT_V3_2_CTE"
description = """
Bluetooth direction-finding control words recovered from complete, independently
named CTE accessors in the ESP32-S31 vendor baseband library. Only fields touched
by those accessors are described; untouched bits remain unassigned."""
baseAddress = 0x20102000

