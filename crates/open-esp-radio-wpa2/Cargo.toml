[package]
name = "open-esp-radio-wpa2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free WPA2-Personal protocol types and state machines"

[dependencies]
aes = { version = "0.8.4", default-features = false }
hmac = { version = "0.12.1", default-features = false }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
sha1 = { version = "0.10.7", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[lints]
workspace = true
