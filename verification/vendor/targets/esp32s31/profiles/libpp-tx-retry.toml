# Normal 802.11g 54M schedule only. The vendor and compiled production sides
# receive the same descriptor image and are compared through the selected-rate
# byte at offset 0x0c. Vendor replay stops at rcGetSMPDURate so this claim does
# not silently absorb PLCP construction or fixed-rate branches.
[[profiles]]
name = "libpp-ordinary-rc-get-rate"
claim = "reviewed-domain-equivalence"
precondition = "normal-dot11g-54m-schedule-before-rc-get-smpdu-rate"
vendor-source = "libpp"
vendor-symbol = "rcGetRate"
rust-symbol = "open_libpp_tx_retry_trace_rc_get_rate"
compare-return = false
