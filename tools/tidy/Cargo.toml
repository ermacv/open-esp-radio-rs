[package]
name = "oer-tidy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Fast fail-closed repository integrity checks: text policy over the repository model"

[dependencies]
oer-toolchain = { path = "../toolchain" }
oer-command-tree = { path = "../command-tree" }
oer-process = { path = "../process" }
oer-repo = { path = "../repo" }
oer-markers = { path = "../markers" }
serde_json = "=1.0.151"
toml = "=1.1.4"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
host-layer = "entry"
host-app = "gate"
host-boundary = "application"

# The fetch command must start offline even after a firmware Git pin changes.
# Only registry dependencies and host foundations enter this workspace.
[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
# Driver protocol state must advance identically in debug and release builds.
debug_assert_with_mut_call = "deny"
# `clippy.toml` lists methods radio code must not call, such as busy waiting
# instead of yielding; an intentional use carries a local `allow` with a reason.
disallowed_methods = "deny"

[profile.dev]
debug = "line-tables-only"

# The integrity tier lexes every Rust file of the tree.
[profile.dev.package.oer-tidy]
opt-level = 3
