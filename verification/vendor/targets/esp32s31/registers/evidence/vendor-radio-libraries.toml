[[sources]]
id = "BLOB_LIBBTBB_BLE_TX_CONFIG_CHECK"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o ble_tx_config_check body, size 0x1c0. Its loads, masks and pinned field-name strings prove the BLE TX timing fields, including RF_ON_BT_DELAY and PA_ON_BT_DELAY in the canonical FECTRL word at 0x20100870. The same complete body reads 0x2010201c and consumes exactly bits 31:27 as an otherwise unnamed input to its diagnostic arithmetic; no stronger hardware meaning is assigned."

[[sources]]
id = "BLOB_LIBBTBB_BBMAC_IDLE_FOR_SWRST"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o bbmac_idle_for_swrst body, size 0x3c. The leaf returns success only when 0x2010207c bits 20:23 and 15:16, 0x20101550 bits 0:3 and 0x20103088 bits 0:3 are zero and 0x20102c38 bits 0:2 equal one. These are exact read predicates; the source does not assign meanings to individual status bits."

[[sources]]
id = "BLOB_LIBBTBB_CHANNEL_POWER_CONTROL"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o bt_get_channel_pwr_set and bt_get_channel_pwr_unset bodies, sizes 0x50 and 0x1e. Their fresh-read RMW operations set or clear exactly 0x20102004 bits 8:9 while preserving all other bits. The aggregate field name records only the named function boundary; individual bit semantics remain unknown."

[[sources]]
id = "BLOB_LIBBTBB_GAUSSIAN_COEFFICIENTS"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o set_gauss_coeff_1m and set_gauss_coeff_2m bodies, sizes 0xf6 and 0x86. Their ordered fresh-read RMW operations prove the exact masks and finite field images recorded for 0x201020e0..0x201020f4. The function identities distinguish 1M and 2M coefficient sets; positional field names deliberately avoid inventing individual coefficient semantics."

[[sources]]
id = "BLOB_LIBBTBB_BT_TX_SET"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o bt_bb_v2_tx_set body, size 0x34. One fresh-read RMW replaces exactly the low byte of 0x201020f0 with 0xf5 while preserving bits 31:8. This fact shares a physical word with the independently observed 2M Gaussian-coefficient fields."

[[sources]]
id = "BLOB_LIBBTBB_BT_AGC_RESTART_SET"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o bt_agc_restart_set body, size 0x2e6. At 0x20102100 it performs separate fresh-read RMW operations that set exactly bits 6, 7, 8, 9, 10, 19, 20 and 21. Other words touched by the complete body are intentionally outside this bounded standalone-BLE slice and remain unreviewed here."

[[sources]]
id = "BLOB_LIBBTBB_BT_CTE_ACCESSORS"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_cte.o public getter/setter set. Matching independent masks provide instruction-exact CTE and shared BTAGC field geometry. ble_bb_cte_set_ant_map additionally proves an indexed 16-bit MMIO window from 0x20102130 while its input-dependent count leaves the hardware capacity open. The observations populate canonical BT_V3_2 and BTAGC physical owners; they do not create per-function singleton peripherals."

[[sources]]
id = "BLOB_LIBBTBB_BT_BB_V2_ACCESSORS"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete named bt_bb_v2.o accessors and finite configuration leaves for LE TX delay, LE correlation thresholds, RX correlator/filter/DPO, TX CCA/FIFO, baseband watchdog, diagnostics and coexistence. Their direct loads, stores and RMW masks prove the recorded BT_V3_2 and BTAGC register/field geometry. Neutral ARGUMENT_N names preserve unknown C parameter semantics instead of promoting them to hardware meaning; CONFIG_VALUE fields record exact finite constants without claiming why the hardware uses them."

[[sources]]
id = "BLOB_LIBBLE_BASE_STACK_TASK_ENABLE"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195 complete member 2.o symbol r_sym_ble_bkm3VwbpfEvzyJJP4FZS and member 94.o global_ext_bb_funcs, plus _oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df complete named bt_bb_v2.o symbol bt_bb_corr_thresh_aa_lc_en. The task-enable body first publishes its software memory-tracking state, then calls external-BB table slot +0x20 with Boolean image one, optionally enters the separately guarded BQB branch, and only afterwards calls the complete BLE PHY register initializer. The table relocation identifies slot +0x20 as bt_bb_corr_thresh_aa_lc_en. Its complete 0x16-byte body freshly reads BT_V3_2_BASEBAND.LE_CORRELATION_THRESHOLD_0 and replaces only AA_LC_ENABLE with the Boolean argument image. This source proves that the enabled field publication precedes the existing BLE PHY MMIO body; it does not import the vendor software environment or make optional BQB state part of the standalone open profile."

[[sources]]
id = "BLOB_LIBBLE_PHY_INIT_REGISTERS"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete member 72.o symbol r_sym_ble_3472b6bNiQdnWkYo6Ggv body, size 0x2f6. Its position in the ble_phy.c object symbol sequence matches the named ESP32-C61 r_ble_phy_init_registers ecosystem counterpart. That correspondence supplies only the function-role hint; all reviewed ESP32-S31 addresses, masks, values and ordering come from the ESP32-S31 body. At 0x201014b4 the body first applies a fresh-read AND with 0x00020000, preserving only bit 17, and its conditional tail later applies a separate fresh-read OR with 0x01108800, setting exactly bits 11, 15, 20 and 24. Besides the independently bounded BTMAC accesses, the body proves complete ordered images zero then one at the isolated positional word 0x20101ff0, complete ordered images 0x20 then 0x40 at the isolated positional word 0x2010891c around BLE-accelerator initialization, and finite BLE-accelerator initialization images at 0x20109800, 0x201098cc and 0x201098d0. It does not prove toggle, latch or phase hardware actions for either isolated word. Its complete conditional tail also proves the positional images and masks at 0x201011f0, 0x20101244..0x2010124c, 0x201014c4, 0x20101870 and 0x20101b74..0x20101b78. At 0x20101870, the selected branch performs a fresh-read RMW that sets bit 18, while the alternate branch leaves the word unchanged; the body does not prove an allowlist, directed-advertising, or independent enable meaning for that bit. The low byte written at 0x20101b74 remains an opaque runtime-configuration image; the body immediately follows it with complete image one at 0x20101b78 but does not prove latch semantics. These observations retain neutral initialization names: the cross-chip role hint does not prove their inner hardware meaning. Narrow owners are used for isolated addresses when neither adjacency nor the role hint proves a wider physical block."

[[sources]]
id = "BLOB_LIBBLE_CONTROLLER_ADDRESS_SLOTS"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete 0x7a-byte ble_phy.c member 72.o symbol r_sym_ble_ylitQQeG9NPtG1fXz4Tk, linked with a complete 0x76-byte instruction extent. Matching section order and neighboring functions identify the named ESP32-C61 ecosystem counterpart r_ble_phy_set_dev_address; that correspondence supplies only the function-role hint. Selector values zero, one and two choose exactly three stride-eight register pairs at 0x2010180c..0x20101820; any other selector takes the assertion path. For the selected pair, the ESP32-S31 body packs input bytes 0..3 into the complete little-endian low word, then packs bytes 4..5 into bits 0..15 of the complete high-word write while clearing bits 16..31. The named r_esp_ble_ll_set_public_addr wrapper reaches selector zero through complete member 14.o helper r_sym_ble_JEoQPlfmpf3P9DQfpdtU; named esp_ble_clear_rand_addr reaches selector one after clearing six bytes. Those caller names are role evidence for slots zero and one, not permission to invent semantics for slot two or adjacent hardware."

[[sources]]
id = "BLOB_LIBBTBB_BT_RX_SETUP"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete named bt_bb_rx_set body and its complete bt_agc_v2_set leaf. Their fresh-read RMW operations prove the recorded BTAGC field geometry and finite images. The complete parent also sets 0x20102000 bit 0 and 0x2010204c bit 2 through separate fresh-read RMW operations; this proves only their positional set-by-RX-setup behavior, not an independent hardware enable semantic. The parent body also performs a fresh-read RMW that clears 0x20104C24 bit 31 while preserving bits 30:0; that physical word is independently used by Wi-Fi MAC initialization and therefore has a shared-radio owner. Neutral CONFIG names deliberately avoid assigning undocumented receive/AGC semantics beyond the function boundary."

[[sources]]
id = "BLOB_LIBBTBB_SHARED_RX_INIT"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete named zb_rx_v0_0_set body, size 0xf0. It is called unconditionally by complete bt_bb_v2_init_cmplx and again by complete bt_bb_v2_rx_set. Its ordered fresh-read RMW operations prove the exact disjoint masks and finite images recorded at 0x20102C10..0x20102C34. The historical function prefix is retained only as call-identity evidence: the physical words remain in the protocol-neutral shared-radio owner and no Zigbee-only or BLE-only hardware semantics are inferred."

[[sources]]
id = "BLOB_LIBBTBB_SHARED_TX_TIMING_INIT"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete named bt_bb_set_zb_tx_on_delay body, size 0x32. Complete bt_bb_v2_init_cmplx calls it unconditionally with argument 60. The leaf performs one fresh-read RMW at 0x20102010, replacing bits 16:26 with ((argument - 10) << 3) while preserving every other bit. The historical function name is evidence for the call boundary, not a claim of exclusive Zigbee ownership; the physical word is retained by the shared-radio partition."

[[sources]]
id = "BLOB_LIBBTBB_BT_BB_V2_RX_SET_SLICE"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o bt_bb_v2_rx_set body, size 0x42, and complete directly selected configuration leaves bt_set_rx_comp (0x94), bt_agc_gain_set (0x46), bt_agc_recorrect_set (0xc8), bt_agc_restart_set (0x2e6), bt_agc_detect_set (0x108), bt_agc_rssi_thresh (0x5e) and bt_agc_target_set (0x96). Complete bt_bb_set_rx_sense (0x80) independently proves the whole-word dynamic writes that overlap finite subfields in shared BTAGC words. Direct accesses prove the exact masks and finite or dynamic images recorded for the sparse 0x20102844..0x20102900 words. Whole-word dynamic writes remain register-level evidence and are not projected as overlapping SVD fields. Positional names retain unknown hardware semantics."

[[sources]]
id = "BLOB_LIBBTBB_BT_BB_V2_INIT"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o bt_bb_v2_init_cmplx body for argument one and its complete bt_agc_gain_set leaf. The body sets the reviewed BASEBAND_INIT_7CD0 fields in one fresh-read RMW. The linked phy_param byte at offset 0x120 is retained to seven bits for RX_GAIN_FORCE_OPAQUE, then independently wrapping-subtracted by five and retained to seven bits for AGC_GAIN_IMAGE. These are two ordered fresh-read RMW operations; the source does not assign a physical unit to the linked byte. The complete body also proves the ordered finite transmit-timing updates at 0x20100870, 0x20102014 and 0x201020b8: PA_ON_BT_DELAY becomes 0x96, the LE delay update clears bits 16:18 while replacing bits 19:26 with 50, and two separate CCA fresh-read RMW operations first clear bits 20:22 while replacing bits 23:30 with 0x2c and then replace bits 9:19 with 0x1ff. After the complete shared receive initializer, the same body performs a distinct fresh-read RMW at 0x20102c00 that preserves bits 11:0 and replaces bits 31:12 with 0x0019f."

[[sources]]
id = "BLOB_LIBBTBB_BT_AGC_BASIC_RUNTIME"
description = "_oracles/libbtbb.a sha256 ebd67c6a32081d0fcd143bbb0ed53f962fc587058e20eceb59012beae47528df; complete bt_bb_v2.o bt_agc_gain_max and bt_agc_sat_gain bodies, sizes 0x34 and 0x52. The first performs one fresh-read RMW that replaces exactly 0x20102850 bits 20:14 with a dynamic image. The second writes argument 0 as complete images to 0x20102858 and 0x2010285c and writes the complete finite image 0x00000404 to 0x20102864. Dynamic complete images are intentionally reviewed at register level without an overlapping SVD field."

[[sources]]
id = "BLOB_LIBBLE_HW_ENCRYPT_BLOCK"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete member 10.o symbol r_sym_ble_STLOrgXoO0PUowzw9geF body, size 0xee in the archive and 0xe8 after linking. Its position in the ble_hw.c object symbol sequence matches the named ESP32-C61 r_ble_hw_encrypt_block counterpart. The function assembles four little-endian words from argument bytes 0..15, publishes argument+16 and argument+32 pointers, writes length 16 and finite control images, starts the engine, and polls the completion word. Cross-chip evidence names the operation only; all register facts come from ESP32-S31 bytes."

[[sources]]
id = "BLOB_LIBBLE_HW_RESOLV_LIST_SEARCH"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete member 10.o symbol r_sym_ble_NZbbpXEXzbgRpDNnAbBu body, size 0xd6 in the archive and 0xce after linking. Its section index 43 exactly matches named ESP32-C61 ble_hw.c r_ble_hw_resolv_list_search. The ESP32-S31 body publishes the two input images, mode bit 28, finite control image 0x400 and start image 1, polls status bit 2 with a finite timeout, then reads the result-present word, compressed SRAM result pointer and result metadata. The cross-chip artifact supplies only the function identity."

[[sources]]
id = "BLOB_LIBBLE_HW_RESOLV_LIST_SET"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete member 10.o symbol r_sym_ble_HMLMZPGDFKHQBGsbW7FL body, size 0x12. Its section index 45 exactly matches named ESP32-C61 ble_hw.c r_ble_hw_resolv_list_set. The ESP32-S31 body writes (argument >> 2) masked to twenty bits as a complete image at 0x20101880. The cross-chip artifact supplies only the function identity; the address, compression and write shape come from ESP32-S31 bytes."

[[sources]]
id = "BLOB_LIBBLE_HW_STATUS_CLEAR"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete member 56.o symbol r_sym_ble_hhjP4z2JeZSZI1tCMd9k, size 0x64. Its finite eight-iteration loop writes 0xFFFFFFFF to 0x20101b50 + index*4, reads the paired complete word at 0x20101b30 + index*4, and invokes a diagnostic callback only when that status is nonzero. The evidence proves eight status/clear pairs and their directions; individual source meanings remain unknown."

[[sources]]
id = "BLOB_LIBBLE_HW_RUNTIME_CONFIG"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete member 60.o symbols r_sym_ble_tO1ITpHlkI8hqnMyUkv0, r_sym_ble_zXjrWnnoyQEBCxht1snF and r_sym_ble_2rW77MQZQnEM4AEy0oE9. They publish complete ESP32-S31 images at 0x20101b88, 0x20101b90 and 0x20101b94 from controller configuration bytes. Exact masks are low five bits, two low-five-bit values separated by fixed bits 5 and 13, and one low byte respectively. Function roles remain intentionally unnamed because the matching source identity is not recovered."

[[sources]]
id = "BLOB_LIBBLE_HW_CTE_RING_CONTROL"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete ble_hw_cte.c member 11.o. Its section order and exact function sizes match the independently named ESP32-C61 ble_hw_cte.c object, identifying r_sym_ble_PVzdn6TosnCqbu5D1klI as r_ble_hw_cte_reset and the three accessors at sections 11..13 as ring-buffer-index clear and max-buffer-number set/get. The ESP32-S31 bodies prove that reset clears thirteen complete words at 0x2010199c..0x201019cc, that bit 15 of the first word is independently set, and that bits 12..14 are replaced with the low three argument bits and read back. The cross-chip object supplies only function identities; all addresses, widths and masks come from ESP32-S31 instructions."

[[sources]]
id = "BLOB_LIBBLE_ISO_SCHEDULER_NOTIFY"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete member 36.o symbols r_sym_ble_zh8XBuaT8Wy4Jvky7T8T and r_sym_ble_Iz1Chq2XDIpX4iL8g2ft. Both publish the complete image 1 at 0x20101424 after manipulating software-owned ISO state; the first does so only when the current object exists and flag bit 0 at object offset 6 is set, while the second does so after its queue/publication path. The evidence proves a shared ISO-path command strobe but does not establish the command's undocumented hardware effect."

[[sources]]
id = "BLOB_LIBBTDM_CONTROLLER_IRQ"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete btdm_hal.c members 7.o and 8.o, plus _oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195 complete nrtIsr_stack.c member 103.o. Primary setup clears exact bank images 0x00008000/0x00001300, ORs those images into IRQ_ENABLE_0/1, writes one to 0x2010100c, then allocates source 0x7c with caller flags zero. Its source-124 handler reads 0x2010105c then 0x20101068 and copies both images to 0x20101058/64. Its complete 190-byte diagnostic prefix then treats bank-zero source 15 and bank-one sources 8, 9 and 12 as assertion paths; source 9 first reads complete detail words 0x201011c8/1cc and source 12 first reads complete state word 0x20101070. The handler then synchronously dispatches callback phases zero and one and has a special path selected by bank-zero bits 21/27/28 and bank-one bit 3. Current source 21, combined sources 27/28 and bank-one source 3 all reach one static recycle event. Public same-chip named bodies map that path to r_btdm_hal_radio_isr, r_btdm_recycle_in_isr and r_btdm_recycle_in_task: every dequeued ordinary or marked event drains scheduler work, while the marker adds only buffer recycling. The handler never reads 0x2010125c, so no raw source is proven to produce a finished-list bit. Complete current helpers r_sym_bt_DOVkQWJHjeuid8jcS9Bq (16 bytes) and r_sym_bt_6lAYUFKOuBLyOZ6Kvsv5 (24 bytes) respectively W1C images 0x18200000/0x00000008 to IRQ_CLEAR_0/1 and OR those same images into IRQ_ENABLE_0/1; the scheduler-run prologue calls them in that order. Primary teardown frees the route, writes one to 0x20101010 then 0x20101014, and clears the baseline enable groups. The NRT initializer allocates distinct source 0x85 with caller flags one; its handler r_sym_ble_ywjh0f9yjTBeI7XgS5da reads raw snapshots 0x20101340/48, copies them to the same clear banks, and synchronously dispatches callback mask 0x80000000 with the two-word snapshot. Independent RMW users prove the remaining recorded source positions. Event names beyond the two CPU source identities remain unknown."

[[sources]]
id = "BLOB_LIBBTDM_MODEM_LP_TIMER_IRQ"
description = "Public espressif/esp32s31-bt-lib commit 7f20740dd66ee774ffce5db0b55507892551aa31, libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099, complete member 9.o symbols r_sym_bt_waDX0omCE7oLuPVSoPOK, r_sym_bt_FYr6kIOvDbNGoOHfaRvK and r_sym_bt_atiitVoBKMplOJVvjTHP. The initializer passes r_sym_bt_FYr6kIOvDbNGoOHfaRvK to wr_btdm_osal_intr_alloc with source 0x7f and caller flags zero. The complete 0x40-byte IRQ handler first reads 0x2010d038 and returns without calling the common timer handler when that word is zero. Otherwise it reads 0x2010d06c; zero joins the common timer-handler call without reading 0x2010d058. A nonzero 0x2010d06c freshly reads 0x2010d058 and tests exactly bit 2; a clear bit joins the timer-handler call, while a set bit causes a second fresh read of 0x2010d058, ORs exactly bit 1 into that second image, writes the result back, and then joins the same call. The complete 0x6c-byte call target r_sym_bt_atiitVoBKMplOJVvjTHP samples the low byte at 0x2010d024; when nonzero it publishes zero there, samples the low byte at 0x2010d02c, conditionally publishes zero there and advances a software environment word by 0x01000000, then invokes the timer-queue dispatcher. When the first low byte is zero it still samples and conditionally clears 0x2010d02c and advances the same software word, but skips queue dispatch. Both return paths end with a fresh read of 0x2010d024. The public same-chip unobfuscated older revision role-maps the pair as r_btdm_hal_rtc_irq_handler and r_btdm_hal_rtc_timer_handler. The evidence proves the exact positional register/branch order and the boundary between hardware acknowledgement and software timer state; it does not assign undocumented hardware meanings to the positional state bytes or make the vendor callback loop suitable for the source-owned no-RTOS runtime."

[[sources]]
id = "BLOB_LIBBTDM_MODEM_LP_TIMER_RUNTIME"
description = "Public espressif/esp32s31-bt-lib commit 7f20740dd66ee774ffce5db0b55507892551aa31, libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099, complete member 9.o symbols r_sym_bt_xPWv1Z87N9d40AR9yCcT, r_sym_bt_86dRVPWrmTMQpChjYeWi and r_sym_bt_VoUEVeWY4EiqyfQlgWT0. The 0x56-byte clock sample reads 0x2010d048 then the low byte at 0x2010d02c; on a nonzero byte it advances the software epoch by 0x01000000, freshly rereads 0x2010d048, clears 0x2010d02c, publishes one to 0x2010d024 and 0x00040000 to 0x2010d010, then returns the bitwise OR of the selected counter and epoch images. The 0x70-byte compare program first publishes 0x00040000 to 0x2010d014, samples the same counter/rollover pair and uses a fresh counter plus a locally advanced epoch when rollover is nonzero. A signed deadline delta at most two publishes one to 0x2010d024; a later delta below 0x01000000 publishes the deadline low 24 bits to 0x2010d06c; every other later delta publishes the selected counter plus 0x00800000 there. Every branch finishes by publishing 0x00040000 to 0x2010d010. The 0x96-byte queue dispatcher repeatedly removes due intrusive-list heads and calls function pointers, programs the first future deadline through the compare function, or publishes 0x00040000 to 0x2010d014 when empty. The evidence proves the finite hardware clock/compare transactions and separately identifies the vendor callback loop; it does not justify executing that loop in the source-owned hard handler."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_REGISTERS"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete btdm_sched.c member 19.o scheduler list and command transactions. They reconstruct list pointers from the 0x20101074 SRAM prefix plus 20-bit compressed pointers at 0x201010c8/cc, publish pointer/opcode/START to 0x201010ec, and separately publish payload plus START bit 31 to 0x20101254 or 0x20101258. Wait paths use the sign bit of 0x2010107c, inspect recorded command status bits and clear START. Complete 12-byte leaf r_sym_bt_iFvwGI2tL5M1WM3fIkHq reads 0x2010107c once and returns exactly bits 23:20 with every other result bit zero. The worker pop path r_sym_bt_WHYoiw8ufY0AEM2KSRK1 is the exclusive reviewed controller accessor for this transfer: it copies the low 16 bits of 0x2010125c into a zero-high image at 0x20101260 and synchronously publishes the combined hardware/software image to the BLE scheduler consumer. The raw ISR does not read 0x2010125c, and neither current nor public historical bodies prove an IRQ-source-to-finished-mask relation or the clear/re-arm effect of the report write. Same-chip public role evidence independently classifies the transferred image as the finished hardware-list mask; command opcodes and other status meanings remain unknown."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_SOFTWARE_LIST_REMOVAL"
description = "Public espressif/esp32s31-bt-lib commit 7f20740dd66ee774ffce5db0b55507892551aa31, libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099 complete member 19.o symbol r_sym_bt_FCfM3hAXphsk1qERleGZ (origin size 0x76), and libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195 complete member 110.o symbol r_sym_ble_yMicgnfj443R69TaZAC7 (0x12a). Public same-chip commit 31c30949541a5d3abd4043a1cb66d55aa55577dd initial libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63 names the instruction-corresponding caller r_sched_txn_removeSwList; the current body replaces the historical busy-state assertion tail with the new helper. The current caller mutates its software-list links before conditionally tail-calling that helper; neither body accepts a primary-event argument, acknowledges an interrupt or proves that command readiness raises source 124. Each helper attempt first reads SCHEDULER_STATE.BUSY; a set value skips both command reads. An idle observation reads SCHEDULER_COMMAND_0.STATUS_26; a clear value skips the second command. Only a set STATUS_26 causes a read of SCHEDULER_COMMAND_1.STATUS_18, and only a set STATUS_18 returns. After 10,000 non-ready attempts the vendor body asserts with fresh complete command-word images and resumes waiting. The open implementation retains the proven short-circuit predicate and read order as one finite event-driven observation. Its opaque pairing with an already captured, acknowledged and durably published post-unlink primary carrier has no public constructor until a session owner proves temporal order; this is a conservative ownership split, not vendor evidence of source-124 causality or a guaranteed Pending retry wake; it does not reproduce the diagnostic loop or assign undocumented meanings to the two positional status fields."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_LIFECYCLE"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete btdm_sched.c member 19.o symbols r_sym_bt_74l62ZLsZuXg67pPHSd7, r_sym_bt_HGbPEa9oUCsYybIAWjE0 and r_sym_bt_XPuqTHliEO5V9xpR7aJR. The first is reached from both r_btdm_task_disable and r_btdm_task_shutdown, writes the finite complete image 1 to 0x20101004, then waits on the already reviewed scheduler state. This proves the whole-word image and ordering, but not a hardware STOP command semantic. The 14-byte config builder publishes complete integer images 40 and 46. The 170-byte init body zeroes its software list heads and finished mask, clears bits 0..19 of exactly sixteen stride-0x10 words at 0x2010b000..0x2010b0f0 while preserving their upper twelve bits, copies the two config values, initializes one recycle event, and attaches two generic broker-source nodes with positional identities zero and three. Public same-chip commit 31c30949541a5d3abd4043a1cb66d55aa55577dd names the instruction-corresponding helpers r_btdm_sched_dft_cfg_build, r_btdm_sched_init and r_btdm_broker_attach. The open implementation retains the policy in a typed software value and replaces the event, task and intrusive broker containers with one pristine static runtime epoch; it does not make the numeric broker identities an open ABI. The observations establish lifecycle transactions and array geometry; the hardware meaning of the lifecycle request and entry payload remains unknown."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_HEAD_PUBLICATION"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete btdm_sched.c member 19.o symbols r_sym_bt_EabYtUaAIR05LXw3qZSA (198 bytes), r_sym_bt_4KfpZh0Hu5NprlqcNu0D (222 bytes), r_sym_bt_DPWY0umixzmXEaFuUyCI (24 bytes) and r_sym_bt_PVKilXLQPu1BjRkm4C6O (38 bytes). The first reads bits 0..19 from 0x2010b000 + list_index * 0x10 and reconstructs zero or 0x2f000000 | (image << 2). The second replaces those same low twenty bits with an SRAM item address shifted right by two while preserving bits 20..31; its result-four and result-five paths independently clear START in SCHEDULER_COMMAND_0 and SCHEDULER_COMMAND_1. Its successful publication path calls the 24-byte leaf. That leaf first calls the 38-byte run prologue and writes complete image 1 to SCHEDULER_CONTROL when the prologue returns zero. The complete prologue always returns zero after calling the exact dynamic IRQ clear and enable helpers and synchronously dispatching broker selector two with argument zero. Thus the branch is not a runtime predicate, and the hardware command is the final action of the larger scheduler-run operation. These complete current bodies establish the physical field, table geometry and ordering; same-chip public named functions supply the hardware-list-head, insertion-end and scheduler-run roles."

[[sources]]
id = "BLOB_LIBBTDM_SCHEDULER_RUN_EVENT"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099 complete member 19.o r_sym_bt_PVKilXLQPu1BjRkm4C6O synchronously publishes selector two with argument zero after dynamic interrupt preparation and before RUN. _oracles/libble_app.a sha256 62dbe7216619f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195 complete member 2.o r_sym_ble_uwrf0kLZsRbzFJ7u8SEr, mapped to same-chip named r_base_stack_sched_broker_cb, handles that selector by writing only bit 14 to 0x201014b8 and then setting bit 14 at 0x201014b4 through a fresh-read RMW. The same complete callback clears bit 14 at 0x201014b4 for selector three. The complete named base-stack ISR writes its sampled pending-source image to 0x201014b8, while initialization writes all ones there, establishing the write-one-to-clear interrupt-bank role. The open implementation replaces the generic callback list with this exact synchronous clear-then-enable transaction; it does not turn selector two into an asynchronous worker event."

[[sources]]
id = "BLOB_LIBBTDM_HAL_CONTROLLER_INIT"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete btdm_hal.c member 7.o symbol r_sym_bt_aGdrujd2MUAzWYH75baR (size 0x238), its complete config setter r_sym_bt_BOhffsuJp3HZRA44ZYRn (0x10e), complete byte-scaling helper in member 10.o and caller r_btdm_task_init in member 21.o. The caller constructs positional bytes 16, 11 and 33, complete image 2000 and SRAM base 0x2f000000. The setter accepts first byte 8 or 16 and complete image 500, 1000 or 2000, maps the latter to selector 2, 1 or 0 in the same config object, and copies the remaining inputs. The helper uses that selector: byte values are shifted right one, retained, or shifted left one respectively. Therefore the reviewed caller produces sleep-control shift 3 and HAL bytes 22 and 66; no vendor structure layout is required by the production API. The HAL body performs exactly 50 ordered writes/RMWs across 0x20101074/84/90/dc/e0, 0x201011c0/c4, 0x20101250/7c and 0x2010134c/50. Its sixteen-iteration loop covers two adjacent words with eight four-bit lanes each: for every lane it first clears nibble mask 0xc through a fresh-read RMW, then through another fresh read ORs 1 | ((global_index & 3) << 1). Thus bit zero is set, bit one is preserved-or-set, bit two is replaced and bit three is cleared; the transaction is not a complete lane assignment on arbitrary input. Every address, mask, constant and ordering claim comes from these complete bodies. HAL_INIT and positional names intentionally do not assign undocumented controller semantics."

[[sources]]
id = "BLOB_LIBBTDM_RUNTIME_CONTROL"
description = "_oracles/libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099; complete direct MMIO users in the low-level member 9.o and btdm_sleep.c member 20.o. They prove the sparse 0x20108800/08/2c..48 and 0x2010d000..78 register set, all recorded access directions, finite complete images, dynamic low-24-bit publications and independent bit RMWs. The source establishes BTDM runtime/sleep ownership but not the undocumented meaning of positional words; no field name below is inferred from address adjacency."

[[sources]]
id = "PUBLIC_ESP32S31_BT_RUNTIME_TIMER_ROLE"
description = "Current public espressif/esp32s31-bt-lib libbtdm_common.a sha256 fa22a8a2aca48b807addda2bbad78868d6774c82bcdeb8090f9140f6cbccd099 complete member 9.o symbol r_sym_bt_ymLPVGRY14FVW494j9ZD is a ten-byte leaf that writes complete image 1 to 0x2010d000 and returns. Public same-chip commit 31c30949541a5d3abd4043a1cb66d55aa55577dd complete unobfuscated btdm_hal_rtc.c.o symbol r_btdm_hal_rtc_start is instruction-identical. Its sole caller r_btdm_hal_enable invokes it after controller hardware initialization and controller-output preparation and before primary CPU-route allocation. The same historical object names the complete timer-initialization role r_btdm_hal_rtc_init; current complete member 9.o symbol r_sym_bt_waDX0omCE7oLuPVSoPOK is the exact geometry and order authority for the changed seven-write plus fresh-read/RMW initialization body. The historical name is role evidence only where the bodies differ."

[[sources]]
id = "BLOB_LIBBLE_CONTROLLER_OPERATIONAL_GAPS"
description = "_oracles/libble_app.a sha256 62dbe7216619d1f1e3dcd51233d91b211add15c7c746851af0be6a632cdae195; complete member 30.o symbols r_sym_ble_Lvdx6uFL4ttfphyryygo (origin size 0x1e6) and r_sym_ble_erAV4viTh2RgjlMINBm8 (size 0x122). The first performs two complete zero writes each to 0x2010108c and 0x201010b8. The second publishes complete dynamic images to 0x20108804. Function roles remain unnamed; the evidence proves only physical ownership, direction, values and complete-word geometry."

