[package]
name = "oer-esp32s31-phy-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embassy-time binding for ESP32-S31 PHY delays and tracking clocks"

[dependencies]
embassy-time = "0.5.1"
oer-esp32s31-phy = { path = "../../../hardware/esp32s31/phy" }

[dev-dependencies]
embassy-time = { version = "0.5.1", features = ["generic-queue-64", "std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "runtime"
platform = "chip"
chip = "esp32s31"
