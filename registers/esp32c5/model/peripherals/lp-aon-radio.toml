schema = 2

[[peripherals]]
name = "LP_AON_RADIO"
description = """ESP32-C5 LP_AON field the PHY's power-detector SAR initialization drives. Other fields remain absent and are preserved by every field transaction."""
baseAddress = 0x600B1000

[[peripherals.registers]]
[peripherals.registers.register]
name = "SAR_CCT"
description = "SAR control word."
addressOffset = 0x54
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "SAR2_PWDET_CCT"
description = "Three-bit SAR2 power-detector capacitor code."
bitOffset = 29
bitWidth = 3
