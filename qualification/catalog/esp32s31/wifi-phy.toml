[[sections]]
id = "phy-qualification-boundary"
domain = "phy"
title = "Qualification boundary"
source-document = "crates/hardware/esp32s31/phy/FEATURES.md"
overview = "There is no standalone PHY qualification target. Current readiness requirements\nare carried by [Wi-Fi](../../../../qualification/targets/esp32s31/wifi-sta.toml),\n[Bluetooth](../../../../qualification/targets/esp32s31/bluetooth-le.toml) and\n[IEEE 802.15.4](../../../../qualification/targets/esp32s31/ieee802154.toml).\nThis inventory does not promote their proof states.\nThe Wi-Fi program resolves its migrated channel-switch scope and RF/baseband\ndependency from the\n[canonical Wi-Fi/PHY catalog](../../../../qualification/catalog/esp32s31/wifi-phy.toml);\nthe catalog does not create a standalone PHY readiness target.\n\nPLL lock, channel correctness, calibrated TX power, RX sensitivity after retune,\nand calibration stability across sleep/wake require their own hardware evidence.\nA completed source transition or protocol cold start cannot substitute for those\nmeasurements. Cache-backed cold partial calibration and RF-close-to-cold-registration\nownership are implemented and composed by the Wi-Fi supervisor. The direct\nretained wake path is also composed for an immediate idle Wi-Fi cycle, with a\ndedicated repeated-cycle HIL scenario. Neither lifecycle supplies scheduled\nmodem sleep. Repeated connection and data-path HIL cover the Wi-Fi cold-restart\nboundary; broad RF qualification remains a separate readiness requirement."
source-paths = ["qualification/catalog/esp32s31/wifi-phy.toml","qualification/targets/esp32s31/bluetooth-le.toml","qualification/targets/esp32s31/ieee802154.toml","qualification/targets/esp32s31/wifi-sta.toml"]

