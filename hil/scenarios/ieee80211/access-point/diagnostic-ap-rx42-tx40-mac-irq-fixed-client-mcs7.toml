schema = 5
id = "diagnostic-ap-rx42-tx40-mac-irq-fixed-client-mcs7"
description = "AP 42/40 collapse probe with intrusive MAC IRQ classification and fixed client MCS7"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "access-point", "udp", "bidirectional", "mac-irq", "fixed-client-mcs"]

[wifi]
image = "diagnostic-mac-irq"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt", fixed_ht_mcs = 7 }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 42000000, tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
