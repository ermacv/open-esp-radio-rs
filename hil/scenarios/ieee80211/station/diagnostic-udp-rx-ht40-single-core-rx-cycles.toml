schema = 5
id = "diagnostic-udp-rx-ht40-single-core-rx-cycles"
description = "CPU0 RX phase and service-batch cycles of the HT40 saturated RX path with the IP stack on CPU0 too"
role = "investigation"
tags = ["diagnostic", "udp", "station", "rx", "ht40", "single-core", "cycles", "air-strict"]

[wifi]
image = "diagnostic-core0-rx-cycles"

[wifi.datapath]
placement = "single-core"
rx_continuation = "adaptive-probe-diagnostic"
l1_cache_counters = true

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1472
offer = { rx_bps = 140000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 10000000
