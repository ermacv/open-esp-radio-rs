[package]
name = "oer-esp32s31-bluetooth-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 Bluetooth controller execution over embassy-time"

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
oer-bluetooth-hci = { path = "../../../protocols/bluetooth/hci" }
oer-bluetooth-ll = { path = "../../../protocols/bluetooth/le/ll" }
oer-esp32s31-bluetooth = { path = "../../../hardware/esp32s31/driver/bluetooth" }
oer-esp32s31-bluetooth-controller = { path = "../../../roles/esp32s31/bluetooth/controller" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-esp32s31-phy = { path = "../../../hardware/esp32s31/phy" }

[dev-dependencies]
bt-hci = "=0.10.1"

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "runtime"
platform = "chip"
chip = "esp32s31"
