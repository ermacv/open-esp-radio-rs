schema = 5
case-execution = "independent"
transaction-comparison = "observables"

# Exact complete-leaf evidence for the disjoint STA=0 and SoftAP=1 hardware
# identity banks. The six-byte address is passed through the original pointer
# ABI and is shared by the vendor and Rust executions.

[[profiles]]
name = "wifi-interface-address"
claim = "whole-function-equivalence"
vendor-source = "libpp"
vendor-symbol = "hal_mac_set_addr"
rust-symbol = "open_libpp_interface_trace_hal_mac_set_addr"
compare-return = false
[[profiles.argument-ranges]]
index = 0
min = 0
max = 1

[[profiles.cases]]
name = "station-bank"
arguments = [0, 0x3fff3000]
[[profiles.cases.ram]]
address = 0x3fff3000
value = 0x33221102
[[profiles.cases.ram]]
address = 0x3fff3004
value = 0x00005544
[[profiles.cases.mmio-initial]]
address = 0x20104060
value = 0xa5a50000

