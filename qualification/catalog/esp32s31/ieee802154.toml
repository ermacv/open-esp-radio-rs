[[items]]
id = "ieee802154-rx-tx-dataplane-and-acknowledgments-enhanced-ack-tx"
section = "ieee802154-rx-tx-dataplane-and-acknowledgments"
title = "Enhanced ACK TX"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine publishes an enhanced ACK for 2015 frames from the role's generator, a port of ESP-IDF's OpenThread generator: the [portable formatter](../../../../protocols/ieee802154/src/mac/enhanced_ack.rs) ports OpenThread GenerateEnhAck, and secured ACKs take the frame counter and the key-index-mode key from the radio's MAC keys with engine-armed transmit security. Received frames report the frame-pending bit and the counter and key index of the secured ACK they were sent. With CSL the ACK carries the port's CSL IE, filled with period and phase at its SFD. For a Link Metrics probing initiator the ACK carries the Thread enhanced-ACK probing IE with the frame's LQI, link margin and RSSI, from the [portable probing table](../../../../protocols/ieee802154/src/mac/link_metrics.rs) the OpenThread adapter fills from `otPlatRadioConfigureEnhAckProbing`; link margins are measured from the reported receive sensitivity, where ESP-IDF's port leaves the noise floor at zero. Other header IEs are fixed caller bytes; on-air qualification is absent."

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-hardware-frame-filtering"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "Hardware frame filtering"
status = "partial"
level = "composed-product"
scope-and-limitations = "PAN identity, the PAN coordinator role and promiscuous control are configured through the portable contract, but whole-radio filtering and on-air admission are not closed."

[[items]]
id = "ieee802154-filtering-addressing-and-mac-automation-pan-id"
section = "ieee802154-filtering-addressing-and-mac-automation"
title = "PAN ID"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "Static policy owns primary-context PAN identity write/readback."

