# ESP-IDF sources the IEEE 802.15.4 host stand compiles: the driver's
# translation units and every header they include. Fetched file by file, so
# `target/vendor/esp-idf/<revision>/` mirrors the checkout's layout.
[[source]]
id = "esp-idf"
kind = "git"
repository = "https://github.com/espressif/esp-idf"
revision = "4d59230ddff16327812782151ef0afef202dc6d7"

# ESP-IDF's `esp_phy` component at the same revision, read for the vendor PHY
# path (enable, tracking and modem retention) and compiled by no stand; kept
# apart from the stand's sources. Its prebuilt library submodule is
# `esp-phy-lib`.
[[source]]
id = "esp-idf-phy"
kind = "git"
repository = "https://github.com/espressif/esp-idf"
revision = "4d59230ddff16327812782151ef0afef202dc6d7"

# Built locally from an ESP-IDF tree; never fetched. `path` is where the
# scenarios expect the build output below the repository root.
[[source]]
id = "local-build"
kind = "local"

