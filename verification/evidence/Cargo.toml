[package]
name = "oer-vendor-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The vendor-comparison evidence index: shard format, validation, currency, the one shard writer, the verdict source policy and the producer contract"
readme = "README.md"

[dependencies]
oer-process = { path = "../../tools/process" }
oer-repo = { path = "../../tools/repo" }
oer-vendor-evidence-shard = { path = "../../qualification/evidence-shard" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
oer-chip-profile = { path = "../../tools/chip-profile", optional = true }
oer-image-policy = { path = "../../tools/image-policy", optional = true }
oer-probe-codegen = { path = "../harness/codegen", optional = true }
oer-toolchain = { path = "../../tools/toolchain", optional = true }
oer-vendor-artifacts = { path = "../../tools/vendor-artifacts", optional = true }

[features]
# The producers' orchestration (`run`): probe builds, the Blobray scenario
# runs and shard regeneration. Off for the Blobray workspace and the stands.
producers = ["dep:oer-chip-profile", "dep:oer-image-policy", "dep:oer-probe-codegen", "dep:oer-toolchain", "dep:oer-vendor-artifacts"]

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "verification"
evidence = "verdict"
platform = "host"
host-layer = "verification"
host-app = "verification"
host-boundary = "application"
test-feature-sets = ["producers"]
