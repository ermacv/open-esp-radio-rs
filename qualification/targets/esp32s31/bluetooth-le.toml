target = "esp32s31-bluetooth-le"
required-capabilities = [
  "cold-ownership",
  "clock-reset-prerequisite",
  "controller-initialization",
  "controller-timebase",
  "common-phy-baseband",
  "interrupt-runtime",
  "controller-memory-lists",
