schema = 1

[[regions]]
id = "internal-sram"
kind = "sram"
start = 0x2f000000
end = 0x2f07afc0

[[regions]]
id = "external-psram"
kind = "psram"
start = 0x50010000
end = 0x51000000

[[reserves]]
id = "cpu0-stack"
region = "internal-sram"
start_symbol = "_stack_end"
end_symbol = "_stack_start"
reason = "stack"

[[rules]]
symbol = "*::station::STATION_MEMORY"
owner = "wifi.station-arena"
scope = "adapter"
reason = "hardware-dma"
placement = "required-sram"
region = "internal-sram"
optimization = "The aggregate includes RX and ordinary-TX memory addressed by Wi-Fi DMA; split CPU-only scan/control fields before moving any subset to PSRAM."

[[rules]]
symbol = "*::connected::RX_STAGE_POOL"
owner = "wifi.rx.hot-staging"
scope = "adapter"
reason = "latency-critical"
placement = "required-sram"
region = "internal-sram"
count = 32
element_capacity = 1700
optimization = "Two complete negotiated 16-frame BlockAck windows; tune only against measured BUFFER_FULL and staging backpressure."

[[rules]]
symbol = "*::connected::RX_REORDER_STORAGE"
owner = "wifi.rx.reorder"
scope = "adapter"
reason = "cold-path"
placement = "required-psram"
region = "external-psram"
count = 64
element_capacity = 1700

[[rules]]
symbol = "*::radio_resources::NETWORK_TX_POOL"
owner = "wifi.tx.pinned-network"
scope = "adapter"
reason = "hardware-dma"
placement = "required-sram"
region = "internal-sram"
count = 66
element_capacity = 1648

[[rules]]
symbol = "*::radio_resources::NETWORK_RESOURCES"
owner = "wifi.network-handoff"
scope = "adapter"
reason = "cpu-only"
placement = "required-psram"
region = "external-psram"

[[rules]]
symbol = "*::radio_resources::ACCESS_POINT_NETWORK_RESOURCES"
owner = "wifi.network-handoff"
scope = "adapter"
reason = "cpu-only"
placement = "required-psram"
region = "external-psram"

[[rules]]
symbol = "*::radio_resources::TX_AMPDU_STORAGE"
owner = "wifi.tx.ampdu-state"
scope = "adapter"
reason = "cpu-only"
placement = "required-psram"
region = "external-psram"

[[rules]]
symbol = "*::radio_resources::TX_AMPDU_DMA_STORAGE"
owner = "wifi.tx.ampdu-descriptors"
scope = "adapter"
reason = "hardware-dma"
placement = "required-sram"
region = "internal-sram"

[[rules]]
symbol = "*::radio_resources::TX_AMPDU_RETENTION"
owner = "wifi.tx.ampdu-retention"
scope = "adapter"
reason = "cpu-only"
placement = "required-psram"
region = "external-psram"

[[rules]]
symbol = "*::radio_resources::TX_AMPDU_STANDBY_STORAGE"
owner = "wifi.tx.ampdu-standby-state"
scope = "adapter"
reason = "cpu-only"
placement = "required-psram"
region = "external-psram"

[[rules]]
symbol = "*::radio_resources::TX_AMPDU_STANDBY_DMA_STORAGE"
owner = "wifi.tx.ampdu-standby-descriptors"
scope = "adapter"
reason = "hardware-dma"
placement = "required-sram"
region = "internal-sram"

[[rules]]
symbol = "*::radio_resources::TX_AMPDU_STANDBY_RETENTION"
owner = "wifi.tx.ampdu-standby-retention"
scope = "adapter"
reason = "cpu-only"
placement = "required-psram"
region = "external-psram"

[[rules]]
symbol = "*::monitor::CAPTURE_POOL"
owner = "wifi.monitor.capture"
scope = "adapter"
reason = "cpu-only"
placement = "required-psram"
region = "external-psram"
count = 8
element_capacity = 1700

[[rules]]
symbol = "*::APP_CORE_STACK"
owner = "runtime.core1-stack"
scope = "runtime"
reason = "stack"
placement = "required-sram"
region = "internal-sram"
count = 1
element_capacity = 16384
optimization = "Core 1 owns the Embassy network executor. Sustained A-MPDU traffic exhausted 10 KiB; 16 KiB is qualified at runtime with at least 25% painted-stack headroom."

[[rules]]
symbol = "*::product_hil::NETWORK_RESOURCES"
owner = "network.stack-resources"
scope = "runtime"
reason = "cpu-only"
placement = "required-psram"
region = "external-psram"

[[rules]]
symbol = "*::product_hil::traffic::runtime::TCP_RX_BUFFER"
owner = "hil.tcp.rx-window"
scope = "hil"
reason = "qualification-window"
placement = "required-psram"
region = "external-psram"
count = 1
element_capacity = 262144
optimization = "HIL throughput window; production applications choose their own socket capacity."

[[rules]]
symbol = "*::product_hil::traffic::runtime::TCP_TX_BUFFER"
owner = "hil.tcp.tx-window"
scope = "hil"
reason = "qualification-window"
placement = "required-psram"
region = "external-psram"
count = 1
element_capacity = 65536

[[rules]]
