[package]
name = "oer-radio-embassy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embassy mailbox and role-epoch actor for the portable radio service"
readme = "README.md"

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
oer-radio = { path = "../../../radio", default-features = false, features = ["wifi"] }
oer-ieee80211-runtime = { path = "../../../runtime/ieee80211" }

[dev-dependencies]
oer-ieee80211-mac = { path = "../../../protocols/ieee80211/mac" }
oer-radio = { path = "../../../radio", default-features = false, features = ["wifi", "test-support"] }
oer-ieee80211-sta = { path = "../../../protocols/ieee80211/sta" }
oer-ieee80211-rsn = { path = "../../../protocols/ieee80211/security/rsn" }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "adapter"
platform = "portable"
