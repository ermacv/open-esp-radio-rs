[[sources]]
id = "BLOB_LIBPHY_PHY_DEBUG_REG_CHECK"
description = "espressif/esp-phy-lib commit 20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/libphy.a, sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2; complete phy_debug.o phy_reg_check body, size 0x400. Its fixed loop bounds and block-name strings prove the half-open hardware dump ranges recorded in the project evidence catalogs; they do not name individual registers. Three blocks are dumped only while bit 10 or bit 16 of 0x20109c14 or bit 23 of 0x20109c04 is set, which leaves the ranges unchanged."

