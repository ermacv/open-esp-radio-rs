schema = 5
id = "diagnostic-station-phy-baseline-ceiling-delivery-rx"
description = "HT40 RX delivery-frontier ceiling control without PHY maintenance"
repetitions = 3
transfer = "identical-image"
tags = ["phy-maintenance", "diagnostic", "station", "udp", "ht40", "ceiling"]

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 120000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 72000000
