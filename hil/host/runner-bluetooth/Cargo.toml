[package]
name = "oer-hil-runner-bluetooth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bluetooth LE HIL workloads and the Linux Bluetooth fixture"

[dependencies]
hil-core = { package = "oer-hil-runner-core", path = "../runner-core" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
oer-process = { path = "../../../tools/process" }
oer-hil-fixture = { path = "../fixture" }
tempfile = "3"
oer-hil-protocol = { path = "../../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = "=5.19.0"
async-channel = "2.5"
async-io = "2.6"
futures-lite = "2.6"

[dev-dependencies]
toml = "1.1"
hil-core = { package = "oer-hil-runner-core", path = "../runner-core", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "host"
