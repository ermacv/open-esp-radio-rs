# Reusable public ESP-IDF callback-table layouts. This file intentionally owns
# no binary source, symbol/address root, artifact digest, runtime value, or
# executable provider binding; those remain in each project's interface pack.
schema = 1
id = "espressif.esp-idf.interface-templates"

