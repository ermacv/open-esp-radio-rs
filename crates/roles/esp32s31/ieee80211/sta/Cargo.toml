[package]
name = "oer-esp32s31-wifi-sta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 Wi-Fi station composition"

[dependencies]
critical-section = "1.2.0"
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../../hardware/esp32s31/phy" }
oer-esp32s31-wifi-mac = { path = "../../../../hardware/esp32s31/driver/ieee80211/mac" }
oer-esp32s31-wifi-dma = { path = "../../../../hardware/esp32s31/driver/ieee80211/dma" }
oer-esp32s31-wifi = { path = "../../../../hardware/esp32s31/driver/ieee80211" }
oer-ieee80211 = { path = "../../../../protocols/ieee80211/mac" }
oer-wifi-softmac = { path = "../../../../protocols/ieee80211/softmac" }
oer-wifi-rsn = { path = "../../../../protocols/ieee80211/security/rsn" }
oer-wifi-sta = { path = "../../../../protocols/ieee80211/sta" }
static_cell = "2.1.1"

[features]
default = []
task-poll-telemetry = [
    "dep:riscv",
    "oer-esp32s31-wifi/task-poll-telemetry",
]

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "role"
platform = "chip"
chip = "esp32s31"
