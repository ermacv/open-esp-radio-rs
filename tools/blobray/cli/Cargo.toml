[package]
name = "blobray-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Blobray command line over its in-process operations"

[[bin]]
name = "blobray"
path = "src/main.rs"

[lib]
name = "blobray_cli"

[dependencies]
blobray-backend-riscv = { path = "../crates/riscv" }
blobray-application = { path = "../crates/application" }
blobray-domain = { path = "../crates/domain" }
clap = { version = "=4.5.48", features = ["derive"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std", "write"] }
cargo_metadata = "=0.23.1"
toml = "=1.1.4"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
