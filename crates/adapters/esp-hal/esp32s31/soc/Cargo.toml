[package]
name = "oer-esp32s31-soc-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-S31 SoC cache, flash and DMA services backed by esp-hal"

[features]
default = []
esp32s31 = ["dep:esp-hal"]
axi-gdma-mem2mem = ["esp32s31", "dep:atomic-waker"]
psram-dma-diagnostic = ["axi-gdma-mem2mem"]

[dependencies]
atomic-waker = { version = "1.1.2", optional = true }
critical-section = "1.2.0"
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "890fd49cfb0c438c4df450d88b059c62a0a724b8", default-features = false, features = ["esp32s31", "unstable"], optional = true }

# Host tests need the std implementation; chip doctests use esp-hal's.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "adapter"
platform = "chip"
chip = "esp32s31"
