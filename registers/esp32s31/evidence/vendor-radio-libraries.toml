[[sources]]
id = "BLOB_LIBCOEX_IEEE802154_HANDOFF"
description = "libcoexist.a sha256 9b8f55b1a1670ac8da1323595c817eca7340f073e783c162d3a2dfde7bbd19c8; complete coexist_api.o esp_coex_ieee802154_coex_break_notify tail-calls coexist_hw.o hal_ieee802154_coex_break_notify, whose complete body returns without effects. Complete esp_coex_ieee802154_extcoex_rx_stage and esp_coex_ieee802154_extcoex_tx_stage bodies also return without effects. The TXRX/ACK PTI wrappers separately map a client priority and call hal_set_IEEE802154_TXRX_pti / hal_set_IEEE802154_ACK_pti; force_rx_enable calls the force-RX and coex-delay setters. These named leaves establish no CPU-observed RF grant or release acknowledgement. No general absence of hardware coexistence is inferred."

[[sources]]
id = "BLOB_LIBPHY_PHY_START_TX_TONE_STEP_NEW"
description = "espressif/esp-phy-lib commit 20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/libphy.a, sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2; complete phy_reg.o phy_start_tx_tone_step_new body, size 0xf4. It clears the tone stop field of 0x2010040c before calling g_phyFuns + 0x30 with zero; only when both path selectors are zero does it set that field to three and tail-call g_phyFuns + 0x30 with one."

[[sources]]
id = "BLOB_LIBPHY_PHY_XTAL_DUTY_CAL"
