    "crates/runtime/ieee80211/tests/ui/installation_ampdu_rate.rs",
    "crates/runtime/ieee80211/tests/ui/installation_prepared.rs",
    "crates/runtime/ieee80211/tests/ui/installation_no_ack.rs",
    "crates/runtime/ieee80211/tests/ui/retuned_rate.rs",
