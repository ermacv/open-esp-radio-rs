# Reviewed ESP32-S31 closed-PAC domains and safe transactions; no discovery facts or hardware metadata.
schema = 3

[options]
device-access = true
allow-clippy-empty-docs = true

[[ownership-partitions]]
name = "WifiMacPeripherals"
member = "wifi_mac"
description = "ESP32-S31 Wi-Fi MAC register views owned by the Wi-Fi hardware lifecycle."
peripherals = [
    "WIFI_MAC_ANTENNA_INIT",
    "WIFI_MAC_AUX_TSF_CONTROL",
    "WIFI_MAC_BEACON_IE_CRC",
    "WIFI_MAC_BEAMFORMING_FEEDBACK_TEST",
    "WIFI_MAC_BEAMFORMING_REPORT",
    "WIFI_MAC_BSSID_POLICY",
    "WIFI_MAC_COLD_HANDSHAKE",
    "WIFI_MAC_CONTROL",
    "WIFI_MAC_CORE_ENABLE",
    "WIFI_MAC_CRYPTO_CONTROL",
    "WIFI_MAC_DIAGNOSTIC_STATISTICS",
    "WIFI_MAC_HE_BUFFER_STATUS",
    "WIFI_MAC_HE_COLOR_COLLISION",
    "WIFI_MAC_HE_INIT_PREFIX",
    "WIFI_MAC_HE_INIT_SUFFIX",
    "WIFI_MAC_HE_MU_EDCA_TIMER",
    "WIFI_MAC_HE_OBSS_NARROW_BAND_RU",
    "WIFI_MAC_HE_TB_DIAGNOSTICS",
    "WIFI_MAC_HE_TB_STATISTICS",
    "WIFI_MAC_HE_TRIGGER_RX_DIAGNOSTICS",
    "WIFI_MAC_INTERFACE_ADDRESS",
    "WIFI_MAC_INTERNAL_TX_BLOCK_ACK",
    "WIFI_MAC_KEY_TABLE",
    "WIFI_MAC_LAST_RX_BUFFER",
    "WIFI_MAC_REGDMA_CONTROL",
    "WIFI_MAC_RTC_TIMER_UPDATE",
    "WIFI_MAC_RX_BSSID_LIST",
    "WIFI_MAC_RX_CSI_CONTROL",
    "WIFI_MAC_RX_CUSTOM_TYPE",
    "WIFI_MAC_RX_DMA",
    "WIFI_MAC_RX_END_STATE",
    "WIFI_MAC_RX_FILTER",
    "WIFI_MAC_RX_HANG_STATISTICS",
    "WIFI_MAC_RX_POWER_SAVE",
    "WIFI_MAC_RX_RUNTIME_RESULTS",
    "WIFI_MAC_RX_STATISTICS",
    "WIFI_MAC_STA_BEACON_FILTER",
    "WIFI_MAC_STA_TBTT_TARGET",
    "WIFI_MAC_STA_TSF_LOAD",
    "WIFI_MAC_TSF_STATUS",
    "WIFI_MAC_TSF_TIMER",
    "WIFI_MAC_TXRX_CALLBACKS",
    "WIFI_MAC_TXRX_PREFIX",
    "WIFI_MAC_TXRX_SUFFIX",
    "WIFI_MAC_TX_COMMON",
    "WIFI_MAC_TX_COMPLETION",
    "WIFI_MAC_TX_POWER_INIT",
    "WIFI_MAC_TX_QUEUE_CONTROL",
    "WIFI_MAC_TX_QUEUE_VECTOR",
    "WIFI_MAC_TX_STATISTICS",
]

[[ownership-partitions]]
name = "WifiInterruptPeripherals"
member = "wifi_interrupts"
description = "Wi-Fi interrupt banks transferred from cold setup to the hard interrupt handlers."
peripherals = [
    "WIFI_MAC_INTERRUPT",
    "WIFI_MAC_POWER_INTERRUPT",
]

[[ownership-partitions]]
name = "RadioPhyPeripherals"
member = "radio_phy"
description = "Role-neutral RF and PHY register views serialized by the shared radio lifecycle."
peripherals = [
    "PHY_AGC_ORACLE",
    "PHY_AGC_RECOVERED_GAPS",
    "PHY_BASEBAND_CONFIG_ORACLE",
    "PHY_BB_RECOVERED_GAPS",
    "PHY_BRX_RECOVERED_GAPS",
    "PHY_BTAGC_RECOVERED",
    "PHY_CLOCK_ORACLE",
    "PHY_COLD_DEADLINE_ORACLE",
    "PHY_FECTRL_RECOVERED",
    "PHY_FEDATA_RECOVERED",
    "PHY_FEDATA_WIFI_RECOVERED",
    "PHY_FREQUENCY_CHANNEL_ORACLE",
    "PHY_I2C_COMMAND_RAM",
    "PHY_IQ_ESTIMATOR_ORACLE",
    "PHY_MEMORY",
    "PHY_NRX_RECOVERED_GAPS",
    "PHY_PBUS",
    "PHY_RX_DCO_ORACLE",
]

[[ownership-partitions]]
name = "CoexistencePeripherals"
member = "coexistence"
description = "Shared coexistence register views owned by the radio arbitration service rather than either protocol role."
peripherals = [
    "COEX_HW_TIMER",
    "PHY_FECOEX_RECOVERED",
    "WIFI_MAC_COEX_INIT",
    "WIFI_MAC_COEX_RUNTIME",
]

[[ownership-partitions]]
name = "BluetoothControllerPeripherals"
member = "bluetooth"
description = "Bluetooth controller, baseband, accelerator and feature register views retained by the Bluetooth hardware lifecycle."
peripherals = [
    "BLE_CONTROLLER_ADDRESS_SLOTS",
    "BLE_CONTROLLER_POINTER_PUBLICATION",
    "BLE_HW_ACCELERATOR",
    "BLE_HW_CTE_RING_CONTROL",
    "BLE_HW_RESOLVING_LIST",
    "BLE_HW_RUNTIME_CONTROL",
    "BLE_ISO_SCHEDULER_NOTIFY",
    "BLE_PHY_INIT_PHASE",
    "BLE_PHY_INIT_TOGGLE",
    "BLE_SCAN_CONTROL",
    "BLE_SYNC_PUBLICATION",
    "BLUETOOTH_CONTROLLER_CORE",
    "BLUETOOTH_RESET_IDLE_STATUS_0",
    "BTDM_LOW_POWER_CONFIG",
    "BTDM_RUNTIME_CONTROL",
    "BTDM_SCHEDULER_TABLE",
    "BTMAC_BLE_PHY_INIT",
    "BT_V3_2_BASEBAND",
    "BT_V3_2_CTE",
]

[[ownership-partitions]]
name = "BluetoothInterruptPeripherals"
member = "bluetooth_interrupts"
description = "Bluetooth controller interrupt registers transferred independently from task lifecycle ownership to the hard ISR."
peripherals = [
    "BLUETOOTH_INTERRUPT_BANK",
]

[[ownership-partitions]]
name = "SharedRadioPeripherals"
member = "shared_radio"
description = "Protocol-neutral physical register words touched by more than one radio lifecycle and serialized before either protocol receives a narrow capability."
peripherals = [
    "SHARED_RADIO_INIT_CONTROL",
    "SHARED_BASEBAND_RESET_IDLE_STATUS",
    "SHARED_BASEBAND_TX_TIMING",
    "ZBBB_RADIO_CONTROL",
]

[[enum-domains]]
name = "MacInterface"
description = "Reviewed ESP32-S31 Wi-Fi MAC interface selector shared by address, BSSID, crypto, TX and ordinary receive-BlockAck transactions."

[[enum-domains.values]]
name = "Station"
value = 0
description = "Infrastructure-station hardware context; traced from STA callers into interface and key-control fields."
sources = ["BLOB_LIBPP_HAL_MAC_SET_ADDR", "BLOB_LIBPP_HAL_MAC_SET_BSSID", "BLOB_LIBPP_HAL_CRYPTO", "BLOB_LIBPP_HAL_MAC_TX", "BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[enum-domains.values]]
name = "AccessPoint"
value = 1
description = "SoftAP hardware context; traced from AP callers into interface and key-control fields."
sources = ["BLOB_LIBPP_HAL_MAC_SET_ADDR", "BLOB_LIBPP_HAL_MAC_SET_BSSID", "BLOB_LIBPP_HAL_CRYPTO", "BLOB_LIBPP_HAL_MAC_TX", "BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[enum-domains.values]]
name = "Context2"
value = 2
description = "Reviewed third hardware selector accepted by the complete EDCA and RX BlockAck leaves; its protocol-role semantics are not assigned."
sources = ["BLOB_LIBPP_HAL_MAC_TX", "BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[enum-domains.values]]
name = "Context3"
value = 3
description = "Reviewed fourth hardware selector accepted by the complete EDCA and RX BlockAck leaves; its protocol-role semantics are not assigned."
sources = ["BLOB_LIBPP_HAL_MAC_TX", "BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[bounded-domains]]
name = "MacPti"
description = "One reviewed four-bit Wi-Fi packet-traffic-information value. Its scheduling policy remains outside the PAC."
min = 0
max = 15
sources = ["BLOB_LIBPP_HAL_COEX_RUNTIME", "BLOB_LIBPP_HAL_INIT_COEX", "BLOB_LIBPP_HAL_MAC_TX"]

[[bounded-domains]]
name = "MacItwtClearIndex"
description = "Machine-defined five-bit shift index accepted by complete hal_clr_itwt_pti. The protocol meaning of individual request bits remains unknown."
min = 0
max = 31
sources = ["BLOB_LIBPP_HAL_COEX_RUNTIME"]

[[enum-domains]]
name = "MacRxBeaconClearRequest"
description = "Reviewed receive-beacon clear requests. The type cannot select an unknown request bit."

[[enum-domains.values]]
name = "Beacon"
value = 0
description = "The bit-zero receive-beacon clear request traced from hal_clear_rx_beacon_pti."
sources = ["BLOB_LIBPP_HAL_COEX_RUNTIME"]

[[bounded-domains]]
name = "MacTxQueueIndex"
description = "One of the four ordinary Wi-Fi transmit queues accepted by complete hal_set_tx_pti."
min = 0
max = 3
sources = ["BLOB_LIBPP_HAL_COEX_RUNTIME", "BLOB_LIBPP_HAL_MAC_TX"]

[[bounded-domains]]
name = "MacTxPtiCount"
description = "Twelve-bit descriptor metadata count published by complete hal_set_tx_pti."
min = 0
max = 0x0fff
sources = ["BLOB_LIBPP_HAL_COEX_RUNTIME", "BLOB_LIBPP_HAL_MAC_TX"]

[[bounded-domains]]
name = "MacKeyEntryIndex"
description = "One of the twenty-five hardware crypto-table entries accepted by the reviewed MAC key transactions."
min = 0
max = 24
sources = ["BLOB_LIBPP_HAL_CRYPTO"]

[[bounded-domains]]
name = "MacRxBlockAckEntryIndex"
description = "One of the eight reverse-addressed ordinary receive BlockAck hardware banks."
min = 0
max = 7
sources = ["BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[bounded-domains]]
name = "MacExtraSoftApRxBlockAckEntryIndex"
description = "One of the eight extra-SoftAP receive BlockAck entries selected through the shared staging window."
min = 0
max = 7
sources = ["BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[bounded-domains]]
name = "MacRxBlockAckTid"
description = "Four-bit traffic identifier encoded by the reviewed receive BlockAck transaction."
min = 0
max = 15
sources = ["BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[bounded-domains]]
name = "MacRxBlockAckStartingSequence"
description = "Twelve-bit starting sequence encoded by the reviewed receive BlockAck transaction."
min = 0
max = 0x0fff
sources = ["BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[bounded-domains]]
name = "MacRxBlockAckWindow"
description = "Non-zero seven-bit receive BlockAck window accepted by the reviewed transaction."
min = 1
max = 0x7f
sources = ["BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"]

[[bounded-domains]]
name = "CoexTimerClientValue"
description = "Two-bit coexistence client selector published by complete coex_hw_timer_set."
min = 0
max = 3
sources = ["BLOB_LIBCOEX_HW_TIMER"]

[[bounded-domains]]
name = "CoexTimerPtiValue"
description = "Four-bit coexistence priority value published by complete coex_hw_timer_set."
min = 0
max = 15
sources = ["BLOB_LIBCOEX_HW_TIMER"]

[[bounded-domains]]
name = "CoexTimerTickImage"
description = "Twenty-four-bit converted coexistence timer target image."
min = 0
max = 0x00ff_ffff
sources = ["BLOB_LIBCOEX_HW_TIMER"]

[[flag-domains]]
name = "MacInterruptMask"
description = "Reviewed writable images for the MAC interrupt-enable register."

[[flag-domains.values]]
name = "NONE"
value = 0x00000000
description = "Keep every MAC interrupt source disabled."
sources = ["BLOB_LIBPP_HAL_ENABLE_MAC"]

[[flag-domains.values]]
name = "COLD_RX"
value = 0x19a879e0
description = "Complete mask published by the qualified cold receive initializer."
sources = ["BLOB_LIBPP_HAL_INIT_TAIL"]

