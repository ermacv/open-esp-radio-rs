name: "Tracking"
description: "Compose a selected result from independently accepted tasks."
labels: ["kind:tracking"]
body:
  - type: markdown
    attributes:
      value: "Name one accepted result. Follow [issue management](https://github.com/ermacv/open-esp-radio-rs/blob/main/docs/issues.md). Triage assigns area and priority; dropdowns do not apply labels. Research and implementation do not establish hardware readiness."
  - type: textarea
    id: result
    attributes:
      label: "Integrated result"
      description: "A bounded product or engineering outcome and the owner who accepts it."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Primary area"
      description: "The owner of the result; triage applies its area label."
      options: ["Wi-Fi","Bluetooth","IEEE 802.15.4","Shared radio","Registers / PAC","Platform","Tooling","HIL","Qualification"]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Owner and scope"
      description: "Name defining paths, canonical package.metadata.open-radio.layer, target/revision/profile and exclusions."
      placeholder: "Owner paths:\nLayer (package.metadata.open-radio.layer):\nTarget / revision / profile:\nOut of scope:"
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: "Required results"
      description: "Link existing children and required deliverables; add native sub-issues. Split by owner, readiness and acceptance instead of creating speculative future stages."
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: "Integration acceptance"
      description: "What must work together before this parent can close, including applicable validation. Optional follow-ups must be explicit."
    validations:
      required: true
  - type: textarea
    id: relations
    attributes:
      label: "Relations and activation"
      description: "Parent, blockers with the exact required artifact, related work, and any future activation trigger."
      placeholder: "Part of:\nBlocked by (artifact and consuming step):\nRelated:\nActivation trigger:"
    validations:
      required: false
