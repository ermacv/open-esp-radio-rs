name: Claude architectural review

# The controller always comes from the trusted default branch. PR source
# is read through GitHub APIs and is never checked out or executed with secrets.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review again
        required: false
        type: string
      verify_auth:
        description: Verify OIDC and a minimal Claude API request without reviewing a PR
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read
  statuses: write
  id-token: write

env:
  CARGO_NET_OFFLINE: 'false'

jobs:
  verify-auth:
    if: >-
      github.repository == 'ermacv/open-esp-radio-rs' &&
      github.event_name == 'workflow_dispatch' && inputs.verify_auth
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify federated authentication and API billing
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/claude_review.py verify-auth
  targets:
    if: >-
      github.repository == 'ermacv/open-esp-radio-rs' &&
      !(github.event_name == 'workflow_dispatch' && inputs.verify_auth) &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.state == 'open' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main'))
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pull_requests: ${{ steps.targets.outputs.pull_requests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve PR numbers without Claude access
        id: targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/claude_review.py targets
  review:
    needs: targets
    if: needs.targets.outputs.pull_requests != '[]'
    strategy:
      fail-fast: false
      matrix:
        pull_request: ${{ fromJSON(needs.targets.outputs.pull_requests) }}
    concurrency:
      group: claude-review-pr-${{ matrix.pull_request }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Review immutable source snapshots and publish a new report comment
        env:
          REVIEW_PULL_REQUEST: ${{ matrix.pull_request }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/claude_review.py run
