[package]
name = "oer-verification-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo verification`: vendor pins fetched, vendor diffs, provenance, typed scenarios, evidence shards, comparison probes and host stands"

[[bin]]
name = "verification"
path = "src/main.rs"

[dependencies]
oer-command-tree = { path = "../../tools/command-tree", features = ["clap"] }
oer-process = { path = "../../tools/process" }
oer-repo = { path = "../../tools/repo" }
oer-toolchain = { path = "../../tools/toolchain" }
oer-vendor-artifacts = { path = "../../tools/vendor-artifacts" }
oer-vendor-evidence = { path = "../evidence", features = ["producers"] }
oer-vendor-provenance = { path = "../../tools/vendor-provenance" }
clap = { version = "=4.5.48", features = ["derive"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "verification"
evidence = "report"
platform = "host"
host-layer = "entry"
