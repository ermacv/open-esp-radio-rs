[package]
name = "oer-espressif-staged-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Stage-two entry, relocation, per-hart interrupt stacks and panic record of the Espressif staged boot"

[features]
# The chip of esp-hal; an image selects exactly one.
esp32s31 = ["esp-hal/esp32s31", "oer-espressif-interrupt-table-esp-hal/esp32s31"]
esp32c5 = ["esp-hal/esp32c5", "oer-espressif-interrupt-table-esp-hal/esp32c5"]
# A second hart: its SRAM interrupt stack (the chip layout's `harts` is 2).
two-harts = []
# The second hart's PSRAM task stack and thread-mode entry.
multicore = ["two-harts"]
## After the record, call the image's `oer_platform_panic_hook`, which
## records more of its state without formatting, then reset.
panic-hook = []

[dependencies]
oer-espressif-staged-layout.workspace = true
esp-hal = { workspace = true, features = ["static-interrupts", "rt", "unstable"] }
oer-interrupt-table = { path = "../../../crates/runtime/interrupt-table" }
oer-espressif-interrupt-table-esp-hal.workspace = true

[package.metadata.open-radio]
layer = "platform"
platform = "family"
family = "espressif"

[lints]
workspace = true
