schema = 2

[[peripherals]]
name = "WIFI_MAC_COLD_HANDSHAKE"
description = "Cold MAC initialization request/ready handshake and the adjacent two WDEV timer targets recovered from complete ROM leaves."
baseAddress = 0x20104DE0

[[peripherals.registers]]

[peripherals.registers.register]
name = "CONTROL"
description = "Software sets REQUEST with a fresh-read RMW, then polls READY before touching the remaining MAC state."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "READY"
description = "Polled until asserted after REQUEST."
bitOffset = 0
bitWidth = 1
access = "read-only"

[[peripherals.registers.register.fields]]
name = "REQUEST"
description = "Set before the READY polling loop."
bitOffset = 1
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "UNKNOWN"
bitOffset = 2
bitWidth = 30

[[peripherals.registers]]

[peripherals.registers.register]
name = "WDEV_TIMER_TARGET_0_CONTROL"
description = "hal_wdev_timer_target_enable selects timer zero with argument zero and replaces enable bit zero."
addressOffset = 0x10
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ENABLE"
bitOffset = 0
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "WDEV_TIMER_TARGET_0_VALUE"
description = "hal_wdev_timer_set_target selects timer zero with argument zero and writes the supplied 32-bit target."
addressOffset = 0x14
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "WDEV_TIMER_TARGET_1_CONTROL"
description = "hal_wdev_timer_target_enable selects timer one with argument one and replaces enable bit zero."
addressOffset = 0x18
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ENABLE"
bitOffset = 0
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "WDEV_TIMER_TARGET_1_VALUE"
description = "hal_wdev_timer_set_target selects timer one with argument one and writes the supplied 32-bit target."
addressOffset = 0x1C
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 32

