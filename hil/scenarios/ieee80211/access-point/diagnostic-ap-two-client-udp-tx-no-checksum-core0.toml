schema = 5
id = "diagnostic-ap-two-client-udp-tx-no-checksum-core0"
description = "Two-client AP UDP TX software checksum-cost coarse diagnostic"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "tx", "checksum", "core0", "coarse"]

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.datapath]
tx_udp_checksum = "omit-ipv4-diagnostic"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 150
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 65000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
minimum_bps_per_flow = 1
maximum_flow_skew_percent = 100
