schema = 5
case-execution = "stateful"
transaction-comparison = "observables-under-effect-contract"

# The linked vendor body obtains five inputs through globals/providers rather
# than its unused C ABI. Each case seeds that linked state and passes the same
# projected values to compiled Rust. Setup executes the real vendor
# registration function once in the same session; the discovered store remains
# evidence of a possible initializer, not an assertion that it already ran.
[[profiles]]
name = "ble-phy-register-init-ordered-mmio"
claim = "reviewed-domain-equivalence"
precondition = "post-common-phy-baseband-coexistence-controller-stack-callback-and-scheduler-registration-with-two-correlated-linked-input-images"
vendor-source = "ble-controller"
vendor-symbol = "r_sym_ble_3472b6bNiQdnWkYo6Ggv"
rust-symbol = "open_ble_phy_register_init_trace_r_sym_ble_3472b6b_ni_qdn_wk_yo6_ggv"
compare-return = false

[[profiles.vendor-setup]]
name = "install-external-baseband-table"
symbol = "esp_ble_register_bb_funcs"
max-steps = 128

[[profiles.argument-values]]
index = 0
values = [0, 0xa5]

