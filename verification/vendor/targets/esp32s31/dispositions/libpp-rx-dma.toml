# The complete vendor root also mutates private descriptor/list state, enters
# the g_osi critical section, spins on the reload bit and maintains optional
# diagnostics/statistics. The adapter qualifies the source-owned Rust ring and
# staging transaction instead of importing those C runtime responsibilities.
[[functions]]
source = "libpp"
symbol = "hal_mac_rx_set_dscr_reload"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac::mac_rx_dma::request_descriptor_reload"
binding = "v1"
rust-binding = "exact-production-entry"
rust-probe = "open_libpp_rx_trace_hal_mac_rx_set_dscr_reload"
effect-contract = "exact-effects-v1"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x20104080 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x20104080 }
disposition = { kind = "required" }

[[functions]]
source = "libpp"
symbol = "wDev_AppendRxBlocks"
disposition = "bounded-feature"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_wifi_mac::rx_pool::RxStagePool::stage_dma_unit_recycle_bounded"
binding = "v1"
rust-binding = "shared-production-core"
rust-probe = "open_libpp_rx_trace_wdev_append_rx_blocks"
driver-adapter = "esp32s31-wdev-append-rx-blocks-v1"
effect-contract = "exact-effects-v1"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x20104080 }
disposition = { kind = "replaced-by-async", value = { condition = "rx-descriptor-reload-clear", timeout = { kind = "attempts", value = 0x186a1 } } }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x20104080 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x20104088 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010408c }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x20104084 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "state-write", width = 32, field = "rx-ring.old-tail-next" }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "state-write", width = 32, field = "rx-ring.pending-tail" }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "state-write", width = 32, field = "rx-ring.accepted-tail" }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "platform-call", operation = "critical-section" }
disposition = { kind = "platform-provided-service", value = { service = "embassy-rx-ring-ownership" } }
[[functions.effects]]
selector = { kind = "platform-call", operation = "debug-diagnostic" }
disposition = { kind = "allowed-omission", value = "unused-instrumentation" }
[[functions.effects]]
selector = { kind = "platform-provided-service", service = "embassy-rx-ring-ownership" }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "initialization-prerequisite", prerequisite = "valid-zero-terminated-rx-chain" }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "initialization-prerequisite", prerequisite = "unique-rx-descriptor-storage" }
disposition = { kind = "required" }
