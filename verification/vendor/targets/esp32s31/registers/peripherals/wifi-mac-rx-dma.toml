schema = 2

[[peripherals]]
name = "WIFI_MAC_RX_DMA"
description = """
Descriptor-walker registers
        recovered from complete rev0 ROM leaves and qualified with the open
        driver's rotating 32-entry RX ring."""
baseAddress = 0x20104000

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_COLD_CONTROL_UNKNOWN"
description = "Complete mac_rxbuf_init clears the low byte immediately before publishing the descriptor base. Individual bit meanings are unknown."
addressOffset = 0x7C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "COLD_LOW_UNKNOWN"
bitOffset = 0
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_CONTROL"
description = "RX descriptor-walker gate, hardware-beacon reload selection and live-list append doorbell."
addressOffset = 0x80
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "APPEND_DESCRIPTOR_RELOAD"
description = "Write one after publishing old_tail.next to make a prepared live-list append visible. Hardware clears the bit after accepting the append."
bitOffset = 0
bitWidth = 1
modifiedWriteValues = "clear"

[[peripherals.registers.register.fields]]
name = "WALKER_ENABLE"
description = "Set by hal_mac_rx_enable and cleared by hal_mac_rx_disable; gates the RX descriptor walker."
bitOffset = 31
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "HARDWARE_BEACON_RELOAD_UNKNOWN"
description = "Complete hal_mac_set_rxbuf_reload_use_hw_beacon_enable sets bit 27 through one fresh-read RMW."
bitOffset = 27
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_DESCRIPTOR_BASE"
description = "Complete first-descriptor address. The ROM and blob leaves publish the unmasked 32-bit pointer when installing a cold or repaired frontier; the selected high-address window separately completes the hardware last/next descriptor observations."
addressOffset = 0x84
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ADDRESS"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_NEXT_DESCRIPTOR"
description = "Low 20 bits of the hardware current/next descriptor. ROM interprets zero after reload completion as a terminal frontier and may repair RX_DESCRIPTOR_BASE."
addressOffset = 0x88
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "ADDRESS_LOW"
bitOffset = 0
bitWidth = 20

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_LAST_DESCRIPTOR"
description = "Low 20 bits of the last descriptor accepted by the RX walker."
addressOffset = 0x8C
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "ADDRESS_LOW"
bitOffset = 0
bitWidth = 20

[[peripherals.registers]]

[peripherals.registers.register]
name = "CSI_DUMP_CONFIG"
description = "Complete esp_test_get_csi_dump_cfg reads every described field at 0x2010411c. Complete esp_test_set_csi_dump_cfg performs independent fresh-read RMW updates. Its BEAMFORMED update has a pinned vendor quirk: cfg[8] controls whether bit 11 is updated, but cfg[1] (MU) supplies the value. This SVD exposes the physical bit and does not reproduce that software bug."
addressOffset = 0x11C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "FORCE_LLTF"
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "MU"
bitOffset = 1
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SU"
bitOffset = 2
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "VHT"
bitOffset = 3
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "HT40"
bitOffset = 4
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "HT20"
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "LEGACY"
bitOffset = 6
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "STBC_MODE"
bitOffset = 9
bitWidth = 2

[[peripherals.registers.register.fields]]
name = "BEAMFORMED"
description = "Physical CSI-dump beamformed selector. The pinned vendor setter accidentally writes the MU argument when this field is selected; callers of the generated PAC write the actual bit directly."
bitOffset = 11
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "STANDALONE"
bitOffset = 12
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "DCM"
bitOffset = 13
bitWidth = 1

