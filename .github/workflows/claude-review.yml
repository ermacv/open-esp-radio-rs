name: Claude review

# Reviews a ready same-repository PR into main once, when it opens or becomes
# ready, in parallel with CI, and again on an "@claude review" PR comment: the
# blocking review of every push is the local one (`cargo xtask review`), and
# this one audits it within the API budget. Every event runs this file from
# main, which the Anthropic federation rule requires. Through the Claude Agent
# SDK (.github/scripts/claude_review.py), Claude reads the PR head in pr/ with
# read-only tools and a read-only token, following REVIEW.md; a separate job
# publishes the review, files an issue for each finding and sets the
# informational claude-runtime-review status. It never blocks a merge.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

env:
  CARGO_NET_OFFLINE: 'false'

jobs:
  target:
    if: >-
      github.repository == 'ermacv/open-esp-radio-rs' &&
      (github.event_name == 'pull_request_target' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      head: ${{ steps.pr.outputs.head }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - name: Find the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT: ${{ github.event_name }}
        run: |
          pr=$(gh api "repos/$GH_REPO/pulls/$NUMBER")
          # A requested review also covers a merged PR: the review runs in
          # parallel with CI, so a failed one may be noticed after the merge.
          pr=$(jq -c --arg repo "$GH_REPO" --arg event "$EVENT" 'select(. != null
            and (.state == "open" or (.merged_at != null and $event == "issue_comment"))
            and (.draft | not) and .base.ref == "main" and .head.repo.full_name == $repo)' <<<"${pr:-null}")
          if [ -z "$pr" ]; then
            echo "No open (or, on request, merged) ready same-repository PR into main; nothing to review."
            exit 0
          fi
          echo "pr=$(jq .number <<<"$pr")" >>"$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.sha <<<"$pr")" >>"$GITHUB_OUTPUT"
          echo "branch=$(jq -r .head.ref <<<"$pr")" >>"$GITHUB_OUTPUT"

  review:
    needs: target
    if: needs.target.outputs.pr
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: claude-review-${{ needs.target.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      result: ${{ steps.claude.outputs.result }}
    steps:
      # Trusted main at the workspace root; the PR head is only read, in pr/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.head }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      # The Agent SDK, not claude-code-action: the plan's monthly API
      # credits cover the SDK but not Claude Code GitHub Actions.
      - name: Install the Claude Agent SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/review"
          "$RUNNER_TEMP/review/bin/pip" install --quiet --only-binary=:all: claude-agent-sdk==0.2.160
      - id: claude
        name: Review with read-only tools
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ needs.target.outputs.pr }}
          REVIEW_HEAD: ${{ needs.target.outputs.head }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5-5' }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: '"$RUNNER_TEMP/review/bin/python" .github/scripts/claude_review.py'

  publish:
    needs: [target, review]
    if: always() && needs.target.outputs.pr
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      # Trusted main: the issue-label policy files the findings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Post the review, file its findings and set claude-runtime-review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.target.outputs.pr }}
          HEAD: ${{ needs.target.outputs.head }}
          BRANCH: ${{ needs.target.outputs.branch }}
          OUTCOME: ${{ needs.review.result }}
          RESULT: ${{ needs.review.outputs.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status() {
            gh api "repos/$GH_REPO/statuses/$HEAD" -f context=claude-runtime-review \
              -f state="$1" -f description="$2" -f target_url="$RUN" >/dev/null
          }
          # failed DESCRIPTION: the review's findings reach no session, so
          # besides the status, which only an open PR's head shows, file a
          # `review: …` issue naming the branch that `cargo xtask ci-status`
          # lists even after the merge.
          failed() {
            status error "$1"
            gh issue create --title "review: Claude review of #$PR did not complete" \
              --label kind:bug --label area:tooling --label priority:P1 \
              --body "$(printf '%s\n\nThe Claude review of #%s at `%s` ([run](%s)) failed: %s. Its findings reached no session. Comment `@claude review` on #%s (a merged PR too) to review it again, then close this issue.\n\n<!-- claude-review-branch: %s -->' \
                "The review of a pull request did not record its findings." "$PR" "$HEAD" "$RUN" "$1" "$PR" "$BRANCH")" \
              >/dev/null || echo "::warning::The failure issue was not filed either"
            exit 1
          }
          # A newer review of this PR cancelled this one and sets the status.
          if [ "$OUTCOME" = cancelled ]; then exit 0; fi
          if [ "$OUTCOME" != success ] || [ -z "$RESULT" ]; then
            failed "Review did not complete ($OUTCOME); no verdict"
          fi
          # body DETAILS: the review body, listing each finding with its text
          # when DETAILS is true (inline comments carry it otherwise).
          body() {
            jq -r --argjson details "$1" --arg url "https://github.com/$GH_REPO/blob/$HEAD" \
              --arg head "$HEAD" --arg run "$RUN" '
              def mark: {important: "🔴", nit: "🟡", "pre-existing": "🟣"}[.severity];
              ["## Claude review", "", .summary, ""]
              + [.findings[] | "- \(mark) **\(.title)**: [`\(.path):\(.line)`](\($url)/\(.path)#L\(.line))"
                  + if $details then "\n\n  \(.body | gsub("\n"; "\n  "))\n" else "" end]
              + ["", "Head `\($head)` · [run](\($run))"] | join("\n")' <<<"$RESULT"
          }
          comments=$(jq -c '[.findings[] | {path, line, side: "RIGHT",
            body: ({important: "🔴", nit: "🟡", "pre-existing": "🟣"}[.severity] + " **\(.title)**\n\n\(.body)")}]' <<<"$RESULT")
          review() {
            jq -n --arg body "$1" --arg sha "$HEAD" --argjson comments "$2" \
              '{commit_id: $sha, event: "COMMENT", body: $body, comments: $comments}' |
              gh api "repos/$GH_REPO/pulls/$PR/reviews" --input - >/dev/null
          }
          # GitHub rejects the whole review when a finding's line is outside
          # the diff; then the body carries every finding in full.
          review "$(body false)" "$comments" || review "$(body true)" '[]'
          # No finding blocks: each is filed as an issue once, naming the
          # branch, and the PR names the issues.
          if ! recorded=$(PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/review_findings.py); then
            failed "Findings were not recorded as issues"
          fi
          if [ -n "$recorded" ]; then
            jq -n --arg body "$(printf 'Findings, filed as issues; the session on this branch fixes them next:\n\n%s' "$recorded")" '{body: $body}' |
              gh api "repos/$GH_REPO/issues/$PR/comments" --input - >/dev/null
          fi
          count=$(jq '.findings | length' <<<"$RESULT")
          status success "$count finding(s) filed as issues; not blocking"
