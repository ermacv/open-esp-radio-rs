schema = 5
id = "diagnostic-ap-rx40-tx45-core0-coarse"
description = "Temporary AP 40 Mbit/s uplink and 45 Mbit/s downlink Core0 phase control"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "ht40", "bidirectional", "core0"]

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 40000000, tx_bps = 45000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
