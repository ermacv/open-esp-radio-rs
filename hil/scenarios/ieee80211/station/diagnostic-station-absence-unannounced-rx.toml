schema = 5
id = "diagnostic-station-absence-unannounced-rx"
description = "10 ms synthetic physical absence with unannounced AP notification during RX UDP delivery"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { rx_bps = 65000000 }

[wifi.workload.maintenance]
operation = { synthetic = { duration_micros = 10000, notify_ap = false } }

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 10000000
