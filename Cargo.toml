[workspace]
members = [
    "hil/protocol",
    "driver/common/dma",
    "driver/common/network",
    "driver/radio",
    "driver/adapters/embassy-net",
    "driver/adapters/embassy-net-compat",
    "driver/adapters/embassy/wifi",
    "driver/adapters/embassy/esp32s31-bluetooth",
    "driver/adapters/embassy/esp32s31-coex",
    "driver/adapters/embassy/esp32s31-ieee802154",
    "driver/adapters/embassy/esp32s31-platform",
    "driver/adapters/embassy/esp32s31-wifi",
    "driver/adapters/embassy/esp32s31-wifi-compat",
    "driver/adapters/esp-hal/esp32s31-radio-platform",
    "driver/adapters/esp-hal/esp32s31-ieee802154",
    "driver/adapters/esp-hal/esp32s31-wifi",
    "driver/bluetooth/hci",
    "driver/bluetooth/ll",
    "driver/ieee802154",
    "driver/wifi/ap",
    "driver/wifi/sta",
    "driver/wifi/ieee80211",
    "driver/wifi/softmac",
    "driver/wifi/wpa2",
    "driver/chips/esp32s31/hal",
    "driver/chips/esp32s31/bluetooth",
    "driver/chips/esp32s31/bluetooth/memory",
    "driver/chips/esp32s31/coex",
    "driver/chips/esp32s31/wifi",
    "driver/chips/esp32s31/wifi/dma",
    "driver/chips/esp32s31/ieee802154/dma",
    "driver/chips/esp32s31/ieee802154/irq",
    "driver/chips/esp32s31/ieee802154/mac",
    "driver/chips/esp32s31/ieee802154/runtime",
    "driver/chips/esp32s31/wifi/mac",
    "driver/chips/esp32s31/wifi/ap",
    "driver/chips/esp32s31/wifi/sta",
    "driver/chips/esp32s31/phy",
    "driver/chips/esp32s31/pac-raw",
    "driver/chips/esp32s31/pac",
    "driver/chips/esp32s31/platform-pac",
    "driver/integration/esp32s31/bluetooth",
    "hil/host/runner",
    "tools/qualification-check",
    "tools/memory-report",
    "tools/blobray/crates/register-model",
    "tools/blobray",
    "tools/blobray/crates/backend-riscv",
    "tools/blobray/crates/contracts",
    "tools/blobray/crates/review-model",
    "tools/blobray/crates/execution-model",
    "verification/vendor/chips/esp32s31/blobray-provider/contracts",
    "verification/vendor/chips/esp32s31/blobray-provider/knowledge",
    "verification/vendor/targets/esp32s31/blobray-provider/contracts",
    "verification/vendor/targets/esp32s31/blobray-provider/knowledge",
    "tools/blobray/crates/analysis-model",
    "tools/blobray/crates/semantics",
    "tools/blobray/addons/c",
    "tools/blobray/addons/esp-idf",
    "verification/vendor/targets/esp32s31/blobray-host",
]
exclude = [
    "driver/integration/esp32s31/embassy-wifi",
    "examples/esp32s31-station",
    "hil/targets/esp32s31",
    "verification/vendor/targets/esp32s31/probes",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
# Driver protocol state must advance identically in debug and release builds.
debug_assert_with_mut_call = "deny"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# Host-side binary analysis is prohibitively slow at dev opt-level 0. Keep a
# separate incremental profile for the normal blobray aliases so firmware
# development and unit tests retain their ordinary dev/release behavior.
[profile.blobray]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

# The ESP32-S31 async-platform branch uses register accessor fixes that are
# still carried by the matching PAC fork.
[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "85d2b4ddde2072c9b2c2f27046893c1ba8679aae" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
