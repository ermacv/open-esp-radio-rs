[[items]]
id = "ieee802154-cca-and-channel-access-cca-before-tx"
section = "ieee802154-cca-and-channel-access"
title = "CCA-before-TX"
status = "partial"
level = "composed-product"
scope-and-limitations = "The engine issues the CCA-then-TX command and reports CCA busy or failure. The portable contract sets the CCA energy threshold and mode, and the OpenThread adapter applies OpenThread's threshold as the port does. CCA before transmission is not qualified on air."

[[items]]
id = "ieee802154-cca-and-channel-access-csma-ca"
section = "ieee802154-cca-and-channel-access"
title = "CSMA/CA"
status = "partial"
level = "composed-product"
scope-and-limitations = "Unslotted CSMA/CA as ESP-IDF's OpenThread SubMac runs it over the one-CCA radio: the [portable backoff](../../../../protocols/ieee802154/src/mac/csma.rs), the radio role's CCA attempts with receive on the transmit channel during backoffs, and backoff timers in the runtime's event wait. Frames are [retransmitted](../../../../protocols/ieee802154/src/mac/retransmission.rs) as SubMac retries them with ESP-IDF's OpenThread defaults, a random growing delay before each retry after a missing acknowledgement, each attempt arming its transmit security again. Slotted CSMA/CA, re-securing retransmitted frames that carry header IEs and on-air qualification are absent."

[[items]]
id = "ieee802154-cca-and-channel-access-active-scan"
section = "ieee802154-cca-and-channel-access"
title = "Active Scan"
status = "host-only"
level = "composed-product"
scope-and-limitations = "The upper MAC owns the beacon-request and beacon-collection procedure, as with ESP-IDF, whose IEEE 802.15.4 driver has no scan: OpenThread's Mac runs it over the radio's transmit, receive and channel switching, and the repository's openthread fork exposes it as `OpenThread::scan` (`otLinkActiveScan`). The radio itself only serves energy scans. Active scan is not exercised by a host test or on air."

