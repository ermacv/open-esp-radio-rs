schema = 5
id = "diagnostic-ap-two-client-udp-tx-architecture-control"
description = "Direct-SRAM same-image control for invasive two-client TX architecture probes"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "tx", "architecture", "control"]

[wifi]
image = "diagnostic-tx-architecture"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 150
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 65000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
minimum_bps_per_flow = 1
maximum_flow_skew_percent = 100
