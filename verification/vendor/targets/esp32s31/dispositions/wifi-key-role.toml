schema = 2
# Narrow AP/STA key connection-context conformance. Complete vendor/PAC
# transactions intentionally differ because the closed PAC adds occupancy
# checks and zeroization; the adapter proves only the reviewed two-bit field.
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "wifi-key-role"
symbol = "wDev_Insert_KeyEntry"
disposition = "bounded-feature"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_wifi_mac::crypto::KeyConnectionContext"
binding = "v1"
rust-binding = "shared-production-core"
rust-probe = "open_wifi_key_role_trace_wdev_insert_key_entry"
driver-adapter = "esp32s31-wifi-key-role-v1"
effect-contract = "exact-effects-v1"

[[functions.effects]]
selector = { kind = "state-write", width = 8, field = "wifi-key-entry.connection-context" }
disposition = { kind = "required" }
