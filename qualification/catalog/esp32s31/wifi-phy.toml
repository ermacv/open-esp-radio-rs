[[items]]
id = "wifi-802-11ax-he-txop-duration-rts-threshold"
section = "wifi-802-11ax-he"
title = "TXOP-duration RTS threshold"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "A finite peer threshold is parsed and retained in the STA TX-protection policy. A missing HE duration or an exchange requiring RTS is rejected before sequence, PN or DMA publication rather than treated as disabled or as a generic byte threshold; the protected physical image remains unproven."
source-paths = []

[[items]]
id = "wifi-802-11ax-he-uora"
section = "wifi-802-11ax-he"
title = "UORA"
status = "absent"
level = "composed-product"
scope-and-limitations = "Cold initialization writes the recovered 7/31 contention-window defaults, and portable Trigger parsing can recognize random-access RU fields. Neither is a UORA owner: there is no OBO/backoff, RU eligibility, attempt/result state machine or UL-OFDMA random-access publication path."
