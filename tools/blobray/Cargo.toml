[package]
name = "blobray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "blobray-generic"
description = "Project-oriented analysis, reconstruction, publication and Rust conformance verification for compiled vendor binaries"

[[bin]]
name = "blobray-generic"
path = "src/main.rs"

[[bin]]
name = "blobray-run"
path = "src/bin/blobray-run.rs"

[dependencies]
tempfile = "=3.27.0"
cargo_metadata = "=0.23.1"
clap = { version = "=4.5.48", features = ["derive"] }
clap_complete = "=4.5.58"
clap_mangen = "=0.2.30"
crossterm = "=0.29.0"
flate2 = "=1.1.9"
indicatif = { version = "=0.18.6", default-features = false, features = ["unicode-width"] }
miette = { version = "=7.6.0", features = ["fancy"] }
open-radio-vendor-backend-riscv = { path = "crates/backend-riscv" }
open-radio-vendor-execution-model = { path = "crates/execution-model" }
open-esp-radio-register-model = { path = "../registers/model" }
open-radio-vendor-analysis-model = { path = "crates/analysis-model" }
open-radio-vendor-contracts = { path = "crates/contracts" }
open-radio-vendor-review = { path = "../registers/review" }
open-radio-vendor-semantics = { path = "crates/semantics" }
petgraph = { version = "=0.8.3", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "unbounded_depth"] }
serde_stacker = "=0.1.14"
svd-parser = "=0.14.9"
svd-rs = { version = "=0.14.12", features = ["serde"] }
svd2rust = { version = "=0.37.1", default-features = false }
syn = { version = "=2.0.119", features = ["full"] }
tabled = { version = "=0.21.0", default-features = false, features = ["std"] }
toml_edit = { version = "=0.25.13", features = ["serde"] }
thiserror = "=2.0.19"
tracing = "=0.1.44"
tracing-indicatif = "=0.3.14"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
signal-hook = "=0.3.18"
nix = { version = "=0.26.4", default-features = false, features = ["fs", "inotify"] }

[lints]
workspace = true

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }

[package.metadata.open-radio]
scope = "development"
layer = "tool"
platform = "host"

# Blobray is a separate host-tool workspace with its own lockfile and target
# directory, so its dependencies never change the radio workspace lockfile.
[workspace]
members = [
    ".",
    "addons/c",
    "addons/esp-idf",
    "crates/analysis",
    "crates/analysis-model",
    "crates/application",
    "crates/artifacts",
    "crates/backend-riscv",
    "crates/contracts",
    "crates/domain",
    "crates/execution-model",
    "crates/knowledge",
    "crates/riscv",
    "crates/semantics",
    "crates/store",
    "crates/verification",
    "next",
    "../../verification/vendor/chips/esp32s31/blobray-provider/contracts",
    "../../verification/vendor/chips/esp32s31/blobray-provider/knowledge",
    "../../verification/vendor/chips/esp32s31/blobray-provider/models",
    "../../verification/vendor/projects/esp32s31/blobray-provider/contracts",
    "../../verification/vendor/projects/esp32s31/blobray-provider/knowledge",
    "../../verification/vendor/projects/esp32s31/blobray-provider/models",
    "../../verification/vendor/projects/esp32s31/scenarios",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
debug_assert_with_mut_call = "deny"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# Host-side binary analysis is prohibitively slow at dev opt-level 0. Keep a
# separate incremental profile for the normal blobray aliases so unit tests
# retain their ordinary dev/release behavior.
[profile.blobray]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16
