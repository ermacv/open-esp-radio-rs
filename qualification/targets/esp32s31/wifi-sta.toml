# Qualification v3 declares claims and blockers; every proof status is derived.
schema = 3
target = "esp32s31-wifi-sta"
required-capabilities = [
  "cold-registration",
  "rf-bb-initialization",
  "channel-selection-switch",
  "rx-tx-dma",
  "interrupt-recovery",
  "authentication-association",
  "wpa2",
  "async-deadlines",
  "radio-cold-start",
  "timeout-error-recovery",
]

[verification]
project = "verification/vendor/targets/esp32s31/vendor-project.toml"
evidence-index = "verification/vendor/targets/esp32s31/evidence/vendor-evidence.json"

[hil]
target = "esp32s31"
catalog = "hil/scenarios"
runs = "target/hil/esp32s31/runs"

[[capabilities]]
id = "cold-registration"
title = "Cold PHY registration"
scope = "One cold register_chipv7_phy composition through the typed target port"
depends-on = ["rf-bb-initialization"]
owners = [
  { path = "driver/chips/esp32s31/phy/src/phy_register.rs", token = "PhyRegisterTransition" },
  { path = "driver/chips/esp32s31/phy/src/executor.rs", token = "run_phy_register" },
]
tests = [
  { path = "driver/chips/esp32s31/phy/src/phy_register.rs", token = "stuck_i2c_reset_fails_only_after_bounded_async_samples_and_cleans_up" },
]
async-contracts = [
  { path = "driver/chips/esp32s31/phy/src/phy_register.rs", token = "stuck_i2c_reset_fails_only_after_bounded_async_samples_and_cleans_up" },
]
vendor-roots = [
  { source = "archive", symbol = "register_chipv7_phy" },
]
hil-requirements = [
  { scenario = "station-reconnect", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "registration-root-contract-blocked-by-bb-init" },
]

