schema = 5
id = "udp-bidirectional-ht40-split-soak"
description = "Five-minute split-core HT40 full-duplex stability gate"
role = "investigation"
tags = ["udp", "station", "full-duplex", "ht40", "split-core", "soak", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 300
payload_bytes = 1472
offer = { rx_bps = 5000000, tx_bps = 5000000 }

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 4500000
minimum_tx_bps = 4500000
minimum_combined_bps = 9000000
