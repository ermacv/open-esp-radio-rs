[package]
name = "oer-esp32s31-platform-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
multicore = []
## A diagnostic image's panic report: after the record, call the image's
## `oer_platform_panic_diagnostics` instead of resetting.
panic-diagnostics = []

[dependencies]
oer-esp32s31-platform-layout.workspace = true
esp-hal = { workspace = true, features = ["esp32s31", "rt", "unstable"] }
oer-esp32s31-platform-board = { path = "../board" }

[package.metadata.open-radio]
layer = "platform"
platform = "chip"
chip = "esp32s31"

[lints]
workspace = true
