[package]
name = "open-radio-vendor-code-validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Compiled vendor-code analysis, reference generation and Rust behavior validation"

[[bin]]
name = "vendor-code-validator"
path = "src/main.rs"

[dependencies]
open-radio-vendor-backend-riscv = { path = "crates/backend-riscv" }
open-radio-vendor-harness-esp32s31 = { path = "crates/harness-esp32s31" }
open-radio-vendor-harness-esp32s31-semantic = { path = "crates/harness-esp32s31-semantic" }
open-esp-radio-register-model = { path = "../register-model" }
open-radio-vendor-validator-model = { path = "crates/model" }
open-radio-vendor-validator-semantic = { path = "crates/semantic" }
sha2 = "=0.10.9"
serde_json = "=1.0.151"
svd-parser = "=0.14.9"
svd-rs = { version = "=0.14.12", features = ["serde"] }
svd2rust = { version = "=0.37.1", default-features = false }
toml_edit = { version = "=0.25.13", features = ["serde"] }

[lints]
workspace = true
