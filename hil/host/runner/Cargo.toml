[package]
name = "open-esp-radio-hil-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Host build, placement-audit and HIL runner for open ESP radio"
default-run = "open-esp-radio-hil-runner"

[[bin]]
name = "open-radio-bluetooth"
path = "src/fixture/bluetooth/helper.rs"

[[bin]]
name = "open-radio-probe"
path = "src/fixture/probe_load/helper.rs"

[[bin]]
name = "open-radio-fixture-install"
path = "src/fixture_install/main.rs"

[[bin]]
name = "open-radio-net-launcher"
path = "src/fixture_install/network_launcher.rs"

[[bin]]
name = "open-radio-probe-launcher"
path = "src/fixture_install/probe_launcher.rs"

[[bin]]
name = "open-radio-bluetooth-launcher"
path = "src/fixture_install/bluetooth_launcher.rs"

[dependencies]
bt-hci = "=0.10.1"
bt-hci-transport = "=0.1.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
mio = { version = "=1.2.2", features = ["os-poll", "os-ext"] }
oer-process = { path = "../../../tools/process" }
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std"] }
oer-firmware = { path = "../../../tools/firmware" }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
tempfile = "3"
libc = "0.2"
open-esp-radio-hil-protocol = { path = "../../protocol" }
oer-ieee80211 = { path = "../../../crates/protocols/ieee80211/mac" }
open-esp-radio-memory-report = { path = "../../../tools/memory-report" }
serialport = { version = "4.8.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"
zeroize = "1.8.1"
zbus = "=5.19.0"
async-channel = "2.5"
async-io = "2.6"
futures-lite = "2.6"

[dev-dependencies]
oer-bluetooth-hci = { path = "../../../crates/protocols/bluetooth/hci" }
trouble-host = { version = "=0.8.0", git = "https://github.com/ermacv/trouble", rev = "a6af435ba1539cead0afce04718ad8a089bcc4b9", default-features = false, features = ["default-packet-pool", "gatt", "peripheral", "security"] }
bluetooth-example = { package = "open-esp-radio-esp32s31-bluetooth-controller-example", path = "../../../examples/esp32s31-bluetooth-controller", default-features = false, features = ["secure-gatt-application"] }
embassy-futures = "0.1.2"
oer-bluetooth-ll = { path = "../../../crates/protocols/bluetooth/le/ll" }
oer-esp32s31-wifi-ap = { path = "../../../crates/hardware/esp32s31/driver/ieee80211/ap" }
xarxa-owned = { package = "xarxa", git = "https://github.com/ermacv/xarxa.git", rev = "0d41d8e80cb617d355cf6981b6ff76635c44cadc", default-features = false, features = ["std", "alloc", "medium-ethernet", "ipv4", "udp"] }
critical-section = { version = "1.2.0", features = ["std"] }
embassy-net-compat = { package = "embassy-net", version = "0.9.1", default-features = false, features = ["auto-icmp-echo-reply", "std", "medium-ethernet", "proto-ipv4", "dhcpv4", "udp", "tcp"] }
oer-embassy-net-compat = { path = "../../../crates/adapters/embassy-net/compat" }
# Match the target's UDP receive capacity for burst-retention tests.
xarxa = { git = "https://github.com/embassy-rs/xarxa", rev = "14c369bbcbe8ee7167488ac9c9e18be059d83555", default-features = false, features = ["udp-rx-queue-count-16"] }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "c0fdd08e94138105fba8be3133c4ced91afc30fc", features = ["dhcpv4", "medium-ethernet", "tcp-listener", "udp"] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }
embassy-sync = "0.8"
oer-xarxa-upstream = { path = "../../../crates/adapters/xarxa/upstream" }
roxmltree = "0.20"

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "host"
