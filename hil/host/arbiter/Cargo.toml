[package]
name = "oer-hil-arbiter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Host-wide FIFO arbitration, budgets and board journal for the single physical HIL stand"

[dependencies]
fs2 = "0.4"
oer-process = { path = "../../../tools/process" }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "host"
