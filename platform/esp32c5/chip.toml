# The facts of the ESP32-C5 that host tools cannot derive from the chip id.
# Paths follow the id by convention: verification/<id>, registers/<id>,
# hil/targets/<id>, qualification/targets/<id>, target/hil/<id>.
schema = 1
id = "esp32c5"
# The family whose shared code the chip uses (`platform = "family"` packages).
family = "espressif"
rust-target = "riscv32imac-unknown-none-elf"
# The ESP-IDF second-stage bootloader (hil/bootloaders/esp32c5) loads an
# esp-hal application linked with linkall.x.
boot = "esp-idf-bootloader"
espflash-chip = "esp32c5"
revisions = ["rev100"]

# What the chip has: its radio bands, Bluetooth modes, IEEE 802.15.4 and
# cores. Differences of address or layout belong in the register model.
[properties]
# Dual-band: 2.4 GHz and 5 GHz.
wifi-bands = ["2g4", "5g"]
# LE-only controller in the vendor Bluetooth library.
bluetooth = ["le"]
ieee802154 = true
cores = 1

# Where the HIL images lie: the ESP-IDF bootloader at the chip's boot offset,
# the partition table and the factory application, as the catalog bootloader
# build's flasher_args.json places them.
[flash]
bootloader = 0x2000
partition-table = 0x8000
application = 0x10000
# How a written image starts: the writer leaves the ROM in download mode,
# and a power-on reset (RTS without power control) starts the image; an RTS
# reset out of download mode leaves the esp32c5's USB console silent.
start = "power-on"
