schema = 3
id = "station-access-point-ceiling-task-residence"
description = "Production-like Core0 residence under a 130 Mbit/s aggregate same-channel STA+AP bidirectional UDP offer"
image = "diagnostic-task-residence"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["wifi", "sta-ap", "udp", "ceiling", "task-residence", "psram-stack"]

[link]
phy = "ht40"

[workload]
kind = "station-access-point"
timeout_seconds = 30
duration_seconds = 15
direction = "bidirectional"
# Four simultaneous flows share one physical channel: STA RX/TX and AP RX/TX.
# 32.5 Mbit/s per flow is therefore a 130 Mbit/s aggregate offered load.
rate_bps_per_flow = 32500000
minimum_bps_per_flow = 15000000
maximum_fairness_skew_percent = 50
payload_bytes = 1472
