schema = 5
id = "access-point-single-client-ceiling-bidirectional"
description = "Observer-free single-client AP HT40 saturated bidirectional UDP gate"
repetitions = 3
transfer = "identical-image"
tags = ["qualification", "characterization", "wifi", "access-point", "network", "single-client", "ht40", "split-core", "ceiling", "bidirectional"]

[wifi]
image = "performance"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 65000000, tx_bps = 65000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 40000000
minimum_tx_bps = 40000000
minimum_combined_bps = 80000000
