schema = 5
id = "diagnostic-udp-tx-ht40-single-core"
description = "Observer-free HT40 UDP station-to-host ceiling with the radio and IP stack on CPU0 alone"
role = "investigation"
repetitions = 3
tags = ["diagnostic", "performance", "udp", "station", "ht40", "single-core", "ceiling", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "performance"

[wifi.datapath]
placement = "single-core"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 130000000 }

[wifi.workload.criteria]
minimum_tx_bps = 10000000
maximum_idle_channel_utilization_255 = 64
