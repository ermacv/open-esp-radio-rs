schema = 5
id = "diagnostic-ap-rx40-tx40-threshold"
description = "Temporary same-ELF AP balanced duplex threshold control at 40/40 Mbit/s"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "access-point", "udp", "bidirectional", "threshold"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 40000000, tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
