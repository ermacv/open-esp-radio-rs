schema = 5
id = "diagnostic-ap-saturated-plus-sparse-tx-task-residence"
description = "Production-like AP TX service of a two-datagram sparse peer beside one saturated peer"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "tx", "fairness", "sparse", "task-residence", "core0", "core1"]

[wifi]
image = "diagnostic-task-residence"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 150
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 22
payload_bytes = 1472
offer = { tx_bps = 130000000 }

[wifi.workload.traffic.secondary]
tx_bps = 4710
tx_pacing_group_datagrams = 2

[wifi.workload.traffic.criteria]
exact_delivery = true
minimum_tx_bps = 105000000
minimum_bps_per_flow = 1
maximum_secondary_tx_interarrival_ms = 5500
minimum_secondary_tx_datagrams = 8
