name = "BLE_DIAGNOSTIC"
description = "Three independently replaced Bluetooth diagnostic selector images."
addressOffset = 0x10C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ARGUMENT_1"
bitOffset = 13
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "ARGUMENT_3"
bitOffset = 16
bitWidth = 4

[[peripherals.registers.register.fields]]
name = "ARGUMENT_2"
bitOffset = 20
bitWidth = 4

[[peripherals.registers]]

[peripherals.registers.register]
name = "COEX_CONFIG"
description = "Bluetooth baseband coexistence configuration written by bt_bb_coex_config. Only two finite one-bits are assigned."
addressOffset = 0x184
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "CONFIG_FORCE_ONE_18"
bitOffset = 18
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CONFIG_FORCE_ONE_20"
bitOffset = 20
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_DPO_CONTROL"
description = "Bluetooth receive-DPO configuration written by bt_bb_rx_dpo_set. Inner DPO meaning remains unknown."
addressOffset = 0x1C4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "CONFIG_FORCE_ZERO_19"
bitOffset = 19
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CONFIG_VALUE"
description = "bt_bb_rx_dpo_set replaces this field with the finite value 2."
bitOffset = 20
bitWidth = 6

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3F

