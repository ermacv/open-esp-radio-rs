[package]
name = "oer-hil-family-ieee80211-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Wi-Fi HIL fixtures: laptop hostapd and wpa_supplicant, the OpenWrt AP, clients and monitors, air captures and the host route, and their fixture provider"

[dependencies]
oer-durable = { path = "../../../../tools/durable" }
oer-hil-family-ieee80211-evidence = { path = "../ieee80211-evidence" }
oer-hil-fixture = { path = "../../fixture" }
oer-hil-lab = { path = "../../lab" }
oer-hil-net-traffic = { path = "../../net-traffic" }
oer-hil-protocol = { path = "../../../protocol" }
oer-hil-scenario = { path = "../../scenario" }
oer-hil-stand-host = { path = "../../stand-host" }
oer-hil-workload = { path = "../../workload" }
oer-process = { path = "../../../../tools/process" }
oer-toolchain = { path = "../../../../tools/toolchain" }
mio = { version = "=1.2.2", features = ["os-poll", "os-ext"] }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
zeroize = "1.8.1"

[dev-dependencies]
oer-hil-family-ieee80211-evidence = { path = "../ieee80211-evidence", features = ["test-support"] }
oer-hil-run-bundle = { path = "../../run-bundle" }
oer-hil-workload = { path = "../../workload", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "execution"
hil = "orchestration"
