# Bounded HT40 MCS7/SGI A-MPDU projection of the complete vendor
# hal_mac_tx_set_ppdu transaction against the exact compiled production HT
# queue publisher. The two sides intentionally own different RAM layouts:
# vendor PP objects below and semantic CanonicalHtTxParameters on the Rust
# side. Only the PAC derives queue-vector words from the latter.
[[profiles]]
