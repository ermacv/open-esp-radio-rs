[package]
name = "oer-esp32s31-bluetooth-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 Bluetooth LE radio runtime over embassy-time"

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
oer-bluetooth-radio = { path = "../../../protocols/bluetooth/le/radio" }
oer-bluetooth-runtime = { path = "../../bluetooth" }
oer-esp32s31-bluetooth = { path = "../../../hardware/esp32s31/driver/bluetooth" }
oer-esp32s31-bluetooth-memory = { path = "../../../hardware/esp32s31/driver/bluetooth/memory" }
oer-esp32s31-bluetooth-radio = { path = "../../../roles/esp32s31/bluetooth/radio" }
oer-esp32s31-hal = { path = "../../../hardware/esp32s31/hal" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-64", "std"] }
oer-esp32s31-bluetooth = { path = "../../../hardware/esp32s31/driver/bluetooth", features = ["test-support"] }
oer-esp32s31-bluetooth-memory = { path = "../../../hardware/esp32s31/driver/bluetooth/memory", features = ["validation-probes"] }
oer-esp32s31-bluetooth-radio = { path = "../../../roles/esp32s31/bluetooth/radio", features = ["test-support"] }
oer-esp32s31-hal = { path = "../../../hardware/esp32s31/hal", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "runtime"
platform = "chip"
chip = "esp32s31"
