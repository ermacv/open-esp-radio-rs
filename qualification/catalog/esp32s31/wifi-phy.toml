[[items]]
id = "wifi-legacy-and-ht-mac-behavior-rts-protection"
section = "wifi-legacy-and-ht-mac-behavior"
title = "RTS protection"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "ERP Use Protection, all HT protection modes and finite HE TXOP-duration RTS thresholds are retained as typed BSS/peer policy. The initial rate and every retry rate are preflighted before sequence, PN or DMA publication; a protection-required transaction returns `PhysicalPublicationUnverified`. There is no complete RTS formatter, queue image or completion owner, and no on-air capability is claimed."
source-paths = []

[[items]]
id = "wifi-legacy-and-ht-mac-behavior-cts-to-self-protection"
section = "wifi-legacy-and-ht-mac-behavior"
title = "CTS-to-Self protection"
status = "fail-closed"
level = "composed-product"
scope-and-limitations = "Typed TX-protection policy identifies group exchanges that require CTS-to-Self and rejects them before sequence, PN or DMA publication. The reviewed SW_CTS field is bit 30, independently of SW_RTS at bit 31. Cold HE initialization clears CTS; ordinary PLCP preparation clears RTS. Those compared reset edges do not implement a CTS frame, NAV duration, queue-publication or completion owner."
source-paths = []

[[items]]
id = "wifi-legacy-and-ht-mac-behavior-immediate-block-ack"
section = "wifi-legacy-and-ht-mac-behavior"
title = "Immediate Block ACK"
status = "partial"
level = "composed-product"
scope-and-limitations = "Negotiated immediate BlockAck, hardware bitmap capture/matching, software RX reorder, retained TX MPDUs and selective retry are implemented for the bounded WPA2/QoS STA/AP aggregate paths. STA TX owns TIDs 0/7/5, AP TX owns TID 0, and Open links do not start a BlockAck agreement; other security/TID combinations are not claimed."
source-paths = []

[[items]]
id = "wifi-legacy-and-ht-mac-behavior-fragmentation-and-defragmentation"
section = "wifi-legacy-and-ht-mac-behavior"
title = "Fragmentation and defragmentation"
status = "partial"
level = "composed-product"
scope-and-limitations = "Bounded STA/AP RX reassembly is source-owned for Open and individually addressed WPA2-Personal/CCMP Data or QoS Data. Each role owns two fixed contexts of 1,508 retained MSDU bytes: an 8-byte LLC/SNAP header plus at most one 1,500-byte Ethernet payload. CCMP admission requires hardware authentication, a separate PN per fragment, exact Retry fingerprints and final replay commit before the sole Ethernet publication. TX, group/four-address and protected A-MSDU fragmentation remain absent; no on-air qualification is implied."
source-paths = []

[[items]]
id = "wifi-legacy-and-ht-mac-behavior-tx-rx-a-mpdu"
section = "wifi-legacy-and-ht-mac-behavior"
title = "TX/RX A-MPDU"
status = "partial"
level = "composed-product"
scope-and-limitations = "Bounded WPA2-Personal/CCMP A-MPDU is source-owned for HT/HE STA and HT AP: negotiated per-TID BA windows, RX reorder, retained TX MPDUs and selective retry are connected. Open connected TX is deliberately non-QoS and an Open AP has no BlockAck owner. Other security/TID combinations and HE trigger-based aggregation are not claimed."
source-paths = []

[[items]]
id = "wifi-legacy-and-ht-mac-behavior-tx-rx-a-msdu"
section = "wifi-legacy-and-ht-mac-behavior"
title = "TX/RX A-MSDU"
status = "partial"
level = "composed-product"
scope-and-limitations = "STA/AP RX decapsulation is present for admitted Open and authenticated WPA2 data. TX scopes differ: STA coalesces one exact two-frame WPA2 protected pair; AP coalesces one exact Open HT/QoS pair, or a WPA2 TID-0 pair only when the operational BA agreement echoed A-MSDU support. Each TX path is bounded to 3,839 bytes and checks peer/order, descriptor+MIC+FCS capacity and fallback before sequence/PN publication. General multi-lease scheduling and the larger class are absent."
source-paths = []

[[items]]
id = "wifi-legacy-and-ht-mac-behavior-txop"
section = "wifi-legacy-and-ht-mac-behavior"
title = "TXOP"
status = "partial"
level = "composed-product"
scope-and-limitations = "This is a STA-only production subset: negotiated WMM TXOP values reach per-AC station policy and bound the HE A-MPDU APEP ceiling; nonzero HT TXOP duration is rejected. AP TX has no negotiated TXOP owner, and neither role has a general multi-PPDU TXOP scheduler."
source-paths = []

[[items]]
id = "wifi-legacy-and-ht-mac-behavior-wmm"
section = "wifi-legacy-and-ht-mac-behavior"
title = "WMM"
status = "partial"
level = "composed-product"
scope-and-limitations = "STA owns WMM parsing, DSCP/VLAN classification, ACM downgrade, four per-AC EDCA queues, TID selection and BA routing. AP advertises a fixed WMM parameter set and its bounded QoS/A-MPDU path uses BE/TID-0, but it has no per-peer parameter negotiation, network classification or four-AC scheduler. U-APSD is disabled in both roles."
source-paths = []

