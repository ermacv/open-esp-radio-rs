[[registers."MODEM_LPCON_SHARED_CLOCK.COEX_LP_CLK_CONF"]]
excluded = true
lifecycle = "ieee802154"
reason = "lifecycle: the coex timer clock (XTAL/50, 0x314) is selected before any coex request; the vendor selects it at system start in coex_pre_init (esp_coex coexist.c init_coexist, linked with software coex), production in RadioSystem::enable_coex on the first coex client (CoexArbiter::configure_timer_clock, from libcoexist coex_core_pre_init). The production IEEE 802.15.4 session runs without a coex client, whose timers are then unused (reviewed with the PHY owner)"

[[registers."MODEM_LPCON_SHARED_CLOCK.COEX_LP_CLK_CONF"]]
excluded = true
lifecycle = "ieee802154-restart"
reason = "lifecycle: the coex timer clock (XTAL/50, 0x314) is selected before any coex request; the vendor selects it at system start in coex_pre_init (esp_coex coexist.c init_coexist, linked with software coex), production in RadioSystem::enable_coex on the first coex client (CoexArbiter::configure_timer_clock, from libcoexist coex_core_pre_init). The production IEEE 802.15.4 session runs without a coex client, whose timers are then unused (reviewed with the PHY owner)"

[registers."PHY_AGC_ORACLE.RX_11B_WINDOW_CONTROL"]
excluded = true
lifecycle = "cold"
reason = "lifecycle: the last writer is phy_reg_update_new after cold registration and phy_bb_agc_reg_update after an RF wake or RX table init; the vendor read follows the RF wake of its Wi-Fi start, production's read its cold registration, and production's wake keeps the vendor order"

[registers."PhyI2cField.6b.11"]
excluded = true
lifecycle = "cold"
reason = "lifecycle: cold phy_rf_init runs rc_cal_set(3, 1, 9), phy_rc_cal and sar2_init_code(1400); phy_wakeup_init repeats none of them, and the RF close powers the 0x6b and 0x69 blocks down to their defaults. The vendor read follows the RF wake of its Wi-Fi start, production's read its cold registration; after a restart both sides are woken"

[registers."PhyI2cField.6b.13"]
excluded = true
lifecycle = "cold"
reason = "lifecycle: cold phy_rf_init runs rc_cal_set(3, 1, 9), phy_rc_cal and sar2_init_code(1400); phy_wakeup_init repeats none of them, and the RF close powers the 0x6b and 0x69 blocks down to their defaults. The vendor read follows the RF wake of its Wi-Fi start, production's read its cold registration; after a restart both sides are woken"

[registers."PhyI2cField.6b.14"]
excluded = true
lifecycle = "cold"
reason = "lifecycle: cold phy_rf_init runs rc_cal_set(3, 1, 9), phy_rc_cal and sar2_init_code(1400); phy_wakeup_init repeats none of them, and the RF close powers the 0x6b and 0x69 blocks down to their defaults. The vendor read follows the RF wake of its Wi-Fi start, production's read its cold registration; after a restart both sides are woken"

[[registers."PhyI2cField.69.04"]]
excluded = true
lifecycle = "cold"
reason = "lifecycle: cold phy_rf_init runs rc_cal_set(3, 1, 9), phy_rc_cal and sar2_init_code(1400); phy_wakeup_init repeats none of them, and the RF close powers the 0x6b and 0x69 blocks down to their defaults. The vendor read follows the RF wake of its Wi-Fi start, production's read its cold registration; after a restart both sides are woken"

[registers."PhyI2cField.6b.02"]
excluded = true
reason = "live state: the I2C command memory holds both TX capacitor-bank images (0xc2 and 0x73), and the hardware sequencer publishes one on each RF event, so the byte shows the last event"

[[registers."PhyI2cField.69.04"]]
excluded = true
lifecycle = "restart"
reason = "platform (PHY owner review, not confirmed on hardware): after an RF close and wake the vendor block reads its power-on default 0x60, while production keeps its cold SAR2 initialization 0x65; production runs from PSRAM and esp-hal keeps the MPLL and its analog-I2C power up (PMU_RADIO.HP_ACTIVE_HP_CK_POWER bits 26 and 30), under which the block keeps its state. Production powers the temperature sensor down on close as the vendor does (76006deb0), which did not change the byte. A vendor build with PSRAM enabled did not boot on the HIL console, so the cause is not reproduced on the vendor side"
