schema = 3

# The open implementation owns scheduler state behind the Rust runtime's
# synchronization primitive. These profiles therefore prove the operational
# projection after vendor scheduler installation and successful semaphore
# acquisition; null-handle and RTOS lock-failure policy are intentionally not
# claimed as part of the source-owned state model.

[[profiles]]
name = "coex-scheduler-interval-set"
claim = "reviewed-domain-equivalence"
precondition = "installed-scheduler-and-acquired-lock"
vendor-source = "coex"
vendor-symbol = "coex_schm_interval_set"
rust-symbol = "open_coex_scheduler_trace_interval_set"
contract = "state"
compare-return = true
[[profiles.argument-values]]
index = 0
values = [0xa5a55a5a]

[[profiles.cases]]
name = "nonzero"
arguments = [0xa5a55a5a, 0x3fff2000]
vendor-ram = [
    { address = 0x10002864, value = 0xdeadbeef },
    { address = 0x10002868, value = 0x3fce2000 },
]
rust-ram = [{ address = 0x3fff2000, value = 0xdeadbeef }]
vendor-tables = [{
    layout-id = "esp32s31-radio-rev0::coex-adapter-v2",
    base-address = 0x3fce1000,
    layout-size = 0x50,
    pointer-cells = [0x10002ba4],
    slots = [
        { offset = 0x18, target = { kind = "modeled-symbol", value = "semphr_take" } },
        { offset = 0x1c, target = { kind = "modeled-symbol", value = "semphr_give" } },
    ],
}]
vendor-calls = [
    { symbol = "semphr_take", return-words = [1] },
    { symbol = "semphr_give", return-words = [1] },
]
vendor-observations = [
    { kind = "symbol", symbol = "coex_schm_env", offset = 0x0c, length = 4 },
]
rust-observations = [{ kind = "absolute", address = 0x3fff2000, length = 4 }]

