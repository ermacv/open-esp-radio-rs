schema = 5
id = "diagnostic-ap-rx42-tx40-sgi-fixed-client-mcs7"
description = "AP 42/40 Mbit/s fixed-MCS7/SGI client A/B with Core0 RX telemetry"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "ht40", "bidirectional", "task-poll", "fixed-client-mcs", "short-gi"]

[wifi]
image = "diagnostic-core0-rx-cycles"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40", minimum_mcs = 7, guard_interval = "short" }
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt", fixed_ht_mcs = 7, fixed_guard_interval = true }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 42000000, tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
