schema = 2

[[peripherals]]
name = "ZBBB_RADIO_CONTROL"
description = """
Independently bounded words in the ZBBB window touched by complete Bluetooth
baseband receive-setup and reset-idle leaves. Names describe only those exact
operations; they do not claim that the physical block is owned exclusively by
Bluetooth or assign a wider ZBBB protocol meaning."""
baseAddress = 0x20102C00

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_SETUP_IMAGE"
description = "bt_bb_rx_set preserves the low 12 bits and replaces bits 31:12 with the finite image 0x001CB."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "CONFIG_IMAGE"
bitOffset = 12
bitWidth = 20

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFF

