schema = 2

[[peripherals]]
name = "BLE_HW_ACCELERATOR"
description = """
Sparse ESP32-S31 BLE hardware-accelerator view. Complete ble_hw.c operations
independently prove encryption and resolving-list engines in this physical
block; complete BLE PHY initialization proves three additional initialization
words. Cross-chip objects provide function identities only. Addresses, field
geometry, values, ordering and predicates all come from ESP32-S31 bytes.
"""
baseAddress = 0x20109800

