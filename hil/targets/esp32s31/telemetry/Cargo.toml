[package]
name = "open-esp-radio-hil-esp32s31-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ESP32-S31 qualification observers for open-esp-radio HIL"

[features]
tx-wait-probe = []
rx-ownership-observation = ["dep:oer-esp32s31-wifi-dma", "oer-esp32s31-wifi-dma/rx-ownership-observation"]

[dependencies]
oer-esp32s31-wifi-dma = { path = "../../../../crates/hardware/esp32s31/driver/ieee80211/dma", optional = true }
oer-wifi-softmac = { path = "../../../../crates/protocols/ieee80211/softmac" }
oer-ieee80211 = { path = "../../../../crates/protocols/ieee80211/mac" }
oer-esp32s31-wifi-mac = { path = "../../../../crates/hardware/esp32s31/driver/ieee80211/mac" }
oer-esp32s31-wifi-runtime = { path = "../../../../crates/runtime/esp32s31/ieee80211", default-features = false }
open-esp-radio-hil-protocol = { path = "../../../protocol" }

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "chip"
chip = "esp32s31"
