schema = 1
# Finite two-register station TSF wake gate. The accepted argument domain is
# the Rust bool image 0..=1 and is closed by the companion profile.
default-disposition = "not-yet-ported"
default-protocol = "wifi"

[[functions]]
source = "libpp"
symbol = "hal_set_sta_tsf_wakeup"
disposition = "direct"
protocol = "wifi"
rust-component = "open_esp_radio_esp32s31_pac::RadioRegisters::set_station_tsf_wakeup"
binding = "v1"
rust-probe = "open_libpp_power_tsf_trace_hal_set_sta_tsf_wakeup"
effect-contract = "exact-effects-v1"
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010d858 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x2010d858 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-read", width = 32, address = 0x2010d830 }
disposition = { kind = "required" }
[[functions.effects]]
selector = { kind = "mmio-write", width = 32, address = 0x2010d830 }
disposition = { kind = "required" }
