schema = 5
id = "diagnostic-ap-rx45-tx40-task-poll"
description = "Temporary AP 45 Mbit/s uplink and 40 Mbit/s downlink Core0 task-poll diagnostic"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "ht40", "bidirectional", "task-poll", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-core0-rx-cycles"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 45000000, tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
