[package]
name = "oer-ieee802154-openthread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenThread radio over any IEEE 802.15.4 radio port"

[dependencies]
heapless = "0.9.3"
oer-ieee802154 = { path = "../../../protocols/ieee802154" }
# The fork's radio trait, without the OpenThread C library.
openthread-radio = { git = "https://github.com/ermacv/openthread", rev = "13538da6b576ed8f1316adbad2196c06e4cf7c99", default-features = false }

[dev-dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
oer-espressif-ieee802154-runtime = { path = "../../../runtime/espressif/ieee802154", features = ["model"] }
oer-espressif-ieee802154-engine = { path = "../../../hardware/espressif/ieee802154/engine", features = ["model"] }
oer-time-virtual = { path = "../../../adapters/virtual/time" }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "adapter"
platform = "portable"
