schema = 4
id = "diagnostic-station-phy-calibration-bidirectional"
description = "Explicit common and Wi-Fi calibration within a preserved station epoch during bidirectional UDP delivery"
repetitions = 1
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[link]
phy = "ht40"

[workload]
kind = "udp"
direction = "bidirectional"
duration_seconds = 12
rx_rate_bps = 65000000
tx_rate_bps = 65000000
payload_bytes = 1200
station_pause = "calibration"

[criteria]
exact_delivery = false
minimum_rx_bps = 10000000
minimum_tx_bps = 10000000
require_no_beacon_loss = true
