[package]
name = "oer-hil-esp32s31-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# Experimental direct RX-gain transaction SRAM placement for an otherwise
# identical diagnostic image.
phy-rx-hot-sram = ["oer-esp32s31-phy?/rx-gain-hot-sram", "oer-esp32s31-ieee80211-system?/phy-rx-hot-sram"]
default = ["code-psram", "profile-psram-data"]
code-flash = []
code-psram = []
profile-psram-data = []
profile-sram-data = []
psram-task-stack = ["oer-esp32s31-platform-runtime/psram-task-stack"]
boot-smoke = []
system-watchdog = ["dep:oer-hil-protocol", "dep:embedded-io-async"]
phy-fault-injection = [
    "oer-esp32s31-phy/lifecycle-fault-injection",
    "oer-esp32s31-ieee80211-system?/lifecycle-fault-injection",
]
upstream-network = ["dep:embassy-net-upstream", "dep:xarxa", "oer-esp32s31-ieee80211-system/upstream-network", "oer-hil-target-core?/upstream-network"]
embassy-network = ["dep:embassy-net-released", "oer-esp32s31-ieee80211-system/embassy-network", "oer-hil-target-core?/embassy-network"]
owned-network = ["dep:embassy-net-owned", "dep:xarxa-owned", "oer-esp32s31-ieee80211-system/owned-network", "oer-hil-target-core?/owned-network"]
open-radio-hil = [
    "dep:oer-ieee80211-softmac",
    "dep:oer-esp32s31-ieee80211-mac",
    "dep:oer-esp32s31-ieee80211-runtime",
    "oer-esp32s31-platform-runtime/multicore",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embedded-io-async",
    "dep:log",
    "dep:heapless",
    "dep:oer",
    "dep:oer-network-interface",
    "dep:oer-esp32s31-ieee80211-system",
    "dep:oer-esp32s31-phy",
    "dep:oer-esp32s31-ieee80211-esp-hal",
    "dep:oer-hil-protocol",
    "dep:oer-hil-target-core",
    "dep:oer-hil-esp32s31-telemetry",
    "dep:oer-ieee80211-runtime",
    "dep:postcard",
    "dep:serde",
]
driver-observation = [
    "oer-esp32s31-executor-embassy/timer-observation",
    "oer-esp32s31-ieee80211-system/diagnostics",
    "oer-esp32s31-phy/registration-diagnostics",
]
# Intrusive hard-IRQ classification. This is never part of correctness or
# performance images because it extends the SRAM-closed MAC ISR call graph.
mac-irq-telemetry = [
    "driver-observation",
    "oer-esp32s31-ieee80211-system/mac-irq-diagnostics",
]
tx-wait-probe = [
    "mac-irq-telemetry",
    "oer-esp32s31-ieee80211-system/tx-wait-probe",
    "oer-hil-esp32s31-telemetry/tx-wait-probe",
]
# Common low-overhead observer used by both residence and task-poll images.
# Keep it independent from the TX architecture probes: task-poll scenarios do
# not select those probes and must not pay for their DMA-visible owners.
connected-datapath-poll-telemetry = [
    "oer-esp32s31-ieee80211-system/connected-datapath-cycle-telemetry",
]
# Minimal diagnostic overlay for measuring continuous Embassy Future::poll
# residence. Keep the rejected/experimental TX backing implementations out of
# this image: their compile-time branches and DMA-visible owners measurably
# change the linked hot-path layout even when runtime-disabled.
task-residence-telemetry = ["connected-datapath-poll-telemetry"]
# Same-image home for hardware-address and memory-transfer probes. It retains
# residence timing, but must never be used as the production CPU budget.
tx-architecture-probes = [
    "task-residence-telemetry",
    "tx-psram-dma-probe",
    "gdma-mem2mem-probe",
]
tx-psram-dma-probe = [
    "oer-esp32s31-ieee80211-system/tx-psram-dma-probe",
]
# Diagnostic-only PSRAM-to-SRAM promotion benchmark. It claims AXI-GDMA
# channel 0 before radio startup and releases it before any workload begins.
memory-benchmark = ["open-radio-hil", "oer-esp32s31-soc-esp-hal/psram-dma-diagnostic"]
gdma-mem2mem-probe = ["oer-esp32s31-soc-esp-hal/psram-dma-diagnostic"]
# General task-poll diagnostic. Driver observation remains available for the
# existing RX/TX/AP diagnostic scenarios, but Core0 per-phase accounting is
# deliberately separate below.
task-poll-telemetry = [
    "connected-datapath-poll-telemetry",
    "driver-observation",
]
# Intrusive Core0 RX phase accounting. This retains the same top-level task
# residence evidence, but is a separate feature because its per-phase cycle
# reads, atomics, and larger linked image measurably perturb the result.
core0-rx-cycle-telemetry = [
    "task-poll-telemetry",
    "oer-esp32s31-ieee80211-system/task-poll-telemetry",
]
# Production-like Core0 accounting: no driver observers and no per-frame
# instrumentation, only radio/runner/DMA/protocol batch samples.
core0-rx-coarse-telemetry = [
    "connected-datapath-poll-telemetry",
    "oer-esp32s31-ieee80211-system/core0-rx-coarse-telemetry",
]
# Diagnostic overlay proving each UDP RX delivery frontier from software
# reorder output through network admission and application consumption.
rx-delivery-telemetry = ["driver-observation"]
rx-ownership-telemetry = [
    "oer-esp32s31-ieee80211-system/rx-ownership-observation",
    "oer-hil-esp32s31-telemetry/rx-ownership-observation",
    "dep:oer-esp32s31-ieee80211-dma",
]
# Diagnostic-only, bounded discriminator for the IEEE 802.15.4 EVENT_STATUS
# timer bits. It reads both source-132 route controls but never writes a route
# or attests that the production IRQ path is ready.
ieee802154-event-status-probe = [
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-radio-esp-hal",
    "oer-esp32s31-hal/validation-probes",
]
# Diagnostic-only ED-DONE/TIMER0 selective-write discriminator.
# RX-ABORT is retained explicitly when PHY/RF/BTBB readiness is absent.
ieee802154-ed-event-probe = [
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-radio-esp-hal",
    "oer-esp32s31-hal/validation-probes",
]

[dependencies]
oer-esp32s31-ieee80211-dma = { path = "../../../../crates/hardware/esp32s31/driver/ieee80211/dma", optional = true, features = ["rx-ownership-observation"] }
oer-ieee80211-softmac = { workspace = true, optional = true }
oer-esp32s31-ieee80211-mac = { workspace = true, optional = true }
oer-esp32s31-ieee80211-runtime = { workspace = true, optional = true }
xarxa-owned = { workspace = true, optional = true }
xarxa = { workspace = true, optional = true }
embassy-executor.workspace = true
embassy-futures = { workspace = true, optional = true }
embassy-net-upstream = { workspace = true, optional = true }
embassy-net-released = { workspace = true, optional = true }
embassy-net-owned = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time.workspace = true
embedded-io-async = { workspace = true, optional = true }
esp-hal = { workspace = true, features = ["esp32s31", "rt", "unstable"] }
log = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
oer = { workspace = true, optional = true }
oer-network-interface = { workspace = true, optional = true }
oer-esp32s31-ieee80211-system = { workspace = true, optional = true }
oer-esp32s31-hal = { workspace = true, optional = true }
oer-esp32s31-phy = { workspace = true, optional = true }
oer-esp32s31-radio-esp-hal = { workspace = true, features = ["esp32s31"], optional = true }
oer-esp32s31-soc-esp-hal.workspace = true
oer-esp32s31-executor-embassy.workspace = true
oer-esp32s31-ieee80211-esp-hal = { workspace = true, features = ["esp32s31"], optional = true }
oer-hil-protocol = { workspace = true, optional = true, features = ["async-io"] }
oer-hil-target-core = { path = "../../../target-core", optional = true }
oer-esp32s31-platform-board = { path = "../../../../platform/esp32s31/board" }
oer-esp32s31-platform-runtime = { path = "../../../../platform/esp32s31/runtime" }
oer-hil-esp32s31-telemetry = { workspace = true, optional = true }
oer-ieee80211-runtime = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
static_cell.workspace = true

[lints]
workspace = true

[build-dependencies]
oer-esp32s31-platform-layout = { path = "../../../../platform/esp32s31/layout", features = ["build"] }

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "chip"
chip = "esp32s31"
default-configuration = false
supported-feature-profiles = [
    "open-radio-hil,upstream-network,psram-task-stack,code-psram,profile-psram-data",
]
