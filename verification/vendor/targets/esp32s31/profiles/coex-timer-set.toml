schema = 5
case-execution = "independent"
transaction-comparison = "observables"

# Complete vendor/Rust transaction for one representative Wi-Fi timer. The
# distinct latency and duration values make their intentionally reversed
# primary/secondary placement observable.
[[profiles]]
name = "coex-hw-timer-set"
claim = "reviewed-domain-equivalence"
precondition = "valid-coex-clock-and-timer-bank"
vendor-source = "coex"
vendor-symbol = "coex_hw_timer_set"
rust-symbol = "open_coex_set_trace_coex_hw_timer_set"
compare-return = false

[[profiles.argument-ranges]]
index = 0
min = 0
max = 0
[[profiles.argument-ranges]]
index = 1
min = 1
max = 1
[[profiles.argument-ranges]]
index = 2
min = 5
max = 5
[[profiles.argument-ranges]]
index = 3
min = 2_000
max = 2_000
[[profiles.argument-ranges]]
index = 4
min = 3_000
max = 3_000
# The reviewed COEX_LP_CLK_CONF source selector is one-hot. Divider images are
# paired with their selectors in the concrete cases below; the static domain
# prevents impossible selector values from creating false coverage gaps.
[[profiles.mmio-domains]]
address = 0x2010f008
values = [0x00000008, 0x00000314, 0x00000272, 0x00000001]

[[profiles.cases]]
name = "wifi-timer-0-selector-8"
arguments = [0, 1, 5, 2_000, 3_000, 1]

[[profiles.cases.mmio-initial]]
address = 0x2010f008
value = 0x00000008
[[profiles.cases.mmio-initial]]
address = 0x2010f400
value = 0xc1234567
[[profiles.cases.mmio-initial]]
address = 0x2010f404
value = 0xab654321

[[profiles.cases.vendor-tables]]
layout-id = "esp32s31-radio-rev0::coex-adapter-v2"
base-address = 0x3fce1000
layout-size = 0x50
pointer-cells = [0x10002ba4]
slots = [
    { offset = 0x30, target = { kind = "symbol", value = "coexist_printf" } },
]

[[profiles.cases.vendor-calls]]
