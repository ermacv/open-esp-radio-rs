[package]
name = "oer-hil-experiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL experiments: the one run launch, A/B comparisons and bisection"

[dependencies]
oer-hil-run-bundle-format = { path = "../run-bundle/format" }
oer-durable = { path = "../../../tools/durable" }
oer-hil-analysis = { path = "../analysis" }
oer-stand-arbiter = { path = "../../../stand/arbiter" }
oer-hil-image = { path = "../image" }
oer-hil-observer = { path = "../../observer" }
oer-hil-run-bundle = { path = "../run-bundle" }
oer-hil-schema = { path = "../../schema" }
oer-hil-source-snapshot = { path = "../source-snapshot" }
oer-stand-file = { path = "../../../stand/file" }
oer-process = { path = "../../../tools/process" }
oer-stats = { path = "../../../tools/stats" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

oer-stand-claims = { path = "../../../stand/claims" }
oer-stand-owners = { path = "../../../stand/owners" }
[dev-dependencies]
oer-hil-run-bundle = { path = "../run-bundle", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "orchestration"
host-app = "hil"
host-boundary = "application"
hil = "orchestration"
# The tests read this checkout's wire lock.
inputs = ["hil/protocol/messages.lock"]
