section = "wifi-802-11ax-he"
title = "Downlink OFDMA / MU-MIMO"
status = "partial"
level = "composed-product"
scope-and-limitations = "HE-MU common metadata and bounded HE20 SIG-B user decoding exist. Production HE20 payload reception for these multi-user modes is not qualified; bounded SIG-B decoding alone is not a complete receive-service claim. This does not require HE40 support."
