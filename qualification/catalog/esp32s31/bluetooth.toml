id = "bluetooth-read-local-supported-commands"
section = "bluetooth-hci-host-boundary"
title = "Read Local Supported Commands"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The standard 64-octet bitmap of the [HCI bootstrap](../../../../protocols/bluetooth/hci/src/controller/bootstrap/state.rs) declares the command inventory of its classifier; LE Rand appears only when a random source is attached. The controller core and HCI command service that answered with it were removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-public-bd-addr-le-read-buffer-size"
section = "bluetooth-hci-host-boundary"
