schema = 5
id = "udp-bidirectional-ht40-rx-delivery-split"
description = "Split-core HT40 full-duplex RX delivery-frontier diagnostic"
repetitions = 3
transfer = "identical-image"
tags = ["diagnostic", "udp", "station", "full-duplex", "ht40", "split-core"]

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 55000000, tx_bps = 55000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
exact_delivery = true
require_no_beacon_loss = true
minimum_rx_bps = 49500000
minimum_tx_bps = 49500000
minimum_combined_bps = 100000000
