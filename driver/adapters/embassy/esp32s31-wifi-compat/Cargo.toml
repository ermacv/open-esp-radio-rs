[package]
name = "open-esp-radio-esp32s31-wifi-embassy-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Upstream-compatible Embassy network bridge for the ESP32-S31 Wi-Fi radio"

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
open-esp-radio-embassy-net-compat = { path = "../../embassy-net-compat" }
open-esp-radio-esp32s31-wifi-embassy = { path = "../esp32s31-wifi", default-features = false }
open-esp-radio-network = { path = "../../../common/network" }
open-esp-radio-wifi-embassy = { path = "../wifi" }

[features]
default = []
diagnostics = ["open-esp-radio-esp32s31-wifi-embassy/diagnostics"]
tx-phase-telemetry = ["open-esp-radio-esp32s31-wifi-embassy/tx-phase-telemetry"]

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true
