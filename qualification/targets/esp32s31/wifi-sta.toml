# Qualification v4 declares explicit proof states and blockers.
schema = 4
target = "esp32s31-wifi-sta"
required-capabilities = [
  "cold-registration",
  "rf-bb-initialization",
  "channel-selection-switch",
  "rx-tx-dma",
  "interrupt-recovery",
  "authentication-association",
  "wpa2",
  "async-deadlines",
  "radio-cold-start",
  "timeout-error-recovery",
]

[verification]
project = "verification/vendor/projects/esp32s31/vendor-project.toml"
evidence-index = "verification/vendor/projects/esp32s31/evidence/vendor-evidence.json"

[hil]
target = "esp32s31"
catalog = "hil/scenarios"
runs = "target/hil/esp32s31/runs"

[[capabilities]]
id = "cold-registration"
title = "Cold PHY registration"
scope = "One cold register_chipv7_phy composition through the typed target port"
implementation = "complete"
host = "covered"
async = "bounded"
depends-on = ["rf-bb-initialization"]
vendor-roots = [
  { source = "archive", symbol = "register_chipv7_phy" },
]
hil-requirements = [
  { scenario = "station-reconnect", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "registration-root-contract-blocked-by-bb-init" },
]

[[capabilities]]
id = "rf-bb-initialization"
title = "RF and baseband initialization"
scope = "Cold phy_rf_init and phy_bb_init transitions needed by Wi-Fi registration"
implementation = "complete"
host = "covered"
async = "bounded"
vendor-roots = [
  { source = "archive", symbol = "phy_rf_init" },
  { source = "archive", symbol = "phy_bb_init" },
]
hil-requirements = [
  { scenario = "station-reconnect", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "bb-init-contract-and-blocker-chain-incomplete" },
]

[[capabilities]]
id = "channel-selection-switch"
title = "Channel selection and live switch"
scope = "Typed 2.4-GHz PHY selection plus MAC stop restart around a live switch"
implementation = "complete"
host = "covered"
async = "bounded"
depends-on = ["rf-bb-initialization"]
vendor-roots = [
  { source = "archive", symbol = "phy_chip_set_chan" },
]
hil-requirements = [
  { scenario = "station-reconnect-ht40", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "channel-production-trace-difference-unreviewed" },
]

[[capabilities]]
id = "rx-tx-dma"
title = "RX and TX DMA ownership"
scope = "Descriptor lifetime staging publication and finite TX completion for the connected STA path"
implementation = "complete"
host = "covered"
async = "bounded"
depends-on = ["interrupt-recovery"]
vendor-anchors = [
  "registers/esp32s31/evidence/vendor-rom.toml",
  "registers/esp32s31/evidence/vendor-libpp.toml",
]
hil-requirements = [
  { scenario = "udp-bidirectional-ht40-rx-delivery-split", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "dma-root-contracts-not-executable" },
]

# Source-path reference metadata; these entries do not add readiness axes.
[[capabilities.source-contracts]]
id = "wifi-sram-dma"
composition = "production"
scope = "Wi-Fi MAC RX rings and ordinary TX own descriptors and physical packet storage in internal DMA SRAM"
limits = "Address admission and storage placement describe the current driver contract, not the full reachability of the silicon; upper network payload storage may use PSRAM after a copy"
source-paths = [
  "driver/chips/esp32s31/ieee80211/dma/src/descriptor.rs",
  "driver/chips/esp32s31/ieee80211/dma/src/rx_storage.rs",
  "driver/chips/esp32s31/ieee80211/dma/src/tx_storage.rs",
  "driver/integration/esp32s31/embassy/ieee80211/src/radio_resources.rs",
]

[[capabilities.source-contracts]]
id = "wifi-ampdu-descriptor-chain"
composition = "production"
scope = "Wi-Fi aggregate TX chains MPDU descriptors and retains stable payload backings across completion and selective retry"
limits = "Each MPDU uses a contiguous backing range; an A-MPDU descriptor chain does not establish scatter/gather within one MPDU. Descriptors remain in SRAM; pool and burst capacities are software policy"
source-paths = [
  "driver/chips/esp32s31/ieee80211/dma/src/tx_ampdu_storage.rs",
  "driver/chips/esp32s31/ieee80211/mac/src/tx.rs",
]

[[capabilities.source-contracts]]
id = "wifi-psram-tx"
composition = "diagnostic"
scope = "The tx-psram-dma-probe feature admits explicitly selected PSRAM TX backings after cache writeback, with descriptors retained in SRAM"
limits = "AP diagnostic scenarios exercise this path; source composition does not qualify Wi-Fi PSRAM reachability, throughput or retry correctness, and does not extend the production STA DMA scope"
source-paths = [
  "driver/chips/esp32s31/ieee80211/dma/src/tx_ampdu_storage.rs",
  "driver/integration/esp32s31/embassy/ieee80211/src/radio_resources.rs",
  "hil/scenarios/ieee80211/access-point/diagnostic-ap-single-client-udp-tx-psram-dma.toml",
  "hil/scenarios/ieee80211/access-point/diagnostic-ap-single-client-udp-tx-sram-control.toml",
]

[[capabilities.source-contracts]]
id = "wifi-psram-rx"
composition = "unimplemented"
scope = "Direct Wi-Fi MAC receive into PSRAM with a cache-coherent handoff to the CPU"
limits = "The receive owner admits internal DMA SRAM; Wi-Fi PSRAM RX reachability and its cache invalidation/ownership contract are unknown. This is an absent composition, not a hardware impossibility claim"
source-paths = [
  "driver/chips/esp32s31/ieee80211/dma/src/rx_storage.rs",
  "driver/adapters/esp-hal/esp32s31/soc/src/cache/maintenance.rs",
]

[[capabilities.source-contracts]]
id = "wifi-mpdu-scatter-gather"
composition = "unimplemented"
scope = "A single transmitted MPDU assembled by Wi-Fi DMA from independently owned header and payload segments"
limits = "The current MPDU publication accepts a contiguous range; segment framing, CCMP, FCS and retry ownership are not composed. AXI-GDMA scatter/gather and A-MPDU chaining do not establish this Wi-Fi hardware operation"
source-paths = [
  "driver/chips/esp32s31/ieee80211/dma/src/tx_ampdu_storage.rs",
  "driver/chips/esp32s31/ieee80211/mac/src/tx.rs",
]

[[capabilities.source-contracts]]
id = "axi-gdma-psram-staging"
composition = "diagnostic"
scope = "The AXI-GDMA memory-to-memory probe copies SRAM or PSRAM sources into SRAM, including discontiguous source/destination segment chains"
limits = "AXI-GDMA is a separate engine from Wi-Fi MAC DMA and is not composed into the production network staging path; unsafe start requires owners to retain buffers and descriptors until hardware completion even if the transfer handle is forgotten"
source-paths = [
  "driver/adapters/esp-hal/esp32s31/soc/src/dma/mem2mem/transfer.rs",
  "driver/adapters/esp-hal/esp32s31/soc/src/dma/mem2mem/descriptor.rs",
  "hil/targets/esp32s31/runtime/src/gdma_mem2mem_probe.rs",
]

[[capabilities.source-contracts]]
id = "psram-dma-read-cache-writeback"
composition = "diagnostic"
scope = "The platform cache adapter writes CPU-dirty PSRAM data back before peripheral reads in the AXI-GDMA and direct Wi-Fi TX diagnostic compositions"
limits = "Callers own complete affected cache lines and retain storage without CPU mutation through DMA completion; writeback alone proves neither peripheral PSRAM reachability nor a DMA-write-to-CPU-read invalidation contract"
source-paths = [
  "driver/adapters/esp-hal/esp32s31/soc/src/cache/maintenance.rs",
  "driver/adapters/esp-hal/esp32s31/soc/src/dma/mem2mem/transfer.rs",
  "driver/integration/esp32s31/embassy/ieee80211/src/radio_resources.rs",
]

[[capabilities]]
id = "interrupt-recovery"
title = "Interrupt acknowledgement and recovery ordering"
scope = "Finite CPU route epoch hard MAC acknowledgement priority dispatch and Embassy wake coalescing"
implementation = "complete"
host = "covered"
async = "bounded"
vendor-anchors = [
  "registers/esp32s31/evidence/vendor-libpp.toml",
]
hil-requirements = [
  { scenario = "station-ap-loss", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "libpp-interrupt-contract-not-executable" },
]

[[capabilities]]
id = "authentication-association"
title = "Open authentication and STA association"
scope = "Finite selected-peer Open Authentication and Association epochs through accepted response"
implementation = "complete"
host = "covered"
async = "bounded"
depends-on = ["channel-selection-switch", "rx-tx-dma"]
vendor-anchors = [
  "driver/ieee80211/mac/src/station.rs",
]
hil-requirements = [
  { scenario = "station-access-point-lifecycle", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "net80211-auth-association-contract-not-executable" },
]

[[capabilities]]
id = "wpa2"
title = "WPA2 Personal station handshake"
scope = "Four-way handshake replay protection key installation response deadline and protected traffic"
implementation = "complete"
host = "covered"
async = "bounded"
depends-on = ["authentication-association"]
vendor-anchors = [
  "driver/ieee80211/security/wpa2/src/supplicant.rs",
]
hil-requirements = [
  { scenario = "station-access-point-lifecycle", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "supplicant-contract-not-executable" },
]

[[capabilities]]
id = "async-deadlines"
title = "Bounded asynchronous hardware deadlines"
scope = "Production PHY I2C PBus IQ-estimator and protocol waits contain no CPU spin"
implementation = "complete"
host = "covered"
async = "bounded"
vendor-roots = [
  { source = "rom", symbol = "phy_iq_est_enable" },
]
hil-requirements = [
  { scenario = "station-ap-absence", minimum-repetitions = 1 },
]
gaps = [
  { axis = "vendor", id = "iq-estimator-and-remaining-wait-contracts-not-bound" },
]

[[capabilities]]
id = "radio-cold-start"
title = "Always-awake radio cold start"
scope = "Clock reset and power-up handoff of the unique radio owner; station sleep and wake are outside the supported profile"
implementation = "complete"
host = "covered"
async = "not-applicable"
vendor-anchors = [
  "registers/esp32s31/model/peripherals/wifi-mac-rtc-timer-update.toml",
  "driver/chips/esp32s31/hal/src/lib.rs",
]
hil-requirements = [
  { scenario = "boot-smoke", minimum-repetitions = 1 },
]
