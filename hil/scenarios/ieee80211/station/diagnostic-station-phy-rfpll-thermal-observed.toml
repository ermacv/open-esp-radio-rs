schema = 5
id = "diagnostic-station-phy-rfpll-thermal-observed"
description = "Bounded one-second fresh-temperature/RFPLL observations until the first nonzero thermal correction"
repetitions = 1
transfer = "identical-image"
tags = ["phy-maintenance", "diagnostic", "station", "pause", "udp", "ht40", "thermal"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 90
payload_bytes = 1200
offer = { tx_bps = 20000000 }

[wifi.workload.maintenance]
operation = "rfpll-observed"
after_millis = 10000
attempts = { count = 45, interval_millis = 1000 }
require_nonzero_rfpll_correction = true

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_tx_bps = 10000000
