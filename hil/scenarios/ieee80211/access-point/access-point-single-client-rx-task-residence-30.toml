schema = 5
id = "access-point-single-client-rx-task-residence-30"
description = "Split-core AP HT40 RX executor-residence control at 30 Mbit/s offered load"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "split-core", "rx", "task-poll", "rx-residence-sweep"]

[wifi]
image = "diagnostic-task-residence"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 30000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 25000000
