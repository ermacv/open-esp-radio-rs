[package]
name = "open-esp-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Application facade for the source-only Rust ESP radio stack"
readme = "README.md"

[features]
default = ["wifi"]
wifi = [
    "dep:open-esp-radio-ieee80211",
    "dep:open-esp-radio-wifi-ap",
    "dep:open-esp-radio-wifi-softmac",
    "dep:open-esp-radio-wifi-sta",
    "dep:open-esp-radio-wpa2",
]
wifi-embassy = [
    "wifi",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:open-esp-radio-wifi-embassy",
]

[dependencies]
embassy-futures = { version = "0.1.2", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
open-esp-radio-ieee80211 = { path = "../ieee80211/mac", optional = true }
open-esp-radio-wifi-ap = { path = "../ieee80211/ap", optional = true }
open-esp-radio-wifi-softmac = { path = "../ieee80211/softmac", optional = true }
open-esp-radio-wifi-sta = { path = "../ieee80211/sta", optional = true }
open-esp-radio-wpa2 = { path = "../ieee80211/security/wpa2", optional = true }
open-esp-radio-wifi-embassy = { path = "../adapters/embassy/ieee80211", optional = true }

[lints]
workspace = true
