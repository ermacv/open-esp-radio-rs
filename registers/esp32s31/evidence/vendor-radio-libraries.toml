[[sources]]
id = "BLOB_LIBBTBB_BLE_TX_CONFIG_CHECK"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o ble_tx_config_check body, size 0x1c0. Its loads, masks and pinned field-name strings prove the BLE TX timing fields, including RF_ON_BT_DELAY and PA_ON_BT_DELAY in the canonical FECTRL word at 0x20100870. The same complete body reads 0x2010201c and consumes exactly bits 31:27 as an otherwise unnamed input to its diagnostic arithmetic; no stronger hardware meaning is assigned."

[[sources]]
id = "BLOB_LIBBTBB_BBMAC_IDLE_FOR_SWRST"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o bbmac_idle_for_swrst body, size 0x3c. The leaf returns success only when 0x2010207c bits 20:23 and 15:16, 0x20101550 bits 0:3 and 0x20103088 bits 0:3 are zero and 0x20102c38 bits 0:2 equal one. These are exact read predicates; the source does not assign meanings to individual status bits."

[[sources]]
id = "BLOB_LIBBTBB_CHANNEL_POWER_CONTROL"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o bt_get_channel_pwr_set and bt_get_channel_pwr_unset bodies, sizes 0x50 and 0x1e. Their fresh-read RMW operations set or clear exactly 0x20102004 bits 8:9 while preserving all other bits. The aggregate field name records only the named function boundary; individual bit semantics remain unknown."

[[sources]]
id = "BLOB_LIBBTBB_GAUSSIAN_COEFFICIENTS"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o set_gauss_coeff_1m and set_gauss_coeff_2m bodies, sizes 0xf6 and 0x82. Their ordered fresh-read RMW operations prove the exact masks and finite field images recorded for 0x201020e0..0x201020f4. The function identities distinguish 1M and 2M coefficient sets; positional field names deliberately avoid inventing individual coefficient semantics."

[[sources]]
id = "BLOB_LIBBTBB_BT_TX_SET"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o bt_bb_v2_tx_set body, size 0x34. One fresh-read RMW replaces exactly the low byte of 0x201020f0 with 0xf5 while preserving bits 31:8. This fact shares a physical word with the independently observed 2M Gaussian-coefficient fields."

[[sources]]
id = "BLOB_LIBBTBB_BT_AGC_RESTART_SET"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o bt_agc_restart_set body, size 0x2e6. At 0x20102100 it performs separate fresh-read RMW operations that set exactly bits 6, 7, 8, 9, 10, 19, 20 and 21. Other words touched by the complete body are intentionally outside this bounded standalone-BLE slice and remain unreviewed here."

[[sources]]
id = "BLOB_LIBBTBB_BT_CTE_ACCESSORS"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_cte.o public getter/setter set. Matching independent masks provide instruction-exact CTE and shared BTAGC field geometry. ble_bb_cte_set_ant_map additionally proves an indexed 16-bit MMIO window from 0x20102130 while its input-dependent count leaves the hardware capacity open. The observations populate canonical BT_V3_2 and BTAGC physical owners; they do not create per-function singleton peripherals."

[[sources]]
id = "BLOB_LIBBTBB_BT_BB_V2_ACCESSORS"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete named bt_bb_v2.o accessors and finite configuration leaves for LE TX delay, LE correlation thresholds, RX correlator/filter/DPO, TX CCA/FIFO, baseband watchdog, diagnostics and coexistence. Their direct loads, stores and RMW masks prove the recorded BT_V3_2 and BTAGC register/field geometry. Neutral ARGUMENT_N names preserve unknown C parameter semantics instead of promoting them to hardware meaning; CONFIG_VALUE fields record exact finite constants without claiming why the hardware uses them."

[[sources]]
id = "BLOB_LIBBLE_BASE_STACK_TASK_ENABLE"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8) complete member base_4.o symbol brk_sym_base_uevmRkB8BjrlJh1c3VnZ, plus libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895 complete named bt_bb_v2.o symbol bt_bb_corr_thresh_aa_lc_en. oer-symbol-lineage carries the source name r_base_stack_on_task_enable from commit 31c3094. The task-enable body first publishes its software memory-tracking and option state, then calls bt_bb_corr_thresh_aa_lc_en directly with Boolean image one, optionally enters the separately guarded BQB branch, and only afterwards calls the complete BLE PHY register initializer r_sym_ble_nENHlP4KBuQYlFVffaR5. The complete 0x16-byte bt_bb_corr_thresh_aa_lc_en body freshly reads BT_V3_2_BASEBAND.LE_CORRELATION_THRESHOLD_0 and replaces only AA_LC_ENABLE with the Boolean argument image. This source proves that the enabled field publication precedes the BLE PHY MMIO body; it does not import the vendor software environment or make optional BQB state part of the standalone open profile."

[[sources]]
id = "BLOB_LIBBLE_PHY_INIT_REGISTERS"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member ble_70.o symbol r_sym_ble_nENHlP4KBuQYlFVffaR5 body, size 0x2a2, with its complete callees r_sym_ble_dQthQ5ciPZuxiqTBiBNa, r_sym_ble_D7WjPzItc9OF8YS067Wq, member ble_38.o r_sym_ble_K9RI7JxM1NMxwdTUJ82J, member ble_68.o r_sym_ble_9gO1NCZ8fOI7LwbgnMi6 and r_sym_ble_fy9eOwbFJlqEr1QO6bwO, and member ble_25.o r_sym_ble_Fh7KRrkOJ0DaZapRKpqP. oer-symbol-lineage carries the source names r_ble_phy_init_registers, r_ble_phy_ramup_time_set, r_ble_phy_monitor_bb_sync, r_ble_ll_resolv_get_list, r_ble_hw_resolv_list_set and r_sdkconfig_get_opts from commit 31c3094; the names supply only role hints, and every reviewed address, mask, value and ordering comes from these bodies. At 0x201014b4 the body applies a fresh-read AND with 0x00020000, preserving only bit 17; no later write enables another source. It proves complete ordered images zero then one at the isolated positional word 0x20101ff0, complete ordered images 0x20 then 0x40 at the isolated positional word 0x2010891c, emitted by r_sym_ble_fy9eOwbFJlqEr1QO6bwO for its arguments 0x31 and 0x32 (the 0x40 image after the 0x20101470 branch), and finite BLE-accelerator initialization images at 0x20109800, 0x201098cc and 0x201098d0. 0x201018a0 takes the raw address of environment member +0x2c and 0x2010124c the raw address of environment member +0x4d. 0x20101940 takes the controller-configuration word at +0x40, the 0x48-byte copy of rodata sym_controller_jqcSm1kAtUzAMoyGlaKq (member controller_1.o), where it is 0x7d0. At 0x20101470 the selected branch performs a fresh-read RMW setting bit 18 when byte +0x55 of the r_sym_ble_Fh7KRrkOJ0DaZapRKpqP options is nonzero; it does not prove an allowlist, directed-advertising or independent enable meaning. 0x20101b74 takes the complete image 0x1ba and 0x20101b78 complete image one, without proven latch semantics. The tail writes 0x20101244 = 0, 0x201011f0 = 0x55 and 0x20101248 = 0xfff, then routes modem ETM channel 0 from event 8 to task 20 (0x2010880c = 8, 0x20108810 = 0x14) and enables that channel through r_sym_ble_fy9eOwbFJlqEr1QO6bwO(0), which writes 1 << channel to 0x20108804 for channels up to 11. These observations retain neutral initialization names; the role hints do not prove inner hardware meaning. Narrow owners are used for isolated addresses when neither adjacency nor a role hint proves a wider physical block."

[[sources]]
id = "BLOB_LIBBLE_CONNECTION_ABORT_CONTROL"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member ble_3.o r_sym_ble_mLYtT1I4BQmunJL36NqV, member connSim_1.o sym_connSim_Dzx5u6gHUrhrEF6GLX1p and member conn_4.o sym_conn_9o4sfTJUuO7muCutlmpa bodies. oer-symbol-lineage carries the names r_ble_lll_conn_update_link_state, r_conn_abortLcp_setAbortedOpcode and r_conn_hal_setDefaultAbortedOpcode from public same-chip commit 31c30949541a5d3abd4043a1cb66d55aa55577dd. The default writer publishes 0x00ff0002 at 0x201018ac, the custom writer publishes 0x00ff0003, and link-state refresh performs separate fresh-read replacements of only bit 1: it clears the bit when the second private connection flag (connection byte +0x121 bit 1) is set, independently of the first flag, and sets it otherwise. This proves the register role, custom-opcode selector and dynamic bit operation without assigning an unobserved inner meaning to LINK_STATE_CONTROL."

[[sources]]
id = "BLOB_LIBBLE_CONTROLLER_ADDRESS_SLOTS"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete 0x70-byte ble_phy.c member ble_70.o symbol r_sym_ble_4jTcHipi5k7xftmgAPTH, which oer-symbol-lineage carries from r_ble_phy_set_dev_address; that name supplies only the function-role hint. Selector values zero, one and two choose exactly three stride-eight register pairs at 0x2010180c..0x20101820; any other selector takes the assertion path. For the selected pair, the ESP32-S31 body packs input bytes 0..3 into the complete little-endian low word, then packs bytes 4..5 into bits 0..15 of the complete high-word write while clearing bits 16..31. The named r_esp_ble_ll_set_public_addr wrapper reaches selector zero through complete member ble_25.o helper r_sym_ble_60U2aYYZeD1Ql9djxRaO; named esp_ble_clear_rand_addr reaches selector one after clearing six bytes. Those caller names are role evidence for slots zero and one, not permission to invent semantics for slot two or adjacent hardware."

[[sources]]
id = "BLOB_LIBBTBB_BT_RX_SETUP"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete named bt_bb_rx_set body and its complete bt_agc_v2_set leaf. Their fresh-read RMW operations prove the recorded BTAGC field geometry and finite images. The complete parent also sets 0x20102000 bit 0 and 0x2010204c bit 2 through separate fresh-read RMW operations; this proves only their positional set-by-RX-setup behavior, not an independent hardware enable semantic. The parent body also performs a fresh-read RMW that clears 0x20104C24 bit 31 while preserving bits 30:0; that physical word is independently used by Wi-Fi MAC initialization and therefore has a shared-radio owner. Neutral CONFIG names deliberately avoid assigning undocumented receive/AGC semantics beyond the function boundary."

[[sources]]
id = "BLOB_LIBBTBB_SHARED_RX_INIT"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete named zb_rx_v0_0_set body, size 0xf0. It is called unconditionally by complete bt_bb_v2_init_cmplx and again by complete bt_bb_v2_rx_set. Its ordered fresh-read RMW operations prove the exact disjoint masks and finite images recorded at 0x20102C10..0x20102C34. The historical function prefix is retained only as call-identity evidence: the physical words remain in the protocol-neutral shared-radio owner and no Zigbee-only or BLE-only hardware semantics are inferred."

[[sources]]
id = "BLOB_LIBBTBB_IEEE802154_TXON_DELAY_SET"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o ieee802154_txon_delay_set body, size 0x46, which ESP-IDF 7b9cc1ac ieee802154_mac_init calls. It performs four ordered fresh-read RMW operations on the IEEE 802.15.4 MAC block and no other access: 0x20103104 bits 9:0 become 45, 0x20103110 bits 10:0 become 50, 0x20103114 bits 9:0 become 117 and 0x2010310c bits 5:0 become 5, each preserving every other bit. It does not call bt_bb_set_zb_tx_on_delay and does not access the shared baseband."

[[sources]]
id = "BLOB_LIBBTBB_SHARED_TX_TIMING_INIT"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete named bt_bb_set_zb_tx_on_delay body, size 0x32. Complete bt_bb_v2_init_cmplx calls it unconditionally with argument 60. The leaf performs one fresh-read RMW at 0x20102010, replacing bits 16:26 with ((argument - 10) << 3) while preserving every other bit. The historical function name is evidence for the call boundary, not a claim of exclusive Zigbee ownership; the physical word is retained by the shared-radio partition."

[[sources]]
id = "BLOB_LIBBTBB_BT_BB_V2_RX_SET_SLICE"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o bt_bb_v2_rx_set body, size 0x94, which ends by tail-calling bt_agc_sat_gain with argument 0x0a1b272e, and complete directly selected configuration leaves bt_set_rx_comp (0x94), bt_agc_gain_set (0x46), bt_agc_recorrect_set (0xc8), bt_agc_restart_set (0x2e6), bt_agc_detect_set (0x108), bt_agc_rssi_thresh (0x5e) and bt_agc_target_set (0x96). Complete bt_bb_set_rx_sense (0x80) independently proves the whole-word dynamic writes that overlap finite subfields in shared BTAGC words. Direct accesses prove the exact masks and finite or dynamic images recorded for the sparse 0x20102844..0x20102900 words. Whole-word dynamic writes remain register-level evidence and are not projected as overlapping SVD fields. Positional names retain unknown hardware semantics."

[[sources]]
id = "BLOB_LIBBTBB_BT_BB_V2_INIT"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o bt_bb_v2_init_cmplx body for argument one and its complete bt_agc_gain_set leaf. The body sets the reviewed BASEBAND_INIT_7CD0 fields in one fresh-read RMW. The linked phy_param byte at offset 0x120 is retained to seven bits for RX_GAIN_FORCE_OPAQUE, then independently wrapping-subtracted by five and retained to seven bits for AGC_GAIN_IMAGE. These are two ordered fresh-read RMW operations; the source does not assign a physical unit to the linked byte. The complete body also proves the ordered finite transmit-timing updates at 0x20100870, 0x20102014 and 0x201020b8: PA_ON_BT_DELAY becomes 0x96, the LE delay update clears bits 16:18 while replacing bits 19:26 with 29, and two separate CCA fresh-read RMW operations first clear bits 20:22 while replacing bits 23:30 with 0x17 and then replace bits 9:19 with 0x157. After the complete shared receive initializer, the same body performs a distinct fresh-read RMW at 0x20102c00 that preserves bits 11:0 and replaces bits 31:12 with 0x0019f."

[[sources]]
id = "BLOB_LIBBTBB_BT_AGC_BASIC_RUNTIME"
description = "libbtbb.a sha256 9bd762f68df0c894d27c542f01591aad21ee800b69fd6403c8ec6226ceaa8895; complete bt_bb_v2.o bt_agc_gain_max and bt_agc_sat_gain bodies, sizes 0x34 and 0x52. The first performs one fresh-read RMW that replaces exactly 0x20102850 bits 20:14 with a dynamic image. The second writes the complete finite image 0x00000404 to 0x20102864, replaces 0x2010284c bits 18:0 with 0x1770 in one fresh-read RMW, writes argument 0 as complete images to 0x20102858 and 0x2010285c, sets 0x2010284c bits 19, 24, 26, 28, 30 and 31 in a second fresh-read RMW, clears 0x20102820 bit 3 and sets 0x20102888 bit 30, each in one fresh-read RMW. Dynamic complete images are intentionally reviewed at register level without an overlapping SVD field."

[[sources]]
id = "BLOB_LIBBLE_HW_ENCRYPT_BLOCK"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member ble_68.o symbol r_sym_ble_7dhVHgpwooZIKXq5TBqb body, size 0xe2. Its position in the ble_hw.c object symbol sequence matches the named ESP32-C61 r_ble_hw_encrypt_block counterpart. The function assembles four little-endian words from argument bytes 0..15, publishes argument+16 and argument+32 pointers, writes length 16 and finite control images, starts the engine, and polls the completion word. Cross-chip evidence names the operation only; all register facts come from ESP32-S31 bytes."

[[sources]]
id = "BLOB_LIBBLE_HW_RESOLV_LIST_SEARCH"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member ble_68.o symbol r_sym_ble_6lDKo33OEA8POtZnFQHv body, size 0xd2, which oer-symbol-lineage pairs by call graph with r_ble_hw_resolv_list_search. The ESP32-S31 body publishes the two input images, mode bit 28, finite control image 0x400 and start image 1, then polls status bit 2; after 0x10000 reads it reports the timeout through an assertion with the current status and keeps polling. It then reads the result-present word, compressed SRAM result pointer and result metadata. The name supplies only the function identity."

[[sources]]
id = "BLOB_LIBBLE_HW_RESOLV_LIST_SET"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member ble_68.o symbol r_sym_ble_9gO1NCZ8fOI7LwbgnMi6 body, size 0x12. oer-symbol-lineage pairs it by identical normalized body with r_ble_hw_resolv_list_set of commit 31c3094. The ESP32-S31 body writes (argument >> 2) masked to twenty bits as a complete image at 0x20101880. The name supplies only the function identity; the address, compression and write shape come from ESP32-S31 bytes."

[[sources]]
id = "BLOB_LIBBLE_HW_STATUS_CLEAR"
description = "libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723 (espressif/esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8); complete member ble_59.o symbol r_sym_ble_ddurhv5Lz7XyowJFKiWv, size 0x5a. Its finite eight-iteration loop writes 0xFFFFFFFF to 0x20101b50 + index*4, reads the paired complete word at 0x20101b30 + index*4 twice, and asserts with that status only when it is nonzero. The evidence proves eight status/clear pairs and their directions; individual source meanings remain unknown."

