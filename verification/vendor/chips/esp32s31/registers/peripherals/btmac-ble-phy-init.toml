[[peripherals]]
name = "BTMAC_BLE_PHY_INIT"
description = """
ESP32-S31 BTMAC words initialized by the complete BLE PHY register-init
function. The function identity is supported by the matching ble_phy.c object
layout from the ESP32-C61 ecosystem library, while every address, mask and
value below comes only from the ESP32-S31 artifact. Neutral INIT names retain
the exact operation without promoting the cross-chip hint to hardware truth."""
baseAddress = 0x20101400

[[peripherals.registers]]

[peripherals.registers.register]
name = "INIT_ZERO_0074"
description = "BLE PHY register initialization writes the complete zero image. Inner hardware semantics remain unknown."
addressOffset = 0x74
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "INIT_IMAGE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "INTERRUPT_ENABLE"
description = "BLE base-stack interrupt enable bank. BLE PHY initialization preserves only source 17 and later enables sources 11, 15, 20 and 24. The synchronous scheduler-run subscriber clears stale source 14 before enabling it here. All omitted source identities remain unknown."
addressOffset = 0xB4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "SOURCE_11"
description = "The conditional BLE PHY initialization tail enables source 11. Its feature identity remains unknown."
bitOffset = 11
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SCHEDULER_RUN"
description = "The synchronous base-stack subscriber enables source 14 immediately before the scheduler RUN command."
bitOffset = 14
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SOURCE_15"
description = "The conditional BLE PHY initialization tail enables source 15. Its feature identity remains unknown."
bitOffset = 15
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SOURCE_17"
description = "BLE PHY initialization preserves source 17 while disabling every other interrupt source. Its feature identity remains unknown."
bitOffset = 17
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SOURCE_20"
description = "The conditional BLE PHY initialization tail enables source 20. Its feature identity remains unknown."
bitOffset = 20
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SOURCE_24"
description = "The conditional BLE PHY initialization tail enables source 24. Its feature identity remains unknown."
bitOffset = 24
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "INTERRUPT_CLEAR"
description = "Write-one-to-clear BLE base-stack interrupt bank. Initialization acknowledges every source with an all-ones image; the synchronous scheduler-run subscriber acknowledges source 14 before enabling it."
addressOffset = 0xB8
size = 32
access = "write-only"
modifiedWriteValues = "oneToClear"

[[peripherals.registers.register.fields]]
name = "SCHEDULER_RUN"
description = "A one acknowledges stale scheduler-run source 14 before that source is enabled."
bitOffset = 14
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "INIT_CONTROL_00C4"
description = "The conditional tail of complete BLE PHY register initialization sets bit 9 through a fresh-read RMW. All other bits are preserved and their meanings remain unknown."
addressOffset = 0xC4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "INIT_ENABLE_9"
bitOffset = 9
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "INIT_VALUE_0138"
description = "BLE PHY register initialization writes the finite complete image 0x0000065B."
addressOffset = 0x138
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "INIT_IMAGE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "LC_TX_ON_DELAY_CONFIG"
description = "BLE transmit timing configuration. ble_tx_config_check independently prints byte zero as lc_tx_on_delay; BLE PHY initialization writes the same runtime-derived byte image into bytes zero and two."
addressOffset = 0x250
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "LC_TX_ON_DELAY"
description = "Low byte printed as lc_tx_on_delay by complete ble_tx_config_check. BLE PHY initialization stores a configuration byte minus one."
bitOffset = 0
bitWidth = 8

[[peripherals.registers.register.fields]]
name = "INIT_DUPLICATE_BYTE"
description = "BLE PHY initialization receives the same configuration-byte-minus-one image as LC_TX_ON_DELAY. No independent semantic name is claimed."
bitOffset = 16
