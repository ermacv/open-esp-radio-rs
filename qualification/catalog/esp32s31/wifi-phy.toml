[[items]]
id = "wifi-802-11ax-he-buffer-status-report"
section = "wifi-802-11ax-he"
title = "Buffer Status Report"
status = "partial"
level = "composed-product"
scope-and-limitations = "HE BSR initialization, queue byte accounting and hardware-generated control-field geometry are recovered. Ordinary production frames do not request the hardware BSR path, and trigger-based publication remains fail-closed."
