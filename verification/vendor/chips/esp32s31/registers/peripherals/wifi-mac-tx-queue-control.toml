[peripherals.registers.register]
dim = 4
dimIncrement = 0x10
dimIndex = "0,1,2,3"
name = "CONFIG%s"
description = "Timeout, contention window, interface, AIFSN and scheduler-priority fields configured as distinct recovered RMW edges. Scheduler priority is not the original packet PTI retained in the vector bank."
addressOffset = 0x8
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "TIMEOUT"
bitOffset = 0
bitWidth = 12

[peripherals.registers.register.fields.writeConstraint.range]
