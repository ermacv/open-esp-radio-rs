name: Documentation

# Pushes and pull requests check the guides and API documentation. A manual
# run from main also publishes them to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_INCREMENTAL: '0'
  MDBOOK_VERSION: 0.5.4
  MDBOOK_MERMAID_VERSION: 0.17.1
  MDBOOK_PERMALINKS_VERSION: 3.0.2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require main for publication
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Cache Cargo downloads and mdBook tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
            ~/.cargo/bin/mdbook-permalinks
          key: docs-${{ runner.os }}-${{ env.MDBOOK_VERSION }}-${{ env.MDBOOK_MERMAID_VERSION }}-${{ env.MDBOOK_PERMALINKS_VERSION }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: docs-${{ runner.os }}-${{ env.MDBOOK_VERSION }}-${{ env.MDBOOK_MERMAID_VERSION }}-${{ env.MDBOOK_PERMALINKS_VERSION }}-
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/composition/esp32s31/embassy/ieee80211/Cargo.toml
      - name: API documentation and doctests
        run: cargo xtask doc
      - name: Markdown links and qualification catalogs
        run: cargo xtask check docs
      - name: Install mdBook
        run: |
          mdbook --version | grep -q "v$MDBOOK_VERSION" || cargo install --locked mdbook --version "$MDBOOK_VERSION"
          mdbook-mermaid --version | grep -q "$MDBOOK_MERMAID_VERSION" || cargo install --locked mdbook-mermaid --version "$MDBOOK_MERMAID_VERSION"
          # mdbook-permalinks has no --version; the cache key carries its version.
          command -v mdbook-permalinks >/dev/null || cargo install --locked mdbook-permalinks --version "$MDBOOK_PERMALINKS_VERSION"
      - name: Guides
        run: |
          mdbook-mermaid install docs
          mdbook build docs
          mdbook test docs
      - name: Assemble site
        run: |
          site=target/pages
          rm -rf "$site"
          cp -r target/book "$site"
          mkdir -p "$site/api"
          cp -r target/doc "$site/api/host"
          cp -r target/riscv32imafc-unknown-none-elf/doc "$site/api/esp32s31"
          cp -r crates/composition/esp32s31/embassy/ieee80211/target/riscv32imafc-unknown-none-elf/doc "$site/api/esp32s31-wifi"
      - name: Package site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/pages

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
