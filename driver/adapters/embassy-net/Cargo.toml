[package]
name = "open-esp-radio-embassy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded, owned Ethernet frame boundary between open ESP radio tasks and embassy-net"

[features]
default = []
# Exposes the exact pre-publication edge only to diagnostic compositions.
diagnostics = []
# Intrusive per-datagram Core1 cycle/instruction accounting. Diagnostic HIL
# images enable this explicitly; production adapters do not.
tx-phase-telemetry = ["dep:riscv"]

[dependencies]
embassy-net-driver = "0.2.0"
owned-embassy-net-driver = { package = "embassy-net-driver", git = "https://github.com/ermacv/embassy.git", rev = "244b4a3b80cb2f8a02f17b698f0ef4614e5fc01d" }
embassy-sync = "0.8.0"
open-esp-radio-dma = { path = "../../common/dma" }
pin-project-lite = "0.2.17"
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "122e97146fc0a174ef3310f4526defc37663bed4", features = ["async"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "244b4a3b80cb2f8a02f17b698f0ef4614e5fc01d", features = ["medium-ethernet", "proto-ipv4", "std", "udp"] }

[lints]
workspace = true
