[package]
name = "oer-esp32s31-ieee802154-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP-HAL interrupt-route ownership and time for the ESP32-S31 IEEE 802.15.4 MAC"

[features]
default = []
esp32s31 = [
    "dep:critical-section",
    "dep:esp-hal",
]

[dependencies]
critical-section = { version = "1.2.0", optional = true }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "e78b26691cc17ab8ed66e7b57626a6fc393a906c", default-features = false, features = ["esp32s31", "unstable"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "adapter"
platform = "chip"
chip = "esp32s31"
