id = "hil-open-ieee802154-ed-done-selected-write-2026-08-25"
description = "ESP32-S31 rev0 hardware run at repository commit d26e70ee37355d485b989b19c1734170e890b071 on 2026-08-25, recorded in qualification/targets/esp32s31/records/2026-08-25-esp32s31-ieee802154-ed-event.md. The diagnostic-ieee802154-ed-event application had SHA-256 f0d7b2f4db196e63753bf3e04992d8afdbac27e64dd8b86890eecfa4a83a5607 and runtime CRC32 fc2624b2; the schema-1 result had SHA-256 b437528fd9d6f4837c8ee92f12d7bab4f48ca1e0fcb28f110b51c9994f66ddce and passed 3/3 reset-isolated boots. In the bounded event window, EVENT_STATUS 0x0140 became 0x0100 after writing the exact selected image 0x0040, then became zero after the separate TIMER0 write. This qualifies only the literal ED_DONE selected write in that serialized transaction, not whole-register W1C, other event bits, concurrent same-bit arrival, IRQ behavior, STOP, or production PHY/RF readiness."

[[sources]]
id = "hil-open-ieee802154-generated-ed-done-write-2026-08-25"
description = "ESP32-S31 rev0 hardware rerun at repository commit a4f6fd21432a06817dae4c121b869e4624b3fae8 on 2026-08-25, recorded in qualification/targets/esp32s31/records/2026-08-25-esp32s31-ieee802154-generated-ed-done.md. The diagnostic-ieee802154-ed-event application had SHA-256 590a6ce232d617148ff557d7eca23e2d7b747714730bb9d612a0e4c4360563bb and runtime CRC32 9be0ea77; the schema-1 result had SHA-256 af87cbf4bb22a75f70215b75fa8a660ccbdedea51c09fd04152f4914942ec561 and passed 3/3 reset-isolated boots. Its ED_DONE write crossed the reviewed schema-4 selected-register-write generated by Blobray and the production PAC lease, while the independent validation-only TIMER0 write remained separate. EVENT_STATUS 0x0140 became 0x0100 after the exact generated image 0x0040, then zero after TIMER0. This qualifies the generated integration path only within the same serialized boundary; it does not add a whole-register, concurrency, IRQ, STOP, RF-readiness, or repeated-operation claim."
