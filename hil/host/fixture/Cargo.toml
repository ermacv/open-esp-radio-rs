[package]
name = "oer-hil-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Finite Linux Bluetooth and probe helpers for open ESP radio HIL, with their runner contract"

[dependencies]
bt-hci = "=0.10.1"
clap = { version = "4.5", features = ["derive"] }
# bt-hci's `cmd!` expansion names these crates from the caller.
bt-hci-transport = "=0.1.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
fs2 = "0.4"
libc = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }
oer-ieee80211-mac = { path = "../../../crates/protocols/ieee80211/mac" }
oer-process = { path = "../../../tools/process" }
oer-hil-fixture-install = { path = "../fixture-install" }
oer-hil-protocol = { path = "../../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
oer-bluetooth-ll = { path = "../../../crates/protocols/bluetooth/le/ll" }
oer-esp32s31-ieee80211-ap = { path = "../../../crates/roles/esp32s31/ieee80211/ap" }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "host"
