[package]
name = "oer-stand-fixture-install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Privileged Linux fixture installer and fixed launchers for open ESP radio HIL"

[dependencies]
oer-durable = { path = "../../tools/durable" }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs", "process"] }
oer-process = { path = "../../tools/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "stand"
hil = "observation"
# The sudoers allowlist is checked against the helper's operations.
inputs = ["hil/host/linux-net/open-radio-net"]
