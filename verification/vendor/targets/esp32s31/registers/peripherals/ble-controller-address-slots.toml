schema = 2

[[peripherals]]
name = "BLE_CONTROLLER_ADDRESS_SLOTS"
description = """
Three positional six-byte controller address slots. A complete ESP32-S31
ble_phy.c leaf proves the selector range, pair stride, byte packing and write
order. Named callers identify public-address use of slot zero and
random-address use of slot one; slot two remains intentionally unnamed.
"""
baseAddress = 0x2010180C

[[peripherals.registers]]
[peripherals.registers.register]
dim = 3
dimIncrement = 0x8
dimIndex = "0,1,2"
name = "SLOT%s_LOW"
description = "Bytes zero through three of the selected six-byte value, packed in little-endian order and written before the paired high word."
addressOffset = 0x0
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "OCTETS_0_TO_3"
description = "The complete low word assembled from input bytes zero through three."
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]
[peripherals.registers.register]
dim = 3
dimIncrement = 0x8
dimIndex = "0,1,2"
name = "SLOT%s_HIGH"
description = "Bytes four and five of the selected six-byte value in bits 0..15; the complete write clears bits 16..31."
addressOffset = 0x4
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "OCTETS_4_TO_5"
description = "Input bytes four and five packed in little-endian order."
bitOffset = 0
bitWidth = 16

