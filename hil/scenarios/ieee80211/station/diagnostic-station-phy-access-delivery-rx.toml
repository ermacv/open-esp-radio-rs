schema = 4
id = "diagnostic-station-phy-access-delivery-rx"
description = "Access-only PHY maintenance control without PM during RX UDP delivery"
repetitions = 3
image = "diagnostic-rx-delivery"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["phy-maintenance", "diagnostic", "station", "pause", "udp", "ht40"]

[link]
phy = "ht40"

[workload]
kind = "udp"
direction = "rx"
duration_seconds = 12
rx_rate_bps = 65000000
payload_bytes = 1200
station_pause = "access"

[criteria]
exact_delivery = false
minimum_rx_bps = 60000000
maximum_rx_silence_ms = 50
require_no_beacon_loss = true
