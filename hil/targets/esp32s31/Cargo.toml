[workspace]
resolver = "3"
members = [
    "calibration-artifact",
    "agent",
    "telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
debug_assert_with_mut_call = "deny"
# The repository `clippy.toml` lists methods radio code must not call.
disallowed_methods = "deny"

[workspace.dependencies]
oer-ieee80211-softmac = { path = "../../../crates/protocols/ieee80211/softmac" }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
embassy-net-owned = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "4868fd9acfd4191173cd6531b537d6009d3ae5d0", default-features = false, features = ["icmp-ping-reply", "dhcpv4", "medium-ethernet", "ipv4", "ipv4-fragmentation", "ipv4-reassembly", "tcp", "tcp-listener", "udp"] }
xarxa-owned = { package = "xarxa", git = "https://github.com/ermacv/xarxa.git", rev = "9e0e3293724c30c5892e6af56150c849f5231eb2", default-features = false, features = ["udp-rx-queue-count-16"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "0.3"
embedded-io-async = "0.7.0"
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "e78b26691cc17ab8ed66e7b57626a6fc393a906c", default-features = false }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "e78b26691cc17ab8ed66e7b57626a6fc393a906c", default-features = false }
esp-sync = { git = "https://github.com/ermacv/esp-hal", rev = "e78b26691cc17ab8ed66e7b57626a6fc393a906c" }
log = { version = "0.4.27", features = ["max_level_trace", "release_max_level_info"] }
heapless = "0.9.3"
oer = { package = "open-esp-radio", path = "../../../crates/oer", default-features = false, features = ["wifi"] }
oer-network-interface = { path = "../../../crates/network/interface" }
oer-esp32s31-ieee80211-esp-hal = { path = "../../../crates/adapters/esp-hal/esp32s31/ieee80211" }
oer-esp32s31-hal = { path = "../../../crates/hardware/esp32s31/hal" }
oer-esp32s31-radio-esp-hal = { path = "../../../crates/adapters/esp-hal/esp32s31/radio" }
oer-espressif-ieee802154-engine = { path = "../../../crates/hardware/espressif/ieee802154/engine" }
oer-esp32s31-ieee802154-esp-hal = { path = "../../../crates/adapters/esp-hal/esp32s31/ieee802154", features = ["esp32s31"] }
oer-espressif-ieee802154-runtime = { path = "../../../crates/runtime/espressif/ieee802154" }
oer-esp32s31-ieee802154-system = { path = "../../../crates/composition/esp32s31/embassy/ieee802154" }
oer-ieee802154-openthread = { path = "../../../crates/adapters/openthread/ieee802154" }
# The Thread image runs the repository's OpenThread fork over the client.
openthread = { git = "https://github.com/ermacv/openthread", rev = "13538da6b576ed8f1316adbad2196c06e4cf7c99", default-features = false, features = ["isupper"] }
# The C library functions OpenThread links beyond what the Rust core provides.
tinyrlibc = { version = "0.5", default-features = false, features = ["utoa", "strtoul"] }
oer-esp32s31-radio-runtime = { path = "../../../crates/runtime/esp32s31/radio" }
oer-ieee802154 = { path = "../../../crates/protocols/ieee802154" }
oer-esp32s31-executor-embassy = { path = "../../../crates/adapters/embassy/esp32s31/executor", features = ["esp32s31"] }
oer-esp32s31-ieee80211-system = { path = "../../../crates/composition/esp32s31/embassy/ieee80211", default-features = false }
oer-esp32s31-radio-system = { path = "../../../crates/composition/esp32s31/embassy/radio" }
oer-esp32s31-pac = { path = "../../../crates/hardware/esp32s31/pac", features = ["validation-probes"] }
oer-esp32s31-soc-esp-hal = { path = "../../../crates/adapters/esp-hal/esp32s31/soc", features = ["esp32s31"] }
oer-esp32s31-phy = { path = "../../../crates/hardware/esp32s31/phy" }
oer-esp32s31-phy-runtime = { path = "../../../crates/runtime/esp32s31/phy" }
oer-bluetooth-ll = { path = "../../../crates/protocols/bluetooth/le/ll" }
oer-bluetooth-radio = { path = "../../../crates/protocols/bluetooth/le/radio" }
oer-esp32s31-bluetooth = { path = "../../../crates/hardware/esp32s31/driver/bluetooth" }
oer-esp32s31-bluetooth-system = { path = "../../../crates/composition/esp32s31/embassy/bluetooth" }
oer-esp32s31-ieee80211-mac = { path = "../../../crates/hardware/esp32s31/driver/ieee80211/mac" }
oer-embassy-net-owned = { path = "../../../crates/adapters/embassy-net/owned" }
oer-esp32s31-ieee80211-runtime = { path = "../../../crates/runtime/esp32s31/ieee80211", default-features = false }
oer-ieee80211-mac = { path = "../../../crates/protocols/ieee80211/mac" }
oer-ieee80211-sta = { path = "../../../crates/protocols/ieee80211/sta" }
oer-ieee80211-runtime = { path = "../../../crates/runtime/ieee80211" }
oer-hil-protocol = { path = "../../protocol", default-features = false }
oer-hil-image-keys = { path = "../../image-keys" }
oer-hil-trace = { path = "../../trace" }
oer-hil-esp32s31-telemetry = { path = "telemetry" }
portable-atomic = { version = "1.11", default-features = false }
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
static_cell = "2.1.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = true
panic = "abort"
strip = false

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
