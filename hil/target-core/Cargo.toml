[package]
name = "oer-hil-target-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Chip-independent HIL target logic shared by the firmware runtime and its host tests"

[features]
default = []
secure-gatt = ["dep:bt-hci", "dep:embedded-io-async", "dep:gatt-application", "dep:trouble-host"]
# The owned Xarxa stack, as in the HIL runtime that selects this crate's
# `embassy_net` alias.
owned-network = ["dep:embassy-net-owned", "dep:xarxa-owned"]

[dependencies]
crc = "3.3.0"
embassy-sync = "0.8.0"
heapless = "0.9.3"
oer-hil-protocol = { path = "../protocol", features = ["async-io"] }
oer-trace = { path = "../../crates/trace" }
bt-hci = { version = "=0.10.1", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
gatt-application = { package = "oer-example-bluetooth-gatt", path = "../../examples/bluetooth-gatt", optional = true, features = ["secure"] }
trouble-host = { version = "=0.8.0", git = "https://github.com/ermacv/trouble", rev = "a6af435ba1539cead0afce04718ad8a089bcc4b9", optional = true, default-features = false, features = ["default-packet-pool", "gatt", "peripheral"] }
# The same stack pins and features as the HIL target workspace.
embassy-net-owned = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "9c390fa27e636824b935d245810f03856bf5d459", optional = true, default-features = false, features = ["auto-icmp-echo-reply", "dhcpv4", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
xarxa-owned = { package = "xarxa", git = "https://github.com/ermacv/xarxa.git", rev = "c0dcd505662a96de1db4e25741601b62535ea81c", optional = true, default-features = false, features = ["udp-rx-queue-count-16"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }
embedded-io = "0.7.1"
oer-bluetooth-controller = { path = "../../crates/protocols/bluetooth/le/controller" }
oer-bluetooth-hci = { path = "../../crates/protocols/bluetooth/hci" }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "development"
layer = "hil"
platform = "portable"
