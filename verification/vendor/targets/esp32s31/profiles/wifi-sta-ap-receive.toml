schema = 5
case-execution = "independent"
transaction-comparison = "observables"

# The parent has fourteen policy cases; this profile intentionally proves only
# the two reviewed role frontiers required by the open STA/AP composition.
[[profiles]]
name = "wifi-sta-ap-receive-policy"
claim = "reviewed-domain-equivalence"
precondition = "reviewed-receive-policy-selectors"
vendor-source = "wifi-sta-ap-receive"
vendor-symbol = "wifi_set_rx_policy"
rust-symbol = "open_wifi_sta_ap_trace_wifi_set_rx_policy"
compare-return = true
[[profiles.argument-values]]
index = 0
values = [2, 6, 8, 9]
[[profiles.argument-ranges]]
index = 1
min = 0x44332211
max = 0x44332211
[[profiles.argument-ranges]]
index = 2
min = 0x00006655
max = 0x00006655
[[profiles.argument-ranges]]
index = 3
min = 1
max = 2

# Policy two disables only interface-zero receive admission. The address and
# BSSID values are retained and the AP bank is not touched.
[[profiles.cases]]
name = "station-policy-two-disabled"
arguments = [2, 0x44332211, 0x00006655, 1]
mmio-reads = [{ address = 0x20104004, value = 0x12345678 }]
[[profiles.cases.mmio-initial]]
address = 0x20104004
value = 0x12345678
[[profiles.cases.mmio-initial]]
address = 0x20104060
value = 0xa5a50000
[[profiles.cases.mmio-initial]]
address = 0x201040d8
value = 0x0001c285

[[profiles.cases]]
name = "station-policy-two-disabled-mode-two"
arguments = [2, 0x44332211, 0x00006655, 2]
mmio-reads = [{ address = 0x20104004, value = 0x12345678 }]
[[profiles.cases.mmio-initial]]
address = 0x20104004
value = 0x12345678
[[profiles.cases.mmio-initial]]
address = 0x20104060
value = 0xa5a50000
[[profiles.cases.mmio-initial]]
address = 0x201040d8
value = 0x0001c285

[[profiles.cases]]
name = "station-policy-six"
arguments = [6, 0x44332211, 0x00006655, 1]

# g_ic owns a pointer to the active STA context. Policy six follows the
# pointer to the BSSID at context +0x1460, then adds four bytes.
vendor-ram-symbols = [
    { target-symbol = "g_ic", offset = 0, value = 0x3fce2000, observe = false },
    { target-symbol = "g_ic", offset = 0x10, value = 0x3fce4000, observe = false },
    { target-symbol = "g_ic", offset = 0x74, value = 0, observe = false },
]
[[profiles.cases.vendor-ram]]
address = 0x3fce3460
value = 0x3fce3000
[[profiles.cases.vendor-ram]]
address = 0x3fce3004
value = 0x44332211
[[profiles.cases.vendor-ram]]
address = 0x3fce3008
value = 0x00006655
[[profiles.cases.vendor-ram]]
address = 0x3fce4098
value = 5

[[profiles.cases.mmio-initial]]
address = 0x20104000
value = 0x88776655
[[profiles.cases.mmio-initial]]
address = 0x20104004
value = 0x12345678
[[profiles.cases.mmio-initial]]
address = 0x20104060
value = 0xa5a50000
[[profiles.cases.mmio-initial]]
address = 0x201040d8
value = 0x0001c285

# The same policy case selects mode two when the reviewed g_ic word is nonzero.
# The two cases preserve the distinct queue-zero register images selected by
# the reviewed vendor word without assigning that word a protocol name.
