[package]
name = "oer-hil-runner-ieee80211"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Wi-Fi HIL workloads and laptop and OpenWrt fixtures"

[dependencies]
oer-hil-stand = { path = "../stand" }
oer-hil-link = { path = "../link" }
oer-hil-evidence = { path = "../evidence" }
oer-hil-scenario = { path = "../scenario" }
oer-hil-durable = { path = "../durable" }
oer-hil-image-class = { path = "../image-class" }
oer-hil-execution = { path = "../execution" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
mio = { version = "=1.2.2", features = ["os-poll", "os-ext"] }
oer-process = { path = "../../../tools/process" }
oer-hil-fixture = { path = "../fixture" }
tempfile = "3"
oer-hil-protocol = { path = "../../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8.1"

[dev-dependencies]
toml = "1.1"
oer-hil-execution = { path = "../execution", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
hil = "operation"
