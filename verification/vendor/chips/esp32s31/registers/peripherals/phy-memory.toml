schema = 2

[[peripherals]]
name = "PHY_MEMORY"
description = """
Shared PHY table-memory command, data and PBUS group-boundary aperture.
        The same command/data words have mode-dependent PBUS-memory, TX-CFR and
        gain-memory meanings; fields are named only where the complete bodies
        prove a common or mode-independent identity."""
baseAddress = 0x20100800

[[peripherals.registers]]

[peripherals.registers.register]
name = "COMMAND"
description = """
Shared memory command. Bits 20:11 carry the widest evidenced PBUS
            memory command; gain-memory and TX-CFR use narrower subsets."""
addressOffset = 0x44
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "GAIN_COMMAND_LOW_ZERO_UNKNOWN"
description = "Gain-memory writes clear bits 10:0; their individual meanings are unknown."
bitOffset = 0
bitWidth = 11

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x7FF

[[peripherals.registers.register.fields]]
name = "MEMORY_INDEX"
description = "Low eight bits of the PBUS command and complete CFR/gain memory index."
bitOffset = 11
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "GAIN_WRITE_OR_PBUS_COMMAND_BIT_8"
description = "Gain-memory write selector or PBUS command bit 8."
bitOffset = 19
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "PBUS_COMMAND_BIT_9"
description = "PBUS command bit 9; CFR and gain-memory preserve it."
bitOffset = 20
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TX_CFR_COMMIT"
description = "TX-CFR entry commit pulse."
bitOffset = 21
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "DATA_0"
description = "First shared table-memory data word; PBUS-memory and TX-CFR use only this word."
addressOffset = 0x48
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "OPAQUE_DATA"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "DATA_1"
description = "Second gain-memory data word."
addressOffset = 0x4C
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "OPAQUE_DATA"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "DATA_2"
description = "Third gain-memory data word."
addressOffset = 0x50
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "OPAQUE_DATA"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
dim = 6
dimIncrement = 0x4
dimIndex = "0,1,2,3,4,5"
name = "GROUP_BOUNDARY%s"
description = """
Packed first/last entry indices for one even/odd PBUS-memory group
            pair. Six words describe all twelve groups."""
addressOffset = 0x54
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "EVEN_GROUP_FIRST_ENTRY"
bitOffset = 0
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "EVEN_GROUP_LAST_ENTRY"
bitOffset = 8
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "ODD_GROUP_FIRST_ENTRY"
bitOffset = 16
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "ODD_GROUP_LAST_ENTRY"
bitOffset = 24
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

