schema = 2

[[peripherals]]
name = "PMU_RADIO"
description = "Route-owned PMU words used by the reviewed shared radio clock, RF-power and analog-I2C lifecycles. Unrelated PMU words remain platform-owned."
baseAddress = 0x20704000

[[peripherals.registers]]
[peripherals.registers.register]
name = "HP_ACTIVE_ICG_MODEM"
description = "Active-state modem clock-gating selection."
addressOffset = 0x14
size = 32
access = "read-write"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "HP_ACTIVE_DIG_ICG_MODEM_CODE"
description = "Two-bit active-state modem clock-gating code; official ESP-HAL publishes code two for the active configuration."
bitOffset = 30
bitWidth = 2

[peripherals.registers.register.fields.writeConstraint]
useEnumeratedValues = true

[[peripherals.registers.register.fields.enumeratedValues]]
name = "ActiveModemIcgCode"
usage = "read-write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "ACTIVE"
description = "Active-state modem clock-gating code published by official ESP-HAL."
value = 2

[[peripherals.registers]]
[peripherals.registers.register]
name = "HP_ACTIVE_HP_CK_POWER"
description = "Active-state high-power clock and analog-I2C power control reached by the complete front-end/baseband clock body."
addressOffset = 0x1C
size = 32
access = "read-write"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "ROM_OPEN_FE_BB_UNKNOWN_LOW"
description = "Low-nibble image set by complete rev0 ROM phy_open_fe_bb_clk; individual bit semantics remain unknown."
bitOffset = 0
bitWidth = 4

[peripherals.registers.register.fields.writeConstraint]
useEnumeratedValues = true

[[peripherals.registers.register.fields.enumeratedValues]]
name = "FrontEndBasebandClockImage"
usage = "write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "ROM_REQUIRED"
description = "Complete low-nibble image published by the rev0 ROM front-end/baseband clock leaf."
value = 0x0F

[[peripherals.registers.register.fields]]
name = "HP_ACTIVE_XPD_BB_I2C"
description = "Active-state baseband analog-I2C power control."
bitOffset = 22
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "IMM_HP_CK_POWER_0"
description = "Immediate high-power clock ties. The reviewed complete PHY body reads this word before its preserving update, overriding the write-only access class in the uncorrected public SVD."
addressOffset = 0xF0
size = 32
access = "read-write"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "TIE_HIGH_XPD_BB_I2C"
description = "Force the baseband analog-I2C power control high."
bitOffset = 28
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "IMM_SLEEP_SYSCLK"
description = "Immediate sleep/system-clock update commands."
addressOffset = 0xF8
size = 32
access = "write-only"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "UPDATE_DIG_ICG_SWITCH"
description = "Publish the selected digital clock-gating switch state."
bitOffset = 28
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "IMM_MODEM_ICG"
description = "Immediate modem clock-gating update command."
addressOffset = 0x104
size = 32
access = "write-only"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "UPDATE_DIG_ICG_MODEM_EN"
description = "Publish the selected digital modem clock-gating state."
bitOffset = 31
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "RF_PWC"
description = "RF circuit power control."
addressOffset = 0x184
size = 32
access = "read-write"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "XPD_RF_CIRCUIT"
description = "Sixteen RF circuit power-control bits."
bitOffset = 16
bitWidth = 16

[peripherals.registers.register.fields.writeConstraint]
useEnumeratedValues = true

[[peripherals.registers.register.fields.enumeratedValues]]
name = "RfCircuitPower"
usage = "read-write"

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "POWERED_OFF"
description = "Clear every reviewed RF circuit power-control bit."
value = 0

[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "POWERED_ON"
description = "Set every reviewed RF circuit power-control bit."
value = 0xFFFF

[[peripherals.registers]]
[peripherals.registers.register]
name = "ANA_PERI_PWR_CTRL"
description = "Analog peripheral I2C power and active-low reset control."
addressOffset = 0x208
size = 32
access = "read-write"
resetValue = 0x40000000

[[peripherals.registers.register.fields]]
name = "XPD_PERIF_I2C"
description = "Analog peripheral I2C power control."
bitOffset = 30
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "RSTB_PERIF_I2C"
description = "Analog peripheral I2C active-low reset release."
bitOffset = 31
bitWidth = 1

