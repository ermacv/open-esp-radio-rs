[package]
name = "oer-esp32s31-wifi-sta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 Wi-Fi station composition"

[dependencies]
critical-section = "1.2.0"
oer-esp32s31-hal = { path = "../../../hal" }
oer-esp32s31-phy = { path = "../../../phy" }
oer-esp32s31-wifi-mac = { path = "../mac" }
oer-esp32s31-wifi-dma = { path = "../dma" }
oer-esp32s31-wifi = { path = ".." }
oer-ieee80211 = { path = "../../../../../protocols/ieee80211/mac" }
oer-wifi-softmac = { path = "../../../../../protocols/ieee80211/softmac" }
oer-wpa2 = { path = "../../../../../protocols/ieee80211/security/wpa2" }
oer-wifi-sta = { path = "../../../../../protocols/ieee80211/sta" }
static_cell = "2.1.1"

[features]
default = []
task-poll-telemetry = [
    "dep:riscv",
    "oer-esp32s31-wifi/task-poll-telemetry",
]

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true

[package.metadata.open-radio]
scope = "production"
layer = "hardware"
platform = "esp32s31"
