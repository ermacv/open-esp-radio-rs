schema = 5
id = "diagnostic-station-phy-calibration-task-poll"
description = "Combined PHY calibration with Core0 task residence under sustained RX delivery"
repetitions = 3
transfer = "identical-image"
tags = ["phy-maintenance", "diagnostic", "station", "pause", "udp", "ht40", "task-poll"]

[wifi]
image = "diagnostic-task-poll"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { rx_bps = 65000000 }

[wifi.workload.maintenance]
operation = "calibration"

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 60000000
maximum_rx_silence_ms = 50
