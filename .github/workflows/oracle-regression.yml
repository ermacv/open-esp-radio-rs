name: Private oracle regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/esp32s31/**"
      - "hil/esp32s31/trace-probes/**"
      - "hil/vendor-oracle/esp32s31/trace-elf/**"
      - "svd/**"
      - "tools/vendor-code-validator/**"
      - ".github/workflows/oracle-regression.yml"

permissions:
  contents: read

jobs:
  qualify:
    # This environment should require approval. The dedicated runner exposes
    # authenticated proprietary inputs read-only at ESP32S31_ORACLE_ROOT and never
    # executes pull-request code.
    environment: oracle-regression
    runs-on: [self-hosted, linux, x64, esp32s31-oracles]
    timeout-minutes: 30
    env:
      ESP32S31_ORACLE_ROOT: /opt/open-esp-radio/oracles/esp32s31
      ESP32S31_ROM_SHA256: ${{ vars.ESP32S31_ROM_SHA256 }}
      ESP32S31_LIBPHY_SHA256: ${{ vars.ESP32S31_LIBPHY_SHA256 }}
      VALIDATOR_RUN_SPEC: ${{ runner.temp }}/esp32s31-oracle.run
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --target riscv32imafc-unknown-none-elf
          --component rust-src
      - run: rustup default 1.97.1
      - name: Authenticate caller-owned oracle inputs
        run: |
          test -n "$ESP32S31_ROM_SHA256"
          test -n "$ESP32S31_LIBPHY_SHA256"
          test -r "$ESP32S31_ORACLE_ROOT/libphy.a"
          test -r "$ESP32S31_ORACLE_ROOT/esp32s31_rev0_rom.elf"
          printf '%s  %s\n' "$ESP32S31_ROM_SHA256" "$ESP32S31_ORACLE_ROOT/esp32s31_rev0_rom.elf" | sha256sum --check --strict
          printf '%s  %s\n' "$ESP32S31_LIBPHY_SHA256" "$ESP32S31_ORACLE_ROOT/libphy.a" | sha256sum --check --strict
      - name: Attach read-only oracle inputs
        run: |
          ln -s "$ESP32S31_ORACLE_ROOT" _oracles
      - name: Build pinned vendor oracle ELF
        run: >-
          cargo build --manifest-path hil/vendor-oracle/esp32s31/Cargo.toml
          -p open-esp-radio-vendor-oracle-esp32s31-trace-elf
          --target riscv32imafc-unknown-none-elf --release
      - name: Build Rust trace probes
        run: >-
          cargo build --manifest-path hil/esp32s31/Cargo.toml
          -p open-esp-radio-hil-esp32s31-trace-probes-elf
          --target riscv32imafc-unknown-none-elf --release
      - name: Bind caller-owned validation inputs
        run: |
          printf '%s\n' \
            'schema 1' \
            "input rom-artifact $ESP32S31_ORACLE_ROOT/esp32s31_rev0_rom.elf" \
            "input archive-artifact $GITHUB_WORKSPACE/hil/vendor-oracle/esp32s31/target/riscv32imafc-unknown-none-elf/release/open-esp-radio-vendor-oracle-esp32s31-trace-elf" \
            "input archive-inventory $ESP32S31_ORACLE_ROOT/libphy.a" \
            "input rom-companion $GITHUB_WORKSPACE/hil/vendor-oracle/esp32s31/target/riscv32imafc-unknown-none-elf/release/open-esp-radio-vendor-oracle-esp32s31-trace-elf" \
            "input archive-companion $ESP32S31_ORACLE_ROOT/esp32s31_rev0_rom.elf" \
            "input rust-artifact $GITHUB_WORKSPACE/hil/esp32s31/target/riscv32imafc-unknown-none-elf/release/open-esp-radio-hil-esp32s31-trace-probes-elf" \
            > "$VALIDATOR_RUN_SPEC"
      - name: Run authenticated regression qualification
        run: |
          set -o pipefail
          cargo run --quiet --manifest-path tools/vendor-code-validator/Cargo.toml -- \
            verify inventory \
            --target-spec validation/esp32s31/target.spec \
            --run-spec "$VALIDATOR_RUN_SPEC" \
            --gate regression --match-floor 104 \
            --json-report oracle-regression.json \
            | tee oracle-regression.log
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32s31-oracle-regression
          path: |
            oracle-regression.json
            oracle-regression.log
          if-no-files-found: warn
