[[sources]]
id = "HIL_OPEN_HE_RATE_CONTROL_ACK_SNR_2026_07_30"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, open PHY/MAC, standard psram-code-psram-data profile and FRITZ!Box 7530 FN HE20 channel 1, 2026-07-30. The owned Dot11Ax/1 schedule selected rate byte 0x19; the typed arena decoder published HE MCS9, two LTFs/1600 ns and peer-qualified LDPC at 108.3 Mbit/s. The first three-member A-MPDU received BlockAck bitmap 0x7 and its successful PRIMARY completion decoded ACK-SNR sample 70. DHCP completed in 7 ms; a following 100-packet ICMP run had zero loss and 4.244 ms average RTT."

[[sources]]
id = "HIL_OPEN_STA_RATE_CONTROL_2026_07_30"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, open PHY/MAC, standard psram-code-psram-data profile and nearby FRITZ HE20 peer, 2026-07-30. The generated PAC plus complete ROM/wDev transform read -92 dBm, scan RSSI was -20 dBm and the blob-compatible signed-byte metric was 72. The Rust-owned association selected Dot11Ax schedule 1, rate code 0x19, maximum schedule 13, 16 entries and BF report mode/rate 1/16. WPA2/CCMP, TID0/TID7/TID5 AddBA, a three-subframe TX A-MPDU and DHCP completed; 100/100 ICMP packets completed with 3.692 ms mean RTT and zero driver RX drops or duplicates."

[[sources]]
id = "HIL_OPEN_RX_BLOCK_ACK_DIRECT_BANK_2026_07_30"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, fully open PHY/MAC, standard psram-code-psram-data profile and FRITZ!Box 7530 FN HE20 channel 1, 2026-07-30. The AP requested TID0 RX BlockAck at starting sequence five and negotiated window sixteen. Immediately after the open driver programmed ordinary bank zero, typed PAC readback at 0x20104274 reported control 0xc0000001, peer dc:15:c8:54:bc:1e, interface zero, window sixteen, current and loaded sequences five, and zero bitmaps. After two independent 500-packet ICMP receive runs, the hardware-maintained current-sequence word advanced first to 491 and then to 992 while the loaded starting sequence remained five. This qualifies the direct-bank geometry, field packing, publication update bit and live-state/load split; it does not qualify the separate extra-SoftAP staging path."

[[sources]]
id = "HIL_OPEN_RX_STATISTICS_BASELINE_2026_07_29"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile, complete open PHY and MAC, controlled AX211 HE20 WPA2 AP on channel 11, 2026-07-29. After HE association, WPA2, successful TID0 AddBA window 32 and one complete 30-profile HE matrix round, the typed snapshot observed MPDU 6216, end 6197, data-success 286, FCS 42, power-drop 42, HT-SIG error 8, HE-SIG-A CRC 1, ACK interrupt 25 and RTS interrupt 6. FIFO overflow, buffer full, TKIP, abort and all four hang/panic counters were zero. The color bitmap had bit 25 set, threshold one and timeout 60 seconds. Four subsequent 30-profile matrix rounds remained clean."

[[sources]]
id = "HIL_OPEN_HE_RX_CONFIGURATION_BASELINE_2026_07_29"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile, complete open PHY and MAC, controlled AX211 HE20 WPA2 AP on channel 11, 2026-07-29. After HE association, WPA2, TID0 AddBA and one clean 30-profile matrix round, the allocation-free dbg_read_rx_misc snapshot observed MPDU length offset 380, NFRP threshold 8, hardware TXOP, BSR update, TB stop, TRS, UL MU and UL MU data both enabled, HE response ACK enabled, RX frequency-hop time 50, PHY signal delay 20, intra-BSS-color and intra-PPDU power save enabled, and HE beamforming with BFRP time 16, NDP time 113, hardware sequence selector 5. RX power-save itself and all three custom RX types were disabled. Trigger/TB counters and all hang/panic counters remained zero."

[[sources]]
id = "HIL_OPEN_HE_TB_COUNTER_BASELINE_2026_07_29"
description = "../esp32s31_rust open-radio-phy-prelude-hil on ESP32-S31 rev0 against the controlled Linux AX211 HE20 AP, 2026-07-29. After HE association, WPA2/CCMP setup and more than nineteen complete three-profile DCM A-MPDU rounds, two independent ten-second snapshots both reported RX_TRIGGER_COUNT=0, TB_TRANSMISSION_COUNT=0 and TB_QOS_NULL_COUNT=0. WDEVAXTBDIAG0..3 also remained all zero. This proves the typed read path and a no-Trigger baseline; it does not qualify OFDMA because this ordinary AP configuration did not schedule uplink Trigger frames."

[[sources]]
id = "HIL_OPEN_HE_BSR_TID_LIFECYCLE_2026_07_29"
description = "../esp32s31_rust open-radio-phy-prelude-hil on ESP32-S31 rev0 against the controlled Linux AX211 HE20 AP, 2026-07-29. The fully open STA completed HE association, WPA2/CCMP and a TID0 AddBA response with window 32. Applying the complete vendor TID-bitmap edge at the transition to Operational produced two independent snapshots with WDEVTXQBSR_CTRL TID_BITMAP=0x01. Hardware/software BSR values and validity bits remained zero because the AP sent no Trigger frames. Twenty-four complete three-profile DCM A-MPDU rounds reported zero failures, qualifying the TID0 lifecycle write without an HE SU regression; this does not qualify OFDMA scheduling."

[[sources]]
id = "HIL_OPEN_HE_TB_QUEUE_PUBLICATION_2026_07_30"
description = "../esp32s31_rust firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile, fully open PHY/MAC against FRITZ!Box 7530 FN HE20 on channel 6, 2026-07-30. The STA completed WPA2/CCMP and TID0 AddBA window 32, then prepared 32 owned 1472-byte MSDUs using the complete ROM mac_tx_set_tb order. PAC readback before the HE queue doorbell observed logical queue two, TID0, TB_ENA=1, MU-EDCA selector two and enabled timer, contiguous MPLEN links 0 through 31 with first PSDU length 1512 and terminal link 31, plus WDEVTXQBSR_CTRL validity bit two set. The programmed WDEVTXQBSR_SW value was 47104 but its immediate post-validity read was zero; removing a non-oracle fence and reproducing the exact ROM SW(BSR), LW(CONTROL), SW(CONTROL) sequence did not change that result. The following ordinary HE20 MCS9 PPDU received a complete 32-bit BlockAck and sustained roughly 70-77 Mbit/s. RX_TRIGGER_COUNT and TB transmission counters remained zero because this AP emitted no Trigger. This qualifies the queue/link/validity publication and no-SU-regression boundary, but not the BSR read-latch semantics or over-air TB/OFDMA transmission."

[[sources]]
id = "HIL_OPEN_REGDMA_LINK4_2026_07_29"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs switch_channel_with_mac_restart on ESP32-S31 rev0, psram-code-psram-data profile, 2026-07-29. An exact working vendor pre-auth snapshot read 0x2010d83c=0x080801ff (ACTIVE_LINK=4), while the failing open path read 0x080001ff (ACTIVE_LINK=0). Restoring the complete ic_mac_init link-four tail produced first-attempt Authentication, Association, WPA2 and DHCP at the ordinary 80-quarter-dBm limit; 200/200 ICMP echoes completed with 0 percent loss and 4.539 ms average RTT. The accumulated open TX counters were 211 immediate successes, three recovered ACK retries, zero other failures and zero hardware timeouts."

[[sources]]
id = "HIL_OPEN_HE_CONTROL_METADATA_2026_07_30"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs open-radio-phy-prelude-hil on ESP32-S31 rev0 with the complete open PHY/MAC, standard psram-code-psram-data profile and Android shiva HE20/WPA2 AP on channel 6, captured in /tmp/open-radio-he-control-metadata-ch6-20260730.log and /tmp/open-radio-he-control-metadata-ch6-air-20260730.pcapng. The Rust A-MPDU builder kept CCMP immediately after the 26-byte QoS header, left the low fourteen-bit DMA MPDU length unchanged and set metadata byte seven bit zero. The driver completed WPA2, its first protected ARP on attempt one, immediate static-address network bring-up, and the first HE20 MCS9 aggregate with 32 of 32 MPDUs acknowledged on attempt one. Air frame 843, repeated as frame 78088 after a clean reset, contained Frame Control 0x88c1, QoS 0x0000, hardware BSR HE-Control bytes 4f 00 03 03, then intact CCMP bytes 09 00 00 20 00 00 00 00; tshark decrypted it as the expected ARP request. Eight subsequent ICMP replies likewise carried hardware BSR, decrypted successfully and had no retries or packet loss. This independently hardware-qualifies the vendor-equivalent metadata contract and rules out a software DMA placeholder."

[[sources]]
id = "HIL_OPEN_HE20_MCS0_DCM_SMPDU_2026_07_29"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile with complete open PHY and MAC, controlled AX211 HE20 WPA2 AP on channel 11, 2026-07-29. After open scan, HE association, WPA2 and DHCP, the typed owner submitted one 24-byte non-QoS HE20 BCC DCM MCS0 S-MPDU using the exact bounded vendor DMA layout. Hardware completion returned status zero, proving ordinary ACK reception. The synchronous queue snapshot carried rate 0x1a, PLCP0 format one at 0x01636230 with only the live descriptor-address bits differing from vendor, PLCP1 0x0401a000, HE-SIG-A1 0xfc204087, HE-SIG-A2 0x00010105, power 0x14141314 and LENGTH_CONTROL 0x004002c4. The immediately following two-MPDU DCM A-MPDU retained status five and no BlockAck for all three supported GI/LTF profiles, localizing the remaining DCM failure to aggregate construction or BA handling rather than PHY, power, HE-SIG or DCM coding."

[[sources]]
id = "HIL_OPEN_HE20_MCS0_DCM_AMPDU_2026_07_29"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile with complete open PHY and MAC, and a nearby OnePlus IN2023 Android-13 HE20 WPA2 SoftAP on channel 11, 2026-07-29. Android reported Ieee80211axEnabled=true; the association HE PHY capability advertised BPSK DCM receive, and the open path completed WPA2, protected RX and DHCP before the probe. A separate typed MCS0 DCM S-MPDU first received an ordinary ACK. The matrix then used valid minimum Ethernet bodies so the exact zero-TXOP ROM APEP table, blob DCM-halving branch and owned delimiter/MPDU/MIC/FCS accumulator admitted real multi-subframe aggregates: 30 MPDUs at 2xLTF/0.8 us, 29 at 2xLTF/1.6 us and 26 at 4xLTF/3.2 us. The first 30-MPDU aggregate completed with status zero, acknowledged all 30 sequence numbers and required one attempt. Twenty-seven complete bounded rounds, each containing 64 aggregates at every supported GI/LTF profile, reported zero failed profiles and zero terminal retry failures. This qualifies BPSK DCM S-MPDU and multi-subframe A-MPDU TX, APEP bounding, BlockAck and aggregate retry; the peer did not advertise QPSK or 16-QAM DCM receive, so MCS1 and MCS3 remain unqualified."

[[sources]]
id = "HIL_OPEN_HE20_MCS9_AMPDU_2026_07_29"
description = "../esp32s31_rust open-radio-phy-prelude-hil on ESP32-S31 rev0 and the same nearby FRITZ!Box HE20 WPA2 BSS, 2026-07-29. The fully open PHY/MAC path associated as HE20, installed the recovered HE peer state, then published selector-one GI/LTF, descriptor rate 0x23/MCS9 and 32 owned CCMP MPDUs through the typed HE queue program. The first aggregate completed with status zero and a full BlockAck bitmap 0x00000000ffffffff on its first attempt. A sustained raw-MAC run exceeded 13,800 aggregates with tx_ampdu_partial zero, RX dropped zero and five-second Ethernet-payload windows of 83.6 to 87.5 Mbit/s. This qualifies the complete bounded HE SU q0 image and its ordered PAC publication, not OFDMA, DCM, LDPC, STBC or beamforming."

[[sources]]
id = "HIL_OPEN_HE20_STBC_NSTS_2026_07_30"
description = "../esp32s31_rust firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile, fully open PHY/MAC against the nearby FRITZ!Box HE20 WPA2 BSS, 2026-07-30. During a controlled 10-Mbit/s UDP downlink the RX owner captured HE-SIG-A1 0x00e0591b and HE-SIG-A2 0x4a0c for HE-SU MCS3, and later 0x00a0594b/0x520c for MCS9. Both vectors set STBC and encode bits 25:23 as one. Because the S31 is 1T1R, this is two space-time streams generated from one spatial stream and independently disproves the previous unconditional spatial_streams_minus_one label."

[[sources]]
id = "HIL_OPEN_HE20_MCS9_EMPTY_DELIMITERS_2026_07_29"
description = "../esp32s31_rust open-radio-phy-prelude-hil on ESP32-S31 rev0, standard psram-code-psram-data profile, complete open PHY and MAC, controlled AX211 HE20 WPA2 AP on channel 11, 2026-07-29. A deterministic 32-MPDU protected-QoS aggregate used 54-byte PSDUs, HE20 MCS9, 2xLTF/0.8-us GI and an explicit 16-us density. Complete blob arithmetic produced minimum subframe length 230, 43 empty four-byte delimiters after every non-final MPDU and APEP length 7250. Keeping the old fixed queue PROTECTION value 0x31 produced completion status four and zero acknowledged MPDUs after four attempts. Changing only all three PROTECTION lanes to 230 produced status zero, a first-attempt BlockAck bitmap 0x00000000ffffffff and then more than 13,000 acknowledged MPDUs without final retry failure. This A/B HIL qualifies metadata-byte-four delimiter generation, final-tail APEP accounting and the descriptor-offset-0x28 to PROTECTION-lane mapping together."

[[sources]]
id = "HIL_OPEN_HT_AMPDU_DIRECT_2026_07_29"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile with ISR and DMA audited in internal SRAM, complete open PHY and MAC, controlled Linux WPA2 AP on channel 11 HT40-, 2026-07-29. The Rust STA initiated a TID-0 immediate BlockAck agreement with window four, retained separate pinned storage for single and aggregate submission, and transmitted four observed two-MPDU A-MPDUs at HT40 MCS7 SGI. Every completion reported both submitted sequence bits through a BlockAck bitmap ending in 0x000f, with zero aggregate hardware timeouts. The same run continued using the single-MPDU path whenever only one network frame was queued. This qualifies the open direct-DMA descriptor head, PLCP format two, aggregate HT-SIG/length class, descriptor-count two and BlockAck-before-completion-clear ordering; it does not yet qualify partial-BlockAck retry or a throughput ceiling."

[[sources]]
id = "HIL_OPEN_HT_AMPDU_32_RETRY_2026_07_29"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile with ISR and DMA audited in internal SRAM, complete open PHY and MAC, controlled Linux WPA2 AP on channel 11 HT40-, 2026-07-29. The peer HT A-MPDU parameter byte was 0x17, maximum-length exponent three. Applying the complete rcUpdateAMPDUParam mapping allowed the open owner to submit 32 full-size MPDUs totaling 48,448 aggregate bytes; the first completion returned starting sequence 2717 and bitmap 0x00000000ffffffff. PTI remained 0x00111110, proving its count one is independent of the 32 values in HT_DESCRIPTOR_COUNTS. Replacing individual missing-MPDU retries with the ppResortTxAMPDU-compatible retained retry aggregate reduced partial original submissions from 352/1044 to 50/2748 and raised HT40 MCS7 LGI UDP enqueue throughput from 38-41 to 49.6-55.2 Mbit/s. HT40 MCS7 SGI then produced 53.1-59.3 Mbit/s and Linux independently reported RX bitrate 150.0 Mbit/s MCS7 40MHz short GI. No aggregate hardware timeout occurred."

[[sources]]
id = "HIL_OPEN_HT_AMPDU_RAW_CADENCE_2026_07_29"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile, complete open PHY and MAC, controlled Linux WPA2 AP on channel 11 HT40-, 2026-07-29. A raw protected-QoS profile retained real CCMP, Sequence Control, DMA, 30-MPDU A-MPDU and BlockAck handling but removed Embassy UDP/IP production. It delivered 63.6-76.8 Mbit/s of 1472-byte Ethernet payload at MCS7 40MHz short GI. Across 3811 original aggregates, cadence averaged 5194 us per original and 3201 us from each hardware-submit edge to completion; 5087 aggregate attempts give 1.335 attempts per original. This matches the separately retained vendor direct-TX range 59.3-75.5 Mbit/s and localizes the remaining 100-Mbit/s gap to serialized preparation/completion plus missing-BlockAck retries rather than the former 21-MPDU byte ceiling."

[[sources]]
id = "HIL_OPEN_HT_SINGLE_EXTREMES_2026_07_29"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile with ISR and DMA audited in internal SRAM, complete open PHY and MAC, controlled Linux WPA2 AP on channel 11. HT20 MCS0 LGI completed first-attempt Authentication, Association, WPA2 and DHCP; 200/200 ICMP replies completed at 2.483-ms average RTT, while the open TX counters recorded 210 immediate successes, two recovered ACK retries, zero other failures and zero hardware timeouts over 212 attempts. HT40 MCS7 SGI then negotiated 150 Mbit/s in both directions; 500/500 ICMP replies completed at 2.203-ms average RTT, while open TX recorded 510 immediate successes and two recovered ACK retries over 512 attempts. These are single-MPDU results. They hardware-qualify PLCP format one and both extreme MCS/CBW/GI encodings; they do not qualify the separate A-MPDU constructor."

