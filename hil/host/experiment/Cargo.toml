[package]
name = "oer-hil-experiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL experiments: the one run launch, A/B comparisons and bisection"

[dependencies]
oer-durable = { path = "../../../tools/durable" }
oer-hil-analysis = { path = "../analysis" }
oer-hil-arbiter = { path = "../arbiter" }
oer-hil-image = { path = "../image" }
oer-hil-image-class = { path = "../image-class" }
oer-hil-observer = { path = "../../observer", features = ["producer"] }
oer-hil-run-bundle = { path = "../run-bundle" }
oer-hil-schema = { path = "../../schema" }
oer-hil-source-snapshot = { path = "../source-snapshot" }
oer-hil-stand-model = { path = "../../stand/model" }
oer-process = { path = "../../../tools/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
oer-hil-run-bundle = { path = "../run-bundle", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "orchestration"
hil = "orchestration"
# The tests read this checkout's wire lock.
inputs = ["hil/protocol/messages.lock"]
