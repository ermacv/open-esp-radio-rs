[package]
name = "oer-hil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The `cargo hil` command line: argument parsing and calls into the stand, run store, analysis and experiment packages"

[dependencies]
oer-chip-profile = { path = "../../../tools/chip-profile" }
oer-command-tree = { path = "../../../tools/command-tree", features = ["clap"] }
oer-hil-arbiter = { path = "../arbiter" }
oer-hil-board = { path = "../board" }
oer-hil-flash = { path = "../flash" }
oer-hil-run-bundle = { path = "../run-bundle" }
oer-hil-analysis = { path = "../analysis" }
oer-hil-experiment = { path = "../experiment" }
oer-image = { path = "../../../tools/image" }
oer-hil-schema = { path = "../../schema" }
oer-hil-observer = { path = "../../observer", features = ["producer"] }
oer-hil-lab = { path = "../lab" }
oer-hil-link = { path = "../link" }
oer-hil-stand-model = { path = "../../stand/model" }
oer-hil-stand-host = { path = "../stand-host" }
oer-durable = { path = "../../../tools/durable" }
oer-process = { path = "../../../tools/process" }
clap = { version = "=4.5.48", features = ["derive"] }
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
toml = "=1.1.4"

[dev-dependencies]
oer-hil-run-bundle = { path = "../run-bundle", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "entry"
hil = "operation"
# The tests read the workspace Cargo configuration and the ESP-IDF firmware
# catalog.
inputs = [
    ".cargo/config.toml",
    "hil/peers/*/firmware.toml",
    "hil/bootloaders/*/firmware.toml",
    "verification/*/hil-vendor/*/firmware.toml",
]
