schema = 3
id = "access-point-single-client-ceiling-bidirectional"
description = "Single-client AP HT40 MCS7 saturated bidirectional UDP qualification"
repetitions = 3
image = "qualification"
isolation = "reset"
data_plane = "single-core"
tags = ["qualification", "characterization", "wifi", "access-point", "network", "single-client", "ht40", "ceiling", "bidirectional"]

[link]
phy = "ht40"
minimum_mcs = 7

[workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 120

[workload.traffic]
kind = "udp"
direction = "bidirectional"
