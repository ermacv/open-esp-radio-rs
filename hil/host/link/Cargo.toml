[package]
name = "oer-hil-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL host/target link: one session with the board under test (UART capture, generic exchange, readiness, reboots) and the reference peers' line console"

[features]
# The capture fixtures of other packages' tests; the fake target reports the
# correctness image's keys.
test-support = ["dep:oer-hil-image-class"]

[dependencies]
oer-durable = { path = "../../../tools/durable" }
oer-hil-image-class = { path = "../image-class", optional = true }
oer-hil-protocol = { path = "../../protocol", features = ["registry"] }
oer-process = { path = "../../../tools/process" }
mio = { version = "=1.2.2", features = ["os-poll", "os-ext"] }
postcard = { version = "1.1.3", default-features = false }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.8.1", default-features = false }
zeroize = "1.8.1"

[dev-dependencies]
oer-hil-image-class = { path = "../image-class" }
postcard-schema = { version = "0.2.5", features = ["derive"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "execution"
hil = "observation"
