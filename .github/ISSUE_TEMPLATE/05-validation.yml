name: "Validation"
description: "Evaluate a named subject against declared criteria."
labels: ["triage:incomplete","kind:validation"]
body:
  - type: markdown
    attributes:
      value: "Name one accepted result. Choose classification before submitting. Research and implementation do not establish hardware readiness."
  - type: textarea
    id: claim
    attributes:
      label: "Claim and subject"
      description: "The property under evaluation, exact implementation/image/source identity and scope of the claim."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Primary area"
      description: "The owner of the result."
      options: ["area:wifi","area:bluetooth","area:ieee802154","area:radio","area:registers","area:platform","area:tooling","area:hil"]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "Choose explicitly: P0 interrupts, P1 blocks the selected result, P2 is useful backlog, P3 needs an activation trigger."
      options: ["priority:P0","priority:P1","priority:P2","priority:P3"]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Owner and scope"
      description: "Name defining paths, canonical package.metadata.open-radio.layer, target/revision/profile and exclusions."
      placeholder: "Owner paths:\nLayer (package.metadata.open-radio.layer):\nTarget / revision / profile:\nOut of scope:"
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: "Method, apparatus and criteria"
      description: "Measurements, predeclared tolerances, repetitions, fixture/board/profile and required inputs."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "Required evidence and evaluator"
      description: "Where reproducible evidence is retained and who evaluates it; name failure/inconclusive outcomes and their next step."
    validations:
      required: true
  - type: textarea
    id: relations
    attributes:
      label: "Relations and activation"
      description: "Parent, blockers with the exact required artifact, related work, and any future activation trigger."
      placeholder: "Part of:\nBlocked by (artifact and consuming step):\nRelated:\nActivation trigger:"
    validations:
      required: false
