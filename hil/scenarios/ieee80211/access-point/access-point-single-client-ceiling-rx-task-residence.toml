schema = 5
id = "access-point-single-client-ceiling-rx-task-residence"
description = "Production-like single-client AP HT40 UDP receive ceiling and Core0 residence diagnostic"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "split-core", "ceiling", "rx", "task-poll"]

[wifi]
image = "diagnostic-task-residence"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 130000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 95000000
