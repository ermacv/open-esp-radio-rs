schema = 5
id = "wifi-monitor-lifecycle"
description = "Station to monitor ownership transition and station restoration"
role = "investigation"
tags = ["wifi", "monitor", "lifecycle"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "role"
link = { phy = "ht40" }
timeout_seconds = 90
operation = { kind = "monitor", dwell_seconds = 3, snapshot_length = 256 }
