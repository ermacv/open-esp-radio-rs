schema = 5
id = "diagnostic-station-absence-pm-short-rx"
description = "RX diagnostic isolation: 2 ms acknowledged PM absence"
repetitions = 1
transfer = "identical-image"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1200
offer = { rx_bps = 65000000 }

[wifi.workload.maintenance]
operation = { synthetic = { duration_micros = 2000, notify_ap = true } }

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 10000000
