schema = 2

[[peripherals]]
name = "PHY_FREQUENCY_CHANNEL_ORACLE"
description = """
Frequency-memory, hardware channel-switch, NRX and channel-bandwidth
        registers recovered from complete finite ROM/blob bodies. Names retain
        UNKNOWN where the instructions prove a field but not its electrical
        meaning. One physical word has one identity even when a bit has
        different mode-dependent roles."""
baseAddress = 0x20100000

[[peripherals.registers]]

[peripherals.registers.register]
name = "FREQUENCY_CONTROL"
description = """
Shared frequency module control word. Bit 18 is both the high bit
            of an eleven-bit command-memory address and the reset/release bit
            pulsed by phy_freq_module_resetn."""
addressOffset = 0x1C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "CHANNEL_INDEX"
description = "Complete phy_freq_chan_en_sw replaces the low byte with the caller's frequency-table index."
bitOffset = 0
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "MEMORY_ADDRESS_LOW_UNKNOWN"
description = "Low ten bits of the eleven-bit address selected by phy_freq_i2c_mem_write."
bitOffset = 8
bitWidth = 10

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3FF

[[peripherals.registers.register.fields]]
name = "MEMORY_ADDRESS_HIGH_OR_MODULE_RESET_UNKNOWN"
description = "High address bit during frequency-memory writes; independently cleared then set by complete phy_freq_module_resetn."
bitOffset = 18
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CHANNEL_SWITCH_PULSE"
description = "Complete phy_freq_chan_en_sw sets bit 19, delays one microsecond, then clears it."
bitOffset = 19
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "MEMORY_WRITE_PULSE"
description = "Complete phy_freq_i2c_mem_write sets then clears bit 20 after publishing data."
bitOffset = 20
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "REGISTER_MODE_UNKNOWN"
description = "Complete phy_freq_reg_init replaces bits 29:22 with its two input nibbles; the electrical encoding is unknown."
bitOffset = 22
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "MODULE_ENABLE_UNKNOWN"
description = "Complete phy_freq_reg_init sets bit 30."
bitOffset = 30
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "HARDWARE_FREQUENCY_DISABLE"
description = "Complete phy_dis_hw_set_freq sets bit 31 before its two-microsecond delay; complete phy_en_hw_set_freq clears it."
bitOffset = 31
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "FREQUENCY_MEMORY_READ_CONTROL"
description = "Complete phy_read_rf_freq_mem pulses bit 16 after publishing the address and read mode; all other bits remain preserved and unnamed."
addressOffset = 0x20
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "READ_PULSE"
description = "Set and then cleared by complete phy_read_rf_freq_mem for one synchronous frequency-memory read transaction."
bitOffset = 16
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "FREQUENCY_PARAMETER_0_OPAQUE"
description = "Complete phy_freq_reg_init writes the full constant 0x19800249; no constituent electrical fields are public."
addressOffset = 0x24
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "OPAQUE_VALUE"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "FREQUENCY_PARAMETER_1_STATUS"
description = "Complete phy_freq_reg_init writes 0x25824e58; phy_bb_init replaces the low baseband-mode field, and the open channel state machine samples bit 8 for the evidenced ready edge."
addressOffset = 0x28
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BASEBAND_MODE_UNKNOWN"
description = "Complete phy_bb_init writes encoding two before calibration and zero after the initial channel setup."
