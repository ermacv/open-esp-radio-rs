schema = 2

[[peripherals]]
name = "BLUETOOTH_CONTROLLER_CORE"
description = """
Bluetooth controller-core register view grouped by runtime responsibility rather
than vendor object boundaries. It owns task-side scheduler, sleep-timer,
controller initialization, memory-list, scan-snapshot and ISO-coexistence state
reached through the 0x20101000 physical block. Interrupt programming,
enable/status, acknowledgement and fault diagnostics belong exclusively to
BLUETOOTH_INTERRUPT_BANK; the two scheduler words accessed by the hard handler
belong exclusively to BLUETOOTH_SCHEDULER_INTERRUPT_RUNTIME.
"""
baseAddress = 0x20101000

