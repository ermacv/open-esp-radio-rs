# Complete branch-domain proof for the five reviewed `g_coex_param`
# durations. The cases cover the null-output boundary, every accepted event,
# and one rejected event in each gap around the accepted selector set.
[[profiles]]
name = "coex-core-event-duration-get"
vendor-source = "coex"
vendor-symbol = "coex_core_event_duration_get"
rust-symbol = "open_coex_core_trace_event_duration_get"
contract = "state"
compare-return = true
[[profiles.argument-ranges]]
index = 0
min = 0
max = 48

