[package]
name = "oer-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
oer-durable = { path = "../durable" }
oer-command-tree = { path = "../command-tree", features = ["clap"] }
oer-process = { path = "../process" }
oer-toolchain = { path = "../toolchain" }
oer-repo = { path = "../repo" }
cargo_metadata = "=0.23.1"
clap = { version = "=4.5.48", features = ["derive"] }
pulldown-cmark = { version = "=0.13.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
toml = "=1.1.4"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "tool"
platform = "host"
host-layer = "entry"
# The tests read the workflows, the hooks and the chip profiles.
inputs = [".github/workflows", ".claude/hooks", "platform/*/chip.toml"]
