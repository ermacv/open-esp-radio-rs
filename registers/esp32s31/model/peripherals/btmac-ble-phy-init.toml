[[peripherals.registers.register.fields]]
name = "BITS_0_31_OPAQUE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "DEVICE_TABLE_CONTROL"
description = "Device-table control word. Every device-table change rewrites the entry count in the low byte; one complete BLE PHY initialization branch sets bit 18. Both writers preserve the other bits, whose meaning remains unknown."
addressOffset = 0x470
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ENTRY_COUNT"
description = "Number of entries of the Controller-SRAM device table the filter accept list and the resolving list share, valid or not; hardware walks this many entries."
bitOffset = 0
bitWidth = 8

[[peripherals.registers.register.fields]]
name = "BIT_18_OPAQUE"
description = "The complete BLE PHY initialization body's selected branch sets this positional bit. No independent enable, allowlist, or directed-advertising hardware meaning is proven."
bitOffset = 18
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "DEVICE_TABLE_FIRST_ENTRY"
description = "Compressed word address of the first device-table entry. Every device-table change writes it completely with zero in bits 20..31."
addressOffset = 0x474
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "COMPRESSED_ADDRESS"
description = "Controller-SRAM byte address of the first entry shifted right by two, in the twenty-bit compressed link encoding."
bitOffset = 0
bitWidth = 20
[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFF

