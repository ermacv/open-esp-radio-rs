[package]
name = "oer-hil-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Analysis of HIL run bundles: measurement samples, statistics and comparison, run queries, performance baselines and the sealed views"

[dependencies]
oer-elf = { path = "../../../tools/elf" }
oer-hil-protocol = { path = "../../protocol", features = ["registry"] }
oer-durable = { path = "../../../tools/durable" }
oer-hil-observer = { path = "../../observer" }
oer-hil-run-bundle = { path = "../run-bundle" }
oer-hil-schema = { path = "../../schema" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
oer-hil-image-class = { path = "../image-class" }
oer-hil-run-bundle = { path = "../run-bundle", features = ["test-support"] }
roxmltree = "0.20"
tempfile = "3"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
platform = "host"
host-layer = "orchestration"
hil = "observation"
