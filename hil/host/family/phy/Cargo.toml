[package]
name = "oer-hil-family-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "PHY HIL workloads: the vendor-versus-production calibration cross-check on the board under test"
readme = "README.md"

[dependencies]
oer-esp-idf = { path = "../../../../tools/esp-idf" }
oer-device-port = { path = "../../../../tools/device/port" }
oer-device-reset = { path = "../../../../tools/device/reset" }
oer-hil-schema = { path = "../../../schema" }
oer-hil-scenario-catalog = { path = "../../scenario/catalog" }
oer-chip-profile = { path = "../../../../tools/chip-profile" }
oer-durable = { path = "../../../../tools/durable" }
oer-phy-calibration-capture = { path = "../../../../verification/phy-calibration-capture" }
oer-hil-lab = { path = "../../lab" }
oer-hil-link = { path = "../../link" }
oer-hil-protocol = { path = "../../../protocol", features = ["registry"] }
oer-hil-scenario = { path = "../../scenario" }
oer-hil-workload = { path = "../../workload" }
oer-image = { path = "../../../../tools/image" }
oer-process = { path = "../../../../tools/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
toml = "1.1"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hil"
