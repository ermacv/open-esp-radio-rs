schema = 4
id = "diagnostic-station-pause"
description = "Same-connection MAC/RX/IRQ pause after measured UDP delivery, followed by continued traffic"
repetitions = 1
image = "correctness"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "station", "pause", "udp", "ht40"]

[link]
phy = "ht40"

[workload]
kind = "udp"
direction = "tx"
