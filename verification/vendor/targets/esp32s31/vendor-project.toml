# Human-sized review surfaces over artifact-wide IR. Roots may use the stable
# SOURCE:SYMBOL shorthand; Blobray resolves the concrete archive identity
# and follows only calls present in the selected profiles.
[review]
output = "generated/findings/review-scopes.json"
publication-scopes = [
    "phy-init",
    "ble-standalone-runtime-hardware",
]

