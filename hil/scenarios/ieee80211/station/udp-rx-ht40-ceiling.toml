schema = 5
id = "udp-rx-ht40-ceiling"
description = "HT40 UDP host-to-station ceiling and 100 Mbit/s regression check"
role = "investigation"
repetitions = 3
tags = ["characterization", "udp", "station", "ht40", "split-core", "ceiling", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "correctness"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 16
payload_bytes = 1472
offer = { rx_bps = 130000000 }

[wifi.workload.criteria]
require_no_beacon_loss = true
minimum_rx_bps = 100000000
