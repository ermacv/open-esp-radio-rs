[package]
name = "open-esp-radio-esp32s31-wifi-embassy-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Upstream-compatible Embassy network bridge for the ESP32-S31 Wi-Fi radio"

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
open-esp-radio-embassy-net-compat = { path = "../../../../network/adapters/embassy/compat" }
open-esp-radio-esp32s31-wifi-embassy = { path = "../../../../runtime/embassy/esp32s31/ieee80211", default-features = false }
open-esp-radio-network = { path = "../../../../network/interface" }
open-esp-radio-wifi-embassy = { path = "../../ieee80211" }

[features]
default = []
diagnostics = ["open-esp-radio-esp32s31-wifi-embassy/diagnostics"]
tx-phase-telemetry = ["open-esp-radio-esp32s31-wifi-embassy/tx-phase-telemetry"]

[dev-dependencies]
open-esp-radio-esp32s31-wifi-sta = { path = "../../../../chips/esp32s31/ieee80211/sta" }
open-esp-radio-wifi-softmac = { path = "../../../../ieee80211/softmac" }
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true
