[workspace]
resolver = "3"
members = ["runtime", "trace-elf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform", default-features = false }
esp-hal = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform", default-features = false }
esp-phy = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform" }
esp-rtos = { git = "https://github.com/ermacv/esp-hal", branch = "esp32s31-async-platform" }
open-esp-radio = { path = "../../../driver/radio" }
open-esp-radio-esp32s31-wifi-esp-hal = { path = "../../../driver/integration/esp32s31/wifi-esp-hal" }
static_cell = "2.1.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s31 = { git = "https://github.com/ermacv/esp-pacs", rev = "3df8dc705" }
