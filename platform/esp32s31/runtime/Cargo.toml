[package]
name = "oer-esp32s31-platform-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
multicore = []
## After the record, call the image's `oer_platform_panic_hook`, which
## records more of its state without formatting, then reset.
panic-hook = []

[dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "zeroable_maybe_uninit"] }
oer-memory = { path = "../../../crates/memory" }
oer-esp32s31-platform-layout.workspace = true
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
oer-esp32s31-platform-board = { path = "../board" }
oer-interrupt-table = { path = "../../../crates/runtime/interrupt-table" }
oer-esp32s31-soc-esp-hal.workspace = true

[package.metadata.open-radio]
layer = "platform"
platform = "chip"
chip = "esp32s31"

[lints]
workspace = true
