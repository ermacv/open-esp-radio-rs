schema = 2

[[peripherals]]
name = "WIFI_MAC_POWER_INTERRUPT"
description = "WDEVPWR interrupt bank named by complete print_isr_regs. Complete hal_pwr_interrupt_get_event and hal_pwr_interrupt_clr_event independently prove the masked STATUS read and full-width CLEAR acknowledgement transaction. Complete TSF timer enable/disable leaves update the timer interrupt masks in ENABLE and clear stale events through CLEAR."
baseAddress = 0x2010D8B4

[[peripherals.registers]]

[peripherals.registers.register]
name = "ENABLE"
description = "WDEVPWR_ENABLE diagnostic snapshot and writable event mask. Complete guarded TSF-timer leaves independently identify bits 7 through 4, and complete TBTT interrupt leaves bits 3 through 0."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "TBTT_3"
description = "Enable the TSF-3 TBTT event."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TBTT_2"
description = "Enable the TSF-2 TBTT event."
bitOffset = 1
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TBTT_1"
description = "Enable the TSF-1 TBTT event."
bitOffset = 2
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TBTT_0"
description = "Enable the TSF-0 TBTT event. TSF 0 is the station TSF."
bitOffset = 3
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TSF_TIMER_3"
description = "Enable the guarded TSF timer-three event."
bitOffset = 4
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TSF_TIMER_2"
description = "Enable the guarded TSF timer-two event."
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TSF_TIMER_1"
description = "Enable the guarded TSF timer-one event."
bitOffset = 6
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TSF_TIMER_0"
description = "Enable the guarded TSF timer-zero event."
bitOffset = 7
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_8_31_OPAQUE"
description = "Enable bits whose event identities remain unknown."
bitOffset = 8
bitWidth = 24

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFF

