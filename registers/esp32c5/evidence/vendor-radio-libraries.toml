id = "C5_BLOB_LIBPHY_RF_INIT_LEAVES_3"
description = "ESP32-C5 libphy.a of espressif/esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, sha256 dbf33c418c8d408d4005c849d12a1432deea82e2e5e57de3c8ddf914d104fffb, member phy_i2c.o sha256 1ee0c045732cbeeeac156f350b8c2c0fd8138cabb169c549427e449104774dbb. phy_i2c_rc_cal_set(a, b, c) writes the masked fields (block 0x6B, register 0x11, bits 5:4) = a, (0x6B, 0x0F, 7:3) = b and (0x6B, 0x13, 5:2) = c. phy_filter_dcap_set writes (0x67, 0x1D, 3:2) = 0, (0x67, 5, 6) = 1, (0x67, 5, 3) = 1 and (0x67, 5, 5) = 1, then the whole bytes of block 0x67 registers 6, 8, 0xA, 0xC, 7, 9, 0xB, 0xD, 0xE, 0x10, 0x12, 0x14, 0xF, 0x11, 0x13 and 0x15 with phy_param bytes 0xF5, phy_get_data_sat(0xF7, 50, 10), 0xF5, 0xF7, 0xF6, phy_get_data_sat(0xF8, 60, 10), 0xF6, 0xF8, 0xFB, 0xFB, 0xF9, 0xF9, 0xFC, 0xFC, 0xFA and 0xFA. phy_i2c_pkdet_set writes (0x67, 0x1D, 7) = 1, (0x67, 0x1D, 6:4) = 4 and (0x67, 3, 6:4) = 4. phy_i2c_sar2_init_code(code) writes (0x69, 4, 3:0) = code >> 8 and then the byte code & 0xFF to block 0x69 register 3. Every masked field write ORs its value unmasked, so values wider than the field are outside the reviewed use."
