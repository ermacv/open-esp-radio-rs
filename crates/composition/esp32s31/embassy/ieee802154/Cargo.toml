[package]
name = "oer-esp32s31-ieee802154-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Product-level ESP32-S31 IEEE 802.15.4 composition over the shared radio arbiter for Embassy and esp-hal"

[dependencies]
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal" }
oer-esp32s31-ieee802154 = { path = "../../../../hardware/esp32s31/driver/ieee802154" }
oer-esp32s31-ieee802154-runtime = { path = "../../../../runtime/esp32s31/ieee802154" }
oer-esp32s31-phy = { path = "../../../../hardware/esp32s31/phy" }
oer-esp32s31-phy-runtime = { path = "../../../../runtime/esp32s31/phy" }

# Hardware composition is target-only.
[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "a228e85823b40e79c3a4e93fe006bed6c99dd2b8", default-features = false, features = ["esp32s31", "unstable"] }
oer-esp32s31-ieee802154-esp-hal = { path = "../../../../adapters/esp-hal/esp32s31/ieee802154", features = ["esp32s31"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
scope = "production"
layer = "composition"
platform = "chip"
chip = "esp32s31"
