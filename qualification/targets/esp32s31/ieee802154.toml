  { path = "driver/chips/esp32s31/phy/src/phy_client.rs", token = "immediate_tracking_preserves_short_circuit_and_refresh_sample_order" },
  { path = "driver/chips/esp32s31/phy/src/phy_client.rs", token = "periodic_tracking_samples_each_active_class_once_without_due_samples" },
  { path = "driver/chips/esp32s31/phy/src/phy_client.rs", token = "pending_request_runs_outer_tracking_before_owner_recovery" },
  { path = "driver/chips/esp32s31/phy/src/phy_param_tracking.rs", token = "ieee802154_only_preserves_exact_child_order" },
  { path = "driver/chips/esp32s31/phy/src/phy_param_tracking.rs", token = "guard_exits_critical_section_without_running_children" },
  { path = "driver/chips/esp32s31/phy/src/phy_param_tracking.rs", token = "temperature_to_power_matches_all_signed_16_bit_deltas" },
  { path = "driver/chips/esp32s31/phy/src/phy_math.rs", token = "signed_saturation_preserves_rom_comparison_order" },
  { path = "driver/chips/esp32s31/phy/src/phy_power_tracking.rs", token = "bluetooth_ieee802154_update_owns_bbpll_and_gain_order" },
  { path = "driver/chips/esp32s31/phy/src/phy_power_tracking.rs", token = "disabled_or_equal_gain_base_commits_nothing" },
  { path = "driver/chips/esp32s31/phy/src/phy_state.rs", token = "periodic_gain_tracking_commits_only_terminal_runtime_outcomes" },
