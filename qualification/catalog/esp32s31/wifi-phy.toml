[[sections]]
id = "phy-protocol-consumer-composition"
domain = "phy"
title = "Protocol consumer composition"
source-document = "crates/hardware/esp32s31/phy/FEATURES.md"
overview = "Statuses here apply to protocol composition, independently of primitive status.\n`PARTIAL` can mean an available target entry point without a public operational\ncaller. Shared registration does not prove that every calibration branch is\nselected, every channel is usable or all radio clients can run concurrently.\n\n\nThe relevant callers are [Wi-Fi cold start](../driver/ieee80211/src/cold_start.rs),\n[Bluetooth PHY setup](../driver/bluetooth/src/phy.rs),\n[the shared PHY domain](src/concurrent.rs),\n[the Wi-Fi PHY client](src/wifi_client.rs),\n[the Bluetooth PHY client](src/bluetooth_client.rs) and\n[the IEEE 802.15.4 PHY client](src/ieee802154_client.rs).\nBluetooth and IEEE 802.15.4 join the shared PHY domain and BTBB baseband as\narbiter clients; membership alone is not RF readiness."
packages = ["oer-esp32s31-bluetooth", "oer-esp32s31-ieee80211", "oer-esp32s31-phy"]

[[sections]]
id = "phy-lifecycle-boundaries"
domain = "phy"
title = "Lifecycle boundaries"
source-document = "crates/hardware/esp32s31/phy/FEATURES.md"
overview = ""

[[sections]]
id = "phy-qualification-boundary"
domain = "phy"
title = "Qualification boundary"
source-document = "crates/hardware/esp32s31/phy/FEATURES.md"
overview = "There is no standalone PHY qualification target, and no radio program carries\nPHY readiness requirements since the orchestration went in #770 (tag\n`legacy-radio-2026-10-16`). This inventory promotes no proof state, and no\ncomposition currently registers the PHY for any radio.\n\nPLL lock, channel correctness, calibrated TX power, RX sensitivity after retune,\nand calibration stability across sleep/wake require their own hardware evidence.\nA completed source transition or protocol cold start cannot substitute for those\nmeasurements. Broad RF qualification remains a separate readiness requirement."
documents = ["qualification/catalog/esp32s31/wifi-phy.toml"]

