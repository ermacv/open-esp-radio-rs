[package]
name = "oer-esp32s31-example-thread"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
oer-esp32s31-platform-runtime = { path = "../../../platform/esp32s31/runtime" }
embassy-executor = { version = "0.10.0", default-features = false }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "9b59fce828af156cef0521a4b5c0f311efcfb1e8", default-features = false, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
esp-println = { git = "https://github.com/ermacv/esp-hal", rev = "9b59fce828af156cef0521a4b5c0f311efcfb1e8", default-features = false, features = ["auto", "esp32s31", "log-04"] }
log = "0.4"
oer = { package = "open-esp-radio", path = "../../../crates/oer", default-features = false, features = ["openthread"] }
oer-esp32s31-executor-embassy = { path = "../../../crates/adapters/embassy/esp32s31/executor", features = ["esp32s31"] }
openthread = { git = "https://github.com/ermacv/openthread", rev = "5173f96654a2f317e29fb7d8e69fb8a887607f6d", default-features = false, features = ["isupper", "csl", "link-metrics-subject", "link-metrics-initiator", "time-sync"] }
static_cell = "2.1.1"
# The C library functions OpenThread links beyond what the Rust core provides.
tinyrlibc = { version = "0.5", default-features = false, features = ["utoa", "strtoul"] }

[build-dependencies]
oer-esp32s31-platform-layout = { path = "../../../platform/esp32s31/layout", features = ["build"] }

[package.metadata.open-radio]
layer = "application"
platform = "chip"
chip = "esp32s31"

[lints]
workspace = true
