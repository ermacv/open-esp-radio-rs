[package]
name = "oer-qualification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Fail-closed qualification evaluator for the open radio driver"

[dependencies]
oer-chip-profile = { path = "../../tools/chip-profile" }
oer-command-tree = { path = "../../tools/command-tree" }
oer-hil-schema = { path = "../../hil/schema" }
oer-tidy = { path = "../../tools/tidy" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
toml = "=1.1.4"
toml_edit = { version = "=0.25.13", features = ["serde"] }
tar = { version = "0.4", default-features = false }

[dev-dependencies]
oer-hil-schema = { path = "../../hil/schema", features = ["producer"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
layer = "qualification"
platform = "host"
# The tests read every catalog, program and review, and resolve image
# sources with `cargo tree` over the HIL targets' manifests.
inputs = ["qualification", "hil/targets/**/Cargo.toml"]
