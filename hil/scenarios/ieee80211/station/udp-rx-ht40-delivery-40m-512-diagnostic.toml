schema = 5
id = "udp-rx-ht40-delivery-40m-512-diagnostic"
description = "HT40 RX delivery-boundary diagnostic at 40 Mbit/s with 512-byte UDP payloads"
role = "investigation"
tags = ["diagnostic", "udp", "station", "rx", "ht40", "split-core", "packet-rate", "delivery", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-rx-delivery"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 512
offer = { rx_bps = 40000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true
independent_air_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 30000000
maximum_idle_channel_utilization_255 = 64
