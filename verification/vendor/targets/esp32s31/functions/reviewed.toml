# Sparse review overlay: add only reviewed or ignored functions, contexts, fields, and logical types.
# All omitted generated observations remain part of the computed unreviewed backlog.

[[functions]]
profile = "libpp-all"
source = "libpp"
identity = "libpp::wdev_record_rx_linked_list"
status = "reviewed"
name = "record_rx_linked_list_snapshot"
role = "diagnostic.rx-descriptor-snapshot"
summary = "Snapshots RX descriptor and MMIO state into the diagnostic ring consumed by wdev_dump_rx_linked_list."
accept-incomplete = true

# The linked vendor image exports one 508-byte `phy_param` object. This type
# names only exact machine-level observations that are also classified by the
# executable semantic harness. It is evidence about the vendor layout, not a
# claim that the Rust `PhyState` has the same representation.
[[types]]
id = "vendor-phy-parameter-image"
name = "VendorPhyParameterImage"
description = "Reviewed projections of the linked vendor phy_param state and configuration image."

[[types.bindings]]
profile = "archive-all"
source = "archive"
name = "linked_phy_param"
kind = "global"
symbol = "phy_param"

