schema = 5
id = "diagnostic-udp-rx-ht40-single-core-task-residence"
description = "Task residence of the HT40 saturated RX path with the radio, RX protocol and IP stack on CPU0 alone"
role = "investigation"
tags = ["diagnostic", "udp", "station", "rx", "ht40", "single-core", "task-poll", "rx-residence-saturated", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-task-residence"

[wifi.datapath]
placement = "single-core"

[wifi.workload]
kind = "station-udp"
link = { phy = "ht40" }
duration_seconds = 12
payload_bytes = 1472
offer = { rx_bps = 140000000 }

[wifi.workload.observation]
openwrt_tx_monitor = true

[wifi.workload.criteria]
minimum_rx_bps = 10000000
