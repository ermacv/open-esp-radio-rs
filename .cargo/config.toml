[alias]
# Every alias runs its tool quietly: Cargo's own progress lines stay out of
# the tool's output, and a compile error still prints.
registers = "run --quiet --profile blobray -p oer-register-tool --"
xtask = "run --quiet -p oer-xtask --"
# The dev kit: build, flash and monitor the examples on attached boards.
fw = "run --quiet -p oer-fw --"
# The shared stand: queue, leases, boards, owners, host setup, fixtures.
stand = "run --quiet -p oer-stand --"
hil = "run --quiet -p oer-hil-cli --"
qualification = "run --quiet --profile qualification -p oer-qualification --"
blobray = "run --quiet --manifest-path tools/blobray/Cargo.toml --profile blobray -p blobray-cli --bin blobray --"
# Vendor verification, its own workspace: pins, provenance, the typed
# scenarios (`cargo verification scenario`), evidence shards and probes.
verification = "run --quiet --manifest-path verification/Cargo.toml --profile verification -p oer-verification-cli --bin verification --"
# The repository model of oer-tidy: `cargo tidy check`, `workspaces`,
# `chips` and `fetch`. Its few dependencies rarely change, so it still
# builds from its own workspace, without firmware Git dependencies, after
# a pull that changed a firmware pin or what xtask needs.
tidy = "run --quiet --manifest-path tools/tidy/Cargo.toml -p oer-tidy --"

[net]
# GitHub access in the lab uses HTTPS credentials managed by Git. Delegate git
# dependencies to the CLI so Cargo shares the configured credential helper.
git-fetch-with-cli = true
# Builds resolve from the lock files and the local cache only. Online, every
# Cargo command re-checks each git dependency under the host-wide package
# cache lock (about 12 s), and parallel builds of all checkouts queue behind
# it. `cargo tidy fetch` downloads what changed lock files need, and `cargo
# xtask lock` updates the locks online; the image builds fetch when something
# is missing.
offline = true

[env]
# Cargo reads this file for every workspace below the repository root.
# Staged images keep esp-hal's PMP region setup off: its single
# "read/write, no execute" TOR region from `_data_start` to `_noinit_end`
# would span stage two's PSRAM code between SRAM data and PSRAM noinit.
ESP_HAL_CONFIG_ENABLE_PMP = "false"
