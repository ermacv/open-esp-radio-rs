section = "whole-radio-active-operation-power-saving-and-shutdown"
title = "Cold reconstruction after shutdown"
status = "implemented"
level = "composed-product"
scope-and-limitations = "The idle control path invokes the source-owned shutdown and `restart_esp32s31_radio`, which captures the final post-tracking cache and feeds it directly into validated cold registration. Repeated hardware lifecycle evidence covers this Wi-Fi boundary."
source-paths = []

