schema = 2

[[peripherals]]
name = "PHY_AGC_ORACLE"
description = """
OPAQUE PHY AGC,
        PBus-pulse, antenna, RX-compensation, DC-memory, post-initialization
        and 11b-control registers recovered from complete, finite rev0
        ROM/blob bodies. One physical register has one identity even when
        independent bodies prove different fields. Names describe their
        proven operation role, not an unevidenced electrical identity."""
baseAddress = 0x20100000

[[peripherals.registers]]

[peripherals.registers.register]
name = "AGC_PARAMETER_CONTROL"
description = "Complete phy_agc_reg_init performs two fresh-read parameter-derived field replacements."
addressOffset = 0x8BC
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "PARAMETER_121_UNKNOWN"
description = "First update writes parameter byte 0x121 into bits 11:4."
bitOffset = 4
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "PARAMETER_120_OFFSET_UNKNOWN"
description = "Second update writes the low eight bits of parameter byte 0x120 plus 0x50 into bits 19:12."
bitOffset = 12
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "AGC_SHARED_CONTROL"
description = "Shared word updated by complete phy_agc_reg_init, phy_enable_agc, phy_pbus_force_mode, phy_force_rx_gain, phy_set_rx_comp_new, and the final limit tail of phy_set_rx_gain_table."
addressOffset = 0x702C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "RX_COMPENSATION_LOW_UNKNOWN"
description = "Complete phy_set_rx_comp_new writes 0xed into bits 7:0."
bitOffset = 0
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "RX_GAIN_INDEX_UNKNOWN"
description = "Bits 14:8 receive parameter byte 0x121 during AGC initialization and the final Wi-Fi RX gain index after table publication."
bitOffset = 8
bitWidth = 7

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x7F

[[peripherals.registers.register.fields]]
name = "PULSE_UNKNOWN"
description = "Bit 23 is pulsed by complete phy_enable_agc and by the delayed tail of phy_pbus_force_mode; complete phy_force_rx_gain replaces it with the caller low bit."
bitOffset = 23
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "CONTROL_HIGH_UNKNOWN"
description = "Complete phy_agc_reg_init and the delayed phy_pbus_force_mode tail write 0x32 into bits 31:24 before pulsing bit 23; complete phy_force_rx_gain retains its second argument to this byte without rejecting any representable image."
bitOffset = 24
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

