schema = 4
id = "diagnostic-ap-probe-load"
description = "AP UDP progress under single, fixed-MAC and rotating-MAC probe request load"
repetitions = 1
image = "diagnostic-task-poll"
isolation = "reset"
data_plane = "split-radio-network"
tags = ["diagnostic", "access-point", "multi-client", "ht40", "aggregation"]

[link]
phy = "ht40"

[workload]
kind = "access-point"
probe_load = true
cycles = 1
boots = 1
timeout_seconds = 150
client = "laptop"

[workload.traffic]
kind = "udp-multi-client"
direction = "tx"
duration_seconds = 12
payload_bytes = 1472
tx_rate_bps_per_flow = 130000000
secondary_tx_rate_bps = 235520
secondary_tx_pacing_group_datagrams = 1

[criteria]
exact_delivery = false
minimum_bps_per_flow = 1
minimum_concurrent_ap_clients = 2
minimum_tx_bps = 1
minimum_secondary_tx_datagrams = 200
maximum_secondary_tx_interarrival_ms = 250
