schema = 5
id = "access-point-single-client-ceiling-rx-core0-cycles"
description = "Single-client AP HT40 UDP receive ceiling with intrusive Core0 AP phase accounting"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "network", "single-client", "ht40", "split-core", "ceiling", "rx", "core0", "phase-accounting", "air-strict"]
unsupported = "The ESP32-S31 Wi-Fi roles' orchestration was removed with the old station path; the roles return on the lower-MAC port in step 2 (https://github.com/ermacv/open-esp-radio-rs/issues/563)"

[wifi]
image = "diagnostic-core0-rx-cycles"

[wifi.datapath]
rx_continuation = "adaptive-probe-diagnostic"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 12
payload_bytes = 1472
offer = { rx_bps = 130000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 85000000
