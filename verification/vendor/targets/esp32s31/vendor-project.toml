sources = ["btbb"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/btbb-all.ir"

# Canonical derived view of the standalone BLE controller boundary.  The
# authenticated archives remain the observed source; this linked unit exists
# to preserve cross-archive call identity and ordering for semantic analysis.
[[analysis.ir]]
id = "ble-controller-all"
sources = ["ble-controller"]
roots = "all"
include-reachable = true
entry-contract = "none"
output = "generated/findings/ble-controller-all.ir"

# Diagnostic bodies are dead-stripped from the operational linked controller.
# Analyze their authenticated archive members directly instead of retaining
# debug code in the controller image or rebuilding an oracle application.
[[analysis.ir]]
id = "ble-phy-state-diagnostic"
sources = ["ble-diagnostics"]
roots = "symbol-prefix"
symbol-prefix = "r_ble_phy_hw_state_dump"
include-reachable = false
entry-contract = "none"
output = "generated/findings/ble-phy-state-diagnostic.ir"

[[analysis.ir]]
id = "ble-coex-register-diagnostic"
sources = ["ble-diagnostics"]
roots = "symbol-prefix"
symbol-prefix = "r_sym_ble_uPvbSnU52H5Jo6zGRBEO"
include-reachable = false
entry-contract = "none"
output = "generated/findings/ble-coex-register-diagnostic.ir"

# The public DTM RSSI getter and its current internal target are dead-stripped
# from the operational controller image. Keep their exact archive call chain
# as generated evidence; the reviewed pack separately owns the signed load.
[[analysis.ir]]
id = "ble-dtm-rssi"
sources = ["ble-diagnostics"]
roots = "symbol-prefix"
symbol-prefix = "esp_ble_get_dtm_rx_rssi"
include-reachable = true
entry-contract = "none"
