[[items]]
id = "bluetooth-connect-ind-decoding-and-admission"
section = "bluetooth-le-roles-connections-reliability"
title = "`CONNECT_IND` decoding and admission"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "[Portable connection policy](../../../../protocols/bluetooth/le/ll/src/connection.rs) validates addresses, Access Address, timing, channel map, hop and other request fields; advertiser admission checks the local address and allowed channel-selection algorithm. This row covers admission only. The controller core and HCI command service that admitted connections with it were removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-first-peripheral-connection-window"
section = "bluetooth-le-roles-connections-reliability"
title = "First peripheral connection window"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "[Peripheral timing](../../../../protocols/bluetooth/le/controller/src/timing.rs) computes the first event's listen window across the whole transmit window of the connection indication, widened by the 16-microsecond first-event guard, and the vendor's minimum LE 1M event duration after it. The controller core that planned connections with it was removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-recurring-peripheral-events"
section = "bluetooth-le-roles-connections-reliability"
title = "Recurring peripheral events"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "[Peripheral timing](../../../../protocols/bluetooth/le/controller/src/timing.rs) computes each later event at the anchor the last received packet fixed, with clock-drift widening, bounded by the connection interval. The controller core that planned each event when the previous one ended was removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-channel-selection-algorithm-1"
section = "bluetooth-le-roles-connections-reliability"
title = "Channel Selection Algorithm #1"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [Link Layer](../../../../protocols/bluetooth/le/ll/src/connection.rs) selects a connection event's data channel by CSA#1 unless both devices negotiated CSA#2. No controller runs connection events since #770 (tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-channel-selection-algorithm-2"
section = "bluetooth-le-roles-connections-reliability"
title = "Channel Selection Algorithm #2"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [Link Layer](../../../../protocols/bluetooth/le/ll/src/connection.rs) encodes ChSel for connectable advertising, `CONNECT_IND` admission selects CSA#2 when both devices set it, and its channel selection follows CSA#2. No controller runs connection events since #770 (tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-sleep-clock-accuracy-window-widening"
section = "bluetooth-le-roles-connections-reliability"
title = "Sleep Clock Accuracy / window widening"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "[Peripheral timing](../../../../protocols/bluetooth/le/controller/src/timing.rs) adds the peer's sleep-clock accuracy and the local bound over the time since the last received anchor, plus the 16-microsecond jitter. The controller core that applied it was removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-ll-data-pdu-rx"
section = "bluetooth-le-roles-connections-reliability"
title = "LL Data PDU RX"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "[Authenticated receive](../../../../protocols/bluetooth/le/controller/src/receive.rs) authenticates an encrypted data PDU first and classifies it for the control procedures or as ACL data that keeps the L2CAP start and continuation boundaries. The controller core that dispatched it and delivered ACL data to the Host was removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-llcp-framework"
section = "bluetooth-le-roles-connections-reliability"
title = "LLCP framework"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "The [control procedures](../../../../protocols/bluetooth/le/ll/src/control.rs) answer feature, version, LE Ping and Data Length requests, decode Connection Update and Channel Map Update with their instants and answer other procedures with `LL_UNKNOWN_RSP`. PHY Update, Connection Parameters Request and later procedures are absent. The controller core and HCI command service that ran it were removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-connection-update-channel-map-update"
section = "bluetooth-le-roles-connections-reliability"
title = "Connection Update / Channel Map Update"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [Link Layer](../../../../protocols/bluetooth/le/ll/src/connection.rs) applies a central Connection Update and Channel Map Update at their exact instant and ends the connection on a passed instant. The controller core that waited for the event end and reported LE Connection Update Complete was removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-phy-update"
section = "bluetooth-le-roles-connections-reliability"
title = "PHY Update"
status = "absent"
level = "composed-product"
scope-and-limitations = "No PHY Update procedure exists; `LL_PHY_REQ` is answered with `LL_UNKNOWN_RSP` and the connection stays on LE 1M."

[[items]]
id = "bluetooth-data-length-extension-data-length-update"
section = "bluetooth-le-roles-connections-reliability"
title = "Data Length Extension / Data Length Update"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The [Link Layer](../../../../protocols/bluetooth/le/ll/src/data_length.rs) answers and starts the Data Length Update on LE 1M up to 251 octets and 2120 us. The controller core that fragmented Host data by the effective transmit length, served HCI LE Set Data Length, Read and Write Suggested Default Data Length and Read Maximum Data Length and reported LE Data Length Change was removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-feature-exchange"
section = "bluetooth-le-roles-connections-reliability"
title = "Feature Exchange"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The peripheral [control procedures](../../../../protocols/bluetooth/le/ll/src/control.rs) answer `LL_FEATURE_REQ` and build the request and result of LE Read Remote Features. The controller core and HCI command service that served the HCI command were removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-version-exchange"
section = "bluetooth-le-roles-connections-reliability"
title = "Version Exchange"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The peripheral [control procedures](../../../../protocols/bluetooth/le/ll/src/control.rs) answer `LL_VERSION_IND` once with the configured local identity and build the result of Read Remote Version Information. The controller core and HCI command service that served the HCI command were removed (#770, tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-le-ping"
section = "bluetooth-le-roles-connections-reliability"
title = "LE Ping"
status = "implemented"
level = "lower-primitive"
scope-and-limitations = "The peripheral [control procedures](../../../../protocols/bluetooth/le/ll/src/control.rs) answer `LL_PING_REQ` with `LL_PING_RSP`. No controller runs connections since #770 (tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

[[items]]
id = "bluetooth-adaptive-frequency-hopping-channel-assessment"
section = "bluetooth-le-roles-connections-reliability"
title = "Adaptive Frequency Hopping / channel assessment"
status = "partial"
level = "lower-primitive"
scope-and-limitations = "Channel maps from the connection indication and Channel Map Updates select the [Link Layer](../../../../protocols/bluetooth/le/ll/src/connection.rs) hopping channels. Local channel assessment and Controller-initiated map generation are absent. No controller runs connections since #770 (tag `legacy-radio-2026-10-16`); #773 rebuilds the Bluetooth orchestration."

